material.buffaloleather.desc=Das Leder der Wüstenbüffel der Surmakar eigent isch hervorragend für die Herstellung der unterschiedlichsten Gegenstände, von Kleidungen über Rüstungen bis hin zu Schilden. Durch die Verarbeitung kann das ohnehin schön zähe Leder noch einmal widerstandsfähiger gemacht werden.
material.buffaloleather.effect=Gegenstände aus Büffelleder haben eine um 1 Pumkt erhöhte Härte.
material.kulaho_schuppe.desc=Die Schuterschuppen der Kulaho.Echsen sind so hart, dass sie sich hervorragend als grundmaterial für Rüstungen und Schilde eigenen. Ihre Steifheit machr derartige Rüstungen jedoch auch etwas unbeweglicher.
material.kulaho_schuppe.effect=Verfügt eine Rüstung aus Kuhalo-Schuppen über das Merkaml Standfstigkeit, steigt dessen Bonus um 1 weiteren Punkt, die Behinderung der Rüstung steigt allerdings um 1. eine Aktive Abwehr mit einem Schild aus Kuhalo-Leder erhält einen Bonus von 2 Punkten, wenn es mit der Meisterschaft Verteidiger für andere eingesetzt wird
material.stonestiltsegg.desc=Um das stark ätzende Gebräu aus den Blüten der seltenen Feuerzahns zu transportieren, nutzen die Gnome aus der Oase Ma'ab Jadar die steinharten Eier der Steinstelzen (s. 42) als Behälter. Die eier sind nicht nur groß sondern auch aus einem harten sehr säureresistenten Material, sodass manche Alchimisten Schutzhandschuhe oder Schürzen mit Splittern dieser Schalen besetzen.
material.stonestiltsegg.effect=Steinstelzeneierschalen verfügen über eine Härte von 8 gegen Säure aller Art. Werden sie verwendet um beispielsweiße Schutzkleidung damit zu besetzen, erhält diese eine Schadensreduktion von 3 gegen Säure.
