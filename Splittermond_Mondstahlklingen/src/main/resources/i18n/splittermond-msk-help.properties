mastership.acrobatics.evade1.desc=Die Verteidigung des Abenteurers erhöht sich um 2 Punkte, wenn er weder Rüstungen noch Schilde oder Parierwaffen trägt, er sich des Angriffs bewusst ist und ihm ausreichend Platz zur Verfügung steht. Dieser Bonus reduziert sich, je nachdem, wie stark der Abenteurer belastet ist. Trägt er Ausrüstung mit einer Gesamt-Behinderung von maximal 1 und einem Tick-Zuschlag von 0, reduziert sich der Bonus auf 1 Punkt. Belastet ihn seine Ausrüstung noch stärker, kommt diese Meisterschaft nicht zum Tragen.\nBei der Berechnung von Gesamt-Behinderung und Tick-Zuschlag werden nur die Werte der Ausrüstung sowie etwaige Verbesserungen durch hohe Gegenstandsqualität betrachtet. Andere Modifikationen, zum Beispiel Verringerungen von Behinderung oder Tick-Zuschlag aus Meisterschaften, Zaubern oder einer Personalisierung, kommen ebenso wenig zum Tragen wie temporäre Erhöhungen, zum Beispiel aus Zuständen.
mastership.acrobatics.feint1.desc=Bei einer erfolgreichen Aktiven Abwehr mit der Fertigkeit Akrobatik erhält der Abenteurer 1 zusätzlichen Erfolgsgrad, sofern er ausreichend Platz zur Verfügung hat. Diese Meisterschaft kommt nur zum Tragen, wenn Rüstungen, Schilde, Parierwa\uFB00en und sonstige Ausrüstung des Abenteurers eine Gesamt-Behinderung von 1 und einen Tick-Zuschlag von 0 nicht überschreiten.\nBei der Berechnung von Gesamt-Behinderung und Tick-Zuschlag werden nur die Werte der Ausrüstung sowie etwaige Verbesserungen durch hohe Gegenstandsqualität betrachtet. Andere Modi\uFB01kationen, zum Beispiel Verringerungen von Behinderung oder Tick-Zuschlag aus Meisterschaften, Zaubern oder einer Personalisierung, kommen ebenso wenig zum Tragen wie temporäre Erhöhungen, zum Beispiel aus Zuständen.
mastership.acrobatics.evade2.desc=Die Verteidigung des Abenteurers erhöht sich um 4 Punkte, wenn er weder Rüstungen noch Schilde oder Parierwaffen trägt, er sich des Angriffs bewusst ist und ihm ausreichend Platz zur Verfügung steht. Dieser Bonus reduziert sich, je nachdem, wie stark der Abenteurer belastet ist. Trägt er Ausrüstung mit einer Gesamt-Behinderung von maximal 0 und einem Tick-Zuschlag von 0, reduziert sich der Bonus auf 2 Punkte. Belastet ihn seine Ausrüstung noch stärker, kommt diese Meisterschaft nicht zum Tragen.\nBei der Berechnung von Gesamt-Behinderung und Tick-Zuschlag werden nur die Werte der Ausrüstung sowie etwaige Verbesserungen durch hohe Gegenstandsqualität betrachtet. Andere Modifikationen, zum Beispiel Verringerungen von Behinderung oder Tick-Zuschlag aus Meisterschaften, Zaubern oder einer Personalisierung, kommen ebenso wenig zum Tragen wie temporäre Erhöhungen, zum Beispiel aus Zuständen.
mastership.acrobatics.feint2.desc=Der Bonus aus Antäuschen I steigt auf 2 Erfolgsgrade, sofern er ausreichend Platz zur Verfügung hat. Diese Meisterschaft kommt nur zum Tragen, wenn Rüstungen, Schilde, Parierwaffen und sonstige Ausrüstung des Abenteurers eine Gesamt-Behinderung von 0 und einen Tick-Zuschlag von 0 nicht überschreiten. Bei der Berechnung von Gesamt-Behinderung und Tick-Zuschlag werden nur die Werte der Ausrüstung sowie etwaige Verbesserungen durch hohe Gegenstandsqualität betrachtet.\nAndere Modi\uFB01kationen, zum Beispiel Verringerungen von Behinderung oder Tick-Zuschlag aus Meisterschaften, Zaubern oder einer Personalisierung, kommen ebenso wenig zum Tragen wie temporäre Erhöhungen, zum Beispiel aus Zuständen.
mastership.acrobatics.agileinarmor.desc=Trägt der Abenteurer Rüstungen, Schilde oder Parierwa\uFB00en und erhält dennoch einen Verteidigung-Bonus aus den Meisterschaften Ausweichen I oder Ausweichen II, erhöht sich dieser Bonus um insgesamt 1 Punkt.
mastership.acrobatics.evade3.desc=Die Verteidigung des Abenteurers erhöht sich um 6 Punkte, wenn er sich des Angriffs bewusst ist und ihm ausreichend Platz zur Verfügung steht. Trägt der Abenteurer irgendwelche Rüstungen, Schilde oder Parierwaffen, kommt diese Meisterschaft nicht zum Tragen. Dasselbe gilt für sonstige Ausrüstung mit Einfluss auf Behinderung oder Tick-Zuschlag.
mastership.acrobatics.feint3.desc=Der Bonus aus Antäuschen I steigt auf 3 Erfolgsgrade, sofern er ausreichend Platz zur Verfügung hat. Trägt der Abenteurer irgendwelche Rüstungen, Schilde oder Parierwaffen, kommt diese Meisterschaft nicht zum Tragen. Dasselbe gilt für sonstige Ausrüstung mit Ein\uFB02uss auf Behinderung oder TickZuschlag. Bei der Berechnung von Gesamt-Behinderung und TickZuschlag werden nur die Werte der Ausrüstung sowie etwaige Verbesserungen durch hohe Gegenstandsqualität betrachtet. Andere Modi\uFB01kationen, zum Beispiel Verringerungen von Behinderung oder Tick-Zuschlag aus Meisterschaften, Zaubern oder einer Personalisierung, kommen ebenso wenig zum Tragen wie temporäre Erhöhungen, zum Beispiel aus Zuständen.
mastership.alchemy.materialmaster.desc=Der Handwerker ist in der Lage, besondere Materialien so zu verarbeiten, dass die Kunstfertigkeit gewöhnlichen Handwerks weit übertro\uFB00en wird. Ein Handwerker mit dieser Meisterschaft kann mit besonderen Materialien die maximal mögliche Gegenstandsqualität erhöhen: Die Gegenstandsqualität, die er maximal erzielen kann, erhöht sich um die halbe Materialqualität (echt gerundet). Hierzu muss er natürlich in der Lage sein, das entsprechende Material zu verarbeiten, benötigt also gegebenenfalls die passenden Meisterschaften (siehe MSK 94). Der Handwerker ist außerdem in der Lage, solche Gegenstände zu reparieren.\nDie Meisterschaft muss für einen bestimmten Schwerpunkt der jeweiligen Fertigkeit gewählt werden und gilt nur im Zusammenhang mit diesem. Die Meisterschaft ist mehrfach wählbar, jeweils für unterschiedliche Schwerpunkte
mastership.clscraft.materialmaster.desc=Der Handwerker ist in der Lage, besondere Materialien so zu verarbeiten, dass die Kunstfertigkeit gewöhnlichen Handwerks weit übertro\uFB00en wird. Ein Handwerker mit dieser Meisterschaft kann mit besonderen Materialien die maximal mögliche Gegenstandsqualität erhöhen: Die Gegenstandsqualität, die er maximal erzielen kann, erhöht sich um die halbe Materialqualität (echt gerundet). Hierzu muss er natürlich in der Lage sein, das entsprechende Material zu verarbeiten, benötigt also gegebenenfalls die passenden Meisterschaften (siehe MSK 94). Der Handwerker ist außerdem in der Lage, solche Gegenstände zu reparieren.\nDie Meisterschaft muss für einen bestimmten Schwerpunkt der jeweiligen Fertigkeit gewählt werden und gilt nur im Zusammenhang mit diesem. Die Meisterschaft ist mehrfach wählbar, jeweils für unterschiedliche Schwerpunkte
mastership.clscraft.frommaster.desc=Die Verbesserung Fertigkeitsbonus lässt sich weitere drei Male auf einen Gegenstand legen (bis zu einem maximalen Bonus von +6). Die zusätzlichen Anwendungen dieser Verbesserung kosten nur noch 1 Qualitätsstufe, nicht mehr 2 Stufen wie die ersten drei.
mastership.craftmanship.materialmaster.desc=Der Handwerker ist in der Lage, besondere Materialien so zu verarbeiten, dass die Kunstfertigkeit gewöhnlichen Handwerks weit übertro\uFB00en wird. Ein Handwerker mit dieser Meisterschaft kann mit besonderen Materialien die maximal mögliche Gegenstandsqualität erhöhen: Die Gegenstandsqualität, die er maximal erzielen kann, erhöht sich um die halbe Materialqualität (echt gerundet). Hierzu muss er natürlich in der Lage sein, das entsprechende Material zu verarbeiten, benötigt also gegebenenfalls die passenden Meisterschaften (siehe MSK 94). Der Handwerker ist außerdem in der Lage, solche Gegenstände zu reparieren.\nDie Meisterschaft muss für einen bestimmten Schwerpunkt der jeweiligen Fertigkeit gewählt werden und gilt nur im Zusammenhang mit diesem. Die Meisterschaft ist mehrfach wählbar, jeweils für unterschiedliche Schwerpunkte
mastership.craftmanship.efweaponforge.desc=Der Handwerker ist besonders geübt darin, schwerere Wa\uFB00en zu verbessern. Fertigt er eine Wa\uFB00e mit einer unmodi\uFB01zierten WGS von mindestens 7, erhöht sich die Gegenstandsqualität, die er maximal erreichen kann, um eine zusätzliche Stufe. Hat die Wa\uFB00e eine unmodi\uFB01zierte WGS von mindestens 10, erhöht sich die maximale Gegenstandsqualität sogar um insgesamt zwei zusätzliche Stufen. Die Meisterschaft muss für einen bestimmten Schwerpunkt gewählt werden und gilt nur im Zusammenhang mit diesem.\nDie Meisterschaft ist mehrfach wählbar, jeweils für unterschiedliche Schwerpunkte.
mastership.craftmanship.frommaster.desc=Die Verbesserung Fertigkeitsbonus lässt sich weitere drei Male auf einen Gegenstand legen (bis zu einem maximalen Bonus von +6). Die zusätzlichen Anwendungen dieser Verbesserung kosten nur noch 1 Qualitätsstufe, nicht mehr 2 Stufen wie die ersten drei.

spell.improvecraft.descr=Der Zauberer verbessert die Ergebnisse seiner handwerklichen Arbeit. Er erhält einen zusätzlichen Erfolgsgrad bei gelungenen Proben auf eine bei Auslösen des Zaubers gewählte Handwerksfertigkeit (Alchemie, Edelhandwerk oder Handwerk), die er während der Wirkungsdauer ausführt. Dieser Zauber ist nicht mit anderen Zaubern kombinierbar, die ebenfalls den Typus Handwerk stärken besitzen.
spell.improvecraft.enhancedescr=Der Handwerker erhält insgesamt 2 zusätzliche EG.
spell.helpinghand.descr=Der Zauberer erschafft eine helfende Hand, die ihn bei seinen handwerklichen Tätigkeiten nach seinem Willen unterstützt. Die helfende Hand gilt als leicht positiver Umstand (Bonus in Höhe von 2 Punkten) für Proben auf die Fertigkeiten Alchemie, Edelhandwerk, Handwerk, Heilkunde und Schlösser und Fallen.
spell.helpinghand.enhancedescr=Die helfende Hand gilt als stark positiver Umstand (Bonus in Höhe von 4 Punkten).
spell.improvewoodwork.descr=Der Zauberer verbessert die Ergebnisse seiner handwerklichen Arbeit. Er erhält einen zusätzlichen Erfolgsgrad bei gelungenen Proben auf Handwerk (Holzbearbeitung), die er während der Wirkungsdauer ausführt.
spell.improvewoodwork.enhancedescr=Der Handwerker erhält insgesamt 2 zusätzliche EG.
spell.moldwood.descr=Der Zauberer kann totes Holz bis zu einem Wert von Last 5 verformen, als handele es sich um warmes Wachs. Er kann das Material nicht einfach durch Gedankenkraft in eine Form bringen (muss also immer noch Proben auf Edelhandwerk oder Handwerk ablegen), benötigt aber kein Werkzeug mehr, wenn er unter Anwendung dieses Zaubers Gegenstände herstellt, und kann diese auch in ungewöhnliche Formen bringen.
spell.moldwood.enhancedescr=Es kann Holz bis zu Last 7 verformt werden.
spell.moldmetal.descr=Der Zauberer kann Metall bis zu einem Wert von Last 5 verformen, als handele es sich um warmes Wachs. Er kann das Material nicht einfach durch Gedankenkraft in eine Form bringen (muss also immer noch Proben auf Edelhandwerk oder Handwerk ablegen), benötigt aber kein Werkzeug mehr, wenn er unter Anwendung dieses Zaubers Gegenstände herstellt, und kann diese auch in ungewöhnliche Formen bringen.
spell.moldmetal.enhancedescr=Es kann Metall bis zu Last 7 verformt werden.
spell.improveforging.descr=Der Zauberer verbessert die Ergebnisse seiner handwerklichen Arbeit. Er erhält einen zusätzlichen Erfolgsgrad bei gelungenen Proben auf Handwerk (Schmiedekunst), die er während der Wirkungsdauer ausführt.
spell.improveforging.enhancedescr=Der Handwerker erhält insgesamt 2 zusätzliche EG.
spell.blessrelic.descr=Der Zauber erlaubt es, ein Relikt nachträglich zu verändern, indem es magisch umgeschmiedet oder auf andere Art umgearbeitet wird. Dieser Prozess benötigt eine hervorragende Werkstatt (mindestens Zuflucht 4 oder eine ähnlich gut ausgestattete Werkstatt), einen hervorragenden Handwerker (Meisterschaft Meister im passenden Schwerpunkt \u2013 hierbei muss es sich nicht um den Zauberer handeln) und nach Vollführung des Zaubers 8 Stunden Zeit, aber keine weitere Probe. Das Relikt erhält eine zusätzliche Stufe Gegenstandsqualität, die dauerhaft erhalten bleibt und die wie üblich für Verbesserungen genutzt werden kann. Jeder Gegenstand kann nur einmal auf diese Art umgearbeitet werden.
spell.blessrelic.enhancedescr=Der Gegenstand muss kein Relikt sein. Um einen gewöhnlichen Gegenstand umzuarbeiten, sind häufig besonders seltene Materialien nach Maßgabe des Spielleiters nötig.
spell.improvemasonary.descr=Der Zauberer verbessert die Ergebnisse seiner handwerklichen Arbeit. Er erhält einen zusätzlichen Erfolgsgrad bei gelungenen Proben auf Handwerk (Steinbearbeitung), die er während der Wirkungsdauer ausführt.
spell.improvemasonary.enhancedescr=Der Handwerker erhält insgesamt 2 zusätzliche EG.

material.spidersilk.desc=Über die Grenzen Takasadus hinaus berühmt ist die dort gewonnene Spinnenseide. Durch die Portalroute Sarnburg-Palitan gelangen unterschiedlichste Seidenarten bis nach Dragorea. Spinnenseide ist besonders für seine schillernden Farben und seinen Glanz bekannt. /n Materialeigenschaft: Volle Sätze Kleidung aus Spinnenseide verleihen ihren Trägern einen Bonus in Höhe von 1 Punkt bei Manipulationen und Duellen im Sozialen Konflikt (siehe Splittermond: Die Regeln, S. 147).
material.djinnsilkWater.desc=Die elementaren Djinne Farukans spinnen feinsten Seidenstoff, wobei ein Teil der Essenz der magischen Wesen in die Seide einfließt. So eignet sich die Djinnenseide hervorragend, um elementare Magie zu verstärken, aber auch um sich vor schädlicher Elementarmagie zu schützen. Dabei unterscheidet man zwischen roter Feuerseide, weißer Luftseide, blauer Wasserseide und brauner Erdseide. /n Materialeigenschaft: Volle Sätze Kleidung aus Djinnenseide gewähren dem Träger einen Ausrüstungsbonus in Höhe von 2 Punkten auf Zauber des passenden Elements und reduzieren Schaden, dessen Quelle das entgegengesetzte Element (Feuer-Wasser / Wind-Erde) ist, um 1 Punkt.
material.djinnsilkFire.desc=Die elementaren Djinne Farukans spinnen feinsten Seidenstoff, wobei ein Teil der Essenz der magischen Wesen in die Seide einfließt. So eignet sich die Djinnenseide hervorragend, um elementare Magie zu verstärken, aber auch um sich vor schädlicher Elementarmagie zu schützen. Dabei unterscheidet man zwischen roter Feuerseide, weißer Luftseide, blauer Wasserseide und brauner Erdseide. /n Materialeigenschaft: Volle Sätze Kleidung aus Djinnenseide gewähren dem Träger einen Ausrüstungsbonus in Höhe von 2 Punkten auf Zauber des passenden Elements und reduzieren Schaden, dessen Quelle das entgegengesetzte Element (Feuer-Wasser / Wind-Erde) ist, um 1 Punkt.
material.djinnsilkAir.desc=Die elementaren Djinne Farukans spinnen feinsten Seidenstoff, wobei ein Teil der Essenz der magischen Wesen in die Seide einfließt. So eignet sich die Djinnenseide hervorragend, um elementare Magie zu verstärken, aber auch um sich vor schädlicher Elementarmagie zu schützen. Dabei unterscheidet man zwischen roter Feuerseide, weißer Luftseide, blauer Wasserseide und brauner Erdseide. /n Materialeigenschaft: Volle Sätze Kleidung aus Djinnenseide gewähren dem Träger einen Ausrüstungsbonus in Höhe von 2 Punkten auf Zauber des passenden Elements und reduzieren Schaden, dessen Quelle das entgegengesetzte Element (Feuer-Wasser / Wind-Erde) ist, um 1 Punkt.
material.djinnsilkEarth.desc=Die elementaren Djinne Farukans spinnen feinsten Seidenstoff, wobei ein Teil der Essenz der magischen Wesen in die Seide einfließt. So eignet sich die Djinnenseide hervorragend, um elementare Magie zu verstärken, aber auch um sich vor schädlicher Elementarmagie zu schützen. Dabei unterscheidet man zwischen roter Feuerseide, weißer Luftseide, blauer Wasserseide und brauner Erdseide. /n Materialeigenschaft: Volle Sätze Kleidung aus Djinnenseide gewähren dem Träger einen Ausrüstungsbonus in Höhe von 2 Punkten auf Zauber des passenden Elements und reduzieren Schaden, dessen Quelle das entgegengesetzte Element (Feuer-Wasser / Wind-Erde) ist, um 1 Punkt.
material.fairytwine.desc=Feengarn gilt als einer der edelsten Stoffe auf Lorakis. Er ist reißfest, anschmiegsam und wasserdicht, darüber hinaus verliert er niemals seinen urtümlichen Glanz. Üblicherweise kann man ihn nur in der Feenwelt bei deren Bewohnern tauschen, nur selten taucht er auf dem freien Markt auf. So mancher Stoffhändler ist auf der Suche nach Feengarn verschollen. /n Materialeigenschaft: Gegenstände aus Feengarn besitzen die Verbesserungen Schmutzabweisend und Wasserfest (Stufe 2). Kleidung aus Feengarn gilt als leicht positiver Umstand bei Sozialen Konflikten, die Einstellung intelligenter Feen gegenüber ihrem Träger ist um 1 Stufe verbessert (maximal aufgeschlossen).
material.sanjawood.desc=Die nachtschwarzen Bäume des Blinden Waldes in Ashurmazaan scheinen das Licht vollständig zu verschlucken. Neben dieser Eigenschaft ist das Holz aber fest und flexibel genug, um daraus gute Schusswaffen herstellen zu können \u2013 vorausgesetzt man ist wagemutig genug, sich in diesen Wald hineinzubegeben, denn die hier lebenden Nephilim machen den Wald zu gefährlich für gewöhnliche Holzfäller. /n Materialeigenschaft: Fernkampfwaffen aus Sanjha-Holz verfügen automatisch über das Merkmal Ferndistanz.
material.druidwood.desc=Das Holz der Vanenbäume in Zwingard wird umgangssprachlich als Druidenholz bezeichnet. In der Tat können die Druiden erkennen, welche der Vanenbäume tatsächlich von den Vanyr gesegnet wurden und damit über hervorragende Eignung für Waffen und Schilde verfügen. Um zu verhindern, dass zu viele Bäume gefällt werden, behalten die Druiden dieses Wissen für sich. /n Materialeigenschaft: Nahkampfwaffen (mit langem Holzschaft) und Schilde aus Druidenholz verleihen einen Bonus in Höhe von 1 Punkt auf die Aktive Abwehr mit diesem Gegenstand.
material.ghostwood.desc=Das Geisterholz der Smaragdküste trägt seinen Namen aus gutem Grund. Das leicht gräuliche Holz scheint tatsächlich eine Verbindung zur Geisterwelt zu haben. So wird es auch nur selten gefällt, denn es halten sich hartnäckig die Gerüchte, dass die Holzfäller von Geistern heimgesucht und in den Tod getrieben werden \u2013 was umso bedauerlicher ist, da sich dieses Holz hervorragend zur Fokussierung von Todesmagie eignet. /n Materialeigenschaft: Gegenstände aus Geisterholz gewähren ihrem Träger einen Bonus in Höhe von 2 Punkten auf Todesmagie. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden.
material.whisperwood.desc=In den Dschungeln von Gotor wächst ein enger Verwandter des Geisterholzes: das helle, fein gemaserte Wisperholz. Es ist noch seltener als Geisterholz, denn den Legenden nach sind Wisperholzbäume immer ein Bindeglied zwischen der Welt der Lebenden und der der Geister. Werden aus Wisperholz Naturmagie-Artefakte gefertigt, erhält der Handwerker sogar einen stark positiven Umstand, nicht nur einen leicht positiven Umstand. /n Materialeigenschaft: Gegenstände aus Wisperholz gewähren ihrem Träger einen Bonus in Höhe von 1 Punkt sowohl auf Todes- als auch auf Naturmagie. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden.
material.walkingwood.desc=Das besonders feste Holz von Baumwandler und Dämmerweide ist in ganz Lorakis zu finden. Das Holz unterscheidet sich äußerlich allerdings nicht von dem des Baumes, in dessen Gestalt der Baumwandler umherzieht, sei es nun Buche, Linde oder Eiche. Baumwandler und Dämmerweide können als jede Baumart auftreten \u2013 und natürlich muss die Kreatur erst einmal getötet werden, um ihr Holz zu erlangen, wobei ein Baumwandler je nach Größe genug Material für Gegenstände mit bis zu Last 7 ergibt. Baumwandler betrachten Personen mit solchen Gegenständen als Todfeinde. /n Materialeigenschaft: Gegenstände aus Wandelndem Holz können wilde Tiere davon abschrecken, ihren Träger anzugreifen. Die Chance, während einer Reise auf das Ereignis Feinde zu treffen, ist um 1 reduziert, die gestrichene Chance gilt als \u201Ekein Ereignis\u201C. (Beispiel: In der Zone Wildnis ist die Chance, auf Feinde zu treffen, 1-3 auf W10. Mit Wandelndem Holz sinkt die Chance auf 1-2, ein Ergebnis von 3 gilt als \u201Ekein Ereignis\u201C.) Bei einer Begegnung mit wilden Tieren kann ein solcher Gegenstand nach Spielleitermaßgabe ein Tier vom Angriff auf den Träger abhalten. Das Tragen eines Gegenstandes aus Wandelndem Holz, das von einem Baumwandler stammt, senkt die Einstellung von Baumwandlern und einigen Naturwesen nach Maßgabe des Spielleiters gegenüber dem Träger auf Feindlich.
material.firnwood.desc=Streng behütet wird das magische, weiße Holz des Firnbaums, der nur inmitten des Immersommerwaldes wächst und für die dortigen Alben eine beinahe heilige Bedeutung hat. Außerhalb des Waldes wird man dieses Holz fast nie zu Gesicht kriegen \u2013 und wenn, dann nur in den Händen einiger weniger Vertrauten der Tarsai oder tollkühner Räuber. /n Materialeigenschaft: Ein Gegenstand aus Firnholz erhöht die Fokuspunkte eines Trägers um 5. Das Holz braucht einige Tage, um sich auf seinen Anwender \u201Eeinzustimmen\u201C, die Punkte sind also nicht sofort verfügbar. Maximal kann ein Träger von zwei Firnholz- Gegenständen gleichzeitig profitieren.
material.blackleather.desc=Für Abenteurer, die viel Wert auf Heimlichkeit legen, ist das Schwarzleder sehr wertvoll, das von dem Schattenpanther des Dämmerwaldes stammt. Das feste Leder des Tieres vermag manchen Treffer abzuhalten, gleichzeitig ist es noch relativ leicht, sodass Bewegungen kaum eingeschränkt werden. /n Materialeigenschaft: Rüstungen und ganze Sätze Kleidung aus Schwarzleder verleihen dem Träger einen Bonus in Höhe von 1 Punkt auf Heimlichkeit. Dabei kann nicht von Rüstung und Kleidung gleichzeitig profitiert werden.
material.krakenleather.desc=An das Leder der Riesenkrake heranzukommen ist sehr schwierig, da die gewaltigen Tiere den Kampf gegen Schiffe in der Regel gewinnen oder sich ansonsten in die Tiefen des Meeres zurückziehen. Wenn sich dann doch einzelne Tentakel finden lassen, lässt sich daraus ein meist dunkles Leder herstellen, das für feste Kleidung und Rüstung sorgt, die sehr warm hält und Wasser abweisend ist. /n Materialeigenschaft: Gegenstände aus Krakenleder besitzen die Verbesserungen Wasserfest (Stufe 2) und Kälteschutz (Stufe 1).
material.bigbullleather.desc=Neben vielen anderen Kreaturen sind im Dämmerwald die riesigen Lederbullen anzutreffen, aus deren Haut sich ein vortreffliches Leder fertigen lässt. Die Verarbeitung des Leders ist allerdings schwierig \u2013 die Andarai nehmen häufig Magie zur Hilfe, um es zu bearbeiten. /n Materialeigenschaft: Die Härte eines Gegenstandes aus Großbullenleder ist um 1 erhöht. Schilde aus Großbullenleder verleihen einen Bonus in Höhe von 1 Punkt auf die Aktive Abwehr mit diesem Gegenstand. Bei der Herstellung von Gegenständen erhält der Handwerker einen leicht negativen Umstand auf seine Proben, es sei denn, er verwendet den Zauber Handwerk verbessern.
material.forestdragonleather.desc=Das feuerfeste Leder der Drachen ist in ganz Lorakis begehrt, vom Leder der Sanddrachen der Surmakar bis zur Haut der Baumdrachen der Wandernden Wälder. Die Festigkeit dieses Leders lässt sich nur noch mit dem der Lederbullen vergleichen. Drachenleder kann eine Qualität von 3 bis 5 erreichen, je nach ursprünglicher Kreatur. /n Materialeigenschaft: Gegenstände aus Walddrachenleder erhalten die Verbesserung Schutz vor Feuerschaden 2. Sie gewähren ihrem Träger einen Bonus in Höhe von 1 Punkt auf Naturmagie. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden.
material.sanddragonleather.desc=Das feuerfeste Leder der Drachen ist in ganz Lorakis begehrt, vom Leder der Sanddrachen der Surmakar bis zur Haut der Baumdrachen der Wandernden Wälder. Die Festigkeit dieses Leders lässt sich nur noch mit dem der Lederbullen vergleichen. Drachenleder kann eine Qualität von 3 bis 5 erreichen, je nach ursprünglicher Kreatur. /n Materialeigenschaft: Gegenstände aus Sanddrachenleder erhalten die Verbesserung Schutz vor Feuerschaden 3. Ihre Härte ist um 1 Punkt erhöht, außerdem gewähren sie ihrem Träger einen Bonus in Höhe von 2 Punkten auf den Körperlichen Widerstand gegen Gifte. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden.
material.highdragonleather.desc=Das feuerfeste Leder der Drachen ist in ganz Lorakis begehrt, vom Leder der Sanddrachen der Surmakar bis zur Haut der Baumdrachen der Wandernden Wälder. Die Festigkeit dieses Leders lässt sich nur noch mit dem der Lederbullen vergleichen. Drachenleder kann eine Qualität von 3 bis 5 erreichen, je nach ursprünglicher Kreatur. /n Materialeigenschaft: Gegenstände aus Hohem Drachenleder erhalten die Verbesserung Schutz vor Feuerschaden 4. Sie gewähren ihrem Träger außerdem einen Bonus in Höhe von 2 Punkten auf Feuermagie. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden. Rüstungen aus Hohem Drachenleder erhalten das Merkmal Stabil (wodurch sich auch die Behinderung erhöht, siehe S. 47).
material.thaumarium.desc=Thaumarium ist ein schweres, tiefblaues Erz, das bisher nur in den Bergen von Termark gefunden wurde. Es eignet sich besonders gut für die Herstellung magischer Artefakte. /n Materialeigenschaft: Wird ein Gegenstand aus aumarium zum Artefakt verzaubert, erhält der Verzauberer einen stark positiven Umstand auf die Proben zur Verzauberung.
material.oreofthedead.desc=Totenerz kann nur in Esmoda gefördert werden und verleiht der Totenmetropole somit das Monopol über das schwarze, erstaunlich leichte Erz. Da es ebenso widerstandsfähig ist wie Stahl, wird es vor allem für Metallrüstungen verwendet. /n Materialeigenschaft: Rüstungen aus Totenerz können ein weiteres Mal nach den üblichen Regeln für ihren Träger personalisiert werden.
material.jadeiron.desc=Das Jadeeisen zeichnet sich durch die namensgebende Farbe und seine außergewöhnlich hohe Qualität aus. Es kann nur unter großen Anstrengungen vom Meeresboden der Jadesee gefördert werden. Es gilt als Ziermetall, kann aber je nach Verarbeitung auch für Waffen verwendet werden. /n Materialeigenschaft: Die Last von Gegenständen aus Jadeeisen ist um 1 reduziert (ohne Verlust an Haltbarkeit oder andere negative Auswirkungen von niedriger Last), die Härte um 1 erhöht. Rüstungen und Waffen aus Jadeeisen gewähren durch ihr prächtiges Aussehen dem Träger einen Bonus in Höhe von 2 Punkten auf Anführen (Flammende Rede und Moral). Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden. Werden Waffen aus Jadeeisen gefertigt, erhält der Handwerker einen leicht negativen Umstand auf die Herstellungsprobe.
material.moonsteel.desc=Bruchstücke des Splittermonds sind im Laufe der Jahrhunderte vielerorts über Lorakis niedergegangen, und es heißt, dass Gegenstände aus Mondstahl den Lauf der Welt ändern können. Besitzer von Gegenständen aus Mondstahl scheinen von den Göttern gesegnet und in der Lage zu sein, übermenschliche Taten zu vollbringen. Aber auch ohne diese Sage ist Mondstahl der König der Metalle: Zwar ist es aufwendig zu formen, kennt jedoch in seiner Anwendbarkeit keine Grenzen. /n Materialeigenschaft: Wird ein Mondstahl-Gegenstand zu einem Artefakt verzaubert, erhält der Zauberer einen stark positiven Umstand auf die Proben zur Verzauberung. Gegenstände aus Mondstahl sind mächtig, aber die wahre Macht des Metalls liegt darin, wie es auf Splitterträger reagiert \u2013 und nur in den Händen eines Splitterträgers entfaltet ein Gegenstand aus Mondstahl sein ganzes Potential. Ein kleiner Splitter Mondstein reicht hierfür übrigens nicht aus, es muss eine größere Menge sein, mindestens ein kleines Amulett, das aus dem Metall gefertigt wurde. Mehr dazu im MSK S.97f
material.plaingraveplate.desc=Die Steppengräber in der Jogai-Steppe verfügen über einen außerordentlichen Chitinpanzer, aus dem besondere Rüstungen gewonnen werden können - auch wenn das eine sehr mühevolle Arbeit ist, da schon einige Dutzend dieser Tiere für eine menschengroße Rüstung benötigt werden. /n Materialeigenschaft: Die Last von Gegenständen aus Steppengräberpanzern ist um 1 reduziert (ohne Verlust an Haltbarkeit oder andere negative Auswirkungen niedriger Last), die Härte um 1 erhöht.
material.calaifeathers.desc=Von Zeit zu Zeit lassen sich die abgeworfenen Schwungfedern der \u201EHimmelsschwinge\u201C Calai finden. Aus den gewaltigen Federn lässt sich Kleidung herstellen, aus dem Schaft der Federn sogar Waffenschäfte und Fernkampfwaffen. /n Materialeigenschaft: Last und Härte eines Gegenstandes aus den Federn von Calai sind um 1 reduziert (ohne Verlust an Haltbarkeit oder andere negative Auswirkungen niedriger Last). Sie gewähren ihrem Träger einen Bonus in Höhe von 1 Punkt auf Bewegungs- und Windmagie. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden. Fernkampfwaffen aus den Federn verfügen automatisch über das Merkmal Ferndistanz.
material.godsonscale.desc=Gelegentlich findet man an den Ufern des Naoley die gewaltigen Schuppen des echsenhaften Gottessohnes, die zu Kleidung, Rüstungen und Schilden gefertigt werden können. /n Materialeigenschaft: Kleidung und Rüstungen aus den Schuppen von Gottessohn gewähren einen Bonus in Höhe von 2 Punkten auf Schwimmen. Außerdem kann der Träger doppelt so lange wie sonst die Luft anhalten. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden.
material.hornfelsenhuf.desc=Der stierartige Felsenhuf schärft seine Hörner an den Felsen des Gebirges. Hin und wieder kann man im Gebirge daher auf eine abgebrochene Hornspitze stoßen, aus der sich Instrumente, Kunstgegenstände oder Schmuck fertigen lassen. /n Materialeigenschaft: Der Geistige Widerstand von Tieren gegenüber dem Träger ist um 2 Punkte gesenkt. Der Träger erhält, solange er den Gegenstand führt, die Tierführung-Meisterschaft Dompteur sowie einen Bonus in Höhe von 2 Punkten auf alle Tierführung-Proben. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden.
material.targithanhide.desc=Die zähen, ledrigen Hautplatten des großen Wurms Targithan können zu Kleidung, Schilden und Rüstungen gefertigt werden. Selbst abgeworfen verfügen sie noch über die Fähigkeit Targithans, sich selbst zu regenerieren \u2013 was eine Bearbeitung aber schwierig macht. /n Materialeigenschaft: Beim Bearbeiten der Hautplatten erhält der Handwerker einen leicht negativen Umstand (statt des üblichen leicht positiven Umstands), da sich das Material immer wieder selbst zu heilen versucht. Gegenstände aus den Hautplatten reparieren sich innerhalb eines Tages selbst, solange sie nicht vollständig zerstört sind (sämtliche Haltbarkeit verloren haben). In ganzen Sätzen Kleidung oder Rüstung aus den Hautplatten zu schlafen, erhöht die Lebenspunkteregeneration um 1, da ein Teil dieser Eigenschaft auf den Träger übergeht. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden.

enhancement.secretcompartment.desc=Das Ausrüstungsstück enthält ein Geheimfach (etwa ein Hohlraum im Schaft einer Waffe oder eine geschickt eingenähte Tasche in einem Mantel). Dieses Fach kann nur durch eine Wahrnehmung-Probe gegen eine Schwierigkeit von 35 erkannt werden, lässt sich je nach Machart und Größe aber eventuell ertasten.
enhancement.premiumcrafted.desc=Der Gegenstand verliert das Merkmal Primitiv.
enhancement.resistcold.desc=Solcherart verbesserte Kleidung bietet besonders guten Schutz gegen Kälte und senkt die momentan vorherrschende Kältestufe für ihren Träger um 1 Stufe pro Stufe in dieser Verbesserung. Im Gegenzug steigt die Behinderung pro Stufe um 1.
enhancement.deflectdirt.desc=Ein Ausrüstungsstück wird mit Substanzen behandelt, die Schmutz schwerer an ihm haften lassen. Ein kurzes Abklopfen oder Abbürsten reicht meist, um den Gegenstand wieder sauber zu bekommen.
enhancement.inconspicuous.desc=Der Gegenstand lässt sich leichter verbergen. Im Falle einer Waffe wurde diese so konstruiert, dass sie möglichst unauffällig ist und auf den ersten Blick als Alltagsgegenstand erscheint. Beispiele hierfür sind scharfe Messerklingen, die in einen Handfächer eingearbeitet wurden, eine als Spazierstock getarnte Klinge oder ein als Wanderstab getarnter Speer.\nDiese Verbesserung kann auch (maximal einmal) auf Rüstungen angewendet werden: Tuchrüstungen sind wie ein Hemd geschnitten, Schuppenteile sind in einen Mantel eingenäht, ein Kettenhemd ist so feingliedrig, dass es unter einem Wams getragen werden kann oder ähnliches. Plattenrüstungen können auf diese Art allerdings nicht verborgen werden.\nEine Wahrnehmung-Probe gegen eine Schwierigkeit von 25 (1 Stufe) bzw. 35 (2 Stufen) ist notwendig, um die Waffe oder Rüstung als solche zu erkennen (solange die Waffe nicht eingesetzt wird) oder den Gegenstand zu entdecken.
enhancement.uncommonspecialization.desc=Das Ausrüstungsstück verleiht einen Bonus auf einen Schwerpunkt auf eine für den Gegenstand ungewöhnliche, aber plausibel herleitbare Fertigkeit, zum Beispiel eine besonders imposante Rüstung, die einen Bonus auf Anführen (Motivation) gewährt, oder ein Wappenschild, der Entschlossenheit (Furcht widerstehen) erhöht.
enhancement.damagetype.desc=Diese Verbesserung reduziert pro Stufe den Schaden einer bestimmten Schadensart um 1 Punkt, zum Beispiel Elektrizität oder Feuer. So werden Alchemistenkittel häufig speziell behandelt, um ihren Träger vor Säurespritzern zu schützen, es gibt aber auch andere Einsatzgebiete für diese Verbesserung, wie etwa speziell isolierte Kleidung, die vor Elektrizität schützt, oder besonders behandelte Gewänder, die etwaigen Feuerschaden verringern. Um einen Träger zu schützen, muss der Gegenstand ausreichend groß sein, andernfalls ist nur der Gegenstand selbst geschützt.
enhancement.waterproof.desc=Diese Verbesserung macht einen Gegenstand wasserfest. Mit 1 Qualitätsstufe ist er gefeit gegen Regenschauer und kurzzeitige Nässe. 2 Qualitätsstufen lassen ihn wasserdicht werden, sodass er auch gegen längeres Untertauchen geschützt ist. Wasserdichte Gegenstände sind auch luftdicht.
enhancement.demountable.desc=Der Gegenstand kann mit wenigen Handgriffen in seine Einzelteile zerlegt und wieder zusammengebaut werden. So ist es möglich, ihn platzsparend oder unauffällig zu transportieren. Beispiele für zerlegbare Ausrüstung sind zusammensteckbare Stäbe, Schilde, Bögen oder Sägen bzw. anderes Werkzeug. Dafür ist er nicht mehr so solide, sodass die Härte um 1 Punkt sinkt.\nEinen Gegenstand zu zerlegen oder zusammenzubauen erfordert eine kontinuierliche Aktion von 30 Ticks Dauer.
enhancement.farrange.desc=Die Fernkampfwaffe erhält das Merkmal Ferndistanz.
enhancement.weaponpair.desc=Die Waffe erhält das Merkmal Paarwaffe.
enhancement.unerring.desc=Die Fernkampfwaffe erhält das Merkmal Treffsicher.
enhancement.imprdefensive.desc=Die Verbesserung erhöht das Merkmal Defensiv um 1. Das Merkmal muss bereits vorhanden sein.
enhancement.imprexact.desc=Die Verbesserung erhöht das Merkmal Exakt um 1. Das Merkmal muss bereits vorhanden sein.
enhancement.imprpiercing.desc=Die Verbesserung erhöht das Merkmal Scharf um 1, auf mindestens Scharf (2). Waffen mit einem W6-Schadenswürfel dürfen maximal Scharf (3) besitzen, Waffen mit W10 maximal Scharf (5).
enhancement.imprdisarmprot.desc=Die Verbesserung erhöht das Merkmal Entwaffnungsschutz um 1.
enhancement.imprcritical.desc=Die Verbesserung erhöht das Merkmal Kritisch um 2.
enhancement.imprdistract.desc=Die Verbesserung erhöht das Merkmal Ablenkend um 1.
enhancement.comfy.desc=Diese Verbesserung ist auf Rüstungen aus Leder, Fell und Tuch anwendbar und macht das Material weich genug, um relativ bequem darin schlafen zu können (sodass etwaige Abzüge durch die im Schlaf getragene Rüstung auf Lebens- oder Fokus-Regeneration entfallen).
enhancement.hardened.desc=Die Rüstung/Der Schild erhält das Merkmal Gehärtet (wodurch auch wie üblich der Tick-Zuschlag der Rüstung um 1 steigt).
enhancement.stable.desc=Die Rüstung erhält das Merkmal Stabil (wodurch auch wie üblich die Behinderung der Rüstung um 1 steigt).
enhancement.padded.desc=Die Rüstung erhält das Merkmal Wattiert (wodurch auch wie üblich sowohl Tick-Zuschlag als auch Behinderung der Rüstung um 1 steigen).
enhancement.mount.desc=Der Schild verfügt über eine spezielle Halterung, in die beispielsweise Laternen, Fackeln, Spiegel, göttliche Symbole oder ähnliche Ausrüstungsgegenstände eingesteckt werden können, sodass der Träger die sonst dafür verwendete Hand frei haben kann.
enhancement.cover.desc=Der Schild (ab einem Verteidigungsbonus von +2) erhält das Merkmal Deckung.
enhancement.spikes.desc=Der Schild erhält das Merkmal Dornen.
enhancement.shieldwall.desc=Der Schild erhält das Merkmal Schildwall.
enhancement.narrowusers.desc=Der Gegenstand verleiht seine besonderen Fähigkeiten nur einem bestimmten Träger oder einer bestimmten Gruppe von Trägern (nur dem König von Zwingard, nur ehrenhaften Zwergen, nur einer konkreten Person). Für andere Personen wird der Gegenstand schwer und unhandlich: Die legendären Fähigkeiten sind nicht einsetzbar, alle Proben zum Einsatz des Relikts sind um die Reliktstufe des Gegenstandes erschwert. Bei einer Rüstung oder einem Schild steigt die Behinderung außerdem um die Reliktstufe.
enhancement.specialdamage.desc=Waffen mit dieser Verbesserung haben eine Verbindung zu einem Element oder einer besonderen Schadensart, sei es, weil ein Elementarwesen seine Kraft in sie einfließen ließ oder weil sie mit Materialien hergestellt wurde, die magische Energien besser leiten. Mögliche Schadensarten sind Feuer, Kälte, Licht, Schatten, Säure, Elektrizität, Wind, Fels und Wasser.\nDer normale Schaden der Waffe wird vollständig in die besondere Schadensart umgewandelt. Dies hat üblicherweise nur dann Auswirkungen, wenn eine Kreatur, die von der Waffe getroffen wird, für diese Schadensarten anfällig (oder resistent) ist, nach Spielleitermaßgabe können aber auch andere Effekte (z.B. ein Flammenschwert, das Feuer entzündet, oder eine Kältewaffe, die in der Hitze der Wüste Linderung verschafft) nutzbar sein.
enhancement.youbelongtome.desc=Der Besitzer des Reliktes spürt stets, in welcher Richtung sich sein Relikt gerade befindet, und sei es noch so weit weg. Sollte das Relikt sich in einer anderen Domäne befinden, so spürt sein Besitzer nur, dass er selbst sich nicht in derselben Domäne aufhält.
enhancement.enemycurse.desc=Die Waffe richtet 2 Punkte zusätzlichen Schaden gegen einen bestimmten Kreaturentypus an (wählbar sind: Geisterwesen, Monster, Untoter, Lichtwesen, Schattenwesen, Naturwesen, Felswesen, Feuerwesen, Wasserwesen, Windwesen, Konstrukt, Chimäre, Ork, Niederer Drache, Hoher Drache, Wesen der Finsternis).
enhancement.soundoffear.desc=Das Relikt erfüllt alle Gegner in Hörweite mit Schrecken, wenn der Träger damit einen sehr lauten Klang erzeugt. Dies wirkt wie das Merkmal Furchterregend mit einem Wert von 15 zuzüglich der doppelten Reliktstufe. Für die Verbündeten des Trägers ist es einfach nur ein lauter Ton, der keine Einschränkungen mit sich bringt.
enhancement.intomypocket.desc=Das Relikt kann einmal pro Spielsitzung auf ein Zehntel seiner ursprünglichen Größe und Last geschrumpft sowie (sofern ihm kein Widerstand entgegengesetzt wird, sei es durch mangelnden Platz oder eine aktive, festhaltende Kraft) wieder zurückverwandelt werden.
enhancement.courager1.desc=Der Gegenstand verleiht einen Bonus in Höhe von 2 Punkten auf Proben zur Entschlossenheit, wenn es darum geht, Furcht und Schrecken zu widerstehen, sowie auf den Geistigen Widerstand.\nDie legendäre Kraft wirkt nur auf den Träger, dafür aber dauerhaft. (Beispiel: ein Schutzamulett)
enhancement.courager2.desc=Der Gegenstand verleiht einen Bonus in Höhe von 2 Punkten auf Proben zur Entschlossenheit, wenn es darum geht, Furcht und Schrecken zu widerstehen, sowie auf den Geistigen Widerstand.\nDie legendäre Kraft wirkt auf den Träger und alle Verbündeten in bis zu 10 m Radius. Hierzu muss der Gegenstand allerdings gerade eingesetzt werden. (Beispiele: Ein Schwert, das in der Schlacht eingesetzt wird, ein Wappenschild, der stolz am Arm präsentiert wird.)
enhancement.moonblessing.desc=Der Gegenstand stellt einmal pro Spielsitzung zu einem vom Spieler frei wählbaren Zeitpunkt 4 Splitterpunkte beim Träger wieder her, ohne dass dieser hierfür eine Handlung durchführen muss.
enhancement.situational.desc=Der Gegenstand gibt unter bestimmten Umständen einen Bonus in Höhe von 2 Punkten auf eine allgemeine Fertigkeit. Die Umstände dürfen dabei maximal in der Hälfte aller Fälle eintreten (Beispiele: der Bonus wird nur nachts gewährt, der Bonus wird nur gewährt, wenn der Abenteurer verletzt ist).\nWird eine sehr enge Einschränkung gewählt (Beispiel: der Abenteurer ist bereits Todgeweiht, verteidigt aber einen Gefährten), wird der Bonus sogar auf alle Fertigkeiten gewährt.
enhancement.returntoowner.desc=Auf die eine oder andere Art kehrt der Gegenstand immer zum Besitzer zurück. Es kann manchmal mehrere Wochen dauern, aber der Gegenstand bleibt niemals verschollen: Es ist so, als wolle er gefunden werden. Wenn der Besitzer den Gegenstand nicht verloren, sondern fortgeworfen hat, wird er dennoch gefunden, nur möglicherweise von einer anderen Person. Für die Rückkehr benötigt der Gegenstand maximal 7 Wochen abzüglich einer Woche pro Reliktstufe, mindestens aber einen Tag.
enhancement.shieldmight.desc=Das Relikt verleiht seinem Träger Schutz gegen eine bestimmte Schadensart (wählbar sind: Feuer, Kälte, Licht, Schatten, Säure, Elektrizität, Wind, Fels oder Wasser), wenn er es aktiv führt. Entsprechender Schaden wird um 1 Punkt reduziert.
enhancement.power1.desc=Der Gegenstand verleiht dem Besitzer eine regeltechnische Stärke. Hierbei sind auch Stärken wählbar, die sonst nur bei der Charaktererschaffung wählbar sind, und es können auch Stärken gewählt werden, deren Anzahl ansonsten begrenzt ist (z.B. Robust), und dabei die Begrenzung überschritten werden.
enhancement.power2.desc=Der Gegenstand verleiht dem Besitzer eine regeltechnische Stärke. Hierbei sind auch Stärken wählbar, die sonst nur bei der Charaktererschaffung wählbar sind, und es können auch Stärken gewählt werden, deren Anzahl ansonsten begrenzt ist (z.B. Robust), und dabei die Begrenzung überschritten werden.
enhancement.banishweapon.desc=Eine Bannwaffe verleiht dem Träger die Möglichkeit, seine magische Kraft durch sie hindurchzuleiten und auf diese Art Schutzzauber zu durchbrechen. Solange der Träger 3 Fokuspunkte zu diesem Zweck kanalisiert (hier ist keine Handlung nötig und dies ist auch als Reaktion möglich), ignoriert die Bannwaffe Boni auf Verteidigung und Schadensreduktion, die durch Zauber hervorgerufen werden.
enhancement.imprmoonsigh.desc=Der Gegenstand gewährt einem Splitterträger einen Bonus von 1 auf alle allgemeinen Splittergaben: Der Proben- und Widerstandsbonus steigt auf 4 Punkte (6 Punkte bei gegenseitiger Beeinflussung, gilt sowohl für den Träger als auch für den \u201ESpender\u201C), Schaden kann bis zu einer Höhe von 6 Punkten reduziert werden (9 Punkte bei gegenseitiger Beeinflussung).
enhancement.moreisbetter.desc=Das Relikt vervielfältigt sich, wenn diese Kraft aktiviert wird, in mehrere Gegenstände derselben Art (Duplikate). Die Duplikate sind nur noch profane Gegenstände ohne besondere Relikt-Qualitäten.\nDiese legendäre Kraft kann einmal pro Spielsitzung aktiviert werden, die Anzahl der Duplikate entspricht der Reliktstufe +1. Die Rückverwandlung ist jederzeit möglich, sofern der Besitzer eines der Duplikate berührt (welches dann wieder zum ursprünglichen Relikt wird und die restlichen Duplikate verschwinden lässt). Neue Duplikate können erst geschaffen werden, sobald alle alten Duplikate zurückverwandelt wurden.
enhancement.ancientlore.desc=Das Wissen oder die Fertigkeiten der früheren Träger sind in dem Gegenstand gespeichert. Ein Schwert könnte sich daran erinnern, wo die Drachenschuppe fehlt, die sein Träger vor 100 Jahren abgeschlagen hat, ein Diebesamulett weiß hingegen noch das Losungswort des alten und nunmehr verlassenen magischen Verstecks. Einige dieser Gegenstände nehmen tatsächlich telepathischen Kontakt mit ihrem Träger auf (oder sprechen gar mit ihm), bei anderen formt sich das Wissen einfach von selbst im Geist des Besitzers.\nÜber welches Wissen der Gegenstand verfügt (und ob er eventuell überhaupt bereit ist, sie seinem Träger mitzuteilen), liegt in der Hand des Spielleiters. Gegenstände mit dieser legendären Kraft verfügen oft über eine ganz eigene Persönlichkeit \u2013 mit der man auch verhandeln kann.\nDer Abenteurer kann jedoch versuchen, bewusst auf die Fertigkeiten der früheren Träger zurückzugreifen. Hierzu würfelt er eine Probe auf Arkane Kunde oder Empathie gegen eine Schwierigkeit von 15. Gelingt die Probe, erhält er einen Bonus in Höhe von 1 Punkt + 1 Punkt pro Erfolgsgrad auf die nächste passende Probe. Dies ist nur einmal pro Spielsitzung möglich.

material.spidersilk.effect=Volle Sätze Kleidung aus Spinnenseide verleihen ihren Trägern einen Bonus in Höhe von 1 Punkt bei Manipulationen und Duellen im Sozialen Konflikt (siehe Splittermond: Die Regeln, S. 147).
material.djinnsilkWater.effect=Volle Sätze Kleidung aus Djinnenseide gewähren dem Träger einen Ausrüstungsbonus in Höhe von 2 Punkten auf Zauber des passenden Elements und reduzieren Schaden, dessen Quelle das entgegengesetzte Element (Feuer-Wasser / Wind-Erde) ist, um 1 Punkt.
material.djinnsilkFire.effect=Volle Sätze Kleidung aus Djinnenseide gewähren dem Träger einen Ausrüstungsbonus in Höhe von 2 Punkten auf Zauber des passenden Elements und reduzieren Schaden, dessen Quelle das entgegengesetzte Element (Feuer-Wasser / Wind-Erde) ist, um 1 Punkt.
material.djinnsilkAir.effect=Volle Sätze Kleidung aus Djinnenseide gewähren dem Träger einen Ausrüstungsbonus in Höhe von 2 Punkten auf Zauber des passenden Elements und reduzieren Schaden, dessen Quelle das entgegengesetzte Element (Feuer-Wasser / Wind-Erde) ist, um 1 Punkt.
material.djinnsilkEarth.effect=Volle Sätze Kleidung aus Djinnenseide gewähren dem Träger einen Ausrüstungsbonus in Höhe von 2 Punkten auf Zauber des passenden Elements und reduzieren Schaden, dessen Quelle das entgegengesetzte Element (Feuer-Wasser / Wind-Erde) ist, um 1 Punkt.
material.fairytwine.effect=Gegenstände aus Feengarn besitzen die Verbesserungen Schmutzabweisend und Wasserfest (Stufe 2). Kleidung aus Feengarn gilt als leicht positiver Umstand bei Sozialen Konflikten, die Einstellung intelligenter Feen gegenüber ihrem Träger ist um 1 Stufe verbessert (maximal aufgeschlossen).
material.sanjawood.effect=Fernkampfwaffen aus Sanjha-Holz verfügen automatisch über das Merkmal Ferndistanz.
material.druidwood.effect=Nahkampfwaffen (mit langem Holzschaft) und Schilde aus Druidenholz verleihen einen Bonus in Höhe von 1 Punkt auf die Aktive Abwehr mit diesem Gegenstand.
material.ghostwood.effect=Gegenstände aus Geisterholz gewähren ihrem Träger einen Bonus in Höhe von 2 Punkten auf Todesmagie. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden.
material.whisperwood.effect=Gegenstände aus Wisperholz gewähren ihrem Träger einen Bonus in Höhe von 1 Punkt sowohl auf Todes- als auch auf Naturmagie. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden.
material.walkingwood.effect=Gegenstände aus Wandelndem Holz können wilde Tiere davon abschrecken, ihren Träger anzugreifen. Die Chance, während einer Reise auf das Ereignis Feinde zu treffen, ist um 1 reduziert, die gestrichene Chance gilt als „kein Ereignis“. (Beispiel: In der Zone Wildnis ist die Chance, auf Feinde zu treffen, 1-3 auf W10. Mit Wandelndem Holz sinkt die Chance auf 1-2, ein Ergebnis von 3 gilt als „kein Ereignis“.) Bei einer Begegnung mit wilden Tieren kann ein solcher Gegenstand nach Spielleitermaßgabe ein Tier vom Angriff auf den Träger abhalten. Das Tragen eines Gegenstandes aus Wandelndem Holz, das von einem Baumwandler stammt, senkt die Einstellung von Baumwandlern und einigen Naturwesen nach Maßgabe des Spielleiters gegenüber dem Träger auf Feindlich.
material.firnwood.effect=Ein Gegenstand aus Firnholz erhöht die Fokuspunkte eines Trägers um 5. Das Holz braucht einige Tage, um sich auf seinen Anwender „einzustimmen“, die Punkte sind also nicht sofort verfügbar. Maximal kann ein Träger von zwei Firnholz- Gegenständen gleichzeitig profitieren.
material.blackleather.effect=Rüstungen und ganze Sätze Kleidung aus Schwarzleder verleihen dem Träger einen Bonus in Höhe von 1 Punkt auf Heimlichkeit. Dabei kann nicht von Rüstung und Kleidung gleichzeitig profitiert werden.
material.krakenleather.effect=Gegenstände aus Krakenleder besitzen die Verbesserungen Wasserfest (Stufe 2) und Kälteschutz (Stufe 1).
material.bigbullleather.effect=Die Härte eines Gegenstandes aus Großbullenleder ist um 1 erhöht. Schilde aus Großbullenleder verleihen einen Bonus in Höhe von 1 Punkt auf die Aktive Abwehr mit diesem Gegenstand. Bei der Herstellung von Gegenständen erhält der Handwerker einen leicht negativen Umstand auf seine Proben, es sei denn, er verwendet den Zauber Handwerk verbessern.
material.forestdragonleather.effect=Gegenstände aus Walddrachenleder erhalten die Verbesserung Schutz vor Feuerschaden 2. Sie gewähren ihrem Träger einen Bonus in Höhe von 1 Punkt auf Naturmagie. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden.
material.sanddragonleather.effect=Gegenstände aus Sanddrachenleder erhalten die Verbesserung Schutz vor Feuerschaden 3. Ihre Härte ist um 1 Punkt erhöht, außerdem gewähren sie ihrem Träger einen Bonus in Höhe von 2 Punkten auf den Körperlichen Widerstand gegen Gifte. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden.
material.highdragonleather.effect=Gegenstände aus Hohem Drachenleder erhalten die Verbesserung Schutz vor Feuerschaden 4. Sie gewähren ihrem Träger außerdem einen Bonus in Höhe von 2 Punkten auf Feuermagie. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden. Rüstungen aus Hohem Drachenleder erhalten das Merkmal Stabil (wodurch sich auch die Behinderung erhöht, siehe S. 47).
material.thaumarium.effect=Wird ein Gegenstand aus aumarium zum Artefakt verzaubert, erhält der Verzauberer einen stark positiven Umstand auf die Proben zur Verzauberung.
material.oreofthedead.effect=Rüstungen aus Totenerz können ein weiteres Mal nach den üblichen Regeln für ihren Träger personalisiert werden.
material.jadeiron.effect=Die Last von Gegenständen aus Jadeeisen ist um 1 reduziert (ohne Verlust an Haltbarkeit oder andere negative Auswirkungen von niedriger Last), die Härte um 1 erhöht. Rüstungen und Waffen aus Jadeeisen gewähren durch ihr prächtiges Aussehen dem Träger einen Bonus in Höhe von 2 Punkten auf Anführen (Flammende Rede und Moral). Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden. Werden Waffen aus Jadeeisen gefertigt, erhält der Handwerker einen leicht negativen Umstand auf die Herstellungsprobe.
material.moonsteel.effect=Mondstahl hat zu viele Effekte um diese hier aufzuführen. Siehe Mondstahlklingen S. 97
material.plaingraveplate.effect=Die Last von Gegenständen aus Steppengräberpanzern ist um 1 reduziert (ohne Verlust an Haltbarkeit oder andere negative Auswirkungen niedriger Last), die Härte um 1 erhöht.
material.calaifeathers.effect=Last und Härte eines Gegenstandes aus den Federn von Calai sind um 1 reduziert (ohne Verlust an Haltbarkeit oder andere negative Auswirkungen niedriger Last). Sie gewähren ihrem Träger einen Bonus in Höhe von 1 Punkt auf Bewegungs- und Windmagie. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden. Fernkampfwaffen aus den Federn verfügen automatisch über das Merkmal Ferndistanz.
material.godsonscale.effect=Kleidung und Rüstungen aus den Schuppen von Gottessohn gewähren einen Bonus in Höhe von 2 Punkten auf Schwimmen. Außerdem kann der Träger doppelt so lange wie sonst die Luft anhalten. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden.
material.hornfelsenhuf.effect=Der Geistige Widerstand von Tieren gegenüber dem Träger ist um 2 Punkte gesenkt. Der Träger erhält, solange er den Gegenstand führt, die Tierführung-Meisterschaft Dompteur sowie einen Bonus in Höhe von 2 Punkten auf alle Tierführung-Proben. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden.
material.targithanhide.effect=Beim Bearbeiten der Hautplatten erhält der Handwerker einen leicht negativen Umstand (statt des üblichen leicht positiven Umstands), da sich das Material immer wieder selbst zu heilen versucht. Gegenstände aus den Hautplatten reparieren sich innerhalb eines Tages selbst, solange sie nicht vollständig zerstört sind (sämtliche Haltbarkeit verloren haben). In ganzen Sätzen Kleidung oder Rüstung aus den Hautplatten zu schlafen, erhöht die Lebenspunkteregeneration um 1, da ein Teil dieser Eigenschaft auf den Träger übergeht. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden.
