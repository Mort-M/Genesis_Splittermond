#mastership.diplomacy.herold.desc=
#feature.ridershield.desc=

education.academic.descr=Kundige Individuen, deren Wissen weit über das normale Maß hinausgeht, nehmen fast überall in Lorakis eine besondere Stellung in ihrem jeweiligen Volk ein. Ganz gleich, ob es nun um die Bestimmung eines seltsamen Artfeakts geht, eine komplexe Rechtsstreitigkeit beigelegt oder eine dem Finder unbekannte Pflanze bestimmt werden soll - an einen Gelehrten wendet man sich immer dann, wenn die eigenen Kenntnisse nicht weit genug reichen. Doch egal, wie der einzelne Gelehrte in der jeweiligen Kultur zu seinen Kenntnissen gekommen sein mag, ob nun durch den Besuch einer besonderen Schule, als Schützling eines weisen Mentors oder durch Selbststudium - ihnen allen gemein ist eine brennende Neugier auf alle Wunder, die Lorakis für sie bereithält. Dies trifft insbesondere auf jene Gelehrte zu, deren unbändiger Wissensdurst sie in die weite Welt hinaustreibt. Ihre fast schon kindliche Neugier, ihr scharfer Verstand, ihre ausgeprägte Intuition und insbesondere ihr umfassender Wissensschatz machen sie zu begehrten Reisegefährten mit einem besonderen Händchen für zuweilen ungewöhnliche Lösungen.
education.pardedah.descr=Die farukanischen Pardedah haben die Kunst des Geschichtenerzählens zu ihrer Vollendung getrieben. Sie reisen durch ganz Farukan, manchmal sogar darüber hinaus, und tragen ihre Legenden und Märchen vor, wobei sie sich neben der Schauspielkunst auch der Magie bedienen, allen voran den Zauberschulen Illusion und Verwandlung. Meister dieser Zunft sind im ganzen Land bekannt und werden sogar an die Höfe von Satrapen und Shahiren zur Unterhaltung eingeladen - und verdienen sich damit ein stattliches Einkommen.
education.wisemanofstone.descr=Die Steinweisen der Furgand sind unangefochtene Meister in der Bestimmung von Steinen und dem Auffinden von Edelsteinminen und Erzadern. Sie verstehen sich insbesondere auf den Bergbau und die damit verbundenen Handwerke. Beim Auffinden und Bearbeiten von Mondstein spielen die gelehrten Zwerge in ganz Dragorea eine große Rolle.
education.moonreader.descr=Die Mondleser Farukans sind lorakisweit bekannt für ihr immenses Wissen über die Gestirne und die Laufbahnen der Monde. Dabei verbinden sie die exakte Wissenschaft der Mathematik und Physik mit der prophetischen Deutung von Himmelserscheinungen als Zeichen der Götter. Man sagt, sie wissen in allen Lebenslagen anhand der Sterne und Monde den Weg zu weisen.
education.guardianofforefathers.descr=Die Ahnenwächter aus Fedirin sind ein Nurghon-Kult, der sich um die ruhelosen Seelen Verstorbener kümmert. Sie helfen den Totengeistern, unerfüllte Pflichten zu erfüllen, ihren Namen wieder reinzuwaschen oder die Ehre ihrer Familie wiederherzustellen. Dabe vermitteln sie auch zwischen den Ahnen und ihren Angehörigen, sollte ein ungelöster Konflikt Grund für die Rastlosigkeit einer Seele sein. Ahnenwächter sind zudem ausgezeichnete Geister- und Totenbeschwörer, würden jedoch nie eine Seele gegen ihren ausdrücklichen Willen unter ihren Bann stellen.
education.penitentofronash.descr=Im Namen Ronash, dem gefallenen Splittermond, der von seiner Mutter Tayru erschlagen wurde, hat sich in Ashurmazaan ein Büßerkult gebildet, in dem sich Entehrte aus allen Schichten zusammenfinden, die ihre Pfauenfedern aufgrund von Fehlttritten abgeben mussten und nun ihren Ruf durch gute Taten wieder reinwaschen wollen. Als wahrhaft Reumütige sind die Büßer oft ein Musterbeispiel an gelebter Selbstlosigkeit und eilen in Not Geratenen stets zur Hilfe. Manche geben in ihrem Streben nach Wiedergutmachung aber auch gefragte Söldner für die eher unangenehmeren Aufgaben ab, die ein ehrbarer Farukani niemals tun würde. Das Zentrum des Kultes liegt in Baghatir, in der berüchtigten "Stadt der Ehrlosen". 
education.pardashpriest.descr=Entlang des gewaltigen Pardash, aber auch der anderen großen Flüsse Farukans, ist es nicht unüblich, auf die den Fluss selbst als Gott verehrenden hilfsbereiten Pardashpriester zu treffen, die nomadenhaft an den Ufern wandern oder in ihren kleinen Booten durch die segensreichen Fluten des großen Flusses pflügen. Pardashpriester vereinen die Kenntnisse eines versierten Wasserrufers mit magischer Heilung, ergänz mit profanem Wissen über Naturkunde und traditionellem Ackerbau. Auch sonst sind sie beim Volk gern gesehene Gäste, gelten sie doch als gesellige Frohnaturen. 
education.cleanerofwritings.descr=Nach dem Krieg der Götter gründeten sich in Demerai verschiedene Nahid-Sekten, die im Auftrag des Rates des Verschleierten allen Umtrieben der verbotenen Uryat-Priesterschaft ein Ende setzen sollen. Eine von ihnen sind die Säuberer der Schriften, die in alten Archiven, Bibliotheken, aber auch Privatsammlungen nach Schriften suchen, in der das Wort Uryats verkündet wird. Ihr Ziel ist es, sämtliche schriftlich festgehaltene Erinnerung an die böse Göttin auszulöschen und sie so zu schwächen und letztlich gänzlich zu vernichten. Dazu bedienen sie sich entweder bestimmter Bannzauber, um Textpassagen unleserlich zu machen, zur Not vernichten sie die Schriften aber auch.
education.shanalaybeh.descr=Bei den täglichen Zauberübungen in den Magierakademien Majahds sind kleiner und größere Unfälle an der Tagesordnung und so hat sich in der Stadt schon früh ein Heilerorden gebildet, der sich auf die Versorgung derartiger Verletzungen und Erkrankungen spezialisiert hat. Über die Jahrhunderte haben sich die Shan-Alaybeh zu gefragten Meistern der Heilmagie etabliert, und man kann ihnen im ganzen Land begegnen. In Farukhur unterhalten sie sogar noch eine weitere Schule, die vom Padishah-Hof gefördert wird.
education.watercaller.descr=Die Wasserrufer sind der Natur deutlich zugeneigter als andere Elementaristen Farukans. Sie pflegen einen eher intuitiven Zugang zu ihrem Element, verbringen Stunden schwimmend in den Fluten von Pardash und Ashur, um den magischen Fluss des Wassers zu verinnerlichen, oder tanzen mit Wasserdjinnen im Regen. In ihrer Heimat schätzt man zudem ihre profunden Kenntnisse des Wetters und von Überschwemmungen.

spell.icebridge.descr= Der Zauberer lässt eine vor ihm liegende Wasserfläche auf einer Breite von 1 Meterund einer Läneg von max. 25 Metern \
	mit magischem und unnatürlich stabilem Eis überziehen, das in der Lage ist, Personen zu tragen. Erst bei übermäßiger Belastung (Summe aus GK \
	und Last der darauf befindlichen Personen ist größer als 20) bricht das Eis. Nach Ablauf der Wirkungsdauer verhält sich das Eis, als wäre es \
	natürlicher Art (wird also eventuell von der Strömung fortgetragen oder schmilzt).
spell.icebridge.enhancedescr= Das Eis bricht erst, wenn die Summe aus GK und Last der darauf befindlichen Personen 30 übersteigt.
spell.instrumentwind.descr= Der Zauberer erschafft ein durchscheinendes Instrument seiner Wahl, dessen Töne vom Wind unnatürlich weit getragen werden. \
	Der Zauber kann auch auf ein bestehendes Instrument gesprochen werden, dessen Töne dann ebenfalls unnatürlich weit tragen.
spell.instrumentwind.enhancedescr= Der Zauberer erhält einen stark positiven Umstand, wenn er selbst auf dem erschaffenen oder verzauberten Instrument spielt.
spell.steelshield.descr= Ein Schild wird von der Kraft der Felsen durchdrungen, wodurch seine Härte um 2 Punkte steigt. Außerdem steigt ein vorliegendes \
	Merkmal Defensiv um eine Stufe.
spell.steelshield.enhancedescr= Ein verzauberter Schild ist immun gegen die Meisterschaft Schildbrecher.
spell.windboots.descr= Mit diesem Zauber belegte Stiefel oder Schuhe lassen den Träger von den Winden tragen, was ihm einen Bonus in Höhe von 1 Punkt \
	auf seine Geschwindigkeit verleiht. Weiterhin erhält der Träger einen Bonus in Höhe von 3 Punkten auf alle Proben zum Springen \
	(siehe Splittermon: Die Regeln S.107) und muss beim Springen nur für jeden weiteren Meter (statt wie sonst pro weiterer 50 cm) \
	die Schwierigkeit der Probe erhöhen.
spell.windboots.enhancedescr= Der Bonus auf Proben zum Springen erhöht sich auf insgesamt 5 Punkte.

mastership.arcanelore.elementary_artifact_builder.desc=Der Zauberer hat die Schaffung elementarer Artefakte studiert. Die Artefakttqualität / Der Zaubergrad von ihm geschaffener Strukturgeber / Schriftrollen gilt für die Bestimmung der Kosten und der Schwierigkeit als um 1 Punkt reduziert, sofern er Zauber der Schulen Fels-, Feuer-, Wasser- oder Windmagie in die Artefakte einbindet.
mastership.history.i_know_a_story.desc=Der Gelehrte kennt viele Geschichten, aus denen er Wissen für verschiedene Situationen ziehen kann. Einmal pro Spielabend kann er bei einer beliebigen Probe, bei der Zusammenarbeit möglich ist, mittels Geschichte und Mythen statt mit der eigentlich verwendbaren Fertigkeit unterstützen.
mastership.history.treasure_hunter.desc=Der Abenteurer hat ein besonderes Gespür dafür, die Vorzüge und die Bedeutung alter Relikte herauszustellen und diese so zu Geld zu machen. Er kann Geschichte und Mythen nutzen, um Verkaufsgespräche zu führen und um einen Preis zu feilschen (siehe Splittermond: Die Regeln S.110), sofern der Gegenstand um den es geht mindestens 25 Jahre alt ist.
mastership.countrylore.jurist.desc=Der Abenteurer kennt sich mit Recht und Gesetz vieler Länder aus. Er erhält einen Bonus in Höhe von 3 Punkten auf passende Proben auf Länderkunde, Diplomatie oder Straßenkunde, etwa um juristische Verhandlungen zu führen, die Gesetzeslage vor Ort einzuschätzen oder ähnliches.
mastership.nature.zoologist.desc=Der Abenteurer hat sehr viel über Gefahren von Tieren gelernt. Er kann einmal pro Tag mit einer Naturkunde-Probe gegen 15 (plus vierfacher Einzelwesen-Monstergrad) einen Widerstandswert, die Lebenspunkte, den Angriffswert oder alle Typen eines von ihm an diesem Tag beobachteten Wesen des Typus Tier erfahren (sofortige Reaktion von 0 Ticks Dauer). Pro Erfolgsgrad kann der Abenteurer eine weitere der genannten Informationen erhalten.
mastership.stonemagic.warrior_of_rocks.desc=Der Abenteurer erhält auf Angriffe gegen Wesen des Typus Felswesen einen Bonus in Höhe von 3 Punkten.
mastership.firemagic.warrior_of_flames.desc=Der Abenteurer erhält auf Angriffe gegen Wesen des Typus Feuerwesen einen Bonus in Höhe von 3 Punkten.
mastership.watermagic.warrior_of_waves.desc=Der Abenteurer erhält auf Angriffe gegen Wesen des Typus Wasserwesen einen Bonus in Höhe von 3 Punkten.
mastership.windmagic.warrior_of_winds.desc=Der Abenteurer erhält auf Angriffe gegen Wesen des Typus Windwesen einen Bonus in Höhe von 3 Punkten.

material.fog_marble.desc=Der in den Nebelhöhlen Aitushars abgebaute Nebelmarmor ist in ganz Farukan als Baumaterial und Rohstoff für Bildhauer beliebt, lässt er sich doch hervorragend mittels Felsmagie oder durch dienstbare Felsgeister formen und bearbeiten. Der Sage nach ist er entstanden, als in einem Krieg der Djinne einige Wassergeister von Wesen des Felses unter sich begraben wurden. Und in der Tat weist der von bläulichen Bändern durchzogene hellgraue Marmor eine Affinität zu beiden Elementen auf, was Talismane aus Nebelmarmor bei Elementaristen beliebt macht. Noch seltener ist der sogenannte Silberen Nebelmarmor, bei dem metallene Einschlüsse für einen besonderen Glanz sorgen. Nur die reichsten Farukanis können es sich leisten, daraus ganze Gebäude fertigen zu lassen; so besteht etwa ein Turm des Palastes von Farukhur aus diesem Material. Für Talismane ist der Silberne Nebelmarmor aber umso beliebter. /n Materialeigenschaft: Talismane und ähnliche kleine Gegenstände aus Nebelmarmor gewähren dem Träger einen Bonus in Höhe von je 1 Punkt auf Fels- und Wassermagie. Hierbei kann nur von einem solchen Gegenstand gleichzeitig profitiert werden. Talismane aus Silbernem Nebelmarmor verleihen darüber hinaus einen Bonus in Höhe von 1 Punkt auf den Körperlichen Widerstand gegen positionsverändernde Angriffe.
material.silver_fog_marble.desc=Der in den Nebelhöhlen Aitushars abgebaute Nebelmarmor ist in ganz Farukan als Baumaterial und Rohstoff für Bildhauer beliebt, lässt er sich doch hervorragend mittels Felsmagie oder durch dienstbare Felsgeister formen und bearbeiten. Der Sage nach ist er entstanden, als in einem Krieg der Djinne einige Wassergeister von Wesen des Felses unter sich begraben wurden. Und in der Tat weist der von bläulichen Bändern durchzogene hellgraue Marmor eine Affinität zu beiden Elementen auf, was Talismane aus Nebelmarmor bei Elementaristen beliebt macht. Noch seltener ist der sogenannte Silberen Nebelmarmor, bei dem metallene Einschlüsse für einen besonderen Glanz sorgen. Nur die reichsten Farukanis können es sich leisten, daraus ganze Gebäude fertigen zu lassen; so besteht etwa ein Turm des Palastes von Farukhur aus diesem Material. Für Talismane ist der Silberne Nebelmarmor aber umso beliebter. /n Materialeigenschaft: Talismane und ähnliche kleine Gegenstände aus Nebelmarmor gewähren dem Träger einen Bonus in Höhe von je 1 Punkt auf Fels- und Wassermagie. Hierbei kann nur von einem solchen Gegenstand gleichzeitig profitiert werden. Talismane aus Silbernem Nebelmarmor verleihen darüber hinaus einen Bonus in Höhe von 1 Punkt auf den Körperlichen Widerstand gegen positionsverändernde Angriffe.
material.peacocksteal.desc=Weit über die Grenzen Farukans wird der blau-grünlich schimmernde Pfauenstahl geschätzt. Geschmiedet wird er aus dem Erz der östlichen Qaflaban-Berge und jeder, der es abbaut, muss dem Padishah die Hälfte seiner Funde als Tribut überlassen . Reiche Farukanis nutzen das Material gerne für Schmuck, etwa für Broschen in Form von kleinen Pfauenfedern, die man statt der echten Federn auf langen und beschwerlichen Reisen tragen kann. Doch wahre Kenner nutzen Pfauenstahl lieber für Waffen, denn das Schimmern vermag durch die richtige Verarbeitung noch verstärkt zu werden, sodass sich damit Gegner verwirren lassen. /n Materialeigenschaft: Nahkampfwaffen aus Pfauenstahl benötigen nur einen Punkt Qualität (statt normalerweise zwei), um die Verbesserung Verbessertes Ablenken zu erhalten.

