mastership.diplomacy.herold.desc=Der Abenteurer kennt sich besonders gut mit Farben und Wappentieren des Adels aus und weiß dies gewinnbringend einzusetzen. Er kann auf höfischem Parkett oder vor geeignetem Publikum (etwa bei einem Turnier) eine kontinuierliche Aktion von 10 Minuten Dauer unternehmen, um sich oder einen anderen freiwilligen Anwesenden mit seinem Wissen glänzen zulassen oder das eigene Haus und sein ehrbares Wappen entsprechend anzupreisen. Dafür ist eine Diplomatie-Probe gegen 25 nötig, bei deren Gelingen das Ansehen des Nutznießers für die Dauer des Aufenthalts (maximal 1 Woche) um 1 Punkt steigt.\nEs kann nur eine Person gleichzeitig von einem solchen Bonus profitieren.
mastership.determination.spotlightUsed.desc=er Abenteurer ist es gewohnt vor großem Publikum zu stehen. Solange er vor mindestens 20 ihm nicht näher bekannten Leuten auftritt (egal ob er ein Lied vorträgt, eine öffentliche Rede hält oder ähnliches), erhält er einen leicht positiven Umstand auf entsprechende direkt zu seinem Auftritt gehörenden Proben (etwaige negative Umstände werden dadurch nicht aufgehoben, aber mit dem positiven Umstand verrechnet).
mastership.athletics.joustingArmorMastery.desc=Der Abenteurer ist in der Lage, die schwere Last einer Rüstung auf dem Rücken eines Reittiers besser zu stemmen. Solange er beritten ist, wird er nur von der halben Behinderung seiner Rüstung beeinträchtigt.
mastership.athletics.horsebackShieldBlock.desc=Der Kämpfer hat gelernt, berittenen Angriffen durch seinen Schild die Wucht zu nehmen. Wenn er von einem berittenen Angriff mit einer Reiterwaffe angegriffen wird und einen Schild führt (also auch bei einem Lanzenangriff beim Tjost), erhält er automatisch 2 Punkte Schadensreduktion.
mastership.animals.jousting.desc=Mit diesen Meisterschaften lassen sich grundsätzlich Nahkampfwaffen und Schilde mit den Merkmalen Reiterwaffe bzw. Reiterschild auch jeweils einhändig und gemeinsam im berittenen Kampf führen, so dass das Pferd weiterhin gelenkt werden kann. Allerdings sind bei gemeinsamer Führung nur noch das Manöver Vorstürmen (mit einem Mindestanlauf von 5 Metern) oder ein Tjostangriff möglich.
mastership.opticalAdaption.desc=Der Zaubernde hat gelernt, seine Zauber (und bei Beherrschung der Meisterschaft Projektion auch seine Imago) optisch zu verändern. Er kann bei der Zauberprobe erlangte EG zusätzlich zu den bisherigen Einsatzmöglichkeiten wie folgt verwenden, um Zauber optisch zu verändern (wobei nur eine Option gleichzeitig gewählt werden kann):\n* 1 EG: einen Zaubereffekt stark ein-/umfärben (etwa einen Flammenstrahl in Blautönen statt in Rot- oder Orangetönen leuchten zu lassen; hierdurch ist es nicht möglich, den Effekt weniger sichtbar zu machen als zuvor). Dies gilt gleichzeitig als leicht negativer Umstand zur Identifizierung des Zaubers.\n* 2 EG: einen unsichtbaren Zaubereffekt sichtbar machen (etwa eine magische Rüstung an der Imago). Dies gilt gleichzeitig als leicht positiver Umstand zur Identifizierung des Zaubers.\n* 3 EG: einen Zaubereffekt anders visualisieren als üblich (etwa einen Flammenstrahl in eine Fontäne roter Sternchen verwandeln). Dies gilt gleichzeitig als stark negativer Umstand zur Identifizierung des Zaubers.
mastership.projection.desc=Der Zauberer kann in einer rituellen Handlung mithilfe des alchimistischen Stoffes Seelentor (oder eines vergleichbaren Hilfsmittels) seine Imago materialisieren. Er legt hierzu eine Probe auf die jeweilige Magieschule gegen 20 ab. Anschließend muss er K12V3 Punkte Fokus kanalisieren, um die Imago zu manifestieren. Weitere Fokuspunkte können kanalisiert werden, um die Werte der Imago zu verbessern, bevor die Imago anschließend im Wettstreit gegen andere Imagines eingesetzt wird (siehe Seite 109).
mastership.imagoMastery.desc=Der Zauberer kann für EG aus der Probe zur Projektion zusätzlich zu seinen normalen Optionen (siehe S. 109) sein Imago mit unten genannten Verbesserungen versehen. Auf jedem Heldengrad öffnen sich ihm neue Verbesserungen, außerdem kann jede Verbesserung einmal pro Heldengrad angewendet werden. Ein Magier des 4. Heldengrades könnte seinem Imago also durch Aufwendung von 4 EG viermal die Verbesserung Bollwerk verleihen.

feature.ridershield.desc=Solange der Träger eines Reiterschilds beritten ist, erhöht sich der VTD-Bonus des Schildes um 1. Außerdem ist die Behinderung des Schildes zu Pferd um 1 Punkt reduziert.
feature.riderarmor.desc=Die Behinderung einer Rüstung mit diesem Merkmal ist für einen berittenen Träger um 2 Punkte reduziert. Zudem erhält er einen Bonus in Höhe von 2 Punkten auf alle Proben, bei denen es darum geht, im Sattel zu bleiben.
feature.fragile.desc=Ein Gegenstand mit diesem Merkmal zerbricht üblicherweise bei der ersten Anwendung, sofern nicht besondere Anstrengungen unternommen werden, dies zu verhindern.

education.arcanesage.descr=Vielen Zauberwirkern genügt es, einen magischen Effekt hervorrufen zu können. Arkane Gelehrte jedoch beschäftigen sich mit den Fragen nach dem Wie und Warum. Getrieben von Wissensdurst erforschen sie sowohl die natürliche als auch die magische Welt. Den größten Teil ihrer dabei gewonnenen Erkenntnisse schreiben sie nieder und füllen nach und nach ihre Studierstuben und lorakische Bibliotheken mit Folianten und Schriftrollen, etwa über die Thesen der magischen Abweichung, die Theorien kosmologischer Mächte oder die neusten Erkenntnisse zum Wirken mächtigster Rituale.
education.circlefirsthouse.descr=Der Zirkelmagier des ersten Hauses, des Hauses des Geistes, studiert das Denken und die Psyche anderer Lebewesen. Er ist ein Meister der Verständigung, der Hellsicht – und manchmal auch der Manipulation. Seine Fähigkeiten machen ihn zu einemgeschätzten Berater an den Höfen Selenias und in fernen Ländern, doch bevorzugt er meist, im Hintergrund zu bleiben und von dort aus zu beobachten.
education.circlethirdhouse.descr=Der Zirkelmagier des dritten Hauses, des Hauses des Kosmos, erforscht die Zusammenhänge der Welt, das Wesen der Götter und die Natur der Dinge. Das Volk sieht ihn oft als Prophet oder Wahrsager, denn häufig lassen ihn seine Erkenntnisse und Theorien von Ort zu Ort ziehen, um dort das Schicksal der Ahnungslosen zum Positiven zu wenden oder es lediglich zu studieren.
education.morkaipriest.descr=Den Morkai-Priester hingegen reizt das Ungewisse, das Geheimnis. So findet man ihn meist an dunklen gefährlichen Orten, etwa in einer alten Ruine oder auch der Höhle einer magischen Bestie. Getrieben von der Neugier seines Gottes, nimmt er gerne den schnellen Erkenntnisweg und testet vieles einfach aus, statt es lange theoretisch zu studieren.

education.showman.descr=Während manche Kinder eher zurückhaltend und schüchtern sind, suchen andere stets die Aufmerksamkeit aller Anwesenden. Sie sind laut, auffallend und genießen es, im Mittelpunkt zu stehen. Jene Kinder sind es, die später einmal gute Schausteller werden. Ob auf einer Festbühne, in einer gut gefüllten Schänke, mitten auf einem Marktplatz oder während eines Banketts bei Hofe, Schausteller verstehen es, mit ihrer Kunstfertigkeit andere zu begeistern und die Aufmerksamkeit ganzer Massen zu binden. Jongleure und Artisten faszinieren durch ihr Geschick, Geschichtenerzähler entführen in fremde Welten, Sänger können durch ihre Lieder Gemüter beeinflussen und Mimen beherrschen die Kunst der Verstellung.
education.minstrel.descr=Die Minnesänger des zentralen Dragorea sind bestens bewandert in der Politik der Provinzen. Sie kennen Adelshäuser und Wappen und manch schlüpfriges Geheimnis, mit dem sie die feine Gesellschaft bei Hof unterhalten können. Vor allem aber verstehen sie es, das Publikum in ihren Bann zu ziehen und die Gefühle ihrer Mitmenschen zu beeinflussen.
education.bard.descr=Die Sangesgesellen aus Selenia und Nyrdfing ziehen wie Handwerksgesellen von Ort zu Ort, um neue Lieder, Gedichte, Geschichten und Sagen zu erlernen, bevor sie sich (wenn überhaupt) irgendwo niederlassen. Häufig dienen sie hierbei auch als Nachrichtenüberbringer, und für abgelegene Dörfer ist der Besuch eines solchen wandernden Barden meist die einzige Möglichkeit, Neuigkeiten aus anderen Regionen zu erhalten.
education.jester.descr=Hofnarren gibt es nicht nur in Selenia, sondern auch an vielen anderen Fürstenhöfen, aber gerade hier genießen sie die sprichwörtliche „Narrenfreiheit“ und unterhalten Höflinge und Adel gleichermaßen mal mit albernen Kunststücken, mal mit spitzzüngigem Wortwitz.

education.drugonjourneyman.descr=Drugonsgesellen sind gern gesehene Handwerker, die Drugon zum Gefallen umherreisen und ihre Fähigkeiten jedem anbieten, der sie benötigt. Gerade die einfachen Leute schätzen diese Priester wegen ihrer praktischen Art und ihrem freundlichem Auftreten. Zudem sind die Drugonsgesellen auch zu Hilfen bereit, die über das Ausüben ihres bevorzugten Handwerks hinausgehen: Sie helfen bei der Ernte, suchen nach Vermissten und beschützen auch schon mal ein Dorf vor wilden Monstern oder Räubern.
education.caransassassin.descr=Caran ist als zwielichtiger Gott des Wettstreits und des Spiels im ganzen Land bekannt. Es gibt jedoch auch einen geheimen Kult von Meuchlern, die ihn verehren und im dauernden Wettstreit untereinander ihr grausames Werk verrichten. Diese im Untergrund agierenden Priester des Gottes erkennen sich anhand ihrer schwarzen Dolche, wobei es sich dabei um eine wirkliche Waffe, ein Amulett oder eine Tätowierung handeln kann. Sie sind Meister der Heimlichkeit, lautlos wie ein Schatten und mit der Klinge schnell wie eine zustoßende Schlange. Der Kult besteht aus Gleichgesinnten und weist keine geordnete Hierarchie auf – und gemein ist ihnen nur, dass sie jenen nach dem Leben trachten, die den Lehren ihres Gottes spotten, vor allem die Diener der dunklen Göttin Iosaris.
education.yonnuspriest.descr=Der Yonnus-Kult hat großen Einfluss in Selenia. Priester des Herrn der Monde stehen vielen Fürsten als Berater zur Seite und genießen zahlreiche Privilegien. Neben ihrer guten Bildung vermögen die Yonnus-Anhänger in den Sternen die Zukunft zu lesen und sind Meister der Schicksalsmagie. Die häufig ernst auftretenden Priester und Priesterinnen strahlen Ruhe aus und wählen ihre Worte meist mit Bedacht, wodurch sie es vermögen, die Trauernden zu trösten und die Furchtsamen zu ermutigen.
education.priesthelphand.descr=In diesem Orden versammeln sich sowohl Diener der Fleadyne als auch des Gunwar. Priester der Helfenden Hand dienen ihren Göttern in ganz Selenia und darüber hinaus als Heiler und Kräuterkundige. Dabei sind sie sowohl in Ordenshäusern oder Spitälern, als auch unterwegs zu finden, auf der Suche nach Hilfsbedürftigen oder besonderen Kräutern. Obwohl sie eng zusammen arbeiten, teilen sich die Anhänger der beiden Götter ihre Arbeiten auf. Fleadynes Priester beschäftigen sich intensiv mit der Naturmagie, während die Diener Gunwars die Geheimnisse der Todesmagie erkunden.
education.circlesecondhouse.descr=Die sogenannten Körpermagier des zweiten Hauses des Zirkels der Zinne beschäftigen sich mit der Anatomie der lorakischen Völker. Sie sind gut ausgebildete Heiler, die an Höfen dienen, in Städten arbeiten oder aber auch immer wieder auf der Suche nach neuem Wissen mit Abenteurergruppen umherziehen. Diese schätzen nicht nur die Heilkünste der Zirkelmagier, sondern auch ihre anatomischen Kenntnisse, sowie die Unterstützung die sie durch ihre Magie bieten. Doch als nüchterne Wissenschaftler bleibt bei den Magiern die Empathie, die man sonst von einem Heiler erwarten würde, auch schon mal auf der Strecke ...
education.circlefifthhouse.descr=Magier des Naturhauses beschäftigen sich vor allem mit Pflanzen, Tieren und magischen Kreaturen. Sie studieren unterschiedlichste Wesen, zähmen diese oder nehmen durch Verwandlungsmagie einzelne Aspekte oder gar die ganze Gestalt der Tiere an. Entsprechend besitzen Zirkelmagier des fünften Hauses ein großes Verständnis für alles Lebendige. Neben jenen, die sich mit Kreaturen beschäftigen, lenken einige ihr Augenmerk auf die Alchemie.
education.firemercenary.descr=Im Herzen Südfangs, am Fuß des Glühberges, stehen die Kaiserlichen Feuerhallen, in denen seit der Reichsgründung ganz besondere Kämpfer ausgebildet werden. Geübt im Umgang mit verschiedenen Waffen und unterschiedlichen Rüstungen messen sie sich als Kriegerelite mit den Rittern des Reiches, beherrschen aber darüber hinaus die Macht des Feuers. Sie sind den Drill eines Heerhaufens gewohnt und leisten nach ihrem Abgang dem Kaiserreich einen Treueid. So dürfen sie sich zwar frei als Söldner verdingen, doch niemals gegen den Kaiser zu Felde ziehen.
education.sarnburg_defender.descr=Die Wehrschule zu Sarnburg bildet Männer wie Frauen im Umgang mit den typisch selenischen Waffen aus: Neben verschiedenen Stangen- und Schusswaffen vor allem mit dem Breitschwert. Ihr Handwerkszeug verstehen sie zu Fuß und vom Pferderücken aus gleichermaßen einzusetzen, so dass Wehrstreiter es selten schwer haben Arbeit zu finden. Sowohl Händler als auch wohlhabende Reisende zahlen gerne für den Schutz der Krieger, und Fürsten werben mitunter ganze Gruppen an, wenn sie in den Krieg ziehen. Wehrstreiter gelten als stolz und zuverlässig, wenn auch nicht gerade als sehr ritterlich in Kampfweise und Auftreten.