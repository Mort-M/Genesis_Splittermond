material.zofirastears.desc=
material.zofirastears.effect=Gegenstände aus Tränen Zofiras oder mit diesen als Verzierung gewähren ihrem Träger einen Bonus in Höhe von 1 Punkt sowohl auf Feuer- als auch auf Felsmagie. Dabei kann nur von einem Gegenstand gleichzeitig profitiert werden.
material.smaragdzüngler_leather.desc=
material.smaragdzüngler_leather.effect=Rüstungen oder ganze Sätze Kleidung aus dem Leder des Smaragdzünglers besitzen die Verbesserungen Wasserfest (Stufe 1) und Schutz vor Schadensart [Feuer] 1. Dabei kann nicht von Rüstung und Kleidung gleichzeitig profitiert werden. 
material.aschebeißer_leather.desc=
material.aschebeißer_leather.effect=Rüstungen oder ganze Sätze Kleidung aus dem Leder des Aschebeißers verleihen einen Malus in Höhe auf 4 Punkten auf alle Wahrnehmung-Proben um den Träger zu entdecken, sofern dieser sich nicht bewegt. 