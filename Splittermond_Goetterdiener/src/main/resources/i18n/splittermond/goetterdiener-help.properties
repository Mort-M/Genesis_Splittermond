#education.cervaritam.descr=Cervaritam Die Cervaritam beziehen sich auf die Kriegerfürstin Cervaria, die einst mit Gift und Eidbruch ein ganzes Fürstentum auslöschte. \n Die Geschichte des Ordens wird dabei jedoch verklärt und man sieht sich als streitender Arm des Glaubens und Schutzmacht des Matalino-Sumpfes. \n Sie rekrutieren sich zu großen Teilen aus ehemaligen Soldaten, die durch den Fund eines Göttereis zum Glauben fanden und schließlich mit einer Aufgabe Amantias in die Welt geschickt wurden.
