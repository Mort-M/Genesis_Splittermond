education.cervaritam.descr= Die Cervaritam beziehen sich auf die Kriegerfürstin Cervaria, die einst mit Gift und Eidbruch ein ganzes Fürstentum auslöschte. \n Die Geschichte des Ordens wird dabei jedoch verklärt und man sieht sich als streitender Arm des Glaubens und Schutzmacht des Matalino-Sumpfes. \n Sie rekrutieren sich zu großen Teilen aus ehemaligen Soldaten, die durch den Fund eines Göttereis zum Glauben fanden und schließlich mit einer Aufgabe Amantias in die Welt geschickt wurden.
education.servantofrockandflame.descr= Die Diener von Fels und Flamme sind die kopfstärkste Fraktion der Furbrom-Priester. Sie predigen das Ideal der Gemeinschaft der Gläubigen, versinnbildlicht in der Beständigkeit des Steins und der Wärme des Feuers. Einige Furbrom-Priester suchen Orte großer elementarer Macht, um das Wesen der Götter aus ihren Schöpfungen zu deuten. Andere durchstreifen die Welt auf der Suche nach Hinweisen auf jene mythischen Feinde der Zwergenheit, vor denen Furbrom sie einst verbergen musste. 
education.spiderofficer.descr= Die Offiziere der Spinne, wie die Absolventen der Schule der Spinne im Volksmund auch genannt werden, sind eine junge Erscheinung in Palitan. Ausgebildet vom legendären General Zhu LIbei, gelten sie als geschickte und gerissene Anführer und Kämpfer, die dank ihrer Ausbildung auch tief im Feindesland agieren und den Gegener mit gezielten Angriffen und Hinterhalten schwächen.
education.moonwolf.descr= Die Mondwölfe sind streiten im Namen Kronars. Sie folgen aggressiven Trieben und suchen stets nach Kampf und Rausch. Junge Kronarpriester ziehen häufig durch Lorakis auf der Suche nach stärkeren Gegnern und neuen Substanzen, die ihr wildes Gemüt anregen.
education.lyxapriest.descr= Die Priester der Lyxa sind schwer als solche zu erkennen. Als Lyxa-Priester bekannt sind häufig nur jene Personen, die offen auftreten und die sich dem Aspekt der Dramatik und der Geschichten verschrieben haben. Die meisten jedoch bleiben unerkannt. Sie haben eine andere Identität angenommen, und nur selten findet jemand überhaupt heraus, dass er gerade mit einem Priester gsprochen hat. Ihres Erachtens erfüllen sie dennoch eine wichtige Aufgabe: Mit ihren zweideutigen Worten und verstreuten Hinweisen versuchen sie, ihren Mitmenschen dabei zu helfen, zu höherer Erkenntnis zu gelangen.
education.corsairpriest.descr= Die Korsarenpriester der Shar Anar bemühen sich in erster Linie um ein reibungsloses Miteinander und sorgen für den Schutz ihrer Gemeinschaft, sei es die heimische Piratensiedlung oder die eigene Schiffsmannschaft. Aber ihr Sinn für Eintracht schließt selten einmal Gegner auf hoher See oder erbeutete Sklaven mit ein. Nach der Lehre folgen sie in der Regel einem Kapitän und bereisen die Meere. Von nun an ist die Mannschaft ihre neue Gemeinschaft, die sie mit Leib, Säbel und Seele gegen jede Unbill schützen.
education.wingguardian.descr= Der Priester des Skalangor, die im Wächterbund als Schwingenwächter bekannt sind, sehen sich stets als Teil einer Gemeinschaft, die es zu beschützen und zu behüten gilt - sei es ein Trupp Wächter, eine Burggemeinschaft oder eine Abenteurergruppe. Nur Zusammenhalt kann dabei helfen, die Finsternis zu besiegen und so sehen sie es als ihre Berufung an, auch außerhalb des Kampfes stets für die Gruppe einzustehen.
education.enlightenedone.descr= Die Erleuchteten sind weise und empathische Berater in allen Lebenslagen. Von ihrer Göttin wurde ihnen die Gabe verliehen, hinter die Schatten zu blicken und den wahren Grund der Dinge zu erkennen. Tayru-Priester sind an einen strikten Ehrenkodex gebunden und wachen daher streng über die Einhaltung von Gesetzen und dulden keine Frevler oder zwielichtige Gestalten. In seinem Kamf für das Gute und Ehrbare in der Welt kann ein Priester der Tayru ein nützlicher und mächtiger Verbündeter ein Abenteurergruppe sein.
education.servantofape.descr= Diener des Affen reisen in ganz Zhoujiang umher, um die Sterblichen das Lachen ihres Gottes zu lehren. Doch auch in ferne Lande zieht es sie mitunter, ist ihnen doch eine unbändige Neugier zu eigen. Einen Priester des Unggoy muss man nicht zweimal fragen, ob er Lust hat, auf ein Abenteuer auszuziehen. Die Freundschaft eines Priesters des Affen ist mehr wert als alles Gold, was man tragen kann - so sagt man in Zhoujiang. Ihre lustige, jugendliche, nüchterne aber auch wilde Art, das Leben und die Welt zu sehen, mag manchen oft übertrieben oder kindlich erscheinen, aber wer sie einmal näher kennenlernt, wird sie zu schätzen wissen. Sein loses Mundwerk kann seine Gefährten ab und zu in Schwierigkeiten bringen, aber man kann sich stets auf ihn verlassen.
education.zaruszpriestshaman.descr= Die Priesterschamanen sind überaus begabte Heiler und können in dieser Funktion jeder Abenteurergruppe von Nutzen sein. Sie sind eine Mischung aus animistischen Schamanen, wie sie bei den Dschungelvölkern Arakeas vorkommen, und Priestern der Zivilisation. Rätselhafte Rituale und Tänze gehen Hand in Hand mit profunder Kenntnis auch wissenschaftlicher Heilkunde. Zarusz-Priester sind lebensbejahend und schätzen die Natur in jeder Form. Eigennutz und Gewinnstreben sind ihnen ebenso fremd wie Aggressivität oder Heimtücke. Sie sind zupackend, pragmatisch und hilfsbereit und sehen sich nicht nur als Diener einer Göttin, sondern auch als Diener des Lebens un wessen Zeitspanne endet, auf den wartet bereits ein neuer Körper um die wiedergeborene Seele aufzunehmen.
