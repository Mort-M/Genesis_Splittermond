image: maven:3.6-jdk-11

pipelines:
  default:
    - step:
        caches:
          - maven
        script:
          - openssl aes-256-cbc -pass pass:$OPENSSL_PWD -in private-key.gpg.enc -out private-key.gpg -d
          - gpg --import --no-tty --batch --yes private-key.gpg
          - mvn -f Splittermond_Core -s settings.xml -B install -DskipTests=true
          - mvn -f Splittermond_CharGen -s settings.xml -B install -DskipTests=true
          - mvn -f Splittermond_CharGen_JFX -s settings.xml -B verify -DskipTests=true
          - mvn -f Splittermond_BBCode -s settings.xml -B verify -DskipTests=true