education.beastmaster.descr=Die meisten Lorakier kommen in ihrem Alltag immer wieder mit Tieren in Kontakt, gleich, ob es sich dabei um das treue Pferd eines Ritters, das Schoßtier eines reichen Kaufherrn oder den Jagdhund einer Waldläuferin handelt. Doch gibt es auch jene, die eine stärkere Verbundenheit mit Tieren spüren und sie weniger als Mittel zum Zweck sehen, bisweilen sogar an ihrer Seite leben und sie als gleichwertig betrachten. Diese Bestienmeister umgeben sich mit Tieren, die ihnen aufs Wort\u2028gehorchen \u2013 oft weil sie entsprechend abgerichtet oder ihnen durch Magie verbunden\u2028sind. Mitunter akzeptieren die Kreaturen den Bestienmeister aber auch einfach als Anführer und folgen ihm aus freien Stücken. Das Band zwischen ihm und seinen Tieren ist in jedem Fall enger, als dies für die meisten Lorakier gilt. Bestienmeister schätzen dabei häufig wehrhafte Kreaturen, ist doch auch der Kampf Teil der tierischen Natur. Wer sich ihnen in den Weg stellt, der sieht sich schnell nicht nur einem einzelnen Kämpfer gegenüber, sondern einem ganzen Rudel, das sich zähnefletschend auf jeden Gegner stürzt. Auch deshalb sind Bestienmeister in Heerhaufen und Söldnertruppen beliebt, wo sie dann häufig Kampfhunde oder andere Kriegsbestien ausbilden und in den Kampf führen. Viele Bestienmeister leben in der freien Natur an der Seite ihrer tierischen Begleiter, andere ziehen aber auch in die Welt hinaus \u2013 nicht selten dem Drang folgend, immer neue Tiere zu entdecken, mit denen sie sich seelenverbunden fühlen. Dabei kommt ihnen neben ihren Fähigkeiten in der Wildnis auch ihre Kenntnis der Naturmagie zu Gute, mit der sie nicht nur Tiere bezaubern, sondern auch anderweitig die Wildnis nach ihrem Willen formen können.
education.asatii.descr=Rund um das Binnenmeer erzählt man sich unglaubliche Ge- schichten über die Asatii, die Bestienmeister der Dämmeralben: Sie sollen auf Schattenpanthern durch den Dschungel reiten, ganze Vogelschwärme an sich binden und selbst die größten Monstrositäten ihrer Heimat unter ihre Kontrolle bringen. Dabei zwingen die Asatii den Tieren niemals ihren Willen auf. Vielmehr verstehen sie sich darauf, von den gefährlichsten Kreaturen als Gefährten akzeptiert zu werden und mit diesen gemeinsam in den Kampf zu ziehen.
education.bloodrider.descr=Bei den Steppenvölkern der Chorrashiten, Jagoden und Jogdaren ist die Blutsbrüderschaft weit verbreitet. Ab und an kommt es vor, dass ein Krieger sich nicht an einen Stammesgenossen bindet, sondern als Blutreiter eine Blutsbrüderschaft mit seinem Reittier eingeht, das er fortan als seinen Bruder oder seine Schwester betrachtet. Diese Pferde oder Ponys sind ebenso furchtlos und wild wie ihre Reiter.
education.shadowsnake.descr=In ganz Zaruszai genießen die Schattenschlangen hohes Ansehen, versuchen sie doch al- leine in der Wildnis der Weltenschlange Zarusz nahezukommen und ihren Willen zu ergründen. Dabei haben sie nicht nur tiefe Kenntnis der Dschungel erlangt, sondern auch profundes Wissen auf dem Gebiet der Gifte erworben.
education.animalmagician.descr=In Sadu werden seit Jahrhunderten die Tierzauberer von vielen mit Ehrfurcht betrachtet. Diese leben abseits der Städte in der Wildnis und suchen dort die Nähe der Bestien, um sie mittels ihrer Magie an sich zu binden. Sie können sich im Kampf zwar auch selbst wehren, bevorzugen es aber, ihre Tierbegleiter magisch verstärkt in die Schlacht zu schicken \u2013 und mehr als ein Kriegsfürst der streitenden Fürstentümer hat bereits vergeblich versucht, sie auf seine Seite zu ziehen.
education.animalleader.descr=So unterschiedlich wie die lorakischen Völker sind auch die Tiere, mit denen sie ihr Leben teilen. Zucht und Haltung von Nutztieren ganz verschiedener Arten sind weit verbreitet, bei weitem nicht nur zum Zweck der Ernährung: Zug- und Tragtiere, Jagdbegleiter, dressierte Possenreißer oder Wachkreaturen sind nützliche Begleiter oder gar Gefährten. Häu g dient die Ausbildung eines Tieres zwar kriegerischen Zwecken, doch gibt es vor allem in den zivilisierteren Teilen von Lorakis Spezialisten, die sich aus ganz anderen Gründen mit Kreaturen umgeben. Tierführer verstehen es meisterhaft, die Faszination, die manch ein animalischer Begleiter ausstrahlt, zu ihren Gunsten zu nutzen, sei es als Unterstützung eines Zaubers, als Ablenkung oder als Schlüssel zu den Herzen und Sinnen eines gehobenen Publikums. Die einzelnen Formen der Tierführung sind sehr unterschiedlich und in vielen Fällen kulturell geprägt, doch zeichnet ein stilles Einverständnis die meisten Verbindungen zwischen Tierführern und ihren Kreaturen aus. Es sind daher oft sensible Personen mit einem Gespür für Stimmungen und mit ausgeprägten Kenntnissen von Lebewesen und natürlichen Zusammenhängen, denen es gelingt, ein inniges Band mit einem Tier aufzubauen. Manche konzentrieren ihre Arbeit dabei auf einen einzigen Gefährten, während andere ganze Rudel oder Schwär- me kontrollieren. Dressurtechniken und ähnliche Spezialfähigkeiten werden mancherorts an Schulen unterrichtet, üblicher- weise aber von Meister zu Schüler weitergegeben. An solchen Orten werden die tierischen Begleiter auch oft gezüchtet, denn mit solchen Tieren lässt sich die Dressur besonders gut erlernen. Die Intuition dagegen, die man für die Arbeit mit Wildtieren benötigt, und das gewisse Etwas, das diese Tiere zu einem zweibeinigen Gefährten hinzieht, ist jedoch ein Geburtsgeschenk und durch noch so viel Übung nicht aufzuwiegen. Viele Tierführer ziehen ein Leben lang umher, von Stadt zu Stadt, immer auf der Suche nach neuem Publikum, sei es damit die Faszination ihrer seltenen Tiere erhalten bleibt oder auch damit ihre Tricks unerkannt bleiben. Andere Tierführer streifen durch die entlegene Wildnis, stets auf der Suche nach neuen außergewöhnlichen Kreaturen, die sie an sich binden wollen.
education.monkeyhand.descr=Vielerorts in Lorakis begegnet man Straßenkünstlern. Be- rühmt, aber auch verschrien, sind die sogenannten Affenhände aus Farukan: Darsteller, die mit einem kleinem Tier, meist einem A en, zusammenarbeiten. Das Tier ist dazu erzogen, Tricks vorzuführen oder durch sein niedliches Wesen selbst abzulenken, während schnell die Hand seines Herren im Beutel eines Zuschauers verschwindet.
education.butterflydancer.descr=An der Ostküste von Lorakis, von den Schwertalben im Norden bis zu den Stromlandinseln im Süden, bieten an Höfen und auf Märkten die Schmetterlingstänzer ihre Kunstfertigkeit dar. Mit grazilen Bewegungen ihres Körpers lenken sie einen Schwarm leuchtend bunter Falter und entfachen auf diese Weise dessen magisches Potential. Fremde werden gewarnt, dass der Tanz den Geist verwirren und Zuschauer über Stunden fesseln kann.
education.pigeonking.descr=Die Tiere der mertalischen Taubenkönige dagegen bleiben meist ungesehen. Oft sind Tauben, aber auch Schlangen, Katzen, Feenhörnchen, Flederwölfe und vielerlei mehr Augen und Ohren für ihren Ausbilder. Manche dieser Informationssammler stehen im Dienst eines hohen Adligen, andere tragen die Früchte ihrer Arbeit selbst zusammen, um sie dann meistbietend zu verkaufen.

creaturemodule.agile.desc=
creaturemodule.fast.desc=
creaturemodule.tough.desc=
creaturemodule.strong.desc=

creaturemodule.familiar.desc=Familiare sind Zauberwesen und die Vertrauten begabter Zauberer. Die klassische Hexenkatze nimmt diese Rolle ebenso ein wie der tiergestaltige Spion eines Hellsehers oder die besonders kluge Eule eines Rahidi-Priesters.
creaturemodule.combatanimal.desc=Kampftiere werden darauf abgerichtet, sich mit anderen Wesen zu messen: Hüte- und Wachhunde, Kriegsfalken, Kampfhähne und für den Krieg abgerichtete Bestien fallen darunter.
creaturemodule.packanimal.desc=Das Zugpferd, der Lastenesel oder der Ochse unter dem Joch sind klassische Beispiele für Lasttiere. Achtung: Um aus einem Last- ein Reittier zu machen, ist ein weiteres Modul im nächsten Generierungsschritt vonnöten!
creaturemodule.mascot.desc=Das Maskottchen wird in der Regel weniger aus praktischen Erwägungen als aus reiner Freude an seinem Anblick, seinem Wohlklang oder seinen possierlichen Tricks gehalten. Singvögel und  ndige Äffchen fallen beispielsweise in diese Kategorie.
creaturemodule.seeker.desc=Sucher werden zum Aufspüren aller möglichen Dinge eingesetzt: Blut- und Fährtenhunde, Jagdfalken, Magieschnüffer und Trüffelschweine, aber auch Brieftauben und andere tierische Boten nehmen diese Rolle ein.

creaturemodule.tiny.desc=
creaturemodule.small.desc=
creaturemodule.big.desc=
creaturemodule.huge.desc=
creaturemodule.colossal.desc=Die Kreatur verfügt aufgrund ihrer Größe oder ihres Körperbaus über mehrere voneinander unabhängige Angriffsarten und wird nach den Regeln für Kolosse (siehe Splittermond - Die Regeln, S. 171) behandelt.
creaturemodule.shrink.desc=Die Kreatur kann eine kleinere, harmlose Gestalt (zwischen GK 1 und GK 3) annehmen. In der kleinen Form gelten folgende Modifikationen: AUS +2, Heimlichkeit +5, die Werte entsprechen denen aus Basis, Rolle und etwaigen magischen Fähigkeiten. AUS, INT, VER, WIL bleiben erhalten. Furchteinflößend (und änliche Fägkeiten) entfällt. Fliegend oder andere Bewegungsarten bleiben erhalten.
creaturemodule.fairybeing.desc=
creaturemodule.ghost.desc=
creaturemodule.collective.desc=Das Wesen ist ein Kollektiv: Auch wenn es aus einer Vielzahl einzelner gelöster Körper besteht, teilen diese sich nur einen einzigen Geist. Sie können sich nur einheitlich bewegen und handeln. Die einzelnen Teile können sich nicht weiter als 5m voneinander entfernen.
