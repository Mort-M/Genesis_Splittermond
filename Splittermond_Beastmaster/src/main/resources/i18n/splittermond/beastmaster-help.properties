creaturemodule.flyer.desc=
creaturemodule.swimmer.desc=
creaturemodule.underwater_creature.desc=
creaturemodule.observer.desc=
creaturemodule.envoy.desc=
creaturemodule.hunter.desc=
creaturemodule.helper.desc=
creaturemodule.linguistically_gifted.desc= Besonderheit: Die Kreatur kann im Rahmen ihrer tierischen und geistigen Fähigkeiten in einer Sprache sprechen. Wirkliche Kommunikation ist nur möglich, wenn die Kreatur auch "Vernunftbegabt ist.
creaturemodule.rational.desc=Besonderheit: Die Kreatur verfügt über menschliche Intelligenz. Sie ist in der Lage, Sprache zu verstehen, kann aber nicht über Tierführung ausgebildet werden. Sie lernt künftig wie andere vernunftbegabte Wesen auch (orienteren sich gegebenfalls an der Ressource Gefolge).
creaturemodule.strong_minded.desc=
creaturemodule.agressiv.desc=
creaturemodule.threatening.desc=
creaturemodule.blood_rage.desc=
creaturemodule.trap.desc=Merkmal Falle siehe Liste S.57 im Bestienmeister Heft. Dieses Merkmal kann mehrmals gewählt werden.
creaturemodule.toxic.desc=Merkmal Gift aus der Liste auf S. 57 im Bestienmeister Heft.
creaturemodule.defender.desc=
creaturemodule.teeth_and_claws.desc=Die Kreatur kann in Absprache mit dem Spiellieter die Kampfmeisterschaft einer anderen Kampffertigkeit statt der Meisterschaft in Kampfgemenge erlernen.
creaturemodule.steeped_in_magic.desc=
creaturemodule.additional_spell.desc=
creaturemodule.artist.desc=Besonderheit: Die Kreatur kann ohne sprach- oder vernunftbegabt zu sein Lied-Meisterschaften aus Darbietung nutzen, wenn ihr Besitzer anwesend ist, um den Inhalt und Zweck des Liedes deutlich zu machen.
creaturemodule.gorgeous.desc=
creaturemodule.circus_animal.desc=
creaturemodule.shapeshifter.desc=Das Wesen kann eine weitere Gestalt annehmen. Die zweite Gestalt ist quasi eine eigene neue Kreatur, für die auch erneut Punkte ausgegeben werden müssen. Wenn das Wesen also eigentlich eine kleine Kreatur (Wert 2) ist, die sich in eine größere Kampfform verwandeln kann (Wert 4), müssen insgesamt 6 Punkte ausgegeben werden. Dies erfordert in jedem Fall die Zustimmung des Spielleiters, wobei etwaige Richtlinien zu Schwellenwerten (siehe S. 51) für jede Form separat gelten. Achten Sie hierbei darauf, dass die geistigen Attribute der zweiten Form denen der ersten Form ähnlich sind, sofern es nicht gewünscht ist, dass beispielsweise die kleine Form ein intelligenter Berater und die große Form ein zorniger Kämpfer ist.
creaturemodule.mount.desc=
creaturemodule.mount_diving.desc=
creaturemodule.mount_flying.desc=
creaturemodule.disembodied.desc=
creaturemodule.fragil.desc=
creaturemodule.immune.desc=
creaturemodule.resistent.desc=
creaturemodule.strong_and_weak.desc=Besonderheiten: Bei dieser Eigenschaft sollte darauf geachtet wer-den, die Häufigkeit der beiden Schadensarten im Spiel vergleichbar zu halten. Der Spielleiter hat hier das letzte Wort.
creaturemodule.vulnerable.desc=
creaturemodule.tough_option.desc=

creaturemodule.distract.desc=Das Tier hat gelernt, für Ablenkung zu sorgen. Dies erfordert eine kontinuierliche Aktion von 10 Ticks Dauer und eine vergleichende Probe auf eine passende Fertigkeit (z.B. Akrobatik, Athletik oder Darbietung) gegen die Entschlossenheit des Ziels. Gewinnt das Tier, erhält das Ziel einen leicht negativen Umstand auf seine nächste Probe. Dies bleibt maximal bis zum Ende der Szene bestehen.
creaturemodule.wreak_havok.desc=Die Ablenkung des Tiers ist richtig auffällig. Dies erfordert eine kontinuierliche Aktion von 15 Ticks Dauer und eine vergleichende Probe auf eine passende Fertigkeit (z.B. Akrobatik, Athletik oder Darbietung) gegen die Entschlossenheit der Ziele. Maximal können AUS +1 Ziele betroffen werden. \nWem die Probe misslingt, der erhält einen leicht negativen Umstand auf seine nächste Probe. Dies bleibt maximal bis zum Ende der Szene bestehen.
creaturemodule.big_tricks1.desc=
creaturemodule.big_tricks2.desc=
creaturemodule.stabilized.desc=
creaturemodule.basic_messenger.desc=Das Tier kann von einem Ort zu einem ihm bekannten und eingeprägten anderen Ort reisen. Dort kann es etwas an eine Person abgeben oder hinterlassen, so ihm etwas mitgegeben wurde.
creaturemodule.basic_thief.desc=Das Tier hat gelernt Dinge zu stehlen. Hierfür wird Fingerfertigkeit verwendet.
creaturemodule.basic_hoarder.desc=Das Tier kann einen Gegenstand an einem abgelegenen Ort verstecken und bei Bedarf zurückholen.
creaturemodule.basic_combatcomp.desc=Das Tier nimmt bereitwillig an Kämpfen teil.
creaturemodule.basic_scout.desc=Das Tier hat gelernt zu kundschaften. Der Tierführer kann es ausschicken, um es nach bestimmten Angaben Ausschau halten zu lassen. Das Tier kann positive oder negative Rückmeldung geben. Auch kleine Zahlen können angezeigt werden.
creaturemodule.basic_hunter.desc=Das Tier kann jagen und die Beute zu seinem Herrn zurückbringen.
creaturemodule.basic_mount1.desc=Das Tier kann geritten werden.
creaturemodule.basic_goodnose.desc=Das Tier hat gelernt bestimmte Dinge aufzufinden oder zu entdecken. Es hat entweder erlernt Dinge mit Hilfe seiner Wahrnehmung zu erspüren, die üblicherweise so nicht erkannt werden können (z.B. Magie) oder es enthält einen stark positiven Umstand zum Aufspüren von u.a. Fallen, Gerüchen oder Spuren.\nDiese Grundausbildung muss einmal pro Einsatzgebiet erworben werden.
creaturemodule.basic_guard.desc=Das Tier hat gelernt Wache zu halten oder jemanden zu bewachen und informiert seinen Herrn, wenn etwas Auffälliges geschieht.
creaturemodule.sanatory.desc=Das Tier hat einen positiven Einfluss auf die Genesung. Wenn das Tier eine Person berührt und beide ruhig sind, werden nach 5 Minuten die Auswirkungen eines Zustandes (außer Siechtum) als um eine Stufe niedriger angenommen.\nDies endet, sobald die Berührung endet.
creaturemodule.helper_empath.desc=Das Tier ist gut darin Stimmungen aufzunehmen und kann seinem Besitzer kleinere Hinweise geben. Es gilt als leicht positiver Umstand, wenn der Besitzer Redekunst oder Empathie einsetzt.
creaturemodule.helper_lucky_charm.desc=Das Tier \u201Ebringt Glück\u201C. Es gilt als leicht positiver Umstand bei etwaigen Proben zum Glücks- oder Falschspiel.
creaturemodule.helper_healer.desc=Das Tier wirkt beruhigend und fördert dadurch die Genesung. Es gilt als leicht positiver Umstand bei der Heilkunde des Tierführers.
creaturemodule.helper_hunter.desc=Das Tier gilt für den Tierführer als leicht positiver Umstand bei Jagdproben, bei denen Tierführer und Tier zusammenarbeiten, sowie bei passenden Proben auf Überleben (Lager finden, Orientieren, Nahrung sammeln etc.).
creaturemodule.helper_artist.desc=Das Tier hat es gelernt, Auftritte des Besitzers durch eigene Kunststücke zu unterstützen. Es gilt als leicht positiver Umstand bei der Darbietung des Tierführers.
creaturemodule.helper_prestige.desc=Das Tier ist so majestätisch, dass es das Auftreten des Besitzers unterstützt. Es gilt als leicht positiver Umstand für das Anführen des Tierführers.
creaturemodule.helper_mount.desc=Das Tier gilt als leicht positiver Umstand bei Tierführung-Proben zum Reiten des Tieres. Es erhält außerdem GSW +1, Athletik +3 sowie eine Schwelle-2-Meisterschaft in Athletik.
creaturemodule.helper_scoundrel.desc=Das Tier kann durch Possierlichkeit glänzen oder Ablenken. Es gilt als leicht positiver Umstand für die Redekunst und Fingerfertigkeit des Besitzers.
creaturemodule.helper_scout.desc=Das Tier ist aufmerksam und in der Lage, durch kleine Signale Hinweise auf die Umgebung zu geben. Es gilt als leicht positiver Umstand für die Wahrnehmung des Tierführers.
creaturemodule.helper_stable_mind.desc=Das Wesen gibt dem Tierführer Mut. Es gilt als leicht positiver Umstand auf die Entschlossenheit des Tierführers.
creaturemodule.hunting_pair.desc=Wenn das Tier seinem Besitzer bei einer Probe zur Nahrungssuche (Jagd) hilft (siehe Splittermond: Die Regeln S. 122), erbeutet er statt einer halben eine ganze Ration pro Erfolgsgrad.
creaturemodule.feat.desc=Das Tier erlernt irgendeinen kleinen, regeltechnisch wenig relevanten Trick, z.B. Apportieren, Hilfe holen oder einen kleinen Zirkustrick.
creaturemodule.loyal.desc=Das Tier kann nicht mehr von anderen Tierführen auf profane Weise gegen den Willen seines Besitzers kontrolliert werden (siehe S. 13).
creaturemodule.reassuring.desc=Durch die Anwesenheit des Tieres fühlt sich der Abenteurer sicherer. Er kann für einen Splitterpunkt eine misslungene Probe, die die Zustände Angsterfüllt oder Panisch hervorgerufen hat, mit einem Bonus von 2 Punkten wiederholen, solange es kein Patzer war.
creaturemodule.trained.desc=Das Tier erhält einen Bonus in Höhe von 2 Punkten auf einen Schwerpunkt einer beliebigen Fertigkeit.
creaturemodule.firm_mind.desc=Das Wesen festigt den Geist des Abenteurers, wodurch dieser einen Bonus in Höhe von 3 Punkten gegen Angriffe erhält, die sich gegen den Geistigen Widerstand richten. Das Tier darf hierzu nicht weiter als 10 m von ihm entfernt sein.
creaturemodule.enhanced_skill.desc=
creaturemodule.runner.desc=
creaturemodule.war_horse.desc=Für das Tier gilt die Nutzung als Reittier im Kampf als übliche Verwendung, wie wenn es eine Kampfabrichtung erhalten hätte (siehe S. 19).\nAußerdem erhält der Reiter einen Bonus in Höhe von 2 Punkten auf Proben, bei denen es darum geht, im Sattel zu bleiben.
creaturemodule.palfrey.desc=Eventuell durch Reisen erhaltene Erschöpfung ist für den Reiter um 1 Stufe reduziert. Um einen Zelter unter den üblichen Umständen (also während der Reise, außerhalb eines Kampfes oder Extremsituationen) zu reiten, muss auch bei Unkenntnis der Meisterschaft Dompteur keine Tierführung-Probe abgelegt werden (siehe S. 11).
creaturemodule.attacker.desc=Kampfwerte verbessern sich
creaturemodule.menacing_defender.desc=Das Tier kann durch seine Präsenz den Gegner derart einschüchtern, dass es ihm schwerfällt, andere Ziele anzugreifen. Das Tier würfelt eine Probe auf Entschlossenheit gegen den Geistigen Widerstand des Gegners (kontinuierliche Aktion, 5 Ticks Dauer). Bei einem Erfolg ist das Ziel so eingeschüchtert, dass es für 45 Ticks einen Malus in Höhe von 1 Punkt (+1 pro EG) auf alle Angriffe erhält, die sich nicht gegen das Tier richten.
creaturemodule.bombard.desc=as Tier hat gelernt, Dinge auf ausgewählte Ziele fallen zu lassen. Ein solcher Angriff erfolgt mit einem Wert von 10 + dem Wert in der Ressource Kreatur + etwaigen Angriffsboni aus der Abrichtung Kämpfer.\nDies zählt als einfacher Befehl (siehe Seite 24).
creaturemodule.terrifying_roar.desc=Das Gebrüll des Tiers lässt Gegner zögern. Das Brüllen ist eine sofortige Aktion (3 Ticks Dauer) und erfordert eine vergleichende Probe (Angriffswert des Tiers gegen gegnerische Entschlossenheit). Gewinnt das Tier, erhält die nächste Aktion des Ziels einen leicht negativen Umstand.\nDie Wirkung hält maximal bis zum Ende des Kampfes.
creaturemodule.terrifying_growl.desc=Tier erhält das Merkmal Furchterregend 15 oder ein bereits vorhandenes Merkmal Furchterregend steigt um 5 Punkte. Zudem kann es dieses Merkmal bewusst auslösen, es wirkt also nicht mehr automatisch bei jedem Anblick.
creaturemodule.easy_to_lead.desc=Wenn ein Tier die Abrichtung Kämpfer nur einmalig erworben hat und zusätzlich die Abrichtung Gut zu führen besitzt, kann es auch von Personen eingesetzt werden, die nicht über die Meisterschaften Dompteur oder Kampfabrichter I verfügen. In diesem Fall gelten die Regeln auf S. 11.
creaturemodule.keep_in_check.desc=Das Tier hat es gelernt, sein Ziel in Schach zu halten. Dieses wird sich dem Tier nicht auf mehr als 3 m nähern, es sei denn ihm gelingt eine vergleichende Entschlossenheit-Probe.
creaturemodule.fighter.desc=verbessert die Kampfwerte
creaturemodule.fighter2.desc=verbessert die Kampfwerte
creaturemodule.fighter3.desc=verbessert die Kampfwerte
creaturemodule.fighter4.desc=verbessert die Kampfwerte
creaturemodule.supporter.desc=Das Tier hat gelernt, sich besonders geschickt zu positionieren. Personen, die das Ziel des Tieres angreifen, erhalten einen Bonus in Höhe von 1 Punkt auf ihren Angriff.
creaturemodule.arcane_tie.desc=Der Vertraute hat gelernt seinen Fokus in sich zu kanalisieren, um die geistigen Anstrengungen seines Herren zu reduzieren. Wenn der Vertraute seinen Herren berührt, kann er je 3 Punkte Fokus erschöpfen, um seinem Herren je 1 Punkt erschöpften Fokus zu sparen.
creaturemodule.arcane_tie2.desc=Die Reichweite von Arkanes Band I erhöht sich von Berührung auf 2 m.
creaturemodule.arcane_range.desc=Solange der Vertraute sich innerhalb der maximalen Entfernung für kanalisierte Zauber seines Herren aufhält, erhöht er diese Entfernung (ausgehend vom Vertrauten) noch einmal um den gleichen Wert.
creaturemodule.arcane_stability.desc=Der Vertraute stabilisiert die Magie seines Herren. Für 2 erschöpfte Punkte Fokus und eine sofortige Reaktion von 3 Ticks Dauer des Vertrauten kann sein Herr, solange er sich innerhalb einer Entfernung von MYS +10 m zum Vertrauten befindet, auf der Tabelle für Verheerende Zauberwirkungen eine Stufe abziehen. Sollte er dadurch unter die niedrigste Stufe fallen, entfallen die Auswirkungen aus der Tabelle.
creaturemodule.arcane_connection.desc=Der Herr des Vertrauten kann die kanalisierten Kosten eines Zaubers auf ihn übertragen. Dies erfordert eine Berührung während des Zaubervorgangs und eine kontinuierliche Aktion von 3 Ticks Dauer. Der Vertraute kann immer nur einen Zauber zeitgleich auf diese Weise kanalisieren.
creaturemodule.advisor.desc=(beliebig oft mit jeweils anderem Schwerpunkt):\n Berührt der Vertraute seinen Herren, erhält dieser einen leicht positiven Umstand bei Proben auf ein einen Schwerpunkt in Alchemie, Arkane Kunde, Geschichte und Mythen, Länderkunde oder Naturkunde. Dieser Schwerpunkt muss beim Erlernen der Abrichtung festgelegt werden.
creaturemodule.enhanced_focus.desc=(einmal pro HG des Besitzers):\nDer Vertraute erhält 5 zusätzliche Fokuspunkte.
creaturemodule.fairyfamiliar.desc=Der Vertraute hat es gelernt, sich in den Feenwelten zu orientieren. Sein Herr erhält einen leicht positiven Umstand für alle Proben zur Orientierung in den Feenwelten, sofern sich der Vertraute innerhalb einer Entfernung von MYS + 10 m aufhält.
creaturemodule.blessed_animal.desc=Bei Erwerb der Abrichtung muss eine Gottheit gewählt werden. Der Vertraute kann 4 Punkte Fokus erschöpfen, um als sofortige Reaktion von 3 Ticks Dauer eine einzelne Probe seines Herren zu unterstützen, die im Sinne der gewählten Gottheit ist. Hierdurch erhält sein Herr einen leicht positiven Umstand auf die Probe.
creaturemodule.protecting_connection.desc=Solange sich der Vertraute innerhalb einer Entfernung von MYS + 10 m aufhält, erhält sein Herr eine SR von 2 gegen eine bestimmte Schadensart. Der Vertraute muss resistent gegen diese Schadensart sein.\nDiese Unterstützung erfordert vom Vertrauten eine kontinuierliche Aktion von 5 Ticks Dauer und K4V1 Punkte Fokus.
creaturemodule.strong_aura.desc=Solange sich der Vertraute innerhalb einer Entfernung von MYS + 10 m aufhält, kann sein Herr beim Auslösen von Zaubern mit dem Typus Aura zwei weitere Personen als Ziel festlegen. Diese Unterstützung erfordert vom Vertrauten K2 Punkte Fokus.
creaturemodule.bracing_connection.desc=Solange sich der Vertraute innerhalb einer Entfernung von MYS + 10 m aufhält, erhält sein Herr einen Bonus in Höhe von 1 Punkt auf alle Zauberproben einer bestimmten Magieschule. Der Vertraute muss diese Magieschule beherrschen, und die Schule muss bei Erwerb der Abrichtung festgelegt werden. \nDiese Unterstützung erfordert vom Vertrauten eine kontinuierliche Aktion von 5 Ticks Dauer und K2 Punkte Fokus.
creaturemodule.cloaking.desc=Der Vertraute kann einen Spruch mit dem Typus Tarnung oder Verhüllung, den er auf sich spricht, auf eine weitere Person ausweiten. Dies erfordert K2 Punkte Fokus. Das Tier muss die Person während der gesamten Verhüllung berühren.
creaturemodule.spellbridge.desc=Der Herr des Vertrauten kann einen Zauber, den der Familiar beherrscht, wirken, als würde er ihn selbst beherrschen. Er legt die Probe auf seinen eigenen Wert in der Magieschule des Zaubers ab und muss den Vertrauten beim Zaubervorgang berühren.
creaturemodule.sense_spells.desc=Der Vertraute kann erkennen, wenn ein Zauber auf etwas liegt. Dies erfordert eine Probe der höchsten Magieschule des Vertrauten sowie eine kontinuierliche Aktion von 5 Ticks Dauer. \nDie Schwierigkeit ist üblicherweise 20, orientieren Sie sich gegebenenfalls an den Angaben in Splittermond: Die Regeln auf S. 149.
creaturemodule.spell_lore.desc=(einmal pro Magieschule und Heldengrad des Tierführers):\nEine Magieschule des Vertrauten steigt um 4 Punkte, er erhält einen zusätzlichen Zauber bis Grad 4.\nVoraussetzung: Stärke Tiervertrauter, für Zauber bis Grad 3 zusätzlich Familiarabrichter II, für Zauber bis Grad 4 zusätzlich Familiarabrichter II und Meisterbändiger


mastership.animals.combat_trainer1.desc=Der Abenteurer ist in der Lage, Abrichtungen mit der Voraussetzung Kampfabrichter I zu vermitteln und zu nutzen.
mastership.animals.familiar_trainer1.desc=Der Abenteurer ist in der Lage, Abrichtungen mit der Voraussetzung Familiarabrichter I zu vermitteln und zu nutzen.
mastership.animals.animalspecialist.desc=Von diesem Abenteurer ausgebildete Tiere haben ein um 1 Punkt höheres Potenzial. Diese Meisterschaft kann bis zu viermal gewählt werden (einmal pro Heldengrad).
mastership.animals.swarmleader.desc=Der Abenteurer ist in der Lage, Abrichtungen mit der Voraussetzung Schwarmführer zu vermitteln und zu nutzen. Zudem darf er Wesen mit dem Merkmal Schwarm als Schwarm kontrollieren (bis maximal Schwarmstufe 2).
mastership.animals.combat_trainer2.desc=Der Abenteurer ist in der Lage, Abrichtungen mit der Voraussetzung Kampfabrichter II zu vermitteln und zu nutzen.
mastership.animals.familiar_trainer2.desc=Der Abenteurer ist in der Lage, Abrichtungen mit der Voraussetzung Familiarabrichter II zu vermitteln und zu nutzen.
mastership.animals.swarmkeeper.desc=Der Abenteurer ist in der Lage, Abrichtungen mit der Voraussetzung Hüter des Schwarms zu vermitteln und zu nutzen (maximal Schwarmstufe 3).
mastership.animals.animaldefender.desc=Wenn das Tier eine Aktive Abwehr als Verteidiger mit Hilfe von Schild und Pranke für jemand anderen ausführt und der Tierführer ebenfalls nicht mehr als 2 m vom Angegriffenen entfernt ist, kann er sein Tier unterstützen. Dies geht nach den normalen Regeln für Zusammenarbeit (Splittermond: Die Regeln S.21) und erfordert eine Probe auf Tierführung (Reaktion, 3 Ticks).
mastership.animals.animal_stronghold.desc=Der Tierführer kann das Tier anweisen (sofortige Reaktion mit 3 Ticks Dauer, nach den Regeln für das Befehligen von Tieren auf S. 24) jemanden zu schützen. Solange es sich nicht weiter als 2 m vom Verteidigten entfernt, kann die Verteidigung des Tieres um bis zu 3 Punkte gesenkt werden, um die VTD des Schützlings um den gleichen Betrag zu erhöhen. Dies ist nur möglich, wenn das Tier eine höhere VTD als der Schützling hat. Sollte der Schützling durch einen Angriff nur knapp verfehlt werden (also innerhalb der 3 Punkte, die das Tier ihm verleiht), wird stattdessen das Tier mit halbem Schaden getroffen. Das Tier kann, während es jemanden verteidigt, normal handeln, muss sich aber auf den Schutz konzentrieren, so dass es wie unter dem Zustand Benommen 1 steht. Diese Boni und Mali gelten, bis der Tierführer diese Haltung widerruft. Zusätzlich kann das Tier die Meisterschaft Schild und Pranke auch für seinen aktuellen Schützling einsetzen.
mastership.animals.master_tamer.desc=Der Abenteurer ist in der Lage, Abrichtungen mit der Voraussetzung Meisterbändiger zu vermitteln und zu nutzen. Außerdem kann er einen dritten Begleiter im Kampf kontrollieren. Zudem erhält ein Tier, das er als Kreatur erworben hat, 1 zusätzlichen Punkt Potenzial (siehe Bestien 15).\nBei Kenntnis der Meisterschaft Schwarmführer erhöht sich die Schwarmstufe auf maximal 5.
mastership.animals.lord_of_the_beasts.desc=Der Abenteurer ist in der Lage, Abrichtungen mit der Voraussetzung Meister der Bestien zu vermitteln und zu nutzen. Von ihm ausgebildete Tiere haben außerdem ein um 2 Punkte höheres Potenzial.
mastership.fellow_fighter.desc=Wenn ein Tiergefährte oder Tierführer im Besitz dieser Meisterschaft die Regeln für Zusammenarbeit im Kampf (Splittermond: Die Regeln S. 167) nutzt, um seinen Tierführer oder Tiergefährten zu unterstützen (dieser also als Hauptangreifer bestimmt wurde), ist die Unterstützung um 3 Ticks schneller. Ist der so unterstützte Angriff erfolgreich, erhöht sich zudem dessen Schaden um einen Punkt.\nZusammenarbeiten im Kampf ist in so einem Fall auch als einmalige Reaktion auf den Angriff des Hauptangreifers möglich.\nDiese Reaktion kann nur einmal genutzt werden bevor wieder eine eigene Aktion durchgeführt wurde.
mastership.shield_and_claw.desc=Sofern ein Tiergefährte seinen Tierführer oder ein Tierführer einen seiner Tiergefährten mit der Meisterschaft Verteidiger verteidigt, kann diese auch eingesetzt werden, um Angriffe auf den Körperlichen oder Geistigen Widerstand für das Ziel abzuwehren, sofern dies glaubwürdig möglich ist. Hierfür werden die Fertigkeiten Zähigkeit bzw. Entschlossenheit verwendet. Der Malus bei der üblichen Verwendung der Meisterschaft Verteidiger entfällt.
mastership.sword_and_claw1.desc=Wenn Tierführer und Tiergefährte ein gemeinsames Ziel im Nahkampf bekämpfen, sind sie jeweils in der Lage, die Angriffe des anderen zu verstärken. Dazu ist eine einmalige Reaktion (2 Ticks Dauer) nötig, wodurch der unterstützte Angriff einen Bonus in Höhe von 2 Punkten erhält. Diese Reaktion kann nur einmal genutzt werden bevor wieder eine eigene Aktion durchgeführt wurde. Das Tier muss hierbei über einen Mindest-Angriffswert von 12 verfügen.
mastership.patient_fellow.desc=Eine Reaktion zur Unterstützung eines Angriffs mit der Kennzeichnung Paarkampf kann auch nach einer etwaigen Aktiven Abwehr des Gegners erfolgen und damit den vorhergehenden Angriff unterstützen.
mastership.impr_fellow_fighter.desc=Ein gemäß den Regeln für Gefährte im Kampf zur Unterstützung durchgeführter Angriff wird gegen eine um 10 Punkte gesenkte Verteidigung des Ziels gewürfelt, nicht gegen eine um 5 Punkte gesenkte.
mastership.sword_and_claw2.desc=Wenn Tierführer und Tiergefährte ein gemeinsames ein gemeinsames Ziel im Nahkampf bekämpfen, sind sie jeweils in der Lage, die Angriffe des anderen zu verstärken. Dazu ist eine einmalige Reaktion (1 Tick Dauer) nötig, wodurch der unterstützte Angriff 2 Ticks weniger benötigt. Diese Reaktion kann nur einmal genutzt werden bevor wieder eine eigene Aktion durchgeführt wurde. Das Tier muss hierbei über einen Mindest-Angriffswert von 17 verfügen.
mastership.riding_rush.desc=Der Reiter kann einen Angriff mit mindestens 5 m Anlauf durchführen, bei dem er am Gegner vorbeistürmt. Dazu muss sein Reittier über mindestens GSW 10 verfügen. Bei Gelingen kann er sich bis zu seiner vollen GSW weiterbewegen und sein Gegner verliert 3 Ticks.\nIst der Gegner zu Fuß, wird er zusätzlich um 2 m nach hinten gedrängt. Das Vorbeistürmen löst bei Gelingen keine Gelegenheitsangriffe von diesem Gegner aus. Sturmritt ist mit der Meisterschaft Lanzenreiter kombinierbar.
mastership.longrange.riding_shooter.desc=Der Abenteurer hat gelernt, die Bewegungen des Tieres beim Schuss auszugleichen. Er erhält keinen negativen Umstand mehr, wenn er vom Rücken eines Reittiers schießt. Der Malus für die Verwendung einer Schusswaffe (mit dem Merkmal Reiterwaffe) entfällt.
mastership.throwing.riding_thrower.desc=Der Abenteurer hat es gelernt, die Bewegungen des Tieres beim Wurf auszugleichen. Er keinen negativen Umstand mehr, wenn er vom Rücken eines Reittiers wirft. Der Malus für die Verwendung einer Wurfwaffe (mit dem Merkmal Reiterwaffe) entfällt.
mastership.acrobatics.saddle_acrobat.desc=Der Abenteurer kann Akrobatik zur Aktiven Abwehr auf dem Pferderücken verwenden, ohne, dass er dabei absitzen muss, und kann auch die Meisterschaften Antäuschen und Ausweichen verwenden. Die Probe erhält jedoch einen Malus in Höhe von 3 Punkten. Auf- und Absteigen auf ein Pferd ist für ihn zudem nur noch eine sofortige Aktion mit 3 Ticks Dauer.
mastership.animals.berittener_kaempfer.desc=Die Manöver Vorstürmen und Sturmritt sind effektiver. Vorstürmen verursacht zusätzlich 2 Schadenspunkte solange der Abenteurer beritten ist, beim Sturmritt wird ein Gegner, der zu Fuß ist, zusätzlich 2 weitere Meter zurückgedrängt.
mastership.animals.ride_down.desc=Der Abenteurer kann die Masse seines Reittiers nutzen, um Gegner effektiver zu Fall zu bringen. Führt er vom Pferderücken aus das Manöver Umreißen gegen einen Gegner zu Fuß aus, erhält eine etwaige Probe, um auf den Beinen zu bleiben, einen Malus in Höhe der Größenklasse des Reittiers.\nZudem kann er Umreißen vom Pferderücken aus auch gegen Gegner bis GK 8 einsetzen.
mastership.animals.riding_defender.desc=Der Reiter kann vom Pferderücken aus Tierführung zur Aktiven Abwehr von Angriffen auf sich oder sein Reittier einsetzen. Außerdem kann er Tierführung auch zum Lösen aus dem Kampf (siehe Splittermond: Die Regeln S. 159) verwenden.
mastership.animals.impr_warrider.desc=Der Reiter kann die Angriffe seines Tieres mit einer Probe auf Tierführung unterstützen. Dies ist eine sofortige Reaktion von 5 Ticks Dauer. Ansonsten wird dies wie ein Zusammenarbeiten im Kampf (Splittermond: Die Regeln S.167) abgehandelt.
mastership.animals.my_horse_my_shield.desc=Solange der Reiter auf dem Rücken seines Reittiers sitzt, erhalten Nahkampfangriffe von Fußkämpfern gegen ihn einen Malus in Höhe von 2 Punkten
mastership.performance.attentionmagnet.desc=Wenn ein Tierführer mit dieser Meisterschaft bei einer Darbietung-Probe, um Geld zu verdienen (siehe Splittermond: Die Regeln S. 108), gemeinsam mit einem Tier mit mindestens Darbietung 9 auftritt, erhält er die dreifache Menge an Geld.
mastership.performance.reassuring_assistance.desc=Ein Tier (mit mindestens Darbietung 9) und sein Tierführer sind in der Lage, sich zu beruhigen und dabei bei der Konzentration zu helfen. Wenn einer von beiden eine kontinuierliche Aktion von 15 Ticks Dauer durchführt, kann der andere für die Dauer der Aktion Mali durch äußere Umstände (z.B. Wetter oder andere Störungen) um 2 Punkte reduzieren.
mastership.performance.cheer_up.desc=Ein Tier (mit mindestens Darbietung 9) und sein Tierführer sind in der Lage, sich gegenseitig zu ermutigen. Wenn einer von beiden eine kontinuierliche Aktion von 15 Ticks Dauer durchführt, ist für die Dauer dieser Aktion der Zustand Angsterfüllt des jeweils anderen unterdrückt. Nach Ablauf kann der Betroffene zudem einmalig eine erneute Probe ablegen, um den Zustand abzuschütteln, sofern er den Zustand aufgrund einer misslungenen Probe erhalten hat.
mastership.performance.group_mascot.desc=Tier oder Tierführer können die Auswirkung von Meisterschaften mit der Kennzeichnung Aufmunterung auf eine Anzahl Personen in Höhe der Ausstrahlung (von Tier oder Tierführer) ausdehnen.
mastership.performance.droll_companion.desc=Wenn ein Tierführer eines Wesens mit mindestens Ausstrahlung 3 gemeinsam mit diesem eine Aufführung durchführt (z.B. einen Tanz, ein Lied oder ähnliches), erhalten beide einen Bonus auf die Darbietung-Probe in Höhe der Ausstrahlung des jeweils anderen.
mastership.dexterity.pack_of_thieves.desc=Wenn der Abenteurer von einem tierischen Begleiter, der mindestens Fingerfertigkeit 9 oder eine passende Abrichtung besitzt, bei einem Diebstahl oder einer ähnlichen Handlung unterstützt wird, zählt diese automatisch und ohne weitere Probe als Ablenkung (leicht positiver Umstand). Das Tier ist dafür etwa eine halbe Stunde verschwunden.
mastership.history.faith_companion1.desc=Der Zauberer erhält einen Bonus in Höhe von 1 Punkt auf eine der von seinem Gott bevorzugten Magieschulen, solange sich sein Tiervertrauter innerhalb von 2 m Entfernung aufhält. Dieser Bonus zählt als Zauberei. Diese Meisterschaft kann mehrfach gewählt werden, jedes Mal für eine neue Magieschule.
mastership.history.faith_companion2.desc=Der Bonus von Vertrauter des Glaubens I steigt auf 2 Punkte. Diese Meisterschaft kann mehrfach gewählt werden, jedes Mal für eine neue Magieschule.
mastership.hunting.hunting_buddy.desc=Wenn der Abenteurer von einem tierischen Begleiter, der mindestens Jagdkunst 9 oder eine passende Abrichtung besitzt, bei der Jagd unterstützt wird, steigt seine Anzahl der maximal erlaubten Proben um 3.
mastership.hunting.character_specialist.desc=Der Abenteurer hat sich mit seinen Begleitern stark auseinandergesetzt und kennt ihren natürlichen Lebensraum und ihre Verhaltensweisen. Wenn er versucht, ein Wesen aufzuspüren, ihm Fallen zu stellen oder es einzuschätzen, für das er eine passende Kreatur oder einen passenden Tiergefährten besitzt, erhält er einen leicht positiven Umstand.
mastership.intimidate_animals.desc=Der Abenteurer kann ein Wesen des Typus Tier einschüchtern. Dies erfordert eine kontinuierliche Aktion von 5 Ticks Dauer und eine Tierführung-Probe gegen den Geistigen Widerstand des Tieres plus den doppelten Monstergrad (für Einzelwesen). Gelingt die Probe, bricht das Tier einen Angriff ab oder zieht sich zurück. Dies ist nur einmal pro Tier und Begegnung möglich, und auch nur, wenn eine Flucht des Tieres möglich ist. Wird das Tier anschließend angegriffen, verfällt die Wirkung. Bei Kreaturen kann der Besitzer des Tiers vergleichende Tierführung-Probe ablegen, um die Auswirkungen zu verhindern.
mastership.naturemagic.menacing_appearance.desc=enn der Abenteurer 1 Punkt Fokus erschöpft und eine Reaktion von 2 Ticks Dauer durchführt, erhält sein Vertrauter einen Bonus in Höhe der halben Größenklasse des Tieres auf einen Angriff, der gegen den Geistigen Widerstand oder die Entschlossenheit seines Gegenübers gerichtet ist.
mastership.naturemagic.versatile_animal_helper.desc=Sofern der Zauberer mittels eines der Zauber Tierischer Helfer I-III ein Wesen ruft, kann er 1 EG dafür aufwenden, dem Wesen eine weitere beliebige Grundabrichtung zugänglich zu machen.
mastership.naturemagic.lifebond.desc=Für einen Splitterpunkt kann Schaden aus einer einzelnen Quelle (z.B. einem Angriff) vom Vertrauten zum Zauberer umgeleitet werden oder umgekehrt.
mastership.naturemagic.mighty_animal_helper.desc=Sofern der Zauberer mittels eines der Zauber Tierischer Helfer I-III ein Wesen ruft, kann er 2 EG dafür aufwenden, dem Wesen eine zusätzliche Abrichtung (siehe Bestien S. 15) zugänglich zu machen, die er einem Tiergefährten beibringen könnte.
mastership.naturemagic.favoredform_familiar.desc=Der Abenteurer erhält einen Bonus in Höhe von 3 Punkten, wenn er sich in eine Gestalt verwandelt, die er als Tiervertrauten besitzt. Beim Zauber Gestalt des Vertrauten wird außerdem die Beschränkung des maximalen Kreatur-Wertes aufgehoben.

spell.familiar_form.descr=Der Zauberer verwandelt sich in die Gestalt eines seiner Tiervertrauten (bis maximal Kreatur 6). Dazu muss der Tiervertraute während des Zaubervorgangs berührt werden.
spell.familiar_form.enhancedescr=Der Zauberer kann entgegen der üblichen Regeln (siehe Splittermond: Die Regeln S. 218) auch die Zauber des Vertrauten nutzen, nicht nur die eigenen Zauber.
spell.summon_familiar.descr=Der Zauberer ruft einen seiner Tiervertrauten zu sich, sofern dieser sich maximal in 1 km Entfernung befindet. Dieser erscheint beim Auslösen in der Nähe des Zauberers. Dabei werden mit Ausnahme von Rüstungen keine Gegenstände mittransportiert, die der Tiervertraute trägt.
spell.summon_familiar.enhancedescr=Ein weiterer vorhandener Tiervertrauter kann ebenfalls herbeigerufen werden. Dieser muss sich nicht am selben Ort wie der erste Tiervertraute befinden.
spell.animal_helper1.descr=Ein zufällig bestimmtes und in der Umgebung natürlich vorkommendes Wesen des Typus Tier mit dem Merkmal Kreatur (bis maximal Kreatur 2) wird gerufen und erscheint beim Auslösen in der Nähe des Zauberers. Dieses steht dem Zauberer gemäß dessen in Anwesenheit des Wesens formulierten Wünschen (sofern diese vom Tier erfüllt werden können) und seiner natürlichen Verhaltensweisen hilfreich zur Seite. Das Wesen verhält sich, als würde es eine Grundausbildung (siehe Bestien 17) besitzen. Diese muss bei Erlernen des Spruches festgelegt werden. Das gerufene Wesen passt immer zu der erlernten Grundausbildung.
spell.animal_helper1.enhancedescr=Ein Wesen bis maximal Kreatur 3 kann gewählt werden.
spell.animal_helper2.descr=Ein zufällig bestimmtes und in der Umgebung natürlich vorkommendes Wesen des Typus Tier miSpt dem Merkmal Kreatur (bis maximal Kreatur 4) wird gerufen und erscheint beim Auslösen in der Nähe des Zauberers. Dieses steht dem Zauberer gemäß dessen in Anwesenheit des Wesens formulierten Wünschen und seiner natürlichen Verhaltensweisen hilfreich zur Seite. Das Wesen verhält sich, als würde es eine Grundausbildung (siehe Bestien 17) besitzen. Diese muss bei Erlernen des Spruches festgelegt werden, und das gerufene Wesen passt immer zu der erlernten Grundausbildung.
spell.animal_helper2.enhancedescr=Ein Wesen bis maximal Kreatur 5 kann gewählt werden.
spell.animal_helper3.descr=Ein zufällig bestimmtes und in der Umgebung natürlich vorkommendes Wesen des Typus Tier mit dem Merkmal Kreatur (bis maximal Kreatur 6) wird gerufen und erscheint beim Auslösen in der Nähe des Zauberers. Dieses steht dem Zauberer gemäß dessen in Anwesenheit des Wesens formulierten Wünschen und seiner natürlichen Verhaltensweisen hilfreich zur Seite. Das Wesen verhält sich, als würde es eine Grundausbildung (siehe Bestien 17) besitzen. Diese muss bei Erlernen des Spruches festgelegt werden, und das gerufene Wesen passt immer zu der erlernten Grundausbildung.
spell.animal_helper3.enhancedescr=Ein Wesen bis maximal Kreatur 8 kann gewählt werden.
spell.animal_giantism.descr=Ein Wesen des Typus Tier wächst zu einer größeren Form seiner selbst an. GK, GSW, LP, KW und SR steigen um 2 Punkte.
spell.animal_giantism.enhancedescr=Der Schaden des Wesens steigt um 1 Punkt, sofern die WGS bei maximal 9 liegt, oder um 2 Punkte, wenn die WGS größer als 9 ist.
spell.animal_scout.descr=Ein zufälliges und in der Umgebung natürlich vorkommendes Wesen erscheint beim Auslösen und führt den Zauberer auf einer möglichst sicheren Route durch das ihm bekannte Gebiet.\nAlle Proben des Zauberers oder seiner ihn begleitenden Gefährten, die mit dem Reisen und Überleben in diesem Gebiet zusammenhängen, erhalten einen leicht positiven Umstand. Das Wesen wird sich nicht in Kämpfe einmischen und auch von dannen ziehen, sobald es an die Grenzen seines Reviers gelangt. Sofern es angegriffen wird, versucht das Wesen zu fliehen.
spell.animal_scout.enhancedescr=Das Wesen versucht nicht zu fliehen, wenn es von jemand anderem als dem Zauberer oder seinen Gefährten angegriffen wird.
spell.shrink_familiar.descr=Eine Kreatur oder ein Vertrauter des Zauberers nimmt eine kleinere Form seiner selbst an. Die Größenklasse des Wesens sinkt nach Wahl des Zauberers um 1 bis 3 Punkte (mindestens GK 1). Das Tier kann, solange es unter dem Einfluss dieses Zaubers steht, keine Abrichtungen mehr ausführen. Die Ausstrahlung des Tieres wird um 1 erhöht. LP und GSW sinken um so viele Punkte wie die GK sinkt.
spell.shrink_familiar.enhancedescr=Die Größenklasse sinkt um weitere 1 bis 2 Punkte (mindestens GK 1).
spell.shadowshift_familiar.descr=Der Zauberer und einer seiner Tiervertrauten tauschen ihre Positionen, indem sie jeweils zeitgleich aus dem Schatten des anderen treten. Hierfür dürfen sie sich nicht weiter als 10 m voneinander entfernt befinden und sie müssen sich gegenseitig sehen.
spell.shadowshift_familiar.enhancedescr=Zauberer und Tiervertrauter können bis zu 50 m voneinander entfernt sein.
spell.soulswap_familiar.descr=Der Zauberer und einer seiner Tiervertrauten tauschen ihre Körper. Der Tiervertraute kann in der Gestalt des Zauberers nur dann sprachlich kommunizieren, wenn er auch in seiner gewöhnlichen Gestalt die entsprechende Möglichkeit bzw. ausreichend Intellekt besitzt. Er kann sich allerdings, so er das will und solange er nicht spricht, auch ohne dafür ausreichenden Intellekt unauffällig genug benehmen, dass es nicht direkt auffällt, dass er eigentlich ein Tier ist.\nIn Bezug auf alle Werte gelten die Angaben zur Verwandlung in Tiergestalt (siehe Splittermond: Die Regeln S. 218).
spell.soulswap_familiar.enhancedescr=Die Imitation des Vertrauten ist noch überzeugender. Um zu durchschauen, dass es sich nicht um den Zauberer handelt, ist eine Empathie- oder Wahrnehmung-Probe gegen 20 + die Fertigkeitspunkte des Zauberers in der Magieschule nötig.
spell.ride_like_the_wind.descr=Ein verzaubertes Wesen des Typus Reittier wird so verzaubert, dass seine Geschwindigkeit um 2 Punkte steigt.\nBei der Verwendung der Reiseregeln ist die Tagesleistung mit einem solchen Reittier (bzw. wenn die gesamte Gruppe mit entsprechenden Reittieren ausgestattet ist) um 30% erhöht.
spell.ride_like_the_wind.enhancedescr=Der Zauberer kann bis zu AUS Wesen des Typus Reittier gleichzeitig verzaubern.

item.rakza.desc=Reiteraxt der wilden Jogdaren
item.jeedra.desc=Reiterspeer der ashurmazaanischen Sipahi
item.turnierlanze.desc=Lanze die in seelenischen Turnieren genutzt wird.
item.namisun.desc=Reiterbogen des kintasiches Adel
item.gestechruestung.desc=Schwere Rüstung für Turniere
item.jagodenpanzer.desc=Lederpanzer jagodischer Reiterei
item.reiterpanzer.desc=Schwerer Reiterpanzer aus metalischen Schupen
item.tropfenschild.desc=Großes Schild für die Reiterei
item.turnierschild.desc=Schild zur Gestechrüstung für Turniere