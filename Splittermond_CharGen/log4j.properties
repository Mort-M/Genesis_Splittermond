log4j.rootLogger=DEBUG, console 
log4j.appender.console=org.apache.log4j.ConsoleAppender 
log4j.appender.console.layout=org.apache.log4j.PatternLayout 
log4j.appender.console.layout.ConversionPattern=%5p [%c] (%F:%L) - %m%n

log4j.logger.cospace=WARN
log4j.logger.splimo.req=ERROR
log4j.logger.xml=INFO
log4j.logger.splimo=INFO
log4j.logger.splimo.level.power=DEBUG
log4j.logger.splittermond=DEBUG
