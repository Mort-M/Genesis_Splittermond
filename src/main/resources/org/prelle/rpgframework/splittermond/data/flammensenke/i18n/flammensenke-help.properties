material.zofirastears.desc=Wen die Götter wirklich lieben, den mögen sie in abgelegenen Tälern sogar über Gruben stolpern lassen, in denen man die genannten Edelsteine einfach nur aufzuklauben braucht. Als zaubermächtig gelten die als Tränen Zofiras bekannten Rubine, die Verbindungen in die Feenwelt haben sollen (siehe S. 19).
material.zofirastears.effect=Gegenstände aus Tränen Zofiras oder mit diesen als Verzierung gewähren ihrem Träger einen Bonus in Höhe von 1 Punkt sowohl auf Feuer- als auch auf Felsmagie. Dabei kann nur von einem Gegenstand gleichzeitig profitiert werden.
material.smaragdzuengler_leather.desc=So gibt es auch bei den allgegenwärtigen Salamander-Arten solche, die keine reine Belästigung für die Reisenden darstellen: Das Leder des Smaragdzünglers beispielsweise ist nicht nur wasser-, sondern auch feuerfest und wird daher von Kürschnern hoch gehandelt.
material.smaragdzuengler_leather.effect=Rüstungen oder ganze Sätze Kleidung aus dem Leder des Smaragdzünglers besitzen die Verbesserungen Wasserfest (Stufe 1) und Schutz vor Schadensart [Feuer] 1. Dabei kann nicht von Rüstung und Kleidung gleichzeitig profitiert werden. 
material.aschebeisser_leather.desc=So gibt es auch bei den allgegenwärtigen Salamander-Arten solche, die keine reine Belästigung für die Reisenden darstellen: Das Leder des Aschebeißers kann sich, sofern es richtig verarbeitet wurde, in einem gewissen Umfang farblich der Umgebung anpassen.
material.aschebeisser_leather.effect=Rüstungen oder ganze Sätze Kleidung aus dem Leder des Aschebeißers verleihen einen Malus in Höhe auf 4 Punkten auf alle Wahrnehmung-Proben um den Träger zu entdecken, sofern dieser sich nicht bewegt. 

education.firedeuter.descr=Alle Feuerläufer huldigen Varnu, dem feurigen Scharfrichter der Götter (siehe auch Diener der Götter S. 128) – doch schwingt hier weniger Inbrunst und Verehrung mit, als vielmehr Furcht vor der göttlichen Macht. Unter der Anleitung der als Feuerdeuter bekannten Schamanen (teils echte Priester, teils gewöhnliche Feuerzauberer) versuchen die Vartaxh alle Regeln Varnus einzuhalten und vor allem das Feuer zu ehren, um nicht dereinst selbst vernichtet zu werden, wie es mit Lurogosh geschah. So unterscheiden sich die Feuerläufer in ihrem Glauben auch von den Varnu-Verehrern aus anderen benachbarten Völkern, die den Gott oft als ein Mittel sehen Macht zu erlangen – und die mitunter auch Einfluss auf einzelne Vartaxh-Sippen gewinnen können, wenn es ihnen gelingt, die alten Schamanen zu stürzen. Die Tabus der Feuerläufer bestimmen praktisch ihr ganzes Leben, doch unterscheiden sie sich oft von Sippe zu Sippe. Gemein haben alle, dass es verboten ist Feuer zu löschen, egal wie bedrohlich oder zerstörerisch sie sein mögen. Manch andere Tabus beschäftigen sich mit dem Besuch bestimmter heiliger Orte zu bestimmten Zeiten (etwa des Rotvaters, siehe S. 12, und des Schwarzgläsernen Schlunds, siehe S. 10), dem Kontakt mit Fremden und worüber es erlaubt ist zu sprechen (so ist es etwa verboten über das Rote Labyrinth zu reden).
education.flamefinder.descr=Neben den Schamanen und Häuptlingen der Fäuerläufer der Flammensenke kommt dabei vor allem den Flammenfindern eine große Bedeutung zu, den Jägern und Kundschaftern der Vartaxh. Diese haben ein großes Gespür für die Gefahren der Senke und legen fest, wann ein Lager abgebrochen und weitergezogen werden muss. Sie sind es auch, die maßgeblich über Erfolg oder Misserfolg einer Handelsunternehmung durch die Senke entscheiden und sich für Karawanen als Führer verdingen. Ebenso wie die Krieger der Stämme sind sie meist mit Speeren, Kurzbögen und Khopeshs bewaffnet. Wenn sie befürchten, es mit großen Bestien zu tun zu bekommen, greifen sie aber zum Salamanderspieß, einem besonders schweren Speer, der nur von den kräftigsten Feuerläufern zu führen ist.