mastership.determination.meditativeAttunement.desc=Der Abenteurer kann 5 Minuten meditieren und eine Entschlossenheit-Probe gegen 15 würfeln. Wenn dies gelingt, kann er innerhalb der nächsten Stunde einen der folgenden Effekte nutzen: Bonus in Höhe WIL/2 auf einen einzelnen Angriff; Bonus in Höhe von WIL/2 auf einen festgelegten Widerstandswert gegen einen einzelnen Angriff ; Bonus in Höhe von WIL/2 auf eine beliebige Probe zur Abwehr eines Zustands. Welcher Effekt gewählt werden soll, muss bei Durchführung der meditativen Einstimmung festgelegt werden. Der Effekt kann nach einer etwaigen Probe und einer etwaigen Aktiven Abwehr genutzt werden. Es kann nur ein Effekt einer beliebigen Kontemplation gleichzeitig aktiv sein. 
mastership.history.wisdomAncients.desc=Der Abenteurer zieht aus dem Erbe seiner Vorfahren hilfreiche Lehren. Beim Erlernen der Meisterschaft müssen ein Vorfahr und zwei zu diesem passende, allgemeine Fertigkeiten gewählt werden. Die Meisterschaft kann mehrfach gewählt werden, jeweils für unterschiedliche Ahnen. Einmal pro Tag kann der Abenteurer sich an eine passende Geschichte eines berühmten Vorfahren erinnern (siehe Splittermond: Die Regeln S. 150; Probe auf gewählte Fertigkeit gegen Schwierigkeit zwischen 20 und 35, je nach Situation; dies nimmt keine Zeit in Anspruch), die zu seiner aktuellen Situation passt. Wenn die Probe gelingt, erhält er einen stark positiven Umstand auf seine nächste Handlung in einer der gewählten Fertigkeiten.
mastership.stealth.dirtyTricks.desc=Der Abenteurer kann sein Gegenüber verwirren, indem er es ablenkt, mit etwas bewirft oder dergleichen. Wenn ihm eine Heimlichkeit-Probe gegen den Geistigen Widerstand seines Gegners gelingt (sofortige Aktion von 3 Ticks Dauer), erhält er für seinen nächsten Angriff gegen diesen Gegner einen taktischen Vorteil.
mastership.stealth.exploitVulnerability.desc=Der Abenteurer hat gelernt, sich geschickt zu positionieren. Wenn ein Gegner im Nahkampf ein anderes Ziel angreift, kann der Abenteurer als Reaktion von 1 Tick Dauer sich so positionieren, dass er einen taktischen Vorteil auf einen Nahkampfangriff gegen diesen Gegner erhält, sofern dies seine nächste Aktion ist.
mastership.stealth.sneakAttack.desc=Angriffe des Abenteurers, die mit einem taktischen Vorteil verbunden sind, verursachen 2 Schadenspunkte zusätzlich.
mastership.locksntraps.trapJourneyman.desc=Der Handwerker kann Fallen bis zu Gegenstandsqualität 1 und 2 herstellen. Beim Entschärfen von Fallen löst er außerdem diese nicht bei einer misslungenen Teilprobe der erweiterten Probe aus, sondern nur, wenn durch diese Probe die Fortschrittspunkte auf 0 fallen.
mastership.locksntraps.trapExpert.desc=Der Handwerker kann Fallen bis zu Gegenstandsqualität 3 und 4 herstellen. Voraussetzung: Meisterschaft Fallen-Geselle
mastership.locksntraps.trapMaster.desc=Der Handwerker kann Fallen bis zu Gegenstandsqualität 5 und 6 herstellen. Voraussetzung: Meisterschaft Fallen-Fachmann
mastership.locksntraps.masterworkTrap.desc=Der Handwerker ist eine Legende im Fallenbau. Von ihm hergestellte Fallen erhalten automatisch eine weitere Stufe Gegenstandsqualität (bis zu einer Qualität von 7), die er bei der Berechnung von Schwierigkeit, Materialkosten und benötigten Fortschrittspunkten nicht berücksichtigen muss. Voraussetzung: Meisterschaft Fallen-Meister
mastership.locksntraps.arkanoMechanicalTrapRaiser.desc=Der Handwerker kann arkanomechanische Fallen herstellen. Außerdem kann er arkanomechanische Fallen auch mittels Arkaner Kunde entschärfen. Voraussetzung: Meisterschaft Fallen-Geselle, Meisterschaft Artefaktkunde in Arkane Kunde
mastership.perception.trapSense.desc=Der Abenteurer hat ein intuitives Gespür für Fallen. Selbst, wenn der Spieler nicht angekündigt hat, dass der Abenteurer nach Fallen sucht, steht dem Abenteurer eine entsprechende Probe zum Entdecken zu. Voraussetzung: Meisterschaft Vorsicht I in Schlösser und Fallen
mastership.antimagic.trapSpell.desc=Sobald der Zauberer eine arkanomechanische Falle entdeckt hat, kann er eine Probe auf Bannmagie würfeln (Schwierigkeit ist der Entschärfen-Wert der Falle). Die Probe kostet 4V1 Punkte Fokus, die Reichweite beträgt 10 + MYS Meter. Gelingt die Probe, löst die Falle für die Dauer von 10 Ticks (+10 Ticks pro EG) nicht aus.

spell.diamondArrow.descr=Ein mit diesem Zauber verzaubertes Geschoss erhält das Waffenmerkmal Durchdringung +1. Der Zauber unterliegt während des Abschussvorgangs nicht der Regel zur maximalen Wirkungsweite kanalisierter Zauber. Dieser Zauber ist nicht mit ande ren Zaubern des Typus Pfeil kombinierbar.
spell.diamondArrow.enhancedescr=Das Geschoss erhält das Waffenmerkmal Durchdringung +3.
spell.darkCompass.descr=Alle Proben zur Orientierung des Zauberers sind um 1 Punkt erleichtert, wenn die Lichtverhältnisse Dämmerlicht oder schlechter betragen.
spell.darkCompass.enhancedescr=Entsprechende Proben sind stattdessen um 2 Punkte erleichtert.
spell.flickerLight.descr=In der Nähe des Zauberers erscheint eine flimmernde Lichtquelle mit Lichtstufe 1, welche geradewegs mit GSW 8 auf den nächsten sinnvollen Ausgang aus dem Gebäude, dem Stollen oder der Höhle zufliegt, in dem oder der sich der Zauberer befindet. Das Flimmerlicht legt dabei bis zu 50 Meter zurück, danach verschwindet es und der Zauber endet. Der Ausgang muss für den Zauberer benutzbar sein (also z.B. ausreichend groß sein und nicht direkt in einen Abgrund führen), nicht aber unbedingt für etwaige Gefährten.
spell.flickerLight.enhancedescr=Das Flimmerlicht verändert seine Farbe, wenn es auf eine offen sichtbare Gefahr (etwa einen nicht im Hinterhalt liegenden Oger oder einen Abgrund) zufliegt.
spell.peace.descr=Die Grund-Einstellung eines Wesens vom Typus Humanoid wird gegenüber allen anderen Wesen um bis zu zwei Stufen verbessert (bis maximal neutral). Anschließend entwickelt sich die Einstellung wie üblich durch Ereignisse und Taten, die dem Wesen gefallen oder missfallen (sodass etwa aggressive Handlungen des Zauberers die Wirkung für ihn praktisch negieren). Nicht direkt mit der Wirkung des Zaubers zusammenhängende Verbesserungen der Einstellung der Ziele bleiben auch nach Ende der Wirkungsdauer bestehen (dann auf Basis der ursprünglichen Einstellung).
spell.peace.enhancedescr=Die Einstellung kann maximal aufgeschlossen erreichen.
spell.poisonSusceptibility.descr=Für den Angriff von Giften gilt der KW des Ziels als um 3 Punkte verringert.
spell.poisonSusceptibility.enhancedescr=Der Körperliche Widerstand gilt als um 5 Punkte verringert.
spell.poisonBlade.descr=Die Waffe wird giftig. Angriffe mit der Waffe, die mindestens einen Schadenspunkt verursachen, vergiften den Getroffenen. Dabei handelt es sich um das Gift "Kuss der Kobra" (Kontakt 2 / Benommen (max. 2) / 30 Ticks).
spell.poisonBlade.enhancedescr=Die Waffe erhält zudem das Waffenmerkmal Durchdringung +1.
spell.poisonArrow.descr=Ein mit diesem Zauber verzaubertes Geschoss wird giftig. Dabei handelt es sich um das Gift "Sonnengruß" (Kontakt 2 / Erschöpft (max. 3) / 30 Ticks). Das Geschoss unterliegt während des Abschussvorgangs nicht der Regel zur maximalen Wirkungsweite kanalisierter Zauber. Dieser Zauber ist nicht mit anderen Zaubern des Typus Pfeil kombinierbar.
spell.poisonArrow.enhancedescr=Die Stufe des Gifts erhöht sich um 2.
spell.groupsPeace.descr=Die Grund-Einstellung eines Wesens vom Typus Humanoid sowie von bis zu drei weiteren beim Auslösen des Zaubers festgelegte und in Reichweite des Zaubers befindliche Wesen des Typus Humanoid (mit gleichem oder geringerem GW) wird gegenüber allen anderen Wesen um bis zu drei Stufen verbessert (bis maximal neutral). Anschließend entwickelt sich die Einstellung wie üblich durch Ereignisse und Taten, die den Wesen gefallen oder missfallen (sodass etwa aggressive Handlungen des Zauberers die Wirkung für ihn praktisch negieren). Nicht direkt mit der Wirkung des Zaubers zusammenhängende Verbesserungen der Einstellung der Ziele bleiben auch nach Ende der Wirkungsdauer bestehen (dann auf Basis der ursprünglichen Einstellung).
spell.groupsPeace.enhancedescr=Die Einstellung kann maximal aufgeschlossen erreichen.
spell.lurkingShadows.descr=Der Zauberer kann sich, wenn die Lichtverhältnisse Dämmerlicht oder schlechter sind, mit maximal halber GSW an senkrechten Wänden und sogar unter der Decke bewegen.
spell.lurkingShadows.enhancedescr=Der Zauberer erhält außerdem einen Bonus in Höhe von 4 Punkten auf alle Heimlichkeit-Proben.

item.lianaDeath.desc=Blut 2 / Schlafend / 1 Stunde
item.kissWorldSnake.desc=Blut 3 / Sterbend 2 (Gift) / 12 Stunden
item.farukanSalute.desc=Blut 2 / Rasend / 5 Minuten
item.muskelBurn.desc=Blut 3 / Blutend (Gift), max 2 Stufen / 45 Ticks

item.sherazinkannenOil.desc=Heilung von 8 Lebenspunkten nach einer Stunde , maximal einmal
item.snakesSleep.desc=stark positiver Umstand auf Heilkunde-Proben, maximal einmal

item.thousandDreams.desc=Heilung der nächsten Ruhephase um 1 Punkt erhöht, Abzüge auf natürliche Heilung können ignoriert werden
item.snowVeil.desc=reduziert für 1 Stunde jeglichen erlittenen Feuerschaden um 2 Punkte
item.constrictor.desc= Gegengift für Einnahmegifte bis Grad 2

material.mistyWood.desc=Das Trübholz, das nur an ganz bestimmten schattigen Hängen des nordwestlichen Turubars wächst, wurde schon im alten Kesh ob seiner besonderen Eigenschaften geschätzt: Die ihm innewohnende Magie macht Gegenstände aus diesem Holz unscheinbar und lässt sie nahezu aus dem Blickfeld des Betrachters verschwinden. Die Turubaris haben bislang keine Verwendung für diese Kuriosität der Natur gefunden - unter den Keshabid wird das importierte Holz jedoch mit Gold aufgewogen, lassen sich daraus doch leicht versteckbare Fallen bauen.
material.mistyWood.effect=Gegenstände aus Trübholz erhalten automatisch das Merkmal Unauffällig (siehe Mondstahlklingen S. 90). Proben, um aus Trübholz errichtete oder damit verdeckte Fallen zu entdecken, erhalten einen Malus in Höhe von 5 Punkten.

education.craftsman.descr=Man kann mit Fug und Recht behaupten, dass es auf ganz Lorakis keine Gemeinschaft gibt, die ohne Spezialisten im praktischen Gewerbe auskommt. Ganz egal, ob es sich um die Herstellung von Werkzeugen, Behausungen, Kleidung, Schmuck, Rüstungen oder Waffen handelt - für all diese Dinge braucht es entsprechend begabte Handwerker. Die Art und Weise, wie dieses Wissen erworben wurde, sowie dessen Umfang, können sich je nach Kultur erheblich unterscheiden. Bei den Tarr der Surmakar etwa werden alle grundlegenden handwerklichen Fertigkeiten vom ganzen Rudel an die Welpen weitergegeben, ohne dass dabei ein bestimmter Lehrplan verfolgt werden würde. In Turubar durchläuft ein angehender Edelsteinschleifer hingegen eine langjährige Ausbildung mit vielen aufeinander aufbauenden Lektionen. Zudem hängt die gesellschaftliche Stellung eines Handwerkers stark von den gesellschaftlichen Umständen ab. Nehmen etwa in Esmoda Waffenschmiede, Rüstungsmacher oder Steinmetze nur eine sehr niedrige Stellung ein, so üben in Selenia ihre in Zünften organisierten Berufsgenossen erheblichen politischen Einfluss aus. In Kungaitan zählen Maler, Bildhauer und Goldschmiede sogar zu den staatstragenden Akteuren - verfolgen sie doch ein der Handwerksgöttin Taomai gefälliges Leben. Manche Handwerker treibt dabei schlicht die Freude an der Tätigkeit an sich an, andere verfolgen weiterführende Ziele wie etwa den Erwerb von Reichtum oder Machtpositionen. Gründe, um in die Welt hinauszuziehen, gibt es unter ihnen ebenso viele. Sei es die Suche nach den besten Werkstoffen, der zahlkräftigsten Kundschaft oder den erfahrensten Lehrmeistern. Für eine Abenteurergruppe können Handwerker ein großer Gewinn sein - hängt Wohl und Wehe einer Unternehmung doch auch von der Qualität der mitgeführten Ausrüstung und besonderer technischer Kenntnisse ab. 
education.arkanomechanic.descr=Die in der Tradition des alten Kesh stehenden fleckengnomischen Arkanomechaniker verstehen es auf meisterliche Weise, ihre fortgeschrittenen mechanischen Kenntnisse mit einem ausgeprägten Talent für Bewegungsmagie zu verbinden. Ihre Erzeugnisse reichen dabei von kleinen Alltagshelfern wie Zeitmessern bis hin zu großen Apparaturen wie magisch betriebenen Minengeräten, Lastenkränen und Aufzügen.
education.stoneseer.descr=Die Steinseher Turubars verstehen sich nicht nur trefflich auf alle Facetten der Juwelierskunst, sondern sind darüber hinaus auch noch wahre Experten für Edelsteine aller Art, deren Rat und Dienste insbesondere in ihrer Heimat weithin geschätzt werden. Sie sind zudem wahre Meister darin, mit Hilfe der funkelnden Steine Einblick in die Wege des Schicksals zu nehmen.
education.jasanesBresche.descr=Jasanes Bresche nennt sich eine Zunft von Baumeistern aus dem dalmarischen Matandra, deren besondere Fähigkeiten auf dem Gebiet der Belagerungstaktiken und dem Bau von schwerem Kriegsgerät liegen. Unten ihnen finden sich daher einige der besten Pioniere, verschlagensten Saboteure und einfallsreichsten Erfinder von Belagerungsmaschinen in ganz Dragorea.
education.artefactHunter.descr=Artefaktjäger haben sich auf die Beschaffung wertvoller Gegenstände, wie etwa magischer Artefakte von großer Macht oder bedeutender göttlicher Reliquien, spezialisiert. Manche von ihnen treibt dabei die schlichte Gier nach Macht und Reichtum an, andere das Streben nach Erkenntnis - manche auch nach allem zugleich. Einige arbeiten auf eigene Rechnung, während andere reine Auftragsnehmer sind. Ihnen allen gemein sind ausgeprägte Fähigkeiten im Überwinden von Hindernissen - ganz egal, ob es sich dabei um Konkurrenten, Schließsysteme oder Fallen handelt.
education.jungleRunner.descr=Als ein von Gebirgsbewohnern abstammendes Volk fiel es den Keshubim vergleichsweise leicht, ihre militärischen Taktiken an die Gegebenheiten der neuen Dschungelheimat anzupassen. Aus den einstigen Gebirgskämpfern wurden daher schon bald die weithin gefürchteten Dschungelläufer Tar-Keshs. Lautlos und elegant bewegen sie sich durch die erhöhten Lagen ihrer grünen Heimat, stets fähig und bereit, unverhofft aus dem Hinterhalt zuzuschlagen.
education.cliffCaller.descr=Die Felsrufer Farukans sind weit über die Grenzen ihrer Heimat als wahre Meister von Felsen und Stein bekannt. Speziell in Turubar könnte keine Mine ohne ihre Fähigkeiten auskommen. Dabei gelten sie als eher schroffe Naturen, die im Umgang mit anderen sehr direkt und auch fordernd sein können. Ihre große Liebe gilt den zahlreichen Edelsteinen ihrer Heimat, deren Formen, Farben und Eigenschaften für sie ein endloser Quell der Faszination sind.
education.godsShepherd.descr=Die Keshabid huldigen vielen Göttern - je nachdem, welcher ihnen gerade für die jeweilige Situation am geeignetsten erscheint. Viele Keshabid nehmen dafür gerne die Dienste eines Götterhirten in Anspruch, deren umfassende Kenntnisse der lorakischen Götterwelt nur von wenigen außerhalb ihres Gewerbes erreicht wird. Die empathischen Gelehrten beraten in allen Lebenslagen und finden auch für jede noch so ungewöhnliche oder knifflige Situation einen passenden himmlischen Ansprechpartner. Götterhirten gelten gemeinhin als aufgeschlossen, und sind gesellige, wenn auch manchmal allzu neugierige Gefährten.
education.guardianOfPeace.descr=Die Hüter des Friedens haben ihr Leben voll und ganz den göttlichen Prinzipien des farukanischen Shalenki oder des keshabidischen Shanezi gewidmet: Friedfertigkeit, Hilfsbereitschaft und Gemeinschaft. Sie genießen daher sowohl unter Farukanis wie unter Keshabid großes Ansehen. Mit einem Konflikt konfrontiert, versucht ein Hüter des Friedens stets, diesen durch eine einvernehmliche Lösung aus der Welt zu schaffen. Stellt sich jedoch heraus, dass eine friedliche Übereinkunft nicht zu erreichen ist, wird auch ein Hüter im Notfall zur Waffe greifen, um die Unschuldigen und Hilflosen zu verteidigen.
education.expertOfDeep.descr=Die keshubischen Kundigen der Tiefe sind Meister der Schatten- und Erkenntnismagie, die sich vor allem der Erkundung des Tiefdunkels verschrieben haben. Sie sehen dieses als lebenswichtig für ihr Volk an, sollten die Farukanis oder andere Feinde sie dereinst auch aus dem Dschungel vertreiben - aber auch, um Rohstoffe zu gewinnen, die an der Oberfläche nur schwer zu erlangen sind. Sie führen mitunter Karawanen und Expeditionen durch die lichtlosen Tiefen an, oft ziehen sie aber auch völlig allein los, um neue Wege zu erkunden. Einige von ihnen sollen sogar verschlungene Pfade bis nach Farukan und in die Schattenwand kennen.