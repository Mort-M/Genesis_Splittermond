resource.creature.v6.meaning=Magische Kreatur / Raubtier

resource.relic=Relikte sind besondere Ausrüstungsgegenstände eines Abenteurers, die es nicht im Krämerladen an der Ecke oder beim \
 nächsten Waffenschmied zu kaufen gibt. Dies können uralte Familienerbstücke sein oder mystische Artefakte, die dem Abenteurer \
 innerhalb seiner Ausbildung zugefallen sind. In jedem Fall haben Relikte für ihn stets einen ideellen Wert.\n\
 Jeder Punkt in dieser Ressource erhöht entweder die Gegenstandsqualität (siehe S. 142) des Relikts um 1 oder macht es zu \
 einem Strukturgeber mit einer Artefaktqualität im Wert von 1 Punkt (siehe S. 254). Die beiden Optionen lassen sich \
 kombinieren, um etwa ein verbessertes Relikt mit zusätzlichem magischem Effekt zu erhalten.\n\
 Besonders große oder mächtige Objekte können ohne weitere \
 Verbesserung oder Verzauberung nach Spielleiterentscheid mehr Punkte kosten.\n\
 Die Ressource kann mehrfach erworben werden, um unterschiedliche Relikte zu besitzen.
