resource.status=Der Stand eines Abenteurers spiegelt seinen formellen Status innerhalb der Gesellschaft wider. In vielen Gegenden von Lorakis \
 gibt es hierbei eine stark ausgeprägte Hierarchie mit gravierenden Unterschieden zwischen den einzelnen Schichten, die sich fast \
 immer in einem unterschiedlichen Rechtsstatus und anderen Privilegien äußern. Beispiele hierfür sind etwa die Adelssysteme \
 Dragoreas oder die strikten Hierarchien in Teilen Takasadus. Auch wenn diese Strukturen zwischen den verschiedenen lorakischen \
 Regionen stark differieren, hat der Stand über Landesgrenzen hinaus oft große Bedeutung: Ein Würdenträger eines fremden Reiches wird \
 anders empfangen als ein dahergelaufener Handwerksgeselle.\n\
 Es ist zu beachten, dass der Stand zwar häufig, aber nicht immer mit dem Ansehen eines Abenteurers korrespondiert. Natürlich ist \
 auch ein Adliger bekannt und genießt gewisse Privilegien, aber eher wegen seines Titels und seiner Familie. Die Ressource Ansehen \
 bezieht sich auf persönlich erworbenen Ruf. Wer hohen Stand und niedriges Ansehen besitzt, könnte etwa ein tyrannischer König \
 oder ein verräterischer Baron sein.
