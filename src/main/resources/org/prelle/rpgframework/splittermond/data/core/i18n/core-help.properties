resource.wealth=Das Vermögen ist ein abstraktes Maß für den materiellen Besitz und den Lebensstandard eines Abenteurers. Hierdurch soll \
 verhindert werden, dass über jede Hafergrütze und jeden gekauften Mantel detailliert Buch geführt werden muss. Der durch Vermögen \
 bedingte Lebensstil deckt alle kleineren Ausgaben wie Essen, Unterkunft, normale Kleidung und Einkäufe von Waren des täglichen \
 Bedarfs im Rahmen des Lebensstils ab. Größere Anschaffungen wie Waffen, Rüstungen, Reittiere, Schiffe, besondere Ausrüstung, \
 Festgewänder oder gar Immobilien können hingegen nicht über den Lebensstil finanziert werden. Die Ressource bestimmt darüber \
 hinaus das frei verfügbare Startvermögen eines Abenteurers.
