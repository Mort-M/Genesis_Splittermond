resource.rank=Es gibt eine Vielzahl von Organisationen und einflussreichen Gruppierungen, in denen ein Abenteurer Mitglied sein kann.\
 Die Ressource Rang bestimmt dabei seinen Platz innerhalb der Hierarchie der betreffenden Organisation, was in den meisten \
 Fällen gewisse Befugnisse mit sich bringt, häufig Einsichten in tiefere Geheimnisse der Gruppe nach sich zieht oder \
 Befehlsgewalt über rangniedere Mitglieder der Organisation verleiht.\n\
 Allerdings ist nicht jede Organisation gleich mächtig und einflussreich, sodass ein niederer Rang in einer äußerst mächtigen \
 Gruppierung mehr Punkte kosten kann als ein hoher Rang innerhalb einer sehr kleinen.\n\
 Die Ressource kann bei Mitgliedschaften in mehreren Organisationen mehrfach erworben werden. Dies kann zu Interessenskonflikten \
 führen und nicht jede Organisation wird dies zulassen.\n\
 Wer einen Rang bekleidet, der muss sich ihm entsprechend verhalten und die Gebote und Verbote seiner Gemeinschaft achten, \
 um auf die Annehmlichkeiten seiner Position zurückzugreifen. So kann ein Komtur des Wächterbundes zwar über die Wächter seiner \
 Burg verfügen und ihnen Befehle erteilen \u2013 aber nur, wenn dies im Einklang mit den Zielen des Ordens steht, sonst steht \
 er schnell einer Opposition in der eigenen Burg gegenüber. Auch sollte beim Rang immer bedacht werden, dass es meist noch \
 übergeordnete Personen gibt, die einem Abenteurer mit Rang Aufträge erteilen können, die er in gewissem Maße erfüllen muss.
resource.rank.v1.meaning=Rekrut
resource.rank.v2.meaning=Mitglied
resource.rank.v3.meaning=Erprobtes Mitglied
resource.rank.v4.meaning=Amtsträger
resource.rank.v5.meaning=Berater
resource.rank.v6.meaning=Anführer

resource.faith=Die meisten Lorakier glauben an diverse Götter und würden deren Existenz nie anzweifeln, sondern wenden sich diesen meist mit inbrünstiger Verehrung zu. Doch nur wenige Sterbliche stehen tatsächlich so sehr in der Gunst oder im Augenmerk einer Gottheit, dass diese ihnen in kritischen Situationen aus eigenem Antrieb hilft. Dieses spezielle Band zu einem Himmlischen wird über die Ressource Glaube abgebildet.
resource.faith.v1.meaning=Gottheit ist sich der Existenz des Gläubigen vage bewusst
resource.faith.v2.meaning=Gottheit ist sich der Existenz des Gläubigen deutlich bewusst
resource.faith.v3.meaning=Gottheit verfolgt Leben des Gläubigen mit leichter Neugier
resource.faith.v4.meaning=Gottheit verfolgt Leben des Gläubigen mit Interesse
resource.faith.v5.meaning=Gottheit verfolgt Leben des Gläubigen mit Sympathie
resource.faith.v6.meaning=Liebling der Gottheit

culture.albseebund.desc=Die auch als Vindarai bekannten Seealben bilden eine Gemeinschaft, die auf unzähligen Inseln und noch mehr Schiffen in der Alben- und der Kristallsee leben. Der Albische Seebund ist in vielen Städten am Rand des Binnenmeers ein gern gesehener Handelspartner, umgekehrt aber sehen die Vindarai Besucher in ihren vielgerühmten, gläsernen Städten immer mit einer gewissen Skepsis.
culture.ashurmazaan.desc=In Ashurmazaan, einem Teilreich des großen Farukans, werden die hehren Ideale von Ehrenhaftigkeit, Wahrhaftigkeit und Mut hochgehalten \u2013 und nicht ohne Stolz blickt das Land auf seine tapferen Krieger, wissbegierigen Gelehrten und weisen Priester. Aber auch für Gastfreundschaft und Respekt gegenüber Fremden sind die Ashurmazaanis weit über die Grenzen ihrer Heimat bekannt. Nur wer sich unehrenhaft verhält, bekommt ihren ganzen Zorn zu spüren.
culture.daemmeralb.desc=Schon seit Jahrtausenden sind die Dämmeralben ein Teil des urtümlichen Dschungels Arakeas im Süden von Lorakis. Das sich selbst als Andarai bezeichnende Volk lebt im Einklang mit der Natur und spiegelt viele Facetten des Regenwaldes wider: Die farbenfrohe, vor Leben überbordende Vielfalt erkennt man genauso wieder wie die grausam erscheinende Kompromisslosigkeit der unbändigen Natur.
culture.furgand.desc=Die Furgand, von Fremden auch aufgrund ihrer Lebensweise tief in den Gebeinen der Berge Vulkanzwerge genannt, leben vorwiegend in den unwirtlichen Gebirgen Dragoreas, wo sie dem Fels seine Schätze und Geheimnisse abtrotzen. Ihre zurückgezogene Lebensweise und ihre für andere Kulturen mitunter schwer erreichbaren Siedlungen haben sie gegenüber der Außenwelt meist misstrauisch und vorsichtig gemacht. Wenn man sich allerdings erst einmal ihr Vertrauen verdient hat, so sind die Furgand treue Verbündete und Freunde.
culture.ioria.desc=Eine so bunte Mischung an Völkern und Kulturen wie in Ioria findet man nur an wenigen Orten auf Lorakis. Die um die Himmelstreppe \u2013 den Götterberg \u2013 gebaute Metropole beherbergt das große Orakel der Götter und blüht vor Leben. Neben den weisesten Priestern des Kontinents hat sie vermutlich auch die übelsten Scharlatane und gewieftesten Geschäftsleute hervorgebracht. So ergibt sich in der größten Stadt des Kontinents, die auf uralten Fundamenten ruht und die das Ziel vieler Pilger aus der ganzen bekannten Welt ist, eine explosive Mischung.
culture.keshabid.desc=Die Keshabid sind ein vertriebenes Volk von Fleckengnomen in Pash Anar. Sie stammen ursprünglich von den Südhängen der Schattenwand im heutigen Turubar, wo sie einst das sagenumwobene Gnomenreich Kesh beherrschten. Nach ihrer Versklavung durch die Farukanis wurde das Volk in alle Winde zerstreut und lebt heute, nachdem es seine Freiheit wiedererlangt hat, in den Städten der verschiedenen Shahirate. Ihr gemeinsames Schicksal hat die Keshabid eng zusammen geschmiedet.
culture.mertstaedt.desc=Der Mertalische Städtebund ist ein Zusammenschluss neun großer Städte, die gemeinsam die gesamte Halbinsel beherrschen, über die sich einst das Reich Mertalia erstreckte. In den vergangenen Jahrhunderten sind viele Flüchtlinge aus unterschiedlichen Regionen eingewandert und haben kulturelle Einflüsse mitgebracht. So verschieden die neun Städte und ihre Einwohner sein mögen, so eint sie doch ihr Selbstverständnis als überzeugte Städter und der feste Glaube, hier durch eigene Leistung ihr Glück machen zu können.
culture.pashtar.desc=Kein anderer Teil des großen Farukans ist so weltoffen und von verschiedensten Völkern bewohnt wie Pashtar. Nur eine kurze Seereise von Ioria entfernt, ist man hier den Anblick Fremder gewohnt und fast jeder Pashtari spricht mindestens eine Fremdsprache. Man ist gesellig, gastfreundlich und außerordentlich geschäftstüchtig, denn fast aller Seehandel und ein Großteil des farukanischen Flusshandels läuft über Pashtar.
culture.selenia.desc=Selenia ist das größte und mächtigste Reich in Dragorea: Vier Feudalreiche haben sich vor drei Generationen zusammengeschlossen und so ein neues Machtzentrum unter der Herrschaft des Mondenthrons begründet. Auf diesem sitzt seit kurzem erst Selenius III., jugendlicher Kaiser und Herrscher über fruchtbare Erde und reiche Ressourcen.\nSelenia ist ein Feudalreich, in der es neben dem Adel und dem dominierenden Kaiserhof in Sarnburg eine gut gestellte Bürgerschaft gibt. Die Städte sind oft groß, mit florierendem Handel und Handwerk. In den Gassen tobt das Leben \u2013 sowohl das lichte als auch das zwielichtige. Auf dem Land überwiegen Weiler und Dörfer, die auf fruchtbarem Ackerland liegen und in den seltensten Fällen befestigt sind.
culture.tarr.desc=In den unbarmherzigen Weiten der großen Wüste Surmakar lebt das Vargenvolk der Tarr. In Rudeln zieht es umher, handelt mit den umliegenden Ländern oder treibt seine Herden nach dem Lauf der Jahreszeiten. Einmal im Jahr treffen alle Tarr aufeinander und folgen gemeinschaftlich in Handel, Kämpfen und Ritualen den Traditionen. Ehre, Stolz und der tiefe Glaube an die Macht der Geister, die alles beseelen, bestimmen das Wesen dieses Volkes.
culture.waechter.desc=Der Wächterbund ist ein Orden entschlossener Männer und Frauen, der die Grenzen der Verheerten Lande in Dragorea bewacht. Sie verstehen sich als Beschützer der freien Lande vor den von der Finsternis korrumpierten Kreaturen. Als Finsternis wird dabei die in den Verheerten Landen lauernde Kraft verstanden, die als Feind der Götter und der Schöpfung gilt.\n\nANMERKUNG: Diese Kultur wird nur gewählt, wenn man von frühester Kindheit an im Orden aufwächst. Wer als Erwachsener dem Orden beitritt, wählt die Werte seiner Heimatkultur.
culture.zwingard.desc=Zwischen den Küsten der Kristallsee und den Savannen der Orks hält im Süden Dragoreas ein Reich eherne Wacht: Zwingard, das Land der tausend Burgen.\nDen Namen trägt das Land zurecht, denn zahllose Ritter und Festungen bieten den Leuten hier Schutz vor den Orks der Blutgrasweite. Aber nicht nur die Ritter schützen das Land, wehrhafte Menschen findet man hier überall, sei es auf dem Schlachtross oder auf dem Acker.

education.elementalist.descr=Der Elementarist beschäftigt sich mit den Urkräften der Welt und versucht, die Elemente in ihrer Gesamtheit zu erfassen, um sie sich zunutze zu machen. Dabei setzt er sich ihnen eher direkt aus und studiert sie im Freien als in einer Schreibkammer oder einem alchemistischen Labor. Sein Ziel ist es, die Elemente zu verstehen, zu beherrschen und in seinem Sinn zu formen. Elementaristen lernen die Widerstandsfähigkeit von Stein und Erde, die wütende, zerstörerische Kraft des Feuers, die geschwinde Wendigkeit der Luft und die geduldige Durchsetzungskraft des Wassers. Ein Elementarzauberer, der die Natur ebenso kennt wie die Lehren der Magie, vermag es, gewaltige Kräfte zu kontrollieren.\n\nEinige Elementaristen leben zurückgezogen in der Wildnis und erforschen die Kräfte, die dort am Werk sind, während andere an den Höfen ihre Zauber in den Dienst der Mächtigen stellen. Neben ihrer Spezialisierung auf die elementaren Magieschulen beschäftigen sich die Elementaristen in geringerem Maße mit anderen Spielarten wie Schutz- oder Bannmagie. Diese Kenntnisse kommen ihnen zugute, wenn sie sich mit den Wesen der Anderswelten beschäftigen. Erfahrene Elementaristen können mächtige Wesen der verschieden Elemente aus diesen Sphären beschwören und neben seinen magischen Kräften ist ein Elementarist ein guter Ratgeber, wenn es um das arkane Verständnis oder das Wissen über die Wunder der Natur geht.\n\nMit ihren Zauberfähigkeiten sind Elementaristen darüber hinaus in der Lage, sich und andere sowohl vor übernatürlichen Gefahren als auch vor zerstörerischen Naturgewalten zu schützen. Sie können beschworene Kreaturen verbannen und sich gegen magische Angriffe verteidigen. Ihre Stärke liegt gerade in der Vielfalt ihrer Magie. Mit den vier elementaren Magieschulen können sie nicht nur Gegner mit Feuer oder Eis bekämpfen, sondern auch Stein verformen oder Wind herbeirufen, der sie emporhebt oder ihre Gegner zurückschleudert. Ein Elementarist kann sich mit Magie wie ein Fisch durchs Wasser bewegen oder mit Luft- und Feuertricks ein Publikum zum Staunen bringen. Die Möglichkeiten der Elementarmagie sind vielseitig: Es gibt unter Elementaristen neben friedlichen Hütern der Natur kampferprobte Magier, die mit der entsprechenden Meisterschaft ganze Schiffe in ein Feuermeer tauchen oder eine ganze Abenteurergruppe mithilfe des Windes über die Mauern einer Burg tragen können.
education.circleelementalist.descr=Die Magier des Zirkels der Zinne genießen im Kaiserreich Selenia hohes Ansehen. Die Elementaristen unter ihnen untersuchen die Mächte der Elemente eher als Gelehrte denn als Wanderer in der Natur. Die selenischen Magier benötigen für ihre Stellung in der Gesellschaft diplomatische Fertigkeiten.
education.firecaller.descr=Die bekanntesten der farukanischen Feuerrufer beherrschen vor allem die Flammen. Wie alle Elementarrufer ihrer Heimat pflegen sie einen eher mystischen Zugang zu den Elementen und verkehren oft mit den Wesen der Anderswelten wie den vielgestaltigen Djinnen.
education.masterofstone.descr=Die Steinmeister der Furgand sind, wie der Name verrät, vor allem auf das Beherrschen von Gestein in allen Formen spezialisiert. Ihre Kenntnisse machen sie zu geschickten Handwerkern und Felsformern, denen auch die Wesen aus dem Innern der Berge zu Diensten sind.
education.tempesttamer.descr=Die Sturmbändiger der Vindarai verzichten auf die zerstörende Kraft des Feuers und versuchen, im Meistern von Luft- und Wassermagie die Urgewalt des Meeres zu begreifen. Sie sind auf den Schiffen des Albischen Seebundes gerne gesehen.
education.explorer.descr=Die Aufgabe von Entdeckern ist es, Dinge zu erforschen, die bisher unbekannt auf oder unter der Oberfläche von Lorakis schlummern. Als Kartographen verzeichnen sie die Lage und Ausdehnung von Wäldern, als Prospektoren untersuchen sie Bäche und Felsen, um Bodenschätze zu finden, als Handelsagenten suchen sie profitable Karawanenrouten und als Altertumskundler spüren sie den Sagen und Legenden der Drachlinge und anderer vorzeitlicher Völker nach.
education.searcherofforefathers.descr=Die Hinterlassenschaften ihres vertriebenen Volkes in Turubar aufzuspüren, haben sich die keshabidischen Ahnensucher zur Aufgabe gemacht. Der Geheimbund forscht nach verborgenen Grabmälern und Tempeln und besitzt das Wissen, die ausgeklügelten Sicherungen zu umgehen.
education.truthseeker.descr=Die Orakelpriester Iorias suchen stets nach Bestätigungen (oder Falsifizierungen) ihrer Deutungen der kryptischen Orakelsprüche. Zu diesem Zweck unterhalten sie eine kleine Truppe von Wahrheitsfindern, die alle Lande von Lorakis durchreisen, um vor Ort die Einträge der Kristallchroniken mit der Wirklichkeit zu vergleichen.
education.wavewalker.descr=Die Wogenwanderer des Albischen Seebunds gelten als weltabgewandte Mystiker, auch wenn sie auf vielen Schiffen die Kristallsee und die angrenzenden Meere befahren und als Navigatoren zu den wichtigsten Personen an Bord gehören. Sie ziehen meist auf kleinen Booten alleine aus, um fremde Küsten zu erforschen, nur dem Flüstern des Windes folgend.
education.faithwarrior.descr=In Lorakis gibt es nicht nur zahlreiche Götter, sondern auch ebenso viele Kriege, Konflikte und ständig lauernde Gefahren. Daher werden viele göttliche Wesen zum Schutz der Gemeinschaft angerufen werden und haben sich ihre Diener dem Kampf verschrieben. Den Weg zum Glaubenskrieger beschreiten meist nur diejenigen, die sich direkt von den Göttern berufen fühlen und voller Inbrunst in die Schlacht ziehen. Dabei ist es gleich, ob man einem Kriegsgott dient oder im Namen einer anderen Gottheit die Gläubigen schützt und Frevler bestraft.
education.baruopriest.descr=Die seealbischen Priester des Baruo dienen dem schwarzen Narwal, der alle Feinde seines Volkes straft. Sie schützen die Vindarai vor Piraten, Meeresungeheuern und den Gefahren der See. Man sieht sie ebenso häufig an Bord der großen Segelschiffe wie in den vielen Hafenstädten rund um die Albensee.
education.whitewatcher.descr=Die Weißen Wächter sind für viele Reisende das bekannteste Gesicht Iorias. In ihren schweren, weißen Panzerrüstungen halten die Diener des Gottes Theris das Recht und die Ordnung innerhalb der Mauern der Metropole aufrecht und strafen jeden, der sich den Gesetzen der Orakelstadt widersetzt.
education.ghosttearer.descr=Weit über die Surmakarwüste hinaus sind die Geistreißer der Tarr bekannt, die sich im Namen ihrer Götter dem Kampf mit den bösen Geistern und ihrer Bannung verschrieben haben. Es heißt, ihre obersten Priester könnten solche Wesen verschlingen, um sich ihre Kräfte einzuverleiben.
education.shieldmaid.descr=Die Schildmaiden Zwingards sind glühende Verehrerinnen der Valkyrji. Üblicherweise haben die rein weiblichen Mitglieder dieses Ordens eine der Musen des Kampfes erwählt und vertreten deren Tugenden besonders, um den Gläubigen das Ideal vorzuleben.
education.healer.descr=Heiler gibt es in Lorakis überall, doch gleichen sich die gelehrten Handwerker der verschiedenen Regionen kaum. Alle behandeln Krankheiten, versorgen Verletzungen, bekämpfen Vergiftungen oder flicken Knochenbrüche, sind in den Methoden aber sehr unterschiedlich, da in ihrer Kunst kulturell geprägt. Manche lernen bei einem alten Medicus, einem Knochenflicker oder einem Bader, andere besuchen eine Schule, die neben dem Handwerk eine weite Bildung vermittelt.
education.lifeguardian.descr=Die Lebenswächter des Wächterbundes sind eine eingeschworene Gemeinschaft, die alle von der Finsternis berührten Lebewesen erforscht, um ihre Schwachstellen zu erfahren. Doch auch als Heiler in den Burgen oder auf Patrouillen leisten sie unschätzbare Dienste für ihre Brüder und Schwestern.
education.potionmaster.descr=Die Trankmeister der Keshabid reisen häufig umher, um ihre Dienste anzubieten und ihre Tinkturen zu verkaufen. Man sagt, sie könnten den Mond in eine Flasche sperren und das Leben selbst verkorken, und auch ihre Geschäftstüchtigkeit ist in ganz Farukan legendär.
education.delarain.descr=Im dichten Unterholz und in den hohen Wipfeln der Baumriesen sammeln die Delarain, die Kräuterkundigen der Andarai, ihr Gut. Nicht nur zur Heilung, sondern auch zur Besänftigung von Tieren oder zur Beeinflussung des Gemüts nutzen sie Blüten und Beeren, die andere nicht einmal finden würden.
education.ghosthealer.descr=Aus getrockneten Schlangen und zerstoßenen Vogelkrallen fertigen die Geistheiler der Tarr Salben und Pasten. Sie bemalen die Krieger ihres Stammes, um sie vor bösen Geistern zu schützen und ihre Kräfte zu stärken.
education.fighter.descr=Es gibt viele Kämpfer auf Lorakis, seien es Söldner, Glücksritter oder wilde Stammeskrieger, seien es Schwertmeister, disziplinierte Soldaten oder Leibwächter. Sie stammen aus den unterschiedlichsten Ländern, folgen verschiedenen Traditionen und mögen ebenso von reiner Gesinnung wie verschlagene Einzelgänger sein. Sie können für Gold oder ihren Herrn streiten, eines aber ist ihnen allen gemein: Der Kämpfer kümmert sich ums Grobe.
education.weaponsmaster.descr=Die Waffenmeister aus Eisenbrann entstammen häufig stolzen Söldnerfamilien, die schon seit Generationen im Dienst der mertalischen Städte stehen. Im Intrigenspiel der Mertalischen Halbinsel müssen sie sich mehr mit Politik beschäftigen als andere Krieger und auch für den Kampf zur See gerüstet sein.
education.fameseeker.descr=Für die Ruhmsucher Ashurmazaans geht es vor allem darum, ihre persönliche Ehre durch Heldentaten zu mehren. Durch großes Können, das Perfektionieren vielseitiger Fähigkeiten im Kampf und das Bestehen beeindruckender Abenteuer machen sie sich einen Namen und bringen ihrer Familie großes Ansehen ein.
education.fang.descr=Die Reißzähne der Tarr widmen ihr ganzes Training den Ritualkämpfen ihrer Wüstenheimat. Um ihre Ausbildung abzuschließen und weitere Kampftechniken zu erlernen, ziehen sie auf Wanderschaft und sind nicht zuletzt dank ihrer Stärke auch über die Heimat hinaus als Gegner gefürchtet.
education.clanwarrior.descr=Für ihre Disziplin sind die Klankrieger der stolzen Furgand bekannt. Ihre grimmige Entschlossenheit und Moral haben sie schon oft gegen überlegene Gegnermassen bestehen lassen. Die Zwerge verfügen über schwere Kriegskutschen und nutzen ausgefeilte Kriegsmaschinen.
education.scout.descr=Eine große und wilde Welt wie Lorakis befindet sich ständig im Wandel und birgt viele Gefahren. Wo vergangene Woche noch ein Pfad durchs Tal führte, mag heute schon ein Erdrutsch den Weg versperren oder ein Drache auf die Jagd gehen. Um nicht ahnungslos in eine Falle zu laufen, muss man wissen, was in der Umgebung vor sich geht. Dies gilt für eine Handelskarawane genauso wie für einen Heerzug oder eine Dorfgemeinschaft. Kundschafter übernehmen die Aufgabe, diese Gefahren unbemerkt zu beobachten und vor ihnen zu warnen. Heimlichkeit ist ihr Markenzeichen, denn ein falscher Schritt und ihr Leben ist in Gefahr.
education.shadowrunner.descr=Die Schattenläufer sind die Augen und Ohren des Wächterbundes. Die furchtlosen Einzelgänger sind verlässliche Späher, die sich tief in die Verheerten Lande vorwagen, um Erkenntnisse über die Kreaturen der Finsternis und magische Bedrohungen zu erlangen.
education.seahawk.descr=An allen Küsten der Kristallsee und darüber hinaus trifft man auf pashtarische Seefalken. Sie werden für ihren seefahrerischen Mut geschätzt und wegen ihres Trickreichtums gefürchtet. Wem sonst gelänge der ungesehene Diebstahl eines Schiffes aus dem Hafen von Talaberis?
education.treetopscout.descr=Die Wipfelspäher der Dämmeralben beziehen ihre Beobachtungsposten vorzugsweise in den höchsten Baumkronen und sind dort nahezu unsichtbar. Ihr Klettergeschick sucht in Lorakis seinesgleichen.
education.pathfinder.descr=Bei den meisten gnomischen Gemeinschaften bilden die Wegfinder eine angesehene Zunft (die häufig mit der in ganz Lorakis operierenden Handelsgilde zusammenarbeitet). Sie können sich in den Welten hinter den Toren orientieren und sind als Begleiter der Portalkarawanen quasi unentbehrlich. Bisweilen brechen sie auch auf, um auf eigene Faust neue oder bessere Wege in den Feenlanden zu erkunden. Ihre Erfahrungen in der Anderswelt machen sie zu exzellenten Erforschern diesseitiger Mysterien.
education.magicmediator.descr=In den meisten Kulturen auf Lorakis gehören Magische Unterhändler bei wichtigen Verhandlungen und Konsultationen zu den üblichen Gepflogenheiten. Die gut ausgebildeten Spezialisten sollen folgenschwere Missverständnisse bei Friedensabkommen verhindern, Sprachbarrieren überbrücken oder generell für ein gutes Gesprächsklima in kritischen Situationen sorgen. Häufig treten sie direkt als Gesandte ihres Dienstherrn auf, um delikate Verträge auszuhandeln oder geheime Bündnisse zu knüpfen.
education.mediator.descr=Vor allem rund um die Kristallsee bekannt ist die Mediatorengilde aus der mertalischen Stadt Fulnia, deren Mitglieder gegen Honorare wichtige Geschäftsabschlüsse vermitteln, Friedensverhandlungen zwischen verfeindeten Reichen leiten oder auf den Schiffen der Seemächte Dienst tun, um den Kontakt mit fremden Völkern herzustellen. Die Mediatoren folgen einem strengen Ehrenkodex, der sie zu strikter Neutralität und absoluter Verschwiegenheit verpflichtet.
education.discipleoflyxa.descr=In vielen großen dragoreischen Städten gibt es die Jünger von Lyxa, die sich mithilfe ihrer Redekünste und arkanen Fähigkeiten Vorteile verschaffen, indem sie vortäuschen, zur jeweiligen Oberschicht zu gehören oder im Auftrag eines wichtigen Würdenträgers zu handeln. In allem, was sie tun, versuchen diese magischen Hochstapler, ihrer geheimnisvollen Gottheit, der vielgesichtigen Lyxa, nachzueifern.
education.desertsage.descr=Die Wüstenweisen der Tarr sind das Bindeglied zwischen den einzelnen Rudeln der Wüstenvarge. Wenn sich zwei Karawanen treffen, handeln sie den Warentausch, eventuelle gemeinsame Winterlager oder das Überlassen lebensnotwendiger Vorräte aus. Während des Großen Rudeltreffens bilden die Wüstenweisen den Rat des Lichts, der für den Erhalt des Friedens in der großen Zeltstadt verantwortlich ist.
education.mysticwarrior.descr=Lorakis ist eine magische und zugleich bedrohliche Welt, sodass an vielen Orten zähe Kämpfer und weise Zauberer gegenwärtig sind. In manchen Kulturen sind dabei besondere Kampfstile entstanden, die die Fähigkeiten beider Welten miteinander verbinden und Streiter hervorbringen, die nicht allein über kriegerische Fähigkeiten verfügen, sondern Magie und profanen Kampf in einer organischen Verbindung vereinen.
education.skeftamagi.descr=Wenn die Thaine Zwingards zur Waffenübung rufen, halten sie Ausschau nach besonders begabten Bogenschützen, die die Möglichkeit erhalten, zu Skeftamagi oder Pfeilzauberern ausgebildet zu werden. Diese besonders ehrenvollen Streiter sichern die Wälder und Grenzen des Lands der tausend Burgen und strecken ihre Widersacher oft schon auf weite Entfernung nieder, ohne überhaupt eine Klinge ziehen zu müssen.
education.bladedancer.descr=Die Klingentänzer des Albischen Seebunds haben sich stärker als andere Mystische Krieger der Zauberei verschrieben. Sie schwächen oder verletzen ihre Gegner mit Magie, bevor sie sich ihnen im anmutigen, ja fast verspielten Nahkampf zuwenden.
education.runewarrior.descr=In allen Zwergenreichen auf Lorakis sind die todesmutigen Runenkrieger wohlbekannt, die den unnachgiebigen Kampf gegen alle Feinde der Zwergenvölker suchen und durch die auf sich selbst oder der Ausrüstung angebrachten Zauberzeichen als unaufhaltsam und unverletzlich gelten.
education.lorepriest.descr=Die Welt weist zahllose Wunder auf und in allen Reichen gibt es weise Männer und Frauen, die das Wissen darüber sammeln und hüten. Insbesondere in Tempeln und Klöstern werden wissbegierige Priester ausgebildet, nicht nur um den Göttern zu huldigen, sondern auch um das Wesen der Welt zu erforschen. Manche dieser Gelehrten verlassen die Schreibstube nie oder studieren jahrelang die Kräuter im Klostergarten. Viele Priester führt die Neugier aber in die Welt hinaus. Wenn sie sich mit anderen Gelehrten über ihre Erkenntnisse austauschen wollen, bleibt ihnen oft nichts anderes übrig, als weite, gefährliche Wege in Kauf zu nehmen.
education.drakeguardian.descr=Die Drakenwächter aus dem Wächterbund dienen verschiedenen Göttern, doch halten sie stets Skalangor in Ehren, den drachischen Gefährten der standhaften Vangara. Sie sammeln das Wissen über die Kreaturen und Schrecken aus den Verheerten Landen. Als Verteidiger gegen die Schrecken der Verheerten Lande lernen sie auch den Umgang mit Waffen. Drakenwächter ziehen immer wieder aus, um mehr über die Finsternis in der Welt zu erfahren.
education.keeperofsecrets.descr=Ioria, die Orakelstadt, ist ein Hort der Gelehrsamkeit. Weise und Wissbegierige aus allen Ländern kommen in die Stadt, doch auch der Orden der Bewahrer beschäftigt Gelehrte, um die in der der Kristallchronik gesammelten Orakelsprüche zu verstehen und zu deuten. Die Hüter der Geheimnisse sind Priester von Jarakah oder Eughos, die sowohl die Prophezeiungen studieren als auch die Stadt verlassen, um das Wissen zu erlangen, das benötigt wird, um die Orakelsprüche zu begreifen.
education.discipleofrahidis.descr=Die farukanischen Jünger Rahidis suchen nicht im Auftrag eines weltlichen Herrn nach Erkenntnis. Vielmehr suchen sie Wissen als reinen Selbstzweck und zur Mehrung ihres Horizonts, um somit ihrem Gott gefällig zu sein. Im Gegensatz zu vielen, die Wissen sammeln, teilen sie ihre Kenntnisse gerne mit anderen und sind bekannte Lehrer.
education.adeshbid.descr=Auch die Adeshbid, die Bewahrer der Traditionen, verstehen sich als Lehrmeister. Diese Keshabid dienen neben der restlichen Götterfamilie vor allem Durbash, dem Bewahrer, und reisen durch ganz Farukan, um den Kontakt zwischen den unterschiedlichen Sippen ihres Volkes aufrechtzuerhalten.
education.intriguer.descr=In fast allen Kulturen auf Lorakis gibt es mitunter die Notwendigkeit, auf unorthodoxem Wege ein Ziel zu erreichen. Hier können nicht nur Heimlichkeit und Verschlagenheit von großer Hilfe sein, sondern auch eine flinke Zunge und ein tiefes Verständnis für das Wesen des Gegenübers. Gleich ob als Spione, Diplomaten, gewitzte Höflinge, ruchlose Intriganten, verschlagene Glücksritter oder schlichte Überlebenskünstler: Ränkeschmiede sind Experten auf diesem Gebiet.
education.legendsinger.descr=Die Legendensänger sind in Zwingard gern gesehen, bringen sie doch Geschichten aus fernen Ländern und alten Zeiten. Sie sind Meister des Vortrags, schlichten oft Streitigkeiten zwischen den Thainen und dienen als fahrende Richter. Mitunter werden sie von Burgherren in geheimer Mission ausgesandt, da sie sich auf die Kunst des Wortes hervorragend verstehen und so oft Geheimnisse in Erfahrung bringen können.
education.waveenvoy.descr=Die Wogenboten aus dem Seealbischen Bund dienen oft als Emissäre in fremde Länder. Man sagt ihnen nach, dass sie nicht nur Verhandlungen führen, sondern auch stets Augen und Ohren nach allerlei Nützlichem offen halten. Gelegentlich sollen sie hierzu gar ehrenrührige Mittel einsetzen. In jedem Fall sind die Wogenboten für ihre Beherrschung der guten Sitten bekannt, was einen ihre Meisterschaft in der Kunst der Verschlagenheit oft vergessen lässt.
education.gutterprince.descr=In Ioria kennt man die Gossenprinzen, an denen außer dem Namen nichts Edles ist. Mit diesem Titel werden all jene bezeichnet, die es perfekt verstehen, sich im Intrigenspiel der Unterstadt zu bewegen, und dort durch ihre Seidenzunge ein gutes Auskommen finden. Sie können durch Kontakte, Redegewandtheit und Verschlagenheit, oft gegen klingende Münze, die Armen gegen alles und jeden aufbringen oder aber die wütenden Massen besänftigen.
education.warrior.descr=Der dragoreische Ritter hoch zu Ross, mit blitzender Rüstung und wehender Helmzier, die farukanische Sipahi, im Kampf stets nach der größten Ehre strebend, oder der seealbische Anführer, dessen Zunge so scharf ist wie seine Klinge: nur wenige Personen inspirieren mehr Heldengeschichten als die Recken.
education.wyrmbannknight.descr=Die Ritter des Wyrmbann aus Zwingard suchen nach Artefakten aus den Schmieden der Drachlinge. Sie haben ihr Leben dem Kampf gegen die Drachen gewidmet und stehen in Rivalität zum Wächterbund.
education.swordjudge.descr=Die selenischen Schwertrichter ziehen im Namen des Kaisers durch Selenia. Anders als ihr Name es vermuten lässt, sind sie keine Henker: Sie dienen an entlegenen Orten als Schlichter bei Streitigkeiten und als Vermittler zerstrittener Parteien und setzen das Gesetz des Kaisers durch.
education.bladeguardian.descr=Die Klingenwächter, die besonders in der Kampfkunst geschulten Angehörigen des Ordens, bilden das Rückgrat des Wächterbundes bei der Wacht über die Verheerten Lande. Klingenwächter müssen von Zeit zu Zeit in die Welt hinausziehen, wenn es heißt, das Rätsel einer Ruine oder eines Artefaktes zu lüften, dessen Ursprünge in fernen Ländern ruht. Die Klingenwächter streiten nicht für das Gute, sondern vor allem gegen die Finsternis, die alle Länder zu verderben droht.
education.sipahi.descr=In ganz Farukan kennt und achtet man die Orden der Sipahis aus Ashurmazaan; ehrwürdige Panzerreiter, denen die Ehre ihrer Gemeinschaft über alles geht. Sie ziehen aus, um den Ruf ihrer Orden in Farukan und darüber hinaus zu mehren und damit den Glanz Ashurmazaans selbst in weit entfernte Reiche zu tragen.
education.shadowblade.descr=Nicht immer ist es sinnvoll, mit gezückter Waffe und einem Kampfschrei auf den Lippen auf einen Gegner zuzustürmen. Manchmal kann es angebracht sein, sich einem Kontrahenten unbemerkt zu nähern und aus dem Verborgenen heraus zuzuschlagen. Dies ist das Metier der Schattenklingen, die Kampfkraft mit Heimlichkeit und Agilität verbinden.
education.protector.descr=Die mertalischen Protectoren sind als Leibwächter und Beschützer weit über die Grenzen ihrer Heimat bekannt. Sie dienen Unterweltgrößen, reichen Händlern, Magnaten und gekrönten Häuptern gleichermaßen, sofern die Bezahlung stimmt. Sie kennen sich nicht nur in zwielichtigen Geschäften aus und sind so in der Lage, Gauner und Gefahren frühzeitig zu erkennen, sondern zeichnen sich auch durch hervorragende Menschenkenntnis aus.
education.streetblade.descr=Zu den wichtigsten Leuten der Unterstadt von Ioria gehören die Straßenklingen. Unter diesem Begriff werden all jene zusammengefasst, die durch Kampfkraft und Verschlagenheit ihre Ziele erreichen, gleich ob sie im Dienste einer der Verbrecherbanden der Stadt stehen oder ob sie ihre eigene Nachbarschaft vor eben jenen Gruppen schützen.
education.stormcorsar.descr=Weniger in den Städten als auf dem Meer kennen sich die pashtarischen Sturmkorsaren aus. Auch sie sind Meister der Heimlichkeit und Verschlagenheit, nutzen ihr Wissen aber vor allem zum Kapern feindlicher Schiffe und zum Kampf gegen Piraten. Im Vordergrund steht bei ihnen wie in ganz Farukan die persönliche Ehre, nicht die größtmögliche Beute.
education.rogue.descr=Die Reichtümer auf Lorakis sind ungleich verteilt. Aber während die Bauern nur darüber jammern, dass Burg- und Landherren auf ihre Kosten in Saus und Braus leben oder der einfache Handwerker beim Zehnt betrügt, gibt es in den Gassen und Hinterhöfen der größeren Städte Wagemutige, die es sich zur Aufgabe gemacht haben, den Reichtum aktiv umzuverteilen.
education.goldhand.descr=Die Menschenmassen der selenischen Städte, wo sich an Markttagen allen an Ständen und Garküchen drängt, enthalten stets einen guten Anteil an Dieben. Große Bekanntheit hat die Gilde der Goldhände aus Sarnburg erlangt, die angeblich stets zielsicher die reichsten Opfer findet.
education.wallstriker.descr=Berühmt sind in den Gassen von Aurigion, Gondalis oder Drevilna die Mauerstürmer, die auch von noch so hohen Wällen nicht abgehalten werden können.
education.trapmaster.descr=Ein keshabidischer Fallenmeister würde es empört von sich weisen, als Schurke bezeichnet zu werden, schließlich ist er ein angesehener Handwerker, der sich um das Einrichten, aber natürlich auch Überwinden von Diebstahlsicherungen und Schlössern aller Art kümmert.
education.transformer.descr=Eine der vielleicht klassischsten Formen der Zauberei ist der Wandel, der Übergang von einer Form in eine andere. Ein genügend großer Funke dieser Kraft erlaubt es den Kundigen, das eigene Aussehen zu verändern, anderen eine neue Gestalt aufzuzwingen oder die Beschaffenheit unbelebter Dinge zu verändern.
education.animalformer.descr=Wohl jedes Volk in Lorakis kennt Gestaltwechsler, die ganz oder in Teilen das Aussehen und die Eigenschaften anderer Wesen annehmen können. Zu ihnen gehören die Tierwandler der Dämmeralben, die sich die Geschöpfe des Dschungels zum Vorbild nehmen. Ihre Magie wirkt in erster Linie auf den eigenen Körper.
education.warlock.descr=Die Hexer Dragoreas, Gefolgsleute der dreigesichtigen Hekaria, sind dagegen Meister der Verwandlung anderer. Man konsultiert die Männer und Frauen dieses Bundes der Heilkünste und stärkenden Zauber wegen, doch sind sie aufgrund ihrer Flüche gefürchtet, deren Opfer oft ein Dasein als niedere Kreaturen oder grässlich entstellte Unholde fristen müssen.
education.aurifer.descr=Das Wissen, Blei zu Gold machen zu können, sagt man den Auriferi von Nuum nach. Diese spezielle Gabe ist zwar nur den Höchsten dieses geheimniskrämerischen Zauberbundes zu eigen, doch bringen sie es in der Verwandlung toter Materie allgemein zu großer Meisterschaft.
education.ranger.descr=Überall in Lorakis kann man auf wettergegerbte Gestalten treffen, die die Wildnis wie ihre Westentasche kennen, am Flug der Wolken das Wetter der nächsten Tage bestimmen und manche Waffe meisterhaft zu führen verstehen. Sie selbst haben selten einen eigenen Namen für sich, aber in der Bevölkerung kennt man sie als Waldläufer.
education.desertranger.descr=Die Sandläufer der Tarr kennen die Oasen und Karawanenrouten der Surmakar-Wüste sehr genau und verstehen sich gut darauf, aus den Sanddünen heraus Gegner zu überfallen. Sie sind als Karawanenwachen hochgeschätzt, da sie in der Lage sind, versteckte Feinde, Wetterumschwünge und Treibsandfelder zu entdecken.
education.tunnelguardian.descr=Die zwergischen Furgand lassen ihre Schächte und Gänge von den Tunnelwächtern bewachen. Es gibt viele unterirdische Wege, Höhlen und Pässe, die sich durch die Gebirge ziehen, und es liegt an den Tunnelwächtern, mit ihrem tiefgreifenden Wissen der entlegensten Stollen dafür zu sorgen, dass keine Feinde sich Zutritt zu den unterirdischen Zwergenstädten verschaffen.
education.beastcaller.descr=Die Bestienrufer der Dämmeralben kommen der Aufgabe nach, sich die Tiere des Waldes zunutze machen. Mithilfe der Bestien des Dschungels schalten sie Eindringlinge aus, die sich unerlaubt den Heiligtümern der Andarai nähern.
education.wandererpriest.descr=Der Glaube gebietet es diesen Priestern, die Welt zu bereisen. Sie verlassen ihre Gotteshäuser auf der Suche nach Orten besonderer Götternähe, spirituellen Erfahrungen oder sich selbst. Einige kehren nach der Wanderung zurück an den Heimattempel, andere verbringen den Großteil des Lebens unter freiem Himmel oder den ständig wechselnden Dächern von gastfreundlichen Gläubigen. Unter den Wanderpriestern gibt es Pragmatiker, die sich in erster Linie um die Bedürfnisse der einfachen Leute fernab der Zivilisation kümmern, und Mystiker, die unbeschrittene Pfade suchen, um ihrem Gott näher zu kommen.
education.stormcaller.descr=Die Sturmrufer Farukans sind Priester von Nigali. Sie begleiten Schiffe und manchmal Karawanen und beschützen sie vor Stürmen und anderen Gefahren.
education.lunarseeker.descr=Vor allem im Norden Dragoreas ist der kleine Orden der Lunaren Sucher aktiv. Seit Menschengedenken hat sich diese verborgene Gemeinschaft der Suche nach Mondsplittern verschrieben und taucht immer auf, wenn ein Mondsteinregen am Himmel zu sehen ist.
education.hammerpriest.descr=Die Hammerpriester der Furgand leben auf Berggipfeln, in tiefen Höhlen und an sturmumtosten Klippen. Überall dort, wo sich die rohe Naturgewalt frei entfaltet, fühlen sie sich den Schmiedegöttern besonders nah.
education.druid.descr=Druiden verehren mächtige Naturgeister, darunter beispielsweise die Vanyr in Zwingard. Es gibt sie in weiten Teilen Dragoreas, vor allem in Zwingard sind sie weit verbreitet. Ihre Tempel sind majestätische Wälder, einsame Seen und Findlingsgärten, wo sie Riten und Feste praktizieren.

power.addsplinter.desc=Das Schicksal ist dem Abenteurer in besonderem Maße gewogen. Er erhält 2 zusätzliche Splitterpunkte.
power.animallover.desc=Der Abenteurer hat eine besonders positive Ausstrahlung auf Tiere. Jede \
 Probe im Umgang mit Wesen des Typus Tier erhält einen Bonus in Höhe von 1 Punkt. \
 Wesen des Typus Tier zeigen ihm gegenüber zudem immer eine um eine Stufe verbesserte Einstellung.
power.animalfamiliar.desc=Der Abenteurer hat ein besonders intensives Schicksalsband zu einem Tier geknüpft, \
 dass ihn im Rahmen der Ressource Kreatur begleitet. Er spürt stets den Gesundheitszustand des Tieres, selbst wenn \
 es weit von ihm entfernt ist. Außerdem ist das Tier ihm gegenüber bedingungslos loyal. Die Stärke \
 ermöglicht darüber hinaus das Erlernen spezieller Vertrautenmagie. Sollte der Tiervertraute \
 irgendwann sterben, kann der Abenteurer eine neue Bindung zu einem anderen Tier der gleichen Art eingehen.
power.attractive.desc=Entweder die Erscheinung oder die Stimme des Abenteurers ist von makelloser Schönheit, was ihm bei \
 anderen Personen leichter Sympathien einbringt. Die Einstellung (S. 145) eines Gegenübers ist stets 1 Stufe \
 besser, als es normalerweise der Fall wäre (bis maximal hilfsbereit).
power.enduring.desc=Der Abenteurer kommt bei anstrengenden Tätigkeiten nicht so leicht aus der Puste, \
  sei es im Kampf oder auf einem langen Marsch. Bei Zähigkeit-Proben zur Abwehr des Zustands \
  Erschöpft (S. 168) erhält er einen Bonus in Höhe von 3 Punkten. Außerdem werden Abzüge durch \
  den Zustand Erschöpft halbiert. Für die Berechnung von Überanstrengung (S. 175) gilt die KON als verdoppelt.
power.tinker.desc=Der Abenteurer ist ein geborener Improvisationskünstler. Fehlt ihm das passende Werkzeug, \
  kann er die negativen Auswirkungen teilweise umgehen: Die negativen Umstände durch fehlendes \
  Werkzeug (siehe S. 94) gelten für ihn als um eine Stufe vermindert (fast unmöglich wird zu stark \
  negativ, stark negativ zu leicht negativ, leicht negativ führt zu keinen Abzügen). \
  Beim improvisierten Handwerk (siehe S. 143) erhält er außerdem einen Bonus in Höhe von 3 Punkten.
power.lowlight.desc=Die Augen des Abenteurers haben sich an dunkle Umgebungen angepasst. Die vorherrschenden Lichtverhältnisse \
  (S. 169) gelten für ihn als um 2 Stufen verbessert, sofern nicht Finsternis herrscht.
power.onestepahead.desc=Der Abenteurer versteht es besser als üblich, die ihm zur Verfügung stehenden Mittel zu seinem Vorteil \
  zu nutzen. Der maximale Bonus auf Proben und abgeleitete Werte (S. 18) ist für ihn für jede Quelle um 1 Punkt erhöht.
power.sensedistance.desc=Der Abenteurer benötigt im Fernkampf immer einen Erfolgsgrad weniger, um weiter entfernte Ziele zu treffen.
power.focusregen.desc=Der Abenteurer gewinnt magische Kraft deutlich schneller zurück. Bei der Regeneration von Verzehrtem Fokus  \
  in einer Ruhephase wird die Willenskraft verdreifachtstatt verdoppelt.
power.liferegen.desc=Die Verwundungen des Abenteurers heilen deutlich schneller. Bei der Regeneration von verlorenen Lebenspunkten \
  in einer Ruhephase wird die Konstitution verdreifacht statt verdoppelt.
power.focuspool.desc=Der Abenteurer vermag es, ein größeres Maß an magischer Kraft durch seinen Körper zu leiten. \
  Er erhält 5 zusätzliche Fokuspunkte. Diese Stärke ist beliebig oft wählbar.
power.friendearth.desc=Wesen eines bestimmten Typus sind dem Abenteurer äußerst wohlgesonnen. \
  Ihre Einstellung (S. 145) gilt ihm gegenüber stets als um 2 Stufen verbessert. Die Stärke ist mehrfach wählbar \
  und gilt dann immer für einen anderen Typus.
power.friendfire.desc=Wesen eines bestimmten Typus sind dem Abenteurer äußerst wohlgesonnen. \
  Ihre Einstellung (S. 145) gilt ihm gegenüber stets als um 2 Stufen verbessert. Die Stärke ist mehrfach wählbar \
  und gilt dann immer für einen anderen Typus.
power.friendghost.desc=Wesen eines bestimmten Typus sind dem Abenteurer äußerst wohlgesonnen. \
  Ihre Einstellung (S. 145) gilt ihm gegenüber stets als um 2 Stufen verbessert. Die Stärke ist mehrfach wählbar \
  und gilt dann immer für einen anderen Typus.
power.friendlight.desc=Wesen eines bestimmten Typus sind dem Abenteurer äußerst wohlgesonnen. \
  Ihre Einstellung (S. 145) gilt ihm gegenüber stets als um 2 Stufen verbessert. Die Stärke ist mehrfach wählbar \
  und gilt dann immer für einen anderen Typus.
power.friendnature.desc=Wesen eines bestimmten Typus sind dem Abenteurer äußerst wohlgesonnen. \
  Ihre Einstellung (S. 145) gilt ihm gegenüber stets als um 2 Stufen verbessert. Die Stärke ist mehrfach wählbar \
  und gilt dann immer für einen anderen Typus.
power.friendshadow.desc=Wesen eines bestimmten Typus sind dem Abenteurer äußerst wohlgesonnen. \
  Ihre Einstellung (S. 145) gilt ihm gegenüber stets als um 2 Stufen verbessert. Die Stärke ist mehrfach wählbar \
  und gilt dann immer für einen anderen Typus.
power.friendundead.desc=Wesen eines bestimmten Typus sind dem Abenteurer äußerst wohlgesonnen. \
  Ihre Einstellung (S. 145) gilt ihm gegenüber stets als um 2 Stufen verbessert. Die Stärke ist mehrfach wählbar \
  und gilt dann immer für einen anderen Typus
power.friendwater.desc=Wesen eines bestimmten Typus sind dem Abenteurer äußerst wohlgesonnen. \
  Ihre Einstellung (S. 145) gilt ihm gegenüber stets als um 2 Stufen verbessert. Die Stärke ist mehrfach wählbar \
  und gilt dann immer für einen anderen Typus.
power.friendair.desc=Wesen eines bestimmten Typus sind dem Abenteurer äußerst wohlgesonnen. \
  Ihre Einstellung (S. 145) gilt ihm gegenüber stets als um 2 Stufen verbessert. Die Stärke ist mehrfach wählbar \
  und gilt dann immer für einen anderen Typus.
power.sensefairy.desc=Der Abenteurer kann sich durch feeisches Erbe deutlich besser in der Welt der Feen orientieren. \
  Sämtliche Proben zur Orientierung in Feenwelten erhalten einen Bonus in Höhe von 6 Punkten. Der Abenteurer erhält \
  außerdem einen Bonus in Höhe von 2 Punkten auf seinen Geistigen Widerstand gegen Magie, die von Wesen des Typus \
  Feenwesen gewirkt wird.
power.sensesmell.desc=Die Nase des Abenteurers nimmt eine Vielzahl von Aromen und Gerüchen wahr. Er erhält einen Bonus in Höhe \
  von 2 Punkten auf Wahrnehmung-Proben, wenn der Geruchssinn betroffen ist.
power.swift.desc=Der Abenteurer verfügt über eine angeborene Schnelligkeit. Seine Geschwindigkeit steigt um 1 Punkt.
power.socialable.desc=Der Umgang mit Kulturschaffenden liegt dem Abenteurer im Blut. Hält er sich mindestens eine Woche lang in \
  einer größeren Gemeinschaft auf, erhält er temporär bis zu seiner Abreise die Ressource Kontakte 1 für diese \
  Gemeinschaft, sofern er bisher keine entsprechenden Kontakte besitzt.
power.resistpoison.desc=Der Abenteurer ist besonders resistent gegen Gifte (S. 175). Kommt er mit einem entsprechenden Stoff in \
  Kontakt, gilt sein Körperlicher Widerstand als um 2 Punkte erhöht. Auf Zähigkeit-Proben zum Widerstand gegen Gift \
  erhält er einen Bonus in Höhe von 3 Punkten.
power.sensebalance.desc=Der Abenteurer hat eine ausgezeichnete Körperbeherrschung. Jede Fertigkeitsprobe, um auf den Beinen zu \
  bleiben oder zu balancieren, erhält einen Bonus in Höhe von 3 Punkten.
power.goodmemory.desc=Der Abenteurer hat ein ausgezeichnetes Gedächtnis. Jede Probe, um sich an etwas zu erinnern oder Wissen \
  abzurufen (siehe S. 150), erhält einen Bonus in Höhe von 3 Punkten. Der Spielleiter kann den Spieler außerdem auf \
  Details hinweisen, an die sich der Abenteurer vielleicht erinnert, auch wenn der Spieler dies nicht tut.
power.resistheat.desc=Hohe Temperaturen schränken den Abenteurer kaum ein. Die Hitzestufe (S. 174) gilt für ihn als um \
  1 Stufe gesenkt. Auf Zähigkeit-Proben zum Widerstand gegen Hitze erhält er einen Bonus in Höhe von 3 Punkten.
power.resistmind.desc=Der Abenteurer verfügt über einen unbeugsamen Geist und ist nur schwerlich zu beeinflussen. \
  Sein Geistiger Widerstand ist um 2 Punkte erhöht. Diese Stärke kann einmal pro Heldengrad gewählt werden, \
  bis zu einem maximalen Bonus in Höhe von 8 Punkten.
power.resistbody.desc=Der Körper des Abenteurers widersteht selbst stärksten Belastungen. Sein Körperlicher Widerstand \
  ist um 2 Punkte erhöht. Diese Stärke kann einmal pro Heldengrad gewählt werden, bis zu einem maximalen \
  Bonus in Höhe von 8 Punkten.
power.resistcold.desc=Der Abenteurer ist an den Aufenthalt in frostigen Gebieten gewöhnt. Die Kältestufe (S. 175) gilt für ihn \
  als um 1 Stufe gesenkt. Auf Zähigkeit-Proben zum Widerstand gegen Kälte erhält er einen Bonus in Höhe von 3 Punkten.
power.concentrated.desc=Dank seinem eisernen Willen ist es sehr schwer, den Abenteurer von einer Tätigkeit abzulenken. \
  Er erhält einen Bonus in Höhe von 3 Punkten auf Entschlossenheit-Proben, wenn seine Konzentration (etwa beim Zaubern) \
  gestört wird.
power.resistsick.desc=Der Abenteurer ist besonders resistent gegen Krankheiten (S. 176). Kommt er mit einer solchen in Kontakt, \
  gilt sein Körperlicher Widerstand als um 2 Punkte erhöht. Auf Zähigkeit-Proben zum Widerstand gegen Krankheiten \
  erhält er einen Bonus in Höhe von 3 Punkten.
power.loreculture.desc=Der Abenteurer kennt sich intuitiv mit den Sitten und Bräuchen einer bestimmten Region oder eines \
  Volkes (etwa im Umfang eines Kultur-Moduls) aus. Im sozialen Umgang mit Personen, die dieselbe Kulturkunde \
  besitzen, erhält der Abenteurer einen leicht positiven Umstand (Bonus in Höhe von 2 Punkten). \
  Voraussetzung: Beherrschung der Muttersprache der Kultur.
power.packmule.desc=Für die Berechnung der Last gilt die Stärke als um 1 Punkt erhöht (ergibt 2 Punkte Last extra). \
  Diese Stärke kann bis zu dreimal gewählt werden. Die Verwendung dieser Stärke ist nur bei gleichzeitiger \
  Nutzung der Optionalregel zur Traglast (S. 181) sinnvoll.
power.literate.desc=Der Abenteurer hat gelernt zu lesen und zu schreiben. Er beherrscht automatisch die Schriften aller von \
  ihm beherrschten Sprachen. Ohne diese Stärke ist ein Abenteurer des Lesens und Schreibens nicht mächtig.
power.naturalarmor.desc=Die Haut des Abenteurers ist von einem dichten Fell bedeckt oder auf andere Weise besonders \
  widerstandsfähig, was ihm eine Schadensreduktion von 1 einbringt.
power.naturalweapon.desc=Der Abenteurer verfügt über scharfe  Krallen oder spitze Zähne, die er im Kampf einsetzen kann. \
  Im unbewaffneten Nahkampf kann er nach Wahl echten Schaden anstelle von Betäubungsschaden anrichten.
power.senseorient.desc=Der Abenteurer verfügt über ein besonderes Gespür für die Himmelsrichtung. Er erhält stets einen \
  Bonus in Höhe von 3 Punkten auf alle Proben zur Orientierung.
power.priest.desc=Der Abenteurer ist ein geweihter Priester seiner Gottheit. Er bezieht Magie nicht mehr aus der Umgebung, \
  sondern direkt und ausschließlich von seinem Gott. Dadurch hat seine Magie nie negativen Einfluss auf die Umwelt \
  gemäß der Angaben auf der Tabelle zu Fokus und Umgebung (siehe S. 197). Im Gegenzug kann sein Gott ihm bei groben \
  Verstößen gegen die Prinzipien des Kultes den Zugang zur Magie temporär verwehren ? die Entscheidung dazu liegt \
  letzten Endes beim Spielleiter. Bei Patzern würfelt er außerdem nicht auf die Patzertabelle für Magier, sondern \
  auf die für Priester (siehe S. 200). Er erhält niemals echten Schaden durch fehlgeschlagene Zauber, das Band zu \
  seinem Gott und sein Selbstvertrauen können aber erschüttert werden. Diese Stärke kostet keine Punkte, da \
  sich Vor- und Nachteile etwa aufwiegen.
power.sturdy.desc=Der Abenteurer kann deutlich mehr Schaden einstecken als andere Personen gleicher Statur. \
  Auf jeder Gesundheitsstufe erhält er 1 zusätzlichen Lebenspunkt. Diese Stärke kann bis zu dreimal gewählt werden.
power.goodhearing.desc=Die Ohren des Abenteurers nehmen selbst leiseste Geräusche wahr. Er erhält einen Bonus in Höhe von \
  2 Punkten auf Wahrnehmung-Proben, wenn das Gehör betroffen ist.
power.goodsight.desc=Die Augen des Abenteurers sind scharf wie die eines Falken. Er erhält einen Bonus in Höhe von \
  2 Punkten auf Wahrnehmung-Proben, wenn die Sicht betroffen ist.
power.resistpain.desc=Schmerzen können dem Abenteurer weniger anhaben. Wundabzüge (siehe S. 172) sind für ihn stets um \
  1 Punkt verringert.
power.sensesocial.desc=Der Abenteurer kann außergewöhnlich gut mit anderen Personen umgehen und besitzt ein Gespür für die \
  Stimmung seines Gegenübers. Wird er in einen Sozialen Konflikt verwickelt, erhält er einen Bonus in Höhe \
  von 2 Punkten auf alle damit verbundenen Proben.
power.stablemagic.desc=Die Magie des Abenteurers wirkt auf besonders stabile Art und Weise. Wenn er beim Zaubern einen \
  verheerenden Misserfolg oder einen Patzer würfelt, kann er in der Tabelle für Verheerende Zauberauswirkungen eine \
  Stufe abziehen. Sollte er dadurch unter die niedrigste Stufe fallen, entfallen die Auswirkungen aus der Tabelle.
power.highini.desc=Der Abenteurer ist besonders reaktionsschnell. Seine Intuition gilt für die Bestimmung der Initiative \
  als um 3 Punkte erhöht.
power.determined.desc=Wenn der Abenteurer sich erst einmal etwas in den Kopf gesetzt hat, ist er nicht so leicht davon \
  abzubringen. Wenn er diese Stärke erwirbt, sucht er sich ein Ziel aus. Dies kann eine konkrete Handlung sein \
  (das Reinwaschen des eigenen Namens) oder ein abstraktes Ideal (der Kampf gegen Ungerechtigkeit in der Welt). \
  Immer, wenn der Abenteurer dieses Ziel direkt verfolgt, erhält er einen Bonus in Höhe von 2 Punkten auf \
  Körperlichen Widerstand und Geistigen Widerstand, auf Entschlossenheit und Zähigkeit. Sollte das Ziel jemals \
  erreicht sein, kann sich der Abenteurer ein neues Ziel setzen. Dies ist aber höchstens einmal pro Jahr möglich.
power.tough.desc=Es ist sehr schwer, den Abenteurer ins Totenreich zu schicken. Erhält er den Zustand Sterbend, \
  verdoppelt sich die Zeit bis zum Verlust einer Gesundheitsstufe.
power.urbane.desc=Der Abenteurer hat ein Gespür für fremde Kulturen und gewöhnt sich schnell an neue Bräuche und Sitten. \
  Hält er sich mindestens eine Woche lang in einer fremden Region auf, erhält er temporär bis zu seiner \
  Abreise einen Bonus in Höhe von 2 Punkten im Umgang mit Personen der fremden Kultur.

