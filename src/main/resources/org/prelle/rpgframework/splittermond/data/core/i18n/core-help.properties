background.custom.desc=Keine Abstammung wählen, sondern Punkte später frei verteilen.
background.eremits.desc=...
background.academics.desc = Die Eltern des Abenteurers gehören zu den seltenen echten Gelehrten, die sich in den großen Reichen und Städten der Welt, wie etwa in Ioria, mit der Historie, der Völkerkunde oder anderen Disziplinen beschäftigen. Dadurch hat der Abenteurer früh zumindest rudimentäres Wissen über verschiedene Gebiete aufgeschnappt und kennt manche alten Freunde seiner Eltern, die ihm mit ihrem Wissen auf obskuren Gebieten zur Seite stehen können.\nAbkömmlinge von Gelehrten zeichnen sich oft durch starken Wissensdurst und große Neugier aus, sind dabei aber mitunter etwas weltfremd. Oft müssen sie noch lernen, dass nicht alles, was es zu wissen gibt, in Büchern und Schriftrollen steht.
background.artists.desc   = Der Abenteurer ist das Kind von Künstlern, seien sie nun Gaukler, Maler oder Musikanten. Er nahm einen Einblick in das Metier seiner Eltern und erwarb einen Blick fürs Detail und die nötige Sturheit, die er in einem von Aufträgen und Gönnern bestimmten Leben benötigt. Je nachdem, ob die Eltern gefeierte Künstler oder arme Schausteller waren, kennt das Kind eventuell einen alten Mäzen oder einen Gaukleranführer, der viel auf das Kind seiner alten Favoriten hält.\nWer von Künstlern abstammt, ist oft selbst ein Freigeist, der sich nur ungern in bestimmte Rollen drängen lässt. Er ist neugierig und will seinen Horizont erweitern.
background.courtier.desc  = Die Eltern des Abenteurers leben am Hofe eines Herrschers, gleich ob es sich dabei um den Padishah von Farukan, den Kaiser von Selenia oder um einen Herzog oder Baron handelt. Höflinge zeichnet dabei aus, dass ihr Leben voll auf das Treiben am Hof ausgerichtet ist, egal welche Stellung sie dort besitzen. Auch der Abenteurer hat entsprechend Einblick in das Leben der Edlen und Adligen erhalten, ob er nun selbst diesem Stand angehört oder nicht. Der frühe Kontakt mit Menschen aus aller Herren Länder und mit Intrigen und Ränkespielen hat ihn einiges über das menschliche Zusammenleben gelehrt.\nWer von Höflingen abstammt, hat oft einen gewissen Ehrgeiz entwickelt, da er solch ein Streben am Hofe beobachten konnte. Zu Recht oder zu Unrecht sagt man ihm mitunter auch eine gewisse Verschlagenheit nach.
background.craftsmen.desc = Der Abenteurer ist das Kind hart arbeitender Handwerker, mögen es nun Schmiede, Sattler oder Alchemisten sein. Er musste schon früh in der elterlichen Werkstatt helfen, wodurch er erste Einblicke in das Handwerk gewonnen hat. Dazu kennt er häufig befreundete Handwerksmeister oder hat Kontakt zu einflussreichen Kunden seiner Eltern, die ihn in höhere Gesellschaftsschichten einführen können. Und außerdem hat er vielleicht etwas Geld oder gar ein wertvolles Besitzstück geerbt.\nKinder von Handwerkern sind oft von sehr zupackender Art und sehr geduldig in ihrem Tun. Selten sind sie impulsiv oder handeln vorschnell, was ihnen mitunter fälschlich als geistige Langsamkeit ausgelegt wird.
background.eremits.desc   = Der Abenteurer wuchs, ob mit oder ohne Eltern, in einem der weiten Wildnisgebiete des Kontinents auf, in dem der nächste Nachbar oft dutzende Kilometer entfernt lebt. Gleich ob Jäger, Fallensteller, Freibauer oder Eremit, wer hier wohnt, ist auf sich gestellt. So musste sich auch der Abenteurer früh am täglichen Kampf ums Überleben beteiligen, was ihm so manche praktische Kenntnis, eine zupackende Art und profundes Wissen über die Natur vermittelt hat.\nWer in der Wildnis aufgewachsen ist, fühlt sich in zu reger Gesellschaft oft unwohl. Dafür gerät er selten im Angesicht von Herausforderungen in Panik, hat er doch in jungen Jahren schon viel erlebt.
background.farmer.desc    = Die Familie des Abenteurers besitzt einen eigenen kleinen Hof, bestellt auf den Ländereien eines Großbauern eine kleine Parzelle oder arbeitet schlicht als Bedienstete auf einem größeren Hof. Auch der Abenteurer musste dadurch früh bei der Feldarbeit oder der Versorgung des Viehs helfen und allerlei andere zupackende Tätigkeiten ausführen. Aus diesen Kindertagen ist ihm ebenso eine gewisse Zähigkeit verblieben wie einige Kontakte und vermutlich ein tierischer Begleiter.\nAbkömmlinge von Kleinbauern gelten als eher ungebildet, dafür sagt man ihnen die sprichwörtliche Bauernschläue nach. Sie sind oft Meister im Improvisieren und können mit begrenzten Mitteln einiges erreichen, auch durch ihre Ausdauer und Sturheit.
background.gentry.desc    = Der Abenteurer entstammt einer unbedeutenden Adelsfamilie, die zwar wenig Einfluss am Herrscherhof besitzt, dafür aber Ländereien und vielleicht ein Herrenhaus oder eine kleine Burg. Daneben gibt es verarmte Landadlige, die außer ihrem Adelsstand kaum etwas besitzen. In seiner Kindheit wurde der Abenteurer in jedem Fall auf seine Rolle als Anführer ebenso wie auf die ungezähmte Natur vorbereitet.\nKinder von Landadligen besitzen häufig viel Selbstvertrauen und ein ausgeprägtes Standesbewusstsein, da sie es gewohnt sind, in der Heimat über den anderen zu stehen. Dennoch haben sie einen stärkeren Bezug zu den Nöten und Ängsten des einfachen Volkes als Hochadlige. Da ihr Horizont oft auf die eigene Heimat beschränkt ist, wirken sie in der Fremde mitunter etwas provinziell.
background.largefarm.desc = Die Familie des Abenteurers gehört zu den bessergestellten Bewohnern der ländlichen Gebiete ihrer Heimat. Sie besitzt große Herden, lässt von ihren Bediensteten weitläufige Ländereien bewirtschaften oder verpachtet Land an Kleinbauern. Der Abenteurer hat daher ein behütetes Leben geführt und früh dabei geholfen, Pacht einzutreiben, Streit zu schlichten und auf den eigenen Ländereien nach dem Rechten zu sehen. An Geld wird es ihm auf seinem weiteren Weg sicher nicht mangeln.´\nKinder von Großbauern sind meist daran gewöhnt, in ihrem beschränkten Umfeld zu den wichtigsten Personen zu gehören, und zudem oft behütet aufgewachsen. In der weiten Welt werden sie hingegen selten so wichtig genommen, was für sie eine Umstellung bedeutet. Dennoch können sie sich oft gut durchschlagen, da ihnen weder die Natur noch das menschliche Zusammenleben fremd sind.
background.magister.desc  = Die Eltern des Abenteurers sind angesehene Amtsleute in einem der stärker organisierten Reiche auf Lorakis, etwa als Schreiber in einer Kanzlei Selenias, als Kastellan einer Zwingarder Burg oder als Beamte am Hofe des Padishahs von Farukan. Der Abenteurer hat einige Einblick in die Geschäfte seiner Eltern erhalten und einiges über das gesellschaftliche Zusammenleben gelernt. In jedem Fall kennt er manche Personen am Hofe, die ihm im Intrigenspiel oder bei Abenteuern auf höchstem Parkett zur Seite stehen könnten.\nWer von Magistralen abstammt, hat oft ein sehr rigides Rechtsverständnis, das sich in mangelnder Flexibilität äußern kann. Dafür hat er durchaus ein Organisationstalent und kann mit komplexen Sachverhalten gut umgehen.
background.merchant.desc  = Die Eltern des Abenteurers sind Händler, gleich ob es sich dabei um Kaufleute, Fernhändler oder kleine Krämer handelt. Durch die Handelspartner und Kunden seiner Eltern hat der Abenteurer schon früh einiges über die Welt gelernt, ebenso über Verhandlungen und Feilscherei. Dazu besitzt er als Händlerkind ein gewisses Ansehen und vielleicht sogar noch etwas Geld. Womöglich kennt er einige alte Handelskontakte seiner Eltern, die ihm in fremden Landen oder bei der Beschaffung von Gütern zur Seite stehen können.\nWer von Händlern abstammt, zeichnet sich nicht nur durch große Neugier, sondern oft auch durch einen starken Geschäftssinn aus. Er versucht, aus jeder Situation das Beste zu machen, kann dabei aber mitunter gierig erscheinen.
background.nobility.desc  = Der Abenteurer entstammt dem Hochadel seines Reiches und gehört damit zu einer der bedeutendsten Familien weit und breit. Mit diesem Selbstverständnis wurde er dazu erzogen, sich über andere zu erheben und das Volk zu führen. Das höfische Leben, die Sitten und die Benimmregeln der hohen Gesellschaft hat ein Abenteurer aus dem Hochadel in seiner Jugend selbstverständlich kennengelernt.\nKinder hochadliger Eltern besitzen ein ausgeprägtes Standesbewusstsein, das oft als Arroganz ausgelegt wird. Trotz ihrer zupackenden Art haben sie außerdem oft wenig Verständnis für die Bedürfnisse des Volkes oder Probleme des einfachen Lebens, waren diese ihnen doch bisher fremd.
background.priests.desc   = Der Abenteurer stammt von Priestern einer Gottheit ab, die entweder in einem Tempel wirken oder ihren Glauben auf Reisen verbreiten. Unabhängig von seiner eigenen Frömmigkeit hat der Abenteurer Einblick in die Mythen und Glaubensvorstellungen seiner Eltern erhalten und konnte etwas von deren Geschick im Umgang mit anderen abschauen. Dazu besitzt er als Sohn ehrbarer Priester in den meisten Ländern einiges Ansehen und darüber hinaus ein geweihtes Kleinod, das ihn auf seinen Wegen beschützen soll.\nKinder von Priestern sind häufig selbst sehr spirituell und fest in ihrem Glauben. Dieses Vertrauen in höhere Mächte ermöglicht ihnen eine optimistische, bisweilen auch naive Weltsicht.
background.ragtag.desc    = Die Eltern des Abenteurers, falls er sie je kennengelernt hat, gehören zu jenen Gruppen, die bessergestellte Bewohner von Lorakis oft als Abschaum betrachten: Kriminelle, Bettler, Tagelöhner, Landstreicher oder gar Arbeitssklaven. Der Abenteurer hat daher früh gelernt, in der Gesellschaft auf sich gestellt zu überleben und sich seiner Haut zu erwehren, selbst wenn er heute dieses Leben hinter sich gelassen haben mag. Dennoch entkommt er seiner Herkunft nie ganz, und sei es nur wegen der vielen, teils zwielichtigen Kontakte, die er noch immer besitzt und die ihm in weniger legalen Angelegenheiten hilfreich sein können. Und im Zweifel kennt jemand aus dem Gesindel immer einen Ort, wo er Unterschlupf finden kann.\nAbenteurer, die dem Gesindel entstammen, sind aufgrund ihrer harten Kindheit oft misstrauisch gegenüber Fremden und neigen dazu, nach einem besseren Leben oder gar Reichtum zu streben. Sie zeichnen sich oft aber andererseits durch unbeugsamen Willen und große Anpassungsfähigkeit aus.
background.sailor.desc    = Der Abenteurer hat in seiner Kindheit so viel Zeit auf dem Meer wie an Land zugebracht, da seine Eltern als Fischer, einfache Matrosen oder gar Kapitäne zur See fahren und er sie oft begleitet hat. Man sagt, er habe Salzwasser in den Adern, und er hat bereits einiges von der Welt gesehen. Auch Freunde und Geschäftspartner seiner Eltern, die in fast jedem Hafen jemanden kennen, können ihm auf Reisen nützlich und eine Anlaufstelle sein. Womöglich ist er auf einem Schiff sogar ein gern gesehener Gast.\nKindern von Seefahrern ist es nicht fremd, mit den Naturgewalten zu ringen, was sie in hektischen und brenzligen Situationen oft abgebrüht handeln lässt. Starkem Aberglauben gehen sie, wie die meisten Kinder der See, mit Inbrunst nach.
background.traveler.desc  = Der Abenteurer verbrachte seine Kindheit mit seinen Eltern auf der Straße oder gar in der Wildnis, wo diese von Ort zu Ort zogen, unabhängig davon, ob es sich bei ihnen um stolze Reiternomaden, Kesselflicker, rechtlose Vagabunden oder Fernhändler gehandelt hat. Er hat schon in jungen Jahren viel von der Welt gesehen. Die Straße oder weite Wildnis ist ihm vertraut. Er kann oft auf Kontakte seiner weitgereisten Eltern zurückgreifen, die ihm in fremder Umgebung zur Seite stehen können. Vielleicht hat er einen tierischen Begleiter, der ihm auf seinen Fahrten Gesellschaft leistet.\nAbkömmlinge von Reisenden besitzen selbst einen großen Horizont und sind oft tolerant Neuem und Unbekanntem gegenüber. Andererseits sind sie leicht misstrauisch, da Reisende stets als Fremde gelten und nicht immer gut behandelt werden.
background.warrior.desc   = Eltern des Abenteurers verdienen ihren Lebensunterhalt als Kämpfer, beispielsweise als Soldaten, Söldner, im Waffengefolge eines Adligen oder als Fechtlehrer. Auch der Abenteurer hatte dadurch früh Kontakt mit dem Kriegshandwerk, auch wenn er nur zuschaute oder es kindlich nachspielte. Dennoch hat er dadurch eine gewisse Begabung für den Kampf und Zähigkeit erlangt, was ihm von Nutzen sein kann.\nKinder von Kämpfern gelten als impulsiv, dabei können sie auch sehr planvoll und berechnend vorgehen. Dazu sind sie es gewohnt, ihr Leben in vollen Zügen zu genießen, da sie in ihrer Jugend gelernt haben, wie schnell es vorbei sein kann.
background.wizard.desc    = Die Eltern des Abenteurers besitzen nicht nur die einfache magische Begabung, die jedem in Lorakis zu eigen ist, sondern sind professionelle Zauberer, die damit ihren Lebensunterhalt bestreiten. Unabhängig davon, ob der Abenteurer die Magie so gut beherrscht wie seine Eltern, hat er tiefergehenden Einblick in die Zauberkunst erhalten und besitzt eine profunde Bildung. In jedem Fall besitzt er ein Artefakt, das vielleicht schon lange in Familienbesitz ist oder von seinen Eltern speziell für ihn gefertigt wurde.\nWer von Zauberern abstammt, denkt oft, alle Probleme im Leben mit Magie lösen zu können. Dazu kommt eine starke Aufgeschlossenheit gegenüber dem Übernatürlichen, das er besser als andere zu verstehen glaubt.

creaturefeaturetype.IMMUNE_TORPIDITY.desc=Das Wesen kann nicht betäubt oder auf andere Weise bewusstlos gemacht werden. Es ist immun gegen Betäubungsschaden und die Zustände Bewusstlos und Schlafend.
creaturefeaturetype.LOWLIGHT.desc=Die Augen des Wesens haben sich an dunkle Umgebungen angepasst. Die vorherrschenden Lichtverhältnisse gelten für es als um 2 Stufen verbessert, sofern nicht Finsternis herrscht.
creaturefeaturetype.nightvision.desc=Das Wesen kann seine Umgebung auch bei völliger Dunkelheit noch wahrnehmen \u2013 sei es durch besonders gute Augen, magische Sinne oder ein perfektes Gehör. Es erleidet niemals Abzüge durch mangelnde Lichtverhältnisse.
creaturefeaturetype.RESIST_EXHAUSTION.desc=Das Wesen ist äußerst zäh und lässt sich von Erschöpfung kaum übermannen. Der Zustand Erschöpft gilt als um so viele Stufen gesenkt, wie die Stufe des Merkmals beträgt.
creaturefeaturetype.FAIRYORIGIN.desc=Die Feenwelt stellt für das Wesen eine gewohnte Umgebung dar. Es erleidet während eines Aufenthalts dort niemals Abzüge durch die Umgebung.
creaturefeaturetype.COWARD.desc=Das Wesen ist leicht zu vertreiben. Jedes mal, wenn es eine Gesundheitsstufe verliert, muss es eine Entschlossenheit-Probe ablegen (Schwierigkeit 15 bei der ersten Stufe, 20 bei der zweiten, 25 bei der dritten und jeder weiteren). Bei Misslingen flieht das Wesen, sofern ihm dies möglich ist.
creaturefeaturetype.FLYING.desc=Das Wesen vermag sich in die Lüfte zu erheben. Die dabei erreichte Geschwindigkeit steht im Werteblock hinter der am Boden erreichten Geschwindigkeit.
creaturefeaturetype.SCARY.desc=Die Begegnung mit dem Wesen reicht aus, um selbst gestandene Recken zu erschüttern. Bei einer Begegnung muss eine Entschlossenheit-Probe gegen den in Klammern angegebenen Wert abgelegt werden. Bei Misslingen erhält der Abenteurer den Zustand Angsterfüllt. Der Zustand wird aufgehoben, wenn das Wesen bezwungen wurde oder die Flucht vor ihm gelungen ist.
creaturefeaturetype.GHOST.desc=Das Wesen stammt aus der Geisterwelt, gleich ob es sich um den Geist eines Verstorbenen handelt oder ein andersartiges Wesen. Es erhält niemals Abzüge innerhalb der Geisterwelt. Darüber hinaus sind Geister immun gegen Ersticken, Krankheiten, Überanstrengung, Verhungern und den Zustand Sterbend.
creaturefeaturetype.POISON.desc=Das Wesen verursacht Giftschaden gemäß der auf GRW S. 175 genannten Regeln. Von dem Gift einer Art von Kreatur kann jeder Abenteurer nur einmal gleichzeitig betroffen werden. Mehrere Treffer addieren sich also in Bezug auf die Giftwirkung nicht auf und verlängern auch die Wirkungsdauer nicht. Sehr wohl ist es aber möglich, etwa beim zweiten Treffer einer Kreatur vom Gift betroffen zu werden, wenn es beim ersten Treffer noch am Körperlichen Widerstand gescheitert ist oder in der Zwischenzeit geheilt wurde.\nVon den jeweiligen Giften verliehene Zustände besitzen natürlich in Bezug auf ihre Heilung die Ursache (Gift) (siehe GRW S. 168).
creaturefeaturetype.IMMUNE_POISON.desc=Das Wesen ist immun gegen die Auswirkungen von Giften.
creaturefeaturetype.RESIST_HEAT.desc=Hohe Temperaturen schränken das Wesen kaum ein. Die Hitzestufe gilt als um so viele Stufen gesenkt, wie die Stufe des Merkmals beträgt.
creaturefeaturetype.RESIST_COLD.desc=Das Wesen ist den Aufenthalt in frostigen Gebieten gewohnt. Die Kältestufe gilt als um so viele Stufen gesenkt, wie die Stufe des Merkmals beträgt.
creaturefeaturetype.colossal.desc=Die Kreatur verfügt über mehrere voneinander unabhängige Angriffsarten und wird nach den Regeln für Kolosse (S. 171) behandelt. Die Stufe des Merkmals zeigt an, wie viele Marker der Koloss auf der Tickleiste erhält. Die Angabe in Klammern gibt die genaue Art der Angriffe an. Koloss 3 (Biss, 2 Klauen) bedeutet also, dass der Koloss einen Marker für seinen Biss und zwei Marker für die Klauen erhält.
creaturefeaturetype.concentrated.desc=Das Wesen besitzt eine besonders große Konzentrationsstärke. Es erhält einen Bonus in Höhe von 3 Punkten auf Entschlossenheit-Proben, wenn seine Konzentration (etwa beim Vorbereiten von Zaubern oder für den Erhalt kanalisierter Zauber) gestört wird.
creaturefeaturetype.DISEMBODIED.desc=Das Wesen verfügt über keinen festen Körper und kann sich daher auch durch enge Schlitze und kleine Spalten zwängen. Etwaige damit verbundene Widerstandsfähigkeit gegen körperliche Angriffe ist bereits in die Werte der Kreatur eingerechnet. Körperlose Wesen sind immun gegen Fallschaden und den Zustand Blutend. Sie lösen niemals Gelegenheitsangriffe aus.
creaturefeaturetype.CREATURE.desc=Dieses Merkmal zeigt ein Wesen an, das über die Ressource Kreatur als tierischer Begleiter gewählt werden kann. Der Wert gibt dabei den nötigen Wert in der Ressource an.
creaturefeaturetype.resist_damage.desc=Bestimmte äußere Einflüsse können dem Wesen kaum etwas anhaben. Wird es von einer entsprechenden Schadensart (etwa Feuerschaden oder Lichtschaden) betroffen, gilt dieser als um so viele Punkte gesenkt, wie die Stufe des Merkmals beträgt.
creaturefeaturetype.IMMUNE_PAIN.desc=Das Wesen spürt keinen Schmerz. Es erleidet keinerlei Wundabzüge.
creaturefeaturetype.RESIST_PAIN.desc=Schmerzen können dem Wesen wenig anhaben. Wundabzüge (siehe GRW S. 172) sind für ihn stets um 1 Punkt verringert.
creaturefeaturetype.WEAK.desc=Das Wesen ist leichter zu töten. Es besitzt nur 3 statt 5 Gesundheitsstufen. Auf diesen Stufen werden die Regeln für die Stufen Unverletzt, Verletzt und Todgeweiht angewendet.
creaturefeaturetype.TACTICIAN.desc=Das Wesen ist in der Lage, Risiko- und Sicherheitswürfe einzusetzen.
creaturefeaturetype.WATERCREATURE.desc=Das Wesen kann unter Wasser atmen, stirbt aber, wenn es länger als 30 Minuten außerhalb dieses Elements verbringt. Es erhält keinerlei Abzüge für Handlungen, die unter Wasser ausgeführt werden.
creaturefeaturetype.UNDEAD.desc=Gestorben und wieder in die Welt zurückgerufen fristet das Wesen ein Dasein als Untoter. Untote sind immun gegen Ersticken, Krankheiten, Überanstrengung und Verhungern und gegen die Zustände Blutend, Panisch und Sterbend.
creaturefeaturetype.vulnurable_damage.desc=Das Wesen ist einem bestimmten äußeren Einfluss gegenüber besonders empfindlich. Erhält es Schadenspunkte dieser bestimmten Art (etwa durch Feuerschaden oder Lichtschaden), werden sie verdoppelt. Diese Verdopplung geschieht vor Abzug der Schadensreduktion.
creaturefeaturetype.FRAGILE.desc=Das Wesen ist sehr leicht zu töten. Es besitzt nur eine einzige Gesundheitsstufe. Auf dieser Gesundheitsstufe gelten die Regeln für die Stufe Unverletzt.

culture.custom.desc=Keine Kultur wählen, sondern Punkte später frei verteilen.
education.custom.descr=Keine Ausbildung wählen, sondern Punkte später frei verteilen.

enhancement.specialization.desc=Der Gegenstand verleiht einen Bonus in Höhe von 1 Punkt auf einen Schwerpunkt einer zum Gegenstand passenden Fertigkeit, zum Beispiel einer Kampffertigkeit (Schwerpunkt bestimmte Waffe) bei Waffen, Darbietung (Tanzen) bei einem Tanzkleid oder ähnliches.
enhancement.load.desc=Die Last des Gegenstandes wird um 1 reduziert. Diese Reduzierung darf dem Träger nicht zum Nachteil gereichen; so wird beispielsweise beim Manöver Entwaffnen stets die unmodifizierte Last einer Waffe herangezogen.
enhancement.damage.desc=Der Schaden der Waffe erhöht sich um 1 Punkt.
enhancement.speed.desc=Die Waffengeschwindigkeit der Waffe sinkt um 1.
enhancement.damagereduction.desc=Die Schadensreduktion einer Rüstung erhöht sich um 1.
enhancement.handicap.desc=Die Behinderung der Rüstung / des Schildes sinkt um 1.
enhancement.tickmalus.desc=Der Tick-Zuschlag der Rüstung / des Schildes sinkt um 1.
enhancement.rigidity.desc=Die Härte des Gegenstandes erhöht sich um 1.
enhancement.heal.desc=sofortige Heilung von 4 Punkten Schaden, maximal 12 Punkte
enhancement.antidot.desc=Heilung eines Giftes, pro Giftgrad
enhancement.easecure.desc=Schwierigkeit der Behandlung einer Krankheit sinkt um 10, pro Krankheitsgrad
enhancement.raiseattrib.desc=Attributsbonus (+1 auf alle Proben mit dem Attribut, 1 Stunde, maximal 2 Punkte)
enhancement.undo_unconscious.desc=Heilung des Zustandes Bewusstlos
enhancement.undo_exhausted.desc=Heilung einer Stufe des Zustandes Erschöpft
enhancement.undo_infirmity.desc=Heilung von Siechtum 1
enhancement.bodyresist.desc=+1 auf körperlichen Widerstand, maximal +3
enhancement.mindresist.desc=+1 auf geistigen Widerstand, maximal +3
enhancement.embedspell0.desc=Zauberverankerung des Zaubergrades 0
enhancement.embedspell1.desc=Zauberverankerung des Zaubergrades 1
enhancement.embedspell2.desc=Zauberverankerung des Zaubergrades 2
enhancement.embedspell3.desc=Zauberverankerung des Zaubergrades 3
enhancement.embedspell4.desc=Zauberverankerung des Zaubergrades 4
enhancement.embedspell5.desc=Zauberverankerung des Zaubergrades 5


mastership.grandmaster.desc=Der Abenteurer ist ein vollendeter Großmeister. Bei jeder Probe in dieser Fertigkeit darf er einen zusätzlichen W10 werfen. Dieser Würfel wird nicht für die Ermittlung eines Patzers gewertet und kann nur genutzt werden, wenn kein Patzer vorliegt. Entsprechend muss der Würfel klar von den anderen Würfeln unterscheidbar sein (indem er etwa separat geworfen wird oder andersfarbig ist). Ein Großmeister hat bei einem Standardwurf also 3 Würfel, von denen die höchsten 2 gewertet werden, bei einem Risikowurf 5 Würfel, von denen die höchsten 2 gewertet werden, und bei einem Sicherheitswurf 3 Würfel, von denen der höchste gewertet wird. Ein Patzer tritt bei Standard- und Risikowurf nur auf, wenn die 2 oder 4 normalen Würfel ihn anzeigen. Bei einem Sicherheitswurf ist wie üblich kein Patzer möglich.
mastership.push.desc=(Manöver) Der Kämpfer versucht, seinen Gegner mit ausholenden Schlägen wegzudrängen. Dazu würfelt er einen Nahkampfangriff gegen den Körperlichen Widerstand des Gegners. Trifft er seinen Gegner, erleidet dieser nur den halben Schaden, muss aber einen Meter zurückweichen. Der Angreifer kann weitere Erfolgsgrade nutzen, um seinen Gegner jeweils einen weiteren halben Meter zurückzudrängen. Falls der Gegner zurückgedrängt wird, kann der Angreifer ohne Tickaufwand bis zu 2 Meter nachrücken. Sollte nicht ausreichend Platz zum Zurückweichen vorhanden sein, etwa weil der Gegner an eine Wand gedrängt wird oder einen Abhang hinunterstürzen würde, geht er stattdessen vor dem Hindernis zu Boden und gilt als liegend. Dieses Manöver funktioniert nur gegen Gegner bis maximal Größenklasse 7.
mastership.improvise.desc=Der Abenteurer hat gelernt, alltägliche Gegenstände als Waffen einzusetzen. Waffen mit dem Merkmal Improvisiert richten bei Einsatz der entsprechenden Kampffertigkeit zwei zusätzliche Punkte Schaden an. Zusätzlich ist ihre Waffengeschwindigkeit um 2 Punkte verbessert.
mastership.biweapon.desc= Der Abenteurer hat gelernt, in beiden Händen eine Waffe zu führen. Die Abzüge für den Kampf mit der falschen Hand (S. 171) entfallen vollständig, wenn er eine Waffe der entsprechenden Kampffertigkeit führt.
mastership.withdraw.desc=Der Abenteurer hat gelernt, sich aus dem Kampf zu lösen (S. 159), indem er sich den Weg frei kämpft. Er kann zu diesem Zweck statt der üblichen Akrobatik-Probe eine Probe auf seine entsprechende Waffenfertigkeit ablegen, sofern er gerade eine zugehörige Waffe führt.
mastership.clutch.desc=(Manöver) Ist dieser Nahkampfangriff gegen den Körperlichen Widerstand des Gegners (bis max. GK 7) erfolgreich, erleidet der Getroffene nur halben Schaden und beide Beteiligte gelten als Ringend. Dieses Manöver ist nur im unbewaffneten Nahkampf oder mit Waffen mit dem Merkmal Umklammern auszuführen. Wie eine Umklammerung gelöst werden kann, wird auf S. 164 beschrieben.
mastership.knock.desc=(Manöver) Dieses Manöver richtet sich gegen den Körperlichen Widerstand des Gegners (bis max. GK 7). Ist der Nahkampfangriff erfolgreich, erleidet das Opfer nur halben Schaden, muss aber eine Probe auf Akrobatik oder Athletik gegen 15 + die Fertigkeitspunkte des Angreifers in der verwendeten Nahkampffertigkeit ablegen. Gelingt ihm diese Probe, erhält es für 20 Ticks den Zustand Benommen 1, misslingt sie oder verzichtet das Opfer darauf, geht es zu Boden und zählt als liegend. Der Angreifer kann weitere Erfolgsgrade nutzen, um dem Opfer einen Malus in Höhe von jeweils 5 Punkten auf die Probe zu erteilen.
mastership.defender.desc=Der Abenteurer ist in der Lage, Aktive Abwehr (siehe S. 138) zur Erhöhung der Verteidigung für jemand anderen einzusetzen (hierfür darf nur die entsprechende Nahkampffertigkeit genutzt werden, nicht Akrobatik). Diese Person darf nicht weiter als 2 m von ihm entfernt sein. Die Probe zur Aktiven Abwehr erleidet einen Malus in Höhe von 3 Punkten. Sollte der Angegriffene auch eine eigene Aktive Abwehr einsetzen, zählt das bessere Ergebnis.
mastership.rush.desc=(Manöver) Wenn der Abenteurer vor einem Nahkampfangriff mit diesem Manöver mindestens 2 m Anlauf in gerader Linie hatte (egal auf welche Weise), kann er seine halbe Geschwindigkeit zum Waffenschaden addieren. Der maximale Schadensbonus beträgt 8 Punkte.
mastership.bihandedparry.desc=Wenn der Abenteurer in dieser Kampffertigkeit mit zwei Waffen, einer Doppelwaffe oder einer Waffe und einer Parierwaffe kämpft, benötigt er für eine Aktive Abwehr mit seiner jeweils zugehörigen Kampffertigkeit nur noch 2 Ticks.
mastership.bihandedattack.desc=Der Abenteurer ist in der Lage, effektiver mit zwei Waffen zu kämpfen. Wenn er mit dieser Kampffertigkeit abwechselnd mit beiden Waffen angreift (der erste Angriff muss immer mit der Hauptwaffe erfolgen, was bei ungleichen Waffen stets die langsamere ist), kann er bei erfolgreichem Nahkampfangriff seiner Nebenwaffe nachträglich einen Erfolgsgrad nutzen, um seine Waffengeschwindigkeit für diesen Nahkampfangriff zu halbieren. Zweihändige, Vielseitige und Lange Waffen (mit Ausnahme von Doppelwaffen) dürfen nicht auf diese Art genutzt werden.
mastership.disarm.desc=(Manöver) Dieses Manöver benötigt fünf Ticks zuzüglich der halben Waffengeschwindigkeit. Trifft dieses Manöver, erleidet der Gegner zwar keinen Schaden, kann aber entwaffnet werden: Er darf eine Probe auf Athletik oder Fingerfertigkeit gegen 20 + die Fertigkeitspunkte des Angreifers in der verwendeten Nahkampffertigkeit ablegen. Gelingt ihm diese Probe, gewährt er seinen Gegnern für 15 Ticks einen Taktischen Vorteil, behält aber seine Waffe. Misslingt sie oder verzichtet der Getroffene darauf, fällt seine Waffe zu Boden. Mit diesem Manöver ist es nur möglich, eine Waffe bis zur Last der eigenen Waffe zu entwaffnen. Unbewaffnet kann maximal eine Waffe bis Last 1 entwaffnet werden.
mastership.sweepingblow.desc=(Manöver) Dieses Manöver richtet sich nicht nur gegen einen Gegner, sondern auch gegen bei ihm stehende Feinde in Nahkampfentfernung zum Abenteurer. Ist der Nahkampfangriff erfolgreich, richtet er sich nicht nur gegen das ursprüngliche Ziel, sondern auch gegen bis zu zwei weitere nebenstehende Gegner, sofern diese maximal dieselbe Verteidigung wie das Hauptziel besitzen. Jeder der Getroffenen und das ursprüngliche Ziel erleiden den halben normalen Schaden des Nahkampfangriffs. Der Angreifer kann einen weiteren Erfolgsgrad nutzen, um zwei zusätzliche, sich in Nahkampfentfernung befindliche Feinde, deren Verteidigung maximal so hoch ist wie die des Hauptziels, zu treffen. Ob ein Ziel in Nahkampfentfernung ist, kann im Zweifel darüber bestimmt werden, ob der Abenteurer ohne Bewegung in der Lage wäre, das entsprechende Ziel im Nahkampf anzugreifen. Ein Rundumschlag ist nur mit zweihändigen oder vielseitigen Waffen in zweihändiger Führung möglich.
mastership.dancingblade.desc=Die Waffengeschwindigkeit aller Waffen und natürlichen Angriffsarten der Nahkampffertigkeit, in der diese Meisterschaft erlernt wurde, zählt für den Abenteurer als um einen Tick gesenkt (Minimum von 3 Ticks).
mastership.bihandedmastery.desc=Wenn ein Kämpfer, wie unter Beidhändiger Angriff beschrieben ist, abwechselnd mit beiden Waffen angreift, kann er beim Nahkampfangriff seiner Nebenwaffe immer die Waffengeschwindigkeit halbieren, egal ob der Nahkampfangriff gelingt oder nicht. Zweihändige, Vielseitige und Lange Waffen (mit Ausnahme von Doppelwaffen) dürfen nicht für den Kampf mit zwei Waffen genutzt werden.
mastership.melee.block.desc=Der Abenteurer kann die Fertigkeit Handgemenge nutzen, um eine Aktive Abwehr (siehe S. 138) gegen einen bewaffneten Gegner durchzuführen.
mastership.melee.hold.desc=Packt ein Kämpfer mit dieser Meisterschaft seinen Gegner im Handgemenge mit dem Manöver Umklammern, wird zusätzlich zum Zustand Ringend dessen Verteidigung um 2 weitere Punkte gesenkt. Auch erhalten die Aktionen des Gegners einen zusätzlichen Malus in Höhe von 2 Punkten.
mastership.melee.confusion.desc=(Manöver) Dieser Nahkampfangriff geht gegen den Geistigen Widerstand und richtet bei Erfolg nur halben Schaden an. Dafür erhält der nächste Angriff gegen denselben Gegner (egal von wem) einen Bonus in Höhe von 2 Punkten. Der Angreifer kann weitere Erfolgsgrade einsetzen, um den Bonus um 1 je Erfolgsgrad zu erhöhen. Ein Kämpfer kann gleichzeitig nur Ziel einer Verwirrung sein.
mastership.melee.painful.desc=(Manöver) Dieser Nahkampfangriff verursacht zusätzlich zum normalen Schaden beim Gegner für 60 Ticks den Zustand Lahm.
mastership.melee.lethal.desc=Die waffenlosen Nahkampfangriffe des Abenteurers verursachen auf Wunsch echten Schaden statt Betäubungsschaden.
mastership.melee.betterknock.desc=Der Kämpfer hat gelernt, wie er seinen Gegner noch stärker verletzen kann, während er ihn von den Beinen holt. Ein über Handgemenge ausgeführter Nahkampfangriff mit dem Manöver Umreißen verursacht den vollen Schaden statt wie üblich den halben Schaden.
mastership.melee.betterdisarm.desc=Gelingt ihm über Handgemenge das Manöver Entwaffnen, hat der Besitzer dieser Meisterschaft nicht nur seinen Gegner entwaffnet, sondern ihm die Waffe abgenommen und kann sie selbst führen. Diese Meisterschaft lässt sich nur einsetzen, wenn der Angreifer selbst unbewaffnet ist und die Waffe des Gegners höchstens eine Last von 3 hat.\nZudem kann der Angreifer ein reguläres Manöver Entwaffnen unbewaffnet gegen Waffen bis Last 3 einsetzen.
mastership.melee.strangehold.desc=Manöver) Dieses Manöver kann nur eingesetzt werden, wenn der Angreifer sein Opfer vorher mit dem Manöver Umklammerung angegriffen hat und beide ringend sind. Der Nahkampfangriff verursacht Bonusschaden in Höhe der Stärke des Angreifers.
mastership.melee.push.desc=(Manöver) Der Kämpfer versucht, seinen Gegner mit ausholenden Schlägen wegzudrängen. Dazu würfelt er einen Nahkampfangriff gegen den Körperlichen Widerstand des Gegners. Trifft er seinen Gegner, erleidet dieser nur den halben Schaden, muss aber einen Meter zurückweichen. Der Angreifer kann weitere Erfolgsgrade nutzen, um seinen Gegner jeweils einen weiteren halben Meter zurückzudrängen. Falls der Gegner zurückgedrängt wird, kann der Angreifer ohne Tickaufwand bis zu 2 Meter nachrücken. Sollte nicht ausreichend Platz zum Zurückweichen vorhanden sein, etwa weil der Gegner an eine Wand gedrängt wird oder einen Abhang hinunterstürzen würde, geht er stattdessen vor dem Hindernis zu Boden und gilt als liegend. Dieses Manöver funktioniert nur gegen Gegner bis maximal Größenklasse 7.
mastership.slashing.berserk.desc=Bevor der Abenteurer einen Risikowurf für einen Nahkampfangriff mit einer Hiebwaffe benutzt, kann er sich entscheiden, bis zu seiner nächsten Aktion einen Malus in Höhe von 4 Punkten auf die Verteidigung hinzunehmen, um einen Bonus in Höhe seiner halben Stärke zum Schaden zu addieren.
mastership.slashing.shieldbreaker.desc=(Manöver) Dieser Angriff zielt auf den Schild des Gegners. Ein erfolgreicher Schildbrecher fügt keinen Schaden zu, beschädigt aber einen Schild dessen Härte höchstens 3 beträgt, sodass dieser als angeschlagen gilt. Um einen härteren Schild zu beschädigen, wird ein weiterer Erfolgsgrad pro Punkt Härte benötigt. Wird die doppelte Anzahl an Erfolgsgraden erreicht oder ein angeschlagener Schild ein weiteres Mal mit einem erfolgreichen Schildbrecher mit den benötigten Erfolgsgraden getroffen, ist er demoliert und kann nicht mehr verwendet werden.
mastership.slashing.deathblow.desc=Der Abenteurer verursacht gegen am Boden liegende und/oder mit dem Zustand Benommen belegte Gegner mit jedem Nahkampfangriff mit einer Hiebwaffe 1 Punkt zusätzlichen Schaden.
mastership.slashing.hammerblow.desc=(Manöver) Bei einem erfolgreichen Nahkampfangriff mit diesem Manöver verursacht der Abenteurer 1W6 Schaden zusätzlich.
mastership.slashing.hardsweepingblow.desc=Wenn ein Kenner dieser Meisterschaft mit dem Manöver Rundumschlag mit einer Hiebwaffe trifft, erleidet jedes Ziel 2 Punkte Schaden mehr.
mastership.slashing.dashingblow.desc=(Manöver) Dieser Nahkampfangriff verursacht zusätzlich zum normalen Schaden beim Gegner für 30 Ticks den Zustand Benommen 1.
mastership.slashing.bonebreaker.desc=(Manöver) Dieser Nahkampfangriff verursacht zusätzlich zum normalen Schaden beim Gegner den Zustand Verwundet 1.
mastership.slashing.hardhammerblow.desc=Nach einem erfolgreichen mit einer Hiebwaffe ausgeführten Manöver Hammerschlag kann der Kämpfer in einer weiteren Kraftanstrengung seinen Schaden erhöhen. Für jeweils einen Tick und einen weiteren Erfolgsgrad, die er nachträglich aufwendet, kann er den Schaden um weitere 1W6 Schaden erhöhen. Dies ist maximal zweimal pro Angriff möglich.
mastership.chains.berserk.desc=Bevor der Abenteurer einen Risikowurf für einen Nahkampfangriff mit einer Kettenwaffe benutzt, kann er sich entscheiden, bis zu seiner nächsten Aktion einen Malus in Höhe von 4 Punkten auf die Verteidigung hinzunehmen, um einen Bonus in Höhe seiner halben Stärke zum Schaden zu addieren.
mastership.chains.ignoreshield.desc=Der Abenteurer kann bei Angriffen mit einer Kettenwaffe den aus Schilden stammenden gegnerischen Bonus auf Verteidigung ignorieren. Sollte ein Schildträger eine Aktive Abwehr gegen seine Nahkampfangriffe nutzen, erhält er keinen Bonus durch seinen Schild.
mastership.chains.whirlingdefense.desc=(Manöver): Zusätzlich zu seinem regulären Nahkampfangriff bringt der Kämpfer sich mit diesem Manöver in eine vorteilhafte Defensivposition. Für den nächsten Angriff gegen seine Verteidigung in diesem Kampf ist diese um 2 Punkte erhöht. Zudem kann er weitere Erfolgsgrade nutzen, um seine Verteidigung je eingesetztem Erfolgsgrad um einen weiteren Punkt zu erhöhen.
mastership.chains.longwhirlingdefense.desc=Die erhöhte Verteidigung aus dem Manöver Verteidigungswirbel hält nicht nur für einen Angriff, sondern bis zur nächsten eigenen Aktion.
mastership.chains.hammerblow.desc=(Manöver) Bei einem erfolgreichen Nahkampfangriff mit diesem Manöver verursacht der Abenteurer 1W6 Schaden zusätzlich.
mastership.chains.relentless.desc=Angriffe des Abenteurers richten beim Gegner zuverlässig hohen Schaden an. Seine Nahkampfangriffe mit Kettenwaffen erhalten das Merkmal Scharf 2 bei allen Waffen mit mehreren Schadenswürfeln und Scharf 3 bei Waffen mit nur einem Schadenswürfel. Hat die Waffe bereits das Merkmal Scharf, erhöht es sich um 1 bzw. 2 Punkte.
mastership.chains.sweepingslash.desc=Wird das mit einer Kettenwaffe ausgeführte Manöver Hammerschlag des Abenteurers mit einer Aktiven Abwehr pariert, hätte aber ohne diese getroffen, so richtet er dennoch ein Drittel des Waffenschadens an.
mastership.chains.chainshackles.desc=Der Abenteurer zählt nicht selbst als Ringend, wenn er einen Gegner mit dem Manöver Umklammern mit einer Kettenwaffe gepackt hat. Sein Gegner kann zudem keine anderen Aktionen mehr ausführen, außer sich aus der Umklammerung zu befreien. Der Abenteurer selbst kann, solange das Umklammern anhält, keine weiteren Gegner mit der hierfür genutzten Waffe angreifen.
mastership.blades.sortie.desc=(Manöver) Der Gegner erleidet bei diesem Manöver den üblichen Schaden und verliert zusätzlich 3 Ticks. Sollte das Manöver gelingen, kann der Gegner nicht mehr von einem anderen Ausfall betroffen werden, bevor er das nächste Mal gehandelt hat.
mastership.blades.whirlingdefense.desc=(Manöver) Zusätzlich zu seinem regulären Nahkampfangriff bringt der Kämpfer sich mit diesem Manöver in eine vorteilhafte defensive Position. Für den nächsten Angriff gegen seine Verteidigung in diesem Kampf ist diese um 2 Punkte erhöht. Zudem kann er weitere Erfolgsgrade nutzen, um seine Verteidigung pro eingesetztem Erfolgsgrad um einen weiteren Punkt zu erhöhen.
mastership.blades.confusion.desc=Dieser Nahkampfangriff geht gegen den Geistigen Widerstand und richtet bei Erfolg nur halben Schaden an. Dafür erhält der nächste Angriff gegen denselben Gegner (egal von wem) einen Bonus in Höhe von 2 Punkten. Der Angreifer kann weitere Erfolgsgrade einsetzen, um diesen Bonus um 1 je Erfolgsgrad zu erhöhen. Ein Kämpfer kann nur Ziel einer Verwirrung zur gleichen Zeit sein.
mastership.blades.targetedhit.desc=Die präzisen Nahkampfangriffe des Abenteurers erlauben es ihm, bis zu 2 Punkte Schadensreduktion bei seinen Gegnern zu ignorieren, sofern er mit einer Klingenwaffe kämpft. Dies zählt zusätzlich zu allen anderen Möglichkeiten des Kämpfers, die Schadensreduktion seines Gegners zu umgehen.
mastership.blades.whirlingblades.desc=(Manöver) Gelingt das Manöver Klingenwirbel, rückt der Angreifer nach Abhandlung des Nahkampfangriffs noch einmal seine halbe Waffengeschwindigkeit in Ticks vor. Dafür kann er einen zweiten sofortigen Nahkampfangriff mit derselben Waffe und einem Malus in Höhe von 3 Punkten ausführen. Hierfür muss er nicht die sonst übliche Waffengeschwindigkeit aufwenden. Dieser Angriff kann gegen ein zweites in Nahkampfdistanz befindliches Ziel gerichtet sein, darf aber keine Meisterschafts-Manöver verwenden.
mastership.blades.riposte.desc=Diese Meisterschaft kann nur bei einer Aktiven Abwehr durch Klingenwaffen zur Erhöhung der Verteidigung gegen einen gegnerischen Nahkampfangriff eingesetzt werden. Dies muss vorher angesagt werden, die Aktive Abwehr erhält einen Malus in Höhe von 3 Punkten. Wird der gegnerische Nahkampfangriff vollständig abgewehrt, erhält der Kämpfer einen Bonus in Höhe von 1 Punkt bei seinem nächsten Nahkampfangriff mit Klingenwaffen, solange dieser gegen den Angreifer gerichtet ist. Dieser Bonus erhöht sich um jeweils 1 Punkt für jeden negativen Erfolgsgrad des Angreifers.
mastership.blades.bloodletting.desc=(Manöver) Dieser Nahkampfangriff verursacht zusätzlich zum normalen Schaden beim Gegner den Zustand Blutend 1.
mastership.blades.elegantwhirlingblades.desc=Der zweite Angriff des Manövers Klingenwirbels ist bei Verwendung einer Klingenwaffe für Kenner dieser Meisterschaft nicht mehr erschwert. Zudem kann man beim zweiten Angriff eines Klingenwirbels auch Meisterschafts-Manöver einsetzen (nicht aber einen weiteren Klingenwirbel).
mastership.staffs.sortie.desc=(Manöver) Der Gegner erleidet bei diesem Manöver den üblichen Schaden und verliert zusätzlich 3 Ticks. Sollte das Manöver gelingen, kann der Gegner nicht mehr von einem anderen Ausfall betroffen werden, bevor er das nächste Mal gehandelt hat.
mastership.staffs.opportunist.desc=Der Abenteurer kann Gelegenheitsangriffe mit Stangenwaffen 3 Ticks schneller ausführen.
mastership.staffs.assault.desc=Ein durch den Abenteurer bei Einsatz einer Stangenwaffe mit dem Manöver Vorstürmen getroffenes Ziel verliert zusätzlich zu den normalen Auswirkungen 3 Ticks.
mastership.staffs.targetedhit.desc=Die präzisen Nahkampfangriffe des Abenteurers erlauben es ihm, bis zu 2 Punkte Schadensreduktion bei seinen Gegnern zu ignorieren, sofern er mit einer Klingenwaffe kämpft. Dies zählt zusätzlich zu allen anderen Möglichkeiten des Kämpfers, die Schadensreduktion seines Gegners zu umgehen.
mastership.staffs.whirlingblades.desc=(Manöver) Gelingt das Manöver Klingenwirbel, rückt der Angreifer nach Abhandlung des Nahkampfangriffs noch einmal seine halbe Waffengeschwindigkeit in Ticks vor.\nDafür kann er einen zweiten sofortigen Nahkampfangriff ohne eigene Tickkosten mit derselben Waffe und einem Malus in Höhe von 3 Punkten ausführen. Hierfür muss er nicht die sonst übliche Waffengeschwindigkeit aufwenden. Dieser Angriff kann gegen ein zweites in Nahkampfdistanz befindliches Ziel gerichtet sein, darf aber keine Meisterschafts-Manöver verwenden.
mastership.staffs.dashingblow.desc=(Manöver) Dieser Nahkampfangriff verursacht zusätzlich zum normalen Schaden beim Gegner für 30 Ticks den Zustand Benommen 1.
mastership.staffs.standclear.desc=Solange der Abenteurer eine Stangenwaffe mit dem Merkmal Lange Waffe führt, gelingt sein etwaiges Lösen aus dem Kampf (S. 159) automatisch und seine Gegner können die entsprechende Aktion nicht nutzen. Zudem lösen seine Laufen-Aktionen und die freie Bewegung keine Gelegenheitsangriffe aus. Dies gilt nicht, wenn der betroffene Gegner auch eine Lange Waffe führt, allerdings erhöht sich dann der Bonus der eigenen Langen Waffe zum Lösen aus dem Kampf auf 5 Punkte.
mastership.staffs.longrangewhirlingblades.desc=Der zweite Angriff des Manövers Klingenwirbels ist bei Verwendung einer Stangenwaffe für Kenner dieser Meisterschaft nicht mehr erschwert. Zudem kann der Abenteurer ohne weiteren Aufwand einen dritten Nahkampfangriff ohne eigene Tickkosten ausführen, der nur halben Schaden verursacht und auch ein drittes Ziel in Nahkampfdistanz treffen kann. Auch dieser dritte Angriff darf keine Meisterschafts-Manöver nutzen. Insgesamt dürfen nicht mehr als zwei der Nahkampfangriffe gegen denselben Gegner gerichtet sein.
mastership.longrange.siegeshooter.desc=Für den Abenteurer zählt die Deckung von Zielen, die er mit Schusswaffen angreift, um eine Stufe niedriger.
mastership.longrange.marksman.desc=Der Angreifer kann bei Verwendung von Schusswaffen die Modifikatoren für Schüsse ins Kampfgetümmel ignorieren.
mastership.longrange.fastshooter1.desc=Der Zeitaufwand für das Bereitmachen einer Schusswaffe sinkt für den Abenteurer um 1 Tick.
mastership.longrange.targetedshots1.desc=Die präzisen Fernkampfangriffe des Abenteurers erlauben es ihm, bis zu 2 Punkte Schadensreduktion beim Gegner zu ignorieren, sofern er mit einer Schusswaffe kämpft.\nDies zählt zusätzlich zu allen anderen Möglichkeiten des Kämpfers, die Schadensreduktion des Gegners zu umgehen.
mastership.longrange.sienewcutter.desc=(Manöver) Dieser Fernkampfangriff verursacht zusätzlich zum normalen Schaden beim Gegner den Zustand Lahm.
mastership.longrange.goodaim.desc=Wenn der Abenteurer bei einem Fernkampfangriff mit Schusswaffen mindestens eine Zielen-Aktion ausgeführt hat, verursacht dieser Fernkampfangriff neben den normalen Auswirkungen 1W6 zusätzlichen Schaden.
mastership.longrange.targetedshots2.desc=Die präzisen Schusswaffen-Fernkampfangriffe des Abenteurers erlauben es ihm, bis zu insgesamt 3 Punkte Schadensreduktion beim Gegner zu ignorieren. Dies zählt zusätzlich zu allen anderen Möglichkeiten des Kämpfers, die Schadensreduktion des Gegners zu umgehen.
mastership.longrange.mastershot.desc=(Manöver) Wenn der Abenteurer dieses Manöver nutzen möchte, muss er mindestens eine Zielen-Aktion ausführen. Dafür richtet sein Fernkampfangriff zusätzlichen Schaden in Höhe seiner Intuition an.
mastership.longrange.fastshooter2.desc=Der Zeitaufwand für das Bereitmachen einer Schusswaffe sinkt um insgesamt 2 Ticks
mastership.throwing.improvise.desc=Der Abenteurer hat gelernt, alltägliche Gegenstände als Wurfwaffen einzusetzen. Entsprechende Waffen mit dem Merkmal Improvisiert richten zwei zusätzliche Punkte Schaden an. Zusätzlich ist ihre Waffengeschwindigkeit 2 Punkte verbessert.
mastership.throwing.marksman.desc=Der Angreifer kann bei Verwendung vonWurfwaffen die Modifikatoren für Schüsse ins Kampfgetümmel ignorieren.
mastership.throwing.strongthrowing.desc=Die erste Erhöhung der Grundreichweite erfordert vom Abenteurer bei Einsatz von Wurfwaffen keinen zusätzlichen Erfolgsgrad.
mastership.throwing.hardthrow.desc=(Manöver) Wenn der Abenteurer mindestens eine Zielen-Aktion ausgeführt hat, verursacht dieser Fernkampfangriff neben den normalen Auswirkungen zusätzlichen Schaden in Höhe der halben Stärke des Abenteurers.
mastership.throwing.doublethrow.desc=(Manöver) Trifft das Manöver Mehrfachwurf und hält der Angreifer eine zweite Wurfwaffe in der Hand, muss der Angreifer sofort 2 weitere Ticks aufbringen. Dafür kann er sofort einen zweiten Fernkampfangriff ausführen, ohne die dafür üblichen Ticks aufzuwenden. Dieser Angriff kann gegen ein zweites Ziel gerichtet sein, darf aber in keinem Fall MeisterschaftsManöver beinhalten. Für einen Mehrfachwurf können nur Wurfwaffen bis unmodifizierter Last 1 verwendet werden.
mastership.throwing.closecombatthrow.desc=Der Abenteurer kann seine Wurfwaffen bereitmachen, während er in einen Nahkampf verwickelt ist, ohne einen Gelegenheitsangriff zu provozieren.
mastership.throwing.missilevolley.desc=(Manöver) Der Abenteurer kann mit diesem Manöver mehrere Wurfwaffen mit jeweils höchstens unmodifizierter Last 1 gleichzeitig werfen. Der Angriffswurf kann gegen bis zu drei Ziele angewendet werden (es können nicht mehrere Wurfwaffen auf ein einzelnes Ziel geschleudert werden). Als Schwierigkeit gilt die höchste Verteidigung, es wird nur eine Probe für alle Ziele gewürfelt. Eventueller zusätzlicher Schaden aus dem freien Manöver Wuchtangriff zählt für alle Ziele. Der Angreifer kann einen weiteren Erfolgsgrad nutzen, um zwei zusätzliche, sich in Reichweite befindliche Feinde, deren Verteidigung übertroffen wurde, zu treffen. Es können nicht mehr Treffer verursacht werden, als Geschosse verwendet wurden. Maximal können fünf Geschosse gleichzeitig geworfen werden.
mastership.throwing.masterthrow.desc=(Manöver) Wenn der Abenteurer dieses Manöver nutzen möchte, muss er mindestens eine Zielen-Aktion ausführen. Dafür richtet sein Fernkampfangriff zusätzlichen Schaden in Höhe seiner Intuition an.
mastership.acrobatics.evade1.desc=Die Verteidigung des Abenteurers erhöht sich um 2 Punkte, wenn er weder Rüstungen noch Schilde oder Parierwaffen trägt, er sich des Angriffs bewusst ist und ihm ausreichend Platz zur Verfügung steht. Dieser Bonus reduziert sich, je nachdem, wie stark der Abenteurer belastet ist. Trägt er Ausrüstung mit einer Gesamt-Behinderung von maximal 1 und einem Tick-Zuschlag von 0, reduziert sich der Bonus auf 1 Punkt. Belastet ihn seine Ausrüstung noch stärker, kommt diese Meisterschaft nicht zum Tragen.\nBei der Berechnung von Gesamt-Behinderung und Tick-Zuschlag werden nur die Werte der Ausrüstung sowie etwaige Verbesserungen durch hohe Gegenstandsqualität betrachtet. Andere Modifikationen, zum Beispiel Verringerungen von Behinderung oder Tick-Zuschlag aus Meisterschaften, Zaubern oder einer Personalisierung, kommen ebenso wenig zum Tragen wie temporäre Erhöhungen, zum Beispiel aus Zuständen.
mastership.acrobatics.balance.desc=Wenn der Abenteurer über Seile, Balken oder ähnliches balanciert, kann er hierfür seine halbe Geschwindigkeit einsetzen, anstatt sich mit Geschwindigkeit 1 vorsichtig Schritt für Schritt vorzutasten.
mastership.acrobatics.flashreflexes.desc=Für die Bestimmung der Initiative gilt die Intuition des Abenteurers um 3 Punkte erhöht.
mastership.acrobatics.flashreflexes2.desc=Für die Bestimmung der Initiative gilt die Intuition des Abenteurers nochmals um 3 Punkte erhöht.
mastership.acrobatics.skipjack.desc=Kaum liegt der Abenteurer am Boden, steht er schon wieder auf den Beinen. Aufstehen kostet ihn nur 3 Ticks und zählt für ihn als sofortige Aktion.
mastership.acrobatics.roll.desc=Der Abenteurer kann sich nach einem Sturz besonders gut instinktiv abrollen. Fallschaden ist um eine Stufe reduziert.
mastership.acrobatics.evade2.desc=Die Verteidigung des Abenteurers erhöht sich um 4 Punkte, wenn er weder Rüstungen noch Schilde oder Parierwaffen trägt, er sich des Angriffs bewusst ist und ihm ausreichend Platz zur Verfügung steht. Dieser Bonus reduziert sich, je nachdem, wie stark der Abenteurer belastet ist. Trägt er Ausrüstung mit einer Gesamt-Behinderung von maximal 0 und einem Tick-Zuschlag von 0, reduziert sich der Bonus auf 2 Punkte. Belastet ihn seine Ausrüstung noch stärker, kommt diese Meisterschaft nicht zum Tragen.\nBei der Berechnung von Gesamt-Behinderung und Tick-Zuschlag werden nur die Werte der Ausrüstung sowie etwaige Verbesserungen durch hohe Gegenstandsqualität betrachtet. Andere Modifikationen, zum Beispiel Verringerungen von Behinderung oder Tick-Zuschlag aus Meisterschaften, Zaubern oder einer Personalisierung, kommen ebenso wenig zum Tragen wie temporäre Erhöhungen, zum Beispiel aus Zuständen.
mastership.acrobatics.escapologist.desc=Der Abenteurer ist in der Lage, seinen Körper zu verdrehen und sogar gezielt Gelenke auszukugeln. Jede Probe, um sich durch Akrobatik aus Fesseln zu befreien, erhält einen Bonus in Höhe von 6 Punkten.
mastership.acrobatics.coordevade.desc=Der Abenteurer kann eine Aktive Abwehr zur Erhöhung der Verteidigung über Akrobatik ausführen, ohne dass diese eine kontinuierliche Aktion, die er gerade ausführt, abbricht.
mastership.acrobatics.masterbalance.desc=Der Abenteurer kann über wackligen Untergrund so schnell laufen wie über festen Boden. Beim Balancieren kann er seine volle Geschwindigkeit einsetzen.
mastership.acrobatics.evademovement.desc=Der Abenteurer ist in der Lage, Strecken so zurückzulegen, dass ein Angreifer kaum Gelegenheit hat, ihn zu attackieren. Eine Ausweichbewegung zählt als Sprint (siehe S. 159), wobei der Akrobat nur drei Viertel seiner Geschwindigkeit nutzen und keine weiteren Handlungen ausführen kann. Dafür sind Gelegenheitsangriffe gegen ihn nicht möglich.
mastership.acrobatics.evade3.desc=Die Verteidigung des Abenteurers erhöht sich um 6 Punkte, wenn er sich des Angriffs bewusst ist und ihm ausreichend Platz zur Verfügung steht. Trägt der Abenteurer irgendwelche Rüstungen, Schilde oder Parierwaffen, kommt diese Meisterschaft nicht zum Tragen. Dasselbe gilt für sonstige Ausrüstung mit Einfluss auf Behinderung oder Tick-Zuschlag.
mastership.acrobatics.contortionist.desc=Der Abenteurer kann seinen Körper in fast unmöglichem Maße verdrehen und biegen. Hierzu würfelt er eine Akrobatik-Probe, die Schwierigkeit hängt von dem Vorhaben ab (25, um sich in eine Kiste zu manövrieren, 30, um sich durch Gitterstäbe zu quetschen). Hierfür muss zumindest ein Minimum an Raum vorhanden sein \u2013 sich durch ein Schlüsselloch zu drücken, gelingt selbst dem besten Akrobat nicht ohne magische Hilfe.
mastership.alchemy.efficiency.desc=Der Alchemist arbeitet besonders schnell. Er kann bei der Herstellung von Tränken drei Proben am Tag ablegen, benötigt also e
mastership.alchemy.journeyman.desc=Der Alchemist kann Alchemika der Gegenstandsqualität 1 und 2 herstellen.
mastership.alchemy.scrimper.desc=Der Alchemist kann sehr gut mit Material haushalten. Die Herstellungskosten sinken auf ein Viertel des fertigen Preises (statt eines Drittels).
mastership.alchemy.talentedalchemist.desc=Der Alchemist kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seines Verstandes auf die aktuelle Alchemie-Probe zu erhalten.
mastership.alchemy.expert.desc=Der Alchemist kann Alchemika der Gegenstandsqualität 3 und 4 herstellen
mastership.alchemy.wonderworker.desc=Der Alchemist ist in der Lage, sehr hart und schnell zu arbeiten. Wenn er Alchemika herstellt, kann er einen Malus in Höhe von 3 Punkten in Kauf nehmen, um die benötigte Zeit aller Proben zu halbieren.
mastership.alchemy.hardendbycustom.desc=Der Abenteurer ist im Umgang mit toxischen Stoffen abgehärtet. Er erhält einen Bonus in Höhe von 3 Punkten auf seinen Körperlichen Widerstand gegen Gifte.
mastership.alchemy.master.desc=Der Alchemist kann Alchemika der Gegenstandsqualität 5 und 6 herstellen.
mastership.alchemy.masterpiece.desc=Der Alchemist ist eine Legende seines Fachs. Seine Tränke erhalten automatisch eine zusätzliche Stufe Gegenstandsqualität (bis zu einer Qualität von 7), die er bei der Berechnung von Schwierigkeit, Materialkosten und benötigten Fortschrittspunkten nicht berücksichtigen muss.
mastership.leadership.challenge.desc=Der Abenteurer fordert einen Kampfteilnehmer zum Zweikampf heraus. Es ist eine Probe gegen den Geistigen Widerstand des Gegners nötig (Kont. Aktion, Dauer: 10 Ticks). Wenn sie gelingt, stellt sich der Kontrahent dem Zweikampf. Er nutzt stets seine üblichen Kampfmittel. Sollte ein Kampf aussichtslos sein (etwa im Kampf Bauer gegen Ritter), kann das Ziel zu fliehen versuchen, aber keine aggressiven Handlungen gegen andere Kampfteilnehmer ausführen.
mastership.leadership.coordinator.desc=Wenn der Abenteurer Verbündete koordiniert, steigt der Bonus aus Koordinieren um 1 Punkt.
mastership.leadership.troopup.desc=Der Abenteurer wendet eine kontinuierliche Aktion (5 Ticks) auf und legt eine Anführen-Probe (Schwierigkeit 20) ab, um die Moral seiner Verbündeten zu stärken. Maßnahmen gegen die Moral oder das Selbstvertrauen von Verbündeten erhalten für 20 Ticks einen Malus in Höhe von 1 Punkt. Wer schon von passenden Zuständen aus solchen Effekten betroffen ist (etwa Angsterfüllt), darf eine Probe auf Entschlossenheit oder Zähigkeit gegen die Schwierigkeit der ursprünglichen Ursache ablegen, um den Zustand abzuschütteln.
mastership.leadership.inspire.desc=Der Abenteurer hält eine Rede vor einer Gruppe und legt eine Probe auf Anführen ab. Die Schwierigkeit beträgt 25 + 1 pro 10 Personen. Gelingt die Probe, erhalten alle Zuhörer einen Bonus in Höhe von 1 Punkt auf Proben in der nächsten Stunde. Jeder Erfolgsgrad erhöht die Dauer um 1 Stunde.
mastership.leadership.attackplan.desc=Der Abenteurer wendet eine kontinuierliche Aktion (10 Ticks) auf, um die Offensivkraft seiner Gefährten zu bündeln. Er muss eine Probe auf Anführen gegen 20 ablegen. Alle Verbündeten, die ihn hören (maximal seine doppelte Ausstrahlung), erhalten einen Bonus in Höhe von 1 Punkt (+1 pro Erfolgsgrad) auf ihren Angriff. Alle 10 Ticks sinkt der Bonus um 1. Entwirft der Abenteurer einen neuen Schlachtplan, entfällt jeder Bonus des alten.
mastership.leadership.defenseplan.desc=Der Abenteurer bündelt mit einer kontinuierlichen Aktion (10 Ticks) die Verteidigungskraft seiner Gefährten. Er muss eine Probe auf Anführen gegen 20 ablegen.\nAlle Verbündeten, die ihn hören (maximal seine doppelte Ausstrahlung), erhalten einen Bonus in Höhe von 1 Punkt (+1 pro Erfolgsgrad) auf ihre Verteidigung. Alle 10 Ticks sinkt der Bonus um 1. Entwirft der Abenteurer einen neuen Schlachtplan, entfällt jeder Bonus des alten.
mastership.leadership.lastarray.desc=Mit einer Rede und einer Anführen-Probe gegen 15 kann der Abenteurer eine zahlenmäßig unterlegene Kampfgruppe motivieren. Bei Erfolg werden 1 (+1 pro Erfolgsgrad) Punkte auf die Mannstärke der Gruppe hinzugerechnet, sodass diese einen geringeren Überzahlmalus hinnehmen oder gar in Unterzahl einen Überzahlbonus erhalten kann (siehe S. 170).
mastership.leadership.tacticalmastermind.desc=Der Abenteurer kann die Effekte beider Schlachtpläne kombinieren.
mastership.arcanelore.arcanedefense1.desc=Wissen und Ausbildung ermöglichen es dem Abenteurer, sich wirkungsvoll gegen Magie zu schützen. Wenn er einen Zauber, der gegen ihn gewirkt wird, erfolgreich identifiziert, erhält er einen Bonus in Höhe von 3 Punkten auf seinen passenden Widerstandswert gegen diesen.
mastership.arcanelore.artifactlore.desc=Der Abenteurer kann die Fähigkeiten von Artefakten identifizieren. Hierzu ist eine Probe nötig, deren Schwierigkeit 23 + doppelte Artefaktqualität entspricht. Mehr zu Artefakten finden Sie auf GRW S. 254.
mastership.arcanelore.createscroll1.desc=Der Abenteurer kann Schriftrollen der Artefaktqualität 1 und 2 herstellen.
mastership.arcanelore.arcanedefense2.desc=Der Abenteurer kann sich besser gegen Magie verteidigen. Wenn er einen Zauber, der gegen ihn gewirkt wird, erfolgreich identifiziert, erhält er einen Bonus in Höhe von 6 Punkten auf eine eventuelle Aktive Abwehr.
mastership.arcanelore.huntersupernatural.desc=Der Abenteurer wählt eine konkrete Art magischer Wesen aus (Wesen mit mindestens MYS 1 ohne den Typus Humanoid). Gegen diese erhält er einen Bonus in Höhe von 3 Punkten auf Angriffe und Proben auf Wahrnehmung und Überleben. Die Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss eine neue Art ausgesucht werden.
mastership.arcanelore.createscroll2.desc=Der Abenteurer kann Schriftrollen der Artefaktqualität 3 und 4 herstellen.
mastership.arcanelore.fortuneteller.desc=Der Abenteurer kann in die Zukunft blicken, indem er Karten legt, Knochen wirft, die Gestirne betrachtet oder andere Quellen heranzieht. Dies dauert 10 Minuten. Nach einer erfolgreichen Probe auf Arkane Kunde (Schwierigkeit 20) erhält er einen Bonus in Höhe von 1 Punkt (+1 pro Erfolgsgrad), den er in den nächsten 24 Stunden für einen einzigen Wurf nachträglich einsetzen kann. Er kann auch einem Gefährten weissagen.\nErst wenn die Weissagung eingetreten ist (also der Bonus genutzt wurde) oder die Zeit verstrichen ist, kann der Abenteurer eine neue Weissagung treffen.
mastership.arcanelore.beasthunter.desc=Der Abenteurer wählt eine konkrete Art magischer Wesenheiten, für die er die Meisterschaft Jäger des Übernatürlichen besitzt. Der Bonus erhöht sich auf 5. Bestienjäger kann genau wie Jäger des Übernatürlichen mehrfach gewählt werden.
mastership.arcanelore.createscroll3.desc=Der Abenteurer kann Schriftrollen der Artefaktqualität 5 und 6 herstellen.
mastership.athletics.monkey.desc=Der Abenteurer benötigt beim Klettern nur 1 Fortschrittspunkt pro 5 Meter anstatt pro 3 Meter.
mastership.athletics.sprinter.desc=Die Geschwindigkeit des Abenteurers erhöht sich um 1. Diese Meisterschaft kann bis zu zweimal gewählt werden.
mastership.athletics.sprinter2.desc=Die Geschwindigkeit des Abenteurers erhöht sich um 1. Diese Meisterschaft kann bis zu zweimal gewählt werden.
mastership.athletics.longjump.desc=Die Sprungweite des Charakters erhöht sich um 50%: Die Schwierigkeit einer Springen-Probe erhöht sich nur um 3 pro 50 cm, nicht um 5
mastership.athletics.swiftpursuit.desc=Der Abenteurer ist ausgesprochen hartnäckig in der Verfolgung. Bei einer Verfolgungsjagd erhält er pro gelungener Probe automatisch 1 Fortschrittspunkt zusätzlich.
mastership.athletics.steeplechaser.desc=Der Abenteurer beherrscht spezielle Techniken, im Lauf rasch Hindernisse zu überwinden. Er erhält einen Bonus in Höhe von 3 Punkten auf alle Proben zum Springen und Überwinden von Hindernissen.
mastership.athletics.muscleman.desc=Der Abenteurer kann seine rohe Kraft besonders gut einsetzen. Bei einem Kraftakt erhält er einen Bonus in Höhe von 5 Punkten.
mastership.athletics.freeclimber.desc=Der Abenteurer kann beim Klettern jeden Malus durch fehlende Ausrüstung vollständig ignorieren.
mastership.athletics.wallclimber.desc=Der Abenteurer überwindet kleine Hindernisse mit Leichtigkeit. Er erhält einen Bonus in Höhe von weiteren 3 Punkten auf Proben zum Überwinden von Hindernissen und kann Hindernisse bis Brusthöhe bei erfolgreicher Probe nehmen, ohne in der Bewegung verlangsamt zu werden. Wenn er mindestens 3 Meter Anlauf hat, kann er mit einer Athletik-Probe gegen 35 Hindernisse bis zu seiner vollen Größenklasse in Metern (statt wie üblich drei Viertel der GK) überwinden.
mastership.performance.influenceattitude.desc=Der Künstler kann mit seiner Darbietung wie auf GRW 147 beschrieben die Einstellung des Publikums beeinflussen.
mastership.performance.fascinate.desc=Der Künstler zieht das Publikum mit der Darbietung in seinen Bann. Die Zuschauer erhalten für die Dauer der Darbietung einen Malus auf alle Wahrnehmung-Proben von 1 Punkt (+1 pro Erfolgsgrad).
mastership.performance.journeyman.desc=Der Künstler kann bis zu 2 EG bei passenden Proben ansammeln. Die Meisterschaft muss für einen bestimmten Schwerpunkt gewählt werden und gilt nur im Zusammenhang damit. Der Besitz des Schwerpunktes ist keine Voraussetzung für die Wahl dieser Meisterschaft. Die Meisterschaft ist mehrfach wählbar.
mastership.performance.watchit.desc=Der Abenteurer hat (etwa durch Erfahrung im Bühnenfechten) gelernt, bedrohlicher auszusehen als er ist. Das bringt Gegner dazu, seinen eigentlich ungefährlichen Scheinattacken besondere Aufmerksamkeit zu schenken. Bei Verwendung der Regeln zur Zusammenarbeit im Kampf darf er Darbietung anstelle einer Kampffertigkeit einsetzen und kann seine EG voll nutzen.
mastership.performance.crowdpleaser.desc=Wenn der Künstler Darbietung nutzt, um Geld zu verdienen, erhält er die doppelte Summe.
mastership.performance.bansong.desc=Der Künstler füllt mit seiner Darbietung die Herzen seiner Gefährten mit Mut und schützt sie vor auf Musik oder Geräuschen basierenden Effekten (wie dem Gesang einer Sirene).\nVerbündete, die den Künstler hören, erhalten einen Bonus in Höhe von 1 Punkt (+1 pro Erfolgsgrad) auf entsprechende Widerstandswerte oder dürfen, wenn sie bereits betroffen sind, eine Probe auf Zähigkeit oder Entschlossenheit gegen die Schwierigkeit der ursprünglichen Ursache ablegen. Der Vorteil eines Bannliedes wirkt, solange der Abenteurer musiziert.
mastership.performance.talentedartist.desc=Der Abenteurer kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seiner Ausstrahlung für die aktuelle Darbietung-Probe zu erhalten.
mastership.performance.expert.desc=Der Künstler kann bis zu 3 EG bei passenden Proben ansammeln. Die Meisterschaft muss für einen bestimmten Schwerpunkt gewählt werden und gilt nur im Zusammenhang damit. Der Besitz des Schwerpunktes ist keine Voraussetzung für die Wahl dieser Meisterschaft. Die Meisterschaft ist mehrfach wählbar.
mastership.performance.hahascoundrel.desc=Der Abenteurer verwirrt Gegner im Kampf mit dramatischen und doch überzeugend wirkenden Kampfbewegungen. Bei der Zusammenarbeit im Kampf kann er sich entscheiden, nicht gegen die um 5 verminderte Verteidigung, sondern gegen den (normalen) Geistigen Widerstand des Gegners zu würfeln.
mastership.performance.diatribehymn.desc=Der Künstler kann die Einstellung des Publikums zu einer anderen Person (z.B. dem Stadtvogt) beeinflussen.
mastership.performance.laughmedicine.desc=Der Abenteurer hat gelernt, mit Humor die Selbstheilungskräfte des Körpers zu aktivieren. Er kann eine Darbietung-Probe einsetzen, um Proben zur Heilung zu unterstützen (und kann dabei seine EG voll nutzen). Ist er selbst der Heiler, erhält er einen Bonus in Höhe von 1 Punkt auf seine Proben. In beiden Fällen muss der Patient bei Bewusstsein sein.
mastership.performance.rebellionsong.desc=Der Künstler stachelt die Menge zu offener Feindseligkeit an. Nachdem er mit Schmählied die Einstellung des Publikums auf Feindselig geändert hat, bringt er es mit einer weiteren erfolgreichen Probe auf Darbietung gegen das Ziel seiner Darbietung auf und sorgt so z.B. für einen wütenden Mob, der das Haus des Stadtvogts stürmt.
mastership.performance.master.desc=Der Künstler kann beliebig viele EG bei passenden Proben ansammeln. Die Meisterschaft muss für einen bestimmten Schwerpunkt gewählt werden und gilt nur im Zusammenhang mit diesem. Der Besitz des Schwerpunktes ist keine Voraussetzung für die Wahl dieser Meisterschaft. Die Meisterschaft ist mehrfach wählbar.
mastership.diplomacy.diplomat.desc=Die Einstellung eines Verhandlungspartners gilt bei der Bestimmung der Schwierigkeit um eine Stufe zugunsten des Abenteurers verschoben (bis maximal aufgeschlossen).
mastership.diplomacy.haggler.desc=Die Preise bei Händlern sind für den Abenteurer um 10 % gesenkt.
mastership.diplomacy.stylegrace.desc=Kleidung, Auftreten und Umgang des Diplomaten sind perfekt. Er erhält, sofern er Zeit und Mittel hat, sich zurechtzumachen, einen Bonus in Höhe von 2 Punkten auf alle Proben auf Darbietung, Diplomatie und Redegewandtheit in den oberen Gesellschaftsschichten.
mastership.diplomacy.sharptongue.desc=Der Abenteurer ist für seine scharfe Zunge berühmt und berüchtigt. Er würfelt eine vergleichende Probe auf Diplomatie gegen den Geistigen Widerstand seines Ziels.\nDiese kontinuierliche Aktion dauert 10 Ticks. Bei Erfolg verliert das Ziel die Beherrschung und erleidet einen Malus in Höhe von 1 Punkt (+1 pro Erfolgsgrad) auf alle nicht direkt gegen den Abenteurer gerichteten Proben in der Szene. Je nach Ziel kann sich der Abenteurer mit einer Duellforderung konfrontiert sehen.
mastership.diplomacy.missionary.desc=Wenn der Abenteurer einen Ungläubigen zu seinem Glauben bekehrt, erhält er einen Splitterpunkt. Dies erhöht sein Maximum nicht permanent.
mastership.diplomacy.etiquettes.desc=Der Diplomat kann den Effekt von Stil und Grazie auf andere ausdehnen. Dazu muss er ihnen im Vorfeld helfen, sich zurecht zu machen und dann anwesend sein, solange seine Gefährten den Bonus nutzen möchten.
mastership.diplomacy.investor.desc=Der Abenteurer kann Geld über seine Kontakte in Karawanen und ähnliches investieren. Nach Ablauf von drei Monaten macht der Abenteurer eine Probe auf Diplomatie. Die Schwierigkeit ist 35. Er erhält bei Erfolg 5 % Gewinn (+5% pro Erfolgsgrad). Ist die Probe knapp misslungen, erhält der Abenteurer sein Geld zurück. Bei einem Misserfolg verliert er für jeden negativen Erfolgsgrad 5 % seiner Investition. Bei einem verheerenden Fehlschlag verliert er alles.
mastership.diplomacy.knowhoiam.desc=Umgangsformen und Auftreten des Diplomaten suggerieren Einfluss und Macht, was ihm beim gemeinen Volk Vorteile verschafft. Er erhält einen Bonus in Höhe von 3 Punkten auf Proben in den Fertigkeiten Anführen, Diplomatie und Redegewandtheit gegenüber jedem, der im Stand unter ihm steht. Außerdem kann er mit einer Diplomatie-Probe gegen die Entschlossenheit seines Gegenübers andere dazu bringen, seinen Stand zu berücksichtigen: Wachen ignorieren leichte Vergehen, der Wirt gibt ihm das beste Zimmer, obwohl es gerade vermietet ist, und so weiter.
mastership.clscraft.efficiency.desc=Der Edelhandwerker arbeitet besonders schnell. Er kann bei der Herstellung von Gegenständen drei Proben pro Tag ablegen, benötigt also ein Drittel eines Tages für eine Probe (statt eines halben Tages).
mastership.clscraft.journeyman.desc=Der Edelhandwerker kann bis zu 2 EG bei passenden Proben ansammeln und Gegenstände der Gegenstandsqualität 1 und 2 herstellen und reparieren. Die Meisterschaft muss für einen bestimmten Schwerpunkt gewählt werden und gilt nur im Zusammenhang mit diesem. Der Besitz des Schwerpunktes ist keine Voraussetzung für die Wahl dieser Meisterschaft. Die Meisterschaft ist mehrfach wählbar.
mastership.clscraft.scrimper.desc=Der Handwerker kann besonders gut mit Material haushalten. Die Herstellungskosten sinken auf ein Viertel des fertigen Preises (statt eines Drittels).
mastership.clscraft.talentedtradesman.desc=Der Edelhandwerker kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seines Verstandes für die aktuelle Edelhandwerk-Probe zu erhalten.
mastership.clscraft.expert.desc=Der Edelhandwerker kann bis zu 3 EG bei passenden Proben ansammeln und Gegenstände der Gegenstandsqualität 3 und 4 herstellen und reparieren. Die Meisterschaft muss für einen bestimmten Schwerpunkt gewählt werden und gilt nur im Zusammenhang mit diesem. Der Besitz des Schwerpunktes ist keine Voraussetzung für die Wahl dieser Meisterschaft. Die Meisterschaft ist mehrfach wählbar.
mastership.clscraft.wonderworker.desc=Der Edelhandwerker kann besonders fleißig und schnell arbeiten. Wenn er bei Einsatz der Fertigkeit Edelhandwerk einen Gegenstand herstellt oder repariert, kann er einen Malus in Höhe von 3 Punkten in Kauf nehmen, um die benötigte Zeit der Probe zu halbieren.
mastership.clscraft.skilledsalvage.desc=Der Handwerker vermeidet mit Mühe und etwas Material schlimme Fehler in der Herstellung. Wenn er bei der Herstellung eines Gegenstandes ein verheerendes Ergebnis würfelt, kann er Materialkosten in Höhe der doppelten Gegenstandsqualität in Lunaren aufwenden (mindestens 5), um das verheerende Ergebnis zu ignorieren. So verliert er zwar Fortschrittspunkte in Höhe der negativen Erfolgsgrade, verliert aber nicht die ganze Arbeit.
mastership.clscraft.master.desc=Der Edelhandwerker kann beliebig viele Erfolgsgrade bei passenden Proben ansammeln und Gegenstände der Gegenstandsqualität 5 und 6 herstellen und reparieren. Die Meisterschaft muss für einen bestimmten Schwerpunkt gewählt werden und gilt nur im Zusammenhang damit. Der Besitz des Schwerpunktes ist keine Voraussetzung für die Wahl dieser Meisterschaft. Die Meisterschaft ist mehrfach wählbar.
mastership.clscraft.masterpiece.desc=Der Edelhandwerker ist eine Legende in seinem Fachgebiet. Von ihm hergestellte Gegenstände erhalten automatisch eine weitere Stufe Gegenstandsqualität (bis zu einer Qualität von 7), die er bei der Berechnung von Schwierigkeit, Materialkosten und benötigten Fortschrittspunkten nicht berücksichtigen muss. Die Meisterschaft kann mehrfach gewählt werden und gilt dann immer für einen anderen Schwerpunkt.
mastership.empathy.calm.desc=Der Abenteurer kann Zustände wie Angsterfüllt, Rasend oder Panisch beheben. Dies dauert eine Minute. Die Schwierigkeit liegt je nach Trauma zwischen 20 und 25. Mit Ausgabe eines Splitterpunktes können magische Furcht und ähnliches behoben werden, wenn dem Abenteurer eine vergleichende Probe gegen das Ergebnis der Zauberprobe gelingt.
mastership.empathy.readfoe1.desc=Nachdem er eine kontinuierliche Aktion von 10 Ticks Dauer aufgewandt hat, um einen Gegner zu beobachten, kann der Abenteurer eine Probe gegen dessen Geistigen Widerstand ablegen. Ist er erfolgreich, erhält er gegen diesen Gegner für den Rest des Kampfes einen Bonus in Höhe von 1 Punkt (+1 pro Erfolgsgrad) auf Angriffe. Alternativ erhält der Gegner einen entsprechenden Malus auf seine Angriffe auf den Abenteurer. Dies ist pro Kampf nur einmal pro Gegner möglich.
mastership.empathy.speaktome.desc=Nachdem er erfolgreich die Persönlichkeit seines Gegenübers eingeschätzt hat, erhält der Abenteurer für die laufende Szene einen Bonus in Höhe von 2 Punkten auf alle Proben auf Diplomatie und Redegewandtheit gegen sein Gegenüber.
mastership.empathy.judgecharacter.desc=Der Abenteurer kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seines Verstandes für die aktuelle Empathie-Probe zu erhalten.
mastership.empathy.readfoe2.desc=Es gelten sowohl der Angriffsbonus für den Abenteurer als auch der Angriffsmalus für den Gegner aus Gegner durchschauen I.
mastership.empathy.judgeattribute.desc=Anstelle einer Persönlichkeit kann der Abenteurer ein Attribut (auf +/- 1 genau) oder eine Fertigkeit (auf +/-2 genau) einschätzen. Bei einem herausragenden Erfolg schätzt er den genauen Wert.
mastership.empathy.mentalmaster.desc=Alle Proben des Abenteurers auf Zauber der Typen Mental, Gedanken oder Moral erhalten einen Bonus in Höhe von 2 Punkten.
mastership.empathy.hypnosis.desc=Mit einer Probe gegen den Geistigen Widerstand kann der Abenteurer sein Ziel hypnotisieren, um an Informationen zu gelangen. Die Trance herzustellen, dauert fünf Minuten. In diesem Zustand kann das Ziel ausgehorcht werden:\nWiderstand ist nur bei wichtigen Geheimnissen zu erwarten. Selbst dann erhält das Ziel die Erfolgsgrade als Malus auf etwaige Proben. Alternativ können die Erfolgsgrade als Bonus gewährt werden, um sich an etwas zu erinnern.
mastership.determination.ironwill.desc=Der Abenteurer kann sich auch unter schwierigen Umständen auf sein Handeln konzentrieren. Er erhält einen Bonus in Höhe von 3 Punkten auf Entschlossenheit-Proben zur Abwehr von Störungen bei kontinuierlichen Aktionen.
mastership.determination.keepcool1.desc=Der Abenteurer behält auch in schwierigen Situationen einen kühlen Kopf. Er kann 1 Punkt Malus, der durch äußere Umstände wie Wetter, Sicht oder andere Störungen zustande käme, bei seinen Fertigkeitsproben ignorieren.
mastership.determination.imperturbable.desc=Der Abenteurer ist von einem Ziel fest überzeugt. Der Spieler muss für seinen Abenteurer ein reales Ziel festlegen. Erreicht er das Ziel, kann er ein neues bestimmen (dies ist maximal einmal pro Woche möglich). Alle Entschlossenheit-Proben, deren Misslingen ihm das Erreichen seines Zieles erschweren würden, kann der Abenteurer mit einem Bonus in Höhe von 3 Punkten ausführen.
mastership.determination.talentedpighead.desc=Der Abenteurer kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seiner Willenskraft auf die aktuelle Entschlossenheit-Probe zu erhalten.
mastership.determination.instransparent.desc=Der Abenteurer ist von seinen Gegnern schwer zu durchschauen. Auf Proben, um andere zu belügen oder einfach nur seine wahren Motive oder Emotionen zu bewahren, erhält er einen Bonus in Höhe von 3 Punkten.
mastership.determination.effortofwill.desc=Der Abenteurer kann einen Splitterpunkt ausgeben, um mit großem Elan zu Werke zu gehen. Er erhält für 30 Ticks einen Bonus in Höhe von 3 Punkten auf alle Fertigkeiten, in die seine WIL eingeht. Nach Ablauf dieser Zeit erhält er aber für eine Stunde den Zustand Erschöpft I.
mastership.determination.healthydistrust.desc=Der Abenteurer hat gelernt, nicht jedem und allem sofort zu trauen. Er erhält einen Bonus in Höhe von 3 Punkten auf Proben, um Lügen zu durchschauen. Falls ihm eine Wahrnehmung-Probe zusteht, um Illusionen zu durchschauen (siehe GRW 208), erhält er hier ebenfalls einen Bonus in Höhe von 3 Punkten.
mastership.determination.keepcool2.desc=Der Abenteurer kann bis zu 3 Punkte Malus, die durch äußere Umstände wie Wetter, Sicht oder andere Störungen zustande kommen, bei seinen Fertigkeitsproben ignorieren.
mastership.dexterity.solverofknots.desc=Der Abenteurer ist von Fesseln schwer zu halten. Er löst selbst die kompliziertesten Knoten. Jede Probe, um sich mit Fingerfertigkeit zu entfesseln, erhält einen Bonus in Höhe von 3 Punkten.
mastership.dexterity.creativedistraction.desc=Der Abenteurer hat immer eine gute Idee, um jemanden abzulenken. Benutzt er eine Fertigkeit, um für eine Ablenkung zu sorgen, steigt der Bonus auf 5.
mastership.dexterity.quickdrawer.desc=Der Abenteurer kann verborgene Waffen so ziehen, als würde er sie an der Seite tragen. Trägt er die Waffe schon greifbar, kann er sie um 2 Ticks schneller ziehen. Für das Bereitmachen einer Wurfwaffe benötigt er einen Tick weniger.
mastership.dexterity.talentedfingerartist.desc=Der Abenteurer kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seiner Beweglichkeit für die aktuelle Fingerfertigkeit-Probe zu erhalten.
mastership.dexterity.calmhand.desc=Der Abenteurer hat eine besonders ruhige Hand. Wenn er mit der Fertigkeit Schlösser und Fallen versucht, Fallen zu entschärfen, oder mit Heilkunde chirurgische Eingriffe ausführt, erhält er einen Bonus in Höhe von 3 Punkten.
mastership.dexterity.hidemagicgestures.desc=Der Abenteurer benutzt seine Fingerfertigkeit, um beim Zaubern die Gesten zu tarnen. Es dauert 2 Ticks länger, den Zauber vorzubereiten. Ein Versuch, den Zauber während der Wirkung zu identifizieren (GRW 150), erhält den Malus für fehlende Gesten von 3 Punkten. Sollte außerdem die Komponente Formel weggelassen werden, ist der Zaubervorgang nicht als solcher zu erkennen.
mastership.dexterity.wasnotme.desc=Der Abenteurer ist so geübt mit den Fingern, dass misslungene Proben zum Taschendiebstahl nur bemerkt werden, wenn das Opfer zwei Erfolgsgrade besser ist als der Dieb.
mastership.dexterity.weaponoutofnothing.desc=Mit einer unerwarteten Bewegung kann der Abenteurer eine versteckte Waffe (bis maximal Last 1) ziehen, was die üblichen Ticks benötigt. Ein Gegner ist von einem etwaigen folgenden Nahkampfangriff mit dieser Waffe überrascht (der Angreifer erhält für die erste Aktion einen Taktischen Vorteil, der Gegner verliert 10 Ticks zur Orientierung, siehe GRW 170). Dieser Trick funktioniert nur einmal pro Kampf.
mastership.history.bibliophile.desc=Der Gelehrte ist besonders gut bei der Recherche. Wenn er in einer Bibliothek recherchiert oder forscht, sinkt die Dauer einer Probe auf 1 Stunde (statt 2).
mastership.history.fieldstudy.desc=Der Abenteurer geht alten Geheimnissen lieber vor Ort auf die Spur, anstatt in einer Bibliothek zu sitzen. In Ruinen erhält er durch tiefgreifenden Kenntnisse alter Legenden einen Bonus in Höhe von 3 Punkten auf Schlösser und Fallen-Proben.
mastership.history.legendsinger.desc=Das Wissen des Abenteurers macht ihn zu einem gerngesehenen Gast in Tavernen und an den Höfen. Er erhält einen Bonus in Höhe von 3 Punkten auf Darbietung-Proben, wenn er Epen und Legenden vorträgt.
mastership.history.talentedhistorian.desc=Der Abenteurer kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seines Verstandes auf die aktuelle Geschichte und Mythen-Probe zu erhalten.
mastership.history.librarian.desc=Der Gelehrte ist in Bibliotheken geradezu zu Hause. Die Dauer einer Probe bei einer Bibliotheksrecherche sinkt auf eine halbe Stunde.
mastership.history.hunteroffables.desc=Der Abenteurer wählt eine konkrete Art von Sagenkreatur aus (Wesen des Typus Geisterwesen, Monster, Untoter oder Feenwesen). Gegen diese erhält er einen Bonus in Höhe von 3 Punkten auf Angriffe und Proben auf Wahrnehmung und Überleben. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss eine neue Art gewählt werden.
mastership.history.truthwithin.desc=Der Abenteurer findet Wege, sein umfangreiches Geschichtswissen praktisch umzusetzen. Einmal pro Spielsitzung kann er eine Probe auf Geschichte und Mythen (Schwierigkeit 20) machen. Er erhält einen Bonus in Höhe von 1 (+1 pro EG) auf eine anschließende passende Fertigkeitsprobe.
mastership.history.legendhunter.desc=Der Abenteurer wählt eine Gruppe Sagenkreaturen, für die er die Meisterschaft Jäger des Sagenhaften besitzt. Der Bonus erhöht sich auf 5. Legendenjäger kann genau wie Jäger des Sagenhaften mehrfach gewählt werden.
mastership.craftmanship.efficiency.desc=Der Handwerker arbeitet besonders schnell. Er kann bei der Herstellung von Gegenständen drei Proben pro Tag ablegen, benötigt also nur ein Drittel eines Tages für eine Probe (statt eines halben Tages).
mastership.craftmanship.journeyman.desc=Der Handwerker kann bis zu 2 EG bei passenden Proben ansammeln und Gegenstände der Gegenstandsqualität 1 und 2 herstellen und reparieren. Die Meisterschaft muss für einen bestimmten Schwerpunkt gewählt werden und gilt nur im Zusammenhang mit diesem. Der Besitz des Schwerpunktes ist keine Voraussetzung für die Wahl dieser Meisterschaft. Die Meisterschaft ist mehrfach wählbar.
mastership.craftmanship.scrimper.desc=Der Handwerker kann besonders gut mit Material haushalten. Die Herstellungskosten sinken auf ein Viertel des fertigen Preises (statt eines Drittels).
mastership.craftmanship.talentedcraftsman.desc=Der Handwerker kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seines Verstandes für die aktuelle Handwerk-Probe zu erhalten.
mastership.craftmanship.expert.desc=Der Handwerker kann bis zu 3 EG bei passenden Proben ansammeln und Gegenstände der Gegenstandsqualität 3 und 4 herstellen und reparieren. Die Meisterschaft muss für einen bestimmten Schwerpunkt gewählt werden und gilt nur im Zusammenhang mit diesem. Der Besitz des Schwerpunktes ist keine Voraussetzung für die Wahl dieser Meisterschaft. Die Meisterschaft ist mehrfach wählbar.
mastership.craftmanship.wonderworker.desc=Der Handwerker ist in der Lage, besonders hart und schnell zu arbeiten. Wenn er bei Einsatz der Fertigkeit Handwerk einen Gegenstand herstellt oder repariert, kann er einen Malus in Höhe von 3 Punkten in Kauf nehmen, um die benötigte Zeit der Probe zu halbieren.
mastership.craftmanship.skilledrescue.desc=Der Handwerker kann mit Mühe und etwas Material auch schlimme Fehler in der Herstellung vermeiden. Wenn er bei der Herstellung eines Gegenstandes ein verheerendes Ergebnis würfelt, kann er Materialkosten in Höhe der doppelten Gegenstandsqualität in Lunaren aufwenden (mindestens 5), um das verheerende Ergebnis zu ignorieren. In diesem Fall verliert er zwar Fortschrittspunkte in Höhe der negativen Erfolgsgrade, verliert aber nicht die ganze Arbeit.
mastership.craftmanship.master.desc=Der Handwerker kann beliebig viele EG bei passenden Proben ansammeln und Gegenstände der Gegenstandsqualität 5 und 6 herstellen und reparieren. Die Meisterschaft muss für einen bestimmten Schwerpunkt gewählt werden und gilt nur im Zusammenhang mit diesem. Der Besitz des Schwerpunktes ist keine Voraussetzung für die Wahl dieser Meisterschaft. Die Meisterschaft ist mehrfach wählbar.
mastership.craftmanship.masterpiece.desc=Der Handwerker ist eine Legende in seinem Fachgebiet. Von ihm hergestellte Gegenstände erhalten automatisch eine zusätzliche Stufe Gegenstandsqualität (bis zu einer Qualität von 7), die er bei der Berechnung von Schwierigkeit, Materialkosten und benötigten Fortschrittspunkten nicht berücksichtigen muss. Die Meisterschaft kann mehrfach gewählt werden und gilt dann immer für einen anderen Schwerpunkt.
mastership.heal.fielddignostics.desc=Der Heiler kann den Zustand eines Patienten besonders gut einschätzen. Nimmt er sich 5 Minuten Zeit, um den Patienten zunächst gründlich zu untersuchen, erhält er bei der Behandlung durch Heilkunde einen Bonus in Höhe von 3 Punkten.
mastership.heal.healingluck.desc=Dem Abenteurer unterlaufen kaum noch Fehler. Die Ergebnisse Misslungen und Verheerend verursachen 3 Schadenspunkte weniger.
mastership.heal.lifesaver.desc=Wenn der Abenteurer den Zustand Sterbend behandelt, senkt er die Stufe des Zustands bei Gelingen um 1 Stufe +1 pro Erfolgsgrad (nicht wie normalerweise pro 2 Erfolgsgrade).\nDie Behandlung kostet ihn außerdem nur 20 Ticks.
mastership.heal.skilledhealer.desc=Der Abenteurer kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seines Verstandes für die aktuelle Heilkunde-Probe zu erhalten.
mastership.heal.supporthealing.desc=Wenn der Heiler einen Patienten behandelt, erhält dieser in der nächsten Nacht 2 zusätzliche Lebenspunkte zurück.
mastership.heal.vetinary.desc=Der Heiler kann die Erhöhung der Schwierigkeit bei der Behandlung von Wesen mit dem Typus Tier ignorieren.
mastership.heal.creaturespecialist.desc=Der Heiler kann die Erhöhung der Schwierigkeit bei sämtlichen ungewöhnlichen Lebewesen (Tiere, Monstren, Feenwesen, etc.) vollständig ignorieren.
mastership.heal.surgeon.desc=Wenn der Abenteurer die Zustände Blutend oder Verwundet behandelt, senkt er die Stufe des Zustands bei Gelingen um 1 Stufe +1 pro Erfolgsgrad (nicht wie normalerweise pro 2 Erfolgsgrade).
mastership.stealth.creeper.desc=Der Abenteurer kann sich schnell leise bewegen und daher bei Heimlichkeit-Proben jeden Malus aus den Umständen Laufen und Sprinten ignorieren. Beschattet er jemanden (siehe unten), muss der Abenteurer nur alle 1000 m eine Probe ablegen.
mastership.stealth.sneakattack1.desc=Der Abenteurer kann einen Gegner, den er überrascht (siehe GRW 158), mit einer einhändigen Waffe oder einer Fernkampfwaffe empfindlich treffen. In diesem Fall richtet er 6 Punkte zusätzlichen Schaden an. Der Abenteurer kann ein ahnungsloses Ziel mit einem Fernkampfangriff auf bis 10 m Entfernung angreifen.
mastership.stealth.unobstrusive.desc=Der Abenteurer kann in passenden Situationen, wenn er aufgrund einer misslungenen Probe beim Versuch. jemanden zu beschatten, entdeckt wurde, ohne Probe in der Menge untertauchen. Proben, um sich an ihn zu erinnern, erhalten zudem einen Malus in Höhe von 3 Punkten.
mastership.stealth.skilledcreeper.desc=Der Abenteurer kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seiner Beweglichkeit für die aktuelle Heimlichkeit-Probe zu erhalten.
mastership.stealth.ambush.desc=Der Abenteurer ist gut darin, den Hinterhalt einer ganzen Gruppe vorzubereiten. Er kann problemlos eine Anzahl von Leuten koordinieren, die maximal seiner doppelten Ausstrahlung entspricht, für jeden zusätzlichen Teilnehmer erhält er einen Malus in Höhe von -1 auf die Probe. Wenn er den Hinterhalt vorbereitet, müssen die anderen Teilnehmer nicht mehr würfeln, sondern können sein Probenergebnis verwenden. Ist er bei einem Hinterhalt alleine, erhält er einen Bonus in Höhe von 3 Punkten auf seine Probe.
mastership.stealth.sneakattack2.desc=Siehe Überraschungsangriff I, allerdings erhöht sich der Bonusschaden auf 10 und ein Fernkampfangriff ist auf 20 m Reichweite möglich.
mastership.stealth.soundlessness.desc=Das Schleichen ist dem Abenteurer ins Blut übergegangen. Er bewegt sich stets leise, selbst wenn der Spieler es nicht angesagt hat. Sollten unerwartete Feinde oder Wachen auftauchen, kann er nachträglich eine Heimlichkeit-Probe ablegen, als hätte er sich von vorneherein darauf konzentriert.
mastership.stealth.sneakattack3.desc=Siehe Überraschungsangriff II, nur dass der Abenteurer nun auch auf bis zu 30 m Entfernung angreifen kann. Greift der Abenteurer seinen Gegner im Nahkampf an, darf er seinem Opfer anstelle des zusätzlichen Schadens einen Zustand zufügen. Zur Auswahl stehen (siehe GRW 168): Benommen 2, Blutend 1, Geblendet 4, Verwundet 1.
mastership.hunting.animaladept_bear.desc=Der Abenteurer wählt einen der folgenden Typen aus: Bärenartiger, Fisch, Großwild, Hundeartiger, Insekt, Katzenartiger, Kleinwild, Reptil, Spinnentier, Vogel. Gegen Wesen, die den Typus Tier und diesen Typus aufweisen, erhält er einen Bonus in Höhe von 3 Punkten auf Angriffe. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.hunting.animaladept_biggame.desc=Der Abenteurer wählt einen der folgenden Typen aus: Bärenartiger, Fisch, Großwild, Hundeartiger, Insekt, Katzenartiger, Kleinwild, Reptil, Spinnentier, Vogel. Gegen Wesen, die den Typus Tier und diesen Typus aufweisen, erhält er einen Bonus in Höhe von 3 Punkten auf Angriffe. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.hunting.animaladept_canine.desc=Der Abenteurer wählt einen der folgenden Typen aus: Bärenartiger, Fisch, Großwild, Hundeartiger, Insekt, Katzenartiger, Kleinwild, Reptil, Spinnentier, Vogel. Gegen Wesen, die den Typus Tier und diesen Typus aufweisen, erhält er einen Bonus in Höhe von 3 Punkten auf Angriffe. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.hunting.animaladept_feline.desc=Der Abenteurer wählt einen der folgenden Typen aus: Bärenartiger, Fisch, Großwild, Hundeartiger, Insekt, Katzenartiger, Kleinwild, Reptil, Spinnentier, Vogel. Gegen Wesen, die den Typus Tier und diesen Typus aufweisen, erhält er einen Bonus in Höhe von 3 Punkten auf Angriffe. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.hunting.animaladept_insect.desc=Der Abenteurer wählt einen der folgenden Typen aus: Bärenartiger, Fisch, Großwild, Hundeartiger, Insekt, Katzenartiger, Kleinwild, Reptil, Spinnentier, Vogel. Gegen Wesen, die den Typus Tier und diesen Typus aufweisen, erhält er einen Bonus in Höhe von 3 Punkten auf Angriffe. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.hunting.animaladept_smallgame.desc=Der Abenteurer wählt einen der folgenden Typen aus: Bärenartiger, Fisch, Großwild, Hundeartiger, Insekt, Katzenartiger, Kleinwild, Reptil, Spinnentier, Vogel. Gegen Wesen, die den Typus Tier und diesen Typus aufweisen, erhält er einen Bonus in Höhe von 3 Punkten auf Angriffe. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.hunting.animaladept_reptile.desc=Der Abenteurer wählt einen der folgenden Typen aus: Bärenartiger, Fisch, Großwild, Hundeartiger, Insekt, Katzenartiger, Kleinwild, Reptil, Spinnentier, Vogel. Gegen Wesen, die den Typus Tier und diesen Typus aufweisen, erhält er einen Bonus in Höhe von 3 Punkten auf Angriffe. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.hunting.animaladept_spider.desc=Der Abenteurer wählt einen der folgenden Typen aus: Bärenartiger, Fisch, Großwild, Hundeartiger, Insekt, Katzenartiger, Kleinwild, Reptil, Spinnentier, Vogel. Gegen Wesen, die den Typus Tier und diesen Typus aufweisen, erhält er einen Bonus in Höhe von 3 Punkten auf Angriffe. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.hunting.animaladept_bird.desc=Der Abenteurer wählt einen der folgenden Typen aus: Bärenartiger, Fisch, Großwild, Hundeartiger, Insekt, Katzenartiger, Kleinwild, Reptil, Spinnentier, Vogel. Gegen Wesen, die den Typus Tier und diesen Typus aufweisen, erhält er einen Bonus in Höhe von 3 Punkten auf Angriffe. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.hunting.animaladept_fish.desc=Der Abenteurer wählt einen der folgenden Typen aus: Bärenartiger, Fisch, Großwild, Hundeartiger, Insekt, Katzenartiger, Kleinwild, Reptil, Spinnentier, Vogel. Gegen Wesen, die den Typus Tier und diesen Typus aufweisen, erhält er einen Bonus in Höhe von 3 Punkten auf Angriffe. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.hunting.tirelesschaser.desc=Es ist nur eine Frage der Zeit, bis der Jäger seine Beute gefunden hat. Beim Verfolgen von Spuren (siehe unten) benötigt er nur 1 Fortschrittspunkt pro Kilometer (nicht pro halbem Kilometer) Abstand.
mastership.hunting.hunter.desc=Der Jäger kennt Techniken, um die Haltbarkeit von Tierprodukten zu erhöhen. Produkte aus von ihm ausgeweideten Tieren haben automatisch verdreifachte Haltbarkeit.
mastership.hunting.skilledtracker.desc=Der Abenteurer kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seines Verstandes für die aktuelle Jagdkunst-Probe zu erhalten.
mastership.hunting.animalexpert_bear.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Tierkenner besitzt. Der Bonus erhöht sich auf 5. Tierexperte kann unter den Bedingungen wie Tierkenner mehrfach gewählt werden.
mastership.hunting.animalexpert_biggame.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Tierkenner besitzt. Der Bonus erhöht sich auf 5. Tierexperte kann unter den Bedingungen wie Tierkenner mehrfach gewählt werden.
mastership.hunting.animalexpert_canine.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Tierkenner besitzt. Der Bonus erhöht sich auf 5. Tierexperte kann unter den Bedingungen wie Tierkenner mehrfach gewählt werden.
mastership.hunting.animalexpert_feline.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Tierkenner besitzt. Der Bonus erhöht sich auf 5. Tierexperte kann unter den Bedingungen wie Tierkenner mehrfach gewählt werden.
mastership.hunting.animalexpert_insect.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Tierkenner besitzt. Der Bonus erhöht sich auf 5. Tierexperte kann unter den Bedingungen wie Tierkenner mehrfach gewählt werden.
mastership.hunting.animalexpert_smallgame.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Tierkenner besitzt. Der Bonus erhöht sich auf 5. Tierexperte kann unter den Bedingungen wie Tierkenner mehrfach gewählt werden.
mastership.hunting.animalexpert_reptile.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Tierkenner besitzt. Der Bonus erhöht sich auf 5. Tierexperte kann unter den Bedingungen wie Tierkenner mehrfach gewählt werden.
mastership.hunting.animalexpert_spider.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Tierkenner besitzt. Der Bonus erhöht sich auf 5. Tierexperte kann unter den Bedingungen wie Tierkenner mehrfach gewählt werden.
mastership.hunting.animalexpert_bird.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Tierkenner besitzt. Der Bonus erhöht sich auf 5. Tierexperte kann unter den Bedingungen wie Tierkenner mehrfach gewählt werden.
mastership.hunting.animalexpert_fish.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Tierkenner besitzt. Der Bonus erhöht sich auf 5. Tierexperte kann unter den Bedingungen wie Tierkenner mehrfach gewählt werden.
mastership.hunting.fasthunter.desc=Der Jäger ist besonders effizient, seine Proben zur Nahrungssuche benötigen nur 1 Stunde (statt 3).
mastership.hunting.chesthit_bear.desc=Der Abenteurer wählt eine Tierart, für die er die Meisterschaft Tierexperte besitzt. Alle Fernkampfangriffe, bei denen er mindestens 2 Ticks zielen kann, richten gegen diese Tierart 5 Punkte zusätzlichen Schaden an.
mastership.hunting.chesthit_biggame.desc=Der Abenteurer wählt eine Tierart, für die er die Meisterschaft Tierexperte besitzt. Alle Fernkampfangriffe, bei denen er mindestens 2 Ticks zielen kann, richten gegen diese Tierart 5 Punkte zusätzlichen Schaden an.
mastership.hunting.chesthit_canine.desc=Der Abenteurer wählt eine Tierart, für die er die Meisterschaft Tierexperte besitzt. Alle Fernkampfangriffe, bei denen er mindestens 2 Ticks zielen kann, richten gegen diese Tierart 5 Punkte zusätzlichen Schaden an.
mastership.hunting.chesthit_feline.desc=Der Abenteurer wählt eine Tierart, für die er die Meisterschaft Tierexperte besitzt. Alle Fernkampfangriffe, bei denen er mindestens 2 Ticks zielen kann, richten gegen diese Tierart 5 Punkte zusätzlichen Schaden an.
mastership.hunting.chesthit_insect.desc=Der Abenteurer wählt eine Tierart, für die er die Meisterschaft Tierexperte besitzt. Alle Fernkampfangriffe, bei denen er mindestens 2 Ticks zielen kann, richten gegen diese Tierart 5 Punkte zusätzlichen Schaden an.
mastership.hunting.chesthit_smallgame.desc=Der Abenteurer wählt eine Tierart, für die er die Meisterschaft Tierexperte besitzt. Alle Fernkampfangriffe, bei denen er mindestens 2 Ticks zielen kann, richten gegen diese Tierart 5 Punkte zusätzlichen Schaden an.
mastership.hunting.chesthit_reptile.desc=Der Abenteurer wählt eine Tierart, für die er die Meisterschaft Tierexperte besitzt. Alle Fernkampfangriffe, bei denen er mindestens 2 Ticks zielen kann, richten gegen diese Tierart 5 Punkte zusätzlichen Schaden an.
mastership.hunting.chesthit_spider.desc=Der Abenteurer wählt eine Tierart, für die er die Meisterschaft Tierexperte besitzt. Alle Fernkampfangriffe, bei denen er mindestens 2 Ticks zielen kann, richten gegen diese Tierart 5 Punkte zusätzlichen Schaden an.
mastership.hunting.chesthit_bird.desc=Der Abenteurer wählt eine Tierart, für die er die Meisterschaft Tierexperte besitzt. Alle Fernkampfangriffe, bei denen er mindestens 2 Ticks zielen kann, richten gegen diese Tierart 5 Punkte zusätzlichen Schaden an.
mastership.hunting.chesthit_fish.desc=Der Abenteurer wählt eine Tierart, für die er die Meisterschaft Tierexperte besitzt. Alle Fernkampfangriffe, bei denen er mindestens 2 Ticks zielen kann, richten gegen diese Tierart 5 Punkte zusätzlichen Schaden an.
mastership.hunting.efficienthunter.desc=Der Jäger kann ein Tier perfekt verwerten. Er erhält von einem Tier 50% mehr Nahrung und Beute (ausgenommen Einzelstücke wie das Horn eines Einhorns).
mastership.countrylore.fastreader.desc=Der Abenteurer kann besonders schnell lesen. Wenn er ein Schriftstück in Händen hält, kann er durch kurzes Überfliegen den Inhalt viermal so schnell erfassen wie andere (siehe auch die Regeln zur Recherche, GRW 149).
mastership.countrylore.giftedinlanguage.desc=Der Abenteurer hat ein gutes Gefühl für Fremdsprachen. Mit einer Probe auf Länderkunde (Schwierigkeit 25 bis 35 je nach Komplexität des Inhalts, Fremdartigkeit der Sprache und Verständlichkeit des Sprechers) kann er grundsätzliche Inhalte einer ihm unbekannten Sprache verstehen und entschlüsseln.
mastership.countrylore.polymath.desc=Der Gelehrte ist umfassend gebildet. Einmal pro Spielsitzung kann er eine Probe auf Länderkunde ablegen (Schwierigkeit 20), um vom Spielleiter eine obskure, aber nützliche Information zu einem passenden Thema zu erhalten.
mastership.countrylore.skilledscholar.desc=Der Abenteurer kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seines Verstandes für die aktuelle Länderkunde-Probe zu erhalten.
mastership.countrylore.goodeducation.desc=Der Abenteurer kann seine Gesellschaft mit seinem Wissen beeindrucken. Er erhält einen Bonus in Höhe von 3 Punkten auf Diplomatie und Redegewandtheit, wenn er in einer passenden Situation ist, mit seinem Wissen zu glänzen.
mastership.countrylore.philosopher.desc=Seine Kenntnis der Philosophie ermöglicht dem Abenteurer einen tiefen Einblick in das Verhalten seiner Mitmenschen. Er erhält einen Bonus in Höhe von 3 Punkten auf Empathie, wenn es darum geht, eine Person einzuschätzen.
mastership.countrylore.wayoftheworld.desc=Der Abenteurer hat gelernt, tiefe Geheimnisse zum Wesen der Welt auf andere Wissensgebieten anzuwenden. Er kann eine Länderkunde-Probe einsetzen, um Proben auf Arkane Kunde, Geschichte und Mythen oder Naturkunde zu unterstützen.
mastership.countrylore.handyknowledge.desc=Der Abenteurer findet Wege, sein umfangreiches Wissen praktisch umzusetzen. Einmal pro Spielsitzung kann er eine Probe auf Länderkunde (Schwierigkeit 20) machen. Er erhält einen Bonus in Höhe von 1 (+1 pro EG) auf eine anschließende passende Fertigkeitsprobe.
mastership.nature.alchemistsassistant.desc=Der Sammler ist besonders geschickt darin, Zutaten für alchemistische Produkte zu sammeln (siehe unten): Beim Sammeln von Zutaten beträgt der Aufschlag auf seine Schwierigkeit nur die halbe Qualität des Produkts (anstelle der vollen), und er benötigt nur Fortschrittspunkte in Höhe der halben Qualität.
mastership.nature.conservation.desc=Der Sammler kennt Techniken, um die Haltbarkeit von Kräutern zu erhöhen. Von ihm gesammelte Kräuter haben automatisch eine verdreifachte Haltbarkeit.
mastership.nature.hunter_bear.desc=Gegen Wesen, die den Typus Tier und den gewählten Typus besitzen, erhält er einen Bonus in Höhe von 3 Punkten auf alle Proben auf Naturkunde, Wahrnehmung, Jagdkunst und Heimlichkeit. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.nature.hunter_biggame.desc=Gegen Wesen, die den Typus Tier und den gewählten Typus besitzen, erhält er einen Bonus in Höhe von 3 Punkten auf alle Proben auf Naturkunde, Wahrnehmung, Jagdkunst und Heimlichkeit. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.nature.hunter_canine.desc=Gegen Wesen, die den Typus Tier und den gewählten Typus besitzen, erhält er einen Bonus in Höhe von 3 Punkten auf alle Proben auf Naturkunde, Wahrnehmung, Jagdkunst und Heimlichkeit. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.nature.hunter_feline.desc=Gegen Wesen, die den Typus Tier und den gewählten Typus besitzen, erhält er einen Bonus in Höhe von 3 Punkten auf alle Proben auf Naturkunde, Wahrnehmung, Jagdkunst und Heimlichkeit. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.nature.hunter_insect.desc=Gegen Wesen, die den Typus Tier und den gewählten Typus besitzen, erhält er einen Bonus in Höhe von 3 Punkten auf alle Proben auf Naturkunde, Wahrnehmung, Jagdkunst und Heimlichkeit. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.nature.hunter_smallgame.desc=Gegen Wesen, die den Typus Tier und den gewählten Typus besitzen, erhält er einen Bonus in Höhe von 3 Punkten auf alle Proben auf Naturkunde, Wahrnehmung, Jagdkunst und Heimlichkeit. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.nature.hunter_reptile.desc=Gegen Wesen, die den Typus Tier und den gewählten Typus besitzen, erhält er einen Bonus in Höhe von 3 Punkten auf alle Proben auf Naturkunde, Wahrnehmung, Jagdkunst und Heimlichkeit. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.nature.hunter_spider.desc=Gegen Wesen, die den Typus Tier und den gewählten Typus besitzen, erhält er einen Bonus in Höhe von 3 Punkten auf alle Proben auf Naturkunde, Wahrnehmung, Jagdkunst und Heimlichkeit. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.nature.hunter_bird.desc=Gegen Wesen, die den Typus Tier und den gewählten Typus besitzen, erhält er einen Bonus in Höhe von 3 Punkten auf alle Proben auf Naturkunde, Wahrnehmung, Jagdkunst und Heimlichkeit. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.nature.hunter_fish.desc=Gegen Wesen, die den Typus Tier und den gewählten Typus besitzen, erhält er einen Bonus in Höhe von 3 Punkten auf alle Proben auf Naturkunde, Wahrnehmung, Jagdkunst und Heimlichkeit. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss ein neuer Typus gewählt werden.
mastership.nature.enemy.desc=Der Abenteurer wählt eine bestimmte Art intelligenter Kreaturen aus (VER mindestens 2; Spielerrassen aus dem Grundregelwerk sind nicht wählbar). Gegen diese erhält er einen Bonus in Höhe von 3 Punkten auf Angriffe. Diese Meisterschaft kann mehrfach gewählt werden. Jedes Mal muss eine neue Art gewählt werden.
mastership.nature.masterhunter_bear.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Jäger besitzt. Der Bonus erhöht sich auf 5.\nMeisterjäger kann genau wie Jäger mehrfach gewählt werden.
mastership.nature.masterhunter_biggame.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Jäger besitzt. Der Bonus erhöht sich auf 5.\nMeisterjäger kann genau wie Jäger mehrfach gewählt werden.
mastership.nature.masterhunter_canine.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Jäger besitzt. Der Bonus erhöht sich auf 5.\nMeisterjäger kann genau wie Jäger mehrfach gewählt werden.
mastership.nature.masterhunter_feline.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Jäger besitzt. Der Bonus erhöht sich auf 5.\nMeisterjäger kann genau wie Jäger mehrfach gewählt werden.
mastership.nature.masterhunter_insect.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Jäger besitzt. Der Bonus erhöht sich auf 5.\nMeisterjäger kann genau wie Jäger mehrfach gewählt werden.
mastership.nature.masterhunter_smallgame.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Jäger besitzt. Der Bonus erhöht sich auf 5.\nMeisterjäger kann genau wie Jäger mehrfach gewählt werden.
mastership.nature.masterhunter_reptile.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Jäger besitzt. Der Bonus erhöht sich auf 5.\nMeisterjäger kann genau wie Jäger mehrfach gewählt werden.
mastership.nature.masterhunter_spider.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Jäger besitzt. Der Bonus erhöht sich auf 5.\nMeisterjäger kann genau wie Jäger mehrfach gewählt werden.
mastership.nature.masterhunter_bird.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Jäger besitzt. Der Bonus erhöht sich auf 5.\nMeisterjäger kann genau wie Jäger mehrfach gewählt werden.
mastership.nature.masterhunter_fish.desc=Der Abenteurer wählt einen Typus, für den er die Meisterschaft Jäger besitzt. Der Bonus erhöht sich auf 5.\nMeisterjäger kann genau wie Jäger mehrfach gewählt werden.
mastership.nature.fastforager.desc=Der Sammler ist besonders effizient. Seine Proben zum Suchen von Kräutern, Nahrung oder Zutaten benötigen nur 1 Stunde (statt 3).
mastership.nature.archenemy.desc=Der Abenteurer wählt eine Gruppe aus, für die er die Meisterschaft Feind besitzt. Der Bonus erhöht sich auf 5. Erzfeind kann nicht mehrfach gewählt werden.
mastership.nature.herbhag.desc=Der Sammler ist besonders geschickt darin, die Wirkung von Kräutern beim Sammeln zu bewahren. Seine Kräuter besitzen eine um 50% erhöhte Wirkung.
mastership.eloquence.distract.desc=Der Abenteurer hat gelernt, sich aus dem Kampf zu lösen (GRW 159), indem er seinen Gegner kurzzeitig ablenkt. Er kann zu diesem Zweck statt der üblichen Akrobatik-Probe eine Probe auf Redegewandtheit ablegen.
mastership.eloquence.taunt.desc=Der Abenteurer ist für seine scharfe Zunge berühmt und berüchtigt. Er würfelt eine vergleichende Probe auf Redegewandtheit gegen den Geistigen Widerstand seines Ziels. Diese kontinuierliche Aktion dauert 10 Ticks. Bei einem Erfolg verliert das Ziel die Beherrschung und erleidet einen Malus in Höhe von 1 Punkt (+1 pro Erfolgsgrad) auf alle nicht direkt gegen den Abenteurer gerichteten Proben in der Szene. Je nach Ziel kann sich der Abenteurer mit einer Duellforderung konfrontiert sehen.
mastership.eloquence.improviseddressup.desc=Der Abenteurer erhält keinen Malus, wenn er eine Verkleidung improvisieren muss.
mastership.eloquence.talentedlier.desc=Der Abenteurer kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seiner Ausstrahlung auf die aktuelle Redegewandtheit-Probe zu erhalten.
mastership.eloquence.notintheface.desc=Der Abenteurer kann seinen Gegner im Kampf verwirren. Gelingt ihm eine Redegewandtheit-Probe gegen den Geistigen Widerstand des Gegners, erhält dieser auf seinen Angriff gegen den Abenteurer einen Malus in Höhe von 1 Punkt (+1 pro Erfolgsgrad). Diese sofortige Reaktion dauert 3 Ticks.
mastership.eloquence.cover.desc=Der Abenteurer besitzt eine Identität, die er so gut beherrscht, dass er einen Bonus in Höhe von 5 Punkten auf alle Proben erhält, andere von seiner Identität zu überzeugen.
mastership.eloquence.wouldilietoyou.desc=Der Abenteurer schafft es mühelos, sich das Vertrauen anderer zu erschleichen. Für alle Proben zur sozialen Interaktion zählt die Einstellung von Spielleitercharakteren um eine Stufe besser.
mastership.eloquence.withoutwords.desc=Der Abenteurer kann auch ohne Worte und rein durch Gestik und Mimik seine Ziele und Wünsche deutlich machen, etwa wenn er nicht in der Lage oder willens ist zu sprechen oder wenn sein Gegenüber seine Sprache nicht versteht. Er kann den Umstand Nicht sprechen können ignorieren.
mastership.locksntraps.observant.desc=Der Abenteurer hat die Begabung, schnell seine Umgebung zu erfassen. Wenn er einen Raum betritt, kann er sofort eine Wahrnehmung-Probe (Schwierigkeit 20) ablegen. Sucht er später in diesem Raum nach Fallen, erhält er einen Bonus in Höhe von 1 Punkt (+1 pro Erfolgsgrad) auf das Entdecken.
mastership.locksntraps.improvisationartist.desc=Der Abenteurer erleidet keinen Abzug, wenn er versucht, ein Schloss (maximal ein gutes Schloss) mit improvisierten Hilfsmitteln zu knacken.
mastership.locksntraps.caution1.desc=Der Abenteurer geht vorsichtig vor. Gegen Fallen erhält er einen Bonus in Höhe von 3 Punkten auf seine Widerstandswerte und einen Bonus in Höhe von 3 Punkten auf Fertigkeitsproben, um etwaigen Effekten zu entgehen.
mastership.locksntraps.swiftpicklocks.desc=Der Abenteurer benötigt nur 10 Ticks, um eine Probe auf Schlösser und Fallen abzulegen.
mastership.locksntraps.goodreflexes.desc=Die Reflexe des Abenteurers sind durch den Umgang mit Fallen so geschult, dass sie ihm in anderen Situationen zugute kommen. Die Verteidigung des Abenteurers erhöht sich um 1.
mastership.locksntraps.lockhammer.desc=Mit Vorsicht hat der Abenteurer nicht viel am Hut. Er kann ein Schloss gewaltsam mit einem Bonus in Höhe von 3 Punkten öffnen. Dies dauert nur 5 Ticks. Danach ist das Schloss unbrauchbar und die Manipulation offensichtlich.\nDieser Trick funktioniert nur bei maximal guten Schlössern.
mastership.locksntraps.magictricks.desc=Der Abenteurer kennt sich gut mit magischen Fallen aus. Er erhält einen Bonus in Höhe von 3 Punkten auf das Entdecken und Entschärfen von magischen Fallen.
mastership.locksntraps.caution2.desc=Der Abenteurer setzt sich beim Entschärfen einer Falle geringerem Risiko aus. Er verliert bei einem Misserfolg nur 1 Erfolgsgrad. Die gesamte Probe scheitert erst, wenn er keine Erfolge mehr besitzt, nicht nach der ersten misslungenen Probe.
mastership.swim.workunderwater.desc=Handlungen unter Wasser erleiden normalerweise einen Malus in Höhe von 6 Punkten. Ein Abenteurer mit dieser Meisterschaft ist so geübt darin, dass er die Erschwernis für Nicht-Kampfhandlungen halbiert. Für Arbeit in hüfthohem Wasser kann er den Malus komplett ignorieren.
mastership.swim.riverdiver.desc=Der Schwimmer ist gut darin, besonders tief zu tauchen. Er erreicht beim Tauchen eine Tiefe von 4 m pro Fortschrittspunkt (statt 3 m).
mastership.swim.longdistanceswimmer.desc=Der Schwimmer erreicht beim Langstreckenschwimmen eine Strecke von 4 km pro Erfolgsgrad (statt 2 km).
mastership.swim.skilledswimmer.desc=Der Abenteurer kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seiner Stärke für die aktuelle Schwimmen-Probe zu erhalten.
mastership.swim.fightunderwater.desc=Kampfhandlungen unter Wasser sind normalerweise um 6 erschwert. Ein Abenteurer mit dieser Meisterschaft ist so geübt darin, dass er die Erschwernis für Kampfhandlungen halbiert. Beim Kampf in hüfthohem Wasser kann er den Malus komplett ignorieren.
mastership.swim.oceandiver.desc=Der Schwimmer erreicht beim Tauchen eine Tiefe von 5 m pro Fortschrittspunkt (statt 4 m).
mastership.swim.apnoe.desc=Der Schwimmer kennt Techniken, seinen Atemverbrauch zu minimieren und die Luft besonders lange anzuhalten. Beim Luft anhalten (gleich ob über Schwimmen oder über Zähigkeit) kann er pro Punkt Konstitution 90 Sekunden lang die Luft anhalten, die Schwierigkeit für weitere Proben steigt außerdem (beginnend bei 15) nur um 3 pro 10 Sekunden (nicht um 5 pro 10 Sekunden). Weiterhin kann ein Apnoe-Taucher beim Tauchen zusätzlich eine Anzahl von Proben in Höhe seiner Konstitution ablegen (also STÄ + KON + KON Proben).
mastership.swim.deepseadiver.desc=Der Schwimmer erreicht beim Tauchen eine Tiefe von 7 m pro Fortschrittspunkt (statt 5 m).
mastership.seafaring.sailorslegs.desc=roben, um das Gleichgewicht zu halten oder zu Balancieren, erhalten einen Bonus in Höhe von 3 Punkten.
mastership.seafaring.stargaze.desc=Der Abenteurer erhält, sofern die Sterne sichtbar sind, einen Bonus in Höhe von 3 Punkten auf alle Proben zur Orientierung.
mastership.seafaring.seadog.desc=Der Abenteurer erhält auf Überleben und Jagdkunst einen Bonus in Höhe von 3 Punkten, wenn er sich auf hoher See befindet.
mastership.seafaring.skilledsailor.desc=Der Abenteurer kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seiner Konstitution für die aktuelle Seefahrt-Probe zu erhalten.
mastership.seafaring.nutshellcaptain.desc=Der Abenteuer kann auf kaum noch fahrbaren Schiffen die Seefahrt-Abzüge durch Beschädigungen ignorieren.
mastership.seafaring.corsar.desc=Bei einer Verfolgungsjagd mit Schiffen und Booten erhält der Abenteurer automatisch 1 Fortschrittspunkt pro gelungener Probe zusätzlich.
mastership.seafaring.herooftheseas.desc=An Bord von Wasserfahrzeugen auf hoher See erhält der Abenteurer einen Bonus in Höhe von 1 Punkt auf Angriffe und Proben auf Akrobatik, Anführen, Diplomatie und Entschlossenheit.
mastership.seafaring.firmamentmymap.desc=Der Abenteurer kann eine Seefahrt-Probe gegen Schwierigkeit 30 ablegen, um zu wissen, wo ungefähr auf Lorakis er sich gerade befindet. Er kann mit freier Sicht auf den Nachthimmel ohne Seekarten navigieren.
mastership.streetlore.heargossip.desc=Der Abenteurer hat ein offenes Ohr für Gerüchte, die in einer Stadt umgehen, und vermag es, falsche von richtigen zu unterscheiden. Der Abenteurer erhält einen Bonus in Höhe von 3 Punkten, wenn er Straßenkunde einsetzt, um Gerüchte aufzuschnappen.
mastership.streetlore.gambler.desc=Der Abenteurer hat ein Händchen für Glücksspiele. Wenn er einen Würfelwurf macht (keine Probe, sondern ein reiner Zufallswurf, z.B. beim Münzwurf oder beim Würfelspiel), um ein Glücksspiel zu gewinnen, darf er zweimal würfeln und das bessere Ergebnis nutzen.
mastership.streetlore.blackmarket.desc=Der Abenteurer kennt sich damit aus, Diebesgut zu verkaufen oder illegale Dinge zu kaufen. Kauft oder verkauft er auf dem Schwarzmarkt, verändert er den Preis bei Gelingen um 10 % +10 % pro Erfolgsgrad statt um 5 % (siehe GRW 110)
mastership.streetlore.skilledstreetwalker.desc=Der Abenteurer kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seiner Intuition auf die aktuelle Straßenkunde-Probe zu erhalten.
mastership.streetlore.fittingtone.desc=Der Abenteurer nutzt seine Kenntnisse über die Unterwelt. Wenn er es mit zwielichtigen Personen zu tun hat, erhält der Abenteurer einen Bonus in Höhe von 3 Punkten auf Redegewandtheit und Diplomatie.
mastership.streetlore.athomeeverywhere.desc=Der Abenteurer kommt in fremden Städten gut zurecht. Er kann den Malus für unbekannte Städte ignorieren.
mastership.streetlore.tellgossip.desc=Der Abenteurer versteht es, Gerüchte aufzuschnappen und sie in die Welt zu setzen. Wenn er sich sechs Stunden Zeit nimmt und eine Straßenkunde-Probe gegen 30 ablegt, kann er ein beliebiges Gerücht in Umlauf bringen. \nEin solches Gerücht bleibt für etwa einen Tag (+1 pro Erfolgsgrad) bestehen, besonders absurde oder besonders plausible Gerüchte können sich nach Spielleiterentscheid auch deutlich kürzer oder länger halten.
mastership.streetlore.likemypocket.desc=In allen Städten, in denen der Abenteurer einen Schwerpunkt gewählt hat, erhält er einen Bonus in Höhe von 3 Punkten auf Fingerfertigkeit- und Heimlichkeit-Proben.
mastership.animals.dompteur.desc=Der Abenteurer ist in der Lage, domestizierten Tieren (Wesen mit Merkmal Kreatur) einfache Befehle und Verhaltensweisen beizubringen. Er kann sie, nachdem er sich mit ihnen vertraut gemacht und sie an sich gewöhnt hat, in einen Kampf oder auf die Jagd schicken und ihnen kleinere Tricks vermitteln.
mastership.animals.ridingfighter.desc=Der Abenteurer hat, wenn er vom Rücken seines Reittiers aus kämpft, immer einen Taktischen Vorteil. Außerdem kann er den zusätzlichen Schaden von Waffen mit dem Merkmal Reiterwaffe nutzen.
mastership.animals.estimateanimal.desc=Der Abenteurer verwendet eine kontinuierliche Aktion (10 Ticks), um eine Probe auf Tierführung gegen Schwierigkeit 20 gegen ein anwesendes Wesen des Typus Tier zu würfeln.\nGelingt dies, erhält er einen Bonus in Höhe von 1 Punkt (+1 pro Erfolgsgrad) auf Proben zur Besänftigung des Tieres. Das Tier erhält gleichzeitig dieselben Punkte als Malus auf Angriffe gegen den Abenteurer.
mastership.animals.beastmaster.desc=Der Abenteurer kann nun wilde Tiere (Wesen ohne Merkmal Kreatur aber mit Typus Tier) ausbilden und ihnen einfache Befehle vermitteln.
mastership.animals.warrider.desc=Wenn der Abenteurer im Kampf an der Reihe ist, kann er, anstatt selbst zu handeln, besondere Angriffe seines Reittiers als eigene Aktionen einsetzen.\nAußerdem kann er Waffen mit dem Merkmal Zweihändig vom Rücken seines Reittiers mit nur einer Hand vollumfänglich nutzen, sofern sie das Merkmal Reiterwaffe tragen.
mastership.animals.arenaveteran.desc=Bei Verfolgungsjagden mit Kutschen oder Streitwägen erhält der Abenteurer automatisch 1 zusätzlichen Fortschrittspunkt pro gelungener Probe.
mastership.animals.freehand.desc=Als Reiter oder Kutscher hat der Abenteuer erlernt, mit Schenkeldruck, Pfiffen, Befehlen und minimalen Einwirkungen seine Tiere zu lenken, sodass er beide Hände frei hat. Dadurch kann er Waffen mit dem Merkmal Zweihändig vom Rücken seines Reittiers aus einsetzen.
mastership.animals.twosoulsonethought.desc=Der Abenteurer kann sein Reittier eigenständig am Kampf teilnehmen lassen, während er weiterhin alle Vorteile der Meisterschaft Schlachtreiter genießt.
mastership.survival.terrainlore_forest.desc=Der Abenteurer kennt sich in einer bestimmten Art von natürlichem Gelände (Wald, Gebirge, Wüste etc.) gut aus. Er erhält einen Bonus in Höhe von 2 Punkten auf alle passenden Proben in diesem Gelände.
mastership.survival.terrainlore_desert.desc=Der Abenteurer kennt sich in einer bestimmten Art von natürlichem Gelände (Wald, Gebirge, Wüste etc.) gut aus. Er erhält einen Bonus in Höhe von 2 Punkten auf alle passenden Proben in diesem Gelände.
mastership.survival.terrainlore_mountain.desc=Der Abenteurer kennt sich in einer bestimmten Art von natürlichem Gelände (Wald, Gebirge, Wüste etc.) gut aus. Er erhält einen Bonus in Höhe von 2 Punkten auf alle passenden Proben in diesem Gelände.
mastership.survival.terrainlore_swamp.desc=Der Abenteurer kennt sich in einer bestimmten Art von natürlichem Gelände (Wald, Gebirge, Wüste etc.) gut aus. Er erhält einen Bonus in Höhe von 2 Punkten auf alle passenden Proben in diesem Gelände.
mastership.survival.terrainlore_grassland.desc=Der Abenteurer kennt sich in einer bestimmten Art von natürlichem Gelände (Wald, Gebirge, Wüste etc.) gut aus. Er erhält einen Bonus in Höhe von 2 Punkten auf alle passenden Proben in diesem Gelände.
mastership.survival.terrainlore_ocean.desc=Der Abenteurer kennt sich in einer bestimmten Art von natürlichem Gelände (Wald, Gebirge, Wüste etc.) gut aus. Er erhält einen Bonus in Höhe von 2 Punkten auf alle passenden Proben in diesem Gelände.
mastership.survival.terrainlore_ice.desc=Der Abenteurer kennt sich in einer bestimmten Art von natürlichem Gelände (Wald, Gebirge, Wüste etc.) gut aus. Er erhält einen Bonus in Höhe von 2 Punkten auf alle passenden Proben in diesem Gelände.
mastership.survival.terrainlore_jungle.desc=Der Abenteurer kennt sich in einer bestimmten Art von natürlichem Gelände (Wald, Gebirge, Wüste etc.) gut aus. Er erhält einen Bonus in Höhe von 2 Punkten auf alle passenden Proben in diesem Gelände.
mastership.survival.terrainlore_faerie.desc=Der Abenteurer kennt sich in einer bestimmten Art von natürlichem Gelände (Wald, Gebirge, Wüste etc.) gut aus. Er erhält einen Bonus in Höhe von 2 Punkten auf alle passenden Proben in diesem Gelände.
mastership.survival.terrainlore_caves.desc=Der Abenteurer kennt sich in einer bestimmten Art von natürlichem Gelände (Wald, Gebirge, Wüste etc.) gut aus. Er erhält einen Bonus in Höhe von 2 Punkten auf alle passenden Proben in diesem Gelände.
mastership.survival.terrainlore_tundra.desc=Der Abenteurer kennt sich in einer bestimmten Art von natürlichem Gelände (Wald, Gebirge, Wüste etc.) gut aus. Er erhält einen Bonus in Höhe von 2 Punkten auf alle passenden Proben in diesem Gelände.
mastership.survival.meteologist.desc=Der Naturkundige ist besonders gut darin, das Wetter vorherzusagen. Bei einer gelungenen Vorhersage kann er das Wetter statt nach den üblichen Regeln für 2 Tage grob bestimmen (+1 Tag pro Erfolgsgrad).
mastership.survival.wildernessrunner.desc=Die Reisegeschwindigkeit des Abenteurers erhöht sich außerhalb von ausgebauten Straßen um 20 %. Dies gilt auch für eine Gruppe, die er führt.
mastership.survival.costsavingjourney.desc=Bei der Reduzierung von Reisekosten (siehe GRW 152) kann der Wildniskundige pro Punkt 10 % anstatt 5 % von den endgültigen Kosten abziehen.
mastership.survival.cleverleader.desc=Der Wildniskundige ist gut darin, Gefahren und Hindernisse rechtzeitig zu erkennen. Bei einer gelungenen Probe zur Wildnisführung (siehe GRW 153) kostet es ihn nur 1 EG (statt 2), um die Ereigniskategorie zu beeinflussen, und er kann die Kategorie um bis zu 2 Stufen verändern.
mastership.survival.weatherproof.desc=Der Wildniskundige ist besonders geschickt darin, ein wetterfestes Lager zu errichten. Seine Lager werden nie überschwemmt und er ignoriert Erschwernisse durch schlechtes Wetter bei der Lagersuche.
mastership.survival.perfectorientation.desc=Der Wildniskundige hat einen sechsten Sinn für Richtungen. Alle Proben zur Orientierung erhalten einen Bonus in Höhe von 6 Punkten.
mastership.survival.shadowwalker.desc=Der Wildniskundige ist ein Phantom, ein Schatten zwischen den Bäumen, der ungesehen umherstreift. Wenn der Abenteurer einen Lagerplatz bereitet, erhält jede Probe, um das Lager zu entdecken, automatisch einen Malus in Höhe von 3 Punkten.
mastership.perception.perfecthearing.desc=Der Abenteurer ist in der Lage, die Höhe eines gehörten Tons unfehlbar zu bestimmen. Dadurch erhält er einen Bonus in Höhe von 3 Punkten auf alle Darbietung-Proben zum Musizieren und Singen.
mastership.perception.perfecttaste.desc=Der Abenteurer kann Geschmäcker perfekt voneinander unterscheiden. Dies gibt ihm nicht nur einen Bonus in Höhe von 3 Punkten auf Wahrnehmung-Proben zum Erkennen von Gift im Essen, sondern auf alle Proben zum Zubereiten von Nahrung.
mastership.perception.surroundingsenses_city.desc=Der Abenteurer kennt Sinneswahrnehmungen einer bestimmten Umgebung (Stadt, Wald, Steppe, Wüste, Sumpf etc.) besonders gut. In einer solchen Umgebung erhält er einen Bonus in Höhe von 3 Punkten auf Wahrnehmung-Proben, da er genau weiß, worauf er achten muss.
mastership.perception.surroundingsenses_forest.desc=Der Abenteurer kennt Sinneswahrnehmungen einer bestimmten Umgebung (Stadt, Wald, Steppe, Wüste, Sumpf etc.) besonders gut. In einer solchen Umgebung erhält er einen Bonus in Höhe von 3 Punkten auf Wahrnehmung-Proben, da er genau weiß, worauf er achten muss.
mastership.perception.surroundingsenses_mountain.desc=Der Abenteurer kennt Sinneswahrnehmungen einer bestimmten Umgebung (Stadt, Wald, Steppe, Wüste, Sumpf etc.) besonders gut. In einer solchen Umgebung erhält er einen Bonus in Höhe von 3 Punkten auf Wahrnehmung-Proben, da er genau weiß, worauf er achten muss.
mastership.perception.surroundingsenses_swamp.desc=Der Abenteurer kennt Sinneswahrnehmungen einer bestimmten Umgebung (Stadt, Wald, Steppe, Wüste, Sumpf etc.) besonders gut. In einer solchen Umgebung erhält er einen Bonus in Höhe von 3 Punkten auf Wahrnehmung-Proben, da er genau weiß, worauf er achten muss.
mastership.perception.surroundingsenses_grassland.desc=Der Abenteurer kennt Sinneswahrnehmungen einer bestimmten Umgebung (Stadt, Wald, Steppe, Wüste, Sumpf etc.) besonders gut. In einer solchen Umgebung erhält er einen Bonus in Höhe von 3 Punkten auf Wahrnehmung-Proben, da er genau weiß, worauf er achten muss.
mastership.perception.surroundingsenses_ice.desc=Der Abenteurer kennt Sinneswahrnehmungen einer bestimmten Umgebung (Stadt, Wald, Steppe, Wüste, Sumpf etc.) besonders gut. In einer solchen Umgebung erhält er einen Bonus in Höhe von 3 Punkten auf Wahrnehmung-Proben, da er genau weiß, worauf er achten muss.
mastership.perception.surroundingsenses_jungle.desc=Der Abenteurer kennt Sinneswahrnehmungen einer bestimmten Umgebung (Stadt, Wald, Steppe, Wüste, Sumpf etc.) besonders gut. In einer solchen Umgebung erhält er einen Bonus in Höhe von 3 Punkten auf Wahrnehmung-Proben, da er genau weiß, worauf er achten muss.
mastership.perception.surroundingsenses_faerie.desc=Der Abenteurer kennt Sinneswahrnehmungen einer bestimmten Umgebung (Stadt, Wald, Steppe, Wüste, Sumpf etc.) besonders gut. In einer solchen Umgebung erhält er einen Bonus in Höhe von 3 Punkten auf Wahrnehmung-Proben, da er genau weiß, worauf er achten muss.
mastership.perception.surroundingsenses_desert.desc=Der Abenteurer kennt Sinneswahrnehmungen einer bestimmten Umgebung (Stadt, Wald, Steppe, Wüste, Sumpf etc.) besonders gut. In einer solchen Umgebung erhält er einen Bonus in Höhe von 3 Punkten auf Wahrnehmung-Proben, da er genau weiß, worauf er achten muss.
mastership.perception.surroundingsenses_ocean.desc=Der Abenteurer kennt Sinneswahrnehmungen einer bestimmten Umgebung (Stadt, Wald, Steppe, Wüste, Sumpf etc.) besonders gut. In einer solchen Umgebung erhält er einen Bonus in Höhe von 3 Punkten auf Wahrnehmung-Proben, da er genau weiß, worauf er achten muss.
mastership.perception.skilledscout.desc=Der Abenteurer kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seiner Intuition für die aktuelle Wahrnehmung-Probe zu erhalten.
mastership.perception.quicksearch.desc=Der Abenteurer kann mit einem Blick einen ganzen Raum erfassen. Er benötigt nur 5 Minuten (statt 10) für eine Probe zur Durchsuchung.
mastership.perception.changedsurrounding.desc=Der Abenteurer nimmt kleinste Veränderungen in der Umgebung wahr, beispielsweise, ob jemand in seiner Abwesenheit etwas im Zimmer verändert hat. Kommt er in eine entsprechende Situation, steht ihm automatisch eine Wahrnehmung-Probe (Schwierigkeit 25) zu, um zu bemerken, was verändert wurde.
mastership.perception.nobodywashere.desc=Der Abenteurer kann eine Durchsuchung so ausführen, dass man kaum bemerkt, dass jemand hier war. Wenn er sich für die Durchsuchung doppelt so lange Zeit nimmt, erleiden alle Proben (auch die automatische aus Veränderte Umgebung), um die Untersuchung zu bemerken, einen Malus in Höhe von 6 Punkten.
mastership.perception.warning.desc=Der Abenteurer verfügt über einen Sinn für Gefahren. Wenn ihm eine Wahrnehmung-Probe (Schwierigkeit 25) gelingt, kann er bei einem Hinterhalt rechtzeitig reagieren, ohne überrascht zu werden.
mastership.endurance.armour1.desc=Der Abenteurer ist es gewohnt, sich in schwerer Rüstung zu bewegen. Die Behinderung von Rüstung ist um 1 reduziert.
mastership.endurance.quickupagain.desc=Der Abenteurer regeneriert Schadenspunkte schneller. Immer wenn er durch eine Ruhephase Lebenspunkte zurück erhält, bekommt ein Abenteurer mit dieser Meisterschaft 1 zusätzlichen Punkt.
mastership.endurance.shield1.desc=Die Behinderung eines Schildes ist für den Abenteurer um 1 Punkt gesenkt.
mastership.endurance.alertness.desc=Der Abenteurer kann ohne Probleme eine Nacht wach bleiben und zum Beispiel Wache schieben. Erst bei einer weiteren Nacht ohne Schlaf muss er eine Zähigkeit-Probe ablegen.
mastership.endurance.armour2.desc=Der Abenteurer kann sich noch besser in schwerer Rüstung bewegen. Jeder durch Rüstung erhaltene Tick-Zuschlag ist um 1 reduziert.
mastership.endurance.shield2.desc=Der Tick-Zuschlag eines Schildes ist für den Abenteurer um 1 Tick gesenkt.
mastership.endurance.resistpain1.desc=Der Abenteurer kann Schmerzen ignorieren. Wundabzüge (siehe GRW 172) sind für ihn stets um 1 Punkt verringert.
mastership.endurance.quickshielddefense.desc=Wenn der Abenteurer einen Schild führt, benötigt er für eine Aktive Abwehr mit diesem nur noch 2 Ticks.
mastership.endurance.sturdyhead.desc=Der Abenteurer ist so abgehärtet, dass er schnell wieder zu sich kommt. Die Dauer der Zustände Benommen und Bewusstlos ist für ihn halbiert. Außerdem benötigt er nur 15 Minuten (statt die 30 Minuten der Verschnaufpause), um eine Stufe des Zustands Erschöpft abzubauen.
mastership.endurance.resistpain2.desc=Der Abenteurer ist noch stärker daran gewöhnt, Schmerzen ohne Murren zu ertragen. Wundabzüge (siehe S. 172) sind für ihn stets um 1 weiteren Punkt verringert.
mastership.focuscontrol.desc=Der Zauberer hat es gelernt, seine Kraft so gezielt einzusetzen, dass das Risiko gefährlicher Fehlschläge reduziert wird. Wenn er beim Zaubern einen verheerenden Misserfolg bzw. einen Patzer würfelt, kann er in der Tabelle für Verheerende Zauberauswirkungen eine Stufe abziehen. Sollte er dadurch unter die niedrigste Stufe fallen, entfallen die Auswirkungen aus der Tabelle.
mastership.castershand.desc=Der Zauberer kann Sprüche der jeweiligen Schule, die eigentlich nur Reichweite Zauberer haben, per Berührung auf ein anderes freiwilliges Wesen sprechen. Hierfür fallen keine zusätzlichen Kosten an.
mastership.savingcaster.desc=Der Zauberer erschöpft oder kanalisiert für Zauber der jeweiligen Schule immer 1 Punkt weniger als angegeben. Die Mindestkosten betragen 1 Punkt.
mastership.magiccrafter.desc=Der Zauberer kann Strukturgeber der jeweiligen Schule der Artefaktqualität 1 und 2 herstellen und reparieren. Mehr zu Strukturgebern finden Sie auf GRW 254
mastership.delayedcaster.desc=Der Zauberer ist in der Lage, einen fertig vorbereiteten Zauber bereitzuhalten, ohne die fokussierte Magie zu verlieren. Er kann das Auslösen des Zaubers bis zu 15 Ticks herauszögern und kann in diesem Zeitraum auch laufen. Spätestens nach diesen 15 Ticks muss er den Zauber auslösen oder die fokussierte Magie aufgeben.
mastership.nothinghappend.desc=Der Zauberer hat eine so gute Kontrolle über seinen Fokus, dass das Risiko gefährlicher Fehlschläge noch weiter reduziert wird. Wenn er beim Zaubern einen verheerenden Misserfolg bzw. einen Patzer würfelt, kann er in der Tabelle für Verheerende Zauberauswirkungen eine weitere Stufe abziehen. Sollte er dadurch unter die niedrigste Stufe fallen, entfallen die Auswirkungen aus der Tabelle.
mastership.wondercrafter.desc=Der Zauberer kann Strukturgeber der jeweiligen Schule der Artefaktqualität 3 und 4 herstellen und reparieren.
mastership.relicmaster.desc=Der Zauberer kann Strukturgeber der jeweiligen Schule der Artefaktqualität 5 und 6 herstellen und reparieren.
mastership.casterseye.desc=Der Zauberer kann Sprüche der jeweiligen Schule, die eigentlich nur Reichweite Berührung haben, auf maximal 5 m Entfernung sprechen. Dies verlängert die Zauberdauer um 5 Ticks und verursacht zusätzliche Fokuskosten in Höhe von (K)4V2 Punkten. Sprüche, die nur über die Meisterschaft Hand des Zauberers auf Berührung gewirkt werden können, sind von dieser Meisterschaft nicht betroffen.
mastership.antimagic.wardinghand.desc=Der Zauberer kann anhaltende Zaubereffekte mit geringer Mühe bannen. Seine erschöpften Fokuspunkten für das Wirken von Bannzaubern des Typus Zauber brechen sind um 2 Punkte verringert (Minimum 1).
mastership.antimagic.hurriedidentify.desc=Die sofortige Reaktion zum Identifizieren von Zaubern dauert für den Zauberer nur 1 Tick (statt wie üblich 2 Ticks).
mastership.antimagic.wardingexpert.desc=Der Zauberer ist geübt darin, Zauberwirkungen zu erkennen. Er erhält einen Bonus in Höhe von 3 Punkten auf alle Arkane Kunde-Proben, die dem Identifizieren eines bereits gewirkten Zaubers dienen.
mastership.antimagic.countermagic.desc=Der Bannmagier ist in der Lage, schon frühzeitig zu erkennen, welche Zauber seine Gegner wirken. Er erhält einen Bonus in Höhe von 3 Punkten auf alle Arkane Kunde-Proben, die dem Identifizieren eines Zaubers dienen, für den gerade Magie fokussiert wird.
mastership.antimagic.knowledgeispower.desc=Der Bannmagier erhält einen Bonus in Höhe von 3 Punkten auf direkt gegen gegnerische Zauber gerichtete Bannzauber, wenn der entsprechende Zauber zuvor identifiziert wurde.
mastership.antimagic.quickreaction.desc=Die Auslösezeit für Bannzauber des Zauberers sinkt um 2 Ticks.
mastership.combatmagic.ironconcentration.desc= Muss der Zauberer im Falle einer Störung beim Zaubervorgang eine Entschlossenheit-Probe ablegen, erhält er einen Bonus in Höhe von 3 Punkten. Dieser Bonus gilt auch bei Proben zur Abwehr des Abbruchs kanalisierter Zauber bei Überschreiten der unteren Gesundheitsstufen.
mastership.combatmagic.distancecaster.desc=Die Grundreichweite aller Kampfzauber wird verdoppelt.
mastership.combatmagic.projectilemagic.desc=Der Zauberer kann einen Kampfzauber des Typus Schaden bis Grad 2 an ein Geschoss (Pfeile, Bolzen oder Wurfwaffen) binden (max. ein Zauber pro Geschoss). Der Zauber wird erst bei Auftreffen des Geschosses gegen das getroffene Ziel ausgelöst. Die Zauberprobe (gegen eine Schwierigkeit von 18 + dreifacher Zaubergrad) ist bei Verzaubern des Geschosses nötig, dafür muss das Geschoss die komplette Dauer über berührt werden. Pro verzaubertem Geschoss müssen zusätzliche Kosten in Höhe von K2 aufgewendet werden. Das Geschoss bleibt so lange verzaubert, wie es nach den Regeln für kanalisierte Zauber der Fall wäre, maximal jedoch bis zum Aufprall. Die Regel zur maximalen Wirkungsweite kanalisierter Zauber (S. 195) gilt für mit dieser Meisterschaft verzauberte Geschosse im Rahmen des Abschusses nicht.
mastership.combatmagic.aimedspells.desc=Der Zauberer kann die Modifikatoren für Angriffe ins Kampfgetümmel (GRW 162) bei Zaubern ignorieren.
mastership.combatmagic.destroyerheart.desc=Von dem Zauberer angerichteter Schaden ist besonders zerstörerisch. Alle Kampfzauber des Typus Schaden erhalten einen Schadensbonus in Höhe von 1 Punkt.
mastership.combatmagic.steelconcentration.desc=Erhält der Zauberer Wundabzüge, erleidet er für alle Zauberproben nur Abzüge der nächstniedrigeren Gesundheitsstufe.
mastership.combatmagic.veteranofmelee.desc= Der Zauberer hat gelernt, seine Magie zu wirken, ohne dabei seine Deckung fallen zu lassen. Wenn er Magie für einen Zauber fokussiert, löst er damit niemals Gelegenheitsangriffe aus.
mastership.combatmagic.bloodbath.desc= Anstatt nur ein einziges Wesen oder Objekt zu treffen, können die Kampfzauber des Zauberers gegen mehrere Ziele wirken. Der Zauber wird wie üblich gegen ein Ziel gewirkt. EG aus dem Zauber können jedoch eingesetzt werden, um statt der üblichen Anwendungen pro EG ein weiteres Ziel zu treffen. Hierfür sind nur Ziele wählbar, die maximal einen so hohen entsprechenden Widerstandswert wie das Primärziel haben. Auch die Sekundärziele können eine Aktive Abwehr ablegen. Der Zauberer muss für jedes Ziel Kosten in Höhe der Zauberkosten aufbringen, die zusätzlichen Kosten jedoch nur erschöpfen, niemals verzehren. Zusätzliche EG für Verstärkung oder Erhöhung des Schadens können nur gegen das Primärziel genutzt werden.
mastership.windmagic.stormvoice.desc=Die Stimme des Zauberers trägt auf Wunsch und durch Einsatz von 2 erschöpften Fokuspunkten für 5 Minuten besonders weit und erklingt besonders laut. Auf diese Art kann er beispielsweise weit entfernten Gefährten etwas zurufen oder eine donnernde Ansprache halten.
mastership.windmagic.weatherexpert.desc=Der Zauberer erhält einen Bonus in Höhe von 6 Punkten auf Proben zur Vorhersage des Wetters.
mastership.windmagic.windresistence1.desc= Der Zauberer ist weniger empfindlich gegen Schaden durch Wind, Blitze und Luft (oder das Fehlen davon). Jeglicher entsprechender Schaden (Elektrizitätsschaden, Windschaden, Stürme) wird um 2 Punkte reduziert.
mastership.windmagic.windghostmaster.desc= Der Abenteurer erhält einen Bonus in Höhe von 3 Punkten auf Windzauber der Typen Beschwörung und Wesen bannen sowie auf die Interaktion mit Kreaturen des Typus Windwesen.
mastership.windmagic.windmastery.desc= Windmeisterschaft: Der Zauberer erhält einen Bonus in Höhe von 2 Punkten auf Windzauber, die gegen den Körperlichen Widerstand oder die Verteidigung gerichtet sind.
mastership.windmagic.windresistence2.desc=Der Zauberer ist weniger empfindlich gegen Schaden durch Wind, Blitze und Luft (oder das Fehlen davon). Jeglicher entsprechender Schaden (Elektrizitätsschaden, Windschaden, Stürme) wird um insgesamt 4 Punkte reduziert.
mastership.windmagic.weathermaster.desc=Der Zauberer kann negative Umstände und sonstige Mali, die durch schlechtes Wetter entstehen (z.B. Sturmböen beim Bogenschießen oder ein Unwetter bei der Lagerplatzsuche) vollständig ignorieren.
mastership.windmagic.windresistence3.desc=Der Zauberer ist weniger empfindlich gegen Schaden durch Wind, Blitz und Luft (oder das Fehlen davon). Jeglicher entsprechender Schaden (Elektrizitätsschaden, Windschaden, Stürme) wird um insgesamt 6 Punkte reduziert.
mastership.stonemagic.earthaffinity.desc=Die Verteidigung und der körperliche Widerstand des Abenteurers erhalten einen Bonus in Höhe von 2 Punkten gegen Versuche, ihn zu Fall zu bringen oder ihn gegen seinen Willen zu bewegen.
mastership.stonemagic.stoneresistence1.desc= Der Zauberer ist weniger empfindlich gegen Schaden durch Steine und Felsen. Jeglicher entsprechende Schaden (z.B. Felsschaden durch Zauber, Steinschlag, Sturz auf Felsen) wird um 2 Punkte reduziert.
mastership.stonemagic.mastersmith.desc= Der Abenteurer erhält einen Bonus in Höhe von 2 Punkten auf Proben zur Bearbeitung von Metallen, Gestein und Edelsteinen.
mastership.stonemagic.stonemastership.desc=Der Zauberer erhält einen Bonus in Höhe von 2 Punkten auf Felszauber, die gegen den Körperlichen Widerstand oder die Verteidigung gerichtet sind.
mastership.stonemagic.stoneresistence2.desc=Der Zauberer ist weniger empfindlich gegen Schaden durch Steine und Felsen. Jeglicher entsprechende Schaden (z.B. Felsschaden durch Zauber, Steinschlag) wird um insgesamt 4 Punkte reduziert.
mastership.stonemagic.masterofstoneghosts.desc=Der Abenteurer erhält einen Bonus in Höhe von 3 Punkten auf Felszauber der Typen Beschwörung und Wesen bannen sowie auf Proben zur Interaktion mit Kreaturen des Typus Felswesen.
mastership.stonemagic.stoneresistence3.desc= Der Zauberer ist weniger empfindlich gegen Schaden durch Steine und Felsen. Jeglicher entsprechende Schaden (z.B. Felsschaden durch Zauber, Steinschlag) wird um insgesamt 6 Punkte reduziert.
mastership.stonemagic.masterofstone.desc=Der Abenteurer erhält einen Bonus in Höhe von 1 Punkt auf Angriffe und Schaden, solange er und sein Gegner sich auf felsigem oder steinigem Boden (egal ob natürlich oder künstlich) befinden.
mastership.enhancemagic.magicsymbols.desc= Der Zauberer kennt die Geheimnisse, wie er durch magische Zeichen seine Stärkungsmagie verbessern kann. Wenn er entsprechende Zeichen auf ein Objekt oder eine Person aufträgt, sinken die Kosten an erschöpften Fokuspunkten für passende Stärkungszauber um 3V1 oder die Kosten an kanalisierten Fokuspunkten um K2V1. Die Mindestkosten betragen einen erschöpften oder kanalisierten Fokuspunkt. Die Zauberdauer des Zaubers erhöht sich um 2 Minuten.
mastership.enhancemagic.overload.desc=Der Zauberer kann einen kanalisierten Stärkungszauber kurzfristig verstärken. Dies erfordert eine Reaktion mit 1 Tick Dauer. Anschließend erhält der kanalisierte Zauber automatisch und ohne weitere Kosten die verstärkte Wirkung, bricht aber nach 15 Ticks ab.
mastership.enhancemagic.forcetransmission.desc=Der Zauberer kann beim Zaubervorgang kanalisierte Stärkungszauber auf bis zu WIL Gefährten ausdehnen, indem er pro weiterer Person zusätzliche Fokuspunkte (in Höhe der Zauberkosten) kanalisiert und gegebenenfalls verzehrt.
mastership.enhancemagic.ownadvantage.desc=Wenn der Zauberer einen Stärkungszauber auf eine andere Person spricht, kann er den gleichen Zauber ohne jede Mehrkosten und ohne weitere Probe mit halber Wirkung auch auf sich selbst legen. Voraussetzung: Meisterschaft Hand des Zauberers in Stärkungsmagie, Meisterschaft Übertragung der Kraft
mastership.enhancemagic.concentratedfocus.desc=Wenn der Zauberer Stärkungszauber durch Übertragung der Kraft oder Große Übertragung der Kraft auf mehrere Personen spricht, muss er für jede Person nach der ersten nur die halben Kosten aufwenden.
mastership.enhancemagic.banishingprotection.desc=Der Zauberer kann während des Zaubervorgangs durch Verzehren eines Fokuspunktes einen Zauber unempfindlicher gegen Zauber der Bannmagie machen. Bannzauber gegen seine entsprechenden Stärkungszauber erhalten einen Malus in Höhe seiner Willenskraft.
mastership.enhancemagic.greatforcetransmission.desc=Der Zauberer kann statt der Auswirkung der Meisterschaft Übertragung der Kraft beim Zaubervorgang Stärkungszauber auf bis zu (2 x WIL) Gefährten ausdehnen, indem er pro weiterer Person zusätzliche Fokuspunkte (in Höhe der Zauberkosten) kanalisiert. Verzehrte Punkte fallen für die zusätzlichen Ziele nicht an.
mastership.firemagic.artisan.desc=Der Zauberer erhält einen Bonus in Höhe von 3 Punkten auf alle Proben, um ein Feuer auf profanem Weg zu entzünden und zu löschen oder um zu verhindern, selber in Brand zu geraten. Sollte er den Zustand Brennend (GRW 168) abschütteln wollen, dauert die entsprechende kontinuierliche Handlung für ihn nur 5 Ticks.
mastership.firemagic.fireresistence1.desc=Der Feuerzauberer ist weniger empfindlich gegen Feuer. Jeglicher Feuerschaden wird um 2 Punkte reduziert.
mastership.firemagic.flameheart.desc=Von dem Feuerzauberer beschworenes Feuer brennt besonders heiß. Alle Feuerzauber des Typus Schaden verursachen 1 zusätzlichen Punkt Feuerschaden.
mastership.firemagic.firemastery.desc=Der Zauberer erhält einen Bonus in Höhe von 2 Punkten auf Feuerzauber, die gegen den Körperlichen Widerstand oder die Verteidigung gerichtet sind.
mastership.firemagic.fireresistence2.desc=Der Feuerzauberer ist weniger empfindlich gegen Feuer. Jeglicher Feuerschaden wird um insgesamt 4 Punkte reduziert.
mastership.firemagic.masteroffireghosts.desc=Der Zauberer erhält einen Bonus in Höhe von 3 Punkten auf Feuerzauber der Typen Beschwörung und Wesen bannen sowie auf die Interaktion mit Kreaturen des Typus Feuerwesen.
mastership.firemagic.fireresistence3.desc=Der Feuerzauberer ist weniger empfindlich gegen Feuer. Jeglicher Feuerschaden wird um insgesamt 6 Punkte reduziert.
mastership.firemagic.inferno.desc=Feuerzauber des Zauberers ignorieren bis zu 4 Punkte Schadensreduktion der Ziele.
mastership.watermagic.detox.desc=Der Zauberer ist in der Lage, eingenommene Gifte durch das Trinken von ausreichend Wasser zu schwächen. Nimmt er ein Gift über die Nahrung auf und trinkt anschließend mindestens 3 Liter Wasser, wird die Wirkungsdauer von Giften halbiert.
mastership.watermagic.wavechild.desc=Der Zauberer erhält einen Bonus in Höhe von 2 Punkten auf seine Geschwindigkeit beim Schwimmen.
mastership.watermagic.resistwater1.desc=Der Zauberer ist weniger empfindlich gegen Schaden durch Wasser, Säure und Kälte. Jeglicher Kälteschaden, Säureschaden und Wasserschaden wird um 2 Punkte reduziert.
mastership.watermagic.masterwaterelem.desc=Der Abenteurer erhält einen Bonus in Höhe von 3 Punkten auf Wasserzauber der Typen Beschwörung und Wesen bannen sowie auf die Interaktion mit Kreaturen des Typus Wasserwesen.
mastership.watermagic.watermastery.desc=Der Zauberer erhält einen Bonus in Höhe von 2 Punkten auf Wasserzauber, die gegen den Körperlichen Widerstand oder die Verteidigung gerichtet sind.
mastership.watermagic.resistwater2.desc=Der Zauberer ist weniger empfindlich gegen Schaden durch Wasser, Säure und Kälte. Jeglicher Kälteschaden, Säureschaden und Wasserschaden wird um insgesamt 4 Punkte reduziert.
mastership.watermagic.masterwaves.desc=Der Abenteurer kann sich mit seiner vollen Geschwindigkeit im Wasser bewegen. Außerdem kann er bis zu 5 Minuten am Stück unter Wasser atmen.
mastership.watermagic.resistwater3.desc=Der Zauberer ist weniger empfindlich gegen Schaden durch Wasser, Säure und Kälte. Jeglicher Kälteschaden, Säureschaden und Wasserschaden wird um insgesamt 6 Punkte reduziert.
mastership.shadowmagic.darknessview.desc=Der Zauberer ist an die Dunkelheit seiner eigenen Zauber gewöhnt. Er kann sie jederzeit durchblicken und nimmt entsprechend durch sie nie Abzüge durch die Lichtverhältnisse in Kauf.
mastership.shadowmagic.shadowmaster.desc=Vom Zauberer gewirkte Schattenzauber des Typus Verhüllung verschlechtern die Lichtverhältnisse immer um eine Stufe mehr als angegeben.
mastership.shadowmagic.shadowchild.desc=Solange die Lichtverhältnisse um den Zauberer Dämmerlicht oder schlechter entsprechen, erhält er einen Bonus in Höhe von 3 Punkten auf das Wirken von Schattenmagie.
mastership.shadowmagic.protectingshadows.desc= Der Zauberer wird von der Kraft der Schatten vor der Magie des Lichtes geschützt. Er erhält einen Bonus in Höhe von 3 Punkten auf alle Widerstandswerte gegen Lichtmagie.
mastership.shadowmagic.nightvision.desc=Die Abzüge des Zauberers durch Lichtverhältnisse sind um 2 Stufen verringert.
mastership.naturemagic.naturesong.desc=Der Abenteurer hat gelernt, die Geräusche der Natur zu verstehen und zu deuten. Er erhält einen Bonus in Höhe von 3 Punkten auf alle Wahrnehmung-Proben in der Natur.
mastership.naturemagic.natureexpert.desc=Der Zauberer hat durch intensive Beschäftigung mit der Natur ein tieferes Verständnis für viele Lebewesen entwickelt. Er erhält einen Bonus in Höhe von 1 Punkt auf alle Naturkunde- und Tierführung-Proben.
mastership.naturemagic.familiarbond.desc=Der Zauberer hat ein intensiveres magisches Band zu seinem Tiervertrauten als üblich. Er kann alle Zauber mit der Reichweite Berührung auch über die Berührung seines Tiervertrauten auslösen. Die Regel zur maximalen Wirkungsweite kanalisierter Zauber (S. 195) wird in diesem Fall vom Vertrautentier aus bestimmt, nicht vom Zauberer. Das Tier hört auf gewöhnliche Kommandos des Zauberers und ist als für seine Art außerordentlich intelligent anzusehen.
mastership.naturemagic.natureharmony.desc=Der Zauberer kanalisiert seine Energien im Einklang mit der Natur und schädigt durch seine Magie die Umgebung kaum. Seine für Naturzauber verbrauchten Fokuspunkte werden nur zu einem Zehntel auf die Tabelle Fokus und Umgebung (S. 197) angerechnet. Außerdem kann er, wenn er beim Zaubern einen verheerenden Misserfolg bzw. einen Patzer würfelt, in der Tabelle für Verheerende Zauberauswirkungen eine Stufe abziehen. Sollte er dadurch unter die niedrigste Stufe fallen, entfallen die Auswirkungen aus der Tabelle.
mastership.naturemagic.wildernesschild.desc=Der Zauberer kann in der unberührten Natur besonders gut zaubern. Er erhält einen Bonus in Höhe von 3 Punkten auf alle Naturzauber, die er abseits der Zivilisation und unter freiem Himmel wirkt.
mastership.naturemagic.enhancefamiliar.desc=Der Zauberer kann Zauber der Schulen Bewegung, Heilung, Schutz und Stärkung, die eigentlich nur auf ihn (oder auf intelligente Lebewesen) wirken, auf seinen Vertrauten sprechen. Bei Wesen mit mehr als Größenklasse 6 steigen die Kosten an erschöpftem Fokus um 2 pro Punkt über Größenklasse 6.
mastership.naturemagic.onewithnature.desc=Der Zauberer hat seinen Geist mit der Natur in Einklang gebracht und hat gelernt, ihre Energien aufzunehmen. Er heilt bei einer Ruhephase 2 zusätzliche Lebenspunkte, wenn er sich in der unberührten Natur aufhält.
mastership.naturemagic.familiarlanguage.desc=Der Zauberer hat gelernt, die Sprache seines Tiervertrauten zu verstehen. Er kann mit ihm kommunizieren, wobei die Art der Kommunikation durch den Verstand des Vertrauten begrenzt ist.
mastership.illusionmagic.disturbclairvoyance.desc= Wenn der Zauberer 2 Punkte Fokus zusätzlich erschöpft, kann er seine Illusion gegen den Zauber Wahrer Blick (siehe S. 251) schützen. Alle durch Wahrer Blick ermöglichten Wahrnehmung-Proben, um die Illusion zu erkennen, erhalten einen Malus in Höhe von 3 Punkten.
mastership.illusionmagic.secondidentity.desc=Der Zauberer hat so tiefen Einblick in Betrügereien erhalten, dass er auf Proben zum Verkleiden und zum Lügen einen Bonus in Höhe von 2 Punkten erhält.
mastership.illusionmagic.secondskin.desc=Wenn der Zauberer Illusionsmagie des Typus Impersonation verwendet, ist seine Tarnung so glaubwürdig, dass er einen Bonus in Höhe von 4 Punkten auf RedegewandtheitProben erhält, um andere von seiner Identität zu überzeugen
mastership.illusionmagic.artificalreality.desc=Die Illusionen des Zauberers sind außerordentlich realistisch. Alle Proben, die Illusionen zu durchschauen (etwa durch den Zauber Wahrer Blick, eine gezielte Untersuchung oder Ausnahmen wie bei Falsches Gesicht) erhalten einen Malus in Höhe von insgesamt 6 Punkten.
mastership.controlmagic.empathy.desc=Die lange Beschäftigung mit fremden Geistern hat den Zauberer sehr feinfühlig werden lassen. Er erhält einen Bonus in Höhe von 2 Punkten auf seine Empathie.
mastership.controlmagic.willbreaker.desc=Der Zauberer erhält einen Bonus in Höhe von 2 Punkten auf Beherrschungszauber, die gegen den Geistigen Widerstand gerichtet sind.
mastership.controlmagic.materialbond1.desc=Die maximale Wirkungsweite kanalisierter Beherrschungszauber (GRW 195) sowie die Reichweite von Beherrschungszaubern des Zauberers gelten als vervierfacht, wenn dieser eine materielle Verbindung zum Ziel (Büschel Haare, Fingernägel, Blut) besitzt.
mastership.controlmagic.sleeper.desc=Der Zauberer kann einen kanalisierten Beherrschungszauber tief im Geist seines Opfers versenken. Er führt die Zauberhandlung wie gewohnt durch und zahlt die Kosten sofort. Die Kosten steigen allerdings um +K3V3. Durch ein Schlüsselwort oder ein einfaches Erlebnis (z.B. das Opfer betritt ein bestimmtes Gebäude) tritt die Wirkung des zuvor gesprochenen Zaubers in Kraft. Bei kanalisierten Zaubern müssen die Punkte vom Zeitpunkt des Auslösens (und nicht etwa erst des Inkrafttretens des Wirkung) so lange kanalisiert werden, bis der Zauberer den Zauber fallen lässt. Die Regelung zur maximalen Wirkungsweite kanalisierter Zauber (S. 195) gilt für einen auf diese Weise gewirkten Zauber nicht.
mastership.controlmagic.materialbond2.desc=Der Zauberer muss ein Ziel nicht sehen können, um einen Beherrschungszauber auf es zu sprechen, sofern er eine materielle Verbindung zum Ziel (Haare, Nägel, Blut) besitzt. Das Ziel muss sich dennoch in Reichweite befinden.
mastership.motionmagic.arcanespeed.desc=Die Geschwindigkeit des Zauberers erhöht sich um 1.
mastership.motionmagic.penetratingprojectile.desc=Der Zauberer kann einem einzelnen Geschoss (Wurf- oder Schusswaffe, selbst abgeschossen oder von einem nicht weiter als 10 m entfernten Verbündeten) einen kurzen telekinetischen Schub versetzen, der es beschleunigt. Diese sofortige Reaktion erfordert keine Probe, erschöpft aber 2 Fokuspunkte und dauert 3 Ticks. Das Geschoss richtet 4 Punkte Bonusschaden an. Dies ist nur einmal pro Geschoss möglich.
mastership.motionmagic.effectivemotion.desc=Vom Zauberer gewirkte Bewegungszauber des Typus Bewegung stärken kosten 2 Punkte kanalisierten Fokus weniger.
mastership.motionmagic.puppet.desc=Der Zauberer kann eine andere Person \u2013 auch gegen deren Willen \u2013 mit allen Bewegungszaubern des Typus Telekinese behandeln, als sei sie ein Objekt. Die eventuelle Begrenzung der Last wird im Rahmen dieser Meisterschaft außer Kraft gesetzt, stattdessen wirken Zauber auf Lebewesen bis GK 7. Um die Meisterschaft einzusetzen, muss der Körperliche Widerstand überwunden werden. Wehrt sich das Opfer, kann es die Manipulation mit einer vergleichenden Zähigkeit-Probe gegen die Probe des Zaubers abschütteln. Dies wird als sofortige Reaktion behandelt und dauert 3 Ticks. Diese Probe kann alle 30 Ticks wiederholt werden. Der Zauberer kann diese Meisterschaft nicht nutzen, um Wesen sich direkt selbst verletzen zu lassen.
mastership.insightmagic.exploringmind.desc=Der Zauberer erhält einen Bonus in Höhe von 2 Punkten auf Erkenntniszauber, die gegen den Geistigen Widerstand gerichtet sind.
mastership.insightmagic.emotionsense.desc= Der Zauberer hat ein Gespür für subtilste Äußerungen und Gesten des Gegenübers entwickelt. Er erhält einen Bonus in Höhe von 2 Punkten auf seine Empathie.
mastership.insightmagic.telepathicshield.desc=Der Zauberer erhält einen Bonus in Höhe von 2 Punkten auf seinen Geistigen Widerstand gegen Erkenntnismagie.
mastership.insightmagic.urgentmessage.desc=Der Zauberer kann Erkenntniszauber des Typus Botschaft auch dann noch wirken, wenn er keine Fokuspunkte mehr zur Verfügung hat. Hierfür muss er Lebensenergie in Höhe der Fokuskosten aufwenden.
mastership.insightmagic.distancecaster.desc=Die Grundreichweite aller Erkenntniszauber wird verdoppelt.
mastership.insightmagic.subtileanalysis.desc=Alle Proben, um zu erkennen, ob Erkenntnismagie des Zauberers (z.B. Gedankenlesen) angewendet wurde, erleiden einen Malus in Höhe von 3 Punkten.
mastership.insightmagic.voicesoffriends.desc=Der Zauberer kann eine Person unter seinen Schutz stellen. Hierzu muss er sich etwa eine Stunde mit ihm beschäftigen und Fokus in Höhe von 8V4 aufwenden. Damit stellt der Zauberer eine geistige Verbindung her: Ein Jahr lang spürt er sofort, wenn die gezeichnete Person in eine Notsituation gerät. Zusätzlich erhält er eine grobe Ahnung davon, in welcher Richtung sich der Freund befindet, nicht aber wie weit er entfernt ist. Es können maximal AUS Personen derart unter den Schutz des Zauberers gestellt werden.
mastership.healmagic.detox.desc=Der Zauberer ist in der Lage, eingenommene Gifte durch das Trinken von ausreichend Wasser zu schwächen. Nimmt er ein Gift über die Nahrung auf und trinkt anschließend mindestens 3 Liter Wasser, wird die Wirkungsdauer von Giften halbiert.
mastership.healmagic.cosmeticthaumaturgy.desc=Der Zauberer kann 1 Fokuspunkt erschöpfen, um eine einfache kosmetische Auswirkung einer Verletzung (aufgeschrammte Haut, ein blaues Auge oder Ähnliches) bei sich oder einer Person, die er berührt, zu entfernen. Dies hat keine Auswirkungen auf tatsächlich angerichteten Schaden.
mastership.healmagic.arcanediagnosis.desc=Der Heiler kann die Verfassung eines Patienten besonders gut einschätzen. Nimmt er sich 5 Minuten Zeit, um den Patienten zunächst zu untersuchen, erhält er bei der Behandlung durch Heilungsmagie einen Bonus in Höhe von 3 Punkten.
mastership.healmagic.enforcehealing.desc=Wenn der Zauberer einen Patienten magisch oder profan behandelt, regeneriert dieser in der nächsten Ruhephase 2 zusätzliche Lebenspunkte.
mastership.healmagic.corporesana.desc=Der Zauberer hat gelernt, seinen Körper mit den magischen Kräften der Umwelt in Einklang zu bringen. Er heilt bei einer Ruhephase 1 zusätzlichen Lebenspunkt. Außerdem kann er mit seinen Heilzaubern, sofern sie einmalig Lebenspunkte regenerieren, immer 3 zusätzliche Punkte regenerieren.
mastership.lightmagic.luminance.desc=Vom Zauberer gewirkte Lichtzauber des Typus Leuchten verbessern die Lichtverhältnisse immer eine Stufe stärker als angegeben.
mastership.lightmagic.warrioroflight.desc=Der Zauberer kann besonders gut gegen Wesen der Dunkelheit vorgehen. Er erhält einen Bonus in Höhe von 2 Punkten auf alle Zauber, wenn sie gegen einen Widerstandswert von Kreaturen der Typen Wesen der Finsternis oder Untoter gehen.
mastership.lightmagic.protectionlight.desc=Der Zauberer wird durch die Kraft des Lichtes vor der Magie der Schatten geschützt. Er erhält einen Bonus in Höhe von 3 Punkten auf alle Widerstandswerte gegen Schattenzauber und Angriffe von Kreaturen der Typen Wesen der Finsternis oder Untoter.
mastership.lightmagic.againstdarkness.desc=Der Zauberer richtet gegen Kreaturen der Typen Wesen der Finsternis oder Untoter 2 Punkte Bonusschaden an. Dieser Bonusschaden gilt für alle Angriffe.
mastership.lightmagic.unblinded.desc=Der Zauberer ist immun gegen den Zustand Geblendet.
mastership.fatemagic.luckychild.desc=Der Zauberer darf bei einem Glücksspiel, Auslosungen und ähnlichen Situationen den Würfelwurf wiederholen und das bessere Ergebnis wählen.
mastership.fatemagic.preemption.desc=Der Zauberer erhält einen Bonus in Höhe von 3 Punkten auf Proben, um Überraschungen oder Hinterhalte zu erkennen.
mastership.fatemagic.cursebringer.desc=Der Zauberer kann besonders potente Flüche schleudern. Der Zauberer erhält einen Bonus in Höhe von 2 Punkten auf Schicksalszauber, die gegen den Körperlichen Widerstand oder den Geistigen Widerstand gerichtet sind.
mastership.fatemagic.fortuneteller.desc=Der Abenteurer ist in der Lage, einen Blick in die Zukunft zu werfen, indem er Karten legt, Knochen wirft, die Gestirne betrachtet oder andere Quellen zu Rate zieht. Dies dauert 10 Minuten. Nach einer erfolgreichen Probe auf Schicksalsmagie (Schwierigkeit 20) erhält er einen Bonus in Höhe von 1 Punkt (+1 pro Erfolgsgrad), den er in den nächsten 24 Stunden für einen einzigen Wurf nachträglich einsetzen kann. Er kann auch einem Gefährten weissagen. Erst wenn die Weissagung eingetreten ist (also der Bonus genutzt wurde) oder die Zeit verstrichen ist, kann der Abenteurer eine neue Weissagung treffen.
mastership.fatemagic.breathoffate.desc=Der Zauberer erhält an besonders schicksalsträchtigen Orten (oder, seltener, bei der Berührung von Personen, denen Großes bestimmt ist), Visionen über das Schicksal des Ortes oder der Person. Diese Visionen sind stets diffus und ungenau, oft in Metaphern und Analogien verpackt. Der Zauberer darf einen Wurf auf Geschichte & Mythen (Schwierigkeit 25) ausführen, um bei Gelingen vom Spielleiter Hilfe bei der Interpretation zu verlangen.
mastership.protectionmagic.hastyprotection.desc=Der Zauberer kann mit schierer Willenskraft Schutzzauber schneller aufbauen. Er kann 1 Fokuspunkt verzehren, um die Auslösezeit um 2 Ticks zu reduzieren (bis zu einem Minimum von 1 Tick).
mastership.protectionmagic.protectionmagicexpert.desc=Der Zauberer ist geübt darin, Zauberwirkungen zu erkennen. Er erhält einen Bonus in Höhe von 3 Punkten auf alle Arkane Kunde-Proben, die dem Identifizieren eines bereits gewirkten Zaubers dienen.
mastership.protectionmagic.distancecaster.desc=Die Grundreichweite aller Schutzzauber verdoppelt sich.
mastership.protectionmagic.protectionmagicmaster.desc= Der Schutzzauberer ist in der Lage, schon frühzeitig zu erkennen, welche Zauber seine Gegner wirken. Er erhält einen Bonus in Höhe von 3 Punkten auf alle Arkane Kunde-Proben, die dem Identifizieren eines Zaubers dienen, für den gerade Magie fokussiert wird.
mastership.protectionmagic.magicpull.desc=Der Zauberer kann magische Energie absorbieren. Trifft ein magischer Effekt auf einen seiner aktiven Schutzzauber, kann er sofort und bis zu 10 Ticks lang über Punkte in Höhe der Hälfte des dem magischen Effekt innewohnenden Fokus verfügen, die er zum Auslösen eigener Zauber einsetzen kann. Hierfür muss er selbst keine Magie fokussieren, kann aber auch keine eigenen Fokuspunkte zusätzlich einsetzen.
mastership.deathmagic.dyingbreath.desc=Der Zauberer fühlt, wie sich der Tod in einem Lebewesen ausbreitet. Er erhält einen Bonus in Höhe von 3 Punkten auf Proben, um Vergiftungen, Erkrankungen oder das Wirken schädlicher Magie zu diagnostizieren.
mastership.deathmagic.ghostexpert.desc=Der Zauberer erhält einen Bonus in Höhe von 3 Punkten auf Proben, um Wesen des Typus Geisterwesen zu bemerken oder zu identifizieren.
mastership.deathmagic.undeadhunter.desc=Der Zauberer besitzt große Erfahrung im Kampf gegen Untote. Er erhält einen Bonus in Höhe von 3 Punkten auf Angriffe, sowie Proben auf Arkane Kunde und Wahrnehmung gegen Wesen des Typus Untoter.
mastership.deathmagic.masterofghosts.desc=Der Zauberer erhält einen Bonus in Höhe von 3 Punkten auf Todeszauber der Typen Beschwörung und Wesen bannen, die der Beschwörung oder Bannung von Kreaturen des Typus Geisterwesen dienen, sowie auf die Interaktion mit entsprechenden Kreaturen.
mastership.deathmagic.masterofage.desc=Die enge Beschäftigung mit dem Tod hat die Sterblichkeit des Zauberers in ihre Bahnen verwiesen. Der Zauberer altert nur noch halb so schnell.
mastership.deathmagic.necromancer.desc=Der Zauberer ist ein Experte darin, seine erhobenen Untoten zu verstärken. Sofern ein Todeszauber des Typus Nekromantie die Option des Verstärkens beinhaltet, um Werte durch Erfahrungspunkte zu verbessern, kann der Zauberer die Option beliebig oft mehrfach wählen.
mastership.deathmagic.masterofundead.desc=Vom Zauberer gewirkte Todeszauber des Typus Nekromantie bis Grad 4 erheben immer doppelt so viele Untote wie beim Zauber angegeben.
mastership.transformationmagic.formbanishing.desc=Alle Proben des Zauberers, um einen Verwandlungszauber zu bannen, erhalten einen Bonus in Höhe von 3 Punkten.
mastership.transformationmagic.favoredform.desc=Wenn der Zauberer diese Meisterschaft erhält, wählt er eine beliebige Gestalt aus. Dies ist üblicherweise eine Tierart, kann aber auch eine andere Art humanoider Wesen sein. Immer, wenn er sich selbst mit einem geeigneten Zauber (also etwa dem Zauber Kleintierform) in diese Gestalt verwandelt (oder andere in diese Gestalt verwandelt), erhält er einen Bonus in Höhe von 3 Punkten. Diese Meisterschaft kann mehrfach gewählt werden, immer mit einer neuen Gestalt.
mastership.transformationmagic.freedomofform.desc=Der Zauberer kann die Grenzen seiner Verwandlungszauber sprengen. Der Zauber Kleintierform erlaubt ihm die Verwandlung in eine nicht fliegende Kreatur des Typus Tier bis zu Größenklasse 4, sofern er die Bevorzugte Gestalt dieser Tierart besitzt. Der Zauber Tierform erlaubt ihm die Verwandlung in eine nicht fliegende Kreatur des Typus Tier bis zu Größenklasse 7, sofern er die Bevorzugte Gestalt dieser Tierart besitzt. Der Zauber Bestienform erlaubt ihm auch die Verwandlung in ein Wesen des Typus Humanoid, sofern er die Bevorzugte Gestalt dieser Art Wesen besitzt. Eventuelle Begrenzungen des Monstergrades müssen weiter eingehalten werden.
mastership.transformationmagic.animalskin.desc=Der Bonus durch die Meisterschaft Bevorzugte Gestalt steigt auf 6 Punkte. Diese Meisterschaft kann mehrfach gewählt werden, immer mit einer neuen Gestalt (für die jeweils die Bevorzugte Gestalt besessen werden muss).
mastership.transformationmagic.formcontrol.desc=Der Zauberer erhält einen Bonus in Höhe von 2 Punkten auf Verwandlungszauber, die gegen den Körperlichen Widerstand oder die Verteidigung gerichtet sind.
mastership.transformationmagic.formveil.desc=Wird versucht, eine vom Zauberer durchgeführte Verwandlung zu identifizieren, erleidet der Versuch einen Malus in Höhe von 3 Punkten.
mastership.transformationmagic.birdofpreyform.desc=Der Zauberer kann sich mit dem Zauber Vogelform in einen Vogel bis zu Größenklasse 5 verwandeln. Er muss hierfür die Bevorzugte Gestalt dieser Tierart besitzen.
mastership.transformationmagic.animalcaster.desc=Der Zauberer kann in Tiergestalt ohne Mali für fehlende Geste und Formel zaubern, sofern er eine Gestalt angenommen hat, für die er die Bevorzugte Gestalt besitzt.

spell.truesight.descr=Der Zauberer ist in der Lage, mit seinen normalen Sinnen eine Illusion zu\
 durchschauen. Dies erfordert eine Wahrnehmung-Probe gegen die um drei Punkte \
 erhöhte Schwierigkeit des Illusionszaubers.
spell.truesight.enhancedescr=Die Probe geht gegen die normale Schwierigkeit des Illusionszaubers.
spell.accelerate.descr=Die Geschwindigkeit des Zauberers erhöht sich um 2 Punkte.
spell.accelerate.enhancedescr=Die Geschwindigkeit erhöht sich um insgesamt 4 Punkte.
spell.acidsquirt.descr=Der Zauberer schießt einen Säurestrahl auf das Ziel ab, der 3W6+3 Punkte Säureschaden verursacht. \
  Der Schaden des Zaubers hat die Waffenmerkmale Scharf 3 und Durchdringung 3 (S. 186).
spell.acidsquirt.enhancedescr=Das Ziel erhält zusätzlich für 30 Ticks den Zustand Verwundet 1.
spell.alarm.descr=Der Zauberer wird alarmiert, wenn eines oder mehrere Wesen der Größenklasse 2 oder höher den \
  Wirkungsbereich betritt. Er vermag dabei keinen genauen Ort zu bestimmen, sondern lediglich die pure Anwesenheit \
  festzustellen, ebenso wenig kann er Angaben zur Anzahl machen. Es ist möglich, bis zu zehn bestimmte Wesen seiner \
  Wahl von der Alarmierung auszunehmen.
spell.alarm.enhancedescr=Der Zauberer weiß, in welcher Richtung sich die Wesen befinden, ohne jedoch die \
  Entfernung zu kennen.
spell.allunderstanding.descr=Der Zauberer vermag das gesprochene Wort jedes Wesens zu verstehen, \
  gleich ob es aus dem Diesseits stammt oder aus den Anderswelten kommt. Seine eigene Sprache wird \
  hiervon jedoch nicht betroffen, andere Wesen können ihn nicht auf magische Weise verstehen. \
  Der Zauberer erfährt auf magische Weise den Sinn des Gesagten, sodass er etwa keine Inschriften lesen kann.
spell.allunderstanding.enhancedescr=Alle Wesen können außerdem verstehen, was der Zauberer sagt.
spell.animalfriend.descr=Der Zauberer wirkt vertrauter auf alle Wesen mit dem Typus Tier. Er erhält einen Bonus in Höhe \
  von 1 Punkt auf Tierführung-Proben und die Einstellung jedes Tieres ihm gegenüber wird um 1 Stufe verbessert.
spell.animalfriend.enhancedescr=Die Einstellung wird um eine weitere Stufe verbessert.
spell.animalmessenger.descr=Ein einzelnes Wesen des Typus Tier bis maximal Größenklasse 3, das dem Zauberer gegenüber \
  mindestens die Einstellung Neutral aufweist, überbringt eine schriftliche Nachricht an einen dem Zauberer bekannten \
  Ort und verschwindet anschließend. Innerhalb eines Tages können Landtiere zwischen 10 (z.B. kleine Säugetiere) und \
  50 km (z.B. Wölfe oder Wildschweine) zurücklegen, Vögel sogar zwischen 50 (Singvögel) und 200 km (weit wandernde Zugvögel).
spell.animalmessenger.enhancedescr=Das Tier überbringt die Botschaft nicht nur an einen Ort, sondern dort sogar einer \
  bestimmten, dem Zauberer bekannten Person.
spell.animalsenses.descr=Der Zauberer nimmt die Welt statt durch seine eigenen Sinne durch die eines beim Zaubervorgang \
  berührten Wesens mit dem Typus Tier bis maximal Größenklasse 5 wahr, das dem Zauberer gegenüber mindestens die \
  Einstellung Neutral aufweist. Währenddessen kann er seine eigenen Sinne nicht benutzen, sondern sieht, riecht, \
  fühlt und hört nur das, was das Tier in diesem Moment wahrnimmt.
spell.animalsenses.enhancedescr=Der Zauberer kann neben den Tiersinnen auch noch seine normalen Sinne benutzen.
spell.animalshape.descr=Der Zauberer verwandelt sich in ein nicht flugfähiges Wesen des Typus Tier der Größenklasse \
  1 bis 5 sowie bis maximal Monstergrad (als Einzelgegner) 2.
spell.animalshape.enhancedescr=Die Kreatur ist ein besonders prachtvolles Exemplar. Alle Proben auf Fertigkeiten, \
  die von der Tiergestalt übernommen wurden, erhalten einen Bonus in Höhe von 2 Punkten.
spell.animateshadow.descr=Aus dem Schatten des Zauberers löst sich eine schwarze Gestalt gleicher Statur und \
  Größenklasse. Die übrigen Abgeleiteten Werte des Wesens entsprechen den um 3 Punkte verschlechterten abgeleiteten \
  Werten des Zauberers. Auf seine Proben (mit den Werten des Zauberers) erhält es ebenfalls einen Malus in Höhe von 3 \
  Punkten. Das Wesen besitzt das Merkmal Schwächlich (S. 265). Es führt die Befehle des Zauberers bedingungslos aus, \
  vermag aber nicht zu zaubern oder zu sprechen. Wird es getötet, erleidet der Zauberer 2W6 Punkte Schaden. Das Wesen \
  bewegt sich nicht ohne explizite Anweisung aus der Wirkungsweite des kanalisierten Zaubers (S. 195) hinaus.
spell.animateshadow.enhancedescr=Die abgeleiteten Werte des Wesens entsprechen den um 2 Punkte gesenkten abgeleiteten \
  Werten des Zauberers. Der Malus auf Proben beträgt nur noch 2 Punkte.
spell.antidote.descr=Alle derzeit im Körper befindlichen Gifte werden aufgehoben, solange sie maximal Grad 3 \
  aufweisen und nicht den Zustand Siechtum verleihen.
spell.antidote.enhancedescr=Es werden Gifte bis Grad 5 ohne den Zustand Siechtum aufgehoben.
spell.antimagicarea.descr=Innerhalb des Wirkungsbereichs erhalten alle Zauberproben einen Malus in Höhe von 4 Punkten.
spell.antimagicarea.enhancedescr=Der Malus erhöht sich auf 6 Punkte.
spell.auracounter.descr=Wird im Wirkungsbereich ein Zauber gewirkt, verliert der Zauberer, der ihn ausgelöst hat, 8 Lebenspunkte.
spell.auracounter.enhancedescr=Der Verlust beträgt 10 Lebenspunkte.
spell.auradetermin.descr=Der Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner \
  Wahl erhalten jeweils einen Bonus in Höhe von 1 Punkt auf den Geistigen Widerstand und von 2 Punkten auf die \
  Entschlossenheit. Die Boni gelten nur während des Aufenthalts im Wirkungsbereich.
spell.auradetermin.enhancedescr=Es können bis zu fünf Personen bestimmt werden.
spell.auraleader.descr=Der Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner Wahl \
  erhalten jeweils einen Bonus in Höhe von 2 Punkten auf den Geistigen Widerstand, den Körperlichen Widerstand, \
  die Verteidigung sowie alle durchgeführten Angriffe. Zudem sind sie immun gegen die Zustände Angsterfüllt und \
  Panisch. Die Boni gelten nur während des Aufenthalts im Wirkungsbereich.
spell.auraleader.enhancedescr=Es können bis zu fünf Personen bestimmt werden.
spell.auralifeforce.descr=Der Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner \
  Wahl erhalten jeweils 10 zusätzliche Lebenspunkte, die im Falle erlittener Schadenspunkte zuerst verbraucht werden. \
  Es ist möglich, dadurch temporär über einen Vorrat an Lebenspunkten zu verfügen, der über das natürliche \
  Maximum hinausgeht (und auch die maximalen Boni auf abgeleitete Werte gelten hier nicht). Sollte ein Nutznießer \
  bereits verwundet sein, gelten weiter seine aktuellen Wundabzüge. Die zusätzlichen Punkte stehen nur während des \
  Aufenthalts im Wirkungsbereich zur Verfügung und verfallen bei Verlassen desselben. Dieser Zauber ist nicht mit \
  anderen Zaubern kombinierbar, die ebenfalls die Typen Körper stärken und Leben besitzen.
spell.auralifeforce.enhancedescr=Es können bis zu fünf Personen bestimmt werden.
spell.aurapainless.descr=Die Wundabzüge des Zauberers und bis zu drei weiterer beim Auslösen des Zaubers festgelegter \
  Wesen seiner Wahl werden ignoriert. Dies steht den Nutznießern nur während des Aufenthalts im \
  Wirkungsbereich zur Verfügung.
spell.aurapainless.enhancedescr=Es können bis zu fünf Personen bestimmt werden.
spell.aurashadow.descr=Der Zauberer und bis zu drei weitere bei Auslösung des Zaubers festgelegte Wesen seiner \
  Wahl erhalten einen Bonus in Höhe von 8 Punkten auf alle Heimlichkeit-Proben, solange sie sich im Wirkungsbereich \
  des Zaubers aufhalten.
spell.aurashadow.enhancedescr=Es können bis zu fünf Wesen festgelegt werden.
spell.aurawarmth.descr=Für den Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner \
  Wahl gilt die vorherrschende Kältestufe als um 2 Punkte gesenkt bzw. die vorherrschende Hitzestufe als um 2 \
  Punkte erhöht. Die Modifikation gilt nur während des Aufenthalts im Wirkungsbereich.
spell.aurawarmth.enhancedescr=Es können bis zu fünf Personen bestimmt werden.
spell.badluck.descr=Das Ziel erhält für seinen nächsten Wurf einen Malus in Höhe von 2 Punkten.
spell.badluck.enhancedescr=Der Malus erhöht sich auf 3 Punkte.
spell.balloflight.descr=Der Zauberer erschafft eine strahlende Kugel, welche die Lichtverhältnisse um 2 Stufen \
  verbessert. Sie kann mit GSW 10 frei durch die Luft gelenkt werden, solange sie sich innerhalb der Reichweite des \
  Zaubers und des Sichtfelds des Zauberers befindet.
spell.balloflight.enhancedescr=Die Lichtverhältnisse werden um insgesamt 3 Stufen verbessert.
spell.banishcoincidence.descr=Eine beliebige einzelne Probe oder anderweitiger Würfelwurf wird nicht geworfen, \
  stattdessen wird das Ergebnis bestimmt. Im Anschluss endet der Zauber. Die den Wurf ?ausführende? Person muss \
  sich innerhalb der Reichweite befinden.
spell.banishcoincidence.enhancedescr=Die Bestimmung eines zweiten Würfelwurfs ist möglich.
spell.barkskin.descr=Die Haut des Zauberers wird borkig und hart. Er erhält einen Bonus in Höhe von jeweils 1 Punkt \
  auf seine Verteidigung und seine Schadensreduktion. Dieser Zauber ist nicht mit anderen Zaubern kombinierbar, \
  die ebenfalls den Typus Haut besitzen.
spell.barkskin.enhancedescr=Der Bonus auf die Schadensreduktion erhöht sich auf 2 Punkte.
spell.beastform.descr=Der Zauberer verwandelt sich in ein Wesen des Typus Monster oder Tier der Größenklasse 2-7. \
  Es können nur Kreaturen bis Monstergrad (als Einzelgegner) 3 gewählt werden.
spell.beastform.enhancedescr=Die Kreatur ist ein besonders prachtvolles Exemplar. Alle Proben auf Fertigkeiten, \
  die von der Tiergestalt übernommen wurden, erhalten einen Bonus in Höhe von 2 Punkten.
spell.birdshape.descr=Der Zauberer verwandelt sich in ein flugfähiges Wesen des Typus Tier der Größenklasse \
  1 bis maximal Monstergrad (als Einzelgegner) 2.
spell.birdshape.enhancedescr=Die Kreatur ist ein besonders prachtvolles Exemplar. Alle Proben auf Fertigkeiten, die von \
  der Tiergestalt übernommen wurden, erhalten einen Bonus in Höhe von 2 Punkten.
spell.blackice.descr=Der Boden wird im Wirkungsbereich mit einer spiegelglatten Eisschicht überzogen, wodurch zur \
  Überquerung die Regeln zum Balancieren (S. 102) zum Tragen kommen.
spell.blackice.enhancedescr=Die Schwierigkeit der zum Balancieren nötigen Akrobatik-Proben erhöht sich um 5 Punkte.
spell.blackness.descr=Die Lichtverhältnisse werden um 4 Stufen verschlechtert, zudem wird die Wirkung aller \
  Lichtzauber unterdrückt, solange sie maximal Grad 3 aufweisen.
spell.blackness.enhancedescr=Die Wirkung von Lichtzaubern bis Grad 5 wird unterdrückt.
spell.blazingbarrier.descr=Der Zauberer erschafft eine schnurgerade und unverrückbare Wand aus gleißendem \
  Licht von 20 cm Dicke mit einer beliebig verteilbaren Fläche von bis zu 10 m². Ihre Härte beträgt 2 Punkte, ihre \
  Haltbarkeit 6 Punkte. Die Barriere erhöht die Lichtverhältnisse im Umkreis von 5 Metern um 2 Stufen. Sie kann \
  zerstört werden, was den Zauber beendet. Die maximale Wirkungsweite kanalisierter Zauber (S. 195) gilt für \
  diesen Zauber als verzehnfacht.
spell.blazingbarrier.enhancedescr=Wird die Wand im Nahkampf attackiert, erhalten die Angreifer den Zustand Geblendet 1.\
   Außerdem verbessert sie die Lichtverhältnisse im Umkreis von 5 Metern um insgesamt 3 Stufen.
spell.blazingshield.descr=Der Zauberer umgibt sich mit einem Schild aus gleißendem Licht. Wird er im Nahkampf \
  attackiert, erhalten die Angreifer den Zustand Geblendet 1. Zudem verbessern sich die Lichtverhältnisse \
  im Umkreis von 10 Metern um 1 Stufe.
spell.blazingshield.enhancedescr=Angreifer im Nahkampf erhalten den Zustand Geblendet 2, die Lichtverhältnisse \
  verbessern sich um insgesamt 2 Stufen.
spell.blessing.descr=Ziel erhält einen Bonus von 1 Punkt auf alle Fertigkeiten und Widerstandswerte.
spell.blessing.enhancedescr=Der Bonus erhöht sich auf 2 Punkte.
spell.bodyoflight.descr=Der Körper des Zauberers verwandelt sich in eine strahlende Gestalt aus Licht, behält aber \
  seine Statur bei. Er erhält einen Bonus in Höhe von 4 Punkten auf seine Schadensreduktion und ist immun gegen den \
  Zustand Geblendet, während alle Wesen, die ihn im Nahkampf attackieren, den Zustand Geblendet 1 erhalten. Zudem \
  verbessern sich die Lichtverhältnisse im Umkreis von 10 Metern um 1 Stufe. Kleidung und Ausrüstung sind nicht von \
  der Verwandlung betroffen.
spell.bodyoflight.enhancedescr=Gegenstände bis Last 4 werden mitverwandelt.
spell.bodyofshadow.descr=Der Körper des Zauberers verwandelt sich in eine schwarze Schattengestalt, behält aber seine \
  Statur bei. Er erhält einen Bonus in Höhe von 4 Punkten auf seine Schadensreduktion und 8 Punkten auf seine \
  Heimlichkeit, sowie eine Verwundbarkeit gegen Lichtschaden. Kleidung und Ausrüstung sind nicht von der \
  Verwandlung betroffen.
spell.bodyofshadow.enhancedescr=Gegenstände bis Last 4 werden mitverwandelt.
spell.breakcurse.descr=Alle momentan auf das Ziel wirkenden Zauber des Typus Fluch bzw. Zustände mit der Ursache Fluch \
  werden aufgehoben, solange die verursachenden Zauber maximal Grad 3 aufweisen.
spell.breakcurse.enhancedescr=Es werden Zauber und Ursachen bis Grad 5 aufgehoben.
spell.breakprotection.descr=Ein vom Zauberer bestimmter Zauber bis maximal Grad 2, der mindestens einen der \
  Typen Haut, Rüstung, Schild oder Schutzfeld aufweist, wird beendet.
spell.breakprotection.enhancedescr=Es werden entsprechende Zauber bis Grad 3 aufgehoben.
spell.breakspell.descr=Ein nicht kanalisierter Zauber wird aufgehoben, solange er maximal Grad 3 aufweist. Handelt es \
  sich um einen Zauber mit Wirkungsbereich, genügt es, wenn sich ein Teil von diesem innerhalb der Reichweite befindet. \
  Ein kanalisierter Zauber bis maximal Grad 3 wird nur aufgehoben, sofern dem Zauberer dieses Zaubers eine \
  Entschlossenheit-Probe gegen 21 misslingt.
spell.breakspell.enhancedescr=Es werden nach den obigen Regeln Zauber bis Grad 4 aufgehoben.
spell.breathwater.descr=Der Zauberer kann unter Wasser atmen, solange er nicht tiefer als 10 Meter taucht. \
  Seine Atmung an Land wird nicht beeinträchtigt.
spell.breathwater.enhancedescr=Der Zauberer kann beliebig tief tauchen, ohne seine Atemfähigkeit zu verlieren.
spell.bridgeoflight.descr=Der Zauberer erschafft eine schnurgerade und unverrückbare, waagerechte Brücke aus reinem \
  Licht mit einer beliebig verteilbaren Fläche von bis zu 10 m². Ihre Härte beträgt 7 Punkte, ihre Haltbarkeit 24 \
  Punkte. Sie kann also zerstört werden, was den Zauber beendet. 5 m um die Brücke herum werden die Lichtverhältnisse um 1 Stufe verbessert.
spell.bridgeoflight.enhancedescr=Die Fläche beträgt bis zu 20 m².
spell.burden.descr=Die Last eines Objekts wird um 3 Stufen erhöht, es wird auf magische Weise schwerer. Dadurch wird das Objekt schwieriger zu transportieren.
spell.burden.enhancedescr=Die Last wird um insgesamt 5 Stufen erhöht.
spell.calllightning.descr=Der Zauberer ruft eine Wolke herbei, die über dem gesamten Wirkungsbereich schwebt. \
  Aus dieser kann er Blitze gegen im Wirkungsbereich befindliche Ziele hervorschießen lassen. Dazu würfelt er \
  als sofortige Aktion mit seiner für den Zauber verwendeten Magieschule einen Angriff gegen die Verteidigung \
  des Ziels (Dauer: 5 Ticks) und richtet im Falle eines Erfolgs 2W6+5 Punkte Elektrizitätsschaden an. Während \
  der Zauberer die Wolke kontrolliert, kann er keine anderen Aktionen vollführen. Er kann maximal so viele Blitze \
  aus der Wolke hervorschießen lassen, wie er Fertigkeitspunkte in der verwendeten Magieschule besitzt. Ist diese \
  Maximalzahl erreicht, endet der Zauber automatisch.
spell.calllightning.enhancedescr=Die Ziele erhalten zusätzlich für 30 Ticks den Zustand Benommen 1.
spell.calmanimal.descr=Die Einstellung eines Wesens des Typus Tier oder Monster bis maximal Größenklasse 6 wird \
  gegenüber allen anderen Wesen auf Neutral gesetzt.
spell.calmanimal.enhancedescr=Die Einstellung wird auf Hilfsbereit gesetzt.
spell.cancelcontrol.descr=Alle momentan auf das Ziel wirkenden Beherrschungszauber werden aufgehoben, solange sie maximal Grad 3 aufweisen.
spell.cancelcontrol.enhancedescr=Es werden Zauber bis Grad 5 aufgehoben.
spell.cateyes.descr=Die Lichtverhältnisse verbessern sich für den Zauberer um 1 Stufe.
spell.cateyes.enhancedescr=Die Lichtverhältnisse verbessern sich für den Zauberer um insgesamt 2 Stufen.
spell.catreflexes.descr=Der Zauberer erhält einen Bonus in Höhe von 2 Punkten auf alle Proben, in die seine Beweglichkeit einfließt.
spell.catreflexes.enhancedescr=Die Initiative des Zauberers ist außerdem um 2 Punkte gesenkt.
spell.chainlightning.descr=Bis zu drei Ziele werden nacheinander von einem Blitzschlag getroffen. Das erste Ziel\
   muss sich in der Reichweite des Zaubers befinden, die jeweils folgenden Ziele dürfen maximal 5 \
  Meter vom vorhergehenden Ziel entfernt stehen. Das erste Ziel erhält 3W6+6 Punkte Elektrizitätsschaden, \
  jedes weitere dann die Hälfte des Schadens des vorhergehenden Ziels.
spell.chainlightning.enhancedescr=Die Ziele erhalten zusätzlich für 30 Ticks den Zustand Benommen 2.
spell.chamaeleon.descr=Der Zauberer passt sich dem natürlichen Hintergrund an und ist kaum noch zu erkennen. \
  Proben zu seiner Entdeckung erhalten einen Malus in Höhe von 4 Punkten. Wenn er sich nicht bewegt, beträgt der Malus sogar 12 Punkte.
spell.chamaeleon.enhancedescr=Der Malus erhöht sich auf 6 Punkte bzw. 18 Punkte.
spell.changeface.descr=Die Gesichtszüge des Zauberers verändern sich leicht, sodass es einer gelungenen \
  Wahrnehmung-Probe gegen 18 bedarf, um ihn wiederzuerkennen.
spell.changeface.enhancedescr=Der Schwierigkeit der Wahrnehmung-Probe beträgt 21.
spell.claws.descr=Aus den Händen des Zauberers wachsen scharfe Krallen. Seine waffenlosen \
  Nahkampfangriffe verursachen dadurch echten Schaden statt Betäubungsschaden.
spell.claws.enhancedescr=Der Schaden erhöht sich zusätzlich um 1 Punkt.
spell.cleansewater.descr=Der Zauber reinigt bis zu 10 Liter verschmutzter Flüssigkeit. Betroffen sind nur natürliche \
  Krankheitserreger, Giftstoffe oder Verunreinigungen, nicht aber alchemistische Stoffe. Auch Alkohol oder Salz \
  gelten nicht als Verunreinigungen.
spell.cleansewater.enhancedescr=Es werden bis zu 100 Liter gereinigt.
spell.cloudpath.descr=Der Zauberer verfestigt die vor ihm befindliche Luft zu einer schnurgeraden, waagerechten und \
  unsichtbaren Brücke mit einer beliebig verteilbaren Fläche von bis zu 10 m². Ihre Härte beträgt 4 Punkte, ihre \
  Haltbarkeit 12 Punkte. Sie kann also zerstört werden, was den Zauber beendet. Sie zerbirst außerdem, wenn sie mit \
  mehr als drei Personen oder entsprechend schweren Gegenständen belastet wird.
spell.cloudpath.enhancedescr=Die Brücke kann mit bis zu 15 Personen (oder entsprechend schweren Gegenständen) belastet werden.
spell.coldprotection.descr=Der Zauberer erhält eine Schadensreduktion in Höhe von 4 Punkten gegen Kälteschaden. \
  Die Kältestufe (S. 175) gilt für ihn als um 1 reduziert.
spell.coldprotection.enhancedescr=Die Schadensreduktion erhöht sich auf 6 Punkte.
spell.coldshield.descr=Der Zauberer umgibt sich mit einem Schild aus frostiger Kälte. Während er selbst nicht davon \
  beeinträchtigt wird, erleidet jedes Wesen nach jeweils 15 vollen Ticks Aufenthalt in einem Abstand von maximal \
  2 m Kälteschaden in Höhe von 2W6 Punkten.
spell.coldshield.enhancedescr=Betroffene Wesen erhalten zusätzlich den Zustand Benommen 1.
spell.cometome.descr=Das Ziel wird umgehend und auf möglichst direktem Weg zum Zauberer bewegt. Hindernisse werden \
  dabei umgangen. Die Bewegung erfolgt sofortig und ohne Zeitverlust mit Auslösen des Zaubers. Sollte das Ziel sich \
  gerade in einer kontinuierlichen Aktion befunden haben, muss es eine Entschlossenheit-Probe wie nach den Regeln zur \
  Störung kontinuierlicher Aktionen (S. 167) ablegen. Die Schwierigkeit hierfür beträgt 18. Das Ziel kann nicht von \
  Gelegenheitsangriffen von Gegnern getroffen werden, von denen es sich weg oder an denen es sich vorbei bewegt.
spell.cometome.enhancedescr=Das Ziel kann von Gelegenheitsangriffen getroffen werden, sofern der Zauberer dies wünscht.
spell.connectedlife.descr=Sämtlicher Schaden, den ein vom Zauberer bestimmtes Wesen erleidet, wird auf ein anderes \
  vom Zauberer bestimmtes Wesen übertragen. Zur Verzauberung müssen beide Ziele gleichzeitig berührt werden und \
  beide müssen dem Zauber freiwillig zustimmen. Der Zauber endet automatisch mit dem Ableben des Schaden empfangenden Wesens.
spell.connectedlife.enhancedescr=Auch die Auswirkung von Giften und Krankheiten werden übertragen.
spell.consecration.descr=Der Zauberer weiht einen Gegenstand seiner Gottheit oder den Kräften des Schicksals, \
  wodurch er einen zusätzlichen Bonus in Höhe von 1 Punkt auf alle Fertigkeiten gewährt, für die er eingesetzt wird.
spell.consecration.enhancedescr=Der Bonus erhöht sich auf 2 Punkte.
spell.consumemagic.descr=18 unverbrauchte Fokuspunkte des Opfers gelten als verzehrt. Verfügt das Opfer nicht mehr über eine \
  ausreichende Anzahl an unverbrauchten Fokuspunkten, werden auch erschöpfte Punkte betroffen.
spell.consumemagic.enhancedescr=Es werden 24 Fokuspunkte betroffen.
spell.controlanimal.descr=Ein einzelnes Wesen des Typus Tier bis maximal Größenklasse 7 wird unter den Willen des \
  Zauberers gezwungen. Es kann einfache Kommandos im Rahmen seiner natürlichen Fähigkeiten ausführen. Das Wesen bewegt \
  sich nicht ohne explizite Anweisung aus der Wirkungsweite des kanalisierten Zaubers (Seite 195) hinaus.
spell.controlanimal.enhancedescr=Ein zweites Wesen gleichen oder niedrigeren Geistigen Widerstands kann beherrscht werden.
spell.controlfairy.descr=Der Zauberer unterwirft ein Wesen des Typus Feenwesen seinen Befehlen. Es folgt allen \
  seinen Anweisungen unabhängig aller Konsequenzen. Das Wesen bewegt sich nicht ohne explizite Anweisung aus der \
  Wirkungsweite des kanalisierten Zaubers (S. 195) hinaus.
spell.controlfairy.enhancedescr=Ein zweites Wesen gleichen oder niedrigeren Geistigen Widerstands kann beherrscht werden.
spell.controlfire.descr=Der Zauberer beherrscht ein bereits brennendes, natürliches Feuer der Stufen 1-3. Er kann es \
  sowohl abschwächen, also den Brandschaden um eine Stufe senken, als auch heißer brennen lassen und damit den \
  Brandschaden um 1 Stufe erhöhen. Außerdem vermag er es in einfache Formen zu dirigieren.
spell.controlfire.enhancedescr=Es kann auch ein Feuer der Stufen 4-5 beherrscht werden.
spell.controlshadow.descr=Der Zauberer kann die Bewegungen eines einzelnen Schattens mit einer Fläche von bis zu 10 m² \
  kontrollieren. Der Schatten bleibt dabei aber stets auf einer Oberfläche.
spell.controlshadow.enhancedescr=Die Fläche kann bis zu 20 m² betragen.
spell.controlwater.descr=Der Zauberer kann das im Wirkungsbereich befindliche Wasser beliebig dirigieren, \
  solange es sich nicht innerhalb eines Wesens befindet.
spell.controlwater.enhancedescr=Der Zauberer kann das Wasser beliebig in Eis oder Dampf verwandeln.
spell.controlweather.descr=Der Zauberer ist in der Lage, das Wetter um ihn herum beliebig zu verändern. Er kann \
  Stürme erschaffen oder besänftigen, Schneefall rufen oder strahlenden Sonnenschein. Dabei können Kälte und Hitzestufe \
  maximal um 3 Stufen verändert werden. Nach Ende der Wirkungsdauer normalisiert sich das Wetter wieder.
spell.controlweather.enhancedescr=Kälte- und Hitzestufe können beliebig verändert werden.
spell.copyvoice.descr=Der Zauberer nimmt die Stimme einer anderen Person an. Soll es sich um jene einer bestimmten Person\
   handeln, können nur solche Eigenheiten übernommen werden, die dem Zauberer bekannt sind. Die Täuschung kann von \
  Bekannten der Person mit einer vergleichenden Probe auf Empathie gegen die Redegewandtheit des Zauberers bemerkt werden.
spell.copyvoice.enhancedescr=Eine etwaige Redegewandtheit-Probe des Zauberers, um die Sprechweise überzeugend zu \
  imitieren, erhält einen Bonus in Höhe von 3 Punkten.
spell.counterspell.descr=Führt das Ziel gerade einen Zaubervorgang durch, erhält es einen Malus in Höhe von 8 Punkten auf seine Probe.
spell.counterspell.enhancedescr=Der Malus erhöht sich auf 12 Punkte.
spell.curseofpain.descr=Der Zauberer verflucht sein Ziel so, dass es den Zustand Verwundet 1 erhält.
spell.curseofpain.enhancedescr=Das Ziel erhält den Zustand Verwundet 2.
spell.damagecircle.descr=Eine Welle magischer Macht verursacht bei bis zu fünf vom Zauberer beim Auslösen festgelegten\
   Wesen seiner Wahl in 5 m Umkreis 3W6+3 Punkte Schaden, der Schadensreduktion ignoriert. \
  Außerdem erhalten alle Ziele den Zustand Erschöpft 1.
spell.damagecircle.enhancedescr=Den Zielen muss zusätzlich eine Akrobatik-Probe gegen 35 gelingen, um nicht umgeworfen \
  zu werden und als liegend zu gelten. Außerdem erhalten sie für 60 Ticks den Zustand Erschöpft 2, statt des \
  oben genannten Zustands.
spell.damagewave.descr=Eine Welle magischer Macht verursacht bei bis zu drei vom Zauberer beim Auslösen festgelegten \
  Wesen seiner Wahl in 5 m Umkreis 2W6+3 Punkte Schaden, der Schadensreduktion ignoriert.
spell.damagewave.enhancedescr=Die Ziele erhalten zusätzlich für 30 Ticks den Zustand Erschöpft 2.
spell.damnation.descr=Geistiger Widerstand und Körperlicher Widerstand eines einzelnen Ziels werden um jeweils 5 Punkte gesenkt.
spell.damnation.enhancedescr=Beide Werte werden um jeweils 7 Punkte gesenkt.
spell.dancinglights.descr=Der Zauberer erschafft bunte, flackernde Lichter. Diese können beispielsweise Wesen \
  ablenken oder ihm einen Bonus in Höhe von 2 Punkten auf passende Darbietung-Proben geben.
spell.dancinglights.enhancedescr=Der Bonus auf Darbietung-Proben erhöht sich auf 3 Punkte.
spell.darkness.descr=Rund um den Zauberer vertiefen sich die Schatten, Licht wird schwächer. Die Lichtverhältnisse verschlechtern sich dadurch um 1 Stufe.
spell.darkness.enhancedescr=Die Lichtverhältnisse sinken um insgesamt 2 Stufen.
spell.daylight.descr=Die Lichtverhältnisse werden um 4 Stufen verbessert, zudem wird die Wirkung aller Schattenzauber unterdrückt, solange sie maximal Grad 3 aufweisen.
spell.daylight.enhancedescr=Die Wirkung von Schattenzaubern bis Grad 5 wird unterdrückt.
spell.deathcurse.descr=Dieser Zauber zerreißt die Verbindung zwischen Körper und Lebenskraft des Opfers. Es erhält den Zustand Sterbend 1 (Fluch).
spell.deathcurse.enhancedescr=Das Opfer erhält den Zustand Sterbend 2 (Fluch).
spell.deathprotection.descr=Der Zauber schützt den Zauberer in begrenztem Maße vor dem Tod. Sollte er innerhalb der \
  Wirkungsdauer eigentlich sterben (egal aus welchem Grund), erhält er stattdessen den Zustand Bewusstlos, eventuelle \
  negative Lebenspunkte werden geheilt. Etwaige Zustände werden nicht geheilt, ebenso wie sonstige Quellen des Sterbens \
  (wie etwa Ertrinken, wenn der Zauberer sich unter Wasser befindet) nicht ausgesetzt werden. Der Zauber endet, sobald \
  er einmal seine Wirkung entfaltet hat.
spell.deathprotection.enhancedescr=Bei Auslösung des Zaubers werden auch etwaige Sterbend-Zustände geheilt.
spell.decreaseattitude.descr=Der Zauberer verschlechtert die Einstellung des Ziels gegenüber einer von ihm bestimmten \
  Person, Idee oder Sache um 1 Stufe (maximal auf Ablehnend). Dieser Zauber benötigt weder Formel noch Geste.
spell.decreaseattitude.enhancedescr=Die Einstellung verschlechtert sich um insgesamt 2 Stufen (maximal auf Feindlich).
spell.detectmagic.descr=Der Zauberer erkennt die Stärke der Magie in seinem direkt Sichtbereich. Möchte er anschließend \
  ein Objekt oder einen Ort untersuchen, erhält er einen Bonus in Höhe von 1 Punkt auf eine eventuelle Arkane Kunde-Probe.
spell.detectmagic.enhancedescr=Der Bonus erhöht sich auf 2 Punkte.
spell.detectpoison.descr=Der Zauber offenbart die Wirkung und den Grad aller derzeit im Körper befindlichen Gifte. \
  Zudem gewährt er einen Bonus in Höhe von 2 Punkten auf damit im Zusammenhang stehende Heilkunde- oder Heilungsmagie-Proben.
spell.detectpoison.enhancedescr=Zusätzlich wird die ursprüngliche und noch übrige Wirkungsdauer der \
  einzelnen Gifte offenbart, ebenso wie die Anwendungsweise.
spell.diplomatstongue.descr=Der Zauberer erhält einen Bonus in Höhe von jeweils 1 Punkt auf alle Proben in den \
  Fertigkeiten Diplomatie und Redegewandtheit.
spell.diplomatstongue.enhancedescr=Der Bonus erhöht sich auf 2 Punkte.
spell.distract.descr=Der Geist des Ziels wird verwirrt, wodurch es einen Malus in Höhe von 1 Punkt für alle Proben \
  erhält, in die sein Verstand einfließt.
spell.distract.enhancedescr=Der Malus erhöht sich auf 2 Punkte.
spell.disturbinsight.descr=Gegen Erkenntniszauber erhält der Zauberer einen Bonus in Höhe von 2 Punkten auf seinen Geistigen Widerstand.
spell.disturbinsight.enhancedescr=Der Bonus erhöht sich auf 3 Punkte.
spell.dontgoyet.descr=Der Zauber hält die Lebenskraft eines Sterbenden in dessen Körper. Die Wirkung der Zustände \
  Sterbend 1 und Sterbend 2 wird ausgesetzt, während die Wirkungsdauer einer etwaigen Zustandsursache weiterläuft.
spell.dontgoyet.enhancedescr=Auch die Wirkung des Zustands Sterbend 3 wird ausgesetzt.
spell.doom.descr=Alle Proben des Ziels zählen auch bei einem Würfelergebnis von insgesamt 4 als Patzer.
spell.doom.enhancedescr=Auch ein Ergebnis von 5 zählt als Patzer.
spell.earthquake.descr=Ein Erdbeben erschüttert den Wirkungsbereich. Gebäude erleiden Schaden in Höhe von 50 Punkten, \
  während Wesen eine Akrobatik-Probe gegen 35 gelingen muss, um nicht zu Boden zu fallen und als liegend zu gelten.
spell.earthquake.enhancedescr=Der Schaden gegen Gebäude erhöht sich auf 60, die Schwierigkeit der Akrobatik-Probe auf 40.
spell.earthtomud.descr=Im Wirkungsbereich befindliche Erde verwandelt sich in Schlamm und wird zu Schwierigem Gelände. \
  Der Boden trocknet nach Wirken des Zaubers auf natürliche Weise.
spell.earthtomud.enhancedescr=Erde im Wirkungsbereich wird zu Sehr Schwierigem Gelände.
spell.easytarget.descr=Die Verteidigung des Ziels wird um 2 Punkte gesenkt.
spell.easytarget.enhancedescr=Die Verteidigung wird um 3 Punkte gesenkt.
spell.electricityprotection.descr=Der Zauberer erhält eine Schadensreduktion in Höhe von 6 Punkten gegen Elektrizitätsschaden.
spell.electricityprotection.enhancedescr=Die Schadensreduktion erhöht sich auf 8 Punkte.
spell.elementalprotection.descr=Der Zauberer erhält eine Schadensreduktion in Höhe von 10 Punkten gegen Feuer-, Fels-, \
  Elektrizitäts-, Wind-, Säure-, Wasser- und Kälteschaden.
spell.elementalprotection.enhancedescr=Die Schadensreduktion erhöht sich auf 12 Punkte.
spell.enchantprojectile.descr=Der Schaden von bis zu fünf Geschossen erhöht sich um jeweils 2 Punkte. Während des \
  Abschussvorgangs unterliegen die Geschosse nicht den Regeln zur maximalen Wirkungsweite kanalisierter Zauber. \
  Dieser Zauber ist nicht mit anderen Zaubern kombinierbar, die ebenfalls die Typen Schaden und Waffe aufweisen.
spell.enchantprojectile.enhancedescr=Der Schaden erhöht sich um insgesamt 3 Punkte.
spell.encrypt.descr=Der Zauberer macht ein Schriftstück von einer Seite unlesbar, Buchstaben erscheinen verschwommen \
  oder wild durcheinander gewürfelt. Wird ein von ihm bestimmtes Losungswort gesprochen, nimmt der Text wieder seine ursprüngliche Form an.
spell.encrypt.enhancedescr=Es wird ein ganzes Buch unlesbar gemacht.
spell.endofway.descr=Ein Leichnam wird dauerhaft vor unheiligen Schändungen geschützt. Ihn betreffende Zauber der \
  Typen Geisterwesen oder Nekromantie erhalten einen Malus in Höhe von 4 Punkten.
spell.endofway.enhancedescr=Der Malus erhöht sich auf 6 Punkte.
spell.endtransformation.descr=Alle momentan auf das Ziel wirkenden Verwandlungszauber werden aufgehoben, solange sie maximal Grad 3 aufweisen.
spell.endtransformation.enhancedescr=Es werden Zauber bis Grad 5 aufgehoben.
spell.enhanceconst.descr=Für die Bestimmung einer Überanstrengung gilt die Konstitution des Zauberers als um 2 \
  Punkte erhöht. Zähigkeit-Proben zur Abwehr des Zustands Erschöpft erhalten einen Bonus in Höhe von 2 Punkten.
spell.enhanceconst.enhancedescr=Die Konstitution gilt für Überanstrengung als um 3 Punkte erhöht. \
  Der Bonus auf Zähigkeit-Proben steigt auf 3 Punkte.
spell.enhancedefenses.descr=Der Zauberer erhält einen Bonus in Höhe von jeweils 2 Punkten auf seine Widerstandswerte.
spell.enhancedefenses.enhancedescr=Der Bonus erhöht sich auf 3 Punkte.
spell.enhancehealing.descr=Die Regeneration der Lebenspunkte in der nächsten Ruhephase wird um 5 Punkte erhöht.
spell.enhancehealing.enhancedescr=Es werden in der nächsten Ruhephase insgesamt 10 zusätzliche Lebenspunkte regeneriert.
spell.enhancehearing.descr=Der Zauberer erhält einen Bonus in Höhe von 3 Punkten auf jede Wahrnehmung-Probe, die sein Gehör betrifft.
spell.enhancehearing.enhancedescr=Der Bonus erhöht sich auf 5 Punkte.
spell.enhanceitem.descr=Die Gegenstandsqualität eines Objekts erhöht sich um 2 Punkte.
spell.enhanceitem.enhancedescr=Die Gegenstandsqualität erhöht sich um insgesamt 4 Punkte.
spell.enhancesenses.descr=Der Zauberer erhält einen Bonus in Höhe von 5 Punkten auf jede Wahrnehmung-Probe.
spell.enhancesenses.enhancedescr=Der Bonus erhöht sich auf 7 Punkte.
spell.enhancesight.descr=Der Zauberer erhält einen Bonus in Höhe von 3 Punkten auf jede Wahrnehmung-Probe, die seine Sicht betrifft.
spell.enhancesight.enhancedescr=Der Bonus erhöht sich auf 5 Punkte.
spell.enhancevitality.descr=Der Zauberer erhält 6 zusätzliche Lebenspunkte, die im Falle erlittener Schadenspunkte \
  zuerst verbraucht werden. Es ist möglich, dadurch temporär über einen Vorrat an Lebenspunkten zu verfügen, der über \
  das natürliche Maximum hinausgeht (ebenso gelten die Regeln zu maximalen Boni auf abgeleitete Werte für diesen \
  Zauber nicht). Sollte der Zauberer bereits verwundet sein, gelten weiter seine aktuellen Wundabzüge. Der Zauber \
  endet automatisch, wenn die 6 zusätzlichen Lebenspunkte aufgebraucht wurden. Dieser Zauber ist nicht mit anderen \
  Zaubern kombinierbar, die ebenfalls die Typen Körper stärken und Leben besitzen.
spell.enhancevitality.enhancedescr=Der Zauberer erhält insgesamt 8 zusätzliche Lebenspunkte.
spell.enterghostworld.descr=Der Geist des Zauberers löst sich von seinem Körper, sodass er die Geisterwelt betreten \
  und mit ihren Bewohnern interagieren kann. Sein Leib fällt währenddessen in eine Trance. Endet der Zauber, \
  kehrt der Geist auf der Stelle zurück.
spell.enterghostworld.enhancedescr=Der Zauberer verfügt in der Geisterwelt über eine Schadensreduktion in Höhe von 5 Punkten.
spell.exhaustmagic.descr=8 unverbrauchte Fokuspunkte des Opfers gelten als erschöpft.
spell.exhaustmagic.enhancedescr=Es werden 12 Fokuspunkte betroffen.
spell.exorcisefairy.descr=Ein Wesen des Typus Feenwesen wird zurück in die Feenwelt geworfen. \
  Innerhalb dieser kann der Zauber nicht angewandt werden.
spell.exorcisefairy.enhancedescr=Ein zweites Wesen gleichen oder niedrigeren Körperlichen Widerstands kann gebannt werden.
spell.faint.descr=Das Ziel erhält einen Malus in Höhe von 1 Punkt auf alle Proben, in die seine Stärke einfließt.
spell.faint.enhancedescr=Der Malus erhöht sich auf 2 Punkte.
spell.falseface.descr=Das Gesicht des Zauberers wird durch das einer zufälligen anderen Person ersetzt. Sobald der \
  Zauberer redet oder Grimassen schneidet, kann die Illusion mit einer Wahrnehmung-Probe gegen 21 durchschaut werden.
spell.falseface.enhancedescr=Der Zauberer kann das Gesicht einer ihm vom Aussehen her bekannten Person vortäuschen.
spell.falsifyinsight.descr=Die Gedanken des Zauberers werden um einen zufälligen Strom aus Bildern und Erinnerungen \
  ergänzt, wodurch Erkenntniszauber vom Typus Gedanken einen Malus in Höhe von 10 Punkten erhalten, wenn sie gegen \
  den Geistigen Widerstand des Zauberers gerichtet sind. Die Existenz des täuschenden Zaubers kann nur mit einer \
  gelungenen Wahrnehmung-Probe gegen 30 bemerkt werden.
spell.falsifyinsight.enhancedescr=Der Malus erhöht sich auf 15 Punkte.
spell.farsight.descr=Der Zauberer kann einen bis zu 10 Kilometer entfernten Ort sehen, hören und riechen, als wäre er \
  dort. Eine Interaktion ist jedoch nicht möglich. Es können nur solche Plätze ausgewählt werden, die von der \
  Position des Zauberers aus sichtbar sind. Auch lassen sich weder der genaue Punkt noch die Blickrichtung \
  verändern, nachdem der Zauber einmal gewirkt wurde. Während der Wirkungsdauer ist der Zauberer nicht dazu \
  in der Lage, sein Umfeld wahrzunehmen.
spell.farsight.enhancedescr=Der Zauberer ist dazu in der Lage, während der Wirkungsdauer sein Umfeld wahrzunehmen.
spell.fear.descr=Das Ziel erhält den Zustand Angsterfüllt.
spell.fear.enhancedescr=Das Ziel ist nicht in der Lage, den Zauberer anzugreifen. Dieser Effekt hält genauso lange \
  an wie der Zustand Angsterfüllt.
spell.featherfall.descr=Erleidet der Zauberer Fallschaden, wird dieser um eine Stufe gesenkt. Die Begrenzung für \
  die Abfederung eines Sturzes (siehe S. 174) zählt hierbei nicht.
spell.featherfall.enhancedescr=Fallschaden wird um 2 Stufen gesenkt.
spell.findwater.descr=Der Zauberer erfährt die Richtung der nächsten Quelle trinkbaren Wassers.
spell.findwater.enhancedescr=Der Zauberer erfährt zusätzlich die Entfernung der nächsten Trinkwasserquelle.
spell.fireball.descr=Der Zauberer schleudert einen Feuerball auf einen Zielpunkt, der bei Aufprall explodiert und jedem \
  Wesen und Objekt in 5 m Umkreis 2W10 Punkte Feuerschaden zufügt.
spell.fireball.enhancedescr=Die Ziele erhalten zusätzlich für 30 Ticks den Zustand Brennend 2.
spell.firecone.descr=Ein Flammenkegel schießt vom Zauberer aus nach vorne und richtet bei allen Wesen und Objekten, \
  die sich innerhalb des Flammenkegels aufhalten, 2W6 Punkte Feuerschaden an. Der Flammenkegel ist am Ort seines \
  Entstehens einen halben Meter breit und wächst mit jedem Meter, den er sich vom Zauberer entfernt, um einen weiteren \
  halben Meter in die Breite, bis zu einem Maximum von 3 Metern Breite. Wird die Reichweite des Flammenkegels \
  vergrößert, wächst er entsprechend langsamer in die Breite.
spell.firecone.enhancedescr=Getroffene Wesen und Objekte erhalten zusätzlich für 15 Ticks den Zustand Brennend 2.
spell.firelance.descr=Der Zauberer wirft einen Feuerstrahl auf einen Gegner. Der Getroffene erleidet 2W6+5 Punkte Feuerschaden.
spell.firelance.enhancedescr=Das Ziel erhält zusätzlich für 30 Ticks den Zustand Brennend 1.
spell.fireprotection.descr=Der Zauberer erhält eine Schadensreduktion in Höhe von 4 Punkten gegen Feuerschaden. \
  Die Hitzestufe (S. 174) gilt für ihn als um 1 reduziert.
spell.fireprotection.enhancedescr=Die Schadensreduktion erhöht sich auf 6 Punkte.
spell.fireshield.descr=Der Zauberer umgibt sich mit einem Schild aus lodernden Flammen. Während er selbst nicht davon \
  beeinträchtigt wird, erleidet jedes Wesen, das sich ihm für länger als 15 Ticks auf 2 Meter nähert, für 15 Ticks \
  den Zustand Brennend 2.
spell.fireshield.enhancedescr=Die nötige Zeit der Nähe wird auf 5 Ticks reduziert.
spell.fistofstone.descr=Eine Hand des Zauberers verwandelt sich in Stein. Seine waffenlosen Nahkampfangriffe verursachen\
   dadurch echten Schaden statt Betäubungsschaden, außerdem erhält er im Handgemenge das Waffenmerkmal Defensiv 1 \
  (S. 186). Dieser Zauber ist nicht mit anderen Zaubern des Typus Hand kombinierbar.
spell.fistofstone.enhancedescr=Zusätzlich richtet der Zauberer im unbewaffneten Nahkampf 2 Punkte echten Felsschaden an.
spell.flame.descr=Eine Flamme entsteht in der Hand des Zauberers oder auf einem Objekt, mit der etwa eine Pfeife \
  entzündet werden kann. Größere Objekte lassen sich mit diesem Zauber nicht anzünden.
spell.flame.enhancedescr=Es kann mit dem richtigen Material auch bis zur Größe eines Lagerfeuers Feuer entzündet werden.
spell.flamingweapon.descr=Eine Waffe wird mit Flammen überzogen. Sie leuchtet fackelhell und richtet 1 Punkt \
  zusätzlichen Feuerschaden an, ohne dabei den Träger einzuschränken. Dieser Zauber ist nicht mit anderen Zaubern \
  kombinierbar, die ebenfalls die Typen Schaden und Waffe aufweisen.
spell.flamingweapon.enhancedescr=Die Klinge richtet 2 Punkte Feuerschaden an.
spell.flash.descr=Der Zauberer schleudert dem Ziel einen sengenden Lichtstrahl entgegen, der 2W6 Punkte Lichtschaden \
  verursacht. Zudem erhält das Opfer für 30 Ticks den Zustand Geblendet 1.
spell.flash.enhancedescr=Der Zustand wird auf Geblendet 2 erhöht.
spell.fly.descr=Der Zauberer erhebt sich in die Lüfte und kann sich mit einer Geschwindigkeit fortbewegen, \
  die seiner doppelten Mystik entspricht.
spell.fly.enhancedescr=Die Geschwindigkeit entspricht seiner vierfachen Mystik.
spell.flyingweapon.descr=Die Waffe wird durch die Kraft des Windes beflügelt, was Angriffe mit ihr leichter macht. \
  Der Benutzer der Waffe erhält einen Bonus in Höhe von 2 Punkten auf seine Proben für Angriffe mit dieser Waffe.
spell.flyingweapon.enhancedescr=Der Bonus erhöht sich auf 3 Punkte.
spell.fogshape.descr=Der Zauberer verwandelt sich in eine Gestalt aus Nebel und vermag sich selbst durch kleinste \
  Ritzen zu zwängen. Er erhält die Merkmale Körperlos und Verwundbarkeit gegen Feuerschaden (siehe S. 265). Seine \
  Geschwindigkeit in dieser Form entspricht seiner Mystik. Kleidung und Ausrüstung sind nicht von der \
  Verwandlung betroffen.
spell.fogshape.enhancedescr=Gegenstände bis Last 4 werden mitverwandelt.
spell.fortune.descr=Der Zauberer erhält für seinen nächsten Wurf einen Bonus in Höhe von 1 Punkt.
spell.fortune.enhancedescr=Der Bonus erhöht sich auf 2 Punkte.
spell.freeze.descr=Das Ziel erleidet 1W6+3 Punkte Kälteschaden und erhält für 30 Ticks den Zustand Lahm.
spell.freeze.enhancedescr=Das Ziel erhält zusätzlich für 30 Ticks den Zustand Benommen 1.
spell.geas.descr=Der Zauberer gibt dem Ziel eine einzelne Anweisung, jeder Verstoß dagegen verursacht 4W6 Punkte \
  Schaden. Handelt es sich um einen längerfristigen Auftrag, wird der Schaden am Ende jeden Tages verursacht, an dem \
  das Ziel sich nicht zumindest bemüht, auf dessen Erfolg hinzuwirken.
spell.geas.enhancedescr=Der Zauberer kann zwei miteinander verknüpfte Anweisungen geben, wodurch es jedoch nicht zu \
  einer Verdoppelung des Schadens kommt.
spell.ghostdagger.descr=Der Zauberer erschafft eine durchscheinende Waffe mit den Werten eines Dolchs.
spell.ghostdagger.enhancedescr=Der Schaden der Waffe erhöht sich um 1 Punkt. Diese Verstärkung wirkt nicht, \
  wenn der Zauber mit Zaubern kombiniert wird, die die Typen Schaden und Waffe aufweisen.
spell.ghostsight.descr=Der Zauberer kann seinen parallelen Standort in der Geisterwelt sehen, hören und riechen, \
  als wäre er dort. Eine Interaktion ist jedoch nicht möglich. Während der Wirkungsdauer ist der Zauberer nicht \
  dazu in der Lage, sein Umfeld wahrzunehmen.
spell.ghostsight.enhancedescr=Der Zauberer ist dazu in der Lage, während der Wirkungsdauer sein Umfeld wahrzunehmen.
spell.glare.descr=Vor den Augen des Ziels blitzt ein grelles Licht auf, welches ihm den Zustand Geblendet 1 verleiht.
spell.glare.enhancedescr=Das Ziel erhält den Zustand Geblendet 2.
spell.growth.descr=Der Zauberer lässt eine Pflanze bis zur Größe eines Busches innerhalb von 1 Minute bis hin zu ihrer \
  natürlichen Größe wachsen und reifen. Dadurch kann etwa ein Durchgang verborgen, Nahrung zur Reife gebracht \
  oder eine Kletterhilfe geschaffen werden.
spell.growth.enhancedescr=Die Pflanze wächst bis zum Anderthalbfachen ihrer natürlich Größe an.
spell.gushofwater.descr=Ein 2 Meter breiter Wasserschwall richtet bei allen Wesen, die sich zwischen dem Zauberer und \
  dem Zielpunkt befinden, 2W6 Punkte Wasser-Betäubungsschaden an. Die getroffenen müssen eine Akrobatik- oder \
  Athletik-Probe gegen 15 (erhöht um die Fertigkeitspunkte des Zauberers) ablegen, um nicht vom Aufprall \
  umgeworfen zu werden und als liegend zu gelten.
spell.gushofwater.enhancedescr=Getroffene Wesen erhalten zusätzlich für 30 Ticks den Zustand Benommen 1.
spell.gustofwind.descr=Der Zauberer beschwört einen konstanten und etwa 10 m weit reichenden Windstoß, der von ihm \
  selbst ausgeht und stark genug ist, ein kleines Segelboot langsam anzutreiben. Wird er gegen ein Wesen gerichtet, \
  muss diesem alle 10 Ticks eine Akrobatik-Probe gegen 20 gelingen, um nicht umgestoßen zu werden und als liegend zu gelten.
spell.gustofwind.enhancedescr=Der Zauberer kann die Richtung des Stoßes während der Wirkungsdauer beliebig verändern.
spell.haircolor.descr=Das Haupthaar oder -fell des Zauberers nimmt die von ihm gewünschten Farben an.
spell.haircolor.enhancedescr=Auch die restliche Körperbehaarung kann verändert werden.
spell.hallucination.descr=Die Wahrnehmung des Ziels wird um eine einzelne vom Zauberer bestimmte Halluzination ergänzt, \
  die nicht von der Realität unterschieden werden kann. Hierbei kann nicht das gesamte Umfeld verändert werden, \
  sondern der Umgebung nur etwas hinzugefügt werden. Die Halluzination darf nicht größer als menschengroß sein und \
  kann keine Geräusche machen, sich aber bewegen. Entsprechend kann beispielsweise die Illusion einer verfolgenden \
  Riesenspinne geschaffen werden, nicht aber einer sich mit dem Opfer unterhaltenden Person. Dieser Zauber benötigt \
  weder Formel noch Geste.
spell.hallucination.enhancedescr=Es kann eine zweite Halluzination erschaffen werden.
spell.handoffire.descr=Die Hand des Zauberers wird mit Flammen überzogen, so dass sie fackelhell leuchtet. Im \
  unbewaffneten Nahkampf richtet der Zauber echten Feuerschaden an und hat mit seinen waffenlosen Angriffen das \
  Waffenmerkmal Scharf 2 (S. 186), ohne dass er dabei selbst eingeschränkt ist. Dieser Zauber ist nicht mit \
  anderen Zaubern des Typus Hand kombinierbar.
spell.handoffire.enhancedescr=Die Hand leuchtet nicht so hell wie eine Fackel, sondern so hell wie ein Lagerfeuer. \
  Der Schaden erhöht sich um 2 Punkte echten Feuerschaden.
spell.harden.descr=Die Härte eines unbelebten Objekts erhöht sich um 1 Punkt.
spell.harden.enhancedescr=Die Härte erhöht sich um insgesamt 2 Punkte.
spell.harmitem.descr=Ein unbelebtes Objekt erleidet 5 Schadenspunkte.
spell.harmitem.enhancedescr=Der Schaden erhöht sich auf 10 Punkte.
spell.healing.descr=Der Zauber regeneriert 16 Lebenspunkte.
spell.healing.enhancedescr=Es werden insgesamt 24 Lebenspunkte regeneriert.
spell.heat.descr=Die Hitzestufe erhöht sich für den Zauberer um 1 Stufe bzw. die Kältestufe sinkt um 1 Stufe.
spell.heat.enhancedescr=Die Hitzestufe erhöht bzw. die Kältestufe senkt sich um insgesamt 2 Stufen.
spell.heatmetal.descr=Ein metallenes Objekt erhitzt sich so stark, dass eine ausreichend lange Berührung den gleichen Schaden mit sich bringt wie Brandschaden der Stufe 1.
spell.heatmetal.enhancedescr=Der Schaden entspricht Brandschaden der Stufe 2.
spell.heatsurrounding.descr=Die Hitzestufe erhöht sich um 3 Stufen.
spell.heatsurrounding.enhancedescr=Die Hitzestufe erhöht sich um insgesamt 5 Stufen.
spell.heavylimbs.descr=Das Ziel kann seine Arme nur schwer heben. Alle seine Proben für Nahkampfangriffe und \
  Fernkampfangriffe erhalten einen Malus in Höhe von 2 Punkten.
spell.heavylimbs.enhancedescr=Der Malus erhöht sich auf 3 Punkte.
spell.hush.descr=Das Ziel verliert seine Stimme und kann auch keine anderen Laute verursachen, die darauf basieren. In \
  Bezug auf das Wirken von Zaubern gelten hierdurch die Regeln zur weggelassenen Komponente Formel (S. 198).
spell.hush.enhancedescr=Ein zweites Wesen gleichen oder niedrigeren Geistigen Widerstands verstummt.
spell.icelance.descr=Der Zauberer wirft eine Lanze aus scharfkantigen Eiskristallen auf das Ziel. Der Getroffene \
  erleidet 2W10 Punkte Kälteschaden und den Zustand Lahm für 30 Ticks.
spell.icelance.enhancedescr=Der Zauberer wirft zeitgleich eine weitere Eislanze auf ein zweites Ziel, \
  das maximal so viel Punkte Verteidigung wie das Hauptziel besitzt.
spell.iceprison.descr=Der Zauberer erschafft um das Ziel eine trübe und unbewegliche Kuppel aus Eis mit einem Radius \
  von bis zu 3 Metern. Sie weist eine Härte von 5 und eine Haltbarkeit von 24 auf, kann also zerstört werden.
spell.iceprison.enhancedescr=Die Kältestufe erhöht sich innerhalb der Kuppel um 2 Stufen.
spell.ignorepain.descr=Der Zauberer wird beinahe unempfindlich gegen Schmerzen. Eventuelle Wundabzüge sinken um 6 Punkte.
spell.ignorepain.enhancedescr=Die Wundabzüge sinken um 8 Punkte.
spell.incinerate.descr=Das Ziel des Zaubers wird von einer explosiven Flammenwolke eingehüllt und erleidet \
  dadurch 2W6 Punkte Feuerschaden. Außerdem erhält es für 30 Ticks den Zustand Brennend 3.
spell.incinerate.enhancedescr=Das Ziel erhält statt dem normalen Zustand für 45 Ticks den Zustand Brennend 4.
spell.inconspicuousness.descr=Der Zauberer wird so unauffällig, dass vorbeikommende Personen achtlos an ihm vorbeigehen \
  und er sich durch Volksmassen bewegen kann, ohne bemerkt zu werden. Der Zauber hilft nur eingeschränkt, wenn \
  gezielt nach dem Zauberer gesucht wird oder Personen besonders aufmerksam auf alle Passanten achten \
  (wie etwa Wachen am Burgtor), gibt dann jedoch einen Bonus in Höhe von 2 Punkten auf Heimlichkeit-Proben.
spell.inconspicuousness.enhancedescr=Der Bonus steigt auf 3 Punkte.
spell.increaseattitude.descr=Der Zauberer verbessert die Einstellung des Ziels gegenüber einer von ihm bestimmten \
  Person, Idee oder Sache um 1 Stufe (maximal auf Aufgeschlossen). Dieser Zauber benötigt weder Formel noch Geste.
spell.increaseattitude.enhancedescr=Die Einstellung verbessert sich um insgesamt 2 Stufen (maximal auf Hilfsbereit).
spell.increasemorale.descr=Die Moral des Ziels wird einer vom Zauberer benannten Unternehmung gegenüber erhöht. \
  Dadurch wird es immun gegen den Zustand Angsterfüllt, wenn es ihm noch nicht unterliegt.
spell.increasemorale.enhancedescr=Das Ziel wird zusätzlich immun gegen den Zustand Panisch, wenn es ihm noch nicht unterliegt.
spell.indestructible.descr=Ein unbelebtes Objekt kann nicht mehr beschädigt oder zerstört werden. Es erhält seine \
  übliche Verformbarkeit bei, ebenso wie sein Gewicht. Auf die Schutzwirkung von Rüstungen oder den Schaden von Waffen \
  hat dieser Zauber keine Auswirkungen.
spell.indestructible.enhancedescr=Sollte es sich um eine Rüstung handeln, steigt außerdem deren Schadensreduktion um 1 Punkt.
spell.inflame.descr=Ein unbelebtes und auf natürlichem Wege brennbares Objekt erhält für 30 Ticks den Zustand Brennend 1.
spell.inflame.enhancedescr=Der Zustand endet nicht nach 30 Ticks, sondern erst wenn das Objekt verbrannt ist oder \
  das Feuer gelöscht wurde.
spell.innerglow.descr=Der Zauberer hat durch ein sanftes inneres Leuchten eine gute Wirkung auf andere. Dadurch \
  erhält er einen Bonus in Höhe von 4 Punkten auf alle Proben, in die seine Ausstrahlung einfließt.
spell.innerglow.enhancedescr=Der Bonus erhöht sich auf 5 Punkte.
spell.interferespell.descr=Führt das Ziel gerade einen Zaubervorgang durch, wird die Zauberdauer um 4 Ticks verlängert. \
  Bricht es den Vorgang ab, entfällt die Verlängerung.
spell.interferespell.enhancedescr=Die Zauberdauer des Ziels wird um 5 Ticks verlängert.
spell.invisibility.descr=Der Zauberer wird unsichtbar, hinterlässt jedoch weiterhin Spuren und verursacht Geräusche. \
  Ausrüstung und Waffen werden von der Unsichtbarkeit eingeschlossen, sofern sie am Körper getragen oder \
  in der Hand gehalten werden.
spell.invisibility.enhancedescr=Ein durchgehend berührter Gegenstand bis zu der Größe einer Kutsche wird von der \
  Unsichtbarkeit eingeschlossen.
spell.ironaura.descr=Der Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner Wahl \
  erhalten jeweils einen Bonus in Höhe von 2 Punkten auf die Verteidigung. Die Boni gelten nur während des Aufenthalts im Wirkungsbereich.
spell.ironaura.enhancedescr=Es können bis zu fünf Wesen bestimmt werden.
spell.leap.descr=Die normale Grund-Sprungweite des Abenteurers wird für einen Sprung verdreifacht.
spell.leap.enhancedescr=Die Grund-Sprungweite wird verfünffacht.
spell.leaplegs.descr=Die normale Grund-Sprungweite des Abenteurers wird um 50% erhöht.
spell.leaplegs.enhancedescr=Die Grund-Sprungweite wird verdoppelt.
spell.leavenotrace.descr=Der Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner Wahl\
   hinterlassen kaum eine Fährte. Jagdkunst-Proben zu ihrer Verfolgung erhalten einen Malus in Höhe von 6 Punkten. \
  Dieser gilt nur für Spuren, die innerhalb des Wirkungsbereichs hinterlassen wurden.
spell.leavenotrace.enhancedescr=Es können bis zu fünf Personen bestimmt werden.
spell.levitate.descr=Der Zauberer beginnt zu schweben und kann sich mit einer Geschwindigkeit von 1 fortbewegen. \
  Es ist ihm dabei nicht möglich, höher als 10 Meter aufzusteigen.
spell.levitate.enhancedescr=Die Geschwindigkeit erhöht sich auf 2, die Maximalhöhe auf 15 Meter.
spell.lifedrain.descr=Der Zauberer entzieht einem Opfer 3W6+5 Lebenspunkte und überträgt sie auf ein Wesen seiner \
  Wahl. Beide Ziele müssen gleichzeitig berührt werden. Die Lebenspunkte können auf diesem Wege nicht über \
  das natürliche Maximum hinaus angehoben werden.
spell.lifedrain.enhancedescr=Die Anzahl der entzogenen Lebenspunkte erhöht sich auf 4W6+5.
spell.liftburden.descr=Der Zauberer kann bis zu 6 Punkte Last auf telekinetischem Weg tragen.
spell.liftburden.enhancedescr=Der Zauberer kann insgesamt bis zu 8 Punkte Last tragen.
spell.light.descr=Der Zauberer verbreitet einen sanften Schein, der die Lichtverhältnisse um 1 Stufe verbessert.
spell.light.enhancedescr=Die Lichtverhältnisse verbessern sich um insgesamt 2 Stufen.
spell.lightban.descr=Ein einzelner Lichtzauber wird aufgehoben, solange er maximal Grad 3 aufweist. Handelt es sich um \
  einen Zauber mit Wirkungsbereich, genügt es, wenn sich ein Teil von diesem innerhalb der Reichweite befindet.
spell.lightban.enhancedescr=Es wird ein Zauber bis Grad 5 aufgehoben.
spell.lightningbolt.descr=Der Zauberer wirft seinem Ziel einen Blitz entgegen. Der Getroffene erleidet 2W10+2 Punkte Elektrizitätsschaden mit dem Waffenmerkmal Scharf 2 (S. 186).
spell.lightningbolt.enhancedescr=Das Ziel erhält zusätzlich für 30 Ticks den Zustand Benommen 1.
spell.lightweapon.descr=Der Schaden einer mit diesem Zauber belegten Waffe erhöht sich um 1 Punkt Lichtschaden. \
  Angriffe mit ihr sind um 2 Punkte erleichtert, wenn sie gegen Wesen der Typen Untoter, Geisterwesen oder Schattenwesen \
  durchgeführt werden.Außerdem verbessert sie die Lichtverhältnisse im Umkreis von 5 Metern um 1 Stufe. Dieser Zauber \
  ist nicht mit anderen Zaubern kombinierbar, die ebenfalls die Typen Schaden und Waffe aufweisen.
spell.lightweapon.enhancedescr=Der Zusatzschaden erhöht sich auf 2 Punkte Lichtschaden, die Lichtverhältnisse verbessern sich um insgesamt 2 Stufen.
spell.lightweight.descr=Die Last eines Objekts wird um 2 Stufen gesenkt.
spell.lightweight.enhancedescr=Die Last wird um insgesamt 3 Stufen gesenkt.
spell.lookinsun.descr=Der Zauberer ist immun gegen den Zustand Geblendet, wenn dieser aus der Einwirkung von natürlichem Licht oder Lichtmagie resultiert.
spell.lookinsun.enhancedescr=Der Zauberer ist komplett immun gegen den Zustand Geblendet.
spell.magicblow.descr=Das Ziel wird von einem unsichtbaren magischen Angriff getroffen und \
  erleidet 1W6+1 Punkte Schaden. Schadensreduktion wirkt gegen diesen Zauber nicht.
spell.magicblow.enhancedescr=Das Ziel erhält zusätzlich für 30 Ticks den Zustand Erschöpft 1.
spell.magicchain.descr=Dem Geist des Ziels fällt es schwerer, seinen Körper zu Bewegungen anzuregen, \
  wodurch alle auf Beweglichkeit beruhenden Proben einen Malus in Höhe von 2 Punkten erhalten.
spell.magicchain.enhancedescr=Der Malus erhöht sich auf 3 Punkte.
spell.magiccompass.descr=Der Zauberer erkennt intuitiv die Himmelsrichtungen, wodurch er einen Bonus in Höhe \
  von 2 Punkten auf alle Proben zur Orientierung erhält.
spell.magiccompass.enhancedescr=Der Bonus erhöht sich auf 3 Punkte.
spell.magicdialogue.descr=Der Zauberer kann einem einzelnen und beim Zaubervorgang bestimmten Ziel gedankliche \
  Botschaften in Form von Worten übertragen, sodass ein Gespräch möglich ist, wenn beide Seiten den Zauber \
  beherrschen und wirken. Er muss das Ziel entweder kennen oder sehen. Dieser Zauber benötigt keine Formel.
spell.magicdialogue.enhancedescr=Zusätzlich zu Worten können auch Bilder übermittelt werden.
spell.magicfeint.descr=Die Bewegungen des Zauberers werden durch verwirrende Illusionen überlagert. Während der \
  Wirkungsdauer können keinerlei Gelegenheitsangriffe gegen ihn durchgeführt werden. Das Fokussieren der Magie für \
  diesen Zauber provoziert ebenfalls keine Gelegenheitsangriffe.
spell.magicfeint.enhancedescr=Normale Angriffe gegen den Zauberer erhalten einen Malus in Höhe von 1 Punkt.
spell.magickeyhole.descr=Der Zauberer kann durch eine bis zu 20 cm dicke Wand sehen, als ob es sich um dünnes milchiges Glas handelt.
spell.magickeyhole.enhancedescr=Der Zauberer kann durch bis zu 1 m Wand hindurchschauen.
spell.magiclock.descr=Der Zauberer verstärkt ein Schloss, dessen Stufe um 1 Stufe ansteigt und damit schwieriger zu öffnen ist.
spell.magiclock.enhancedescr=Die Qualität erhöht sich um insgesamt 2 Stufen.
spell.magicmessage.descr=Der Zauberer übermittelt dem Ziel eine gedankliche Botschaft aus maximal 5 Worten. \
  Er muss das Ziel entweder kennen oder sehen. Das Ziel hört die Botschaft in der Stimme des Zauberers.
spell.magicmessage.enhancedescr=Es können maximal 15 Worte übermittelt werden.
spell.magicquill.descr=Eine Schreibfeder notiert alles, was der Zauberer sagt. Pergament und Tinte werden \
  normal verbraucht. Wird die Feder erneut berührt, endet der Zauber.
spell.magicquill.enhancedescr=Die Feder vermag zusätzlich Bilder nach einer Beschreibung zu zeichnen. \
  Die Qualität hängt von einer Edelhandwerk-Probe des Zauberers ab.
spell.magnetism.descr=Der Boden im Wirkungsbereich wird stark magnetisch. Kampfhandlungen mit Metallwaffen erhalten \
  einen Malus in Höhe von 4 Punkten, zudem verdoppelt sich die Behinderung von Metallrüstungen.
spell.magnetism.enhancedescr=Der Malus erhöht sich auf 5 Punkte.
spell.majorbanspell.descr=Alle auf dem Ziel liegenden Zauber werden aufgehoben. Ist das Ziel ein beschworenes Wesen, \
  wird es zusätzlich zurück in seine Domäne geworfen. Handelt es sich um einen Zauber mit Wirkungsbereich, genügt es, \
  wenn sich ein Teil von diesem innerhalb der Reichweite befindet. Handelt es sich bei dem Ziel um ein Artefakt bis \
  maximal Artefaktqualität 5, so wird die Wirkung des Artefaktes für 30 Minuten blockiert.
spell.majorbanspell.enhancedescr=Die Auswirkungen des Zauber erstrecken sich auf bis zu 2 Ziele.
spell.majorblessing.descr=Das Ziel erhält einen Bonus in Höhe von 2 Punkten auf alle Fertigkeitsproben und Widerstandswerte.
spell.majorblessing.enhancedescr=Der Bonus erhöht sich auf 3 Punkte.
spell.majormagicarmor.descr=Der Zauberer umhüllt seinen Körper mit einer schimmernden, aber sehr widerstandsfähigen \
  Schicht aus purer Magie, die seine Verteidigung um 4 Punkte erhöht. Dieser Zauber ist nicht mit anderen \
  Zaubern kombinierbar, die ebenfalls die Typen Rüstung und Schutzfeld besitzen.
spell.majormagicarmor.enhancedescr=Die Erhöhung beträgt 5 Punkte.
spell.majorprotectmagic.descr=Alle gegen das Ziel gerichteten Zauber erhalten einen Malus in Höhe von 4 Punkten.
spell.majorprotectmagic.enhancedescr=Malus erhöht sich auf 6 Punkte.
spell.manipulatememory.descr=Erinnerungen, die bis zu einer Stunde zurückliegen, werden nach Belieben des Zauberers verändert.
spell.manipulatememory.enhancedescr=Die Erinnerungen dürfen bis zu einer Woche zurückliegen.
spell.masquerade.descr=Der Zauberer verändert illusionär seine gesamte Gestalt und übernimmt das Aussehen einer anderen \
  Person. Die Verkleidung erstreckt sich auf alle optischen Eigenheiten der imitierten Person, die dem Zauberer bekannt \
  sind. Ein Muttermal am Oberschenkel ist beispielsweise nicht betroffen, wenn der Zauberer das Ziel nur mit langen \
  Hosen gesehen hat. Ist die Person einem Gegenüber gut bekannt, vermag dieser die Täuschung zu erkennen, wenn er den \
  Zauberer mindestens 5 Minuten beobachten kann und ihm eine Probe auf Wahrnehmung gegen 33 gelingt. Die falsche \
  Stimme kann den Zauberer auch ohne Probe gegenüber Bekannten der Person entlarven.
spell.masquerade.enhancedescr=Die Maskerade erstreckt sich auch auf Stimme und Geruch, sofern sie dem Zauberer bekannt \
  sind. Ist die Person einem Gegenüber gut bekannt, vermag dieser die Täuschung zu erkennen, wenn er sich mindestens \
  5 Minuten lang mit dem Zauberer auseinandersetzt und ihm eine vergleichende Empathie-Probe gegen die Redegewandtheit \
  des Zauberers gelingt. 
spell.memorygap.descr=Sämtliche Erinnerungen an Ereignisse der vergangenen Stunde werden aus dem Gedächtnis des Ziels entfernt. 
spell.memorygap.enhancedescr=Sämtliche Erinnerungen an Ereignisse seit der letzten Ruhephase werden entfernt.
spell.meteor.descr=Ein Wurfgeschoss wird mit magischer Macht aufgeladen. Wird es anschließend geworfen, erleiden alle \
  Wesen und Objekte in 5 Metern Umkreis um den Aufprallort 1W6+3 Punkte Feuerschaden. Der Zauber endet automatisch \
  nach dem Auftreffen  oder nachdem die Wirkungsdauer verstrichen ist.
spell.meteor.enhancedescr=Die Ziele erhalten zusätzlich für 30 Ticks den Zustand Brennend 1.
spell.mightexplosion.descr=Der Zauberer greift seinen Gegner mit roher magischer Kraft an und verursacht \
  5W6 Punkte Schaden. Schadensreduktion wirkt gegen diesen Zauber nicht. Das Ziel erhält \
  für 30 Ticks den Zustand Erschöpft 2.
spell.mightexplosion.enhancedescr=Das Ziel erhält zusätzlich für 30 Ticks den Zustand Benommen 1.
spell.mindlessservant.descr=Der Zauberer unterwirft ein kulturschaffendes Wesen seinen Befehlen. Es folgt allen seinen \
  Anweisungen, sofern sie ihm nicht unmittelbar und unabwendbar den Tod bedeuten. Das Wesen bewegt sich nicht ohne \
  explizite Anweisung aus der Wirkungsweite des kanalisierten Zaubers (S. 195) hinaus. Mit diesem Zauber belegte Wesen \
  sind mit einer Empathie-Probe gegen 27 als von einem Beherrschungszauber beeinflusst erkennbar.
spell.mindlessservant.enhancedescr=Ein zweites Wesen gleichen oder niedrigeren Geistigen Widerstands kann beherrscht werden.
spell.minorhealing.descr=Der Zauber regeneriert 6 Lebenspunkte.
spell.minorhealing.enhancedescr=Es werden insgesamt 10 Lebenspunkte regeneriert.
spell.minormagicarmor.descr=Der Zauberer umhüllt seinen Körper mit einer schimmernden Schicht aus purer Magie, die \
  seine Verteidigung um 2 Punkte erhöht. Dieser Zauber ist nicht mit anderen Zaubern kombinierbar, die ebenfalls \
  die Typen Rüstung und Schutzfeld besitzen.
spell.minormagicarmor.enhancedescr=Die Erhöhung beträgt 3 Punkte.
spell.minorprotectmagic.descr=Gegen das Ziel gerichtete Zauber erhalten einen Malus in Höhe von 1 Punkt.
spell.minorprotectmagic.enhancedescr=Der Malus erhöht sich auf 2 Punkte.
spell.moldstone.descr=Der Zauberer kann 5 Kubikmeter Stein verformen, als handelte es sich um warmen Wachs. \
  Sollen spezifische Objekte gebildet werden, können Edelhandwerk-Proben verlangt werden.
spell.moldstone.enhancedescr=Es können weitere 5 Kubikmeter verformt werden.
spell.moveitem.descr=Der Zauberer kann einen Gegenstand bis Last 2, der nicht von einer anderen Person \
  kontrolliert wird, mit Hilfe seiner Geisteskraft und einer Geschwindigkeit von 1 durch die Luft bewegen oder \
  manipulieren. Dabei kann er nur einfache Bewegungen wie etwa das Drehen eines Schlüssels im Schloss durchführen, \
  nicht aber feinmotorische Tätigkeiten wie das Öffnen eines Schlosses mit einem Dietrich.
spell.moveitem.enhancedescr=Es kann ein Gegenstand bis Last 4 bewegt werden.
spell.nightvision.descr=Die Lichtverhältnisse verbessern sich für den Zauberer um 3 Stufen.
spell.nightvision.enhancedescr=Die Lichtverhältnisse verbessern sich um insgesamt 4 Stufen.
spell.objectillusion.descr=Der Zauberer kann ein Objekt als ein anderes ähnlicher Größe erscheinen lassen, etwa ein \
  Stück Rinde als Münze oder einen Stock als Schwert. Lediglich die Sicht ist von dem Zauber betroffen. \
  Das Objekt darf maximal eine Last von 4 aufweisen.
spell.objectillusion.enhancedescr=Auch die übrigen Sinne sind betroffen.
spell.onewithfire.descr=Der Körper des Zauberers verwandelt sich in eine lodernde Gestalt aus Feuer, \
  behält aber seine Statur bei. Er erhält einen Bonus in Höhe von 5 Punkten auf seine Schadensreduktion \
  und seine Berührungen richten bei ausreichender Dauer Brandschaden 3 an, während er selbst immun gegen Hitze- und \
  Feuerschaden ist. Kleidung und Ausrüstung sind nicht von der Verwandlung betroffen.
spell.onewithfire.enhancedescr=Gegenstände bis Last 4 werden mitverwandelt.
spell.panopticum.descr=Der Zauberer erschafft eine komplexe, bis zu 50 m² umfassende bewegte und alle Sinne bis auf \
  den Tastsinn betreffende Illusion. Dies kann beispielsweise ein aufmarschierendes Heer, eine Menschenmasse im \
  Thronsaal oder eine wütende Rinderherde sein. Der Zauber selbst unterliegt zwar den Regeln zur maximalen \
  Wirkungsweite kanalisierter Zauber (S. 195), es genügt jedoch, wenn der Zauberer sich nah genug an \
  einem Teil der Illusion befindet.
spell.panopticum.enhancedescr=Die Illusion kann bis zu 100 m² umfassen.
spell.paralysis.descr=Das Ziel erhält den Zustand Lahm.
spell.paralysis.enhancedescr=Ein zweites in Reichweite befindliches Ziel mit gleichem oder niedrigerem Körperlichen Widerstand kann verzaubert werden.
spell.peacefulness.descr=Der Zauberer strahlt ein überwältigendes Maß an Friedfertigkeit aus, sodass es einer \
  gelungenen Entschlossenheit-Probe gegen 35 bedarf, um einen Angriff gegen ihn auszuführen. Attackiert er einen Gegner von sich aus, verfällt die Wirkung des Zaubers auf den Angegriffenen.
spell.peacefulness.enhancedescr=Die Schwierigkeit beträgt 40.
spell.penetratefog.descr=Aus Nebel, Dampf und Wolken resultierende Abzüge auf die Sicht können ignoriert werden.
spell.penetratefog.enhancedescr=Der Zaubernde erhält sogar einen Bonus in Höhe von 2 Punkten auf \
  Wahrnehmung-Proben in nebliger Umgebung.
spell.petrify.descr=Das Ziel des Zaubers wird in unnatürlich harten Stein (Härte 8, Haltbarkeit 16) verwandelt. Es kann \
  seine Umwelt noch wahrnehmen, sich aber nicht mehr bewegen.
spell.petrify.enhancedescr=Die Härte steigt auf 10, die Haltbarkeit auf 20.
spell.phantasmagoria.descr=Der Zauberer erschafft eine statische Illusion bis maximal Größenklasse 6, die Sicht und Gehör betrifft.
spell.phantasmagoria.enhancedescr=Die Illusion kann auch bewegt sein.
spell.picklock.descr=Der Zauber öffnet ein maximal durchschnittliches Schloss.
spell.picklock.enhancedescr=Der Zauber öffnet ein maximal gutes Schloss.
spell.poisonprotection.descr=Der Zauberer erhält einen Bonus in Höhe von 3 Punkten auf seinen Körperlichen Widerstand gegen Vergiftungen.
spell.poisonprotection.enhancedescr=Der Bonus erhöht sich auf 4 Punkte.
spell.prophecy.descr=Der Zauberer erhält eine undeutliche Weissagung über die nahe Zukunft oder das Schicksal \
  einer Person, eines Gegenstands oder einer Unternehmung.
spell.prophecy.enhancedescr=Der Zauberer erhält eine deutlichere Weissagung.
spell.protectedbylight.descr=Der Zauberer und bis zu drei weitere bei Auslösung des Zaubers festgelegte Wesen seiner \
  Wahl werden durch die Kraft des Lichtes geschützt, solange sie sich im Wirkungsbereich des Zaubers aufhalten. \
  Wesen der Typen Schattenwesen, Untoter und Wesen der Finsternis müssen eine Entschlossenheit-Probe gegen 27 ablegen, \
  um sie angreifen zu können. Sollten diese Wesen ihrerseits angegriffen werden, müssen sie keine Probe ablegen.
spell.protectedbylight.enhancedescr=Eventuelle Angriffe oben genannter Wesen werden gegen die Nutznießer um 3 Punkte erschwert.
spell.protectinghand.descr=Der Zauberer erhält beim ersten Angriff, der während der Wirkungsdauer gegen ihn gerichtet \
  wird, einen Bonus in Höhe von 1 Punkt auf den passenden Widerstandswert.
spell.protectinghand.enhancedescr=Der Bonus erhöht sich auf 2 Punkte.
spell.protectmind.descr=Gegen Beherrschungszauber erhält das Ziel einen Bonus in Höhe von 3 Punkten auf seinen Geistigen Widerstand.
spell.protectmind.enhancedescr=Der Bonus erhöht sich auf 4 Punkte.
spell.puppet.descr=Der Zauberer übernimmt die Kontrolle über den Körper des Ziels und bestimmt dessen Handlungen. Seine \
  Sinne werden durch jene des Betroffenen ersetzt, während dieser zwar bei Bewusstsein bleibt und die Kontrolle über \
  seinen Geist behält, jedoch keine eigenständigen Tätigkeiten mehr vollführen kann. Mit diesem Zauber belegte Wesen  \
  sind mit einer Empathie-Probe gegen 27 als von einem Beherrschungszauber beeinflusst erkennbar.
spell.puppet.enhancedescr=Zusätzlich zu den Sinnen des Ziels verfügt der Zauberer auch über die eigenen.
spell.quickwash.descr=Ein Gegenstand oder ein Körperteil des Abenteurers wird augenblicklich von Dreck und Schmutz \
  gereinigt, als ob er gründlich in Seifenwasser gewaschen worden wäre.
spell.quickwash.enhancedescr=Es kann der gesamte Körper des Zauberers oder ein kompletter Satz Kleidung als Ziel gewählt werden.
spell.raiseundead.descr=Ein totes Wesen wird zu einem Geschöpf des Typus Untoter. Aus frischen Leichnamen werden \
  Wandelnde Leichname (siehe S. 282), während aus skelettierten Toten Skelette werden (siehe S. 279). \
  Die erhobenen Untoten gehorchen den Befehlen des Zauberers.
spell.raiseundead.enhancedescr=Das Wesen erhält 15 Erfahrungspunkte, die nach Willen des Zauberers nach den \
  Regeln zum Steigern von Abenteurern verteilt werden.
spell.readmind.descr=Der Zauberer erhält Einblick in die aktuellen Gedankengänge der Zielperson, kann aber nicht in seine Erinnerungen eindringen.
spell.readmind.enhancedescr=Der Zauberer kann auch gezielt in die Erinnerungen des Ziels eindringen, was pro einzelner Erinnerung etwa 1 Stunde dauert.
spell.reflectspell.descr=Wird der Zauberer direktes Opfer eines Zaubers, vermag er diesen auf den Anwender zurückzuwerfen. \
  Dazu muss ihm eine Entschlossenheit-Probe gelingen, deren Schwierigkeit der Schwierigkeit des ursprünglichen \
  Zaubers + 3 entspricht. Gelingt die Probe, wirkt der Zauber auf den ursprünglichen Urheber. Misslingt die \
  Probe, wirkt der Zauber regulär auf den Zauberer.
spell.reflectspell.enhancedescr=Die Schwierigkeit der Entschlossenheit-Probe beträgt die ursprüngliche Schwierigkeit des Zaubers.
spell.refresh.descr=Der Zauber unterdrückt 1 Stufe des Zustands Erschöpft.
spell.refresh.enhancedescr=Es werden insgesamt 3 Stufen des Zustands unterdrückt.
spell.regeneration.descr=Der Zauberer regeneriert pro Tick 1 Lebenspunkt.
spell.regeneration.enhancedescr=Der Zauberer regeneriert pro Tick insgesamt 2 Lebenspunkte.
spell.rejuvenate.descr=Der Zauberer wird um 20 Jahre verjüngt, bleibt jedoch mindestens 1 Jahr alt.
spell.rejuvenate.enhancedescr=Der Zauberer wird um 30 Jahre verjüngt, das Mindestalter beträgt weiter 1 Jahr.
spell.repair.descr=Einem demolierten oder angeschlagenen Objekt mit einer maximalen Last von 6 wird seine ursprüngliche Form zurückgegeben.
spell.repair.enhancedescr=Die maximale Last beträgt 8.
spell.resistpain.descr=Der Zauberer wird unempfindlicher gegen Schmerzen. Eventuelle Wundabzüge sinken um 3 Punkte.
spell.resistpain.enhancedescr=Die Wundabzüge sinken um 4 Punkte.
spell.restoration.descr=Das Ziel regeneriert alle Lebenspunkte, zudem werden alle Zustände aufgehoben, die Folge von Angriffen sind.
spell.restoration.enhancedescr=Zusätzlich werden alle Gifte und Krankheiten aufgehoben, sofern sie maximal den Zustand Siechtum 2 verleihen.
spell.screech.descr=Ein lautes und schrilles illusionäres Geräusch geht vom Zauberer aus, das bei allen Wesen in \
  5 Metern Umkreis den Zustand Benommen 2 für 30 Ticks verursacht. Der Zauberer selbst ist nicht davon betroffen.
spell.screech.enhancedescr=Die Betroffenen erhalten zusätzlich für 30 Ticks den Zustand Lahm.
spell.scriptunderstanding.descr=Der Zauberer vermag jede natürliche, diesseitige Schrift zu lesen. Er erhält dabei \
  lediglich ein intuitives Verständnis für das Geschriebene, bemerkt also etwa keine stilistischen Feinheiten. \
  Kodierte Texte in fremden Schriften werden zwar verstanden, ihr Inhalt wird aber nicht entschlüsselt.
spell.scriptunderstanding.enhancedescr=Der Zauberer vermag auch jede Schrift zu schreiben.
spell.seismicshock.descr=Ein Erdstoß erschüttert den Wirkungsbereich. Gebäude erleiden Schaden in Höhe von 15 Punkten, \
  während Wesen eine Akrobatik-Probe gegen 20 gelingen muss, um nicht zu Boden zu fallen und als liegend zu gelten.
spell.seismicshock.enhancedescr=Der Schaden gegen Gebäude erhöht sich auf 18, die Schwierigkeit der Akrobatik-Probe auf 25.
spell.selfheal.descr=Der Zauber gibt 3 Lebenspunkte.
spell.selfheal.enhancedescr=Es werden insgesamt 6 Lebenspunkte regeneriert.
spell.senseattitude.descr=Der Zauberer erfährt die Einstellung des Ziels gegenüber einer Person, einer Angelegenheit \
  oder einer Idee, mit der das Ziel in diesem Moment konfrontiert ist. Dieser Zauber benötigt weder Formel noch Geste.
spell.senseattitude.enhancedescr=Während Sozialer Konflikte mit dem Ziel erhält der Zauberer für bis zu eine Stunde \
  einen Bonus in Höhe von 2 Punkten auf die im Rahmen des Konfliktes verwendeten Fertigkeiten.
spell.senseghost.descr=Der Zauberer verspürt ein leichtes Frösteln, wenn sich ein Wesen des Typus Geisterwesen im Wirkungsbereich aufhält.
spell.senseghost.enhancedescr=Der Zauberer weiß, in welcher Richtung sich die Geister befinden, ohne jedoch die Entfernung zu kennen.
spell.senseofowl.descr=Der Zauberer ist von Weisheit und Voraussicht erfüllt. Dadurch erhält er einen Bonus in \
  Höhe von 3 Punkten auf alle Proben, in die seine Intuition einfließt.
spell.senseofowl.enhancedescr=Der Bonus erhöht sich auf 4 Punkte.
spell.shadowarmor.descr=Der Zauberer verfestigt Schatten und formt aus ihnen einen Ausrüstungsgegenstand der Qualität \
  0 mit einer maximalen Last von 4, sei es eine Waffe, ein Seil, ein Umhang oder ein Hammer.
spell.shadowarmor.enhancedescr=Die Qualität beträgt 2.
spell.shadowarrow.descr=Der Zauberer schleudert einen nadelspitzen Pfeil aus Dunkelheit auf das Ziel. Dieser verursacht \
  2W10 Punkte Schattenschaden und hat die Waffenmerkmale Scharf 3 und Durchdringung 2 (S. 186).
spell.shadowarrow.enhancedescr=Das Ziel erhält zusätzlich für 30 Ticks den Zustand Blutend 1.
spell.shadowban.descr=Ein einzelner Schattenzauber wird aufgehoben, solange er maximal Grad 3 aufweist. Handelt es \
  sich um einen Zauber mit Wirkungsbereich, genügt es, wenn sich ein Teil von diesem innerhalb der Reichweite befindet.
spell.shadowban.enhancedescr=Es wird ein Zauber bis Grad 5 aufgehoben.
spell.shadowcloak.descr=Der Zauberer hüllt sich in tiefe Schatten, die ihn bei Stillstand verbergen. \
  Wahrnehmung-Proben, um ihn mit den Augen zu entdecken, erhalten einen Malus in Höhe von 4 Punkten, sofern er sich nicht bewegt.
spell.shadowcloak.enhancedescr=Der Malus gilt auch bei Bewegung des Zauberers.
spell.shadowleap.descr=Der Zauberer tritt in einen Schatten hinein und im selben Moment aus einem anderen Schatten \
  heraus, der maximal 50 Meter entfernt sein darf. Er muss den zweiten Schatten sehen können.
spell.shadowleap.enhancedescr=Der Zauberer kann ein Wesen bis maximal Größenklasse 6 mitnehmen, indem er es berührt.
spell.shadowveil.descr=Ein dünner Schleier aus Schatten bedeckt den Zauberer. Die Lichtverhältnisse sind für ihn um \
  1 Stufe verschlechtert. In starkem Sonnenschein ist darüber hinaus die Hitzestufe für ihn um 1 Stufe gesenkt.
spell.shadowveil.enhancedescr=Die Hitzestufe ist für ihn um 2 Stufen gesenkt.
spell.shadowweapon.descr=Eine mit diesem Spruch verzauberte Waffe ist außerhalb eines Kampfes kaum zu erkennen. \
  Es bedarf einer gelungenen Wahrnehmung-Probe gegen 20, um sie auszumachen. Die Waffe richtet 1 Punkt zusätzlichen \
  Schattenschaden gegen Wesen des Typus Lichtwesen an.
spell.shadowweapon.enhancedescr=Die Schwierigkeit der Wahrnehmung-Probe beträgt 25.
spell.shapeshift.descr=Der Zauberer nimmt das Aussehen einer anderen Person an, einschließlich seiner Größe, Statur und \
  Stimme. Soll die Erscheinung einer bestimmten Person erworben werden, können nur solche Eigenheiten übernommen werden, \
  die dem Zauberer bekannt sind. Ist die Person einem Gegenüber gut bekannt, vermag dieser die Täuschung zu erkennen, \
  wenn er sich mindestens 5 Minuten lang mit dem Zauberer auseinandersetzt und ihm eine Probe auf Wahrnehmung gegen 33 \
  oder eine vergleichende Empathie-Probe gegen die Redegewandtheit des Zauberers gelingt.
spell.shapeshift.enhancedescr=Der Schwierigkeit einer etwaigen Wahrnehmung-Probe beträgt 40. \
  Eine etwaige Empathie-Probe erhält einen Malus in Höhe von 3 Punkten.
spell.shockgrasp.descr=Die Hand des Zauberers wird von zuckenden Blitzen überzogen. Im unbewaffneten Nahkampf richten \
  seine Angriffe echten Elektrizitätsschaden an und besitzen das Waffenmerkmal Durchdringung 1 (S. 186). Dieser Zauber \
  ist nicht mit anderen Zaubern des Typus Hand kombinierbar.
spell.shockgrasp.enhancedescr=Zusätzlich richtet der Zauberer im unbewaffneten Nahkampf 2 Punkte echten Elektritzitätsschaden an.
spell.shove.descr=Das Ziel wird 1 Meter zurückgestoßen und verliert 1 Tick.
spell.shove.enhancedescr=Dem Ziel muss zusätzlich eine Akrobatik-Probe gegen 15 gelingen, um nicht zu stürzen und \
  den Zustand liegend zu erhalten.
spell.silence.descr=Alle Geräusche, die im Wirkungsbereich entstehen oder diesen passieren, werden gedämpft, \
  wodurch entsprechende Wahrnehmung-Proben einen Malus in Höhe von 4 Punkten erhalten.
spell.silence.enhancedescr=Der Malus erhöht sich auf 8 Punkte.
spell.sixthsense.descr=Der Zauberer verfügt über einen sechsten Sinn. Er erhält einen Bonus in Höhe von 3 Punkten auf \
  Wahrnehmung-Proben, um eine Überraschung abzuwehren.
spell.sixthsense.enhancedescr=Das Bonus erhöht sich auf 5 Punkte.
spell.sleep.descr=Das Ziel erhält den Zustand Benommen 3.
spell.sleep.enhancedescr=Das Ziel erhält stattdessen den Zustand Schlafend.
spell.smallanimalshape.descr=Der Zauberer verwandelt sich in ein nicht flugfähiges Wesen des Typus Tier der \
  Größenklasse 1, sowie bis maximal Monstergrad (als Einzelgegner) 1.
spell.smallanimalshape.enhancedescr=Das Tier ist ein besonders prachtvolles Exemplar. Alle Proben auf Fertigkeiten, \
  die von der Tiergestalt übernommen wurden, erhalten einen Bonus in Höhe von 2 Punkten.
spell.smalldeath.descr=Das Ziel fällt in einen todesähnlichen Schlaf und erhält den Zustand Schlafend. \
  In diesem Zustand benötigt es weder Luft noch Wasser oder Nahrung, auch altert es nicht. Die Wirkungen von Giften und Krankheiten werden unterbrochen, ebenso wie die Zustände Blutend und Sterbend. Die Person kann durch Gewalteinwirkung geweckt werden, wacht aber anders als üblich nicht durch Lärm oder ähnliches auf.
spell.smalldeath.enhancedescr=Der Zauberer kann eine Bedingung benennen, bei deren Eintreten der Zauber sofort endet.
spell.smell.descr=Der Zauberer erschafft einen beliebigen Geruch. Dieser Zauber benötigt keine Formel.
spell.smell.enhancedescr=Wesen im Wirkungsbereich erhalten den Zustand Benommen 1.
spell.speakwithanimal.descr=Der Zauberer ist in der Lage, mit einem bestimmten Wesen des Typus Tier begrenzt zu \
  kommunizieren, solange es ihm gegenüber mindestens die Einstellung Neutral aufweist. Es handelt sich nicht um ein\
   echtes Gespräch, vielmehr kann er dem Wesen Fragen stellen, die diese im Rahmen seiner Sinneswahrnehmung, \
  Denkfähigkeit und Laune beantworten kann.
spell.speakwithanimal.enhancedescr=Der Zauber wirkt auch mit Wesen des Typus Monster.
spell.speakwithghost.descr=Der Zauberer kann mit Wesen des Typus Geisterwesen kommunizieren. Diese sind ihm gegenüber \
  nicht notwendigerweise freundlich gesonnen, aber in der Regel zumindest interessiert.
spell.speakwithghost.enhancedescr=Die Einstellung von Wesen des Typus Geisterwesen gegenüber dem Zauberer verbessert sich um 1 Stufe.
spell.spidercrawl.descr=Der Zauberer erhält einen Bonus auf Proben zum Klettern in Höhe von 4 Punkten. Auch Proben, um \
  etwa per Akrobatik nicht von einer Wand herabzustürzen, erhalten diesen Bonus. Darüber hinaus kann der Zauberer die \
  Mali durch fehlende Ausrüstung ignorieren.
spell.spidercrawl.enhancedescr=Der Bonus erhöht sich auf 6 Punkte.
spell.steady.descr=Wird versucht, den Zauberer zurückzudrängen oder umzuwerfen, erhält er einen Bonus in Höhe von 2 \
  Punkten auf die entsprechende Fertigkeit bzw. von 1 Punkt auf den entsprechenden Widerstandswert, um dem entgegen zu wirken.
spell.steady.enhancedescr=Der Bonus beträgt 4 bzw. 2 Punkte.
spell.steelskin.descr=Die Haut des Zauberers wird hart wie Stahl und schimmert metallisch. Er erhält einen Bonus in \
  Höhe von jeweils 4 Punkten auf seine Verteidigung und seine Schadensreduktion. Dieser Zauber ist nicht mit anderen \
  Zaubern kombinierbar, die ebenfalls den Typus Haut besitzen.
spell.steelskin.enhancedescr=Der Bonus auf die SR erhöht sich auf 5 Punkte.
spell.stone.descr=Der Zauberer erschafft ein bis zu faustgroßes Objekt aus Stein, das eine einfache geometrische Form aufweist.
spell.stone.enhancedescr=Wird der Stein als Geschoss oder Wurfwaffe verwendet, erhöht sich der Schaden um 1 Punkt.
spell.stoneclaws.descr=Zwei steinerne Klauen schießen aus dem Boden empor und führen Nahkampfangriffe gegen vom \
  Zauberer bestimmte Ziele durch. Als Kampffertigkeitswert gilt der Fertigkeitswert in Felsmagie, die \
  Verteidigung beträgt 18, die Waffengeschwindigkeit 10, der Felsschaden 1W6+3 und die Schadensreduktion \
  4, zudem verfügt jede Klaue über 5 Lebenspunkte und eine Gesundheitsstufe. An Meisterschaften kann \
  Umklammern eingesetzt werden. Die Klauen sind ortsgebunden und können lediglich Ziele in Nahkampfentfernung zu ihnen angreifen.
spell.stoneclaws.enhancedescr=Es erscheinen insgesamt drei Felsklauen.
spell.stonedestruction.descr=Erde und Fels im Umkreis sowie alle daraus bestehenden Konstruktionen oder Wesen erleiden 75 Punkte Schaden.
spell.stonedestruction.enhancedescr=Der Schaden erhöht sich auf 100 Punkte.
spell.stonemissile.descr=Der Zauberer schleudert dem Ziel ein Felsgeschoss entgegen, welches 1W10 Punkte Felsschaden \
  verursacht. Zudem bedarf es einer gelungenen Akrobatik-Probe gegen 15 (erhöht um die Fertigkeitspunkte des Zauberers \
  in der verwendeten Magieschule), um nicht vom Aufprall umgeworfen zu werden und als liegend zu gelten.
spell.stonemissile.enhancedescr=Die Schwierigkeit der Akrobatik-Probe beträgt 20 + Fertigkeitspunkte des Zauberers.
spell.stoneskin.descr=Die Haut des Zauberers wird hart wie Fels. Er erhält einen Bonus in Höhe von jeweils 2 Punkten \
  auf seine Verteidigung und seine Schadensreduktion. Dieser Zauber ist nicht mit anderen Zaubern kombinierbar, die ebenfalls den Typus Haut besitzen.
spell.stoneskin.enhancedescr=Der Bonus auf die SR erhöht sich auf 3 Punkte.
spell.strengthbear.descr=Der Zauberer erhält einen Bonus in Höhe von 4 Punkten auf alle Proben, in die seine Stärke einfließt.
spell.strengthbear.enhancedescr=Der Bonus erhöht sich auf 5 Punkte.
spell.suggestion.descr=Der Betroffene erhält eine Suggestion nach Willen des Zauberers, sei es eine Idee, ein Vorurteil \
  oder Ähnliches. Sprechen nichts Offensichtliches oder die moralischen Prinzipien der Person dagegen, hält er diese \
  für seine eigene Eingebung und wird sie gemäß seinem Naturell verfolgen. Dieser Zauber unterliegt nicht den Regeln \
  zur maximalen Wirkungsweite kanalisierter Zauber (S. 195) und benötigt weder Formel noch Geste.
spell.suggestion.enhancedescr=Das Ziel wird die Suggestion selbst dann als seine Idee erachten, wenn Offensichtliches dagegen spricht, aber weiterhin seinen eigenen moralischen Grundsätzen folgen.
spell.summonfog.descr=Der Zauber erschafft eine dichte Nebelwolke, in der die Sichtweite auf 5 Meter begrenzt ist und die Lichtverhältnisse um 1 Stufe verschlechtert sind.
spell.summonfog.enhancedescr=Die Sichtweite sinkt auf 2 Meter, die Lichtverhältnisse verschlechtern sich um insgesamt 2 Stufen.
spell.summonghost.descr=Der Zauberer beschwört ein Wesen der Typen Geisterwesen und Magisches Wesen I, das all seinen Anweisungen folgt.
spell.summonghost.enhancedescr=Es wird ein zweites Wesen derselben Art beschworen.
spell.summonstone.descr=Der Zauberer beschwört ein Wesen der Typen Felswesen und Magisches Wesen I, das all seinen Anweisungen folgt.
spell.summonstone.enhancedescr=Es wird ein zweites Wesen der gleichen Art beschworen.
spell.suppressspell.descr=Ein kanalisierter Zauber wird während der Wirkungsdauer unterdrückt, solange er maximal Grad 3 aufweist.
spell.suppressspell.enhancedescr=Es werden Zauber bis Grad 4 unterdrückt.
spell.swarm.descr=Das Ziel des Zaubers wird von einem Schwarm Insekten umschwirrt, die seine Konzentration stören \
  und ihn verlangsamen. Jede kontinuierliche Aktion wird um 2 Ticks verlängert.
spell.swarm.enhancedescr=Jede kontinuierliche Aktion wird um 3 Ticks verlängert.
spell.tendrilarrow.descr=Aus einem mit diesem Zauber belegten Geschoss schießen nach dem Aufprall Ranken hervor, \
  die sich um den Getroffenen winden und ihm den Zustand Ringend verleihen. Aus diesem kann sich ganz normal durch ein \
  Befreien aus der Umklammerung (S. 164) gelöst werden, die Schwierigkeit hierfür beträgt 24. Die Ranken können zwar \
  abgeschlagen werden, wachsen jedoch sofort wieder nach, selbst wenn der Pfeil entfernt wurde. Eine mit einem \
  Rankenpfeil beschossene Mauer überwuchert mit Ranken, die als Kletterhilfe dienen können. Der Zauber unterliegt \
  nicht der Regel zur maximalen Wirkungsweite kanalisierter Zauber.
spell.tendrilarrow.enhancedescr=Die Schwierigkeit für das Befreien aus der Umklammerung beträgt 27.
spell.tendrils.descr=Aus dem Boden schießen Ranken hervor, die sich um die Beine aller Wesen im Wirkungsbereich \
  schlingen. Wer sich darin aufhält oder sich hindurch bewegt, muss eine erfolgreiche Akrobatik- oder Athletik-Probe \
  gegen 20 ablegen, sonst gilt er als ringend. Diese Probe muss alle 20 Ticks wiederholt werden, wenn der \
  Wirkungsbereich nicht verlassen wird. Aus dem Zustand Ringend kann sich ganz normal durch ein Befreien aus der \
  Umklammerung (S. 164) gelöst werden, die Schwierigkeit hierfür beträgt 24. Die Ranken können zwar abgeschlagen \
  werden, wachsen jedoch sofort wieder nach.
spell.tendrils.enhancedescr=Auch bei gelungener Akrobatik- oder Athletik-Probe zählt der Wirkungsbereich zusätzlich noch als Schwieriges Gelände.
spell.terrorform.descr=Das Äußere des Zauberers nimmt die Erscheinung einer alptraumhaften Gestalt an, einschließlich \
  dazu passender Geräusche und Gerüche. Jedes Wesen, das sich ihm auf 5 Meter nähert, erhält den Zustand Angsterfüllt, \
  wenn sein Geistiger Widerstand nicht mindestens 24 beträgt.
spell.terrorform.enhancedescr=Betroffene Wesen erhalten den Zustand Panisch, wenn ihr Geistiger Widerstand \
  nicht mind. 19 Punkte beträgt.
spell.turnundead.descr=Ein Wesen des Typus Untoter wird vernichtet, wenn ihm eine Zähigkeit- Probe gegen 15 misslingt. \
  Gelingt die Probe, erleidet das Wesen 3W6 Schaden.
spell.turnundead.enhancedescr=Ein zweites Wesen mit gleichem oder geringerem Körperlichen Widerstand wird betroffen.
spell.twister.descr=Der Zauberer erschafft einen Wirbelsturm. Fernkampfangriffe im oder durch den Wirkungsbereich \
  verfehlen automatisch ihr Ziel. Darin befindlichen Wesen muss alle 10 Ticks eine Akrobatik-Probe gegen 25 gelingen, \
  um nicht zu Boden zu stürzen und als liegend zu gelten. Außerdem erhalten sie im gleichen Abstand 1W6 Punkte Schaden \
  durch herumfliegende Objekte, sofern solche vorhanden sind. Zudem wird ihre Geschwindigkeit halbiert.
spell.twister.enhancedescr=Der Zauberer kann den Wirkungsbereich innerhalb der Reichweite mit einer Geschwindigkeit von 3 verschieben.
spell.undeadprotection.descr=Der Zauberer schafft eine Zone, innerhalb derer Wesen des Typus Untoter einen \
  Malus in Höhe von 2 Punkten für alle Proben erhalten.
spell.undeadprotection.enhancedescr=Der Malus erhöht sich auf 4 Punkte.
spell.understandlanguage.descr=Der Zauberer vermag jede natürliche diesseitige Sprache zu verstehen. Er erhält dabei \
  lediglich ein intuitives Verständnis für das Gesagte, bemerkt also etwa keine stilistischen Feinheiten. Geheimsprachen \
  oder ähnliche Kunstprodukte werden nicht übersetzt, ebenso wie eine Verständigung in fremden Sprachen über diesen \
  Zauber nicht möglich ist. Auch ist es nicht möglich, Gelesenes zu verstehen, nur das gesprochene Wort ist betroffen.
spell.understandlanguage.enhancedescr=Der Zauberer vermag es auch, stilistische Feinheiten zu verstehen.
spell.unseenobject.descr=Ein Objekt bis maximal Last 10 wird unsichtbar und kann entsprechend nicht mehr gesehen werden. \
  Es macht weiterhin Geräusche, ebenso wie es eventuell Spuren hinterlässt (etwa wenn es über sandigen Boden gerollt wird).
spell.unseenobject.enhancedescr=Es kann ein Gegenstand bis Last 20 unsichtbar gemacht werden.
spell.veil.descr=Der Zauberer wird von fließenden Schatten umgeben, die ihn verbergen, seine Schritte dämpfen und seine \
  Umrisse verfälschen. Er erhält einen Bonus in Höhe von 3 Punkten auf Heimlichkeit-Proben.
spell.veil.enhancedescr=Der Bonus erhöht sich auf 5 Punkte.
spell.veillife.descr=Die Lebensaura des Zauberers wird unterdrückt. Untote und andere Wesen, die Lebenskraft spüren, \
  nehmen ihn als totes Objekt wahr, solange ihr Geistiger Widerstand nicht mindestens 20 beträgt.
spell.veillife.enhancedescr=Der Zauberer wird nicht wahrgenommen, wenn der Geistige Widerstand nicht mindestens 25 beträgt.
spell.ventriloquate.descr=Der Zauberer lässt ein kurzes und nicht zu komplexes Geräusch wie etwa ein Türknarren oder \
  ein Bellen entstehen. Dieser Zauber benötigt keine Formel.
spell.ventriloquate.enhancedescr=Statt eines einfachen Geräuschs handelt es sich um bis zu fünf Worte mit der Stimme des Zauberers.
spell.viewhistory.descr=Der Zauberer erhält eine Vision seines Aufenthaltsortes aus früheren Zeiten. Ein umgekehrt \
  chronologischer Strom an Bildern und Eindrücken aus der Vergangenheit stürzt über ihn herein, wobei die ältesten \
  Eindrücke 100 Jahre zurückliegen. Auf diesem Wege lassen sich lediglich größere Veränderungen rekonstruieren, nicht einzelne Taten.
spell.viewhistory.enhancedescr=Die ältesten Eindrücke liegen 1000 Jahre zurück.
spell.walkonwater.descr=Der Zauberer kann über Wasserflächen gehen, als handelte es sich um festes Gestein, auch \
  vermag er nicht unter Wasser gezogen zu werden. Handelt es sich um ein fließendes Gewässer, wird er zusammen mit \
  der obersten Wasserschicht abgetrieben, während bei starkem Wellengang Akrobatik-Proben verlangt werden können, um Stürze zu vermeiden.
spell.walkonwater.enhancedescr=Die Geschwindigkeit des Zauberers erhöht sich um 2 Punkte, wenn er sich auf dem Wasser fortbewegt.
spell.walkwalls.descr=Der Zauberer kann sich durch eine Wand bewegen, die nicht dicker als 1 m ist.
spell.walkwalls.enhancedescr=Eine Wand mit einer Stärke von bis zu 2 m kann durchquert werden.
spell.walkwilderness.descr=Der Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner \
  Wahl bewegen sich mit Leichtigkeit durch die Natur. Jegliches Terrain zählt für sie maximal als Rand der Wildnis und \
  sie erhalten einen Bonus in Höhe von 3 Punkten auf Überleben-Proben mit Bezug auf das Reisen. Die Boni gelten nur \
  während des Aufenthalts im Wirkungsbereich.
spell.walkwilderness.enhancedescr=Es können bis zu fünf Personen bestimmt werden.
spell.walloffire.descr=Der Zauberer erschafft eine schnurgerade und unverrückbare Wand aus Flammen von 20 cm Dicke mit \
  einer beliebig verteilbaren Fläche von bis zu 10 m². Bewegen sich Wesen oder Objekte durch sie hindurch, erhalten \
  sie 8W6 Punkte Feuerschaden. Die maximale Wirkungsweite kanalisierter Zauber (S. 195) gilt für diesen Zauber als verzehnfacht.
spell.walloffire.enhancedescr=Das Durchqueren verursacht zusätzlich für 30 Ticks den Zustand Brennend 1.
spell.wallofshadow.descr=Der Zauberer erschafft eine schnurgerade und unverrückbare Wand aus festen Schatten von \
  20 cm Dicke mit einer beliebig verteilbaren Fläche von bis zu 10 m². Sie ist vollkommen lichtundurchlässig und \
  dämpft Geräusche, sodass mit dem Gehör im Zusammenhang stehende Wahrnehmung-Proben einen Malus in Höhe von \
  6 Punkten erhalten. Ihre Härte beträgt 4 Punkte, ihre Haltbarkeit 12 Punkte. Sie kann also zerstört werden, \
  was den Zauber beendet. Die maximale Wirkungsweite kanalisierter Zauber (S. 195) gilt für diesen Zauber als verzehnfacht.
spell.wallofshadow.enhancedescr=Der Malus erhöht sich auf 8 Punkte.
spell.wallofstone.descr=Der Zauberer erschafft eine schnurgerade und unverrückbare Wand aus festem Stein von 20 cm Dicke \
  mit einer beliebig verteilbaren Fläche von bis zu 10 m². Ihre Härte beträgt 4 Punkte, ihre Haltbarkeit 12 Punkte. Sie \
  kann also zerstört werden, was den Zauber beendet. Die maximale Wirkungsweite kanalisierter Zauber (S. 195) gilt für diesen Zauber als verzehnfacht.
spell.wallofstone.enhancedescr=Die Härte erhöht sich auf 6 Punkte, die Haltbarkeit auf 18 Punkte.
spell.weakenarmor.descr=Die Schadensreduktion des Ziels wird um 2 Punkte gesenkt (Minimum 0). \
  Hiervon ist nur Schadensreduktion von getragenen Rüstungen betroffen.
spell.weakenarmor.enhancedescr=Auch sämtliche anderen Arten von Schadensreduktion werden betroffen, wie etwa aus natürlicher Rüstung oder aus Magie.
spell.weakenundead.descr=Ein Wesen des Typus Untoter erhält einen Malus in Höhe von 4 Punkten auf alle Proben.
spell.weakenundead.enhancedescr=Der Malus erhöht sich auf 6 Punkte.
spell.weaponoflight.descr=Der Zauberer erschafft eine beliebige Nahkampfwaffe aus strahlendem Licht, welche die \
  Lichtverhältnisse im Umkreis von 5 Metern um 1 Stufe verbessert.
spell.weaponoflight.enhancedescr=Der Schaden erhöht sich um 2 Punkte Lichtschaden. \
  Diese Verstärkung ist nicht mit Zaubern kombinierbar, die die Typen Schaden und Waffe aufweisen.
spell.windshield.descr=Der Zauberer umgibt sich mit einem Schild aus tobendem Wind, welcher Fernkampfangriffen gegen ihn einen Malus in Höhe von 6 Punkten verleiht.
spell.windshield.enhancedescr=Der Malus erhöht sich auf 9 Punkte.
spell.wither.descr=Eine berührte Pflanze oder ein Wesen des Typus Pflanze verdorrt und stirbt. Anderen Wesen muss eine \
  Zähigkeit-Probe gegen 25 gelingen, um nicht den Zustand Sterbend 3 (Fluch) zu erhalten.
spell.wither.enhancedescr=Die Schwierigkeit der Zähigkeit-Probe erhöht sich auf 30.

resource.contacts=Du bist, wen du kennst \u2013 dieser Satz gilt in vielen Gegenden \
 von Lorakis. Kontakte können einem Abenteurer auf viele Weise \
 nützlich sein: Sie dienen als Informationsquellen, können einem \
 die richtigen Leute vorstellen oder Waren beschaffen, die sonst \
 schwierig zu bekommen sind. Kontakte würden allerdings nicht \
 direkt für den Abenteurer Partei ergreifen, können also eher \
 nicht als rettende Kavallerie verwendet werden. Vielmehr sind \
 sie bereit, ihr Wissen mit dem Abenteurer zu teilen und ihm auf \
 andere, nicht direkt gefährliche Weise zu helfen.\n\
 Ein hoher Wert in Kontakte kann bedeuten, dass der Abenteurer \
 beinahe überall einige wenige Personen kennt oder aber, dass er \
 in einer kleinen Region so gut wie jeden kennt. Die genauen \
 Umstände sollte jeder Spieler in Absprache mit dem Spielleiter \
 festlegen. Auch die Entscheidung, ob Kontakte in einer konkreten Situation hilfreich sind, liegt beim Spielleiter.\n\
 Der Wert der Ressource Kontakte kann in passenden Situationen \
 als Bonus auf Straßenkunde-Proben verwendet werden.
resource.contacts.v-2.meaning=Einzelgänger, keinerlei soziale Kontakte
resource.contacts.v-2.example=ein verschrobener Eremit aus der Wildnis
resource.contacts.v-1.meaning=nur das direkte soziale Umfeld
resource.contacts.v0.meaning=eine Handvoll Freunde
resource.contacts.v1.meaning=einige nützliche Bekannte
resource.contacts.v2.meaning=viele Bekannte in verschiedenen Positionen
resource.contacts.v3.meaning=dichtes Informationsnetz
resource.contacts.v4.meaning=weitreichende Kontakte und viele Freunde
resource.contacts.v5.meaning=kennt fast immer die richtigen Leute
resource.contacts.v6.meaning=kennt praktisch jeden

resource.creature=Natürlich können gewöhnliche Reittiere oder Jagdhunde bei\
 entsprechenden Züchtern einfach käuflich erworben werden. Die\
 Ressource Kreatur soll im Gegensatz dazu Wesen abbilden, zu\
 denen der Abenteurer eine tiefgehende Beziehung hat oder die\
 aufgrund ihrer Seltenheit, unbedingter Loyalität oder anderer\
 Besonderheiten über normale Nutztiere hinausgehen. Dies um fasst das gezähmte Säbelzahneichhörnchen ebenso wie das treue\
 Streitross aus dem Gestüt der Eltern, das der Abenteurer seit Kindertagen kennt.\n\
 Ein über die Ressource Kreatur erworbenes Wesen gehorcht seinem Herrn ohne weitere Probe im Rahmen seiner Möglichkeiten\
 und charakteristischen Verhaltensweisen. Bei einem minderen \
 Elementarwesen mag dieses Verhältnis eher einer Freundschaft \
 ähneln, während sich normale Tiere wie gut ausgebildete Exemplare ihrer Spezies verhalten. Selbst seinen Selbsterhaltungstrieb \
 wird das Tier zurückstellen, um seinen Besitzer zu schützen.\n\
 Die Ressource kann mehrfach erworben werden und gilt dann jeweils für einzelne tierische Begleiter.
resource.creature.v1.meaning=Maskottchen, mehr Zier als Helfer
resource.creature.v2.meaning=Einfaches Nutztier (z.B. Maultier)
resource.creature.v3.meaning=Reittier / kleiner Kampfgefährte
resource.creature.v4.meaning=vernunftbeg. Wesen / mittlerer Kampfgefährte
