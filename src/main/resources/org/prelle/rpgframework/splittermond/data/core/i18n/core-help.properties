resource.mentor.v6.meaning=hoher Würdenträger

resource.entourage=Manche Abenteurer sind so wohlhabend oder von solch hohem Geblüt, dass sie über Gefolge verfügen. Aber selbst einem \
 ärmeren Gesellen mag jemand folgen, der sich ihm aufgrund einer früheren Tat, eines Eides oder Verbundenheit zu seinen Eltern \
 verpflichtet fühlt. Dies reicht von einem persönlichen Leibdiener, der sich um Gepäck und niedere Tätigkeiten kümmert, über \
 die Knappen fahrender Ritter bis hin zu Leibwächtern oder gar einem kleinen Tross aus Zofen, Köchen und Vorkostern.\n\
 Gefolgsleute sind ihrem Herrn gegenüber loyal und greifen durchaus handelnd in das Spielgeschehen ein, können also dem \
 Abenteurer in Kämpfen zur Seite stehen oder Wache stehen. Sie sollten daher zumindest rudimentär ausgearbeitet werden. Das \
 Gefolge sollte durch seine Dienste nie einen anderen Spielercharakter überflüssig machen \u2013 sehr wohl kann er aber Schwächen \
 des Abenteurers ausgleichen. Die letzte Entscheidung über den Einsatz des Gefolges liegt daher stets beim Spielleiter.\n\
 Der erste Punkt verschafft dem Abenteurer einen Gefolgsmann mit durchschnittlichen Werten in den Attributen (2 + Rassenmodifikator) \
 und den üblichen Werten ihrer Kultur (Fertigkeitspunkte, Stärken, Meisterschaften des Kulturmoduls). Weitere Gefolge-Punkte \
 können für zusätzliche Gefolgsleute ausgegeben werden. Alternativ kann auch die Kompetenz eines vorhandenen Gefolgsmanns \
 erhöht werden, seine Fertigkeit darf aber nie höher sein, als es der Heldengrad des Abenteurers zulässt.
