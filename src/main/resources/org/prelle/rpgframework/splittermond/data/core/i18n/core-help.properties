resource.relic.v6.meaning=Qualität 6

resource.reputation=Das Ansehen eines Abenteurers entscheidet darüber, inwiefern er \
 im positiven Sinne bekannt ist und wie die Gesellschaft auf ihn \
 reagiert. Dies ist natürlich vor allem in dicht besiedelten Landstrichen und Städten relevant, wenn es darum geht, zu einem \
 gesellschaftlichen Großereignis eingeladen zu werden, einem legendären Schwertkämpfer wird aber vielleicht auch nachts die \
 Herbergstür in menschenfeindlicher Einöde geöffnet, wo sie für einen unbekannten Taugenichts verschlossen bleibt.\n\
 Es ist zu beachten, dass ein hohes Ansehen nicht immer mit dem formellen gesellschaftlichen \
 Status korrespondiert, sondern sehr unterschiedliche Ursprünge haben kann: Der Abenteurer kann einer einflussreichen Familie \
 entstammen, ein angesehener Gelehrter sein oder als Kind großer Helden etwas von ihrem Ruhm abbekommen haben. So ist \
 es auch denkbar, dass ein armer Eremit, der als sehr göttergefällig \
 bekannt ist, ein höheres Ansehen genießt, als dies bei einem reichen und skrupellosen Kaufmann der Fall ist.\n\
 Pauschal gesehen gilt das Ansehen für ganz Lorakis. Je nach Situation, Aufenthaltsort, Herkunft und Grund für das Ansehen kann \
 es aber regional stark schwanken.
