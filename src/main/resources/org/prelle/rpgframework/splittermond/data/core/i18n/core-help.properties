resource.refuge=Üblicherweise werden die Wohnverhältnisse eines Abenteurers durch seinen Lebensstil festgelegt, hängen also entweder von \
 seinem Vermögen oder von seinem Stand ab. Es gibt aber Fälle, in denen ein Abenteurer eine deutlich davon abweichende Zuflucht \
 besitzt. Dies kann die ererbte Burg eines verarmten Adligen sein, der ansonsten in betrüblichen Zuständen haust. Oder aber ein \
 vorsichtiger Dieb unterhält neben seiner üblichen Wohnung einen geheimen Unterschlupf, wo er sich versteckt, wenn es brenzlig \
 wird. In all diesen Fällen ist es so, dass der Abenteurer diese Zuflucht tatsächlich besitzt und nicht nur auf Miete unterkommt \
 oder bei seiner Familie Unterschlupf findet.\n\
 Je höher der Wert der Ressource ist, desto komfortabler, größer und prächtiger ist die Zuflucht üblicherweise. In anderen Fällen \
 kann ein hoher Wert für ein perfekt getarntes Versteck stehen, das eher karg ausgestattet ist, aber über gute \
 Sicherheitsvorkehrungen verfügt.\n\
 Besonders wohlhabende oder paranoide Abenteurer können diese Ressource mehrfach erwerben. Darüber hinaus ist es möglich, dass \
 mehrere Abenteurer ihre Ressourcen kombinieren und gemeinsam eine höherwertige Zuflucht erwerben.
resource.refuge.v1.meaning=Unterschlupf
resource.refuge.v2.meaning=Versteck
resource.refuge.v3.meaning=Rückzugsort
resource.refuge.v4.meaning=Anwesen
resource.refuge.v5.meaning=Burg
resource.refuge.v6.meaning=Festung

resource.mentor=Viele Abenteurer verfügen über einen Mentor, der sie in ihrem früheren Leben gefördert hat und weiterhin bereit ist, ihnen \
 in kritischen Situationen mit Rat und Tat zur Seite zu stehen. Mentoren können ehemalige Lehrer, Ausbilder oder Vorgesetzte \
 innerhalb einer Organisation sein, in vielen Fällen sind es die eigenen Eltern oder andere enge Verwandte. Sie können eine \
 ähnliche Funktion erfüllen wie Kontakte, als Lehrmeister für seltene Kenntnisse dienen oder als Leumund für den Abenteurer bürgen.\n\
 Der Mentor-Wert bestimmt über Mächtigkeit und Kompetenz des Mentors und über seine Bereitschaft, dem Abenteurer zu helfen.\n\
 Ein Mentor sollte vom Spieler zumindest rudimentär ausgearbeitet werden und dient dem Spielleiter häufig als wichtige \
 Spielleiterfigur.\n\n\
 MENTOR-PUNKTE EINSETZEN\n\
 Ein Abenteurer mit der Ressource Mentor kann die Punkte, die er in Mentor investiert hat, verwenden, um für kurze Zeit andere \
 Ressourcen zu simulieren. Das repräsentiert die Möglichkeit, sich z.B. Geld oder ein kostbares Artefakt von seinem Mentor zu \
 leihen, das Ansehen seines Mentors zu nutzen, um ein Ziel zu erreichen, oder für kurze Zeit die Zuflucht seines Mentors zu \
 nutzen. Der Abenteurer kann im Normalfall einmal pro Monat die Punkte seines Mentors auf diese Art einsetzen. Er muss hierbei \
 nicht alle auf einmal einsetzen, sondern kann sie sich für mehrere Zwecke aufteilen. Die maximal erreichbare Ressourcenstufe \
 beträgt auch durch Einsatz von Mentor-Punkten 6.
