education.martial_artist.descr=In abgelegenen Klöstern, städtischen Schulen und versteckten Dojos trainieren anerkannte Meister ihre Schüler in einer Kunst des Kampfes, die sich in einem großen Ziel von der Ausbildung von \u201Eeinfachen\u201C Soldaten oder Söldnern unterscheidet: Entweder verstehen Kampfkünstlerdie körperliche Ertüchtigung und geistige Disziplinierung für den Kampf als Selbst- zweck, als Perfektionierung des Selbst oder als Erschaf- fung des besten Gefäßes für den besten Geist. Dieses Ziel beeinflusst dentypischen Kampfstil, der aufschnelle Angriffe, individuelle Bewegung statt Formationen\u2028und eine Kombination ausleicht bewaffneten und unbewaffneten Techniken setzt. Durch meditatives Training nach innen gerichteter magischer Fokussierung soll der Körper perfektioniert und seine natürlichen Grenzen gesprengt werden. Obwohl Kampfkünstler dazu tendieren, stolz auf den eigenen Stil und dessen Tradition zu sein (Rivalitäten zwischen Schulen ähnlichen Stils sind meist noch größer als zu anderen Stilen), erkennen die meisten an, dass es immer einen Gegenstil gibt, der den eigenen perfekt kontert. So lernen die meisten im Laufe der Zeit eine Vielzahl an Techniken, um auf jede Herausforderung eine passende Antwort finden zu können. Der typische Kampfkünstler ist viel unterwegs: Er sucht neue Gegner, an denen er seine Kunst messen und vervollkommnen kann, abgelegene Meister oder vergessene Schriftrollen, die ihn eine noch fehlende geheime Technik lehren \u2013 oder aber auch Orte, an denen man ungestört meditieren und den in einem wohnenden Kräften nachforschen kann. Auch wenn ein Kampfkünstler spezialisierten, hochgerüsteten Kriegern gleicher Erfahrung manchmal unterlegen sein mag, bringt er eine körperliche und taktische Vielseitigkeit mit, die ihn für die meisten Gruppen zu einem wertvollen Mitglied macht. Kampfkünstler sind als Schüler des Chi Kung weit verbreitet, aber auch anderswo in Lorakis gibt es Vertreter dieser Zunft: Seien es die auf den schnörkellosen und effektiven Nahkampf spezialisierten Kämpfer Eisenbranns, die Kampftänzer der Dämmeralben oder die Meister der Kampfkünste der Stromlandinseln.
education.monk_red_phoenix.descr=Die Mönche des roten Phönix haben sich noch mehr als üblich darauf spezialisiert, Kampfkunst und Magie miteinander zu verschmelzen und beides zur Meisterschaft zu bringen. Die Diener des Hüeng ziehen oft in die Welt hinaus, um den Schwachen zu helfen und ho en damit, dereinst in Wu Xia-Geschichten verewigt zu werden. 
education.mountainmonk.descr=Die sogenannten Bergmönche kommen aus abgelegenen Klöstern in der Schatten- wand oder dem Aiun, die meist Unggoy oder Tanglang geweiht sind, mitunter aber auch dem Großen Purpuryak Högun. Sie sind besonders spirituell ausgerichtet und für lange Meditationen bekannt \u2013 und haben natürlich gelernt, in Isolation und unwirtlicher Umgebung zu überleben.
education.circle_student.descr=Noch spiritueller sind die Schüler des Kreises, die ihren Stil nicht nur einem heiligen Tiergeist nach empfunden haben, sondern sogar danach trachten, sich in dessen diesseitiges Ebenbild zu verwandeln. Durch ihre spirituelle Nähe zu den Großen Tiergeistern wird ihnen allgemeiner Respekt der Tierwelt zuteil. 
education.flying_snake.descr=Die Priesterschaft der Geflügelten Schlange Ahas gilt als Stütze der Ordnung in Zhoujiang. Aber gerade dass General Wu sie aktuell stärken und die Geflügelte Schlange über den Phönix erheben will, hat manche zurückgezogene Priester hinaus aus den Archiven, Klöstern und Magistraten getrieben \u2013 und sie in Opposition zu vielen Tempeln gebracht, die sich nur zu gerne den Träumen von stärkerem Einfluss hingeben. Aber bevor diese als Fliegende Schlangen bekannten renegaten Priester etwas bewirken können, müssen sich die Stubenhocker erst an ihre neue Rolle als Wanderprediger gewöhnen.
education.singer_of_truth.descr=Im Volk der Mangmong werden die Wahrsängerinnen, stets weibliche Priester des Großen Purpuryaks, in hohen Ehren gehalten. In Trance sollen sie sowohl die Welt der Geister als auch die Zukunft erforschen können und ihre Erkenntnisse in tiefen und gutturalen Gesängen mitteilen. Mitunter kommt es aber auch vor, dass eine Wahrsängerin eine Vision nicht deuten kann und in der Folge beschließt, in die Fremde zu ziehen, um dort Antworten auf ihre Traumbilder zufinden.
education.meng_shou.descr=Es könnte kaum einen größeren Kontrast zu den berühmten Kampfkünstlern geben als die als Meng Shou bekannten Bestienjäger und -bändiger der Tigerprovinz: Breit und muskulös setzen diese Eigenbrötler eher auf rohe Gewalt und unüberwindliche Zähigkeit als auf Schnelligkeit und Eleganz. Je nach Gelegenheit Söldner, Monsterjäger, Fallensteller oder Gesetzlose ist ihre einzige Richtschnur das eigene Überleben, und darüber, was sie dafür tun, werden zahlreiche (und nicht immer schmeichelhafte) Geschichten verbreitet.
education.qin_shou.descr=Die Mitglieder des Ordens von Qin Shou aus der Büffelprovinz ziehen regelmäßig in die Schattenwand, um von dort kommende Monstrositäten von der Zivilisation fernzuhalten. Sie werden vor allem in Taka als große Helden gefeiert und mit Respekt behandelt. Aber auch in anderen Regionen Zhoujangs hat man schon Geschichten über sie vernommen \u2013 und immer wieder ziehen einzelne Qin Shou auch in die Ferne, vor allem wenn sie das Ge- fühl haben, in der Schattenwand schon alle Herausforderungen bezwungen zu haben.
education.inspektor_of_symbols.descr=In einem Land in dem nicht nur Schutzzeichen von höchster Wichtigkeit sind, sondern auch alles in geordneten Bahnen verlaufen muss, verwundert es kaum, dass es Beamte gibt, die sich ausschließlich um die Kontrolle magischer Zeichen kümmern. Diese Inspektoren der Zeichen gehen ihrer Aufgabe meist gewissenhaft nach, stoßen aber mitunter auch an die Grenzen ihres Wissens \u2013 nicht nur daher ist es durchaus üblich, dass Inspektoren auch in fremde Lande geschickt werden, um dort unter den \u201EBarbaren\u201C neue Geheimnisse der Zeichenmagie zu erlernen.
education.wise_pusa.descr=Wie ihre namensgebende Katzengöttin verbergen die Weisen von Pusa hinter Eleganz und Geschmeidigkeit eine ausgeprägte Egozentrik. Sie schleichen als gesellschaftliche Raubtiere durch die betriebsamen Häfen der Katzenprovinz, und mischen sich überall ein, wo sie einen Vorteil für sich wittern. Ob als Händler oder Vermittler, Führer oder Wohltäter der Armen, sie wirken stets vertrauenswürdig und großzügig, aber sind beides selten. Oft verkaufen sie angeblich von Pusa gesegnete Glücksbringer \u2013 wirklich wirksame behalten sie aber stets selbst.

mastership.hard_style.desc=Die unbeugsamen Angriffe des Abenteurers bringen seine Feinde immer wieder ins Taumeln. Verursacht er bei einem Angriff nur einen Streiftreffer, verliert der Gegner zusätzlich zu den üblichen Auswirkungen einen Tick. Der Abenteurer kann bei jeder Handlung nur einen Kampfstil verwenden. Dies muss nicht vorher angesagt werden. Vorausset­zung: mindestens ein Meisterschafts-Manöver
mastership.impro_parry.desc=Wird im Kampf mit der Nebenhand ein Gegenstand mit einer unmodifizierten Härte von mindestens 2 geführt, erhält jede mittels der eigentlichen Hauptwaffe durchgeführte Aktive Abwehr das Merkmal Defensiv 1 (sofern der Gegenstand nicht bereits dieses Merkmal besitzt).
mastership.jugshield.desc=Ein zerbrechlicher und in einer Hand geführter Gegenstand erhält bei einer mit ihm durchgeführten erfolgreichen Aktiven Abwehr mittels der gewählten Kampffertigkeit einmalig das Merkmal Defensiv 3. Der Gegenstand zerbricht bei der Anwendung dieser Meisterschaft. Voraussetzung: Meisterschaft Improvisation in der gewählten Kampffertigkeit
mastership.soft_style.desc=Durch die Geschmeidigkeit seiner Bewegungen kann der Abenteurer nach Angriffen fießend in seine Ausgangsposition zurückkehren. Verursacht er nur einen Streiftreffer, zählt seine Waffengeschwindigkeit für diesen Angriff als um 1 reduziert. Der Abenteurer kann bei jeder Handlung nur einen Kampfstil verwenden. Dies muss nicht vorher angesagt werden. Voraussetzung: mindestens ein Meisterschafts-Manöver
mastership.longrange.riflegunner.desc=Der Abenteurer kann Feuerwaffen effektiver nutzen. Für ihn ist das Bereitmachen einer Schusswaffe mit dem Merkmal Auslöser um 3 Ticks reduziert. Beim Auslösen einer entsprechenden Waffe durch ihn wird ein aus einem etwaigen Merkmal Rückstoß resultierendes Benommen um 1 Stufe reduziert.
mastership.longrange.fast_reload.desc=Der Abenteurer kann für Schusswaffen mit dem Merkmal Auslöser die Wirkung der Meisterschaften Schnellschütze I und II verdoppeln. Voraussetzung: Meisterschaften Büchsenschütze, Schnellschütze I
mastership.longrange.imperturbable_riflegunner.desc=Erleidet der Abenteuer durch das Auslösen einer eigenen Schusswaffe mit dem Merkmal Rückstoß den Zustand Benommen, reduziert dieser sich um 1 weitere Stufe. Voraussetzung: Meisterschaft Büchsenschütze
mastership.alchemy.herbal_medicine.desc=Der Alchemist kann aus Kräutern (siehe Splittermond: Die Regeln S. 125) mit heilsamer oder stärkender Wirkung eine Arznei herstellen. Diese Arznei zählt als Alchemikum und folgt den üblichen Regeln zur Alchemie mit folgenden Besonderheiten: Für je 3 angefangene Punkte Schwierigkeits-Modifikator des Krauts ist eine Qualitätsstufe des Alchemikums nötig (ein Kraut mit einer Schwierigkeit von bis zu +3 kann also in eine Arznei mit mindesten Qualität 0 umgewandelt werden). Zur Herstellung der Arznei ist zusätzlich zu den üblichen Voraussetzungen eine Dosis des entsprechenden Krauts nötig. Die Wirkungen von Kräutern können nicht kombiniert und auch die Wirkung eines einzelnen Krauts nicht mehrfach in einer Arznei genutzt werden. Zusätzlich zu sonstigen Auswirkungen kann eine Arznei auch in ihrer heilsamen Wirkung verstärkt werden: Für je eine dafür auf- gewendete Qualitätsstufe kann eine Heilkunde-Probe bei Verwendung der Arznei um 1 Punkt erleichtert werden. Eine Arznei ist einen Monat haltbar. Pro Tag kann nur von einer Arznei profitiert werden. 
mastership.alchemy.harmonized_alchemy.desc=Der Alchemist kennt Techniken, um Alchemika in Harmonie mit bestimmten Philosophien magisch zu verstärken. Er kann bei der Herstellung eines Alchemikums zwei Punkte Fokus verzehren, um dieses zu verstärken. Seine so hergestellten Tränke erhalten zusätzliche Wirkung in der Höhe einer Qualitätsstufe, die für die sofortige Heilung von Schaden oder einen Attributsbonus (siehe Splittermond: Die Regeln S.144) verwendet werden muss. Dabei können auch die normalerweise geltenden Einschränkungen überschritten werden. Vor­aussetzung: je mindestens 1 Fertigkeitspunkt in 5 verschiedenen Magieschulen
mastership.alchemy.herb_brew.desc=Der Alchemist versteht es, aus heilsamen Kräutern (keine Gifte; siehe Splittermond: Die Regeln, S. 125) stärkende Sude zu brauen. Dies dauert 5 Minuten pro Sud und setzt entsprechende Ausrüstung, den Besitz des frischen Krauts sowie eine gelungene Alchemie-Probe gegen 20 plus die Schwierigkeit des Krauts voraus. Das Kraut wird dabei verbraucht und der Sud muss innerhalb der nächsten 5 Minuten angewendet werden. Der Sud hat die doppelte Wirkung des Krauts und gilt bezüglich aller Regeln als Alchemikum. Voraussetzung: Meisterschaft Kräutertee
mastership.athletics.harmonized_movement.desc=Der Abenteurer hat gelernt, seinen Körper und Geist auf besondere Weise zu verschmelzen und so seine Beweglichkeit zu stärken. Hat er bereits selbst einen Zauber des Typus Bewegung stärken auf sich gewirkt, sind die Kosten für alle weiteren Sprüche desselben Typus um (K)2V1 reduziert. Jeder Zauber benötigt weiterhin mindestens (K)1 Fokus. Voraus­setzung: Meisterschaft Arkane Geschwindigkeit
mastership.clscraft.precise_arkancalligraphy.desc=Der Abenteurer hat gelernt, Magie durch kunstfertige Kalligraphie zu binden und dadurch ungefährlicher zu machen. Wenn jemand eine von ihm speziell für einen Zauber angefertigte Kalligraphie während des Zaubervorgangs in der Hand hält, wirkt bei einem Zauberpatzer dieser um eine Stufe niedriger. Die Kalligraphie verbraucht sich bei diesem Zauber, unabhängig davon, ob ein Patzer vorliegt oder nicht. Die Anfertigung einer solchen Kalligraphie benötigt 5 Minuten, setzt die Kenntnis des jeweiligen Zaubers voraus und verbraucht Material im Wert von 25 Telaren. Es kann nur eine Zauberkalligraphie gleich welcher Art pro Zauber genutzt werden. 
mastership.clscraft.skillful_arkancalligraphy.desc=Der Abenteurer hat gelernt, die Schwingungen der Magie durch kunstfertige Kalligraphie zu binden und zu verstärken. Wenn jemand eine von ihm speziell für einen Zauber angefertigte Kalligraphie während des Zaubervorgangs in der Hand hält, erhält dieser bei einem erfolgreich gewirkten Zauber einen zusätzlichen EG, den er gemäß den üblichen Regeln einsetzen kann. Die Kalligraphie verbraucht sich bei diesem Zauber, unabhängig davon, ob er gelingt oder nicht. Die Anfertigung einer solchen Kalligraphie benötigt 5 Minuten, setzt die Kenntnis des jeweiligen Zaubers voraus und verbraucht Material im Wert von 25 Telaren. Es kann nur eine Zauberkalligraphie gleich welcher Art pro Zauber genutzt werden.
mastership.heal.medicinelore.desc=Wird irgendeine Art von Arznei oder Medizin bei einer Heilung durch eine Heilkunde-Probe eingesetzt, heilt der Patient bei Gelingen der Probe sofort 2 zusätzliche Punkte Schaden. Als Arznei oder Medizin im Sinne dieser Meisterschaft zählt jedes Kraut oder Alchemikum, das Krankheiten, Gifte, Zustände oder Schaden heilt.
mastership.heal.harmonized_heal.desc=Der Heilkundige kennt Techniken, um seine Kunst in Harmonie mit bestimmten Philosophien magisch zu verstärken. Er kann bei einer Heilkunde-Probe (auch nachträglich) 3 Punkte Fokus verzehren, um einen Bonus in Hö- he von 3 Punkten auf die Probe zu erhalten. Voraussetzung: je mindestens 1 Fertigkeitspunkt in 5 verschiedenen Magieschulen
mastership.nature.herb_tea.desc=Der Abenteurer kennt Wege, um aus speziell für diesen Zweck getrockneten Kräutern Tees zu brauen. Um ein Kraut entsprechend zu präparieren, ist eine Naturkunde-Probe gegen 15 plus der Schwierigkeits-Modifikator des Krauts nötig. Gelingt diese Probe, kann zu einem späteren Zeitpunkt das getrocknete Kraut mit heißem Wasser aufgebrüht werden (Dauer: 5 Minuten, keine Probe nötig). Der so gebraute Tee hat die halbe Wirkung des Krauts. Sollte eine solche Halbierung nicht möglich sein, hat er die volle Wirkung, verursacht dafür aber für zwei Stunden den Zustand Erschöpft 2. Pro Tag kann nur von einem Kräutertee profitiert werden. Das präparierte Kraut ist unbegrenzt haltbar. 
mastership.antimagic.antighostseal.desc=Der Zauberer kennt Geheimnisse, wie er seine Zauber mit Bannzeichen gegen Geister verbessern kann. Wenn er speziell auf ein anwesendes Wesen des Typus Geister­wesen abgestimmte Bannzeichen auf einem passenden Objekt anbringen kann, senkt dies die Kosten an erschöpftem Fokus von gegen dieses Wesen gewirkten Bannzaubern um 4V1 oder die Kosten an kanalisiertem Fokus um K3V1. Die Mindestkosten betragen einen erschöpften oder kanalisierten Punkt Fokus. Die Zauberdauer des Zaubers erhöht sich dafür um 12 Ticks. Vor­aussetzung: Meisterschaft Geselle (Kalligraphie) in Edelhandwerk
mastership.antimagic.protection_field_fixation.desc=Der Zauberer kennt Zaubersiegel, um Bannkreise an Orte zu binden. Er kann Zauber des Typus Schutz­feld mit einem Flächeneffekt an einem Ort fixieren, wodurch diese wie folgt verändert werden: Der Radius der Wirkung wird vom gewählten Ort aus gemessen, die Wirkungsdauer verändert sich auf 8 Stunden, bei den Kosten wird kanalisierter Fokus in erschöpf­ten Fokus umgewandelt. Es kann kein kanalisierter Fokus über EG eingespart werden, stattdessen können erschöpfter Fokus und die Wirkungsdauer gemäß den üblichen Regeln modifiziert werden.
mastership.combatmagic.legendaryfist.desc=Der Zauberer kann bis zu zwei Zauber des Typus Hand selbst dann miteinander kombinieren, wenn dies eigentlich nicht möglich ist. Dadurch erhöhen sich die Kosten des zweiten gewirkten Zaubers um K2V2 und bei diesem ist die Nutzung der Verstärkung nicht möglich.
mastership.deathmagic.ghosthunter.desc=Der Zauberer besitzt große Erfahrung im Kampf gegen Geister. Er erhält einen Bonus in Höhe von 3 Punkten auf Angriffe, ebenso auf Proben auf Arkane Kunde und Wahrneh­mung gegen Wesen des Typus Geisterwesen.
mastership.deathmagic.ghostpresence.desc=Der Zauberer zieht aus der Anwesenheit von Geistern Kraft für seine Zauber. Solange sich mindestens ein Wesen des Typus Geisterwesen im Umkreis von 10 m befindet und ihm dieser Umstand bekannt ist, erhalten alle seine Zauber des Typus Geisterwesen einen Bonus in Höhe von 4 Punkten. 

spell.anticircle_ghost.descr=Der Zauberer erschafft einen Schutzkreis von 3 Metern Radius. Wesen des Typus Geisterwesen können den Kreis nur betreten, wenn ihnen eine Probe auf Entschlossenheit gegen 25 gelingt. Sie können aber mit Fernwaffen oder Zaubern in den Kreis einwirken. Wesen des Typus Geisterwesen, die sich bei Auslösen des Zaubers in 3 Metern Umkreis um den Zauberer befinden, werden bei Misslingen der Probe vom Zauber nach außen gedrängt.
spell.anticircle_ghost.enhancedescr=Schwierigkeit für die Entschlossenheit-Probe erhöht sich auf 30.
spell.thornfist.descr=Die Hand des Zauberers wird borkig und mit Dornen gespickt. Im unbewaffneten Nahkampf richten seine Angriffe echten Naturschaden an und besitzen das Waffenmerkmal Exakt 1. Dieser Zauber ist nicht mit anderen Zaubern des Typus Hand kombinierbar.
spell.thornfist.enhancedescr=Zusätzlich richtet der Zauberer im unbewaffneten Nahkampf einen Punkt echten Naturschaden an und seine Faust erhält das Waffenmerkmal Scharf 3.
spell.exorcism.descr=Ein Wesen des Typus Geisterwesen wird zurück in die Geisterwelt geworfen, sofern es über keinen Anker im Diesseits verfügt (es also etwa an einen bestimmten Ort oder Gegenstand gebunden ist). Sollte ein von diesem Zauber betroffenes Wesen einen entsprechenden Anker besitzen, verschwindet es für 8 Stunden, um anschließend wieder am Ort seines Ankers aufzutauchen. Innerhalb der Geisterwelt kann der Zauber nicht angewandt werden. 
spell.exorcism.enhancedescr=Ein zweites Wesen gleichen oder niedrigeren Körperlichen Widerstands kann unter den oben genannten Bedingungen gebannt werden. 
spell.frosthold.descr=Die Hand des Zauberers wird von scharfkantigem Eis überzogen. Im unbewaffneten Nahkampf richten deine Angriffe echten Eisschaden an und besitzen das Waffenmerkmal Kritsich 2. Dieser Zauber ist nicht mit anderen Zaubern des Typus Hand kombinierbar.
spell.frosthold.enhancedescr=Zusätzlich richtet der Zauberer im unbewaffneten Nahkampf zwei Punkte echten Eisschaden an.
spell.weakening_ghost.descr=Das von dem Spruch betroffenen Geisterwesen erhält einen Malus in Höhe von 5 Punkten auf alle Nahkampf- und Fernkampfangriffe.
spell.weakening_ghost.enhancedescr=Der Malus gilt für alle Angriffe.
spell.ghostsight.descr=Der Zauberer ist in der Lage, in seinem Sichtfeld alle Wesen des Typus Geisterwesen in ihrer wahren Gestalt zu sehen, sofern diese sich im Diesseits befinden. Eventuelle Fähigkeiten der Wesen, um nicht gesehen oder erkannt zu werden \u2013 wie etwa Unsichtbarkeit oder Verwandlungsmagie \u2013, werden durch den Zauberer ignoriert. 
spell.ghostsight.enhancedescr=Der Zauberer erhält einen Bonus in Höhe von 2 Punkten auf alle Proben gegen durch diesen Zauber sichtbare Wesen des Typus Geisterwesen. 
spell.impro_weapon.descr=Ein Gegenstand, der eigentlich keine Waffe ist, erhält zwei zusätzliche Punkte Härte und kann als improvisierte Nahkampfwaffe geführt werden. Dabei gelten für den Gegenstand wahlweise die Werte von Säbel, Streitkolben, Kampfstab oder Kettensichel (jeweils mit folgenden Ergänzungen: WGS +2, Schaden \u20132, zusätzliches Merkmal Improvisiert). Zur Führung des Gegenstands als Wa e wird die Fertigkeit benötigt, die zum gewählten Werteschema passt. Es muss beim Auslösen des Zaubers festgelegt werden, die Werte welcher Art Waffe gewählt wird.
spell.impro_weapon.enhancedescr=Die Waffe richtet 1 zusätzlichen Punkt Schaden an.
spell.watersprint.descr=Der Zauberer kann über Wasser laufen, solange er sich dabei kontinuierlich bewegt. Sollte er sich nicht bewegen, versinkt er wie üblich. Bei starkem Wellengang können Akrobatik-Proben verlangt werden, um Stürze (und ein da- raus resultierendes normales Versinken) zu vermeiden. 
spell.watersprint.enhancedescr=Der Zauberer kann \uFFFCwährend der Wirkungsdauer auch stehenblieben, ohne im Wasser zu versinken. 
spell.magicalbalance.descr=Der Zaubernde kann sich auch über besonders ungewöhnliche oder zerbrechliche Oberflächen (Spieße einer Speergrube, einzelne Äste eines Baumes, Tonkrüge) balancierend (vgl. Splittermond: Die Regeln S. 102) bewegen, ohne diese dabei zu zerbrechen oder sie zum Nachgeben zu bringen. Er erleidet auch bei besonders spitzen Gegenständen keinen Schaden durch das Laufen auf diesen. 
spell.magicalbalance.enhancedescr=Die Geschwindigkeit des Ziels erhöht sich beim Balancieren generell um 1 Punkt. 

item.elexier_peach.desc=Das Elixier verleiht für 5 Jahre ein jugendliches Äußeres, ohne dabei die Lebenserwartung oder die körperliche Fitness zu ändern. 
item.firelance.desc=Eine Feuerlanze löst nach Auslösung (kont. Aktion von 15 Ticks Dauer) einen Schrapnellkegel aus, der vom Auslöser 3 Meter weit reicht. Jeder im Wirkungsbereich er- hält 3W6 Punkte Schaden (mit dem Waffenmerkmal Schadensschwund 2 für Flächeneffekte). Am Ort des Entstehens ist der Kegel einen halben Meter breit und wächst bis zur Maximalen Entfernung um je einen halben Meter pro zurückgelegtem Meter. Der Auslösende unterliegt dem Waffenmerkmal Rückstoß 2.

item.jiaougulan.desc=stark positiver Umstand auf Heilkunde-Proben
item.fireleaf.desc=Bonus in Höhe von 1 Punkt auf Athlethik-Proben
item.kotopepper.desc=Bonus in Höhe von 1 Punkt auf Wahrnehmung-Proben

material.ghostsilk.desc=Nur aus den Kokons der sagenumwobenen Geisterfalter der Spinnenprovinz kann die Geisterseide gewonnen werden, der eine besondere Verbindung ins Jenseits nachgesagt wird. Die Roben der höchsten Mitglieder des Ministeriums für Geisterangelegenheiten werden traditionell aus diesem Material gefertigt.
material.ghostsilk.effect=Der Träger eines Gegenstandes aus Geisterseide erhält einen Bonus in Höhe von 1 Punkt auf den Geis­tigen Widerstand. Darüber hinaus erhält er einen Bonus in Höhe seines halben Verstandes auf seinen Fokus. Für letztgenannten E ekt benötigt die Seide einige Tage zur \u201EEinstimmung\u201C auf den Träger, die Punkte sind also nicht sofort verfügbar. Maximal kann ein Träger von einem Gegenstand aus Geisterseide gleichzeitig profitieren. 
material.fetheroakwood.desc=Das extrem leichte und biegsame Holz der Federeiche, die im Aiun und den anderen Gebirgen des nördlichen Zhoujiang wächst, ist vor allem bei jenen beliebt, die sich viel in der Wildnis aufhalten müssen.
material.fetheroakwood.effect=Gegenstände aus Federeichenholz haben eine um 1 Punkt reduzierte Last und gewähren einen Bonus in Höhe von 1 Punkt auf Windmagie. Es kann nur von einem solchen Gegenstand gleichzeitig profitiert werden. 
material.wood_aiun_zeder.desc=Das Holz der Aiun-Zeder ist nicht nur hervorragend zum Bau von Häusern geeignet, aus ihm lassen sich auch Holzinstrumente mit hervorragenden Klangeigenschaften herstellen. Traditionell werden alle Trommeln und Klanghölzer der zhoujiangischen Klöster ausschließlich aus diesem Material hergestellt.
material.wood_aiun_zeder.effect=Ein passendes Musikinstrument aus dem Holz der Aiun-Zeder ermöglicht dem Nutzer, einen Erfolgsgrad mehr zu nutzen, als es ihm normalerweise möglich wäre.
material.leather_quigong_kaimans.desc=Aus der silbrigen Haut des Quigong-Kaimans der Flussdelphinprovinz können besonders widerstandsfähige Lederrüstungen hergestellt werden, die sich in ganz Zhoujiang großer Beliebtheit erfreuen. 
material.leather_quigong_kaimans.effect=Eine Rüstung aus dem Leder Quigong- Kaiman hat eine um 1 Punkt erhöhte Schadensreduktion. Im Gegenzug sind jedoch auch Behinderung oder Tick-­Zuschlag um 1 Punkt erhöht.
