education.wogensinger.descr=Insbesondere die jüngeren Generationen der Afali verfügen über ein geradezu intuitives Gespür für das Meer. Die besonders talentierten unter ihnen werden zu sogenannten Wogensängern ausgebildet, die als herausragende Navigatoren den Kurs ihrer Sippe bestimmen.
