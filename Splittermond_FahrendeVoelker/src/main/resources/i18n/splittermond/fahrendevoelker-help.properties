mastership.performance.motivativ_precentor.desc=Wenn der Abenteurer mittels der Meisterschaft Vorsänger durch ein Arbeitslied Verbündete koordiniert, steigt der Bonus aus Koordinieren um 1 Punkt. 
mastership.performance.precentor.desc=Der Abenteurer kennt rhythmische und motivierende Lieder, mit denen er die Arbeit in einer Gruppe ordnen kann. Er kann Darbietung statt Anführen einsetzen, um Verbündete zu koordinieren (siehe Regeln zu Koordinieren in Splittermond: Die Regeln, S. 104).
mastership.performance.hikingsong_boost.desc=Profitiert der Abenteurer von der Auswirkung der Meisterschaft Wanderlied, kann er eine Stufe des aus einer von Wanderlied betroffenen Tätigkeit resultierenden Zustands Erschöpft ignorieren.
mastership.performance.hikingsong.desc=Wenn der Abenteurer während einer anstrengenden und langwierigen Tätigkeit (etwa während eines Gewaltmarsches oder wenn es um Tätigkeiten mit drohender Überanstrengung geht) ein Wanderlied singt oder spielt, erhält er einen Bonus auf mit dieser Tätigkeit unmittelbar zusammenhängende Zähigkeit-Proben in Höhe von 1 Punkt (+1 pro EG) Um das Lied erfolgreich anzustimmen, ist eine kontinuierliche Aktion von 15 Ticks Dauer mit einer gelungenen Darbietung-Probe gegen 20 nötig. Das Lied muss während des Großteils der Tätigkeit gespielt oder gesungen werden, um von seinem Effekt zu profitieren.
mastership.seafaring.wavereading.desc=Der Abenteurer erhält, sofern er den Wellengang eines Gewässers mindestens 5 Minuten beobachten kann, einen Bonus in Höhe von 3 Punkten auf alle direkt folgenden Proben zur Orientierung auf und an diesem Gewässer.
mastership.seafaring.savethroethestrom.desc=Der Abenteurer kann negative Umstände durch rauen Seegang und Sturm bei allen Seefahrt-Proben ignorieren.

spell.luckymeeting.descr=Wenn bei Nutzung der Reiseregeln (siehe Splittermond: Die Regeln S. 151) eine Reisebegegnung bestimmt wird, wird zweimal gewürfelt und der Zauberer kann entscheiden, welcher der beiden Würfe für die Begegnung der Reisegruppe gewählt wird. Der Zauber muss an jedem Tag der Reise gewirkt werden, wenn der Ereigniswurf erst am Ende mehrerer Tage stattfindet.
spell.luckymeeting.enhancedescr=Sollte es zu einer Begegnung kommen, erhält der Zauberer einen leicht positiven Umstand auf seine etwaige erste Probe im Rahmen der Reisebegegnung.
spell.traveling_fare.descr=Bei Nutzung der Reiseregeln (siehe Splittermond: Die Regeln S. 151) erhalten etwaige Proben zur Versorgung einen stark positiven Umstand. Der Zauber muss an jedem Tag der Reise gewirkt werden, wenn der Ereigniswurf erst am Ende mehrerer Tage stattfindet.
spell.traveling_fare.enhancedescr=Sofern die Probe zur Versorgung gelingt, werden die erlangten Rationen verdoppelt.
spell.animalherold.descr=in einzelnes Wesen des Typus Tier bis max. Größenklasse 3, das dem Zauberer gegenüber mindestens die Einstellung Neutral aufweist, überbringt eine gesprochene Nachricht von maximal 20 Sekunden Länge an einen dem Zauberer bekannten Ort und verschwindet anschließend. Das Tier spricht dabei mit einer Stimme, die zur jeweiligen Art passt (ein Wolf spricht knurrend, ein Bär brummend, ein Fisch blubbernd, ein Singvogel trällernd, etc.). Innerhalb eines Tages können Landtiere zwischen 10 (z.B. kleine Säugetiere) und 50 km (z.B. Wölfe oder Wildschweine) zurücklegen, Vögel oder Fische sogar zwischen 50 (z.B. Singvögel, Schwarmfische) und 200 km (weit wandernde Zugvögel, Delphine).
spell.animalherold.enhancedescr=Das Tier überbringt die Botschaft nicht nur an einen Ort, sondern dort sogar einer bestimmten, dem Zauberer bekannten Person.
spell.drinkingwater.descr=Der Zauberer kann Salzwasser trinken, als wäre es Süßwasser.
spell.drinkingwater.enhancedescr=Das Wasser wird zusätzlich von allen natürlichen Verunreinigungen wie etwa Krankheitserregern gereinigt, nicht aber von alchemistischen Stoffen.
spell.birdscream.descr=Das Ziel des Zaubers wird von einem plötzlich erscheinenden Schwarm Vögel umschwirrt, der ein ohrenbetäubendes Gekreische und Geschnatter ausstößt. Sämtliche Versuche, etwas vom Opfer des Zaubers Gesprochenes zu verstehen, benötigen eine gelungene Wahrnehmung-Probe gegen 15 zuzüglich der Fertigkeitspunkte des Zauberers in Naturmagie. Die Vögel können angegriffen werden und verschwinden, wenn ihre Lebensenergie auf 0 sinkt (Werte wie Taube, siehe Splittermond: Die Regeln, S. 285).\nInsgesamt sind es halb so viele Vögel, wie die Schwierigkeit der Wahrnehmung-Probe beträgt. Mit jedem erschlagenen Vogel sinkt die Schwierigkeit der Wahrnehmung-Probe um 2 Punkte.
spell.birdscream.enhancedescr=Die Schwierigkeit der Wahrnehmung-Probe erhöht sich auf 25 zuzüglich der Fertigkeitspunkte des Zaubers in Naturmagie.

