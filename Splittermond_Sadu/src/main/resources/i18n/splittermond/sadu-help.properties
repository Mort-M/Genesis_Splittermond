
education.swamppilot.descr=Sümpfe sind oft heimtückische Orte, die unbedachte Wanderer leicht in ein feuchtes Grab locken können. Sumpflotsen begleiten daher oft Reisende auf ihrem Weg durch den Morast, sind jedoch bisweilen auch allein unterwegs, um den Zustand der wenigen Wege zu prüfen, Heilkräuter zu sammeln oder Hinterlassenschaften jener Reisender zu bergen, die sich keinen Lotsen leisten wollten. Die Sumpflotsen im Matalino und am Unterlauf des Kabila leiten auch Schiffe sicher zu ihren inländischen Häfen.  
education.hatangabi_chainwarrior.descr=Die Söldner Bawalins sind weit über die Grenzen ihrer Heimat hinaus gefürchtet. Nicht nur wird ihre Zähigkeit und Loyalität gerühmt, sondern vor allem der virtuose Umgang der Hatangabi-Kettenkrieger mit der Kettenaxt, die sie für Entergefechte ebenso verwenden wie für Scharmützel auf dem Land.
education.horizonhorseman.descr=In den Weiten der Tuntungan-Steppe sind die Horizontreiter ein vertrauter Anblick. Diese Späher überbringen Botschaften zwischen den Stämmen, lokalisieren wilde Herden, gehen Gerüchten über das Auftreten von Natur- und Ahnengeistern nach und kämpfen in Stammesgefechten als Vorhut.
education.huekho_mountainguide.descr=Die Kultur der Hue-Kho im Hatangabi-Gebirge bleibt häufig vor den Blicken von Fremden verborgen, zu abgeschieden sind ihre Siedlungen und zu zurückgezogen genießen sie ihr Leben. Wer jedoch den beschwerlichen Weg auf sich nimmt, trifft fast immer zunächst auf einen ihrer Bergführer, der Reisende sicher über Schluchten und Steilhänge geleitet und sich auch in den Höhlen auskennt.
education.jadejudge.descr="Begegne gelassen dem Schicksal, gerecht den Sterblichen, gehorsam den Geistern. Sei eifrig im Studium, weise im Urteil, entschlossen im Kampf!" Die reisenden Vertreter der Kaiserlichen Schiedsbehörde verbinden die Fähigkeiten des Chi-Kung-kundigen Wandermönchs mit denen eines traditionellen Beamten und reisenden Rechtswahrers. Sie werden weithin für ihre Neutralität und Gesetzestreue gerühmt.

culture.flussleute_kabila.desc=In den einzelnen Fürstentümern hat oft ein bestimmtes Volk die Oberhand. In Latian sind es Gnome, in Bawalin Zwerge, die Tuntungan durchstreifen menschliche Reiter und in den Transkabilischen Wäldern wohnen aus Kintai geflohene Alben. Daneben existieren noch unzählige weitere Fürstentümer und lokale Herrschaften, denen oftmals nur ein kurzes Dasein beschieden ist. Die Wohlhabenderen leben in den kulturell hochstehenden Städten, während das umliegende Acker- und Weideland meist rückständig und arm ist.Auf der Halbinsel herrschen trotz langer Trennung immer noch Lebensart und Sprache Zhoujiangs vor. Die Rollen von Obrigkeit und Untertan sind auf dem Land klar verteilt, in der Stadt hingegen versucht ein aufkommendes Bürgertum, politisch Einfluss zu nehmen. Die Unterwelt zielt auf materiellen Gewinn. Fremden begegnet man gastfreundlich, wahrt aber stets ein Mindestmaß an Distanz.
