education.border_crosser.descr= Scharfkantig, rau, unbeugsam, hart \u2013 der Grenzgänger ist ein Abbild seiner ungezähmten Heimat. Man ndet ihn an all jenen Orten auf Lorakis, wo größere und miteinander vernetzte Siedlungen noch nicht Fuß fassen konnten. Im Gegensatz zu Waldläufern, die in die Wildnis hinausziehen, um zahlungskräftige oder unbedarfte Personen vor Gefahren zu schützen oder das Land für Adlige, Handelsherren oder Heerführer zu erkunden, ist dem Grenzgänger an erster Stelle daran gelegen, sich inmitten der widrigsten Umweltbedingungen ein Heim zu errichten und dieses sowie seine Freiheit \u2013 notfalls bis auf denTod \u2013 zu verteidigen. Grenzgänger müssen der Natur täglich das Notwendigste zum Leben abringen. Unabdingbar sind für sie daher neben Durchhaltevermögen und Geschick auch eine gesunde Prise Unerschrockenheit, da sie genau jene Orte ihr Zuhause nennen, an die sich viele andere niemals wagen würden. Die Lebensumstände der Grenzgänger haben sie oft vorsichtig, mürrisch und durchaus verschroben werden lassen. Die harten Gegebenheiten der Grenzgebiete erfordern und prägen die grundlegenden Fähigkeiten eines Grenzgängers. Er muss auf sich selbst aufpassen können und erlernt die nötigen handwerklichen Fähigkeiten, um sich in der Wildnis eine Heimstatt zu errichten, diese zu erhalten und für Nahrungsmittel zu sorgen. Nicht zuletzt erfordert die Verteidigung der hart erarbeiteten Behausung auch gesundes Geschick im Umgang mit verschiedenen Waren, das ein Grenzgänger angesichts einer erbarmungslosen Umwelt erlangt hat, die keinen Bissen freiwillig hergibt. Es gibt verschiedene Gründe, das zurückgezogene Leben an den Grenzen der Zivilisation zu wählen. Manche Grenzgänger wurden durch Verfolgung oder persönliche Notlagen zur Flucht gezwungen, andere haben sich bewusst für dieses Leben entschieden, um auch der bislang unberührten und unerforschten Natur ihr ganz eigenes Stück Land abzuringen, für das sie keiner Obrigkeit Rechenschaft ablegen müssen und auf dem ihre ganz eigenen Gesetze gelten. Es braucht schon einen triftigen Grund, um einen Grenzgänger dazu zu bringen, seine Heimat zu verlassen. Bisweilen je- doch machen es die persönliche Vorgeschichte, der Verlust der selbst erarbeiteten Existenz oder auch einfach nur die Notlage einer hilflosen, an den Grenzen der Welt gestrandeten Person erforderlich, aus der Einsamkeit der Wildnis auszubrechen und den Weg zurück in die Zivilisation zu suchen.
education.westergrom_resister.descr=An den westlichen Hängen des Graulenkamms gibt es eine Talsiedlung von Westergromer Widerständlern. Jenseits der Bergfesten der Furgand haben sich hier Gleichgesinnte eingefunden, die eine bescheidene Heimstatt abseits der zwergischen Herrschaft errichtet haben. Die Widerständler sind für ihr ausgeprägtes Zusammengehörigkeitsgefühl ebenso bekannt wie für ihre Kontakte in ganz Westergrom und den westlichen Grenzlanden.
education.farn_ranger.descr=Im Osten des Unreichs erzählt man in vielen Wehrgasthöfen unglaubliche Geschichten von den Farnischläufern, die immer wieder in das Reich Irlischs eindringen und lebend zurückkehren. Manche glauben, diese Männer und Frauen seien mit den Feendienern des verrückten Einhorns im Bunde, andere wiederum erzählen sich, dass sie wie Schatten durch die Wälder huschen und selbst eine Dryade sie kaum bemerke, wenn die Farnischläuferdiesnichtwollen.
education.tree_settler.descr=Nicht nur im Unreich gibt es Grenzgänger, wie das Beispiel der Baumsiedler in Marakatam, Gotor und Kutakina zeigt, die alleine oder in kleinen Gruppen in den Wipfeln mächtiger Riesenbäume ihr Heim errichten. Sie versuchen, dem Trubel und den Intrigen der Artefaktokraten und Neusiedler zu entgehen und im Dschungel ein friedliches Leben zu führen. 

item.speichel_irlisch.desc=Heilt 15 LP, Krankheiten bis Grad 4 und Gifte bis Grad 3. Hebt negative Zustände außer Siechtum (und damit verknüpfte Zustände) auf. 
item.furbroms_tränen.desc=Kältestufe ist für Träger um 1 Stufe gesenkt. Ein Jahr ohne Aufladung haltbar. 
item.blutahorn.desc=Senkt Zustand Blutend um 2 Stufen (einmal pro Tag).
item.fetzenfarn.desc=Verleiht für 1 Tag Stärke Feensinn (ohne GW-Bonus), senkt währenddessen GW um 2 Punkte und verleiht Zustand Benommen 1.
item.mondblatt.desc=+2 Regeneration von verzehrtem Fokus in nächster Ruhephase (einmal pro Tag). 

material.eyeofrisskir.desc=Mitunter stoßen Abenteurer oder Wildnisläufer im Rattwald auf Leichname alter Körper von Risskir (und werden mit etwas Glück anschließend nicht von Rattlingen zu Tode gehetzt). Aus den Augen solcher Leichname lassen sich Talismane herstellen, die etwas von der Kraft der Zauberschlange in sich tragen. 
material.eyeofrisskir.effect=Talismane aus den Augen von Risskir gewähren dem Träger einen Bonus in Höhe von je 1 Punkt auf Beherrschungs- und Illusionsmagie. Hierbei kann nur von einem solchen Gegenstand gleichzeitig profitiert werden.
material.blutahornholz.desc=Im Rattwald wächst der Blutahorn, der nicht nur von Alchemisten für seine tiefvioletten, heilkräftigen Blätter (siehe S. 26) geschätzt wird, sondern dessen rötliches Holz auch destruktive magische Energien zu verstärken in der Lage ist. 
material.blutahornholz.effect=Wenn ein Träger einen Gegenstand aus Blutahorn während des kompletten Zaubervorgangs in der Hand hält, erhält der Schaden der von ihm gewirkten Zauber des Typus Schaden (sofern dieser Schaden einmalig angerichtet wird) das Merkmal Scharf 2. Ein etwaiges vorhandenes Merk- mal Scharf wird um 1 Stufe erhöht. Hierbei kann nur von ei- nem Gegenstand gleichzeitig profitiert werden. 
material.graulwurmleder.desc=Aus der Haut des drachenartigen Graulwurms (siehe S. 35) lässt sich ein zähes Leder gewinnen, das sich bei Alchemisten und Wildnisläufern als Material für Kleidung und Rüstungen Beliebtheit erfreut, da ein Teil der den Würmern eigenen Giftresistenz auf den Träger übergeht. Der üble Geruch des Materials lässt sich jedoch kaum übertünchen, sodass man außerhalb des Unreichs nur selten Träger solcher Kleidung sieht. 
material.graulwurmleder.effect=Gegenstände aus Graulwurmleder haben eine Härte von 8 gegen Säuren aller Art und erhalten zweimal die Verbesserung Schutz vor Säureschaden, die nicht gegen das Maximum dieser Verbesserung zählt. Der Körperliche Widerstand eines Trägers von Rüstungen oder ganzen Sätzen Kleidung aus Graulwurmleder ist außerdem gegen Gifte um 2 Punkte erhöht. Träger entsprechender Rüstungen oder Kleidungssätze erhalten einen leicht negativen Umstand in sozialen Konflikten. Es kann nicht von Rüstung und Kleidung aus Graulwurmleder gleichzeitig profitiert werden. 
material.nebeleisen.desc=Das nur an von besonders viel magischer Kraft durchdrun-genen Orten im Rattwald heimische Mondblatt ist ein strauchartiges Gewächs mit tiefblauen Blättern und bläulich schimmernder Rinde. Wird letztere vorsichtig vom lebenden Baum abgetrennt, kann sie zu wiederverwendbarem Verbandszeug verarbeitet werden, wird aber von manchem Magier auch schlicht als Talisman benutzt, um heilsame magische Energien besser fokussieren zu können.  
material.nebeleisen.effect=Verbandszeug aus Mondblattrinde erhöht die nächtliche Regeneration von Lebensenergie des Ziels, sofern eine entsprechende Heilkunde-Probe gelungen ist, um weitere 2 Punkte. Beim Zaubervorgang in der Hand gehaltene Talismane aus Mondblattrinde sorgen dafür, dass bei Zaubern des Typus Leben ein Punkt erschöpfter oder kanalisierter Fokus eingespart werden kann. Dabei kann jeweils nur von einem solchen Gegenstand gleichzeitig profitiert werden. 
material.mondblattrinde.desc=An einigen Stellen des Nebeltals finden Prospektoren zwischen gewöhnlichen Adern von Eisenerz mitunter Stellen, an denen das seltene Nebeleisen vorkommt. Daraus hergestellter Stahl sieht eher stumpf aus und spiegelt auch poliert kaum, ist dafür aber ob seiner durchschlagenden Eigenschaften bei Waffenschmieden beliebt. 
material.mondblattrinde.effect=Nahkampfwaffen aus Nebelstahl verursachen 1 (bei Wa en bis zu einer unmodifizierten WGS von 7) bzw. 2 (bei Wa en ab einer unmodifizierten WGS von 8) zusätzliche Punkte Schaden. Dafür erhält die Wa e das Merk- mal Unhandlich (kumulativ mit einem eventuellen Merkmal, das die Wa e bereits standardmäßig besitzt). 
material.schuppen_giftfang.desc=Während es kaum aussichtsreich ist, den selbsternannten Herrn des Graulenkamms zur Strecke zu bringen, verliert der Drache doch immer wieder einmal Schuppen, die von glücklichen Findern im ganzen Unreich aufgestöbert werden können. Gerüchteweise soll ein Feenschmied aus Herathis sogar eine hohe Belohnung auf solche Schuppen ausgesetzt haben, um genug für eine ganze Rüstung zu erhalten. 
material.schuppen_giftfang.effect=Rüstungen aus den Schuppen von Giftfang erhalten viermal die Verbesserungen Schutz vor Kälte-, Säure- und Wasserschaden, die nicht gegen das normale Maximum dieser Verbesserungen zählen. Weiterhin erhalten entsprechende Rüstungen das Merkmal Stabil (und daraus resultierend BE +1). Der Körperliche Widerstand von Trägern einer solchen Rüstung erhöht sich um 2 Punkte, dafür erleidet der Träger, solange er die Rüstung trägt, aber 3 Punkte kanalisierten Schaden. Der Geistige Widerstand von Wesen der Typen Tier und Monster ist gegen Träger von Gegenständen aus Schuppen Giftfangs um 2 Punkte gesenkt.

