culturelorescreen.title=Kulturkunden
culturelorescreen.lblDesc=Die linke Spalte zeigt die noch nicht gewählten Kulturkunden und die zugehörigen Sprachen. Bei den Sprachen wird farblich hervorgehoben, welche man beherrscht.\nMittels Drag&Drop lassen sich die Kulturkunden aktivieren bzw. dies wieder rückgängig machen. Letzteres geht auch durch das Abwählen einer evtl. angezeigten Checkbox.
culturelorescreen.chkIncl=Auch nicht wählbare Kulturkunden zeigen
culturelorescreen.lblIncl=Wählbar sind nur solche Kulturkunden, deren zugehörige Sprache man beherrscht.
currency.lunare.short=L
currency.telare.short=T
descr.attribute.charisma=Charme und Charisma sind nur zwei Bestandteile des Attributs Ausstrahlung, ebenso gehören Führungsstärke und Präsenz dazu. Mit einem hohen Wert besitzt man eine beeindruckende Persönlichkeit, die sich sowohl in einer bedrohlichen Aura als auch in einem gewinnenden Wesen äußern kann. Menschen, Tiere und andere Kreaturen reagieren auf einen Abenteurer mit hoher Ausstrahlung eher wie von ihm gewünscht, während sie sich von einem Abenteurer mit geringer Ausstrahlung nicht so leicht beeinflussen lassen.\n\nWird beispielsweise benötigt für folgende Abgeleitete Werte und Fertigkeiten: Anführen, Diplomatie, Redegewandtheit, Straßenkunde, viele Magieschulen
descr.attribute.agility=Beweglichkeit steht für körperliche Gewandtheit und Agilität. Geschmeidige Bewegungen sind ein Kennzeichen beweglicher Abenteurer, sie besitzen eine herausragende Kontrolle über ihre Gliedmaßen und können dem Körper anstrengende Bewegungen abverlangen. Auch geschickte Finger zählen zu diesem Attribut. Abenteurer mit einer geringen Beweglichkeit sind oft unbeholfen und steif.\n\nWird beispielsweise benötigt für folgende Abgeleitete Werte und Fertigkeiten: Geschwindigkeit, Verteidigung, Akrobatik, Heimlichkeit, viele Kampffertigkeiten
descr.attribute.intuition=Das Attribut Intuition steht für die Auffassungsgabe und die Bauchentscheidungen eines Abenteurers. Mit einem hohen Wert in Intuition besitzt man sowohl ein gutes Reaktionsvermögen als auch die Fähigkeit, einem richtigen Instinkt zu folgen. Umgekehrt bedeutet ein schlechter Wert das Fehlen einer inneren Stimme und eine gewisse Überforderung mit unerwarteten Situationen.\n\nWird beispielsweise benötigt für folgende Abgeleitete Werte und Fertigkeiten: Initiative, Empathie, Naturkunde, Überleben, Wahrnehmung
descr.attribute.constitution=Die körperliche Widerstandsfähigkeit und Ausdauer wird mit dem Attribut Konstitution gemessen. Abenteurer mit einer hohen Konstitution sind hart im Nehmen und sind in der Lage, körperlich stark beanspruchende Tätigkeiten lange Zeit auszuüben. Mit einem geringen Wert in Konstitution fehlen Ausdauer und Zähigkeit und ein Abenteurer ist empfindlicher gegenüber Schmerzen oder Krankheiten.\n\nWird beispielsweise benötigt für folgende Abgeleitete Werte und Fertigkeiten: Körperlicher Widerstand, Lebenspunkte, Handwerk, Zähigkeit, einige Kampffertigkeiten
descr.attribute.mystic=Lorakis ist durchzogen von Magie. Das Attribut Mystik misst die Fähigkeit, diese Urkraft zu erspüren und mir ihr umzugehen. Mit einem hohen Wert in Mystik kann man die magischen Kräfte besser in sich aufnehmen und anwenden und besitzt man ein intuitives Verständnis der magischen Vorgänge in der Welt. Ein Abenteurer mit schwach ausgeprägtem Mystik-Attribut kann die Magie schlechter lenken und auch das intuitive Verständnis magischer Zusammenhänge bereitet ihm Schwierigkeiten.\n\nWird beispielsweise benötigt für folgende Abgeleitete Werte und Fertigkeiten: Fokuspunkte, Arkane Kunde, Geschichte und Mythen, alle Magieschulen
descr.attribute.strength=Stärke ist ein Maß für die Muskelkraft eines Abenteurers, vor allem aber dafür, wie gezielt er diese einsetzen kann. Eine große Stärke bedeutet, dass ein Abenteurer fest zuschlagen oder eine Pforte gegen anstürmende Gegner verbarrikadieren kann, das Attribut bestimmt jedoch ebenso seine Sprungkraft. Ein Abenteurer mit geringer Stärke ist schwächlich und kann nur kleine Lasten bewegen.\n\nWird beispielsweise benötigt für folgende Abgeleitete Werte und Fertigkeiten: Verteidigung, Akrobatik, Athletik, viele Kampffertigkeiten
descr.attribute.mind=Intelligenz und die Fähigkeit zu logischem Denken sind Bestandteile des Attributs Verstand. Ein hoher Wert bedeutet ein gutes Abstraktionsvermögen, Kombinations- und Deduktionsgabe und auch die Fähigkeit, Informationen aufzunehmen, sie logisch zu verarbeiten und sich zu merken. Wer wenig Verstand besitzt, ist schlecht im Lösen von Rätseln, im Erkennen wiederkehren der Muster und im Verstehen komplexer Zusammenhänge allgemein.\n\nWird beispielsweise benötigt für folgende Abgeleitete Werte und Fertigkeiten: Geistiger Widerstand, Geschichte und Mythen, Heilkunde, Länderkunde
descr.attribute.willpower=Willenskraft bezeichnet die mentale Widerstandskraft. Selbstbeherrschung, Durchhaltevermögen, gute Konzentration und Furchtlosigkeit sind Zeichen einer hohen Willenskraft. Abenteurer mit einem geringen Wert in diesem Attribut sind hingegen leichter zu beeinflussen, unsicher und mutlos.\n\nWird beispielsweise benötigt für folgende Abgeleitete Werte und Fertigkeiten: Fokuspunkte, Geistiger Widerstand, Körperlicher Widerstand, Entschlossenheit, Wahrnehmung
descr.attribute.size=Die Größenklasse eines Abenteurers ist ein bei der Rassenwahl festgelegter Wert. Es handelt sich nicht um die exakte Körpergröße, sondern um einen abstrakten Wert, der es ermöglicht, eine Person zu anderen lorakischen Kreaturen ins Verhältnis zu setzen. Die Größenklasse beeinflusst die Geschwindigkeit, Lebensenergie, Verteidigung, die Heimlichkeit und verschiedene Aktionen im Kampf.
descr.attribute.speed=Die Geschwindigkeit gibt an, wie schnell sich eine Person oder Kreatur bewegen kann. Sie berechnet sich aus Beweglichkeit + Größenklasse. Zum Einsatz kommt die Geschwindigkeit in erster Linie in Kampf- und Verfolgungssituationen. Für die Ermittlung einer Reisestrecke ist dieser Wert nicht von Bedeutung.
descr.attribute.initiative=Mit der Initiative wird bestimmt, wer im Kampf zuerst handeln kann. Für diesen Wert gilt: Je kleiner die Zahl, desto besser. Die Initiative berechnet sich aus 10 \u2013 Intuition.
descr.attribute.life=Die Lebenspunkte sind das Maß dafür, wie viel ein Charakter einstecken kann. Sie berechnen sich aus Größenklasse + Konstitution. Die Gesundheit eines Abenteurers ist dabei in Gesundheitsstufen eingeteilt. Auf jeder dieser fünf Stufen besitzt der Abenteurer die errechnete Anzahl Lebenspunkte. Wenn über Stärken die Lebensenergie angehoben wird, wirkt sich dies ebenso auf alle fünf Stufen aus.
descr.attribute.focus=Als Fokus wird das Potenzial eines Abenteurers bezeichnet, Magie durch seinen Körper hindurch zu leiten und wirken zu lassen. Dieser Wert gibt die Kapazität an, wie mächtig ein Zauber höchstens sein kann, den der Abenteurer sprechen will. Gleichzeitig erschöpfen sich die Fokuspunkte durch intensiven Gebrauch und stellen somit auch die Grenze dar, wie viele Zauber ein Abenteurer ohne Verschnaufpause und Ruhephase hintereinander wirken kann.\n\nDer Fokus berechnet sich aus (Mystik + Willenskraft) mal 2.
descr.attribute.defense=Verteidigung beschreibt die passive Abwehr gegnerischer Angriffe mit der eigenen Waffe, dem Schild oder einer Körperdrehung. Dieser Wert stellt die Schwierigkeit für entsprechende gegnerische Angriffe dar.\n\nEr berechnet sich aus 12 + Beweglichkeit + Stärke, modifiziert je nach Größenklasse.
descr.attribute.mindresist=Geistiger Widerstand (GW) ist ein Maß, wie hartnäckig sich der Charakter Überredungs- oder Beeinflussungsversuchen widersetzen kann. Ebenso findet er als Schwierigkeit gegen geistbeeinflussende Zauber Anwendung.\n\nEr berechnet sich aus 12 + Verstand + Willenskraft.
descr.attribute.bodyresist=Körperlicher Widerstand (KW) wird verwendet, um Schmerzen, Krankheiten oder Giften zu widerstehen und um Angriffe oder Zauber, die den Körper manipulieren wollen, abzuwehren. Er zählt auch als Schwierigkeit gegen körperbeeinflussende Zauber.\n\nEr berechnet sich aus 12 + Konstitution + Willenskraft.
descr.attribute.damage_reduction=Schadensreduktion
descr.race.alben=\u201EDas schöne Volk\u201C, \u201Edie Ewigen\u201C oder schlicht \u201ESpitzohren\u201C \u2013 das sind nur einige der Beinamen, die immer wieder für die Alben gefunden werden. Diese anmutige und schöne Rasse gilt als stolz und leidenschaftlich und ist für ihren Scharfsinn bekannt. Alben besitzen oft einen Blick fürs Detail und gelten als feinsinnig und kunstfertig, was sie auch in nicht rein albischen Kulturen oft zu Berufen greifen lässt, in denen sie ihre Stärken nutzen können.\n\n
descr.race.dwarf=Die Zwerge von Lorakis sind eine bodenständige Rasse, die vor allem für Ausdauer und Zähigkeit bekannt ist. Zwar sind sie deutlich kleiner als Menschen, Alben oder gar Varge, stehen diesen Rassen aber an Kraft und Widerstandsfähigkeit kaum nach. Nicht selten wählen Zwerge eher zupackende Berufe wie Handwerker oder Krieger. Kunstfertigkeit ist ihnen nicht fremd, zumal sie meist sehr geduldig in ihrem Tun sind. Dies ist mit einer geradezu sprichwörtlichen Dickköpfigkeit verbunden, denn meist wird ein Zwerg einen einmal gefassten Plan mit großer Ausdauer verfolgen.
descr.race.gnome=Diese klein gewachsene Rasse entsprang einst den Feenwelten, und obwohl Gnome heute nicht mehr zu den Feen zählen, finden sie sich noch immer besser in den Feenwelten und auf den Pfaden zwischen den Mondtoren zurecht als andere Rassen. Diese Fähigkeit und ihre Offenheit, ihr sehr gutes Organisationstalent und ihr Forscherdrang, haben ihnen auf ganz Lorakis zu Bekanntheit und Ansehen verholfen. So basiert zum Beispiel die Handels- und Gemeinsprache des Kontinents, das Basargnomische, auf dem alten Gnomischen, und von Angehörigen dieser Rasse betriebene Bünde wie die Portalgilde nehmen großen Einfluss.
descr.race.human=Die zahlreichste und am weitesten verbreitete Rasse auf Lorakis sind die Menschen, die vom Schimmermeer bis zur Ewigen See fast alle bekannten Länder bewohnen. Diese Allgegenwärtigkeit des Menschen entstammt vor allem seiner Vielseitigkeit, gibt es doch kaum Tätigkeiten, die er nicht ausüben, oder Gebiete, die er nicht bewohnen könnte.\nDie Herkunft der Menschen ist unbekannt, ihre Verbreitung auf der ganzen Welt lässt vermuten, dass sie zu den ältesten Rassen auf Lorakis gehören \u2013 zumal sie selbst in den frühesten Legenden aller Völker bereits genannt werden. Zahlreiche Sagen ranken sich um ihre genaue Entstehung, fast ebenso zahlreich wie die unterschiedlichen Völker der Menschen. Oft kommen dabei die Monde vor, zu denen sie eine spezielle Bindung zu besitzen scheinen.
descr.race.varg=Größer, stärker, wilder \u2013 das ist das Bild, das viele Angehörige anderer Völker von den Vargen haben. Ihre Größe und kräftige Statur, unterstützt von dichtem Fell und Raubtiergebiss sowie scharfen Krallen, fallen sofort ins Auge. Doch auch ein enges Zusammengehörigkeitsgefühl und große Treue gegenüber Familie und Freunden prägen die Varge. So findet man sie als friedliche Bürger vieler Dörfer und Städte, die dort ganz alltäglichen Berufen nachgehen und sich als Angehörige eines großen Rudels begreifen. Viele Varge ergreifen das Kriegshandwerk, wofür sie aufgrund ihrer angeborenen Kraft und Ausdauer hervorragend geeignet sind.
descr.race.alben.attr=+1 auf Ausstrahlung,\n+1 auf Beweglichkeit,\n+1 auf ein beliebiges Attribut,\n\u20131 auf Konstitution
descr.race.alben.powers=\uE249 Alben haben eine natürliche Anmut und Grazie, die auch von anderen Völkern bewundert wird (Stärke Attraktivität).\n\uE249 Alben verfügen über äußerst feine Ohren und sind in der Lage, leiseste Geräusche wahrzunehmen (Stärke Scharfes Gehör).\n\uE249 Alben können selbst bei Dämmerlicht noch so gut sehen wie bei hellstem Tageslicht (Stärke Dämmersicht)
descr.race.dwarf.attr=+1 auf Konstitution,\n+1 auf Willenskraft,\n+1 auf ein beliebiges Attribut,\n\u20131 auf Beweglichkeit
descr.race.dwarf.powers=\uE249 Zwerge sind unverwüstlich und sehr widerstandsfähig gegen verdorbene Nahrung, Alkohol und sogar Gifte (Stärke Giftresistenz).\n\uE249 Zwerge sind trotz ihrer Größe äußerst zäh und vermögen es, Verletzungen gut wegzustecken (Stärke Robust).\n\uE249 Zwerge haben ein untrügliches Gefühl für Richtungen und können sich hervorragend orientieren (Stärke Orientierungssinn).
descr.race.gnome.attr=+1 auf Mystik,\n+1 auf Verstand,\n+1 auf ein beliebiges Attribut,\n\u20131 auf Stärke
descr.race.gnome.powers=\uE249 Die Vorfahren der Gnome stammen aus der Feenwelt, weshalb sie sich noch heute dort gut orientieren können (Stärke Feensinn).\n\uE249 Gnome sind für Sturheit und Willenskraft bekannt (Stärke Hoher Geistiger Widerstand).\n\uE249 Trotz kurzer Beine sind Gnome erstaunlich schnell (Stärke Flink).
descr.race.human.attr=je +1 auf zwei beliebige\n unterschiedliche Attribute
descr.race.human.powers=\uE249 Menschen sind besonders vielseitig und erhalten 2 zusätzliche frei zu verteilende Punkte für Stärken in Schritt 7 der Generierung.\n\uE249 Menschen gelten als von den Monden besonders gesegnet (Stärke Zusätzliche Splitterpunkte).
descr.race.varg.attr=+2 auf Stärke,\n+1 auf ein beliebiges\n anderes Attribut, \n\u20131 auf Willenskraft
descr.race.varg.powers=\uE249 Das Fell der Varge ist sehr dicht und schützt vor Schaden (Stärke Natürlicher Rüstungsschutz).\n\uE249 Varge können auch über lange Strecken laufen oder andere körperliche Anstrengungen unternehmen, ohne dabei zu ermüden (Stärke Ausdauernd).\n\uE249 Varge besitzen scharfe Krallen und spitze Zähne, mit denen sie gefährliche Wunden anrichten können (Stärke Natürliche Waffe).


descr.background.academics=Die Eltern des Abenteurers gehören zu den seltenen echten Gelehrten, die sich in den großen Reichen und Städten der Welt, wie etwa in Ioria, mit der Historie, der Völkerkunde oder anderen Disziplinen beschäftigen. Dadurch hat der Abenteurer früh zumindest rudimentäres Wissen über verschiedene Gebiete aufgeschnappt und kennt manche alten Freunde seiner Eltern, die ihm mit ihrem Wissen auf obskuren Gebieten zur Seite stehen können.\nAbkömmlinge von Gelehrten zeichnen sich oft durch starken Wissensdurst und große Neugier aus, sind dabei aber mitunter etwas weltfremd. Oft müssen sie noch lernen, dass nicht alles, was es zu wissen gibt, in Büchern und Schriftrollen steht.
descr.background.artists=Der Abenteurer ist das Kind von Künstlern, seien sie nun Gaukler, Maler oder Musikanten. Er nahm einen Einblick in das Metier seiner Eltern und erwarb einen Blick fürs Detail und die nötige Sturheit, die er in einem von Aufträgen und Gönnern bestimmten Leben benötigt. Je nachdem, ob die Eltern gefeierte Künstler oder arme Schausteller waren, kennt das Kind eventuell einen alten Mäzen oder einen Gaukleranführer, der viel auf das Kind seiner alten Favoriten hält.\nWer von Künstlern abstammt, ist oft selbst ein Freigeist, der sich nur ungern in bestimmte Rollen drängen lässt. Er ist neugierig und will seinen Horizont erweitern.
descr.background.courtier=Die Eltern des Abenteurers leben am Hofe eines Herrschers, gleich ob es sich dabei um den Padishah von Farukan, den Kaiser von Selenia oder um einen Herzog oder Baron handelt. Höflinge zeichnet dabei aus, dass ihr Leben voll auf das Treiben am Hof ausgerichtet ist, egal welche Stellung sie dort besitzen. Auch der Abenteurer hat entsprechend Einblick in das Leben der Edlen und Adligen erhalten, ob er nun selbst diesem Stand angehört oder nicht. Der frühe Kontakt mit Menschen aus aller Herren Länder und mit Intrigen und Ränkespielen hat ihn einiges über das menschliche Zusammenleben gelehrt.\nWer von Höflingen abstammt, hat oft einen gewissen Ehrgeiz entwickelt, da er solch ein Streben am Hofe beobachten konnte. Zu Recht oder zu Unrecht sagt man ihm mitunter auch eine gewisse Verschlagenheit nach.
descr.background.craftsmen=Der Abenteurer ist das Kind hart arbeitender Handwerker, mögen es nun Schmiede, Sattler oder Alchemisten sein. Er musste schon früh in der elterlichen Werkstatt helfen, wodurch er erste Einblicke in das Handwerk gewonnen hat. Dazu kennt er häufig befreundete Handwerksmeister oder hat Kontakt zu einflussreichen Kunden seiner Eltern, die ihn in höhere Gesellschaftsschichten einführen können. Und außerdem hat er vielleicht etwas Geld oder gar ein wertvolles Besitzstück geerbt.\nKinder von Handwerkern sind oft von sehr zupackender Art und sehr geduldig in ihrem Tun. Selten sind sie impulsiv oder handeln vorschnell, was ihnen mitunter fälschlich als geistige Langsamkeit ausgelegt wird.
descr.background.eremits=Der Abenteurer wuchs, ob mit oder ohne Eltern, in einem der weiten Wildnisgebiete des Kontinents auf, in dem der nächste Nachbar oft dutzende Kilometer entfernt lebt. Gleich ob Jäger, Fallensteller, Freibauer oder Eremit, wer hier wohnt, ist auf sich gestellt. So musste sich auch der Abenteurer früh am täglichen Kampf ums Überleben beteiligen, was ihm so manche praktische Kenntnis, eine zupackende Art und profundes Wissen über die Natur vermittelt hat.\nWer in der Wildnis aufgewachsen ist, fühlt sich in zu reger Gesellschaft oft unwohl. Dafür gerät er selten im Angesicht von Herausforderungen in Panik, hat er doch in jungen Jahren schon viel erlebt.
descr.background.gentry=Der Abenteurer entstammt einer unbedeutenden Adelsfamilie, die zwar wenig Einfluss am Herrscherhof besitzt, dafür aber Ländereien und vielleicht ein Herrenhaus oder eine kleine Burg. Daneben gibt es verarmte Landadlige, die außer ihrem Adelsstand kaum etwas besitzen. In seiner Kindheit wurde der Abenteurer in jedem Fall auf seine Rolle als Anführer ebenso wie auf die ungezähmte Natur vorbereitet.\nKinder von Landadligen besitzen häufig viel Selbstvertrauen und ein ausgeprägtes Standesbewusstsein, da sie es gewohnt sind, in der Heimat über den anderen zu stehen. Dennoch haben sie einen stärkeren Bezug zu den Nöten und Ängsten des einfachen Volkes als Hochadlige. Da ihr Horizont oft auf die eigene Heimat beschränkt ist, wirken sie in der Fremde mitunter etwas provinziell.
descr.background.farmer=Die Familie des Abenteurers besitzt einen eigenen kleinen Hof, bestellt auf den Ländereien eines Großbauern eine kleine Parzelle oder arbeitet schlicht als Bedienstete auf einem größeren Hof. Auch der Abenteurer musste dadurch früh bei der Feldarbeit oder der Versorgung des Viehs helfen und allerlei andere zupackende Tätigkeiten ausführen. Aus diesen Kindertagen ist ihm ebenso eine gewisse Zähigkeit verblieben wie einige Kontakte und vermutlich ein tierischer Begleiter.\nAbkömmlinge von Kleinbauern gelten als eher ungebildet, dafür sagt man ihnen die sprichwörtliche Bauernschläue nach. Sie sind oft Meister im Improvisieren und können mit begrenzten Mitteln einiges erreichen, auch durch ihre Ausdauer und Sturheit.
descr.background.largefarm=Die Familie des Abenteurers gehört zu den bessergestellten Bewohnern der ländlichen Gebiete ihrer Heimat. Sie besitzt große Herden, lässt von ihren Bediensteten weitläufige Ländereien bewirtschaften oder verpachtet Land an Kleinbauern. Der Abenteurer hat daher ein behütetes Leben geführt und früh dabei geholfen, Pacht einzutreiben, Streit zu schlichten und auf den eigenen Ländereien nach dem Rechten zu sehen. An Geld wird es ihm auf seinem weiteren Weg sicher nicht mangeln.\nKinder von Großbauern sind meist daran gewöhnt, in ihrem beschränkten Umfeld zu den wichtigsten Personen zu gehören, und zudem oft behütet aufgewachsen. In der weiten Welt werden sie hingegen selten so wichtig genommen, was für sie eine Umstellung bedeutet. Dennoch können sie sich oft gut durchschlagen, da ihnen weder die Natur noch das menschliche Zusammenleben fremd sind.
descr.background.magister=Die Eltern des Abenteurers sind angesehene Amtsleute in einem der stärker organisierten Reiche auf Lorakis, etwa als Schreiber in einer Kanzlei Selenias, als Kastellan einer Zwingarder Burg oder als Beamte am Hofe des Padishahs von Farukan. Der Abenteurer hat einige Einblick in die Geschäfte seiner Eltern erhalten und einiges über das gesellschaftliche Zusammenleben gelernt. In jedem Fall kennt er manche Personen am Hofe, die ihm im Intrigenspiel oder bei Abenteuern auf höchstem Parkett zur Seite stehen könnten.\nWer von Magistralen abstammt, hat oft ein sehr rigides Rechtsverständnis, das sich in mangelnder Flexibilität äußern kann. Dafür hat er durchaus ein Organisationstalent und kann mit komplexen Sachverhalten gut umgehen.
descr.background.merchant=Die Eltern des Abenteurers sind Händler, gleich ob es sich dabei um Kaufleute, Fernhändler oder kleine Krämer handelt. Durch die Handelspartner und Kunden seiner Eltern hat der Abenteurer schon früh einiges über die Welt gelernt, ebenso über Verhandlungen und Feilscherei. Dazu besitzt er als Händlerkind ein gewisses Ansehen und vielleicht sogar noch etwas Geld. Womöglich kennt er einige alte Handelskontakte seiner Eltern, die ihm in fremden Landen oder bei der Beschaffung von Gütern zur Seite stehen können.\nWer von Händlern abstammt, zeichnet sich nicht nur durch große Neugier, sondern oft auch durch einen starken Geschäftssinn aus. Er versucht, aus jeder Situation das Beste zu machen, kann dabei aber mitunter gierig erscheinen.
descr.background.nobility=Der Abenteurer entstammt dem Hochadel seines Reiches und gehört damit zu einer der bedeutendsten Familien weit und breit. Mit diesem Selbstverständnis wurde er dazu erzogen, sich über andere zu erheben und das Volk zu führen. Das höfische Leben, die Sitten und die Benimmregeln der hohen Gesellschaft hat ein Abenteurer aus dem Hochadel in seiner Jugend selbstverständlich kennengelernt.\nKinder hochadliger Eltern besitzen ein ausgeprägtes Standesbewusstsein, das oft als Arroganz ausgelegt wird. Trotz ihrer zupackenden Art haben sie außerdem oft wenig Verständnis für die Bedürfnisse des Volkes oder Probleme des einfachen Lebens, waren diese ihnen doch bisher fremd.
descr.background.priests=Der Abenteurer stammt von Priestern einer Gottheit ab, die entweder in einem Tempel wirken oder ihren Glauben auf Reisen verbreiten. Unabhängig von seiner eigenen Frömmigkeit hat der Abenteurer Einblick in die Mythen und Glaubensvorstellungen seiner Eltern erhalten und konnte etwas von deren Geschick im Umgang mit anderen abschauen. Dazu besitzt er als Sohn ehrbarer Priester in den meisten Ländern einiges Ansehen und darüber hinaus ein geweihtes Kleinod, das ihn auf seinen Wegen beschützen soll.\nKinder von Priestern sind häufig selbst sehr spirituell und fest in ihrem Glauben. Dieses Vertrauen in höhere Mächte ermöglicht ihnen eine optimistische, bisweilen auch naive Weltsicht.
descr.background.ragtag=Die Eltern des Abenteurers, falls er sie je kennengelernt hat, gehören zu jenen Gruppen, die bessergestellte Bewohner von Lorakis oft als Abschaum betrachten: Kriminelle, Bettler, Tagelöhner, Landstreicher oder gar Arbeitssklaven. Der Abenteurer hat daher früh gelernt, in der Gesellschaft auf sich gestellt zu überleben und sich seiner Haut zu erwehren, selbst wenn er heute dieses Leben hinter sich gelassen haben mag. Dennoch entkommt er seiner Herkunft nie ganz, und sei es nur wegen der vielen, teils zwielichtigen Kontakte, die er noch immer besitzt und die ihm in weniger legalen Angelegenheiten hilfreich sein können. Und im Zweifel kennt jemand aus dem Gesindel immer einen Ort, wo er Unterschlupf finden kann.\nAbenteurer, die dem Gesindel entstammen, sind aufgrund ihrer harten Kindheit oft misstrauisch gegenüber Fremden und neigen dazu, nach einem besseren Leben oder gar Reichtum zu streben. Sie zeichnen sich oft aber andererseits durch unbeugsamen Willen und große Anpassungsfähigkeit aus.
descr.background.sailor=Der Abenteurer hat in seiner Kindheit so viel Zeit auf dem Meer wie an Land zugebracht, da seine Eltern als Fischer, einfache Matrosen oder gar Kapitäne zur See fahren und er sie oft begleitet hat. Man sagt, er habe Salzwasser in den Adern, und er hat bereits einiges von der Welt gesehen. Auch Freunde und Geschäftspartner seiner Eltern, die in fast jedem Hafen jemanden kennen, können ihm auf Reisen nützlich und eine Anlaufstelle sein. Womöglich ist er auf einem Schiff sogar ein gern gesehener Gast.\nKindern von Seefahrern ist es nicht fremd, mit den Naturgewalten zu ringen, was sie in hektischen und brenzligen Situationen oft abgebrüht handeln lässt. Starkem Aberglauben gehen sie, wie die meisten Kinder der See, mit Inbrunst nach.
descr.background.traveler=Der Abenteurer verbrachte seine Kindheit mit seinen Eltern auf der Straße oder gar in der Wildnis, wo diese von Ort zu Ort zogen, unabhängig davon, ob es sich bei ihnen um stolze Reiternomaden, Kesselflicker, rechtlose Vagabunden oder Fernhändler gehandelt hat. Er hat schon in jungen Jahren viel von der Welt gesehen. Die Straße oder weite Wildnis ist ihm vertraut. Er kann oft auf Kontakte seiner weitgereisten Eltern zurückgreifen, die ihm in fremder Umgebung zur Seite stehen können. Vielleicht hat er einen tierischen Begleiter, der ihm auf seinen Fahrten Gesellschaft leistet.\nAbkömmlinge von Reisenden besitzen selbst einen großen Horizont und sind oft tolerant Neuem und Unbekanntem gegenüber. Andererseits sind sie leicht misstrauisch, da Reisende stets als Fremde gelten und nicht immer gut behandelt werden.
descr.background.warrior=Die Eltern des Abenteurers verdienen ihren Lebensunterhalt als Kämpfer, beispielsweise als Soldaten, Söldner, im Waffengefolge eines Adligen oder als Fechtlehrer. Auch der Abenteurer hatte dadurch früh Kontakt mit dem Kriegshandwerk, auch wenn er nur zuschaute oder es kindlich nachspielte. Dennoch hat er dadurch eine gewisse Begabung für den Kampf und Zähigkeit erlangt, was ihm von Nutzen sein kann.\nKinder von Kämpfern gelten als impulsiv, dabei können sie auch sehr planvoll und berechnend vorgehen. Dazu sind sie es gewohnt, ihr Leben in vollen Zügen zu genießen, da sie in ihrer Jugend gelernt haben, wie schnell es vorbei sein kann.
descr.background.wizard=Die Eltern des Abenteurers besitzen nicht nur die einfache magische Begabung, die jedem in Lorakis zu eigen ist, sondern sind professionelle Zauberer, die damit ihren Lebensunterhalt bestreiten. Unabhängig davon, ob der Abenteurer die Magie so gut beherrscht wie seine Eltern, hat er tiefergehenden Einblick in die Zauberkunst erhalten und besitzt eine profunde Bildung. In jedem Fall besitzt er ein Artefakt, das vielleicht schon lange in Familienbesitz ist oder von seinen Eltern speziell für ihn gefertigt wurde.\nWer von Zauberern abstammt, denkt oft, alle Probleme im Leben mit Magie lösen zu können. Dazu kommt eine starke Aufgeschlossenheit gegenüber dem Übernatürlichen, das er besser als andere zu verstehen glaubt.

