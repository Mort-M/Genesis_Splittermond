education.war_horseman.desc=In vielen Kulturen gilt der Kriegsreiter als ein erstrebenswertes Ideal unter Ka\u0308mpfern. Dementsprechend hoch sind die Anspru\u0308che an sein Verhalten, ganz gleich, was letztlich seine Aufgabe ist: Man erwartet von ihm, dass er jederzeit bereit ist, sich in die Bresche zu werfen, dass er wild und furchtlos Angriffe reitet und dass er seine Reit- und Kampfku\u0308nste makellos beherrscht. Dafu\u0308r gebu\u0308hren ihm ha\u0308ufig die Dankbarkeit und der Respekt der Bevo\u0308lkerung.
education.merobaudes_horseman.desc=Die Reiter von Merobaudes\u2019 Schar unterstehen dem Ko\u0308nig direkt. Sie opfern einen Teil ihrer Beweglichkeit fu\u0308r schwere Ru\u0308stungen, die mit Verzierungen und Bemalungen mo\u0308glichst beeindruckend wirken sollen. Ein Reiter der Schar reitet stets in vorderster Linie und bringt mit der unerbittlichen Wucht seines Aufpralls die gegnerischen Reihen ins Wanken. Sie schonen sich nicht und suchen stets die direkte Auseinandersetzung.
education.silverBlade_horseman.desc=Die Silberklingen Termarks sind ein loser Verbund aus berittenen So\u0308ldnern, die sich eher auf leichte Ru\u0308stung und Geschwindigkeit verlassen. Es sind Opportunisten, die Gefahren und Chancen eines Kampfes gut gegeneinander abwiegen und von den Kriegsherren gerne angeworben werden, um verfeindete Streitkra\u0308fte durch u\u0308berfallartige Angriffe zu dezimieren oder im Hinterland zu brandschatzen. Ihr Name stammt daher, dass sie sich ihre Dienste teuer bezahlen lassen.
education.stormSpear_horseman.desc=Die Sturmspeere der Tarr aus der Surmakar reiten leicht geru\u0308stet auf Dromedaren. Ihre Aufgabe ist nicht nur der Schutz der Karawanen, sondern auch Spa\u0308hritte in die Wu\u0308ste. Gelegentlich werden sie gar als Botenreiter eingesetzt, wenn dringend eine Nachricht durch den endlosen Sand transportiert werden muss.
education.guardianOfVanforst.desc=Im Jarltum Lewenerd ist der Alte Weg noch weit verbreitet und die Vanyr-Verehrung durchzieht die gesamte Bevo\u0308lkerung. Die Wa\u0308chter des Vanforsts sehen es als ihre Aufgabe an, die Vanyr und den Wald, den sie bewohnen, zu schu\u0308tzen \u2013 mit Waffengewalt, wenn no\u0308tig, aber vor allem, indem sie den Glauben an die Vanyr weitertragen. Ihre go\u0308ttlichen Kra\u0308fte beziehen sie dabei angeblich von Hewa und Frall ho\u0308chstselbst. Sie folgen einem selbst fu\u0308r Zwingard archaischen Ehrenkodex, an dessen oberster Stelle der Schutz des Vanforstes steht. In Lewenerd sind die gru\u0308n geru\u0308steten Wa\u0308chter, die zu altmodischer und poetischer Sprache neigen, hoch angesehen und werden als Berater und Helfer gescha\u0308tzt. Außerhalb des Jarltums sieht man sie deutlich skeptischer, respektiert aber ihre Aufrichtigkeit und Ehrenhaftigkeit.
education.termarkPigeon.desc=n der relativ kurzen Zeit, seit sie aktiv sind, haben die Tau- ben \u2013 Missionare der Nyrdfinger Starrekyng-Kirche \u2013 erstaunlichen Einfluss gewonnen. Ihren Glauben verbreiten sie durch eindringliche Predigten, aber mehr noch durch tatkra\u0308ftige Hilfe und Mildta\u0308tigkeit, weswegen sich die Priester in der Bevo\u0308lke- rung weitreichender Beliebtheit erfreuen. Kritiker hingegen sagen, sie kauften sich einfach die Unterstu\u0308tzung der Termarker und wu\u0308rden dabei durch die Starrekyng-Kirche finanziert. Die meisten Missionare in ihren nachtblauen Roben predigen jedoch aus U\u0308berzeugung, nicht aus politischen Motiven: Sie treibt das ehrliche Bedu\u0308rfnis an, einem geschundenen Land wieder auf die Beine zu helfen.
education.garstalCastleMagician.desc=Nur wenige Anha\u0308nger der Garstaler Schule fu\u0308r Feuer- und Felsmagie haben den Orkangriff auf die Stadt u\u0308berstanden. Einige von ihnen jedoch bildeten ihrerseits wieder Schu\u0308ler aus, um die Tradition fortzusetzen. Bemu\u0308hten sich die Kastelmagi fru\u0308her um eine Mischung aus Praxisbezogenheit und Wissenschaft, sind die heutigen Anha\u0308nger fast durchgehend sehr pragmatisch eingestellt und versuchen, ihre Fa\u0308higkeiten mo\u0308glichst effektiv einzusetzen \u2013 was im heutigen Termark vermutlich auch notwendig ist. Dennoch treibt sie die Neugier ha\u0308ufig dazu auszuziehen, um Teile ihres verschollenen Wissens bei anderen Zauberkundigen wiederzufinden.

#material.bonesilver.desc=Knochensilber, das ausschließlich in esmodanischen Minen gefördert wird, ist berühmt für seine Haltbarkeit: Es zeigt keinerlei Materialermüdung, und während gewöhnliches Silber ohne stetige Pflege anläuft und schnell seinen Glanz verliert, bleibt Knochensilber strahlend wie am ersten Tag. Zudem ist es etwas härter und weniger spröde als gewöhnliches Silber, so dass es sich auch für (kleinere) Waren eignet. Diverse Kunst- und Gebrauchsgegenstände und besonders Knochensilber-Besteck aus Esmoda sind ein gefragtes Gut an fernen Höfen, manch ein Streitross aus Dragorea trägt ein Zaumzeug aus Knochensilber, und einige Meisterschützen aus Farukan schmücken ihre Pfeile mit knochensilbernen Spitzen \u2013 ja selbst Knochensilber-Wurfsterne wurden schon im westlichen Zhoujiang gesichtet. Auch in Esmoda selbst ist das Metall sehr gefragt, da es neben Gold als einziges Metall der Zehrung (S. 7) trotzt, was auch die endlosen Tafeln des Ewigen Registers bezeugen können, die ausschließlich aus Knochensilber bestehen.
#material.bonesilver.effect=Gegenstände aus Knochensilber erhalten, ohne dass dadurch ihre Last beeinträchtigt wird, eine um 2 Punkte erhöhte Härte sowie eine um 4 Punkte erhöhte Haltbarkeit (die Erhöhung aus der verbesserten Härte bereits eingerechnet).

#item.pale_leaf.desc=Neben Schwefel, diversen seltenen Erzen und dem giftgrünen Blassblatt im Umland ist vor allem der rötliche Kristallsand aus Esmoda berühmt. Der feinkörnige, staubartige Sand, der in mattem Rot glitzert, wird nur in den Minen Esmodas gefördert und hauptsächlich nach Zhoujiang ausgeführt, da er für die Herstellung der Terrakotta-Krieger (siehe Zhoujiang, S. 114f, 133f ) General Wus benötigt wird.

spell.bonfire.descr=Vom Zauberer aus schießt ein gleißender Lichtstrahl bis zu 30 m in den Himmel, der augenblicklich in gleißendem Licht explodiert und für 10 Ticks die Lichtverhältnisse im Umkreis von 50 Metern um 2 Stufen verbessert.
spell.bonfire.enhancedescr=Die Lichtexplosion gibt zusätzlich einen weithin hörbaren Hornstoß von sich.
spell.stone_to_dust.descr=Der Zauber entzieht einem Objekt bis Last 15 die Stabilität. Seine Härte reduziert sich um 2 Punkte, außerdem erleidet es sofort 20 Schadenspunkte.
spell.stone_to_dust.enhancedescr=Die Härte reduziert sich um 4 Punkte.

#Materialien=
material.druidwood.descr=Das Holz der Vanenbäume in Zwingard wird umgangssprachlich als Druidenholz bezeichnet. In der Tat können die Druiden erkennen, welche der Vanenbäume tatsächlich von den Vanyr gesegnet wurden und damit über hervorragende Eignung für Waffen und Schilde verfügen. Um zu verhindern, dass zu viele Bäume gefällt werden, behalten die Druiden dieses Wissen für sich.
material.druidwood.effect=Nahkampfwaffen (mit langem Holzschaft) und Schilde aus Druidenholz verleihen einen Bonus in Höhe von 1 Punkt auf die Aktive Abwehr mit diesem Gegenstand.
material.thaumarium.descr=Thaumarium ist ein schweres, tiefblaues Erz, das bisher nur in den Bergen von Termark gefunden wurde. Es eignet sich besonders gut für die Herstellung magischer Artefakte.
material.thaumarium.effect=Wird ein Gegenstand aus Thaumarium zum Artefakt verzaubert, erhält der Verzauberer einen stark positiven Umstand auf die Proben zur Verzauberung.
material.wyvernLeather.descr=Das Leder der Wyvern ist außerordentlich fest und eignet sich daher hervorragend für robuste Lederarbeiten, insbesondere Rüstungen
material.wyvernLeather.effect=Eine Rüstung aus Wyvernleder erhält automatisch das Merkmal Stabil. Durch das Merkmal steigt die Behinderung um 1.