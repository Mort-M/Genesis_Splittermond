education.adaluPriest.descr=Die Adalu-Priester haben zwei große Aufgaben: Sie inspirieren und beeinflussen einerseits das Gefühlsleben der Mahaluu, andererseits besänftigen sie den Groll ihrer leicht zu erzürnenden Herrin, wenn etwa Naturkatastrophen drohen. Im Umgang mit den Sterblichen nutzt ihnen ihre Beredsamkeit ebenso wie subtile Beherrschungsmagie. Um ihre Göttin gnädig zu stimmen, leiten sie groß angelegte Opferrituale an, die von ekstatischen Feiern mit Tanz und Gesang bis hin zu Menschenopfern am heiligen Vulkan Ruraroate reichen können. Die Adalu-Priester erforschen das Feuer als Sinnbild der Emotionen, die gleichermaßen wärmen und verzehren können.
education.huruaKopura.descr=Die Harua-Kopura (Rauschbrauer) der Mahaluu sind geschult darin, berauschende Tinkturen aus der Flora und Fauna des Archipels anzufertigen, die alle fünf und mehr Sinne erweitern sollen. Sie sind aber auch genauso in der Lage, entsprechende Pasten, Salben und Tröpfchen herzustellen, die Körper und Geist vor heimtückischen Giften und Krankheiten heilen können. Nicht wenige ziehen neugierig in die Ferne, um ihr Handwerk stetig weiter zu verfeinern.
education.monuleleNomae.descr=Die Mahaluu interagieren in ihrem Alltag viel mit den Malataki (S. 24), bei denen es sich um Feen, Geister oder Götterkinder handeln kann. Als Mittler zwischen ihnen und den Bewohnern des Archipels dienen die Monulele-Nomae (Schützende Tänzerin), bei denen es sich mehrheitlich um Frauen jenseits der 30 handelt. Sie kennen Tänze und Rituale, die den Blick auf einen Übergang in eine Feenwelt oder auf ein verborgenes Feenwesen ermöglichen und sind geschult darin, hinterlistige Paktschlüsse zu durchschauen und Schutz vor den Malataki zu gewähren, falls die Jenseitigen mal ungemütlich werden.
education.niantauiPriest.descr=Die Niantaui-Priester begleiten von der Geburt bis zum Tod die Mahaluu auf dem friedvollen und genussreichen Weg durchs Leben. Ihr Ideal ist der friedliche Rausch, das dauerhafte (oder besser: stets wieder neu empfundene) Glück und die allumfassende Liebe. Sie lehren diese Ideale in humorvollen Geschichten und rufen die Mahaluu zu vielerlei Festen zusammen, um Niantauis reichen Segen zu feiern, durch den auf den Inseln kein Mangel herrscht. Askese als bewusste Abwendung von all diesen Gaben erscheint ihnen undankbar und nahezu frevlerisch, bewusster Genuss als die einfachste Form des Gebets.

creature.kokaWanuu.descr=Die unterirdisch lebenden Koka-Wanuu (\u201EFell aus Stein\u201C) sind eine hundegroße, augenlose Rattenart, deren ausgemergelter Körperbau unerwartet kräftige Muskeln verbirgt. Die Tiere mit dem graubraunen Fell kommen ausschließlich in den Vulkanhöhlen (S. 37) vor und können in größeren Schwärmen eine ernsthafte Bedrohung darstellen.