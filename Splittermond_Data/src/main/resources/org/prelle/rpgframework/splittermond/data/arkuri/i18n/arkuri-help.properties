creature.sledDog.descr=Der Arkurische Schlittenhund ist mit dem Rakarr der Raugarr verwandt und gerade im Winter ein unerlässlicher Begleiter aller Wanderer.
creature.matureVulture.descr=Die blau gefiederten Reifgeier gelten gemeinhin als ein schlechtes Omen, da die Aasfresser meist in der Nähe gefährlicher Bestien zu finden sind. Sie ernähren sich von den Überresten, die die Raubtiere zurücklassen. Dabei entwickeln Reifgeier eine Verbundenheit zu den Wesen, die sie begleiten, und unterstützen diese sogar im Kampf.
creature.blackPaw.descr=Die Schlitten- bzw. Zughunde aus Arkuri sind von einem besonderen Schlag. Stämmig gebaut,um große Lasten ziehen zu können, sind die sanften Riesen zudem in der Lage einen Fellwechsel in wenigen Stunden auszuführen, um so sowohl im kalten Eis als auch der Dschungelhitze zurecht zu kommen. Sie sind äußerst loyale Begleiter, die ihrem Besitzer oder Rudel furchtlos überall hin folgen, auch um die ihren zu beschützen. Lediglich als Wachhunde taugen sie recht wenig, sind sie doch zu Allen erstmal freundlich und nehmen auch Fremde gern in ihre Gruppe auf.
creature.reindeer.descr=In Arkuri kann man vor allem zwei besondere Tiere kaufen: Rentiere für die Zucht und als Lebendvieh für die Schlachtung. Für die Zucht benötigt man aber das Wohlwollen der Gründerfamilien.