education.guardianCommunity.descr=Die Hüter der Gemeinschaft sind Priester des Dagener, die es als ihre heilige Pflicht ansehen, für Frieden und Wachstum in den von ihnen betreuten Gemeinden zu sorgen. Sie haben ein gutes Gespür für Stimmungen und verstehen sich darauf, in Streitfällen so zu schlichten, dass es zu einem für alle Beteiligten zufriedenstellenden Ergebnis kommt. Sie verfügen zudem über enormes Wissen über natürliche Zyklen und nutzen dieses, um den rechten Zeitpunkt für die jährliche Aussaat zu bestimmen. Darüber hinaus huldigen sie dem Handwerksaspekt Dageners durch die Herstellung für ihre Gemeinde nützlicher Artefakte.
education.prospector.descr=Prospektoren sind wahre Experten darin, wertvollen Ressourcen nachzuspüren - seien dies nun Erze, Edelsteine, Hölzer oder seltene Heilpflanzen. Da sie dafür viel Zeit in unerforschten, zuweilen auch überaus gefährlichen Regionen verbringen müssen, sind Prospektoren nicht nur geschulte Wildniskundige, sondern auch geübte Kämpfer. Ihre Dienste lassen sie sich daher gut bezahlen und um die Gunst der Besten unter ihnen wird intensiv geworben. Gerade nach Arkuri zieht es viele Prospektoren, gibt es dort doch jede Menge Landstriche, die es im lukrativen Dienst der Gründerfamilien zu erforschen lohnt.

item.humusOil.descr=Besonderheiten: 1 Liter brennt wie eine Kerze für drei Tage
item.chokeLiana.descr=Besonderheiten: Versuche sich aus einer Fesselung mit einer Würgeliane zu befreien, erhalten einen leicht negativen Umstand

item.rujanLeaves.descr=Apathie: verleiht einen Bonus auf Proben, in die WIL eingeht oder den GW, um etwas zu widerstehen, in der Höhe von 1 Punkt; Taubheitsgefühl im Gesicht: leicht negativer Umstand auf Redegewandtheit- oder Diplomatieproben, 1 Stunde
item.ironwoodBrew.descr=senkt Zustand Blutend um 1 Stufe.
item.perfumeBlueDresilien.descr=verleiht für alle Proben, bei denen das Gegenüber umschmeichelt wird, einen Bonus in Höhe von 1 Punkt, 2 Stunden
item.blackTravelResin.descr=Kontakt 3 / Schaden sowie Entfernen wie Brennend 1 (max.3) - (siehe Splittermond: Die Regeln, S. 168).
item.dreamFern.descr=Einnahme 2 / Benommen (Gift) / 2 Stunden

item.summerWinterCoat.descr=Besonderheiten: Träger des Mantels können die Auswirkungen von Hitze- und Kältestufe 1 ignorieren. Höhere Stufen kommen jedoch vollständig zum Tragen.

material.alanjutLeather.desc=Das Leder der Alanjutbären (siehe Seite 15) gibt es nicht nur in vielerlei Farben. Wenn es korrekt verarbeitet wird, kann es sich auch auf das magische Feld seines Trägers einstimmen und so Teile seines alten Farbenspiels beibehalten. Materialeigenschaften: Wirkt der Träger einen passenden Spruch der Verwandlungs- oder Illusionsmagie passt sich die Farbe des Gegenstandes aus Alanjutleder entsprechend mit an. Dadurch kann der Zauberer einen leicht positiven Umstand (z.B. auf Verstecken oder das Vortäuschen einer anderen Identität) erhalten. 
material.khomiteOre.desc=Die dunklen metallisch glänzenden Kristalle, die man in den Dschungeln um Süd-Arkuri finden kann, lassen sich aufgrund ihrer ungewöhnlichen schweren und spröden Beschaffenheit kaum schleifen. Allerdings können sie eingeschmolzen werden und ergeben mit verschiedenen Erzen zusammen eine Legierung, die zu einer spiegelnden und glitzernden Oberfläche aushärtet. Materialeigenschaft: Metallwaffen, die mit Chromiterz überzogen werden, erhalten das zusätzliche Waffenmerkmal "Ablenkend 1", dafür erhöht sich ihre WGS um1 Punkt. 
material.ironWood.desc=Das leicht bläulich schimmernde Holz des Eisenholzbaumes wird in Süd-Arkuri zur Herstellung von Waffen genutzt. Tatsächlich ist es auch extrem dünn noch äußerst stabil, sodass sich Klingen daraus schnitzen lassen, die äußerst witterungsbeständig sind. Materialeigenschaft: Waffen aus Eisenholz haben die gleichen Werte wie das Äquivalent aus Stahl, sie sind jedoch leichter. Die Last ist um einen Punkt reduziert, ebenso ist bei Waffen mit einer Mindestanforderung an Stärke, diese um einen Punkt gesenkt (im Vergleich zu derselben Waffe aus Stahl) 
material.fogPantherArmor.desc=Die ältesten dieser gefährlichen Raubkatzen bilden unter ihrer Haut nur schwer zu durchdringende Panzerplatten aus. Aus diesen lassen sich hervorragende Schilde und langlebige Verschalungen für Häuser, Palisaden oder Wagen fertigen. Materialeigenschaft: Die Härte eines Gegenstandes aus Nebelpantherpanzern ist um 1 erhöht. Schilde aus Nebelpantherpanzern erhöhen den SR Bonus des Merkmals Schildwall (so vorhanden) um 1 Punkt.
material.matureVultureFeather.desc=Die Schwungfedern der Reifgeier tragen einen Teil, der den Tieren eigenen Magie in sich. Und anders als ihre ursprünglichen Träger, gelten die großen blauen Federn an Schmuckstücken auch nicht als schlechtes Vorzeichen. Materialeigenschaft: Gegenstände aus Reifgeierfedern gewähren ihrem Träger einen Bonus in Höhe von 3 Punkten auf das Wirken vom Zauber des Typus Eis. Hierbei kann nur von einem Gegenstand gleichzeitig profitiert werden.

material.alanjutLeather.effect=Wirkt der Träger einen passenden Spruch der Verwandlungs- oder Illusionsmagie passt sich die Farbe des Gegenstandes aus Alanjutleder entsprechend mit an. Dadurch kann der Zauberer einen leicht positiven Umstand (z.B. auf Verstecken oder das Vortäuschen einer anderen Identität) erhalten.
