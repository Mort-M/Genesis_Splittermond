item.HookSole.desc=Bei der normalen Bewegung über festen Boden halbiert eine Hakensohle die Geschwindigkeit. Dafür kann  ein Abenteurer, der eine Hakensohle nutzt, sich auf eisglattem Untergrund wie auf sehr schwierigem Gelände (Geschwindigkeit  gedrittelt) bewegen (anstatt wie sonst üblich lediglich mit Geschwindigkeit 1).
item.SnowMask.desc=Die Lichtverhältnisse verschlechtern sich für den Träger um 1 Stufe. Dafür kann er nicht mehr durch reflektiertes  Licht auf Schnee, Wüstensand oder anderen hellen Flächen Opfer des Zustands Geblendet werden.
