item.doubleCrossbow.desc=Komplett gespannt kann entweder zweimal der Einzelschuss oder einmal der Doppelschuss abgefeuert werden, bevor die Waffe wieder geladen werden muss. Der Abenteurer kann selbst bestimmen, ob er einen Bogen in 8 Ticks oder beide Bögen in 16 Ticks bereitmacht. Die Munition beider Bögen entspricht jener der leichten Armbrust.
item.doubleCrossbowDoubleShot.desc=Komplett gespannt kann entweder zweimal der Einzelschuss oder einmal der Doppelschuss abgefeuert werden, bevor die Waffe wieder geladen werden muss. Der Abenteurer kann selbst bestimmen, ob er einen Bogen in 8 Ticks oder beide Bögen in 16 Ticks bereitmacht. Die Munition beider Bögen entspricht jener der leichten Armbrust.
