language.frynto.desc=Die Sprache der Frynjord weist nach wie vor große Parallelen zum Boromto der Borombri auf, wurde aber mit zahlreichen Lehnwörtern aus anderen Sprachen der Frostlande durchmischt. Die Worte sind häufig kurz und die Grammatik besitzt wenige Feinheiten, so dass es Sprechern des Boromto und auch des Furato relativ schnell möglich ist, sich mit den Frynjord zu unterhalten. Dass alle drei Völker nach wie vor die gleichen Schriftzeichen verwenden, erleichtert ebenfalls die Verständigung.

education.plantartists.descr=Die Botanische Universität von Zimahora spielt eine bedeutende Rolle im Überleben des ganzen Volks der Frynjord, und so verwundert es nicht, dass diejenigen, die dort ihre Arbeit verrichten, im Volk hochgeschätzt werden. Die Pflanzenkünstler sind dabei eine eingeschworene Gemeinschaft, die es sich zum Ziel gesetzt hat, Geheimnisse der Natur zu entschlüsseln, die perfekten Bedingungen jeder einzelnen lorakischen Pflanze zu ergründen und deren Wachstum mit Magie, Alchemie und hilfreichen Artefakten nachzuhelfen.
education.frynjordbotanist.descr=Einige der Frynjord haben nicht nur ein besonderes Talent für Pflanzen, sondern verfügen auch über eine ordentliche Portion Fernweh und Abenteuerlust. Die Botaniker aus Zimahora haben die Aufgabe, in der Ferne vielversprechende Samen und Wurzeln interessanter Gewächse zu sammeln, hilfreiche Beobachtungen zur Pflanzenwelt in ganz Lorakis anzustellen und dann den Kollegen in den zahllosen Gewächshäusern Zimahoras zur Verfügung zu stellen. In Ihrer Ausbildung an der Botanischen Universität lernen sie nicht nur, einen Tatzenbur von einem Sinbaralachen zu unterscheiden, sondern auch, wie man gefährliche Raubtiere bemerkt, einen vertrauenswürdigen Ortskundigen findet, und wie man seine Beobachtungen schließlich verschriftlichen kann.
education.hyelfryn.descr=Die Reihen der Hyelfryn aus Jordheim speisen sich aus all jenen, die schon früh in ihrer Ausbildung erkennen lassen, dass sie nicht nur zu kompetenten Zauberern, sondern auch zu schlagkräftigen Kriegern ausgebildet werden können. Mit Axtschwert und Schild sowie mit Kampf- und Todesmagie gerüstet, treten die Hyelfryn jeglichem Schrecken entgegen. Ihr Ruf ist dabei mittlerweile auch über die Grenzen der Gletscher hinaus gedrungen, und bisweilen werden Hyelfryn von fremden Reichen angefragt, um bei Problemen mit Bewohnern der Geisterwelt oder des Tiefdunkels zu unterstützen.

