power.asketic.desc=Der Abenteurer pflegt einen asketischen Lebensstil, fastet häufig und ist es gewöhnt, weltlichem Komfort zu entsagen. Zur Bestimmung der Zeitspanne, bevor er zu verhungern beziehungsweise zu verdursten beginnt (Splittermond: Die Regeln S. 175), ist seine Konstitution um einen Punkt erhöht. Versuche, ihn mit weltlichen Genüssen zu verlocken, erhalten einen leicht negativen Umstand. Darüber hinaus verbraucht er bei Überlandreisen (siehe Splittermond: Die Regeln S. 151) weniger Proviant. Er kann dadurch die Kosten zur Verpflegung für sich selbst um die Hälfte reduzieren und kommt bei der Nahrungssuche mit einer halben Ration aus.
power.aura_chosen.desc=Der Abenteurer pflegt einen asketischen Lebensstil, fastet häufig und ist es gewöhnt, weltlichem Komfort zu entsagen. Zur Bestimmung der Zeitspanne, bevor er zu verhungern beziehungsweise zu verdursten beginnt (Splittermond: Die Regeln S. 175), ist seine Konstitution um einen Punkt erhöht.\nVersuche, ihn mit weltlichen Genüssen zu verlocken, erhalten einen leicht negativen Umstand. Darüber hinaus verbraucht er bei Überlandreisen (siehe Splittermond: Die Regeln S. 151) weniger Proviant. Er kann dadurch die Kosten zur Verpflegung für sich selbst um die Hälfte reduzieren und kommt bei der Nahrungssuche mit einer halben Ration aus.
power.succour_in_need.desc=Der Gläubige kann maximal einmal pro Woche Punkte der Ressource Glaube gemäß der auf S. 117 genannten Regeln einsetzen, ohne dabei für ein dringliches Gebet einen zusätzlichen Punkt in der Ressource Glaube investieren zu müssen.
power.friendgodservant.desc=Wesen des Typus Götterdiener sind dem Abenteurer äußerst wohlgesonnen. Ihre Einstellung (Splittermond: Die Regeln S. 145) gilt ihm gegenüber stets als um 2 Stufen verbessert (bis maximal hilfsbereit).
power.holy_mark.desc=Der Abenteurer hat eine hervorstechende, körperliche Eigenheit, die als ein heiliges Mal angesehen wird oder tatsächlich eines darstellt, zum Beispiel ein Leberfleck in Form eines Auges auf der Stirn, besonders heraustretende Adern an den Gliedmaßen, die ein Muster ergeben, oder gänzlich rote Pupillen. Gelingt es ihm, Gegner einzuschüchtern (Splittermond: Die Regeln S. 146), erhält er diesen gegenüber zusätzlich das Merkmal Furchterregend (15).
power.holy_mark2.desc=Diese Stärke kann ein zweites Mal gewählt werden, wodurch der Wert des Merkmals auf 15 zuzüglich der Fertigkeitspunkte in Anführen steigt.
power.childlie.desc=Der Abenteurer ist durch sein Erbe eines Dieners einer Gottheit von Lüge, Täuschung oder Verrat weniger anfällig dafür, selbst Opfer solcher Taten zu werden. Er erhält einen Bonus in Höhe von 3 Punkten auf alle Proben auf Empathie, sobald es gilt, eine wissentliche Lüge zu durchschauen oder eine entsprechende Unwahrheit zu entdecken. Der Spielleiter sollte dabei vermeiden, dem Spieler zu sagen, ob sein Bonus gilt, sondern vielmehr diesen im Nachhinein einrechnen.
power.childorder.desc=Der Abenteurer trägt das Erbe eines Dieners einer Gottheit der Ordnung, des Rechts oder der Gemeinschaft in sich. Er erhält einen Bonus in Höhe von jeweils 2 Punkten auf alle Proben in den Fertigkeiten Anführen und Diplomatie, wenn er versucht, Recht durchzusetzen oder Ordnung zu stärken oder wiederherzustellen.
power.childprophecy.desc=Der Abenteurer trägt das Erbe eines Dieners einer Gottheit des Schicksals oder der Prophezeiung in sich. An Orten oder in Situationen, die stark mit göttlicher Macht oder göttlichem Wirken verbunden sind, kann dem Abenteurer eine plötzliche Eingebung zuteilwerden, wenn ihm eine Empathie-Probe gegen 25 gelingt. Nach Entscheidung des Spielleiters erhält er bei Erfolg eine kurze Vision, die mit dem göttlichen Wirken zu tun hat, oder einen Hinweis, der ihm bei seinem gegenwärtigen Unterfangen hilft.
power.childlore.desc=Der Abenteurer trägt das Erbe eines Dieners einer Gottheit der Weisheit oder Gelehrsamkeit in sich. Bei Proben zur Recherche, zum Abrufen von Wissen und zum sich Erinnern (Splittermond: Die Regeln S. 149f ) erhält er einen stark po­ sitiven Umstand.
power.childlife.desc=Der Abenteurer trägt das Erbe eines Dieners einer Lebensgottheit in sich. Solange er einen Sterbenden berührt und sich voll und ganz auf diese eine Person konzentriert (also in dieser Zeit keine anderweitigen Handlungen ausführt), wird die Wirkung der Zustände Sterbend 1 und Sterbend 2 ausgesetzt, während die Wirkungsdauer einer etwaigen Zustandsursache weiterläuft.
power.childdeath.desc=Der Abenteurer trägt das Erbe eines Dieners einer Todesgottheit in sich. Er kann mit Wesen des Typus Geisterwesen kommunizieren und einmal pro Tag für bis zu 5 Minuten seinen parallelen Standort in der Geisterwelt sehen, hören und riechen, als wäre er dort. Eine Interaktion ist jedoch nicht möglich, ebenso wenig wie der Abenteurer während dieser Zeit seine eigentliche Umgebung im Diesseits wahrnehmen kann.
power.shield_faith.desc=Der feste Glaube des Abenteurers gibt ihm in kritischen Situationen Halt. Gegen Feinde seines Glaubens oder seiner Gottheit sowie gegen Versuche, ihn von den Prinzipien seines Glaubens abzubringen, sind sein GW und sein KW um seinen halben Wert in der Ressource Glaube erhöht.

mastership.leadership.prayer_before_combat.desc=Der Abenteurer leitet eine Gruppe im gemeinsamen Gebet (Dauer: 1 Minute) um Mut und Stärke an und legt eine Probe auf Anführen ab. Die Schwierigkeit beträgt 25 + 1 pro 10 Personen. Gelingt die Probe, erhalten alle Maßnahmen gegen die Moral oder das Selbstvertrauen von Verbündeten für die nächste Stunde (+1 pro EG) einen leicht negativen Umstand. Wer während dieser Zeit vom Zustand Angsterfüllt oder Panisch betroffen wird, darf außerdem einmalig eine (zusätzliche) Probe auf Entschlossenheit oder Zähigkeit gegen die Schwierigkeit der Ursache ablegen, um den Zustand abzuschütteln. Der Einsatz dieser Meisterschaft ist maximal einmal pro Tag möglich.
mastership.leadership.prayer_before_battle.desc=Der Abenteurer leitet eine Gruppe im gemeinsamen Gebet (Dauer: 15 Minuten) um Mut und Stärke an und legt eine Probe auf Anführen ab. Die Schwierigkeit beträgt 25 + 1 pro 20 Personen. Gelingt die Probe, erhalten alle Maßnahmen gegen die Moral oder das Selbstvertrauen von Verbündeten für die nächste Stunde (+1 pro EG) einen stark negativen Umstand. Wer während dieser Zeit vom Zustand Angsterfüllt oder Panisch betroffen wird, darf außerdem bei jedem entsprechenden Effekt eine (zusätzliche) Probe auf Entschlossenheit oder Zähigkeit gegen die um 5 Punkte reduzierte Schwierigkeit der Ursache ablegen, um den Zustand abzuschütteln. Der Einsatz dieser Meisterschaft ist maximal einmal pro Tag möglich und nicht kumulativ zu der Meisterschaft Gebet vor dem Kampf.
mastership.diplomacy.preacher.desc=Versucht der Abenteurer, andere von den Prinzipien seines Glaubens zu überzeugen oder ihre Einstellung zu seiner Gottheit gefälligen Themen und Meinungen zu erhöhen, erhält er einen Bonus in Höhe von 2 Punkten.
mastership.diplomacy.rewarding_afterlife.desc=Der Abenteurer versteht sich darauf, das Wohlwollen der Götter und die Freuden, die den Gottgefälligen nach dem Tod erwarten, in leuchtenden Farben zu schildern. In sozialen Konflikten, in denen das Gegenüber für derartige Versprechungen empfänglich ist, erhält er einen leicht positiven Umstand, als würde er ein wertvolles Geschenk oder eine angemessene Bestechung einsetzen.
mastership.determination.souls_foundation.desc=Durch eine halbstündige meditative Tätigkeit (Meditation, stilles Gebet, ritueller Tanz, Teezeremonie oder dergleichen) stärkt der Abenteurer seinen Geist und versichert sich der Nähe seines Gottes. Er legt eine Entschlossenheit-Probe gegen 25 ab. Bei Erfolg kann er in der nächsten Stunde eine Stufe des Zustands Glaubenskrise ignorieren (auch wenn dieser erst nach der Meditation erlangt wird). Jeder Erfolgsgrad erhöht die Dauer um 1 Stunde.
mastership.determination.strong_in_faith.desc= Der Abenteurer ist bis ins Innerste von den Prinzipien seines Glaubens durchdrungen. Er kann dauerhaft eine Stufe des Zustands Glaubenskrise ignorieren. Dies ist nicht kumulativ mit einer Ignorierung des Zustands aus der Meisterschaft Fundament der Seele.
mastership.history.common_rites.desc= Der Abenteurer hat die Gebete und Riten eines bestimmten Kultes erlernt. Er kann die Fertigkeit Geschichte und Mythen nutzen, um die Zauber eines Priesters dieses Kultes nach den Regeln zur Zusammenarbeit (GRW 21) zu unterstützen. Die Meisterschaft kann mehrfach (jeweils für einen Kult) erworben werden.
mastership.history.divine_punishment.desc=Der Abenteurer versteht sich darauf, den Zorn der Götter und die Strafen, die Frevler im Jenseits erwarten, in leuchtenden Farben zu schildern. Er kann die Fertigkeit Geschichte und Mythen zum Einschüchtern benutzen.
mastership.history.holy_oath.desc= Der Priester wendet 2 Punkte Glaube auf (Götter 117) und lässt ein freiwilliges Ziel schwören, eine bestimme Aufgabe zu erfüllen oder eine bestimmte Tätigkeit nicht zu unternehmen. Dem Ziel muss eine Entschlossenheit-Probe gegen 30 gelingen, um freiwillig einen Tag lang ohne Konsequenzen von diesem Schwur abzuweichen. Sollte die Probe misslingen, erhält es im Zusammenhang mit Aktionen, die das Ziel des Schwurs betreffen, einen Tag lang den Zustand Angsterfüllt (Fluch) und erleidet außerdem bis zum Ende der Wirkung des Schwurs 5 Punkte kanalisierten Schaden. Im Gegenzug erhält das Ziel aber auch einen Bonus in Höhe von 5 Punkten auf Proben, um nicht von seinem Schwur abzuweichen. Der Schwur hält eine bei Ablegung des Schwurs bestimmte Zeit (maximal ein Monat).
mastership.history.sexton.desc=Um einen Strukturgeber zu aktivieren, der von einem Priester erschaffen wurde, kann der Abenteurer Geschichte und Mythen anstelle von Arkaner Kunde nutzen.
mastership.history.nature_of_deity.desc= Gelingt dem Abenteurer eine Probe zur Identifizierung eines von einem Priester gewirkten Zaubers, erkennt er eine zum Zauber passende Eigenschaft der Gottheit des Priesters (üblicherweise einer der Aspekte der Gottheit).
mastership.history.masked_prayer.desc=Der Abenteurer kennt sich so gut mit fremden Kulten aus, dass er besonders gut vormachen kann, einem solchen anzugehören oder sogar Priester einer fremden Gottheit zu sein. Alle Proben, ihn in seiner vorgespielten Rolle zu enttarnen, erhalten einen Malus, der sich nach der Ähnlichkeit der vermeintlichen Gottheit zur tatsächlich verehrten Hauptgottheit richtet. Der Malus beträgt 6 Punkte für sehr ähnliche Gottheiten (mehrere Aspekte übereinstimmend, siehe die Listen ab S. 162), 4 Punkte für leicht ähnliche Gottheiten (ein Aspekt übereinstimmend) oder 2 Punkte für nicht ähnliche Gottheiten (kein Aspekt übereinstimmend).
mastership.history.divine_wrath.desc=Der Abenteurer kann seine Gottheit anflehen, seinen Arm im Kampf zu führen (sofortige Aktion von 2 Ticks Dauer) und dafür 1 Punkt Glaube (siehe S. 117) aufwenden. Hierdurch richten seine nächsten vier gelungenen Angriffe in diesem Kampf jeweils 3 zusätzliche Punkte Schaden an.
mastership.history.sacrificial_offering.desc=Einmal pro Spielsitzung kann der Abenteurer einer von ihm verehrten Gottheit ein zur Gottheit passendes Opfer (im Wert von mindestens 1 Lunar) darbringen und um Beistand bei einer der Gottheit gefälligen Handlung bitten (kontinuierliche Aktion von 15 Ticks Dauer). Beim Ausführen dieser innerhalb von 30 Ticks nach Vollbringung des Opfers zu beginnenden Handlung erhält er auf eine von ihm gewählte, zur Gottheit passende Fertigkeitsprobe bei Zustimmung des Spielleiters einen leicht positiven Umstand.
mastership.streetlore.hidden_signs.desc= Der Abenteurer kennt sich äußerst gut mit geheimen Zeichen seines Kultes aus und kann dadurch besonders gut Kontakt zu Gleichgesinnten aufnehmen, verborgene Versammlungsorte finden oder Warnungen vor Feinden des Kultes erkennen. In einer Ansiedlung, in der Anhänger seines Kultes tätig sind, erhält er einen Bonus in Höhe von 3 Punkten auf alle Versuche, Informationen wie die oben erwähnten zu erlangen oder weiterzugeben.
mastership.endurance.selfsacrifice.desc=Einmal pro Spielsitzung kann der Abenteurer einer von ihm verehrten Gottheit sein eigenes Blut als Opfer (mindestens 4 Punkte Schaden) darbringen und um Beistand bei einer der Gottheit gefälligen Handlung bitten (kontinuierliche Aktion von 15 Ticks Dauer). Beim Ausführen dieser innerhalb von 30 Ticks nach Vollbringung des Opfers zu beginnenden Handlung erhält er auf eine von ihm gewählte, zur Gottheit passende Fertigkeitsprobe bei Zustimmung des Spielleiters einen leicht positiven Umstand.
mastership.divine_sign_1.desc=Die Zauber des Priesters verströmen einen Hauch des Göttlichen. Beim Wirken eines Zaubers aus der gewählten Magieschule kann der Priester zusätzlich zur Zauberwirkung einen der folgenden Effekte wählen:\n\
 Ein leises, einfaches Geräusch, das zur Gottheit passt (z.B. der ferne Ruf eines heiligen Tieres, der Klang einer einzelnen Harfensaite, Wasserplätschern), erklingt.\n\
 Ein Geruch, der zur Gottheit passt (z.B. Weihrauch, Blut, Frühling, Rauch), verbreitet sich in einem Umkreis von 5 Metern.\n\
 Beim Auslösen des Zaubers ist der Kopf des Priesters von einem schwachen Lichtschein in einer zur Gottheit passenden Farbe (oder Schatten) umspielt.\n\
 Ein solcher Effekt kann nach Maßgabe des Spielleiters als leicht positiver Umstand in passenden sozialen Konflikten wirken, wenn sich das Gegenüber durch den Effekt beeindrucken lässt.
mastership.power_of_community_1.desc=Der Priester zieht Kraft aus den Gebeten seiner Glaubensbrüder und -schwestern. Wenn mindestens eine Person, die den Gott des Priesters verehrt, ihn während des Zaubervorgangs durch Gebete zu seiner Gottheit unterstützt (kontinuierliche Aktion von derselben Dauer wie die verlängerte Dauer des Zaubers), erhält er einen Bonus in Höhe von 1 Punkt pro Mitbeter (bis zu einem Maximum von 2 Punkten). Die Zauberdauer verlängert sich hierdurch um 20 Ticks.
mastership.power_of_community_2.desc=Der Priester zieht Kraft aus den Gebeten seiner Glaubensbrüder und -schwestern. Wenn mindestens drei Personen, die den Gott des Priesters verehren, ihn während des Zaubervorgangs durch Gebete zu seiner Gottheit unterstützen (kontinuierliche Aktion von derselben Dauer wie die verlängerte Dauer des Zaubers), erhält er einen Bonus in Höhe von 1 Punkt pro drei Mitbetern (bis zu einem Maximum von 4 Punkten) und spart außerdem einen Punkt erschöpften oder kanalisierten Fokus ein. Die Zauberdauer verlängert sich hierdurch um 2 Minuten.
mastership.aura_of_faith.desc=Der Zauberer kann kanalisierte Zauber des Typus Aura, die neben ihm noch weitere Personen direkt betreffen, auf bis zu so viele weitere Personen ausdehnen, wie sein Wert in der Ressource Glaube beträgt. Hierfür fallen keine zusätzlichen Kosten an. Die zusätzlichen Ziele unterliegen den üblichen Beschränkungen, denen auch reguläre Ziele des Zaubers unterliegen.
mastership.divine_sign_2.desc= Die Zauber des Priesters sind von göttlicher Macht durchdrungen. Beim Wirken eines Zaubers aus der gewählten Magieschule (mindestens Grad 3) kann er einen EG aufwenden, um zusätzlich zur Zauberwirkung einen der folgenden Effekte zu wählen:\n\
 Ein Geräusch, das zur Gottheit passt und für 20 Ticks in 100 Meter Umkreis jedes andere Geräusch übertönt (z.B. die Schlachtrufe der Ahnen, die Musik himmlischer Sphären, das Tosen der Brandung), erklingt.\n\
 Im Umkreis von 50 Metern kommt es für eine Minute zu einer leichten, zur Gottheit passenden Veränderung der Umwelt (z.B. die Lichtstufe steigt oder sinkt um 1, kleine Pflanzen erblühen oder welken, die Hitze- oder Kältestufe steigt oder sinkt um 1 Stufe).\n\
 Beim Auslösen des Zaubers ist der Priester von einer übergroßen Lichtaura (oder Schatten) umspielt, in der man die Gestalt einer üblichen Darstellung der Gottheit erkennt.\n\
 Ein solcher Effekt kann nach Maßgabe des Spielleiters als leicht bis stark positiver Umstand in passenden sozialen Konflikten wirken, wenn sich das Gegenüber durch den Effekt beeindrucken lässt.
mastership.power_of_community_3.desc=Der Priester zieht Kraft aus den Gebeten seiner Glaubensbrüder und -schwestern. Wenn mindestens fünf Personen, die den Gott des Priesters verehren, ihn während des Zaubervorgangs durch Gebete zu seiner Gottheit unterstützen (kontinuierliche Aktion von derselben Dauer wie die verlängerte Dauer des Zaubers), erhält er einen Bonus in Höhe von 1 Punkt pro fünf Mitbetern (bis zu einem Maximum von 6 Punkten) und spart außerdem zwei Punkte erschöpften oder kanalisierten Fokus ein. Die Zauberdauer verlängert sich hierdurch um 10 Minuten.
mastership.healmagic.healing_faith.desc=Der Abenteurer ist besonders erfolgreich darin, positive göttliche Kraft in heilsame Effekte fließen zu lassen. Er kann maximal einmal pro Spielsitzung 1 Punkt der Ressource Glaube aufwenden (zur Zurückerlangung der Punkte siehe S. 119), um die Heilwirkung einer einzelnen Lebenspunkte heilenden Heilquelle (eines Trankes, eines Zaubers, etc.) im Umkreis von 10 Metern zu verdoppeln (sofortige Reaktion von 3 Ticks Dauer). Dies ist nur im Moment der Heilung möglich, nicht vorsorglich zu einem früheren Zeitpunkt.
mastership.protectionmagic.faith_armor.desc=Der Abenteurer kann sich oder andere durch die schiere Kraft seines Glaubens vor Schaden schützen. Er kann 2 Punkte der Ressource Glaube aufwenden (zur Zurückerlangung der Punkte siehe S. 119), um 4 Punkte unmittelbar erlittenen Schaden (sowie 1 weiteren Punkt pro Stufe in der Ressource Glaube) im Umkreis von 10 Metern zu verhindern (sofortige Reaktion von 4 Ticks Dauer).
mastership.clscraft.craftman_of_gods.desc=Der Handwerker hat gelernt, die Kraft seines Gottes in ein Werkstück einfließen zu lassen. Bei der Herstellung von Gegenständen kann er Qualitätsstufen einsetzen, um göttliche Kräfte in den Gegenstand zu binden. Mit Erwerb der Meisterschaft erhält er automatisch eine Anleitung für eine einzelne göttliche Kraft, weitere Anleitungen muss er zusätzlich erlernen.
mastership.craftmanship.craftman_of_gods.desc=Der Handwerker hat gelernt, die Kraft seines Gottes in ein Werkstück einfließen zu lassen. Bei der Herstellung von Gegenständen kann er Qualitätsstufen einsetzen, um göttliche Kräfte in den Gegenstand zu binden. Mit Erwerb der Meisterschaft erhält er automatisch eine Anleitung für eine einzelne göttliche Kraft, weitere Anleitungen muss er zusätzlich erlernen.

spell.protective_circle_deityservant.descr=Der Zauberer erschafft einen Schutzkreis von 3 Metern Radius (+1 Meter pro Punkt des Zauberers in der Ressource Glaube). Wesen des Typus Götterdiener können den Kreis nur betreten, wenn ihnen eine Probe auf Entschlossenheit gegen 25 gelingt. Sie können aber mit Fernwaffen oder Zaubern in den Kreis einwirken. Wesen des Typus Götterdiener, die sich bei Auslösen des Zaubers in 3 Metern Umkreis (zzgl. eventueller Erweiterung durch Glaube) um den Zauberer befinden, werden bei Misslingen der Probe vom Zauber nach außen gedrängt.
spell.protective_circle_deityservant.enhancedescr=Die Schwierigkeit für die Entschlossenheit-Probe erhöht sich auf 28 (+1 pro Punkt des Zauberers in der Ressource Glaube).
spell.bless_earth.descr=Ein nicht bereits einem anderen Gott geweihter Ort wird dem Gott des Zauberers anempfohlen, sodass er als göttlich gesegneter Boden (siehe Götter S. 149) der verehrten Gottheit gilt.
spell.bless_earth.enhancedescr=Der Ort gilt stattdessen als göttlich berührter Boden
spell.foreign_tongues.descr=Der Zauberer kann zusätzlich zu seinen beherrschten Sprachen eine weitere Sprache sprechen. Dabei können nur Sprachen gewählt werden, die er in den letzten 24 Stunden gehört hat. Der Zauberer ist nicht in der Lage, die Sprache auch zu verstehen, sie zu lesen oder in ihr zu schreiben.
spell.foreign_tongues.enhancedescr=Der Zauberer kann auch Texte in der Sprache mit einer üblicherweise dafür verwendeten Schrift schreiben, sofern er diese Schrift in den letzten 24 Stunden gesehen hat.
spell.doubt_faith.descr=Das Ziel des Zaubers, bei dem es sich um einen Priester handeln muss, zweifelt an seinem Glauben und erhält den Zustand Glaubenskrise 2. Das Ziel kann nicht erneut von diesem Zauber betroffen werden.
spell.doubt_faith.enhancedescr=Das Ziel erhält den Zustand Glaubenskrise 3.
spell.exorcise_deityservant.descr=Ein Wesen des Typus Götterdiener bis maximal Monstergrad (als Einzelwesen) 3 wird zurück in die Götterwelt geworfen. Innerhalb der mythischen Domäne kann der Zauber nicht angewandt werden.
spell.exorcise_deityservant.enhancedescr=Das Wesen kann für 24 Stunden nicht mehr ins Diesseits zurückkehren.
spell.control_deityservant.descr=Der Zauberer unterwirft ein Wesen des Typus Götterdiener bis maximal Monstergrad (als Einzelwesen) 3 seinen Befehlen. Es folgt allen seinen Anweisungen unabhängig aller Konsequenzen. Das Wesen bewegt sich nicht ohne explizite Anweisung aus der Wirkungsweite des kanalisierten Zaubers (siehe Splittermond: Die Regeln S. 195) hinaus.
spell.control_deityservant.enhancedescr=Es können Wesen bis Monstergrad (als Einzelwesen) 4 von dem Zauber betroffen werden.
spell.identify_deityservant.descr=Der Zauberer erkennt, ob es sich beim Ziel um ein Wesen des Typus Götterdiener handelt oder nicht.
spell.identify_deityservant.enhancedescr=Der Abenteurer erhält für die nächsten 30 Ticks einen Bonus in Höhe von 2 Punkten auf alle direkt gegen das Ziel gerichteten Proben, sofern es sich wirklich um ein Wesen des Typus Götterdiener handelt.
spell.weaken_deityservant.descr=Das Ziel erhält einen Malus in Höhe von 5 Punkten auf alle Nahkampfangriffe und Fernkampfangriffe, sofern es sich bei ihm um ein Wesen des Typus Götterdiener handelt.
spell.weaken_deityservant.enhancedescr=Der Malus gilt für alle Angriffe.
spell.divine_aura.descr=Der Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner Wahl erhalten einen Bonus in Höhe von 2 Punkten auf drei zum verehrten Gott passende allgemeine Fertigkeiten, sofern sie sich im Wirkungsbereich des Zaubers aufhalten. Diese drei Fertigkeiten müssen beim Erlernen des Zaubers unter Zustimmung des Spielleiters festgelegt werden. Der Zauber kann mehrfach erlernt werden, um jeweils unterschiedliche Fertigkeiten oder Fertigkeitskombinationen zu beherrschen.
spell.divine_aura.enhancedescr=Der Bonus erhöht sich auf 3 Punkte.
spell.divine_bond.descr=Ein einzelnes Wesen, das innerhalb der letzten Stunde im Beisein des Zauberers gegen ein Gebot der vom Zauberer hauptsächlich verehrten Gottheit verstoßen hat oder ein bekannter Feind der eigenen Gottheit ist, wird, solange es vom Abenteurer fokussiert wird (dieser kann in dieser Zeit nichts anderes tun \u2013 sollte er doch anderweitige Handlungen unternehmen, bricht der Zauber sofort ab), von göttlicher Macht gefesselt. Die Geschwindigkeit des Ziels fällt hierdurch auf 0, sofern ihm nicht eine Entschlossenheit-Probe gegen 20 (+2 pro Punkt in der Ressource Glaube des Zauberers) gelingt. Gelingt die Probe, erhält das Ziel lediglich den Zustand Lahm.
spell.divine_bond.enhancedescr=Das Ziel erhält außerdem den Zustand Erschöpft 1.
spell.divine_touch.descr=Ein einzelnes Wesen, das der vom Zauberer hauptsächlch verehrten Gottheit prinzipiell gefällig ist (als denkendes Wesen diesen also verehrt und gemäß seiner Prinzipien lebt oder als Tier ein Wesen, dass dem Gott heilig ist oder seine Aspekte verkörpert), wird von diesem mit seiner Kraft erfüllt. Es erhält den Aufsatz Göttlich berührt (siehe S. 161). Dieser Zauber endet automatisch vorzeitig, wenn das Wesen gegen ein Gebot der Gottheit verstößt oder seine Kräfte nicht im Sinne der Gottheit einsetzt.
spell.divine_touch.enhancedescr=Das Wesen erhält außerdem eines der Monster-Merkmale Furchtimmunität oder Schmerzimmunität.
spell.divine_talisman.descr=Ein heiliger Talisman des hauptsächlich verehrten Gottes des Zaubernden wird gerufen, sofern dieser in den Augen seiner Gottheit dafür würdig ist. Der Talisman ist immer ein beseelter Gegenstand mit einer aktivierten Kraft (siehe S. 129) und 2 Punkten Relikt, sowie 1 weiterer Punkt Relikt für je 2 Punkte in der Ressource Glaube. Hiermit können weitere beseelte Kräfte (mit den üblichen Beschränkungen und Reihenfolgen), Qualitätsstufen, legendäre Kräfte und ähnliches erworben werden).\n\
 Der Talisman kann ausschließlich vom Zauberer eingesetzt werden, und auch das nur, wenn dieser sich an die entsprechenden Gebote und Verbote hält \u2013 andernfalls verliert der Talisman nach und nach seine Kräfte. Es kann immer nur ein göttlicher Talisman gleichzeitig gerufen werden.\nBezüglich der genauen Art des göttlichen Talismans sollten sich Spielleiter und Spieler bei Erlernen dieses Zaubers zusammensetzen und einen entsprechenden Gegenstand (oder gar mehrere) ausarbeiten.
spell.divine_talisman.enhancedescr=Der Talisman besitzt zwei aktivierte Kräfte, sowie eine weitere für je 2 Punkte in der Ressource Glaube.
spell.divine_symbol.descr=Der Zauberer erschafft in seine Handfläche, auf seiner Stirn oder an einem anderen passenden Ort ein Symbol seiner Gottheit oder seines Kultes, das er erlernt hat. Mit diesem kann er sich beispielsweise als Anhänger eines Geheimkultes oder einer bestimmten Strömung innerhalb des eigenen Kultes ausweisen. Das Erschaffen jedes zu zeigenden Symbols muss man von einem Eingeweihten beigebracht bekommen, es ist nicht in der Zauberwirkung selbst enthalten. Das erste Symbol, das Zeichen des eigenen Kultes, lernt man normalerweise zusammen mit dem Zauber.
spell.divine_symbol.enhancedescr=Das Zeigen des Symbols gibt in passenden Situationen einen leicht positiven Umstand auf eine etwaige folgende Probe im sozialen Konflikt.
spell.fake_divine_symbol.descr=Der Zauberer erschafft wie beim Zauber Göttliches Symbol in seine Handfläche, auf seiner Stirn oder an einem anderen passenden Ort ein Symbol irgendeiner Gottheit oder eines Kultes. Dafür muss er das Symbol bei oben genanntem Zauber mindestens einmal beobachtet haben, es aber nicht erlernt haben. Die Schwierigkeit, die Fälschung mit einer Wahrnehmung-Probe zu entdecken, beträgt für Kenner des Symbols 25.
spell.fake_divine_symbol.enhancedescr=Die Schwierigkeit der Wahrnehmung-Probe erhöht sich auf 30.
spell.disturb_divine_connection.descr=Die Verbindung des Ziels zu seiner Gottheit wird gestört. Dadurch fallen für alle vom Ziel gewirkten Zauber, sofern es sich um einen Priester handelt, weitere Fokuskosten in Höhe von 5V2 an. Außerdem muss für jeden Einsatz der Ressource Glaube ein Punkt Glaube mehr aufgewendet werden, als eigentlich üblich.
spell.disturb_divine_connection.enhancedescr=Die zusätzlichen Fokuskosten pro Zauber eines Priesters erhöhen sich auf 7V4.
spell.shake_divine_connection.descr=Die Verbindung aller Wesen im Ziel zu ihren Gottheiten wird gestört. Soll im Wirkungsbereich ein Zauber durch einen Priester ausgelöst werden, fallen dafür zusätzliche Fokuskosten in Höhe von 7V4 an. Außerdem muss für jeden Einsatz der Ressource Glaube im Wirkungsbereich ein Punkt Glaube mehr aufgewendet werden, als eigentlich üblich.
spell.shake_divine_connection.enhancedescr=Der Zauberer selbst ist von den Auswirkungen des Zaubers nicht betroffen.
spell.trust_in_god.descr=Der Zauberer muss einen Punkt Glaube aufwenden, dafür verlieren er und bis zu AUS weitere Personen sowie eine weitere Person pro Punkt in der Ressource Glaube im Wirkungsbereich jeden zum Zeitpunkt des Auslösens vorliegenden Zustand Angsterfüllt oder Panisch. Auf etwaige weitere Proben zum Widerstehen der entsprechenden Zustände erhalten alle Betroffenen für die Wirkungsdauer des Zaubers sowie für 10 weitere Ticks pro Punkt in der Ressource Glaube einen Bonus in Höhe von 1 Punkt.
spell.trust_in_god.enhancedescr=Der Probenbonus erhöht sich auf 3 Punkte.
spell.summon_divine_animal.descr=Der Zauberer ruft ein Wesen des Typus Tier bis maximal Monstergrad (als Einzelwesen) 2 oder Kreatur 6 herbei, das als Symbol oder heiliges Tier seiner Gottheit gilt (siehe die Tabellen ab S. 162; sofern dort kein passendes Wesen aufgeführt ist, kann bei Erlernen des Zaubers eines in Absprache mit dem Spielleiter gewählt werden). Das Wesen erscheint innerhalb von 1W10 Ticks nach Auslösen des Zaubers und verschwindet augenblicklich, sofern es getötet wird oder der Zauber endet. Die Wesen folgen allen Anweisungen des Zauberers, die im Einklang mit den Geboten des Gottes stehen.
spell.summon_divine_animal.enhancedescr=Eines der gerufenen Wesen erhält außerdem den Aufsatz Göttlich berührt (siehe S. 161), sofern der Zauberer 1 Punkt Glaube aufwendet.
spell.bless_home.descr=Das Zielbauwerk kann von jedem außer dem Zauberer und Bewohnern (Personen, die seit mindestens einem Monat dort wohnen) nur noch betreten werden, wenn entweder eine Entschlossenheit-Probe gegen 25 gelingt (nur eine Probe pro Tag erlaubt) oder die einmalige Erlaubnis eines bei Auslösen des Zaubers bestimmten Bewohners vorliegt. Der Zauber kann nur auf solche Bauwerke gesprochen werden, die bei Auslösen des Zaubers vollständig im Wirkungsbereich des Zaubers liegen.
spell.bless_home.enhancedescr=Die Schwierigkeit der Entschlossenheit-Probe erhöht sich auf 30.
spell.major_consecration.descr=Der Zauberer weiht einen Gegenstand seiner Gottheit, wodurch dieser zuzüglich zu seinen sonstigen Fähigkeiten einen Bonus in Höhe von 4 auf alle Fertigkeiten gewährt, für die er eingesetzt wird.
spell.major_consecration.enhancedescr=Der Bonus erhöht sich auf 6 Punkte.
spell.grasp_danger.descr=Der Zauberer kann ein während der Zauberdauer berührtes anderes Wesen oder einen klar umrissenen Ort, an dem er sich während der Zauberdauer befindet, dergestalt verzaubern, dass er während der Wirkungsdauer erfährt, wenn Leben oder Unversehrtheit der Person oder des Ortes unmittelbar gefährdet werden (also etwa wenn das Wesen Schaden oder einen negativen Zustand erleidet, unheilige Wesen einen entsprechend verzauberten Tempel betreten, oder ähnliches).
spell.grasp_danger.enhancedescr=Der Zauberer erfährt auch die grobe Natur der Bedrohung (Art und Anzahl der Gegner oder ähnliches).
spell.voice_of_faith.descr=Die Stimme des Zauberers erhebt sich selbst über größten Lärm, lässt andere verstummen oder erklingt in den Köpfen aller Personen im Wirkungsbereich. Solange er eine Rede im Einklang mit den Prinzipien seines Glaubens hält, muss jeder dem Priester zuhören und kann keine anderen Handlungen unternehmen, sofern ihm nicht eine Entschlossenheit-Probe gegen 25 gelingt. Wer während der Rede in Gefahr gerät (etwa durch einen erfolgenden Angriff, weil er von anderen Leuten umzingelt wird oder auf einem Floß auf einen Wasserfall zu treibt), ist nicht mehr von dem Zauber betroffen. Sobald der Priester aufhört, über Themen seines Glaubens zu reden, endet die Wirkungsdauer des Zaubers vorzeitig.
spell.voice_of_faith.enhancedescr=Die Schwierigkeit der Entschlossenheit-Probe erhöht sich auf 30.
spell.find_temple.descr=Der Priester spürt die Richtung des nächstgelegenen seiner Gottheit geweihten Tempels, sofern ein solcher in maximal drei Tagesreisen Entfernung existiert. Sollte es im Umkreis von drei Tagesreisen keinen entsprechenden Tempel geben, erfährt der Zauberer stattdessen dies. Darüber, ob ein Tempel als nächstgelegen zählt, bestimmt nur die reine Entfernung, nicht die eventuelle Erreichbarkeit.
spell.find_temple.enhancedescr=Der Priester kann auch einen Tempel einer Gottheit, die seiner ähnlich ist (mindestens ein Aspekt Übereinstimmung, siehe die Tabellen ab S. 162), spüren, falls es im oben genannten Umkreis keinen Tempel seiner Gottheit gibt.

enhancement.divine_hint.desc=Der Gegenstand stellt eine Verbindung zur Gottheit des Trägers dar. Einmal pro Spielsitzung kann der Träger ihn einsetzen, um einen göttlichen Fingerzeig zu erhalten. Dies ist kein Wissensquell \u2013 es geht nicht um Informationen, sondern um den Willen des Gottes an sich. Der Träger kann also etwa die Frage stellen \u201EIst es im Sinne meines Gottes, diesem Mann zu helfen?\u201C, nicht aber die Frage \u201EWo ist der Talisman von Iskrammar versteckt?\u201C. Die Antwort ist nicht notwendigerweise offensichtlich. Es kann sich um eine Ja/Nein-Antwort halten, häufig ist die Antwort aber auch verschwommen und uneindeutig und benötigt zunächst die Interpretation des Besitzers, gerade wenn es eine Frage ist, bei der die Antwort ohnehin Auslegungssache ist.\nDie Antwort des Gottes gewährt dem Träger einen Bonus in Höhe von 2 Punkten auf Entschlossenheit-Proben, die mit einer etwaigen im Sinne der Gottheit liegenden Aufgabe zusammenhängen. Dieser Bonus hält an, bis die Aufgabe erfüllt ist oder der nächste göttliche Fingerzeig erhalten wurde.
enhancement.power_of_faith.desc=Der Gegenstand ist ein Talisman, der dem Träger Mut macht und seine Bindung an seinen Gott stärkt. Die Ressource Glaube des Besitzers ist um 1 Punkt erhöht, solange er im Besitz des Talismans ist und sich nach den Geboten seiner Gottheit verhält. Ein Träger kann nur von einem einzelnen solchen Gegenstand profitieren.
enhancement.light_of_life.desc=Der Gegenstand kann ein Wesen von der Gesundheitsstufe Todgeweiht ins Leben zurückrufen. Wird ein Sterbender mit ihm gesegnet, kann der Träger einen Splitterpunkt oder einen Glaubenspunkt ausgeben. Dies ist eine kontinuierliche Aktion von 10 Ticks Dauer. Geschieht dies, werden die Zustände Blutend, Sterbend und Verwundet für einen Tag um 2 Stufen reduziert und hierbei Siechtum bis zu Stufe 2 aufgehoben (die Blutung wird dadurch in den allermeisten Fällen also dauerhaft gestoppt). Dies erleichtert die benötigte Probe, um einen Sterbenden zu retten, natürlich entsprechend. Pro Person und Zustandsquelle ist dies nur einmal pro Tag einsetzbar, und nach Ablauf des Zeitraums treten etwaige noch vorhandene Zustände wieder mit voller Stärke auf. Die Dauer von Giften wird in diesem Zeitraum halbiert, Krankheiten gelten als eine Krankheitsphase schwächer.
enhancement.divine_blessing.desc=Der Gegenstand verstärkt die Verbindung des Trägers zu seinem Gott und macht es ihm leichter, Segen zu wirken. Von ihm gewirkte Zauber des Typus Segen erhalten bei Gelingen 1 automatischen Erfolgsgrad und die verstärkte Variante des Zaubers kostet immer 1 Punkt verzehrten Fokus weniger (die Kosten der Verstärkung können hierdurch nicht unter 1 erschöpften oder kanalisierten Punkt sinken). Diese göttliche Kraft lässt sich maximal zweimal auf einen Gegenstand legen. Es kann nur von einem solchen Gegenstand gleichzeitig profitiert werden.
enhancement.divine_protection.desc=Der Glaube des Trägers dieses Gegenstandes ist wie ein Schild, der ihn vor sämtlichen Gefahren schützt. Der Priester kann Fokuspunkte bis zur Höhe seiner Ressource Glaube kanalisieren (was eine sofortige Reaktion und 3 Ticks erfordert) und eine Entschlossenheit-Probe gegen 25 würfeln, um Schadensreduktion in Höhe der halben eingesetzten Fokuspunkte zu erhalten. Sofern die Probe gelingt und Fokus aufgewendet wird, wird einer der Punkte verzehrt. Man kann nur von einem Schutz des Glaubens gleichzeitig profitieren.
enhancement.divine_weapon.desc=Diese göttliche Kraft lässt sich nur auf Waffen legen. Die Waffe wird von einem Prinzip des Gottes erfüllt: Sie erstrahlt bei einer Lichtgottheit in hellem Licht, bei einer Feuergottheit ist die Klinge in Flammen gehüllt und so weiter. Der gewöhnliche Schaden der Waffe wird vollständig in die besondere Schadensart umgewandelt, was üblicherweise nur dann Auswirkungen hat, wenn eine Kreatur gegen diese Schadensart verwundbar oder resistent ist. Weitere Effekte (wie Leuchtwirkung oder das Entzünden von Feuer) liegen in den Händen des Spielleiters.\nAuch Götter, denen kein passendes Prinzip zugeordnet ist, segnen manchmal entsprechende Waffen, die dann meist gegen Kreaturen einer rivalisierenden Gottheit oder andere Wesen (wie Wesen der Finsternis) so wirken, als hätten diese Kreaturen eine entsprechende Verwundbarkeit.

material.alabasteriron.desc=Angeblich kann Alabastereisen auch in seltenen natürlichen Vorkommen auf Lorakis gefunden werden. Bekannt ist das Material, das selbst das geringste Licht stark reflektiert, aber vor allem von Waffen und Rüstungen einiger Götterdiener.
material.alabasteriron.effect=Gegenstände aus Alabastereisen (die mindestens Last 2 besitzen und offen getragen werden) spiegeln und glänzen im Licht so stark, dass der Träger eine leichte Deckung gegen Fernkampfangriffe erhält.
material.eternal_shadow.desc=Einige Schattenwesen der göttlichen Domäne sind stofflich genug, dass Teile ihres Leibes verwendet werden können, um daraus Gegenstände zu fertigen \u2013 mitunter geben solche Wesen ihre stoffliche Kraft auch freiwillig an gläubige Sterbliche. Auch andere physische Manifestationen von Schatten können darunter fallen.
material.eternal_shadow.effect=Gegenstände aus Ewigem Schatten (mit mindestens Last 1) verschlechtern die Lichtverhältnisse im Umkreis von 10 Metern um 2 Stufen.\nNur ein Gegenstand dieser Art kann gleichzeitig eingesetzt werden.
material.eternal_light.desc=Ewiges Licht ist das lichte Gegenstück zu Ewigem Schatten.
material.eternal_light.effect=Gegenstände aus Ewigem Licht verbessern die Lichtverhältnisse im Umkreis von 10 Metern um 2 Stufen. Nur ein Gegenstand dieser Art kann gleichzeitig eingesetzt werden. Ein Gegenstand aus Ewigem Licht gilt als Lichtquelle.
material.darksilk.desc=Es heißt, Finsterseide würde in den tiefsten Tiefen der lichtlosen Domänen schattenhafter Götter gefertigt. Dieses schimmernde, weiche und federleichte Material schmiegt sich wie eine zweite Haut an den Körper und scheint in der Dunkelheit regelrecht mit seinem Träger zu verschmelzen und ihn widerstandsfähiger zu machen.
material.darksilk.effect=Kleidung aus Finsterseide gewährt seinem Träger in (natürlicher, nicht-magischer) Dunkelheit einen Bonus in Höhe der Stufe der Licht­verhältnisse auf den Körperlichen Widerstand.
material.etherealgold.desc=Himmelsgold ist nach dem Mondstahl eines der legendärsten Materialien auf ganz Lorakis. Es heißt, dieses Material könne nur von den Göttern und ihren höchsten Dienern selbst geschenkt werden, und die Waffen und Rüstungen der größten Helden der Legenden sollen daraus bestanden haben.\nAuch Himmelsgold hat zahlreiche Erscheinungsbilder: Mal wirkt es tatsächlich wie schieres Gold, ein anderes Mal wie funkelndes Silber, aber auch blutrote oder tiefblaue Erscheinungen kommen vor.
material.etherealgold.effect=Ein Gegenstand aus Himmelsgold besitzt zahlreiche Vorzüge (gekürzt):\n- profane Unzerstörbarkeit, selbstreinigend\n-Immunität gg. Furchterregend, GW+3 bei Angsterfüllt\n-+2 Ressource Glaube\n-doppelter Schaden bei verfeindeten Götterdienern\n- Rüstungen haben SR+1\nEinstellungsänderung bei Priestern und Gläubigen\n- Träger muss sich Gottheit würdig zeigen
material.wandering_monk_wood.desc=Das Holz des Wandermönchs stammt aus der göttlichen Domäne und kann unzählige Formen annehmen, von rötlichem Rosenholz über blasses Birkenholz bis hin zu tiefdunklem Edelholz. Ihnen allen ist jedoch die Verbindung zu ihrem Ursprung gemein, die dafür sorgt, dass natürliche Umgebung freundlicher auf den Träger eines solchen Gegenstandes reagiert.
material.wandering_monk_wood.effect=Gegenstände aus diesem Holz (mit mindestens Last 1) gewähren bei der Wildnisführung und Lagerbereitung (siehe Splittermond: Die Regeln S. 153) bei Gelingen der Probe einen zusätzlichen Erfolgsgrad. Außerdem kostet die Veränderung der Ereigniskategorie nur 1 statt 2 Erfolgsgrade und es sind 2 Veränderungen möglich, wie unter Einfluss der Meisterschaft Vorausschauender Führer. Besitzt der Träger auch diese Meisterschaft, kann er die Kategorie sogar um 3 Stufen verbessern. \nEs kann nur von einem einzelnen solchen Gegenstand profitiert werden.
material.devils_hide.desc=Teufelsleder ist ein Sammelbegriff für das Leder von Kreaturen, die mit finsteren Göttern des Schmerzes und des Leids assoziiert werden. Es ist ein raues, äußerlich meist abstoßendes Material, das die Eigenschaft hat, darauf vergossenes Blut restlos aufzusaugen, als würde es sich davon ernähren.
material.devils_hide.effect=Teufelsleder stärkt sich aus den Schmerzen des Trägers. Für jede vollständig verlorene Gesundheitsstufe des Trägers steigt die Schadensreduktion einer Rüstung aus Teufelsleder bis zur Heilung des entsprechenden Schadens um 1 Punkt. Dafür erhält die Rüstung, solange die SR erhöht ist, eine zusätzliche Behinderung von 1 Punkt.

education.inquisitor.descr=Lorakis ist ein gefährlicher Kontinent und es gibt viele Feinde, die den Gottesfürchtigen schaden wollen \u2013 seien es Feinde des Glaubens, Angehörige finsterer Kulte oder auch Ketzer oder Häretiker innerhalb des eigenen Kultes. Doch es gibt auch jene, die sich aus diesem Grund zum Schutze der Gläubigen berufen fühlen und die Waffen ergreifen, um den Glauben zu verteidigen.\nWo Glaubenskrieger den kämpfenden Arm eines Kultes darstellen und für ihren Gott in die Schlacht ziehen, ist der Inquisitor oft auf sich alleine gestellt und begegnet seinen Feinden weniger im offenen Kampf. Seine Aufgabe ist vielmehr, die Gesetze des Glaubens zu kennen und deren Einhaltung zu überwachen sowie gegen all jene vorzugehen, die den Kult in seinen Grundfesten bedrohen. In manchen Reichen üben Inquisitoren daneben auch die Überwachung weltlicher Gesetze aus, indem sie zum Beispiel Richterämter bekleiden oder im Auftrag des Landesherren Verbrecher zur Strecke bringen.
education.honorguard.descr=Der Orden der Ehrwächter besteht aus Priestern Rahidis, die die Einhaltung der Gesetze in Ashurmazaan überwachen. Neben den weltlichen Geboten, bei denen sie häufig als Vermittler und Schiedsrichter auftreten, beinhaltet dies vor allem die Überwachung des Ehrenkodexes. Sie wachen hierbei buchstäblich darüber, dass sich niemand mit fremden Federn schmückt.
education.voice_of_ghosts.descr=Die Stimmen der Geister sind ein Orden von Mystikern aus Zhoujiang. Sie sehen sich als Mittler zwischen der Welt der Geister und der Sterblichen und ahnden sowohl Übergriffe von Geistern gegen Sterbliche als auch umgekehrt. Die Stimmen haben keine formale Organisation, viele sind Eremiten und Wanderer, die sich weder der einen noch der anderen Welt zugehörig fühlen.
education.nighthawk.descr=Bei den Nachtfalken handelt es sich um eine Gruppe von Goden aus Nyrdfing, die Starrekyng, den obersten Schutzgott des Landes, verehren. Im Volke genießen sie einen gemischten Ruf: Als Beschützer vor Feen, Feenwerk und finsterer Magie sind sie gerne gesehen. Ihre harte Hand als Bewahrer der göttlichen Ordnung kann sich aber auch gegen das einfache Volk wenden, und manche von ihnen gelten dabei als unflexibel und übermäßig streng.
education.cultist.descr=Viele Kultisten führen ein Leben im Schatten des lorakischen Lebens. Anhänger eines Gottes, der verpönt, gefürchtet oder gar verboten ist, sind häufig gezwungen, ihre Rituale und Zusammenkünfte im Geheimen abzuhalten. So wundert es nicht, dass sich vor allem in den Großstädten und Metropolen Geheimbünde und Kulte verschiedenster Götter gegründet haben, von denen die Obrigkeit und die Bevölkerung häufig nicht einmal etwas ahnen. Doch auch in verschlafenen Dörfern oder an abgelegenen Orten lassen sich Kulte und Zirkel finden. Dabei handelt es sich mitnichten ausschließlich um finstere Fanatiker, die eine boshafte Gottheit anbeten, sondern es sind oft auch Gemeinschaften, die aus einem triftigen Grund lieber unter sich bleiben. Sowohl Mysterienkulte, die geheimes Wissen sammeln oder bewahren, wie auch viele Gruppen von vermeintlichen Häretikern und Ketzern, die eine abweichende Lehre eines anerkannten Gottes predigen, scheuen die Öffentlichkeit. Ihrem Gott jedoch haben sie sich ebenso verschrieben wie jene Priester, die öffentlich in den Tempeln predigen.
education.herold_of_doom.descr=In Dakardsmyr sind die Untergangsverkünder geachtet und gefürchtet zugleich \u2013 zumindest unter jenen, die von ihrer Existenz wissen. Diese Gläubigen Oma Barkas sind keine Priester, aber sie sind im Auftrag von Propheten und Sehern unterwegs, um kommendes Unheil zu verkünden.\nSie verschleiern ihre wahre Identität und haben häufig bereits Artefakte oder Alchemika zur Hand, mit denen sich die Gefahr womöglich abwehren lässt. Viele Sumpfgnome halten sie für Scharlatane, doch brechen sie nie ohne triftigen Grund zu ihren Missionen auf und neben allem Geschäftssinn steckt doch auch tiefe Gläubigkeit in ihnen.
education.ronite.descr=Die Roniten sind eine lose verbundene Gemeinschaft von farukanischen Ronay-Priestern, deren oberstes Ideal es ist, Gutes zu tun und die Ränke der Göttin Uryat zu bekämpfen, ohne dabei erkannt und geehrt zu werden \u2013 auch um den Verrat von Ronays Zwillingsbruder Ronash wieder gut zu machen. Anstelle von deutlich sichtbaren Pfauenfedern tragen sie farbige Stoffstreifen, die sie über dem Herzen in die Innenseite ihrer Gewänder sticken und deren Bedeutung nur Eingeweihte kennen.
education.disciple_dragonfish.descr=Versteckt agieren die Jünger des Drachenfischs in Zhoujiang, deren Gott heute fast völlig vergessen ist, deren Tempel nahezu völlig zerstört wurden und deren Kult vor vielen Jahrhunderten verboten wurde. Die Mönche gehen gezielt gegen die Priester und Gläubigen der Spinnengöttin Gagamba vor und schrecken dabei nicht vor Attentaten und dem Einsatz zerstörerischer Zauberei zurück.
education.mystic.descr=Mystiker geben sich mit weltlichen Aspekten des Glaubens nicht ab. Sie streben nach den verborgenen Geheimnissen des Kosmos und widmen ihre ganze Kraft den Fragen nach Sein, Werden und Vergehen. Magisches und mystisches Wissen sind für Mystiker meist die Mittel der Wahl bei ihrer spirituellen Suche. Je nach Kultur kann diese Suche viele Formen annehmen. Ein Mystiker kann als Eremit in der Felswüste leben, Jahre auf einem Baum verbringen, sich in der Mitte eines großen, chaotischen Tempels ausschließlich mit brüchigen Schriftrollen beschäftigen, in stetiger Meditation seinem Gott nahekommen oder jede Gelegenheit nutzen, um durch die Wellen der Kristallsee zu tauchen und die unbegreifliche Kraft des Meeres zu ergründen.
education.deepseeker.descr=Unter den Afali gibt es viele begabte Taucher. Doch sind es weder Perlen noch versunkene Schätze, was die Tiefensucher unter die Wogen des Meeres lockt. Sie verbringen so viel Zeit wie möglich unter Wasser, um das Wesen der See zu erkunden und dort ihren Göttern näher zu kommen. Doch mitunter zieht es sie auch an Land, wenn die Tiefen des Meeres nicht alle ihre Fragen beantworten konnten.
education.stonefather.descr=Steinväter  und  -mütter  sind  gnomische  Eremiten, die  in  den  einsamen  Hochebenen  Elyreas  Jahre verbringen,  nur  um  dann  durch ganz  Lorakis  zu  reisen,  um  einen bestimmten  Stein  zu  finden.  Sie wirken auf Außenstehende mitunter unwirsch, doch liegt dies vielmehr daran, dass sie jahrelang nur Steine, Tiere und die  Präsenz  ihrer Götter  als  Gesellschaft hatten.
education.firedancer.descr=Auf den zahlreichen Archipelen  der  Stromlandinseln  ziehen  die  Feuertänzer  ihre  rituellen Kreise, um dem Titanen Kar,  dem  Herrn  der  Vulkane,  näher  zu  kommen und das Wesen der Flammen zu begreifen. Ähnlich wie das von ihnen verehrte  Feuer  sind  sie  oft  sprunghaft und  nicht  selten  ziehen  sie  in  die Welt hinaus, um ein in den lodernden Flammen gesehenes Mysterium zu ergründen.
education.soulguide.descr=Auf Lorakis werden viele verschiedene Gottheiten aus mindestens genauso vielen unterschiedlichen Gründen angebetet und verehrt. Manche Gläubige opfern ihre besten Tiere, um einen wütenden Gott zu besänftigen. Andere hoffen, dass sie für gottgefällige Taten belohnt werden, etwa mit einer reichen Ernte oder Schutz vor bösen Feen. Wieder andere verehren die Götter, einfach weil ihre Vorfahren dies ebenfalls taten. Dabei ist es nicht immer leicht, den jeweiligen Geboten und Verboten Genüge zu tun. Seelenführer helfen den Gläubigen dabei, den Willen der Gottheit zu verstehen und ihr Leben danach auszurichten. Je nach Kultur sieht diese Hilfe ganz verschieden aus, aber fast überall spielt das Deuten von göttlichen Omen und Visionen eine wichtige Rolle. In Kulturen, in  denen  Ahnenverehrung  üblich  ist,  werden  auch  oft  die Geister um Rat gefragt. Eine weitere Aufgabe des Seelenführers ist es, sich um den Verbleib von Verstorbenen zu kümmern. Durch die je nach Kultur unterschiedlichen Grabrituale sollen die Geister in das Reich des Gottes geführt oder zur ewigen Ruhe gebettet werden \u2013 und gleichzeitig soll durch sie dafür gesorgt werden, dass die sterblichen Überreste vor schändlichen Zaubern geschützt sind. Da sich Seelenführer so intensiv mit Geistern und Seelen beschäftigen, sind sie meist diejenigen, an die man sich bei einer Geisterplage wendet. Seelenführer haben oft ein ruhiges Gemüt und sind sehr einfühlsam. Die Bevölkerung sieht in ihnen  einen  unerschöpflichen  Quell von Hoffnung und beschenkt sie mit  nahezu  grenzenlosem  Vertrauen, selbst wenn sie schlechte Kunde  bringen.  Dies  ist  nicht verwunderlich,  denn  schließlich  sind  es  die  Seelenführer, die  einem  dabei  helfen,  ein bevorstehendes  Unheil  abzuwenden  \u2013  oder  es  zumindest zu akzeptieren.
education.galstarsinger.descr=Galstarsänger dienen Wesantia, der in Zwingard verehrten  sorgenden  Mutter  und Schirmherrin  der  Familie. Sie sind zwar keine großen Krieger, aber dennoch unverzichtbar  in  der  Abwehr der blutrünstigen Orks. Mit ihren  magischen  Gesängen und  medizinischen  Fähigkeiten  sind  sie  eine  notwendige Unterstützung im Kampf, aber vor allem geben sie der Bevölkerung im ganzen Land immer wieder neuen Mut, indem sie an all das Gute erinnern, wofür es sich zu kämpfen lohnt.
education.augur.descr=Auguren  nennt  man  in  Patalis  jene  Priester  verschiedener Götter, die an einem Hof angestellt sind und dort die Pläne des Herrn auf ein gutes Gelingen sowie im Hinblick auf das Wohlwollen der Himmlischen überprüfen. Besonders reiche Adelige stellen sogar mehrere Auguren ein, um so möglichst viele der patalischen Götter auf ihrer Seite zu wissen. Manche Auguren haben sich aber auch von ihren adligen Herrn losgesagt und bieten ihre Dienste stattdessen der einfachen Bevölkerung an oder haben sich dem Rosenorden auf Elyrea angeschlossen.
education.ghostseeker.descr=Die Geistsucher der Tarr suchen ruhelose Seelen, die keinen Einlass ins Geisterreich erhalten haben, und helfen ihnen dabei, den Weg zu den Ahnen doch noch zu finden. Dabei kann die Suche nach Erlösung bis in weit entfernte Länder führen. Manchmal ist es auch notwendig, bereits ruhende Geister zurück ins Diesseits zu holen \u2013 und auch hier ist das Wissen der Geistsucher gefragt.
education.wondermaker.descr=Fast  jeder  organisierte  Kult  auf  Lorakis verfügt  über  heilige  Relikte,  die  oft  im Zentrum  der  Verehrung  stehen  oder der Sage nach gar von einem Gott oder einem seiner Boten berührt oder erschaffen  wurden.  Doch  die  meisten  dieser Artefakte wurden von Priestern gefertigt und  mit  einem  göttlichen  Funken  versehen, damit Gläubige damit das Werk ihres Gottes verrichten können. Die besten göttlich  inspirierten  Handwerker  sind  gemeinhin als Wunderwerker bekannt. Manche von ihnen rüsten tapfere Glaubenskrieger mit heiligen Waffen aus, um ihre Gemeinschaft zu schützen. Andere erschaffen Werkzeuge für den liturgischen oder täglichen  Gebrauch,  vom  Reliquiar über den gesegneten Pflug bis hin zur  von  göttlichem  Willen  geleiteten  Schreibfeder.  Und  wieder andere  füllen  ganze  Archive  mit göttlichen Alchemika und Schriftrollen, die dem Kult in schwierigen Zeiten  helfen,  oder  entwerfen  ganze Kathedralen, um dem Gott einen Ort im Diesseits zu geben. Ihnen allen ist aber gemein, dass sie durch ihr Werk die göttliche Macht preisen und ihr eine Form geben.Der typische Wunderwerker ist bescheiden und eifrig. Er bleibt meist am Ort seines Schaffens \u2013 oft ein kirchliches Zentrum, aber manchmal auch ein abgelegenes Kloster. Er ist ein unsichtbares aber wichtiges Rädchen im Getriebe, seine Arbeit ist gleichzeitig Verehrung und nutzbringend, und genau so will er es auch. Aber auch manchen Wunderwerker zieht es auf Abenteuer in die Welt hinaus. So folgen sie etwa einer oft unklaren göttlichen Vision, irgendwo ein besonderes Werk zu vollbringen, oder suchen nach seltenen Materialien, neuen  Herstellungsverfahren  oder  exotischen  Erfindungen, mit denen sie ihre Gemeinschaft bereichern oder ihrem Gott noch würdigere Werke erschaffen können.Wenn sie in die Welt hinausziehen, schätzen Wunderwerker wehrhafte  und  wildniskundige  Begleiter,  um  ihre  üblichen Defizite auszugleichen. Sie selbst bilden dafür einen ruhigen Pol der Zuversicht und Hilfe für die Gruppe, und sie stellen für jede Situation das nötige Werkzeug bereit.
education.firnbezwinger.descr=Bei den Frynjord gehören die Firnbezwinger zu den Stützen der Gesellschaft: Neben den Stollen Jordheims haben sie auch dessen  Heizsysteme  und  die  Eispaläste  Zimahoras  erdacht und erbaut. Manche betreiben sogar Seefahrt und bewahren die Walfangschiffe, denen sie den Segen der Götter angedeihen lassen, vor Unwettern und Einschluss im Eis. Um das alles zu schaffen, pflegen sie gute Beziehungen zu hilfreichen Hausgeistern.
education.athanorier.descr=Die Gnome von Dakardsymr sind nicht unbedingt für strukturierte Religiosität bekannt, sehen sie die Götter doch eher  als  gute,  etwas  entferntere  Verwandte.  Insofern gelten  Mama Wawillas  Athanorier  mehr  als  besonders  fromme  und  gesegnete  Alchemisten-Kollegen denn als abgehobene Priester: Sie stellen hochwertigste Utensilien her, die durch Mamas Segen vor Unfällen  schützen,  und  kennen  Rezepte  für Wundermittel, die ohne göttlichen Beistand nicht zu replizieren sind.
education.daugther_maker.descr=Die  handwerklich  fleißigen  Kungaiki huldigen der Göttin Agomai in ihren  großen  Schreinen.  Sie  wird aber  auch  in  abgelegenen,  sich selbst  versorgenden  Klöstern verehrt,  in  denen  die  Töchter  des  Schaffens  ständig verschiedenste  metallene Handwerkserzeugnisse herstellen \u2013 die allerdings nie für  den  Verkauf  bestimmt sind. Die Herstellung selbst ist kultische Verehrung, und so  dürfen  die  Erzeugnisse  keinem profanen Zweck dienen. Nur wenn das Land bedroht ist, öffnen die  Klöster  ihre  Lager  und  verteilen ihre Werke.
education.preserver_of_web.descr=Eine der vielen badashirischen Sekten sind die Bewahrer desGewebes. Laut ihnen spinnt die göttliche Spinne Vanusuri als Dienerin der Schicksalsgötter die Lebens- und Schicksalsfäden für ganz Lorakis. Das Gewebe des Schicksals ist jedoch fragil und eine Beschädigung für alle katastrophal. Bewahrer suchen nach Bedrohungen des Gewebes und schreiten wenn nötig zur Korrektur, was oft lange Reisen erfordert. Ihre Absichten sind meist hehr, ihre Methoden jedoch oft zwielichtig.
education.goden.descr=Die Nyrdfinger Goden, Priester des Starrekyng, sind mit Politikund Macht ebenso vertraut wie mit Gebet und Segnung. Sie verkehren aufgrund des Einflusses der Kirche auch in Adelskreisen und sind den Fürsten daher oft näher als den Bauern. Die Priesterschaft der Goden ist zahlreich und sehr strukturiert und auch innerhalb ihrer Orden und Bruderschaften gibt es ebenso wie in der Politik Kämpfe um Einfluss und Macht.
education.glow_walker.descr=Die Glutgänger von Otane sind Sonderlinge im Volk der Mahaluu und die letzten Priester des schwindenden Gottes Kanatauna. Sie predigen ewige Wacht und Standhaftigkeit auf einer Insel der Freuden und stoßen somit meist auf taube Ohren. Seit Jahrhunderten bewachen sie den Ruraroate, doch der Bann wird zunehmend schwächer und zwingt sie, auch fernab der Inseln nach neuen Wegen zu suchen, den Feenkerker zu versiegeln.
education.grimman.descr=Die Grimmanswachen bilden einen Orden tapferer Streiter,deren Hauptsitz in der Nyrdfinger Hauptstadt Catley liegt. Zu Ehren des lachenden Herrn kämpfen sie gegen böse Feenwesen aus dem Norden oder beschützen Karawanen auf dem Mondpfad nach Termark. Aber auch überall sonst in der Welt versuchen sie, die Menschen vor den Schrecken der Feenwelt zu beschützen und die Philosophie ihres Gottes zu vertreten.
education.disciple_jord.descr=Den Stellenwert des Zusammenhalts in der Gesellschaft derFrynjord erkennt man an den Jüngern Jords, des Gottes der Kameradschaft, die trotz ihres Status als Priester stets mit anpacken, wenn sie gebraucht werden. Kaum eine gefährliche Unternehmung  kommt  ohne  sie  aus,  wobei  sie  sich  gerne einem Anführer unterordnen und ihn nach ganzen Kräften unterstützen. Scheitert die Gemeinschaft, sieht das ein Jünger Jords als persönliches Versagen. Viele gehen dann auf eine lange Reise, um mehr Stärke und Weisheit zu erlangen und der Gemeinschaft in Zukunft mehr zu nutzen.
education.kantioku.descr=In Kintai predigen die Kantioku die Vollkommenheit Myurikos  und  streben  selbst  nach  Perfektion  in  ihren Taten  und Worten, sei es mit dem Katana oder beim Origami. Sie bekämpfen  verbissen  jene,  die  der  Schönheit  der  Schöpfung entgegenstehen, und bereisen die ganze Welt auf der Suche nach wahrhafter Kampfkunst oder Poesie, um somit Myuriko und ihrer Schönheit noch besser huldigen zu können.
education.moonshaman.descr=In  allen  großen  Häfen  der  Smaragdküste  und  Arakeas  erzählen  aus  Marakatam  kommende  Glücksritter  von  den Mondschamanen der Piriwatu: An der Spitze von Gruppen wilder, tierisch veränderter Krieger fallen sie im Dschungel über Sklavenjäger und plündernde Schatzsucher her, die ihre heiligen Orte schänden. Doch manchmal zieht es einen von ihnen auch in die Welt hinaus, um etwa ein geraubtes heiliges Artefakt zurückzuerlangen.
education.scriptseeker.descr=Um die Bibliothek in Wüstentrutz zu füllen, haben die dortigen Priester die Schriftensucher ins Leben gerufen, einen Orden, der sich dem Sammeln von Wissen verschrieben hat. Die meisten sind Naraka verehrende Tarr, aber andere Lorakier sind ebenso willkommen und wegen ihres eingebrachten Wissens geschätzt. Schriftensucher besorgen Schriftstücke,  indem  sie  andernorts  Bücher  kopieren  oder  aber  ihr eigenes Wissen schriftlich festhalten. Viele ziehen hierzu auf Reisen aus oder schließen sich Expeditionen an, um später das somit erlangte Wissen Naraka zu Ehren in Wüstentrutz zu sammeln.
education.silvershadow.descr=Bei den Priestern der Mondgöttin Luseria denken die meisten Bewohner Dragoreas an zügellose und verschwenderische Feste. Doch in Patalis ist Luseria auch die Göttin der Macht und ihre Priesterschaft ein Teil des ewigen Spiels um Einfluss am Hofe. So ist es kein Wunder, dass die Kirche in Ultia einen Orden unterhält, dessen Priester sich auf das Beschaffen und den Handel mit Geheimnissen spezialisiert haben. Diese Silberschatten treten nicht offen in Erscheinung, doch befinden sie sich immer im Zentrum des Geschehens und sorgen dafür, dass ihr Kult seinen Einfluss behält– und oft werden sie auch in die Ferne geschickt, um Wissen zu erlangen, das der Kirche Luserias nutzen mag. \n\nSiehe auch Regelwerk "Patalis und Elyrea" (S. 108)
education.titanchild_priest.descr=Die Götterwelt der Stromlandinseln wird beherrscht von den fünf elementaren Titanen, den Schöpfergöttern, und ihren vielen himmlischen Dienern und Sendboten. Auch wenn die Titanenkinder sich häufig einem Titanen besonders zugeneigt fühlen, ist ihre Aufgabe, zwischen den widerstreitenden Elementen zu vermitteln und die Welt zum Ausgleich zu bringen und nicht selten ziehen sie dazu in die Ferne, um auch dort für einen Einklang der Elemente zu sorgen, wo die Titanen selbst fern scheinen mögen.
education.vordanshield.descr=Die  Ritter  des  Ordens  der  drei  Rosen  begrenzen  ihren Einfluss  im Wesentlichen  auf  die  Insel  Elyrea,  doch  gibt es auch Priester, die das Wort und den Geist von Vordan dem Gerechten in der Ferne verbreiten. Diese meist schwer gerüsteten Streiter leben in strenger Askese und immer im Dienste der Gerechtigkeit – sehr zur Freude der Landbevölkerung, der sie helfen, wann immer sie können. Aber nicht überall wird ihr Auftreten geschätzt und insbesondere vom lokalen Adel und Klerus als stur und selbstherrlich wahrgenommen. Dennoch wird einen Schild Vordans nichts von seinem Weg abbringen, egal wie widrig die Umstände auch sein mögen.

resource.faith=Die meisten Lorakier glauben an diverse Götter und würden deren Existenz nie anzweifeln, sondern wenden sich diesen meist mit inbrünstiger Verehrung zu. Doch nur wenige Sterbliche stehen tatsächlich so sehr in der Gunst oder im Augenmerk einer Gottheit, dass diese ihnen in kritischen Situationen aus eigenem Antrieb hilft. Dieses spezielle Band zu einem Himmlischen wird über die Ressource Glaube abgebildet.
resource.faith.v1.meaning=Gottheit ist sich der Existenz des Gläubigen vage bewusst
resource.faith.v2.meaning=Gottheit ist sich der Existenz des Gläubigen deutlich bewusst
resource.faith.v3.meaning=Gottheit verfolgt Leben des Gläubigen mit leichter Neugier
resource.faith.v4.meaning=Gottheit verfolgt Leben des Gläubigen mit Interesse
resource.faith.v5.meaning=Gottheit verfolgt Leben des Gläubigen mit Sympathie
resource.faith.v6.meaning=Liebling der Gottheit
