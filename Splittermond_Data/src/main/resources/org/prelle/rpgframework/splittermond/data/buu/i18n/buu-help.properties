material.wurzelwurm_holz.desc=Einige Bewohner der Wandernden Wälder haben gelernt, aus dem lebenden Holz des Wurzelwurms besondere Waffen zu formen, die gegen Wesen der Finsternis oder auch gewisse Feenkreaturen besonders nützlich sind: Stirbt der Wurm nämlich, wird sein ansonsten so flexibler Körper härter als Eichenholz. Manche Zauberkundige schätzen Stäbe oder andere Artefakte, die aus seinem Körper gefertigt werden.
