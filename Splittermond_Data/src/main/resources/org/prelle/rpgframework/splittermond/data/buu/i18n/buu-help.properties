material.roc_federn.desc=Für die Geliebte die Feder eines Rocs zu erbeuten, zählt im Land der Jogodai als höchst ehrenvolle Brautwerbung
material.rosendrache_haut.desc=
material.rubingorilla_fell.desc=
material.sandtiger_leder.desc=
material.schneeleopard_fell.desc=
material.seeschlange_schuppen.desc=Die Farbe der sehr harten Schuppen variiert zwischen unterschiedlichen Grün- und Brauntönen. Dadurch sind die Wesen von der Wasseroberfläche, aber auch unter Wasser, nur schwer auszumachen. Extrem selten kommen Seeschlangen mit grauweißen oder gar schneeweißen Schuppen vor, von denen einige gelegentlich einen perlmuttartigen Schimmer haben und die als besonders wertvoll gelten.
material.simurgh_federn.desc=Die riesigen Vögel mit einer Spannweite von bis zu 20 Metern tragen ein wildes und ausladendes Federkleid in schillernden Farbtönen, die sich von Individuum zu Individuum unterscheiden. Der Kopf ist mit einem Schopf wilder Federn geschmückt, das üppige Schwanzgefieder weht beim Flug wie ein Banner. Die Schwanzfedern eines Simurgh sind ein wertvolles Geschenk: Wer sie in großer Not verbrennt, dem kommt der Simurgh zu Hilfe. Die Berührung eines Simurgh kann nahezu jede Krankheit heilen. Wenigen auserwählten Helden gewähren Simurghe sogar die hohe Gunst auf ihnen zu reiten, doch ist dies ein seltenes Geschenk.
