creaturefeaturetype.amphibic.desc=Das Wesen kann sowohl über als auch unter Wasser ohne Einschränkungen existieren und atmen. Sofern eine zweite Geschwindigkeit angegeben ist, gilt diese für die Schwimmgeschwindigkeit. Es enthält keinerlei Abzüge für Handlungen, die unter Wasser ausgeführt werden
creaturefeaturetype.berserk.desc=Das Wesen kann in einen Berserkerrausch geraten. Sobald der in der Klammer genannte Auslöser eintritt, erhält das Wesen einen Bonus auf seine Angriffe und seinen Schaden in Höhe der Stufe und einen Abzug auf seine Verteidigung in Höhe der doppelten Stufe. Wesen mit dem Merkmal Taktiker erhalten außerdem den Zustand Rasend.
creaturefeaturetype.trap.desc=Das Wesen ist in der Lage, Fallen zu stellen. Die genauen Auswirkungen hängen von der Art der Falle ab. Prinzipiell gilt: Der Entdecken-Wert (siehe Splittermond: Die Regeln, S. 128) beträgt 15 + Stufe, löst ein Wesen die Falle aus, tritt die Wirkung ein.
creaturefeaturetype.immune_fear.desc=Das Wesen ist immun gegen die Zustände Angsterfüllt und Panisch.
creaturefeaturetype.shapeshifter.desc=Das Wesen kann 4 Punkte Fokus kanalisieren, um eine bestimmte Gestalt anzunehmen (Werte wie bei \u201EVerwandlung in Tiergestalt\u201C, siehe Splittermond: Die Regeln, S. 218). Die Verwandlung ist eine kontinuierliche Aktion mit einer Dauer von 12 Ticks.
creaturefeaturetype.infectious.desc=Das Wesen überträgt mit seinem Angriff Krankheiten. Die Zahl in der Klammer gibt den Infektionswurf an (also die Wahrscheinlichkeit, mit der die Krankheit übertragen wird, siehe Splittermond: Die Regeln, S. 177).
creaturefeaturetype.light_sensitive.desc=Das Wesen erleidet bei Lichtstufe 1 (Tageslicht) automatisch den Zustand Geblendet auf Stufe X. Diese Mali werden nicht durch Dämmersicht oder Dunkelsicht beeinflusst.
creaturefeaturetype.portal_opener.desc=Das Wesen ist in der Lage, an Orten, an denen die Grenze zwischen dem Diesseits und der Feenwelt dünn ist, ein Portal in die Feenwelt zu öffnen. Dies ist eine sofortige Aktion von 15 Ticks Dauer, die 1 Punkt Fokus erschöpft.
creaturefeaturetype.weak_spot_attack.desc=Das Wesen greift ausschließlich ungeschützte Körperstellen an. Schadensreduktion (selbst mit dem Rüstungsmerkmal Stabil) wird vollständig ignoriert.
creaturefeaturetype.swarm.desc=Das Wesen kann in (größeren) Gruppen agieren und sich koordinieren, was es wesentlich gefährlicher macht. Finden sich jeweils X Tiere zusammen, erhält der Schwarm eine \u201ESchwarmstufe\u201C (bis zu einem Maximum von Y), überzählige Tiere werden ignoriert.\nDie Wesen kämpfen nicht mehr einzeln, sondern in ihrer Gesamtheit als Schwarm: Jede Schwarmstufe erhöht den Angriff um 2 Punkte, die Verteidigung und den Körperlichen Widerstand gegen positionsverändernde Angriffe um 1 Punkt. Der Geistige Widerstand steigt pauschal um 10 Punkte.
creaturefeaturetype.swarm_presence.desc=Einige Wesen verfügen über besondere Fähigkeiten, wenn sie im Schwarm agieren. Mottenmakis (Schwarmpräsenz (3 / Echter Schaden)) richten beispielsweise echten Schaden an, sobald sie Schwarmstufe 3 erreichen.
creaturefeaturetype.diver.desc=Das Wesen kann längere Zeit unter Wasser bleiben, benötigt aber Luft zum Atmen (die genaue Länge kann zwischen wenige Minuten und mehrere Stunden betragen; die letztendliche Entscheidung hierzu liegt beim Spielleiter). Die zweite Geschwindigkeitsangabe bezieht sich auf die Schwimmgeschwindigkeit. Wesen mit diesem Merkmal erhalten keinerlei Abzüge für Handlungen, die unter Wasser ausgeführt werden.
creaturefeaturetype.teleport.desc=Das Wesen kann als sofortige Aktion 1 Punkt Fokus erschöpfen, um sich ohne Zeitverlust bis zu X Meter fortzubewegen.
creaturefeaturetype.uncontrollable.desc=Es ist außerordentlich schwierig, das Wesen unter Kontrolle zu zwingen. Der Geistige Widerstand des Wesens gegen Zauber des Typus Kontrolle ist um den fünffachen (Einzel-)Monstergrad erhöht (+30 bei Monstergrad 4+).
creaturefeaturetype.invisible.desc=Das Wesen ist unsichtbar und kann auf natürliche Weise nicht gesehen werden. Dies wirkt wie der Zauber Unsichtbarkeit (siehe Splittermond: Die Regeln, S. 249). Viele dieser Wesen können 1 Fokuspunkt kanalisieren, um eine sichtbare Gestalt zu manifestieren.
creaturefeaturetype.call_support.desc=Das Wesen ist in der Lage, auf magische oder natürliche Weise Verbündete herbeizurufen. Dies erfordert eine kontinuierliche Aktion mit einer Dauer von 7 Ticks. Daraufhin kommen nach X Ticks Y Wesen der gleichen Art hinzu (oder sofern beim Merkmal angegeben: einer anderen Art).

#Materialbeschreibungen

material.ankuumakrabbe_panzer.desc= Der orangerote, meist mit Seepocken und anderen Parasiten übersäte Panzer, kann ausgewachsen die Größe eines kleinen Hauses erreichen.
material.baumdrache_haut_und_membran.desc=
material.baumskorpion_panzer.desc=Seiner harten Panzerung verdankt der Baumskorpion seinen Namen. Wie die Rinde eines Baums ist sie borkig und lässt sich auch in der Farbe nur schwer von der Rinde manch eines Urwaldriesen unterscheiden. In den Vertiefungen seiner Panzerung sammeln sich Schlamm und Erde an, was dazu führt, dass auf dem Skorpion Moose, kleine Farne und gelegentlich sogar Orchideen wachsen können. Neben Pflanzen bietet der Panzer auch verschiedenen Insekten, wie Raupen und Käfern, eine Heimstatt. Dies wiederum zieht Vögel an, die sich von diesen Insekten ernähren und den Panzer des Skorpions von diesen ungebetenen Gästen reinigen.
material.bergdrache_haut.desc=
material.cewri_haar.desc=Der Leib der Cewri ist meist über und über mit zottligen Haaren bedeckt, die durchsetzt sind von kleinen Ästen, Herbstblättern, Tannenzapfen und vereinzelten Knochen. Magie ist bei den Cewri sehr ausgeprägt. Sie nutzen ihr Haar, um Brücken und Leitern zu weben, unüberwindbare Barrieren zu errichten oder auf zauberhafte Weise ihre Wohnhütten wie Nester an Felswänden zu befestigen. Ebenso dienen sie manchen Wesen als zusätzliche Gliedmaßen.
