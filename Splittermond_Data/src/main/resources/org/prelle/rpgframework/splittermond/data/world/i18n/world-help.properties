culture.afali.desc=Die damalige Königin Termarks, sandte ihre erstgeborene Tochter Afalia zum Orakel von Ioria, um Rat im Konflikt mit Zwingard zu ersuchen. Doch die empfangene Weissagung entpuppte sich als folgenschwere Überraschung. Die Prinzessin wurde von ihrer Mutter daraufhin nicht etwa als Heldin empfangen, sondern des Hochverrats angeklagt \u2013 ein beispielloses Vorgehen, das Termark in einen Bürgerkrieg stürzte. Es kursierte rasch das unheilvolle Gerücht, dass Afalia eine Prophezeiung empfangen habe, nach der die Götter die Prinzessin vor nichts Geringerem als der \u201EVerheerung der Reiche jenseits der See durch ein Unheil zu Lande und zu Luft\u201C gewarnt hätten. Nur derjenige sollte Rettung finden, der \u201Esein Schicksal dem Meer anvertraue\u201C, bis ein (bis heute nur Afalia und ihren Vertrauten bekanntes) Geheimnis gefunden sei, das \u201ESchlüssel und verschlossen\u201C ist.
culture.aitushar.desc=Als \u201ETor des Südens\u201C ist Aitushar durch den Karawanenhandel zu großem Reichtum gekommen. Prunkvolle Städte, rauschende Feste, prächtig gewandete Handelsfürsten: Hier zeigt man, was man hat \u2013 oder auch nicht hat \u2013, und gibt das Gold mit beiden Händen aus. Nirgends sonst finden sich so große Basare mit einer derartigen Vielzahl an Waren, Schaustellern, Gaumenfreuden.
culture.anuu.desc=Dieses Gnomenvolk lebt in kleinen Stammesverbänden auf Baumhäusern im Landesinneren. Ursprünglich waren die Anuu Jäger und Sammler, und viele Stämme pflegen auch heute noch ihre alten Lebensformen. Andere haben durch den Kontakt mit den Korsaren \u201EErrungenschaften der Zivilisation\u201C wie Ackerbau und Sklavenhandel übernommen.
culture.arkuri.desc=Arkuri liegt an den Ufern der Ulja, doch ihr Einfluss reicht über die Stadtgrenzen hinaus in die Wildnis. In vielen Kilometern Umkreis befinden sich Bauernhöfe, Steinbrüche und Holzfällerlager und nach Meinung der Stadtbewohner gehört das alles zu Arkuri.
culture.badashan.desc=Badashan liegt im Dschungel, der nördlich an das Auge von Telwari grenzt. Einst war es ein eigenständiges Reich, das von einem Moghul regiert wurde, bis dieser sich vor etwa 300 Jahren dem Padishah Xarxuris dem Großen unterwerfen musste.Seitdem werden Tribute nach Norden abgeführt, während das Land selbst viele farukanische Siedler aufgenommen hat. Badashan ist ein reiches und wildes Land, das in ganz Farukan für seine ungezähmte Natur und alten Relikte bekannt ist.
culture.borombri.desc=Die Borombri von Korobrom bewohnen einen Archipel vor der südlichen Küste Dalmariens. Die Inseln sind jung und waren noch zur Drachlingszeit mit dem Festland verbunden. Das heute bestehende Labyrinth aus zerklüfteten Felsen ist ohne Lotsen kaum zu befahren und sorgt für die Sicherheit der Bewohner. Die mehreren hundert Inseln sind unterschiedliche groß: Die kleinsten \u2013 Felsspitzen, die bei Ebbe aus dem Wasser auftauchen \u2013 sind ungenutzt, aber aus jedem größeren festen Halt haben die Zwerge über die Jahrhunderte einen Teil ihrer Heimat geschaffen.
culture.chorrash.desc=Der Chorrash ist seit etwa 300 Jahren Teil Farukans, seit sich die hier ansässigen kriegerischen Reiterclans durch Eide an den großen farukanischen Eroberer Padishah Xarxuris den Großen banden. Die Chorrashiten idealisieren das Nomadentum als Ausdruck von Freiheit, auch wenn viele von ihnen längst mehr oder weniger sesshaft geworden sind. Als Steppenreiter sichern sie ihre Grenzen nach Jagodien und Ashurmazaan \u2013 und manchmal verletzen sie sie auch, indem einige von ihnen ihre Nachbarn \u201Awie in den guten alten Zeiten\u2018 als Viehdiebe und Räuber überfallen.
culture.dakardsmyr.desc=Dies ist das Reich der Sumpfgnome, denn kaum ein anderes humanoides Lebewesen kann die giftigen Ausdünstungen längere Zeit unbeschadet ertragen. Dennoch gibt es immer wieder Prospektoren, die auf eigene Faust oder im Auftrag des Kaisers ertragreiche Mineralquellen oder versunkenes Mondgestein suchen. Insgesamt sind sie jedoch gegenüber den Gnomen in der deutlichen Minderheit. Sumpfgnome unterscheiden sich von ihren Vettern durch die bleiche Haut, die Ansätze von Schwimmhäuten zwischen Fingern und Zehen, Nickhäuten über den Augen und ihre Ausdauer beim Luftanhalten und Tauchen.
culture.dalmreich.desc=Das Dalmarische Reich liegt auf einer Halbinsel zwischen der Kristallsee und dem Riesengrab. Nach Westen hin wird es vom Finsterwall begrenzt, der sich bereits in der Obhut des Wächterbundes befindet. Hier schließen sich die Meraberge an, wo reichhaltige Edelsteinvorkommen liegen.Die meisten Dalmarier sind Bauern. Durch den natürlichen Reichtum des Landes haben sie selbst bei Missernten keinen Hunger zu befürchten. Die Überschüsse ermöglichen eine gut funktionierende Vorratshaltung, die nicht nur Adel, Klerus und Städter, sondern tatsächlich auch die einfachen Leute betreiben. Viele Klöster, Stiftungen des Adels an die Schutzgottheit ihrer Familie, stellen Horte der Bildung dar. Hierbei pflegen sich die verschiedenen Kulte zu respektieren, obgleich der Thronfolgestreit teils auch auf den Klerus übergreift.
culture.demerai.desc=Demerai ist ein Reich der Gegensätze. Das gilt für das Land selbst, das an den Ufern des Pardash vor Leben strotzt, zur Flammensenke hin jedoch stetig karger wird; und es gilt auch für seine Bewohner, die ihr Dasein entweder in bitterer Armut fristen oder aber in selbstgerechtem Reichtum schwelgen. Die Ehre, das höchste Ideal Farukans, ist hier allzu oft ein bloßes Trugbild, hinter dem Korruption, Intrige und Verrat herrschen. Wer sich auf diese zweifelhaften Künste versteht, kann in Demerai schnell zu Rang und Namen kommen \u2013 doch der Unbedarfte oder allzu Selbstsichere fällt ebenso rasch.
culture.elyrrose.desc=Die frommen Herren der Insel haben ihr Pantheon aus Patalis mitgebracht. Vordan der Gerechte besitzt eine deutlich hervorgehobene Stellung. Es werden aber auch alle im Nachbarreich verehrten Götter gewürdigt. Lediglich die Mondgöttin erhält kaum Aufmerksamkeit. Der Orden fordert ein fleißiges, frommes Leben und missbilligt verschwenderischen Prunk. Dafür bietet er den Bewohnern seinen Schutz und Rechtsprechung für jedermann. Schon bevor die Ritter die Herrschaft auf der Insel übernahmen, war Elyrea ein beliebter Pilgerort für Anhänger des Vordan. Ein Tempel, der im Westen mit seinen Türmen über die steilen Klippen hinausragt, wurde schon vor langer Zeit errichtet, um an Vordans Sieg über Xertia zu erinnern. Doch plant der Orden nun ein viel beeindruckenderes Werk zu Ehren der Götter: Neben zahlreichen Wehrklöstern, Wachtürmen und kleinen Tempeln, die seit der Ordensherrschaft gebaut wurden, soll bei Beltin eine Kathedrale entstehen, wie sie Dragorea noch nie gesehen hat. Doch ist Elyrea ein armes Reich und es geht nur langsam mit dem Bauwerk voran.
culture.elyrvolk.desc=Die Gnome leben seit ihrer Ankunft aus den Feenwelten auf Elyrea. Doch auch die Menschen siedeln dort seit über tausend Jahren. Beide Gruppen sind sich allerdings lange aus dem Weg gegangen. Von jeher leben die Gnome im Gebirge und die Menschen an der Küste. Mit dem Orden der Drei Rosen kamen jedoch mehr Menschen auf die Insel: Neben den zahlreichen Dörfern gibt es nur zwei Städte auf Elyrea, Teulada im Osten und die Küstenstadt Beltin. Hier befindet sich der Hauptsitz des Ordens. Die Böden sind nicht sehr fruchtbar, was das Leben auf der Insel hart und karg macht. Zudem verlangen die Ritter für den Schutz, den sie bieten, und zur Umsetzung ihrer zahlreichen Bauvorhaben hohe Abgaben. Elyrea hat kaum Handelsgüter zu bieten. In Beltin legen regelmäßig patalische Schiffe an, doch meistens nur, um Proviant und Wasser aufzunehmen. Die Insel verfügt über keine eigenen Handelsschiffe, wohl aber über eine Flotte an Fischerbooten.
culture.farukhur.desc=Das Reich des Padishahs wird vom Volk der Farukanis bewohnt. Zu diesem gehören vor allem Menschen, aber auch eine große Zahl Varge, während Alben und Zwerge eher in der Minderzahl sind. Gnome gibt es unter den Farukanis nur sehr wenige, da die meisten Angehörigen des kleinen Volkes in Farukan sich als Keshabid sehen und einer eigenen Kultur folgen. Die Farukanis sehen sich stolz als Erbe einer uralten Hochkultur. Mit Wohlwollen blicken sie auf den Reichtum ihres Landes, der durch ihrer Hände Arbeit geschaffen und gemehrt wird. Von Fremden wird diese Haltung mitunter als Arroganz aufgefasst, eine Meinung, in der durchaus mehr als nur ein Fünkchen Wahrheit steckt. Denn in der Tat sind sogar die armen Bauern des Schwemmlandes stolz auf die Pracht am Hofe des Padishah und schauen auf die Leibeigenen der in ihren Augen kulturell unterlegenen feudalen Reiche Dragoreas herab \u2013 obwohl sie selbst doch meist kein besseres Leben führen. Das wichtigste Gut eines jeden Farukanis ist seine persönliche Ehre, die nach einem rigiden und seit alter Zeit überlieferten Kodex bemessen wird.
culture.fedirin.desc=Das Traditionsbewusstsein der Fediris ist in Farukan sprichwörtlich \u2013 auch wenn manche Bewohner anderer Shahirate diesen Wesenszug mitunter eher als Halsstarrigkeit bezeichnen würden. Fakt ist, dass die alten Überlieferungen einem Bewohner Fedirins viel bedeuten und er nur selten völlig neue Wege beschreitet. Von großer Wichtigkeit sind daher auch alte Rituale und die Ehrung der Altvorderen. In Fedirin existiert das Konzept der Erbschuld noch deutlich stärker als im restlichen Farukan. Dies führt auch zu einer gewissen Undurchlässigkeit in der Gesellschaft, denn anders als nach dem farukanischen Ideal bestimmen nicht alleine die Taten einer Person über ihre Ehre und ihr Ansehen \u2013 wer aus einer ehrlosen Familie stammt, kann in seinem eigenen Leben seinen Namen kaum von den Verfehlungen seiner Vorfahren reinwaschen. Zwar ist Fedirin aufgrund seiner fruchtbaren Böden ein reiches Land, dennoch konzentriert sich ein großer Teil des Wohlstandes in wenigen Händen. Dies sind die alteingesessenen Großgrundbesitzer sowie die reichsten Händler aus den Städten, die den sogenannten Alten Familien angehören.
culture.feuerlauf.desc=Nur wenige überlebten den Zorn des Götterboten und taumelten durch ihre verbrannte Heimat. Ihre Nachkommen sind die Feuerläufer, ein eher einfaches Volk von vorwiegend menschlichen Nomaden, das die von Vulkanen und heißen Quellen durchzogene Flammensenke durchwandert. Diese dunkelhäutigen und meist in feuerfeste Stoffe vermummten Gestalten sind geradezu furchtsam göttergläubig und besitzen ein herausragendes Gespür für die für Außenstehende unberechenbaren Vulkanausbrüche und Erdbeben ihrer Heimat. In der magischen Beherrschung des Feuers haben sie es zu großer Meisterschaft gebracht, dennoch zeigen die Feuerläufer keine Zeichen mehr der einstigen Hochkultur von Lurogosh. Deren Schätze können manchmal noch unter der Asche oder in tiefen Felsspalten gefunden werden. Viele der alten Städte sind für die Feuerläufer tabu, werden aber immer wieder von Glücksrittern aufgesucht \u2013 auch wenn die alte und sagenhaft reiche Hauptstadt Zakur bis heute nicht gefunden wurde.
culture.frynjord.desc=Die Bergfesten der Frynjord sind tief in den Fels geschlagene Höhlensysteme mit kleinen Zugängen, die manchmal sogar unter Gletschern liegen. Diese werden in Fließrichtung untertunnelt, sodass der Tunnel immer nur in den nachrückenden Eisbereich erweitert werden muss. Die Gletscher liefern zudem einen Großteil des Trinkwassers und schützen die Eingänge, sodass sie jedes Jahr nach der Umsiedlung neu durchtunnelt werden, um an die eigentlichen Felsentore zu gelangen.Die unterirdischen Städte selbst sind stellen- und zeitweise angenehm warm, da sie von Vulkanismus, heißen Quellen und Magie beheizt werden. Bedauerlicherweise ist diese Wärme unstet und die alten Heizungen nicht immer zuverlässig. \u201EErfroren auf dem Nachtlager\u201C ist nach wie vor eine häufige Todesursache. Die Frynjord besitzen riesige Keller, um für den Winter genügend Vorräte einzulagern. Damit es bei der Nahrungsmittelverteilung gerecht zugeht und niemand die Vorräte plündert, bedienen sich die Frynjord diverser Hausgeister. Diese wachen über die Keller, halten Langfinger von den Schatz- und Rüstkammern fern, warten Heizrohre und beschwichtigen sogar Vulkanschlote und drohende Gletscherfronten.
culture.gotmarkut.desc=Gotor ist seit dem Mondfall kein zusammenhängendes Siedlungsgebiet mehr, weder in politischer, noch in ethnischer oder religiöser Hinsicht. Selbst die Bezeichnung \u201EStadtstaaten\u201C ist für alle Herrschaften außer Borgawai und Zuli übertrieben \u2013 die meisten Ortschaften leben von lokaler Landwirtschaft und vielleicht einem besonderen Gut, das den Export lohnt. Grundlage der meisten Siedlungen (und der Macht in Gotor)ist jedoch die Schatzjagd: Wem es gelingt, ein mächtiges Artefakt der Azurnen Riesen (seltener sind Artefakte der Dracurier oder der Nagas) zu bergen und zu enträtseln, kann es entweder so teuer verkaufen, dass er sich dafür Söldner und Sklaven leisten kann, oder er kann es direkt zum Zweck der Machtübernahme einsetzen. Demzufolge sind Putsche an der Tagesordnung, und viele Bewohner haben sich daran gewöhnt, in einem solchen Fall Türen und Fenster zu schließen und aus der Schusslinie zu treten. Diese \u201EArtefaktokratie\u201C führt dazu, dass es immer wieder Berichte von Glücksrittern gibt, die auf einen Schlag reich und mächtig geworden sind, was Jahr um Jahr Scharen von ihnen in den Dschungel lockt.
culture.gulong.desc=Gulong ist die Savanne im Norden der Schlangenlande, in der große Herden wilder Tiere frei streifen und zahme Tiere von Hirten über die weiten Ebenen getrieben werden. Handelskarawanen ziehen beständig durch das Grasland und bringen den sich befehdenden Städten, Festungen und Kleinreichen Wohlstand. Die Gulongis sind ein vor allem aus Menschen, Zwergen und Alben bestehendes Volk von dunkler Hautfarbe und \u2013 für ihre jeweiligen Rassen \u2013 recht hohem Wuchs. Das einfache Volk zieht in Sippenverbänden mit großen Herdenüber die Savanne und schert sich wenig um die Herrschaftsansprüche der vielen lokalen Potentaten. Diese sitzen oft in Festungen an den Karawanenwegen oder in den wenigen Städten, deren Bewohner sich den einfachen Hirten der Savanne gegenüber überlegen fühlen. Während der tiefe Glaube an die Götterschlangen, vor allem an die Weltenschlange Zarusz, auf dem Land noch weit verbreitet ist, erhält er in den Städten meist nur Lippenbekenntnisse ohne echte Inbrunst. Hier gelten Reichtum und Einfluss als die eigentlichen Herrscher der Welt, nach denen man strebt.
culture.immersomm.desc=Der Immersommerwald wird von einem Albenvolk bewohnt, das sich selbst Tarsai nennt. Ihr schlanker Körperbau, das lange, meist helle Haar, die feinen Gesichtszüge und ihre strahlenden Augen geben ihnen eine fast überweltliche Schönheit. Ihr Gemüt ist eher ruhig, ihre Worte mit Bedacht gewählt, sodass sie für andere Völker langsam wirken mögen. Ganz im Gegenteil verfügen sie jedoch über schnelle Reaktionen, sind unermüdliche Jäger, die sich mit Leichtigkeit durch dichte Wälder bewegen, und meisterliche Kämpfer, die mit äußerster Präzision das Schwert führen. Als Kinder des ewigen Sommers wachsen die Alben in einer friedlichen, geschützten Umgebung auf, daher glauben viele, dass sie, bevor sie wirklich als erwachsen gelten, die raue Welt außerhalb ihres Waldes kennenlernen müssen.
culture.jagodien.desc=Die meisten Jagoden sind Menschen, ein gutes Zehntel sind Varge. Die wenigen Gnome sind überwiegend Nachkommen der Fleckengnome, der Keshabid aus Farukan. Einige hartgesottene Zwerge arbeiten als Goldsucher und Prospektoren in den Ausläufern der Schattenwand im Osten. Alben kennt man in Jagodien fast nur als Durchreisende und als Seefahrer, vor allem in Sulasjada im Südwesten, dem kleinen Hafen an der Kristallsee. Obwohl weite Ebenen das Bild des Landes prägen, leben doch gut die Hälfte aller Einwohner im milden Klima der Küsten. Die Jagoden tragen Kappen aus Filz \u2013 lederne oder gar pelzgefütterte Kappen leisten sich nur Sippenführer oder sehr geschickte Jäger. Sowohl Männer als auch Frauen tragen traditionellerweise einen langen Filzmantel mit Knöpfen aus Horn über engen Hosen. Die Ärmel der Mäntel sind so lang, dass sie sich bei Kälte über die Hände schlagen lassen. Dazu gehören die typischen knapp kniehohen Stiefel mit aufwärts gerichteter Spitze.
culture.jagodsklav.desc=Die Jogodai sind ein Volk mit barbarisch anmutenden Sitten. Den vielen nomadisch umherziehenden Sippen von Jägern, Sammlern und Viehhirten stehen die Bewohner von Bergdörfern gegenüber, die sesshaft geworden sind, sich von der Landwirtschaft ernähren und Bergbau und Handwerk betreiben. Als kriegerisches Reitervolk bedrohen die Jogodai vor allem die Grenzbewohner Zhoujiangs, in deren Ländereien sie regelmäßig einfallen, um Sklaven zu erbeuten und Zivilisationsgüter zu rauben. Sie ziehen sich anschließend weit in die Jogai-Steppe zurück, um Vergeltungsschläge ins Leere laufen zu lassen.
culture.jagodstamm.desc=Die Jogodai sind ein Volk mit barbarisch anmutenden Sitten. Den vielen nomadisch umherziehenden Sippen von Jägern, Sammlern und Viehhirten stehen die Bewohner von Bergdörfern gegenüber, die sesshaft geworden sind, sich von der Landwirtschaft ernähren und Bergbau und Handwerk betreiben. Als kriegerisches Reitervolk bedrohen die Jogodai vor allem die Grenzbewohner Zhoujiangs, in deren Ländereien sie regelmäßig einfallen, um Sklaven zu erbeuten und Zivilisationsgüter zu rauben. Sie ziehen sich anschließend weit in die Jogai-Steppe zurück, um Vergeltungsschläge ins Leere laufen zu lassen.
culture.keshubim.desc=Die Keshubim, fleckengnomische Flüchtlinge aus dem eroberten Reich Kesh, betraten erst vor etwa 500 Jahren die Bühne der Schlangenlande. Anders als ihre Vettern gerieten sie nicht in die Sklaverei der verhassten Farukanis, sondern gelangten nach jahrelangen Wanderungen schließlich in den unzugänglichen Dschungel im Nordosten des Auges von Telwari.Ihr Hass auf die Farukanis gab den Keshubim die Kraft, die harten ersten Jahrzehnte zu überstehen \u2013 und auch heute ist dieser Hass kaum kleiner geworden und wird von Generation zu Generation weitergegeben. Das heißt nicht, dass ein Keshu jeden Farukani auf Sicht erschlagen würde, doch wird ihnen jegliche Hinterlist und Untat zugetraut, ebenso wie man ihnen noch heute nachsagt, sie würden am liebsten alle Fleckengnome versklaven. Die Keshubim haben sich an ein Leben im Dämmerlicht der Baumriesen hervorragend angepasst. Sie leben in Wipfeldörfern dutzende Meter über dem Waldboden, bewegen sich wie Schatten durch das Unterholz und nutzen Gifte verschiedener Tiere und Pflanzen, um aus dem Hinterhalt gegen zuzuschlagen \u2013 gleich ob gegen missgünstige Feenwesen, farukanische Strafexpeditionen oder Monster des Waldes.
culture.kungaitan.desc=Kungaiki gelten als bodenständige Praktiker, die kaum Kunst, wissenschaftliche Leistungen oder philosophische Ideen hervorgebracht haben. Dies mag aus der Sicht eines Hofbeamten aus Zhoujiang zutreffen \u2013 der aber verkennt, dass in Kungaitan die Schere zwischen Arm und Reich, Gebildet und Ungebildet oder Mächtig und Machtlos weit weniger stark auseinander klafft als in anderen Ländern. Selbst wenn die Kungaiki wenig eigene Kunst schaffen, sind sie doch in der Lage, Kunstwerke aus anderen Ländern zu kaufen und Ideen in Mechaniken, Rezepte oder Zaubersprüche umzuwandeln. Damit verbunden ist die Gastfreundschaft der Kungaiki: Jeder Fremde kann etwas zum Wohl der Republik beitragen. Einzig gegenüber den Kintarai ist man aus historischen Gründen reserviert. In Kungaitan kann man sehr wohl feiern und weiß auch zu genießen, bewahrt sich aber diese Ausgelassenheit für besondere Momente, während man das tägliche Leben ernsthaft und zielgerichtet verbringt. Ansehen gewinnt, wer Leistungen zeigt: als unerschrockener Seefahrer, geschickte Händlerin, kluger Zauberer oder tapfere Söldnerin.
culture.mahaluu.desc=Die Mahaluu sind ein Menschenvolk mit bronzefarbener bis brauner, kaum behaarter Haut, dunklem Haupthaar und ebenso dunklen, mandelförmigen Augen. Für Kleidung haben sie nur wenig Verwendung, sie beschränken sich meist auf Röcke und bisweilen breite Krägen aus Bast und Blattwerk. Ihre alltäglichen Werkzeuge sind einfachster Natur. Bei bestimmten Ritualen und Tänzen werden aber uralte Plattenpanzer aus magisch gehärtetem und kunstvoll verziertem Muschelkalk und Holz getragen, die für Außenstehende klar als archaisches Rüstzeug zu erkennen, den meisten Insulanern aber nur schöner Schmuck ihrer Vorfahren sind. Ähnlich verzauberte, feuersteingespickte Hartholzschwerter und Steinbeile dienen heute nur noch dazu, Einbäume auszuhöhlen und Bananenstauden zu ernten, dürften aber zu Zeiten der Ahnen eher Gliedmaßen abgetrennt und Knochen zerschlagen haben. Von einer kriegerischen Vergangenheit der Mahaluu sind jedoch nicht mal Geschichten geblieben. Worum sollte man auch streiten, wenn das Leben alles im Überfluss bietet? Fremde, die einen Weg durch die Riffe finden (oder dort Schiffbruch erleiden), werden freundlich willkommen geheißen.
culture.midstad.desc=Der Großteil der Bevölkerung besteht aus Menschen, unter die sich in den größeren Ansiedlungen auch Gnome mischen. Zwerge und Varge findet man vor allem im Süden des Reiches; in sämtlichen Städten der Ostküste sind Alben ein häufiger Anblick. Das städtische Leben ist in einigen wenigen Zentren konzentriert. Hier sind neben der Hauptstadt Harreburg und den beiden Grafenstädten Hellberg und Tralfeim vor allem die wohlhabenden Häfen an der Ostküste zu nennen, die sich durch ihre Handelsbeziehungen mit Mertalia und den Seealben ein gewisses Maß an Unabhängigkeit gesichert haben. Der Großteil der Bevölkerung lebt jedoch auf dem Land, in kleineren Dörfern und Marktflecken. Jene, die gegen die Herrschaft des Königs aufbegehren, fliehen \u2013 wenn sie nicht zuvor am Galgen landen \u2013 in die Wälder und schlagen sich als Gesetzlose durch, die hehre Ideale von Freiheit und Gerechtigkeit hochhalten, diese aber oft auch nur als Rechtfertigung für Raub und Plünderung nutzen.
culture.nyrdfing.desc=Die meisten Bewohner Nyrdfings sind Menschen, weshalb sie in der Führung des Landes überrepräsentiert sind: Der Adel besteht ausschließlich aus Menschen, auch wenn manche dekadenten Adligen sich als Bettgespielen Alben oder gar Varge einzukaufen versuchen. Die meisten Gnome leben im Osten des Landes nahe Dakardsmyr. Vor allem in Catley sind viele Gnome auch dank des dortigen Mondtores nach Termark reich und angesehen. Varge sind Außenseiter: Die meisten leben in wilden Stämmen in den schwarzen Wäldern des zentralen Gebirgszugs Kyngeszinnen und werden von den übrigen Bewohnern Nyrdfings gefürchtet. Obwohl einige Bauern mit den Waldvargen, den Vaigarr, Tauschhandel betreiben, sehen manche Adlige sie sogar als jagdbare Tiere an. Die Ritterschaft Nyrdfings ist extrem traditionsbewusst und sehr streitlustig. Viele adlige Familien sitzen noch auf Stammburgen tief im Binnenland, in deren unmittelbarem Einzugsgebiet nur noch wenige ihrer Untertanen leben. Vor allem der Schwarze Wald im Landesinneren gilt wegen der Feen und der Varge als extrem gefährlich. Bequemere Adelsfamilien haben ihre Stammburgen aufgegeben und leben in modernen Häusern an der Küste.
culture.patalis.desc=Die meisten Patalier sind Menschen, insbesondere auf dem Land sind andere Rassen ein eher ungewohnter Anblick. Bedeutende Metropolen wie Ultia ziehen jedoch viele Künstler, Gelehrte und andere Spezialisten an, sodass hier die Bevölkerung deutlich durchmischter ist, wobei die Zwerge den größten Anteil nach den Menschen halten. Zusätzlich leben noch einige Gnome im Knochensumpf, deren Vorfahren noch vor der Entstehung von Patalis durch Diener der Drachlinge an diesen Ort gebracht wurden. Der überwiegende Teil der Patalier wohnt auf dem Land. Die Bauern genießen nur wenig Freiheiten und Rechte, sind jedoch meistens satt und einigermaßen sicher. Die Oberschicht des Landes legt Wert auf Abgrenzung und hat wenig mit der einfachen Bevölkerung gemein.
culture.piriwatu.desc=Die eigentlichen Herrscher des Dschungels sind die eingeborenen Piriwatu, was so viel wie \u201EDiener der Schlangen(leibigen)\u201C bedeutet. Seit der Auslöschung des piriwarischen Königsgeschlechts in der Pyramidenstadt Pirimoy und dem nachfolgenden Diebstahl des Smaragdthrons durch badashirische Plünderer vor ungefähr 380 Jahren, sind die Stämme hoffnungslos zerstritten. Einige Piriwatu sehen die Eindringlinge als legitime neue Herrscher an, denen sie die Kriegsgefangenen ihrer Stammeskriege nur zu bereitwillig und in großer Zahl als Sklaven verkaufen, andere Stämme betrachten die heutigen Potentaten als fluchwürdige Fremde, die man zurück ins Meer werfen muss. Den wenigsten Fremden ist klar, was passieren würde, sollten sich die Mondschamanen der Piriwatu eines Tages auf einen neuen Großkönig einigen, der dann die Stämme vereint.
culture.porukala.desc=Überall auf dem Schimmermeer kann man den Porukala begegnen, die manchen dragoreischen Seefahrer an die Afali erinnern mögen. Mit diesen haben sie allerdings nur gemein, den größten Teil ihres Lebens auf See zu verbringen. Die Porukala besitzen mitnichten eine gemeinsame Vergangenheit und auch nur wenige gemeinsame Sitten und Gebräuche. Stattdessen handelt es sich bei ihnen um einen Zusammenschluss von Piraten, Freigeistern, Ausgestoßenen und all jenen, die nicht länger unter der Herrschaft Ultias, Kungaitans oder der siprangischen Spiegelprinzessin stehen wollten. Diese Freiheit wird ihnen durch die schützenden Hände des Porukalaos gewährt, einer uralten Meeresgottheit, die jedem eine neue Heimat verspricht, der schwört, ihre Gebote zu bewahren. Das wichtigste Gebot besagt, ein Porukala müsse zu jeder Zeit einen anderen Gläubigen aufnehmen und unterstützen.
culture.puntani.desc=Die bekanntesten Bewohner der Küstengebiete sind die Menschen der Puntani, das in kleinen Stämmen den Küstenstreifen am Auge von Telwari bevölkert. Die Jäger und Sammler leben zwar weitgehend zurückgezogen, begegnen aber den Fremden freundlich, die sich ihrerseits nicht feindselig zeigen. Das Leben mit den Gefahren des Dschungels ließ die Puntani nicht kriegerisch, sondern nur vorsichtig werden. Jeder Versuch fremder Entdecker und Händler, einen langfristigen Kontakt mit einem Stamm zu etablieren, scheiterte bislang an der unsteten Lebensweise der Puntani. Das angestammte Siedlungsgebiet der Puntani liegt auf den Inseln vor der Küste und dem Land zwischen Ufer und Gebirge.
culture.raugarr.desc=Bei den Raugarr handelt es sich um ein Volk der Varge. Als Nomaden ziehen sie im Sommer durch die rauen Steppen des Nordens, die Farrafirr, während sie im Winter meist in den Wandernden Wäldern oder anderen geschützten Plätzen zu finden sind. Vereinzelte Sippen gibt es auch in Gontcharia. Die Raugarr leben sehr abgeschieden und haben gewöhnlich nur wenig Kontakt mit anderen Kulturen. Bei diesen gelten sie daher \u2013 allerdings nicht ganz zu Recht \u2013 als barbarische Wilde. Den Raugarr wird nachgesagt, sie neigten stärker zu Prahlerei und Einschüchterungsgesten als andere Vargenvölker. Sie treten kämpferisch auf und wirken mit ihren plötzlich aufflammenden Wutausbrüchen cholerisch. Doch nicht nur von ihrem Zorn lassen sie sich hinreißen, auch Freude, Lust und Trauer tun die ungestümen Raugarr lauthals kund.
culture.sadu.desc=In den einzelnen Fürstentümern hat oft ein bestimmtes Volk die Oberhand. In Latian sind es Gnome, in Bawalin Zwerge, die Tuntungan durchstreifen menschliche Reiter und in den Transkabilischen Wäldern wohnen aus Kintai geflohene Alben. Daneben existieren noch unzählige weitere Fürstentümer und lokale Herrschaften, denen oftmals nur ein kurzes Dasein beschieden ist. Die Wohlhabenderen leben in den kulturell hochstehenden Städten, während das umliegende Acker- und Weideland meist rückständig und arm ist.Auf der Halbinsel herrschen trotz langer Trennung immer noch Lebensart und Sprache Zhoujiangs vor. Die Rollen von Obrigkeit und Untertan sind auf dem Land klar verteilt, in der Stadt hingegen versucht ein aufkommendes Bürgertum, politisch Einfluss zu nehmen. Die Unterwelt zielt auf materiellen Gewinn. Fremden begegnet man gastfreundlich, wahrt aber stets ein Mindestmaß an Distanz.
culture.schaedel.desc=Die Korsaren setzen sich aus Mitgliedern aller Rassen und Kulturen zusammen, Menschen sind jedoch die größte Gruppe unter ihnen. Die meisten sind Dragoreer oder stammen aus Ländern, die an die Drei Meere angrenzen, aber es finden sich selbst Bewohner Zhoujiangs unter ihnen. Die Piraten leben entlang der Küste der Suderinseln, viele von ihnen in Navir, der größeren von zwei Städten. Die restlichen Siedlungen variieren von einer Handvoll Hütten, die der Besatzung eines Schiffes als Unterkunft dienen, bis hin zu Siedlungen mit mehreren hundert Einwohnern. Die zweitgrößte Stadt, Treibgut, besteht aus Schiffswracks, die in einer Flussmündung auf Lymoszusammengeschnürt und mit Brücken verbunden wurden. Die meisten Handelsgüter, die auf den Suderinseln umgeschlagen werden, wurden von den Korsaren auf ihren Raubzügen erbeutet, weswegen das Angebot auch häufig wechselt. Manch ein skrupelloser Händler kauft nur zu gerne die Beute der Korsaren auf, um sie mit hohem Gewinn in der Heimat weiter zu veräußern. Verbote auf Handelswaren gibt es nicht, sodass auch Sklaven, Gifte und Drogen erstanden werden können. Die Schädelkorsaren sind wenig religiös.
culture.schaschbar.desc=In den Hügeln von Borgawai haben sich die Schaschbar festgesetzt, Nachkommen der ursprünglich aus dem Tiefdunkel \u2013 so heißt es zumindest \u2013 zugewanderten zwergischen Prospektoren. Diese etwa 2.500 schwarzhäutigen Zwerge haben ihre Unabhängigkeit bewahrt und schürfen hier nach Edelsteinen und -metallen. Ihre Häuser liegen größtenteils oberirdisch, sind aber \u2013 selten in Gotor \u2013 durchgehend aus Stein errichtet.
culture.schwertadel.desc=Das prägende Bild auf den Straßen, Feldern und in den Siedlungen sind sicherlich die Schwertalben. Auch wenn die Kintarai nicht in der Überzahl gegenüber den anderen Rassen sind, erkennt man doch oft auf Anhieb, dass sie die Herrscher dieses Landes sind. Selbst wenn ein Hafen vargisch geprägt ist oder man schon an den Türen von Tavernen oder Werkstätten sieht, dass hier vor allem Zwerge und Gnome leben, kann man sicher sein, dass der Besitzer, der Büttel des Viertels oder zumindest der Herr der nächsten kleinen Stadt dem \u201ESchönen Volk\u201C angehört. Die wenigen Nichtalben, die es in den Adelsstand geschafft haben, verdanken dies oft einem besonderen Förderer aus den großen Clans. Die Kintarai blicken allerdings nicht abschätziger auf andere Rassen herab als auf beliebige Ausländer \u2013 sie wissen, dass genau sie vom Himmlischen Kranich erwählt wurden und die Lieblinge der wahren Göttin sind. Eine Wintholterin ist eben keine Kintarai, unabhängig davon ob sie Mensch, Alb oder Gnom ist. Die Kintarai sind ein reiches Volk und zeigen das auch nach außen.
culture.schwertvolk.desc=Das prägende Bild auf den Straßen, Feldern und in den Siedlungen sind sicherlich die Schwertalben. Auch wenn die Kintarai nicht in der Überzahl gegenüber den anderen Rassen sind, erkennt man doch oft auf Anhieb, dass sie die Herrscher dieses Landes sind. Selbst wenn ein Hafen vargisch geprägt ist oder man schon an den Türen von Tavernen oder Werkstätten sieht, dass hier vor allem Zwerge und Gnome leben, kann man sicher sein, dass der Besitzer, der Büttel des Viertels oder zumindest der Herr der nächsten kleinen Stadt dem \u201ESchönen Volk\u201C angehört. Die wenigen Nichtalben, die es in den Adelsstand geschafft haben, verdanken dies oft einem besonderen Förderer aus den großen Clans. Die Kintarai blicken allerdings nicht abschätziger auf andere Rassen herab als auf beliebige Ausländer \u2013 sie wissen, dass genau sie vom Himmlischen Kranich erwählt wurden und die Lieblinge der wahren Göttin sind. Eine Wintholterin ist eben keine Kintarai, unabhängig davon ob sie Mensch, Alb oder Gnom ist. Die Kintarai sind ein reiches Volk und zeigen das auch nach außen.
culture.shahandir.desc=Die Shahandris sind bislang nur auf dem Papier eine eigene Gemeinschaft. Tatsächlich setzt sich die Bevölkerung aus den Nachkommen der unterworfenen Dalmarier, der Soldaten und Trossleute aus allen farukanischen Shahiraten, wüstenvargischen Söldnern sowie späteren Einwanderern und Glücksrittern zusammen. Entsprechend bunt ist das Treiben in den besetzten Städten, wo badashanische Wickelkleider neben dalmarischen Wämsern und aitusharische Turbane neben dragoreischen Gugeln getragen werden. Gemeinsame oder ganz neue Traditionen bilden sich nur zögerlich heraus \u2013 vielmehr pflegen die einzelnen Teile der Bevölkerung ihre jeweils eigenen Überlieferungen. Zwerge aus Korobrom sind als Minenbetreiber, Handwerker, Händler und Söldner ein vertrauter Anlick. Im Krieg haben sie beide Seiten unterstützt, was heute noch für allerlei Animositäten sorgt. Shahir Paschnadur ist entschlossen, zwischen allen seinen Untertanen Brücken zu bauen. Er gab seinen eigenen Kindern dalmarische Namen, verlieh Dalmariern Land und Titel und förderte Mischehen durch großzügige Hochzeitsgeschenke.
culture.stromsiprangu.desc=Die größte Metropole der Smaragdküste umgibt das Portal des Wahnsinns, das auf einer kleinen Insel inmitten der Meerenge zwischen den Paluas thront. Über den versunkenen Drachlingsruinen entstand ein schwimmender Umschlagplatz für jeden, der auch nur ein vages Interesse an Handel hat. Aus vielen verbundenen Flößen, Hausbooten, Brücken und den teilweise wieder errichteten Resten der alten Stadt bildete sich ein oft viele Stockwerke in die Höhe gebautes Labyrinth aus Straßen, Werkstätten, Marktplätzen und Wohnungen, das seinesgleichen sucht. Wer es sich aber leisten kann, lebt in den Palastvierteln am Ufer der beiden Inseln, zwischen denen ein reger Fährverkehr pulsiert. Ganz Siprangu wirkt auf den ersten Blick freundlich und farbenfroh. Abgesehen von den wenigen betrügerischen Händlern mag das auch für den Fernhafen im Westen der Metropole gelten. Je tiefer man allerdings vordringt, umso dunkler und enger werden die Gassen. Von so manchem Straßenzug heißt es, jeder, der dort ins Wasser falle, werde ein Opfer der lauernden Haigeister.
culture.strominseln.desc=Auf den Stromlandinseln lebt ein buntes Völkergemisch: Neben den ursprünglichen Insulanern haben sich hier ebenso Portalreisende von den Küsten der Kristallsee oder patalische Seefahrer niedergelassen wie auch Flüchtlinge aus Zhoujiang oder Händlerfamilien der Kungaiki. Immer wieder trifft man auf das imposante Volk der Matua und selbst vereinzelte Nagas werden auf den Wasserwegen Siprangus gesichtet. Es gibt zwei grundlegend verschiedene Arten des Lebenswandels auf den Stromlandinseln. In den wenigen Städten herrscht reges Treiben und alle Spielarten des Lebens lassen sich erfahren. Die kultivierte Zurückhaltung der Mönche der Titanen trifft hier auf die tiefsten Abgründe der Dekadenz reicher Händler und den verzweifelten Kampf einfacher Schauerleute gegen die Schuldsklaverei. Außerhalb der Städte bestimmt vor allem gemächliche Tüchtigkeit das Leben. Sich selbst ein Überleben zu sichern, fällt auf diesen lebensfreundlichen Inseln nicht schwer, und wer fleißig arbeitet, ist in jedem der vielen Dörfer willkommen.
culture.teleshai.desc=Die Teleshai sind ein fahrendes Albenvolk, das in bunten, von Pferden gezogenen Wagen von Ort zu Ort zieht. Sie pendeln auf einige Hundert Kilometer langen Routen vornehmlich über kleine Dörfer. Dort verdingen sie sich als Musiker, Tänzer, Erntehelfer oder einfache Arbeiter. Ihre Pferde sind riesige zottelige Ungetüme, ihre Kleidung ist voller Flicken, ihre Sprache eine Mischung verschiedenster albischer Dialekte. Obwohl zum größten Teil Alben, haben sie auch einige Nicht-Alben in ihre Reihen aufgenommen. Die Sagen der Teleshai erzählen, dass sie aus einem großen Reich unter der Herrschaft von geflügelten Götterboten stammen, die allem auf der Welt einen Namen und einen festen Platz gegeben haben. Die Götterboten seien von den Mondschändern ermordet worden, die die Tore errichtet hätten. Die Teleshai meiden Mondtore und haben eine abergläubische Furcht vor den gewaltigen Bauwerken. Sie sind ansonsten ein friedliches Volk, das bei Schwierigkeiten eher nachgibt und flieht. Allerdings halten viele sesshafte Bewohner Dragoreas sie für Beutelschneider und Hühnerdiebe.
culture.termark.desc=Die Bewohner Termarks stammen von Siedlern aus Zwingard und Mertalien ab. Heutzutage haben sich die beiden Volksgruppen stark durchmischt. Die Alben, die einst mit den Mertaliern ins Land kamen und sich im Osten ansiedelten, flohen über das Meer, als die Orks kamen. Angehörigen dieses Volkes schlägt bis heute ein starkes Misstrauen entgegen, da man ihnen vorwirft, das Land in der Not im Stich gelassen zu haben.Der Alltag wird vom Kampf um das Überleben bestimmt. Was man andernorts Luxus nennt, kennt man hier nicht \u2013 in Termark versteht man darunter eine volle Schüssel, eine feste Mauer und ein gutes Schwert. Nach langen Jahren der Verzweiflung beginnt mittlerweile in den Bergen jedoch langsam wieder der Erzabbau, und mit ihm könnte der Handel über die Küstenstädte wieder aufgenommen werden \u2013 ein schwacher Lichtblick, aber einer, von dem sich viele Termarker eine bessere Zukunft versprechen.
culture.tirdurghachan.desc=Das Menschenvolk, das diesem Landstrich seinen Namen gab, sind die Durghach: sehnige Hochländer mit eher dunkler Haut und oft lockigen Haaren. Neben ihnen sind nur einige nomadische Varge, eine Handvoll Gnome und Zuwanderer aus Nyrdfing heimisch geworden, wobei letztere größtenteils in den Durghach aufgegangen sind und im Süden des Landes auch hellere Haut- und Haarfarben eingebracht haben. Die Durghach tragen robuste Kleidung aus Leder und Wolle, wobei Männer wie Frauen Beinlinge und Röcke gleichermaßen nutzen. Tätowierungen und weiße Hautmalereien zeigen die Clanzugehörigkeit an und versprechen Schutz vor Zaubern. Schutz sollen neben weißer Farbe auch bestimmte Hölzer (wie Weißdorn), Metalle (insbesondere das Erz des gesplitterten Mondes) und Halbedelsteine (Nebelstein und Hämatit) bieten, während man roter Farbe nachsagt, Feen anzulocken. Die Durghach führen ein Leben als Hirten, Jäger, Fischer, Krieger und Handwerker, das beschaulicher sein könnte, wären nicht die Grenzen zur Feenwelt hierzulande so durchlässig.
culture.turubar.desc=In den meist eher kleinen Siedlungen Turubars leben überwiegend Menschen. Die turubarischen Varge stehen oft im Dienst des Edelsteinordens, während einige Zwerge sich im Minenbau verdingen. Aufgrund der Geschichte des Landes gibt es kaum Gnome und auch Alben trifft man nur selten. Die meisten Turubaris auf dem Land sind Bergbauern, in den Städten ist man vor allem im Edelsteingeschäft tätig \u2013 sei es als Händler, Steinschneider oder Juwelier. Die Turubaris sind stolz auf ihre Heimat. Die Edelsteinvorkommen des Landes sind unermesslich wertvoll \u2013 noch kostbarer aber gilt dem Volk die Führung des Lamassu. Turubaris neigen nicht zum Prahlen, im Stillen jedoch halten sie ihr Land aber doch für etwas ganz Besonderes.
culture.utarti.desc=Wirklich reich und mächtig kann man in Gotor als Händler oder als Spezialist für die Artefaktanalyse werden. Abseits der Schatzsucherstädte leben in den Dschungeln viele Stämme von 200 bis 2.000 Personen, die sich dem Leben im Urwald angepasst haben. Alle diese Stämme sind jedoch zugewandert oder Neugründungen erfolgloser Artefaktjäger. Die Stämme \u2013 der größte sind die Utarti unter Königin Sanjarit \u2013 versuchen, sich aus den Auseinandersetzungen der Städte herauszuhalten, gehen aber hin und wieder Bündnisse mit diesen oder untereinander ein. Diese Gemengelage zu durchschauen, ist für einen Außenstehenden fast unmöglich. Auch die Piriwatu aus Marakatam (siehe Seite 157) unternehmen gelegentlich Kriegs züge nach Gotor, wenn sich wieder einmal Artefakträuber südlich des Flusses an heiligen Gegenständen vergriffen haben.
culture.vaigarr.desc=Die Vaigarr sind das körperlich größte und zahlenmäßig kleinste der Vargenvölker, und fast alle von ihnen leben in dieser Region. Sie erreichen Körpergrößen von über 2,30 Meter und haben entweder dunkelbraunes oder schwarzes Fell, selten einmal rötliche oder graue Zeichnungen auf der Brust. Weißfellige Kinder werden sehr selten geboren und dann meist sofort ausgesetzt. Vaigarr leben in Rudeln von 10 bis 50 Köpfen halbnomadisch in den dichten Wäldern, das heißt, sie legen ihre Siedlungen meist nur für ein bis zwei Jahre an und ziehen weiter, wenn der Wildbestand ihres Jagdgebiets gesunken ist und ihre Hügelbeete im Wald ausgelaugt sind.
culture.westergrom.desc=Westergrom ist eine gemischte Kultur, in der Zwerge, Menschen und andere Rassen nebeneinander leben. Die Zwerge vom Volk der Furgand (der/die Furgand, furgandisch) sind die ältesten Bewohner der Region, die anderen Rassen erst in späterer Zeit in nennenswerter Zahl dazugekommen. Die Zwerge leben vornehmlich in den Bergfesten, während Menschen und andere Rassen meist in den landwirtschaftlich genutzten Gebieten und an der Küste wohnen. Es gibt noch einige weitere Siedlungen der Furgand in den Gebirgen West-Dragoreas, die aber nicht Mitglieder des Bundes der Bergfesten sind, und zu denen auch nur wenig Kontakt besteht.
culture.wintholt.desc=Wintholt ist spärlich besiedelt, und die Wintholter sind es gewohnt, für sich selbst zu sorgen. Siedlungen sind klein und weit verstreut, gerade im Norden sind es oftmals nur befestigte Wehrhöfe, in denen sich zwei oder drei Familien zusammengeschlossen haben. Seit Generationen leben hier Alben und Menschen in enger Freundschaft. Nur an wenigen Orten in Lorakis finden sich mehr Verbindungen zwischen diesen beiden Rassen, und die Menschen Wintholts haben die albische Kultur ebenso angenommen wie umgekehrt. Die Beziehung der Menschen zu den Vargen hingegen ist zwiegespalten: Manche Varge haben sich in Wintholt niedergelassen und integriert, immer wieder aber kommt es im Norden zu Konflikten mit den Raugarr.
culture.zhoujiang.desc=Auch wenn Menschen den Großteil der Bevölkerung stellen, sind die anderen Rassen so zahlreich vertreten, dass es keine größere Aufmerksamkeit erregt, wenn man eines Vertreters ihrer Art ansichtig wird. Anders verhält es sich mit Reisenden aus anderen Kulturen, die man allenfalls in den großen Städten kennt. Die Leute entlang der Flüsse Zhoujiangs leben in großen Städten, während das Hinterland von Dorf- oder Klostergemeinschaften geprägt ist. Hier gibt es nur vereinzelt große Städte wie Hilaga oder Sentatau. Von West nach Ost gibt es kulturelle Unterschiede. Zwar trägt man fast überall den klassischen Hanfu, eine Seidenrobe, doch kommt im Osten des Landes langsam die Mode auf, seine Kleidung mit fremdländischen \u2013 dragoreischen \u2013 Verzierungen zu versehen oder sich in Arwinger Blau zu zeigen, um Weltoffenheit zu demonstrieren.

