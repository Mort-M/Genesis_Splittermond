education.seawarrior.descr=Die Meere sind voller Feinde, seien es Seeräuber, Monster der Tiefe oder missgünstige Feenwesen. Grund genug für Schiffsmannschaften, sich mit tapferen Frauen und Männern zu schützen, die nicht nur mit einer Waffe umgehen können, sondern auch die Gefahren von Wind und Wellen kennen. Diese Seekrieger verteidigen das Schiff nicht nur in Notlagen, sondern können auch als Enterkommando dienen, im Hafen als Wachen fungieren und in ruhigen Zeiten den Matrosen unter die Arme greifen. Aber auch die auf allen lorakischen Meeren ihr Unwesen treibenden Piraten sind im weitesten Sinne Seekrieger. Ob sie nun mit Dschunken in der Jadesee unterwegs sind, mit wendigen Kriegsgaleeren die Kristallsee heimsuchen oder sich mit Langbooten durch die eisigen Wellen des Firnmeers kämpfen, sie alle finden auch dank ihrer Waffenfertigkeiten auf der See ihr Auskommen. Diese Schurken der Meere lauern Handelsschiffen auf oder überfallen kleinere Siedlungen in Küstennähe. Manchmal schließen sie sich auch zu größeren Flotten zusammen, um eine Stadt zu plündern oder einen gut bewachten Schiffsverbund anzugreifen. Doch halten diese Allianzen selten lange, zu verschieden, zu freiheitsliebend und vor allem zu gierig sind die Beteiligten. Wenige Piraten machen ihre ersten Erfahrungen auf See als solche, sondern segeln zuerst auf einem Handels- oder einem Kriegsschiff. Eine Meuterei gegen einen tyrannischen Kapitän, die Gier nach sagenhafter Beute oder auch nur die Gelegenheit, nach einem verlorenen Kampf gegen Piraten die Seiten zu wechseln, sind dann häufige Wege zu dieser Lebensweise.
education.bootydriver.descr=Für Angst und Schrecken unter den Seefahrern im Norden sorgen ide Beutefahrer der Frynjord. Die wilden Zwerge aus den Frostlanden nutzen ihre robusten Schiffe nicht nur für den Walfang, sondern überfallen auch gerne Schiffe auf dem Weg nach Arkuri. Besonders gefürchtet sind auch ihre Beutefahrten, bei denen sie Siedlungen an der Küsten überfallen, manchmal aber auch flussaufwärts tief in Binnenland eindringen, um an reichere Beute zu kommen.
education.skullcorsair.descr=Der Ruf der Schädelkorsaren eilt ihnen in ganz Lorakis voraus. Kauffahrer versuchen soweit möglich ihre Heimatgewässer zu meiden, doch nirgendwo in den südlichen Meeren ist man wirklich vor den furchtlosen und wagemutigen Piraten der Suderinseln sicher. Von der Kristallsee bis ins Schimmermeer verfolgen sie hartnäckig ihre Ziele. Sie kehren nie einem Kampf den Rücken und setzen immer alles auf eine Karte. 
education.wokou.descr=Mit einem mystischen Ansatz betreiben die Wokou ihr Handwerk. Sie stammen aus den verschiedenen Ländern an den Ufern der südlichen Jadesee und sind bekannt dafür, sowohl bei Piraten als auch zum Schutz von Handelsfahren anzuheuern Sie führen viele seltsam anmutende Rituale durch, verehren eine wilde Mischung von verschiedenen Gottheiten - und opfern auch mitunter Gefangene zu deren Ehren.