education.deskriptari.descr=In Aurigion finden sich immer wieder gewiefte Deskriptari, die heimlich detaillierte Pläne der reichen Bankhäuser erstellen und deren Siegel und Urkunden fälschen. Manche von ihnen sind selbst wagemutige Einbrecher und nutzen ihre eigenen Pläne und Fälschungen, während andere sie verkaufen und sich niemals selbst die Hände schmutzig machen. Doch die Güldene Garde ist wachsam und schon manch ein Deskriptari musste überstürzt Aurigion verlassen, um sein Leben zu retten.
education.pertopriest.descr=Die Priester der gondalischen Stadtgottheit Perto weihen ihr ganzes Leben dem Glück und dem Wagnis. Mit einem Paar Perto geweihten Würfeln ziehen sie durch die Welt, wählen dabei immer die gefährlichsten Reiserouten und bestreiten riskant mit Glücksspiel ihren Lebensunterhalt. Auf diesem Weg wollen sie Perto nahe sein, doch sie kennen auch ihre eigenen Grenzen und schließen sich daher oft größeren Reisegruppen an, die ihre Sehnsucht nach Abenteuern und Wagnissen teilen.
education.duspavati.descr=Im Auftrag des Ordens von Nuum jagen und bannen die Duspavati Geister, damit die Nekromanten der Stadt ungestört ihrer Arbeit nachgehen können. Entsprechend weitreichend sind die Befugnisse der Duspavati und wer nicht Mitglied des Ordens ist, hat von ihnen keine Zurückhaltung zu erwarten: Gegenstände und Häuser, an die Geister gebunden sind, werden sofort zerstört und bei einer Geisteraustreibung ist das körperliche und geistige Wohl eines Besessenen zweitrangig. Um die Duspavati auf diese Taten vorzubereiten, werden sie vom Orden von Kindesbeinen an streng ausgebildet, aber dennoch sind nicht alle dem Grauen ihrer Arbeit auf Dauer gewachsen.
education.ashtray.descr=Die Ascheträger aus Eisenbrann sind Priester des Totengottes Gunwar, welche die Asche eines Verstorbenen noch einmal an die wichtigsten Orte seines Lebens bringen. Diese auch in Selenia bekannte Tradition ist vor allem unter Eisenbranner Söldnern weit verbreitet und so müssen die Ascheträger oft um die halbe Welt zu Orten großer Schlachten reisen, an denen Eisenbranner nicht immer gerne gesehen sind. Manche von ihnen sind Teil einer Söldnerkompanie und führen dutzende Urnen früherer Kameraden mit sich. Doch nicht alle Eisenbranner können diesen Dienst bezahlen, und so sind manche Ascheträger gegen kleine Spenden auch allein unterwegs und tragen Prisen der Asche zahlreicher Verstorbener in die Ferne.
