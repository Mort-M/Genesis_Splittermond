education.ghostdancer.descr=Geistertänzer nutzen die Geister der Wüste, vornehmlich jene des Felsens und des Feuers, um Materie aus dem Nichts zu erschaffen. Sie gelten als begabte Elementaristen, die sich mehr auf ihre Magie als ihre natürliche Körperkraft verlassen, und sind in ganz Pash Anar für ihre Beschwörungstänze berühmt. Das Spiel mit den elementaren Geistern macht sie einerseits zu begabten Streitern, doch nutzen sie ihre Fähigkeiten auch gerne für spektakuläre Schauspiele am abendlichen Feuer. Viele Geistertänzer verlassen im Laufe ihres Lebens die große Wüste, um in fremden Ländern mehr über die Macht anderer Elemente zu lernen.
education.ghostchanger.descr=Die Geistwandler der Tarr beherrschen meisterlich den Umgang mit den Geistern der Tiere. Sie beeinflussen nicht nur lebende Tiere, sondern verstehen sich auch darauf, die Geister verstorbener Tiere herbeizurufen und in sich zu binden. Danach wandeln sie ihren Körper entsprechend ihres geistigen Inneren, manchmal nur in Teilen, manchmal auch vollständig. Die häufigsten Geistwandler sind die Büffel- und Kamelflüsterer der Hirtenrudel, deren mächtigere Vertreter sich selbst in eines der Tiere wandeln, die sie behüten. So führen sie die Herde gerne als Leittier durch gefährliche Gebiete. Die Tarr haben jedoch auch andere Geistwandler unter sich, die die Geister mächtiger Bestien zu sich rufen können. Viele dieser ungebundenen Wandler verlassen irgendwann die Wüste auf der Suche nach neuen Tieren und neuen Geistern.
education.lightspeaker.descr=Die Lichtsprecher bilden einen zur Naraka-Priesterschaft gehörenden Orden. Im Gegensatz zu den Schriftensuchern, die ihre Anstrengungen hauptsächlich auf ihren Orden selbst lenken, sehen die Lichtsprecher es als ihre Pflicht an, erworbenes Wissen dazu zu nutzen, für alle Tarr eine friedlichere Gesellschaft zu formen. So verstehen sie das Führen anderer als ihre Aufgabe und wachsen innerhalb ihrer Gemeinschaft (sei es ihre Sippe oder eine Abenteurergruppe) oft in die Rollen als Sprecher oder Verhandlungsführer hinein. Ebenso sind sie es gewohnt, einen Großteil der Entscheidungen zu treffen, die nur durch Gelehrsamkeit getroffen werden können   etwa wenn es um die Deutung alter Schriften, die Handhabung bestimmter Riten oder den richtigen Umgang mit einem fremden Potentaten geht. Um ausreichend Kenntnisse für diese Aufgaben zu sammeln, ziehen die Lichtsprecher häufig durch Lorakis, gern auch in Begleitung Fremder, um von diesen zu lernen.
education.moonwolf.descr=Die Mondwölfe sind Streiter im Namen Kronars, die stets ihren Instinkten folgen und Kampf sowie Rausch suchen. Junge Kronar-Priester ziehen häufig durch Lorakis auf der Suche nach stärkeren Gegnern und neuen Substanzen, die ihr wildes Gemüt anregen. Schließt sich ein Kronar-Priester einer Gruppe an, so sieht er es als seine Pflicht, Schmerz und Leid der Gruppe auf sich zu nehmen. Er trägt Sorge für den Frieden innerhalb dessen, was er als sein Rudel wahrnimmt. Aggressionen und Streitigkeiten unter seinen Vertrauten führen meist dazu, dass der Mondwolf sich mittels Skorpiongift in einen Blutrausch begibt, auszieht und irgendeine Bestie bekämpft, um so die Spannungen innerhalb der Gruppe im Namen aller abzubauen. Ein Mondwolf würde sich in einer ausweglosen Situation für jedes seiner Gruppenmitglieder opfern und keinen Widerspruch darüber dulden. Alle anderen Entscheidungen überlässt er gerne weiseren Rudelbrüdern und -schwestern, denn schließlich ist Denken nicht unbedingt Teil seiner Aufgabe.
education.silvertongues.descr=Die Priester der Shandirr werden Silberzungen genannt, denn der Handel und die schönen Worte sind ihre Profession. Sie verstehen sich meisterlich auf das Spiel aus Höflichkeiten, List und Schmeichelei, das Verhandlungen in Pash Anar bestimmt, erfreuen sich aber ebenso an einem fröhlichen Tavernenabend in den Zwergenschenken von Wüstentrutz. Silberzungen können die Gebräuche anderer schnell erfassen und sind geschickt darin, sich anzupassen, und sind daher mit jedem schnell gut Freund. Sie achten es jedoch besonders, wenn ein Volk kunstfertig ist, und haben eine Schwäche für Schauspiel und Poesie. Und auch wenn eine Silberzunge immer höflich ist, so darf dies doch nicht darüber hinwegtäuschen, dass sie ebenso ein unnachgiebiger Verhandlungspartner sein kann und letztlich meist genau das bekommt, was sie möchte.
education.voicepast.descr=Erinnerungen, so glauben die Tarr, seien Bilder der Verstorbenen, geschickt durch den Totengott Moroun. Doch werden manche Erinnerungen auch durch Geschichten aufrechterhalten. Die sogenannten Stimmen des Vergangenen berichten über die Leben wichtiger Tarr und sogar über so manche lehrreiche Episode aus der Zeit, bevor die Varge in die Wüste kamen. Mit ihrer umfassenden Kenntnis alter Erzählungen und lehrreicher Mythen unterstützen sie so die Geistheiler des Rudels als Lehrer und Ratgeber. Da sie ihren Geschichten auch gerne mehr Nachdruck verleihen, indem sie die Schatten der vergangenen Geister für alle sichtbar machen, sind sie bei den Farukanis als herausragende Illusionsmagier bekannt. Viele Stimmen des Vergangenen beschränken sich nicht auf die Erzählungen ihres eigenen Volkes, sondern tauschen auch gerne Geschichten mit Fremden aus, um auch aus den Erfahrungen anderer Völker zu lernen. So ziehen sie allein oder meist in der Begleitung eines Schriftensuchers durch Lorakis. Während die Naraka-Priester sich um wissenschaftliche Abhandlungen und Traktate bemühen, fragen die Stimmen des Vergangenen nach den Mythen und Legenden, die man sich in diesen fremden Landen erzählt.

material.buffaloleather.desc=Das Leder der Wüstenbüffel der Surmakar eigent isch hervorragend für die Herstellung der unterschiedlichsten Gegenstände, von Kleidungen über Rüstungen bis hin zu Schilden. Durch die Verarbeitung kann das ohnehin schön zähe Leder noch einmal widerstandsfähiger gemacht werden.
material.buffaloleather.effect=Gegenstände aus Büffelleder haben eine um 1 Pumkt erhöhte Härte.
material.kulaho_schuppe.desc=Die Schuterschuppen der Kulaho.Echsen sind so hart, dass sie sich hervorragend als grundmaterial für Rüstungen und Schilde eigenen. Ihre Steifheit machr derartige Rüstungen jedoch auch etwas unbeweglicher.
material.kulaho_schuppe.effect=Verfügt eine Rüstung aus Kuhalo-Schuppen über das Merkaml Standfstigkeit, steigt dessen Bonus um 1 weiteren Punkt, die Behinderung der Rüstung steigt allerdings um 1. eine Aktive Abwehr mit einem Schild aus Kuhalo-Leder erhält einen Bonus von 2 Punkten, wenn es mit der Meisterschaft Verteidiger für andere eingesetzt wird
material.stonestiltsegg.desc=Um das stark ätzende Gebräu aus den Blüten der seltenen Feuerzahns zu transportieren, nutzen die Gnome aus der Oase Ma'ab Jadar die steinharten Eier der Steinstelzen (s. 42) als Behälter. Die eier sind nicht nur groß sondern auch aus einem harten sehr säureresistenten Material, sodass manche Alchimisten Schutzhandschuhe oder Schürzen mit Splittern dieser Schalen besetzen.
material.stonestiltsegg.effect=Steinstelzeneierschalen verfügen über eine Härte von 8 gegen Säure aller Art. Werden sie verwendet um beispielsweiße Schutzkleidung damit zu besetzen, erhält diese eine Schadensreduktion von 3 gegen Säure.
