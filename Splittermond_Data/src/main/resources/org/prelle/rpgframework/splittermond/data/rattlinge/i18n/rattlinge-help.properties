race.rattlesWest.desc = Rattlinge sind in ganz Lorakis bekannt, nicht anders als Gnome, Menschen, Zwerge, Alben oder Varge. Obwohl sie eigentlich mit all diesen Spezies irgendetwas gemein haben, gelten sie unter den meisten Völkern und in den meisten Gesellschaften jedoch eher als Außenseiter, dem diverse negative Vorurteile anhaften: Nur für niedere Arbeiten zu gebrauchen, raubend, klauend, feige, nicht vertrauenswürdig, lichtscheu \u2026 all dies sind Charaktereigenschaften, die dem Rattling zugeschrieben werden. Dass er diese Klischees mancherorts erfüllt \u2013 meist da, von wo sich solcherlei Vorurteile dann weiterverbreiten \u2013 liegt nicht zwingend an der eigentlichen Natur der Rattlinge. Denn die Abkömmlinge dieser Spezies alle über einen Kamm zu scheren, ergibt ähnlich viel Sinn wie bei den Mitgliedern aller anderen lorakischen Völker.\n\nIn der Regel erreichen die westlichen Rattlinge eine Größe von 1,05 bis 1,25 Meter (Größenklasse 3).
descr.race.rattlesWest.attr = +1 auf Intuition,\n+1 auf ein beliebiges anderes Attribut,\n\u20131 auf Stärke
descr.race.rattlesWest.powers = \uE249 Ihr Greifschwanz verleiht den Rattlingen eine hohe Agilität und einen stark ausgeprägten Gleichgewichtssinn (Stärke Greifschwanz).\n\ue249 Rattlinge sind aufgrund ihrer Physis sehr schnell (Stärke Flink).\n\uE249 Rattlinge haben eine angeborene Widerstandskraft entweder gegen verdorbene Nahrung, Alkohol und sogar Gifte (Stärke Giftresistenz) oder gegen jegliche Krankheitserreger (Stärke Krankheitsresistenz).,\n\uE249 Während manche Rattlinge über eine feine Nase für die Stimmung ihres Gegenübers verfügen (Stärken Soziales Gespür und Feine Nase), vermögen andere selbst bei schwacher Beleuchtung wie bei Tageslicht zu sehen (Stärke Dämmersicht).

race.rattlesEast.desc = Rattlinge sind in ganz Lorakis bekannt, nicht anders als Gnome, Menschen, Zwerge, Alben oder Varge. Obwohl sie eigentlich mit all diesen Spezies irgendetwas gemein haben, gelten sie unter den meisten Völkern und in den meisten Gesellschaften jedoch eher als Außenseiter, dem diverse negative Vorurteile anhaften: Nur für niedere Arbeiten zu gebrauchen, raubend, klauend, feige, nicht vertrauenswürdig, lichtscheu \u2026 all dies sind Charaktereigenschaften, die dem Rattling zugeschrieben werden. Dass er diese Klischees mancherorts erfüllt \u2013 meist da, von wo sich solcherlei Vorurteile dann weiterverbreiten \u2013 liegt nicht zwingend an der eigentlichen Natur der Rattlinge. Denn die Abkömmlinge dieser Spezies alle über einen Kamm zu scheren, ergibt ähnlich viel Sinn wie bei den Mitgliedern aller anderen lorakischen Völker.\n\nIn der Regel erreichen die fernöstlichen Rattlinge eine Größe von 1,30 bis 1,50 Meter (Größenklasse 4).
descr.race.rattlesEast.attr = +1 auf Intuition,\n+1 auf ein beliebiges anderes Attribut,\n\u20131 auf Stärke
descr.race.rattlesEast.powers = \uE249 Ihr Greifschwanz verleiht den Rattlingen eine hohe Agilität und einen stark ausgeprägten Gleichgewichtssinn (Stärke Greifschwanz).\n\ue249 Rattlinge sind aufgrund ihrer Physis sehr schnell (Stärke Flink).\n\uE249 Rattlinge haben eine angeborene Widerstandskraft entweder gegen verdorbene Nahrung, Alkohol und sogar Gifte (Stärke Giftresistenz) oder gegen jegliche Krankheitserreger (Stärke Krankheitsresistenz).,\n\uE249 Während manche Rattlinge über eine feine Nase für die Stimmung ihres Gegenübers verfügen (Stärken Soziales Gespür und Feine Nase), vermögen andere selbst bei schwacher Beleuchtung wie bei Tageslicht zu sehen (Stärke Dämmersicht).

culture.snowjumper.desc=Im eisigen Norden Wintholts herrscht der Stamm der Schneespringer. Inmitten ihres Gebietes verschneiter Wälder und Höhlen liegt Amtumra, ein warmer, prachtvoller Hain, der den Rattlingen eine solide Nahrungsgrundlage und Schutz vor der Witterung bietet.
culture.desertfurs.desc=Die unbarmherzig brennende Sonne der Surmakar zwingt jeden in die Knie, der unvorbereitet die riesige Wüste betritt, und um hier zu überleben, bedarf es entweder besonderer körperlicher Robustheit oder eines unbändigen Willens \u2013 oder Glück. Im Falle der Rattlinge, die sich selbst als Wüstenpelze oder Puskawir bezeichnen, war es wohl in der Tat vor allem das Glück, das dazu führte, dass die Gruppe zu einer der führenden Rattlingspopulationen in der Surmakar wurde. Das Geheimnis ihres Erfolges sind die alten, etwa 200 Kilometer nördlich von Ranah gelegenen Ruinen, in denen sie sich niedergelassen haben und in denen sie in unregelmäßigen Abständen kostbare Schätze und Artefakte finden, die sie an vorüberziehende Karawanen verkaufen. Der wichtigste Fund aber ist ein altes Becken, dessen zauberkräftiges Wasser jeden, der darin badet, altern lässt. Ob dies nun für die Urheber dieser Ruinen ein Segen oder ein Fluch gewesen sein mag, ist unbekannt, doch die Rattlinge nutzen das Becken zur Aufzucht von Dünenschwimmern, die auf diese Weise immense Mengen Silberperl produzieren, dessen Qualität zwar nicht mit den Zuchten am Auge von Telwari mithalten kann, aber für die zentrale Wüste dennoch bemerkenswert ist.
culture.mossskins.desc=Am Rande des ewigen, grünen Meeres der Wandernden Wälder lebt der Stamm der Moosfelle, eine Rattlingsgemeinschaft, die der Flora und Fauna der lebensfeindlichen Umgebung alles abtrotzt, was sie zum Leben benötigt. Die Moosfelle sind unter den Rattlingen in dieser Region ein recht großer Stamm und damit einhergehend eine lokale Größe. Sie heben sich von anderen Gemeinschaften nicht nur durch ihren besonderen Zusammenhalt ab, sondern auch durch eine feste Struktur und vielfältige Ressourcen, die unter anderem dem Warentausch mit dalmarischen Händlern entstammen. 

power.empath.desc=Der Abenteurer besitzt eine erstaunliche Fähigkeit, die Emotionen anderer zu lesen und auf ihre Bedürfnisse einzugehen. Er erhält einen Bonus in Höhe von 1 Punkt auf alle sozialen Proben, die auf dem Verstehen oder Beeinflussen des Gemütszustandes von anderen beruhen. Des Weiteren erfährt er nach einem kurzen Austausch, ob sein Gesprächspartner ihm positiv (Aufgeschlossen oder besser) gegenüber eingestellt ist.
power.dangersense.desc=Der Abenteurer besitzt ein nahezu übernatürliches Gespür für Gefahren. Bei Proben, um Überraschungen zu vermeiden, erhält er einen Bonus in Höhe von 3 Punkten.\nVoraussetzung: eine Stärke, die die Wahrnehmung verbessert (etwa Feine Nase oder Scharfes Gehör).
power.articulated.desc=Der Abenteurer besitzt eine außergewöhnliche Beweglichkeit, die es ihm ermöglicht, sich aus Fesseln zu befreien und schwierige körperliche Aktionen durchzuführen. Er erhält einen Bonus in Höhe von 2 Punkten auf alle Proben, die besondere Gelenkigkeit erfordern und um sich aus Fesseln herauszuwinden oder aus einer Umklammerung zu befreien.
power.smellreader.desc=Die Nase des Abenteurers ist nicht nur besonders fein, sondern kann auch eine Vielzahl von Informationen aus Gerüchen ableiten. Er erhält einen Bonus in Höhe von 2 Punkten auf alle Proben, bei denen der Geruchssinn eine Rolle spielt, wie das Lesen von Fährten, das Beurteilen von Substanzen oder das Einschätzen von Emotionen.\nVoraussetzung: Stärke Feine Nase.
power.griffintail.desc=Der Greifschwanz verleiht einem Rattling eine außerordentliche Beweglichkeit und ist besonders hilfreich, um die Balance zu halten. Dadurch erhält der Abenteurer einen Bonus in Höhe von 1 Punkt auf alle Fertigkeitsproben mit Beweglichkeit, sowie zusätzlich 1 Punkt auf Akrobatik-Proben, um das Gleichgewicht zu halten. Für das Balancieren bekommt er einen Bonus in Höhe von 1 Punkt auf seine Geschwindigkeit (maximal bis zu seiner Geschwindigkeit).\n\nBei anderen Spezies als die Rattlinge benötigt diese die Zustimmung der Spielleitung.
power.hunterinstinct.desc=Die Sinne des Abenteurers sind besonders geschärft, was ihm einen Vorteil bei der Jagd und beim Aufspüren von Beute verschafft. Er erhält einen Bonus in Höhe von 1 Punkt auf alle Jagdkunst-Proben. Des Weiteren beginnt er eine Spurensuche mit 2 Fortschrittspunkten.\nVoraussetzung: eine Stärke, die die Wahrnehmung verbessert (etwa Feine Nase oder Scharfes Gehör).

mastership.whipTail.desc=Der Abenteurer hat gelernt, seinen Greifschwanz im Nahkampf geschickt einzusetzen, dabei bekommt er keine Abzüge für den Kampf mit der falschen Hand. Eine Attacke damit zählt als waffenloser Nahkampfangriff. Zusätzlich kann der Abenteurer seinen Greifschwanz zur Aktiven Abwehr einsetzen.
mastership.tailAttack.desc=Im Kampf kann der Abenteurer seinen Greifschwanz geschickt als Ablenkung von seinen normalen Angriffen einsetzen. Dies kostet ihn einen Tick zusätzlich zu seiner Waffengeschwindigkeit, dafür erhalten alle seine Nahkampfangriffe das Merkmal Ablenkend 1.
mastership.tailParade.desc=Der Abenteurer weiß seinen Greifschwanz ausgezeichnet zur Verteidigung zu benutzen. Eine Aktive Abwehr zur Abwehr eines Nahkampfangriffs damit erhält bei Gelingen einen automatischen EG.
mastership.withAllLimbs.desc=Bei einem erfolgreichen Nahkampfangriff unter Einsatz der Schwanzattacke verursacht der Abenteurer 1W6 Schaden zusätzlich.
mastership.empathy.socialSymbiosis.desc=Durch das tiefe Verständnis und die Sensibilität des Abenteurers für die Stimmungen und Bedürfnisse anderer, kann er seinen Freunden eine unschätzbare Hilfe sein. Seine subtilen Ratschläge und Tipps gelten für Gruppenmitglieder, die sich in seiner Nähe aufhalten, als leicht positiver Umstand (Bonus in Höhe von 2 Punkten) auf Proben der sozialen Interaktion. Durch seine Beobachtung erhält er selbst einen Bonus in Höhe der Anzahl seiner Freunde (max. 3) auf Proben, um jemanden einzuschätzen oder zu durchschauen. 
mastership.acrobatics.innerCentre.desc=Der Abenteurer kann einen Splitterpunkt nachträglich ausgeben, um einen Bonus in Höhe seiner Beweglichkeit für die aktuelle Akrobatik-Probe zu erhalten.
mastership.dexterity.skilledThief.desc=Der Abenteurer kann seinen Greifschwanz verwenden, um unauffällig Gegenstände aufzunehmen und abzulegen, ohne dass dies bemerkt wird. Dies führt zu einem Bonus in Höhe von 2 Punkten auf alle Heimlichkeit-Proben, die das unauffällige Manipul
mastership.stealth.oneWithTheShadows.desc=Der Abenteurer bekommt einen Bonus in Höhe von 6 Punkten auf eine Heimlichkeit-Probe zum Verstecken, wenn sich der Abenteurer in den Schatten aufhält und sich nicht bewegt.
mastership.stealth.tracklessStep.desc=Der Abenteurer hat gelernt, sich besonders vorsichtig zu bewegen und dabei so wenig Spuren wie möglich zu hinterlassen. Proben, um seiner Spur zu folgen, erhalten einen Malus in Höhe von 3 Punkten. 
mastership.craftmanship.skilledGripper.desc=Der Abenteurer kann seinen Greifschwanz fast wie eine dritte Hand einsetzen, sodass er damit Werkzeuge und andere Gegenstände verwenden kann. Dies zählt für alle Handwerk-Proben als leicht positiver Umstand (Bonus in Höhe von 2 Punkten).
mastership.streetlore.Sniffer.desc=Der Abenteurer hat den richtigen Riecher, wenn es darum geht, Gerüchte aufzuschnappen. Gelingt ihm die Straßenkunde-Probe, um Informationen und Gerüchte zu erlangen, erhält er einen zusätzlichen Fortschrittspunkt.
mastership.endurance.thickSkin.desc=Der Abenteurer ist so robust und widerstandsfähig - sei es durch Training, angeborene Zähigkeit oder Erfahrung -, dass er physischen Schaden ignorieren kann, der nach Abzug aller Reduktionen nur einen Punkt Schaden anrichten. Hierdurch ist er etwa gegen Dornengestrüpp, Insektenstiche und ähnliches weitgehend geschützt.