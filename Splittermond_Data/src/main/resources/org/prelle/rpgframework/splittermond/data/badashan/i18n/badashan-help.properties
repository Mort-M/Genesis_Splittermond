education.dragonTreeYounger.descr=Der Bund der Drachenbaumjünger ist dem Shahir von Badashan unterstellt und bildet die Speerspitze im Kampf gegen die gefährlichen Blutrichter, den sie als ihre heilige Pflicht betrachten. Neben der direkten Bekämpfung ihrer Erzfeinde haben die Drachenbaumjünger auch ein wachsames Auge auf all jene, die aus Machtgier oder Unwissen gemeinsame Sache mit den hasserfüllten Feenwesen machen.
education.wisemanofnature.descr=Naturrufer sehen in den Kräften der belebten Natur die Manifestation eines eigenständigen Elements, das gleichberechtigt neben den Energien von Feuer, Fels, Wasser und Wind steht. Sie sind zumeist bodenständige Gefährten, deren profunde Kenntnisse über Tiere und Pflanzen sowie deren Verhaltensweisen und Eigenschaften auf vielerlei Weise von großer Nützlichkeit sind. Doch wehe dem, der sich an ihren Schützlingen vergeht, gleicht ihr Zorn doch dem einer Tigermutter, die ihr Junges verteidigt.
education.pactTraders.descr=Die Pakthändler Badashans sind wahre Kenner der feeischen Natur, sodass sie immer dann zu Rate gezogen werden, wenn ein Pakt mit den Wesen der Anderswelt ausgehandelt werden soll. Dabei achten sie besonders darauf, dass die am Handel beteiligten Sterblichen nicht von ihrem feeischen Gegenüber übervorteilt werden, da Lug und Trug einfach in der Natur dieser Kinder Pudjaris liegen.

item.cankav.desc=hebt die Zustände Angsterfüllt oder Rasend auf. Der Anwender muss jedoch würfeln: Bei einer 1 auf einem W10 entfällt die Wirkung, stattdessen erhält er den Zustand Panisch.
item.blackRaja.desc=heilt eine Stufe des Zustands Erschöpft (nur einmal innerhalb von 24 Stunden möglich).
item.jivasami.desc=heilt 8 LP und Zustand Siechtum 1.
item.henna.desc=Angriffen von Wesen des Typus Feenwesen gegen den Träger erhalten für 1 Stunde einen Malus in Höhe von 1 Punkt.