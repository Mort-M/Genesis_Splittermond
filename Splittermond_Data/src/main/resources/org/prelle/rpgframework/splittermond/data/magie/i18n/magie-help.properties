mastership.antimagic.opponent_shadow.desc=Der Zauberer hat sich den Kampf gegen eine bestimmte Art magischer Wesen auf die Fahnen geschrieben. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Jedes Mal, wenn einer seiner Zauber einem Wesen des entsprechenden Typus Mali verschafft, steigen diese um weitere 3 Punkte. Diese Meisterschaft kann mehrfach gewählt werden, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.antimagic.opponent_water.desc=Der Zauberer hat sich den Kampf gegen eine bestimmte Art magischer Wesen auf die Fahnen geschrieben. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Jedes Mal, wenn einer seiner Zauber einem Wesen des entsprechenden Typus Mali verschafft, steigen diese um weitere 3 Punkte. Diese Meisterschaft kann mehrfach gewählt werden, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.antimagic.opponent_darkness.desc=Der Zauberer hat sich den Kampf gegen eine bestimmte Art magischer Wesen auf die Fahnen geschrieben. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Jedes Mal, wenn einer seiner Zauber einem Wesen des entsprechenden Typus Mali verschafft, steigen diese um weitere 3 Punkte. Diese Meisterschaft kann mehrfach gewählt werden, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.antimagic.opponent_wind.desc=Der Zauberer hat sich den Kampf gegen eine bestimmte Art magischer Wesen auf die Fahnen geschrieben. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Jedes Mal, wenn einer seiner Zauber einem Wesen des entsprechenden Typus Mali verschafft, steigen diese um weitere 3 Punkte. Diese Meisterschaft kann mehrfach gewählt werden, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.antimagic.magehunter.desc=Der Zauberer kann andere Zauberer mit geringerer Mühe beeinflussen. Seine erschöpften oder kanalisierten Fokuspunkte für das Wirken von Bannzaubern des Typus Konter sind um 2 Punkte verringert (Minimum 1).
mastership.antimagic.selective_field.desc=Wenn der Zauberer einen Zauber des Typus Schutzfeld wirkt, der Wesen am Betreten einer Zone hindert, kann er Wesen nach seiner Wahl von der Wirkung des Zaubers ausnehmen.
mastership.antimagic.antimagic_hardening.desc=Durch seine tiefe Beschäftigung mit der Bannmagie, sind die Zauber des Zauberers unempfindlicher gegen Bannmagie. Versuche, von ihm gewirkte Zauber mittels Bannzaubern zu beenden oder einzuschränken, erhalten einen Malus in Höhe von 3 Punkten.
mastership.antimagic.brute_banishing.desc=Wo magische Feinheiten nicht helfen, kann der Zauberer mit roher magischer Kraft nachhelfen. Er kann bei Bannzaubern, die gegen einen Widerstand eines Ziels gerichtet sind, im Nachhinein bis zu 3 Punkte Fokus verzehren, um sich einen Bonus in Höhe von einem Punkt pro verzehrtem Fokuspunkt auf die Zauberprobe zu verschaffen. Dies ist auch nach einer etwaigen Aktiven Abwehr noch möglich.
mastership.antimagic.effective_banisher.desc=Der Zauberer kann seine Bannmagie perfekt auf den Zielzauber abstimmen. Bannzauber des Typus Zauber brechen kosten ihn (K)3V1 Punkte weniger, wenn der gebannte Zauber einen niedrigeren Grad aufweist, als der genutzte Bannzauber (Minimum (K)1). Voraussetzung: Meisterschaft Bannende Hand
mastership.antimagic.enemy_blood.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Gegner der [Wesen] besitzt. Seine Widerstände erhalten gegen Angriffe entsprechender Wesen einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.enemy_stone.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Gegner der [Wesen] besitzt. Seine Widerstände erhalten gegen Angriffe entsprechender Wesen einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.enemy_fire.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Gegner der [Wesen] besitzt. Seine Widerstände erhalten gegen Angriffe entsprechender Wesen einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.enemy_ghost.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Gegner der [Wesen] besitzt. Seine Widerstände erhalten gegen Angriffe entsprechender Wesen einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.enemy_god.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Gegner der [Wesen] besitzt. Seine Widerstände erhalten gegen Angriffe entsprechender Wesen einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.enemy_light.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Gegner der [Wesen] besitzt. Seine Widerstände erhalten gegen Angriffe entsprechender Wesen einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.enemy_nature.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Gegner der [Wesen] besitzt. Seine Widerstände erhalten gegen Angriffe entsprechender Wesen einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.enemy_shadow.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Gegner der [Wesen] besitzt. Seine Widerstände erhalten gegen Angriffe entsprechender Wesen einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.enemy_water.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Gegner der [Wesen] besitzt. Seine Widerstände erhalten gegen Angriffe entsprechender Wesen einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.enemy_darkness.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Gegner der [Wesen] besitzt. Seine Widerstände erhalten gegen Angriffe entsprechender Wesen einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.enemy_wind.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Gegner der [Wesen] besitzt. Seine Widerstände erhalten gegen Angriffe entsprechender Wesen einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.broadband_antimagic.desc=Der Zauberer hat Wege gemeistert, mehrere Zauber auf einmal zu bannen. Er kann bei einem gelungenen direkt gegen einen gegnerischen Zauber gerichteten Bannzauber ohne zusätzlichen Zeitaufwand einen weiteren Zauber (dessen Grad um min. 1 niedriger sein muss als der des ersten) bannen, der auf demselben Ziel liegt und der vom genutzten Bannzauber beeinflusst werden kann. Hierfür fallen nur die halben üblichen Kosten an.
mastership.antimagic.archenemy_blood.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Feind der [Wesen] besitzt. Seine Angriffe gegen entsprechende Wesen erhalten einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.archenemy_stone.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Feind der [Wesen] besitzt. Seine Angriffe gegen entsprechende Wesen erhalten einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.archenemy_fire.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Feind der [Wesen] besitzt. Seine Angriffe gegen entsprechende Wesen erhalten einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.archenemy_ghost.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Feind der [Wesen] besitzt. Seine Angriffe gegen entsprechende Wesen erhalten einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.archenemy_god.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Feind der [Wesen] besitzt. Seine Angriffe gegen entsprechende Wesen erhalten einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.archenemy_light.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Feind der [Wesen] besitzt. Seine Angriffe gegen entsprechende Wesen erhalten einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.archenemy_nature.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Feind der [Wesen] besitzt. Seine Angriffe gegen entsprechende Wesen erhalten einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.archenemy_shadow.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Feind der [Wesen] besitzt. Seine Angriffe gegen entsprechende Wesen erhalten einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.archenemy_water.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Feind der [Wesen] besitzt. Seine Angriffe gegen entsprechende Wesen erhalten einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.archenemy_darkness.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Feind der [Wesen] besitzt. Seine Angriffe gegen entsprechende Wesen erhalten einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.archenemy_wind.desc=Der Zauberer wählt einen Typus, für den er die Meisterschaft Feind der [Wesen] besitzt. Seine Angriffe gegen entsprechende Wesen erhalten einen Bonus in Höhe von einem Punkt. 
mastership.antimagic.fast_counter.desc=Der Zauberer bannt schneller als sein Schatten. Die Zauberdauer aller Zauber des Typus Konter sinkt für ihn um 2 Ticks (Minimum 1).
mastership.antimagic.superior_counter.desc=Die Bannmagie des Zauberers behindert andere Zauberer dabei, starke Zauber zu wirken. Ein vom Zauberer mit einem Zauber des Typus Konter getroffenes Ziel kann bis zu 40 Ticks nach Wirken des entsprechenden Bannzaubers bei selbst ausgelösten Zaubern keine Verstärkung nutzen.
mastership.antimagic.countermagic_armor.desc=Der Zauberer hat Techniken gemeistert, um gegnerische Zauber schwerer an seine Matrix ankoppeln zu lassen. Alle gegen einen Widerstand des Zauberers gerichteten Zauber erhalten eine Erschwernis in Höhe von 3 Punkten.
mastership.controlmagic.penetrating_gaze.desc=Der Zauberer gibt seinem Gegenüber das Gefühl, tief in seine Seele schauen zu können, und erhält dadurch einen Bonus in Höhe von 3 Punkten auf Anführen, wenn es zum Einschüchtern eingesetzt wird.
mastership.controlmagic.subtle_influence.desc=Der Zauberer kann seine Magie subtil einsetzen, um andere von seiner Sicht der Dinge zu überzeugen. Er erhält im Sozialen Konflikt einen leicht positiven Umstand, wenn das Gegenüber einem passenden Beherrschungszauber des Zauberers unterliegt.
mastership.controlmagic.unyielding_will.desc=Der Zauberer hat seinen eigenen Geist gefestigt und ist kaum von seinen Plänen abzubringen. Im Rahmen von Sozialen Konflikten erhält er einen Bonus in Höhe von 3 Punkten auf seinen Geistigen Widerstand, wenn es darum geht, einer Attacke oder einer Manipulation zu widerstehen.
mastership.controlmagic.counter_control.desc=Der Zauberer kennt die Feinheiten der Beherrschungsmagie und kann sich daher leichter dagegen wehren. Er kann Proben zur Aktiven Abwehr zur Erhöhung des Geistigen Widerstands gegen Beherrschungszauber auf Beherrschungsmagie statt wie üblich auf Entschlossenheit ablegen (sofern er unter normalen Umständen eine Aktive Abwehr ablegen darf).
mastership.controlmagic.friendly_takeover.desc=Der Zauberer ist in der Lage, Kraft zu sparen, wenn er seine Magie gegen willige Ziele einsetzt. Er muss für seine Beherrschungszauber (K)2V1 Fokus weniger aufwenden (min. (K)1), wenn das Ziel ihm gegenüber mindestens die Einstellung freundlich aufweist.
mastership.controlmagic.superiority.desc=Der Zauberer strahlt eine Aura von Souveränität, Kompetenz und Macht aus und erhält einen Bonus in Höhe von 2 Punkten auf alle Anführen- und Redegewandtheit-Proben.
mastership.controlmagic.duel_of_wills.desc=Der Zauberer spürt feinste Beeinflussung seines Geistes und bemerkt sofort, wenn er Opfer eines Beherrschungszaubers wird. Er kann dadurch stets versuchen, mit einer Aktiven Abwehr seinen Geistigen Widerstand gegen entsprechende Beherrschungszauber zu erhöhen.
mastership.controlmagic.victory_of_mind.desc=Der Zauberer ist durch seine lange Beschäftigung mit seinem eigenen Geist in der Lage, seine Ängste zu unterdrücken. Er kann 2 bzw. 4 Fokus erschöpfen, um die Zustände Angsterfüllt bzw. Panisch bei sich selbst mittels einer sofortigen Reaktion von 3 Ticks für die Dauer von 60 Ticks zu unterdrücken.
mastership.controlmagic.will_enhancer.desc=Der starke Wille des Zauberers beeinflusst auch jene in seiner Umgebung und lässt sie weniger verzagen. Gefährten, die mindestens seit einer Woche mit ihm unterwegs sind, erhalten, solange sie ihn begleiten, einen Bonus in Höhe von 3 Punkten auf alle Proben, um nicht unter den Zuständen Angsterfüllt und Panisch zu leiden, oder um nicht von jemand anderem eingeschüchtert zu werden.
mastership.controlmagic.materialbond3.desc=Sofern der Zauberer eine materielle Verbindung zum Ziel (Haare, Nägel, Blut) besitzt, wird die Wirkungsweite und die Reichweite entsprechender Beherrschungszauber verzehnfacht. Dafür muss jeder auf diese Weise gewirkte Zauberspruch als Ritus von mindestens 10 Minuten Dauer durchgeführt werden. Versuche, einen entsprechenden Zauber zu identifizieren, zu analysieren oder zu bannen, erhalten einen Malus in Höhe von 5 Punkten.
mastership.motionmagic.firm_anker.desc=Wenn der Zauberer einen Bewegungszauber des Typus Telekinese kanalisiert, dann sind alle Versuche, ihn zu Fall zu bringen oder ihn gegen seinen Willen zu bewegen, um 2 Punkte erschwert. Dies gilt auch für eventuell vom Zauber beeinflusste Gegenstände.
mastership.motionmagic.hard_to_hit.desc=Wenn der Zauberer einen Bewegungszauber des Typus Bewegung stärken kanalisiert, erhält er einen Bonus in Höhe von 2 Punkten auf jede Aktive Abwehr, die mittels Akrobatik durchgeführt wird.
mastership.motionmagic.paralyzing_magic.desc=Der Zauberer ist in der Lage, Opfer seiner Magie zu verlangsamen. Seine Bewegungszauber des Typus Schwächung verleihen ihren Zielen für 30 Ticks den Zustand Lahm (oder, falls dieser bereits vorliegt, Geschwindigkeit -2 bis zu einem Minimum von 1).
mastership.motionmagic.lasting_speed.desc=Der Zauberer ist in der Lage, auch jene in seiner Nähe zu beflügeln. Wenn er ein Wesen berührt, erhält es für die Dauer dieser Berührung ebenfalls jegliche Boni auf Geschwindigkeit, die der Zauberer aus seinen Meisterschaften erhält.
mastership.motionmagic.deflect_projectile1.desc=Der Zauberer kann ein auf ihn gerichtetes Projektil einer Schusswaffe oder eine Wurfwaffe ablenken, wenn ihm unter normalen Umständen eine Aktive Abwehr zustünde. Hierfür kann er eine sofortige Reaktion von 3 Ticks durchführen und 2 Punkte Fokus erschöpfen, wodurch sich sein entsprechender Widerstandswert gegen diesen Fernkampfangriff um 3 Punkte erhöht. Dies ist pro Angriff nur einmal möglich.
mastership.motionmagic.speed_transfer.desc=Der Zauberer vermag Opfern seiner schwächenden Magie die Geschwindigkeit zu entziehen. Wenn er einen Bewegungszauber kanalisiert, der einer anderen Person den Zustand Lahm verleiht oder deren Geschwindigkeit verringert, dann erhält er selbst einen Bonus in Höhe von 2 Punkten auf seine Geschwindigkeit.
mastership.motionmagic.telekinetic.desc=Der Zauberer kann Fernkampfangriffe mit Wurfwaffen auch mittels Bewegungsmagie statt mittels der Fertigkeit Wurfwaffen durchführen. Hierfür muss er pro Fernkampfangriff einen Punkt Fokus erschöpfen.
mastership.motionmagic.moving_caster1.desc=Der Zauberer ist beim Wirken von Bewegungsmagie besonders mobil. Er kann seine kontinuierliche Aktion zum Zauber vorbereiten bei Bewegungszaubern mit zwei freien Bewegungen kombinieren, statt wie üblich nur mit einer. Diese beiden freien Bewegungen müssen nicht beide zum gleichen Zeitpunkt stattfinden.
mastership.motionmagic.deflect_projectile2.desc=Der Zauberer kann die Meisterschaft Geschoss ablenken I auch für andere Wesen im Umkreis von 10 m nutzen, sofern er sich des jeweiligen Fernkampfangriffs bewusst ist.
mastership.motionmagic.unrestricted_motion.desc=Der Zauberer kann sich entscheiden, wenn er den Zustand Lahm erleidet, statt der eigentlichen Auswirkung einen Malus in Höhe von 2 Punkten auf seine Geschwindigkeit hinzunehmen.
mastership.motionmagic.moving_caster2.desc=Wenn der Zauberer bei der kontinuierlichen Aktion Zauber vorbereiten seiner Bewegungszauber auf sämtliche freien Bewegungen verzichtet, kann er stattdessen auch eine Aktion Laufen oder Aufstehen mit dieser Aktion kombinieren. Dies zählt dann als eine gemeinsame kontinuierliche Aktion. Eine solcherart begonnene kontinuierliche Aktion kann nicht mehr freiwillig abgebrochen werden und dauert mindestens 3 Ticks.
mastership.motionmagic.one_with_the_wind.desc=Die Geschwindigkeit erhöht sich um 1, die Initiative sinkt um 1. Alle Proben zum Klettern, Springen, Abrollen, Balancieren, dem Überwinden von Hindernissen und zur Aktiven Abwehr mittels Akrobatik erhalten einen Bonus in Höhe von 3 Punkten. Voraussetzung: Meisterschaft Arkane Geschwindigkeit, Meisterschaft Meisterhafte Balance in Akrobatik
mastership.motionmagic.reflect_projectile.desc=Der Zauberer kann ein auf ihn gerichtetes Projektil einer Schusswaffe oder eine Wurfwaffe auf den Verursacher zurückschleudern, wenn ihm unter normalen Umständen eine Aktive Abwehr zustünde. Hierfür kann er eine sofortige Reaktion von 5 Ticks durchführen und 3 Punkte Fokus verzehren. Der ursprüngliche Verursacher wird nun von dem Fernkampfangriff betroffen, als wäre er selbst das ursprüngliche Ziel gewesen.
mastership.insightmagic.i_see_through_you.desc=Der Zauberer kann durch seine Beschäftigung mit der Erkenntnismagie mitunter Handlungen vorhersehen und seinen Gefährten hilfreiche Hinweise auf Schwachpunkte geben. Bei Verwendung der Regeln zur Zusammenarbeit im Kampf darf er Erkenntnismagie anstelle einer Kampffertigkeit einsetzen.
mastership.insightmagic.magic_senses.desc=Die Sinne des Zauberers sind durch die magische Beschäftigung mit ihnen derart geschult, dass er einen Bonus in Höhe von einem Punkt auf seine Wahrnehmung erhält.
mastership.insightmagic.recognize_signature.desc=Der Zauberer benötigt bei der Analyse eines Zaubers keine Fortschrittspunkte, um die Signatur zu erkennen, sofern er mindestens eine weitere Information im Rahmen der Analyse erfolgreich erlangt hat.
mastership.insightmagic.enhanced_senses.desc=Der Abenteurer hat gelernt, seine Sinne ganzheitlich zu nutzen und daraus Nutzen zu ziehen. Hat er bereits selbst einen Zauber des Typus Sinne auf sich gewirkt, sind die Kosten für alle weiteren Sprüche desselben Typus um (K)2V1 reduziert. Jeder Zauber benötigt weiterhin mindestens (K)1 Fokus.
mastership.insightmagic.knowledge_is_power.desc=Der Zauberer erhält einen Bonus in Höhe von einem Punkt auf Angriffe gegen ein Wesen oder auf seine Widerstände gegen Angriffe eines Wesens, das er erfolgreich identifiziert hat. Der Bonus gilt dabei nur für das konkrete Wesen, nicht für andere derselben Art.
mastership.insightmagic.spellsense1.desc=Der Zauberer besitzt ein gutes Gespür selbst für ihm fremdartige Zauber. Er kann beim Identifizieren und Analysieren von Zaubern einen leicht negativen Umstand seiner Wahl ignorieren.
mastership.insightmagic.arcane_forensic1.desc=Der Zauberer ist in der Lage, Zauber auch noch dann zu identifizieren, nachdem sie bereits abgeklungen sind. Wenn er sich 5 Minuten Zeit nimmt, um ein potenzielles Ziel eines Zaubers (also eine Person, ein Objekt, ein Ort, etc.) zu untersuchen, kann er eine Arkane Kunde-Probe ablegen. Die Schwierigkeit hierfür beträgt die normale Schwierigkeit zur Identifikation des Zaubers (unter Beachtung der üblichen Umstände) sowie ein weiterer Punkt pro seit dem Zaubervorgang vergangener halben Stunde.
mastership.insightmagic.soothing_aura.desc=Solange der Abenteurer mindestens einen kanalisierten Erkenntniszauber des Typus Verständigung aktiv hält, erhält er einen Bonus in Höhe des Zaubergrades auf alle Diplomatie-Proben. Dieser Bonus zählt im Sinne der maximalen Boni auf Proben als Zauberbonus.
mastership.insightmagic.shared_insight.desc=Der Zauberer kann kanalisierte Erkenntniszauber des Typus Wahrnehmung auf bis zu AUS Gefährten ausdehnen, indem er pro weiterer Person zusätzliche Fokuspunkte in Höhe der halben Zauberkosten kanalisiert und gegebenenfalls verzehrt.
mastership.insightmagic.forced_insight.desc=Es ist sehr anstrengend, der brachialen Gewalt der Erkenntniszauber des Zauberers zu widerstehen. Um eine Aktive Abwehr gegen einen seiner gegen einen Widerstand gerichteten Erkenntniszauber durchzuführen, muss das Ziel so viele Stufen des Zustands Erschöpft hinnehmen, wie die EG des Zaubers vor Nutzung der Aktiven Abwehr betragen (bis maximal Zaubergrad +1).
mastership.insightmagic.illusiondestroyer.desc=Der Zauberer kann durchschaute oder identifizierte Illusionszauber beenden, wenn er dafür Fokus in Höhe von 3V1 Punkten mal Zaubergrad des Zielzaubers aufwendet (mind. 3V1).
mastership.insightmagic.deep_insight.desc=Der Abenteurer hat durch seine Beschäftigung mit der Erkenntnismagie immer wieder spontane Einsichten in verschiedenste Wissensgebiete. Er kann bei Proben auf Arkane Kunde, Geschichte und Mythen, Länderkunde und Naturkunde auch mit Erkenntnismagie statt mit der normalerweise zu nutzenden Fertigkeit unterstützen.
mastership.insightmagic.arcane_forensic2.desc=Der Zauberer kann bei Nutzung der Meisterschaft Arkaner Forensiker I auch an einem Ort gewirkte Zauber zu identifizieren versuchen, wenn das Ziel des Zaubers nicht mehr anwesend ist
mastership.insightmagic.thought_cathedral.desc=Der Zauberer erhält eine übermenschliche Merkfähigkeit. Er kann eine kontinuierliche Aktion von 10 Ticks Dauer aufwenden um sich in seinen eigenen Geist zu versenken und somit beliebige Erinnerungen seit der Zeit, zu der er die Meisterschaft gelernt hat, aus seinem Gedächtnis zu extrahieren. Er erhält dafür den Zustand Erschöpft 1.
mastership.insightmagic.sense_magic.desc=Wenn der Abenteurer sich auf seine magischen Sinne konzentriert und sonst nichts anderes tut, weiß er ob in MYS + 10m um ihn herum Magie gewirkt wird und ob Gegenstände verzaubert sind. Die Aktion kann abgebrochen werden wie eine kontinuierliche Aktion, im Kampf zählt der Zauberer außerdem als abwartend. Für weitere Informationen muss er den Zauber oder das Objekt identifizieren oder analysieren.
mastership.insightmagic.spellsense2.desc=Der Zauberer kann auch aus kleinsten Anhaltspunkten Erkenntnisse über Zauber ziehen. Er kann beim Identifizieren und Analysieren von Zaubern die negativen Umstände bei Nichtbeobachtung der Zauberhandlung sowie die Abzüge durch fehlende Formel und Geste ignorieren.
mastership.insightmagic.arcane_forensic3.desc=Der Zauberer kann bei Nutzung der Meisterschaft Arkaner Forensiker I oder II auch eine Analyse durchführen, nicht nur Zauber identifizieren. Auch hier steigt die Schwierigkeit der Probe pro vergangener halber Stunde um einen Punkt an.
mastership.insightmagic.divider_of_veils.desc=Für den Zauberer gelten Illusionszauber bis einschließlich Zaubergrad 3 als durchschaut.
mastership.stonemagic.stone_summoner.desc=Wenn der Zauberer mittels eines Felszaubers des Typus Beschwörung ein Wesen mit dem Merkmal Beschwörbares Wesen ruft, richtet dieses im Handgemenge immer Felsschaden an. Außerdem erhält das Wesen einen Bonus in Höhe von 2 Punkten auf seine Lebenspunkte und Schadensreduktion sowie das zusätzliche Merkmal Erschöpfungsresistenz 1.
mastership.stonemagic.stone_power.desc=Von dem Felszauberer herbeigerufene Felsen sind besonders schmerzhaft. Alle Felszauber des Typus Schaden verursachen 1 zusätzlichen Punkt Felsschaden.
mastership.stonemagic.power_of_the_ore.desc=Wenn der Zauberer mittels Handwerk einen Gegenstand aus Stein oder Metall erschafft und dafür ein Besonderes Material mit einer Materialqualität von mindestens 2 nutzt, kann er eine Qualitätsstufe mehr nutzen, als normalerweise erlaubt.
mastership.stonemagic.stone_former.desc=Der Zauberer ist besonders effektiv darin, Stein zu manipulieren. Alle Felszauber des Typus Elementarkontrolle kosten ihn (K)2V1 Fokus weniger (min. (K)1).
mastership.stonemagic.object_caster.desc=Alle Felszauber des Typus Objekt kosten den Zauberer einen verzehrten Punkt Fokus weniger (min. (K)1).
mastership.stonemagic.sense_stone.desc=Der Zauberer kennt sich besonders gut mit Felsen aus. Er erhält einen Bonus in Höhe von 4 Punkten auf alle Proben, die der Bestimmung und Verarbeitung von Gestein und Metall, der Feststellung des Wertes von Metall oder Edelsteinen, der Identifikation von Wesen des Typus Felswesen und ähnlichem dienen.
mastership.stonemagic.object_destroyer.desc=Der Zauberer kennt die Schwachstellen unbelebter Objekte. Er erhält einen Bonus in Höhe von 2 Punkten auf den Schaden aller seiner Zauber, Nahkampfangriffe oder Fernkampfangriffe, wenn diese Schaden gegen ein Objekt anrichten.
mastership.stonemagic.stubborn_as_stone.desc=Die Überzeugungen des Zauberers sind mitunter so unbeweglich wie ein Felsen. Er erhält einen Bonus in Höhe von 2 Punkten auf seinen Geistigen Widerstand und seine Entschlossenheit, wenn es gilt, sich gegen profane oder magische Versuche, ihn zu überreden, zu überzeugen oder von seiner Meinung abzubringen, zu wehren.
mastership.stonemagic.fists_of_steel.desc=Die Fäuste des Zauberers werden, wann auch immer er dies wünscht, hart wie Stahl. Hierdurch kann er bewaffnete Angriffe im Handgemenge abwehren, richtet echten Schaden im Nahkampf an und kann Gegenstände mit bloßen Händen beschädigen, als hätten seine Fäuste eine Härte von 7.
mastership.stonemagic.stoneaffinity.desc=Solange der Zauberer sich auf steinernem Untergrund befindet, erhält er eine Schadensreduktion in Höhe von einem Punkt.
mastership.stonemagic.heavens_enemy.desc=Der Zauberer fühlt sich am Erdboden am wohlsten und weiß, wie er mit fliegenden Gegnern umzugehen hat. Er erhält keine Mali gegen Gegner mit dem Merkmal Fliegend, ebenso wie diese keine Boni gegen ihn erhalten. Dies gilt nur, solange der Zauberer selbst nicht fliegt.
mastership.stonemagic.root_in_stone.desc=Der Zauberer vermag sich in eine unverrückbare und unzerstörbare Steinstatue zu verwandeln. Hierfür muss er eine sofortige Reaktion von 3 Ticks aufwenden und einen Splitterpunkt ausgeben. Die Verwandlung erfolgt für 60 Ticks und kann vorzeitig abgebrochen werden. Der Zauberer nimmt seine Umgebung noch war, kann mit ihr aber nicht interagieren, jedoch auch nicht bewegt oder beschädigt werden.
mastership.stonemagic.mind_of_seel.desc=Der Zauberer ist so hart zu beeinflussen wie das Element, das er nutzt. Die Zustände Benommen und Erschöpft sind für ihn stets um 3 Punkte verringert
mastership.firemagic.impressive_flame.desc=Flammen, die der Zauberer mittels seiner Feuermagie erschafft oder auf herkömmlichem Wege entzündet, wirken größer, heißer und gefährlicher, als sie es eigentlich sind. Werden sie verwendet, um bei passenden sozialen Konflikten (Einschüchtern, Beeindrucken einer Menschenmenge) sowie bei passenden Darbietung-Proben zusätzlichen Eindruck zu erzeugen, erhält der Zauberer einen Bonus in Höhe von 3 Punkten auf die entsprechenden Proben.
mastership.firemagic.fire_summoner.desc=Wenn der Zauberer mittels eines Feuerzaubers des Typus Beschwörung ein Wesen mit dem Merkmal Beschwörbares Wesen ruft, richtet dieses im Handgemenge immer Feuerschaden an.\nAußerdem erhält das Wesen einen Bonus in Höhe von 1 Punkt auf seinen Schaden im Nahkampf, seine Verteidigung und seinen Geistigen Widerstand sowie in Höhe von 2 Punkten auf seinen Angriffswert im Nahkampf.
mastership.firemagic.heat_aura.desc=Vom Zauberer gewirkte Feuerzauber erhöhen, sofern er dies wünscht, die Hitzestufe oder senken die Kältestufe in 3 m Umkreis um das Ziel um 1 Stufe. Bei kanalisierten Zaubern gilt dies, solange der Zauber anhält, ansonsten für 30 Ticks.
mastership.firemagic.bonfire.desc=Die magischen Flammen des Zauberers brennen besonders hell. Flammen verursachende Feuerzauber des Zauberers erhöhen, sofern er dies wünscht, die Lichtverhältnisse für ihre Wirkungsdauer im Umkreis von 10 m um 1 Stufe.
mastership.firemagic.forceful_explosion.desc=Vom Zauber verursachte Explosionen sind besonders stark. Wenn der Zauberer einen Zauber des Typus Explosion erfolgreich wirkt, kann er 2 EG aufwenden und einen zusätzlichen Punkt Fokus verzehren. Wenn er dies tut, müssen alle Wesen, die durch den entsprechenden Zauber Schaden erlitten haben, eine Akrobatik- oder Athletik-Probe gegen 15 zuzüglich der Fertigkeitspunkte des Zauberers in Feuermagie ablegen, um nicht umgeworfen zu werden und als liegend zu gelten.
mastership.firemagic.burning_rage.desc=Der Zauberer kann seine Kenntnisse der Feuermagie nutzen, um seine Angriffe zerstörerischer zu machen. Er kann nach einem gelungenen Angriff, der Schaden verursacht, eine sofortige Reaktion von 1 Tick Dauer durchführen und einen kanalisierten Feuerzauber abbrechen, um seinem Angriff zusätzlichen Feuerschaden in Höhe von 1 + Grad des abgebrochenen Zaubers hinzuzufügen. Dies ist pro Angriff nur einmal möglich.
mastership.firemagic.efficient_flames.desc=Alle Feuerzauber des Typus Schaden kosten den Zauberer zwei kanalisierte oder erschöpfte Punkte Fokus weniger (min. (K)1).
mastership.firemagic.fireproof.desc=Der Körper des Zauberers fängt nur schwer Feuer. Jeglicher Brandschaden sowie jeder Zustand Brennend, den der Zauberer erleidet, wird um eine Stufe reduziert.
mastership.firemagic.fiery_surrounding.desc=Alle Feuerzauber des Typus Elementarkontrolle kosten den Zauberer 2 kanalisierte oder erschöpfte Punkte Fokus weniger (min. (K)1), sofern die Hitzestufe mindestens 1 beträgt.
mastership.firemagic.firestarter.desc=Wenn ein Feuerzauber des Zauberers den Zustand Brennend verursacht, hält dieser weitere 15 Ticks an, sofern er einen Punkt Fokus verzehrt.
mastership.firemagic.master_of_heat.desc=Der Zauberer ist in der Lage, seine Körpertemperatur zu regulieren. Er kann eine vorliegende Hitzestufe oder Kältestufe für sich selbst um bis zu 2 Stufen in eine von ihm gewünschte Richtung verschieben.
mastership.firemagic.firestorm.desc=Der Zauberer kann mittels einer sofortigen Reaktion von 3 Ticks Dauer einen seiner kanalisierten Feuerzauber abbrechen, um allen Wesen im Umkreis von 5 m so viele Punkte Feuerschaden zuzufügen, wie der doppelte Zaubergrad des Zaubers (mind. 1) beträgt.
mastership.firemagic.heatmaster.desc=Dem Zauberer vermag Hitze kaum etwas anzuhaben. Er ist immun gegen die Auswirkungen von Hitzestufen.
mastership.firemagic.cauterize.desc=Der Zauber ist in der Lage, mittels seiner Schaden verursachenden Feuermagie Wunden heilsam auszubrennen. Er kann einen gegen einen Widerstand gerichteten Feuerzauber des Typus Schaden auf ein freiwilliges Ziel mit einem Bonus in Höhe von 6 Punkten wirken, um einen etwaigen Zustand Blutend zu beenden, sofern dieser nicht mit dem Zustand Siechtum verbunden ist. Der Zauber richtet keinen Schaden an, sondern heilt sogar halb so viele Lebenspunkte, wie er eigentlich verursacht hätte. Dies ist pro Person und Tag nur einmal möglich.
mastership.firemagic.feeding_flames.desc=Der Zauberer nährt sich von Flammen, statt von ihnen verzehrt zu werden. Er ist immun gegen Feuerschaden und erhält sogar Lebenspunkte in Höhe eines Viertels des eigentlich angerichteten Schadens zurück (bis zu einem Maximum von 10 Punkten pro Tag).
mastership.healmagic.healing_efficiency.desc=Der Zauberer kann bei direkt Lebenspunkte wiederherstellenden Heilungszaubern des Typus Leben einen weiteren Punkt Fokus erschöpfen, um dreimal so viele Lebenspunkte zusätzlich zu heilen, wie der um eins reduzierte Zaubergrad beträgt.
mastership.healmagic.disease_resistence.desc=Der Körperliche Widerstand des Zauberers gilt beim Infektionswurf durch Krankheiten als um 4 Punkte erhöht.
mastership.healmagic.life_blossom.desc=Der Zauberer kann als sofortige Reaktion von 3 Ticks Dauer einen Punkt Fokus erschöpfen, um einen seiner kanalisierten Zauber, welcher temporäre Lebenspunkte verleiht, zu beenden und dadurch die vorhandenen temporären Lebenspunkte auf dem Ziel des Zaubers zu verdoppeln. Nach 30 Ticks endet diese Wirkung.
mastership.healmagic.emergency_balm.desc=Alle Heilungszauber, die Zustände heilen oder unterdrücken, kosten den Zauberer einen verzehrten Punkt Fokus weniger (min. (K)1).
mastership.healmagic.signs_of_life.desc=Der Zauberer kann auf einem freiwilligen Ziel magische Zeichen des Lebens anbringen, was 5 Minuten Zeit benötigt. Für einen Tag kann der Zauberer Heilzauber mit der Reichweite Berührung oder Zauberer auf das Ziel mit einer Reichweite von 10 m wirken. Für entsprechende Zauber kann er auch EG gemäß den üblichen Regeln nutzen, um die Reichweite zu erhöhen.
mastership.healmagic.anatomic_secrets.desc=Das Wissen des Zauberers im Bereich der Heilungsmagie verleiht ihm einen Bonus in Höhe von 3 Punkten auf sämtliche Heilkunde-Proben.
mastership.healmagic.magic_poison_immunity.desc=Der Zauberer ist widerstandsfähig gegen schwache Gifte. Er ist immun gegen Gifte bis Grad 2.
mastership.healmagic.multiple_healing.desc=Der Zauberer kann bei sofortig wirkenden Heilungszaubern des Typus Leben diese auf bis zu WIL Gefährten ausdehnen, indem er pro weiterer Person zusätzliche Fokuspunkte in Höhe der Zauberkosten erschöpft und gegebenenfalls verzehrt.
mastership.healmagic.life_intuition.desc=Der Zauberer kann mittels einer sofortigen Reaktion von 3 Tick Dauer in einem Radius von MYS Metern erkennen, wenn ein Lebewesen die Zustände Krank, Verwundet oder Sterbend besitzt, sowie an einer Vergiftung leidet. Auch die Gesundheitsstufe, in der sich die jeweiligen Wesen befinden, ist ihm intuitiv bewusst. Was die Ursache der Zustände ist, an welcher Krankheit oder an welchem Gift jemand leidet oder welche exakte Zustandsstufe die Wesen haben, kann er ohne genauere Untersuchung mittels Heilkunde jedoch nicht feststellen.
mastership.healmagic.healing_hands.desc=Verwendet der Zauberer einen Heilungszauber des Typus Leben, kann er 3 zusätzliche Fokuspunkte erschöpfen, um beim Ziel des Zaubers bis zu so viele Stufen der Zustände Benommen, Erschöpft, Verwundet oder Blutend für 60 Ticks zu unterdrücken, wie der Zaubergrad des Zaubers beträgt. Nach Ablauf der 60 Ticks wirkt der Zustand so weiter, als wäre er nie unterbrochen worden.
mastership.healmagic.phoenix_rising.desc=Der Zauberer (bei dem es sich um einen Splitterträger handeln muss) vermag es, den Tod einmalig in seine Schranken zu weisen. Er kann einen Splitterpunkt dauerhaft ausgeben (dieser kann nicht mehr zurückerlangt werden), um eine Person, die innerhalb derselben Szene (üblicherweise wenige Stunden) gestorben ist, wieder zum Leben zu erwecken. Dies kann er auch im Moment seines Todes für sich selbst nutzen. Die wiederbelebte Person ist anschließend komplett regeneriert, unterliegt keinen Zuständen mehr, hat aber auch keine Zauber mehr kanalisiert. Diese Meisterschaft kann für jede Person nur einmalig genutzt werden. Sofern der Nutznießer dieser Meisterschaft ein Splitterträger ist, kann der Splitterpunkt auch von ihm selbst dauerhaft ausgegeben werden.
mastership.healmagic.stable_healmagic.desc=Der Zauberer kann sich als sofortige Reaktion von 2 Ticks Dauer entscheiden, für einen kanalisierten Heilungszauber (bis maximal Zaubergrad 4) 2 zusätzliche Punkte Fokus zu kanalisieren. Dafür bricht dieser Zauber nicht ab, wenn das durch Bewusstseinsverlust des Zauberers oder als Reaktion auf das Überschreiten von Gesundheitsstufen eigentlich passieren würde. Allerdings kann er Fokuspunkte, die auf diese Weise aufgewendet wurden, solange nicht regenerieren, bis er sich entscheidet, den Zauber zu beenden. Stirbt der Zauberer, endet der Zauber augenblicklich.
mastership.illusionmagic.clear_sight.desc=Der Blick des Zauberers wird durch Illusionen nur schwer getrübt. Proben, um Illusionen, feeischen Glimmer und ähnliche Effekte zu durchschauen, erhalten einen Bonus in Höhe von 3 Punkten.
mastership.illusionmagic.blurry_blade.desc=Der Zauberer kann bei einem Nahkampfangriff oder Fernkampfangriff als sofortige Reaktion von 0 Ticks Dauer 2 Fokuspunkte erschöpfen, um diesem Angriff das Merkmal Ablenkend +1 zu verleihen (nur einmal pro Angriff).
mastership.illusionmagic.multiple_illusions.desc=Solange der Zauberer mindestens einen kanalisierten Illusionszauber des Typus Trugbild aktiv hat, kosten ihn alle weiteren Illusionszauber des Typus Trugbild einen verzehrten Punkt Fokus weniger (min. (K)1).
mastership.illusionmagic.selective_illusions.desc=Die Illusionen des Zauberers wirken nach seinem Willen nicht auf jeden gleich. Er kann bei seinen Illusionszaubern eine Anzahl von Wesen in Höhe seiner AUS bestimmen, die nicht von der jeweiligen Wirkung betroffen sind, solange sie sich in MYS + 10 m Entfernung zum Zauberer befinden. Die Personen müssen beim Auslösen des Zaubers festgelegt werden. Sie nehmen die Illusion wahr (und wissen daher auch, wo sich etwa eine illusionäre Gestalt befindet), durchschauen sie aber automatisch.
mastership.illusionmagic.immoderate_trust.desc=Der Zauberer ist in der Lage, das Vertrauen anderer auszunutzen, um sie an seine Illusionen glauben zu lassen. Wenn ein Wesen ihm gegenüber eine positive Einstellung besitzt, dann gilt der Bonus auf soziale Proben auch als Malus, um Illusionszauber des Zauberers zu durchschauen oder zu identifizieren.
mastership.illusionmagic.inscrutable_magic.desc=Die Magie des Zauberers ist nur schwer zu durchdringen. Sofern er es wünscht, sind alle Proben zum Identifizieren und Analysieren von ihm gewirkter Zauber sowie von ihm hergestellter, konstruierter oder animierter Artefakte bzw. Konstrukte um 5 Punkte erschwert. Dies muss beim Zaubervorgang oder bei der Herstellung/ Animierung festgelegt werden.
mastership.illusionmagic.shared_camouflage.desc=Der Zauberer kann seine tarnenden Zauber auf andere ausdehnen. Wenn er einen Illusionszauber des Typus Tarnung wirkt, kann er diesen auf so viele Gefährten ausdehnen, wie seine doppelte WIL beträgt. Für diese weiteren Ziele muss er jeweils nur die halben Fokuskosten aufwenden, wobei verzehrte Punkte in kanalisierte umgewandelt werden (Kosten von K4V1 würden also in K4 umgewandelt).
mastership.illusionmagic.spellhustle.desc=Der Zauberer kann einen Punkt Fokus erschöpfen, um Beobachtern während des Vorbereitens eines Illusionszaubers vorzugaukeln, einen beliebigen anderen ihm bekannten Zauber zu wirken. Jeder, der während des Zaubervorgangs versucht, den Spruch zu identifizieren, muss erfolgreich eine Arkane Kunde-Probe gegen die Schwierigkeit des tatsächlichen Zaubers ablegen. Gelingt ihm dies nicht, glaubt er genau den Zauber zu identifizieren, den ihm der Zauberer vorgaukeln möchte. Gelingt ihm die Probe hingegen, so wird das Ergebnis nach den üblichen Regeln zur Identifikation des ursprünglichen Zaubers genutzt.
mastership.illusionmagic.master_of_weak_minds.desc=Nur wer wachen Geistes ist, kann die Illusionen des Zauberers durchschauen. Wer einen Geistigen Widerstand von 24 oder kleiner aufweist, kann die Illusionszauber des Zauberers nicht mittels einer Wahrnehmung-Probe durchschauen, selbst wenn sie ihm eigentlich zustünde. Illusionszauber des Zauberers sind stattdessen nur kontextuell zu durchschauen (wenn man etwa durch eine illusionäre Wand hindurchgeht).
mastership.illusionmagic.unseen_attack.desc=Die Angriffe des Zauberers sind kaum zu erkennen. Alle seine Angriffe erhalten das Merkmal Ablenkend +1.
mastership.combatmagic.constant_disturbance1.desc=Wenn ein Kampfzauber des Zauberers einen Zustand verleiht, hält dieser Zustand 15 Ticks länger an als üblich.
mastership.combatmagic.arcane_archer.desc=Der Zauberer kann bis zu zwei Zauber des Typus Pfeil miteinander kombinieren, die eigentlich nicht miteinander kombiniert werden könnten.
mastership.combatmagic.defensive_caster.desc=Der Zauberer kann beim Wirken von Kampfzaubern einen Malus in Höhe von bis zu 3 Punkten in Kauf nehmen, um seiner Verteidigung gegen den ersten Angriff während des Zauberversuchs einen Bonus in Höhe derselben Zahl zu verleihen. Dies muss zu Beginn der Aktion Zauber vorbereiten angesagt werden.
mastership.combatmagic.pierce_darkness.desc=Der Zauberer kann die Modifikationen für Lichtverhältnisse für seine Kampfzauber ignorieren.
mastership.combatmagic.magical_throwing_weapon.desc=Der Zauberer kann Zauber des Typus Pfeil auch auf Wurfwaffen wirken.
mastership.combatmagic.constant_disturbance2.desc=Die Auswirkung von Andauernde Störung I gilt auch für alle anderen Zauber des Zauberers.
mastership.combatmagic.one_with_weapon.desc=Wenn der Zauberer einen Zauber des Typus Waffe auf eine Waffe wirkt, kann er außerdem 1 EG aufwenden und einen Punkt Fokus verzehren, um diese während der Wirkungsdauer des Zaubers zu verbessern. Sie erhält eines der folgenden Merkmale: Durchdringung 1 (oder, falls schon vorhanden, +1), Exakt 1 (+2), Kritisch 3 (+3) und Scharf 3 (+3; dabei max. +3 bei W6 als Schadenswürfel; max. +5 bei W10 als Schadenswürfel)
mastership.combatmagic.destroyerghost.desc=Vom Zauberer gewirkte Schadenszauber sind äußerst effektiv. Alle Kampfzauber des Typus Schaden kosten einen verzehrten Punkt Fokus weniger (mind. (K)2).
mastership.combatmagic.protected_caster.desc=Wenn der Zauberer den Effekt aus Defensiver Zauberer nutzt, erhält er außerdem gegen den entsprechenden Angriff zusätzlich eine Schadensreduktion in Höhe von 2 Punkten.
mastership.combatmagic.careful_aiming.desc=Der Zauberer kann die Fernkampfhandlung Zielen (siehe Splittermond: Die Regeln S. 162) bei seinen Kampfzauber-Angriffen nach den üblichen Regeln nutzen. Voraussetzung: Meisterschaft Gezielte Zauber
mastership.combatmagic.enhanced_attack.desc=Der Zauberer kann seine Kenntnisse der Kampfmagie nutzen, um seine Angriffe zu verbessern. Er kann nach einem Angriff eine sofortige Reaktion von 1 Tick Dauer durchführen und einen kanalisierten Kampfzauber abbrechen, um diesem Angriff einen Bonus in Höhe von 1 + Grad des Zaubers zu verschaffen. Dies kann auch nach einer etwaigen Aktiven Abwehr des Gegners genutzt werden.
mastership.combatmagic.unruly_disturbance.desc=Versuche, einen vom Zauberer verursachten Zustand mittels einer Probe zu beenden, erhalten einen Malus in Höhe von 5 Punkten.
mastership.combatmagic.destroyerblood.desc=Von dem Zauberer angerichteter Schaden ist besonders zerstörerisch. Alle Kampfzauber des Typus Schaden erhalten einen Schadensbonus in Höhe von (Zaubergrad -1).
mastership.combatmagic.hardtoescape.desc=Eine etwaige Aktive Abwehr gegen Kampfzauber des Zauberers erhält einen Malus in Höhe von 6 Punkten. Voraussetzung: Meisterschaft Veteran des Kampfgetümmels
mastership.combatmagic.masterofmelee.desc=Wenn der Zauberer einen Kampfzauber auslöst, kann er hierfür alle verlangsamenden Effekte (Tickzuschlag, Zustände, etc.) ignorieren.
mastership.combatmagic.destroyermind.desc=Von dem Zauberer gewirkte Schadenszauber sind äußerst effektiv. Alle Kampfzauber des Typus Schaden kosten 2 erschöpfte Punkte Fokus weniger (mind. (K)2).
mastership.combatmagic.moonsteel_concentration.desc=Wenn der Zauberer einen Kampfzauber vorbereitet, ist er immun gegen dadurch ausgelöste Gelegenheitsangriffe. Muss der Zauberer im Falle einer Störung beim Zaubervorgang eine Entschlossenheit-Probe ablegen, erhält er einen Bonus in Höhe von insgesamt 20 Punkten. Außerdem muss er keine Proben zur Abwehr des Abbruchs kanalisierter Zauber bei Überschreiten der unteren Gesundheitsstufen mehr absolvieren.
mastership.lightmagic.blinder.desc=Jeder vom Zauberer mittels seiner Lichtzauber hervorgerufene Zustand Geblendet hält 30 Ticks länger als üblich.
mastership.lightmagic.child_of_light.desc=Solange die Lichtverhältnisse um den Zauberer Tageslicht entsprechen, erhält er einen Bonus in Höhe von 2 Punkten auf das Wirken von Lichtzaubern.
mastership.lightmagic.lightsummoner.desc=Wenn der Zauberer mittels eines Lichtzaubers des Typus Beschwörung ein Wesen mit dem Merkmal Beschwörbares Wesen ruft, richtet dieses im Handgemenge immer Lichtschaden an. Außerdem erhält das Wesen einen Bonus in Höhe von 1 Punkt auf seinen Angriffswert im Nahkampf, seinen Schaden im Nahkampf, seine Lebenspunkte und seine Verteidigung. Die Lichtverhältnisse in 5 Meter Umkreis um das Wesen sind stets um 1 Stufe verbessert.
mastership.lightmagic.disrupter_of_shadows.desc=Die Lichtmagie des Zauberers behindert das Wirken von Schattenmagie. Wenn er einen Zauber des Typus Leuchten auf sich selbst kanalisiert hat, dann erhält das Wirken von Schattenzaubern im Umkreis von 10 m einen Malus in Höhe von 3 Punkten. Der Zauberer kann diese Fähigkeit unterdrücken.
mastership.lightmagic.smashing_light.desc=Der Zauberer kann seine Lichtmagie besonders gut gegen Wesen der Dunkelheit einsetzen. Alle seine Lichtzauber, die sich unmittelbar gegen Wesen der Typen Geisterwesen, Schattenwesen, Untoter oder Wesen der Finsternis richten, kosten in 2 Punkte kanalisierten oder erschöpften Fokus weniger (min. (K)1).
mastership.lightmagic.brighter_as_light.desc=Der Zauberer ist in der Lage, seine Lichtmagie perfekt zu dosieren. Wenn einer seiner Lichtzauber die Lichtverhältnisse ohne Beachtung von anderen Lichtquellen stärker als Tageslicht verbessern würde, dann kostet ihn dieser Zauber (K)2V1 Fokus weniger (min. (K)1).
mastership.lightmagic.master_of_lightcreatures.desc=Der Abenteurer erhält einen Bonus in Höhe von 3 Punkten auf Lichtzauber der Typen Beschwörung und Wesen bannen sowie auf Proben zur Interaktion mit Kreaturen des Typus Lichtwesen.
mastership.lightmagic.shining_example.desc=Der Zauberer strahlt eine solche Autorität aus, dass andere ihm gerne zuhören. Er erhält einen Bonus in Höhe von 2 Punkten auf Anführen sowie von je einen Punkt auf Darbietung und Diplomatie.
mastership.lightmagic.light_in_the_dark.desc=Die Lichtmagie des Zauberers ist besonders effektiv, wenn sie mit Schattenmagie konkurriert. Seine Lichtzauber des Typus Leuchten, die die Lichtverhältnisse verbessern, verbessern diese um 2 weitere Stufen, sofern zum Zeitpunkt des Auslösens ein Schattenzauber die Lichtverhältnisse verschlechtert.
mastership.lightmagic.lightenhancer.desc=Im Umkreis von 5 m um den Zauberer verbessern alle natürlichen Lichtquellen die Lichtverhältnisse um eine Stufe mehr als üblich.
mastership.lightmagic.shocking_light.desc=Der Zauberer kann seine Lichtzauber implodieren lassen, um seine Feinde zu schwächen. Wenn er eine sofortige Reaktion von 3 Ticks aufwendet und einen seiner kanalisierten Lichtzauber abbricht, erhalten alle Wesen in 5 m Umkreis den Zustand Geblendet. Die Stufe des Zustands entspricht dem halben Zaubergrad des abgebrochenen Zaubers (mind. 1). Für Wesen der Typen Untoter und Wesen der Finsternis beträgt die Stufe des Zustands sogar den vollen Zaubergrad des abgebrochenen Zaubers. Der Zauberer kann bis zu 3 Wesen von der Wirkung der Meisterschaft ausnehmen und ist auch selbst nicht davon betroffen.
mastership.lightmagic.nurturing_light.desc=Der Zauberer benötigt an Tagen, an denen er mindestens 6 Stunden Sonnenlicht ausgesetzt ist, keine Nahrung mehr. Wasser wird weiterhin wie üblich benötigt.
mastership.lightmagic.guardian_of_light.desc=Der Zauberer wird durch die Kraft des Lichtes vor Schaden geschützt. Von Kreaturen mit dem Merkmal Untot oder Wesen der Finsternis, sowie von Licht- und Schattenzaubern verursachter Schaden wird um 3 Punkte gesenkt.
mastership.lightmagic.arbiter_of_brightness.desc=Der Zauberer erhält nie Abzüge durch schlechte Lichtverhältnisse.
mastership.lightmagic.smasher_of_darkness.desc=Der Zauberer ist völlig von der Kraft des Lichts erfüllt. Alle seine Nahkampfangriffe und Fernkampfangriffe verursachen Lichtschaden.
mastership.naturemagic.localfauna.desc=Wenn der Zauberer einen Zauber des Typus Tier nutzt, erhält er einen Bonus in Höhe von 3 Punkten auf die Probe, sofern das tierische Ziel des Zaubers oder die Gestalt, in die er sich verwandeln will, in der aktuellen Region heimisch ist.
mastership.naturemagic.natureconjurer.desc=Wenn der Zauberer mittels eines Naturzaubers des Typus Beschwörung ein Wesen mit dem Merkmal Beschwörbares Wesen ruft, richtet dieses im Handgemenge immer Naturschaden an. Außerdem erhält das Wesen einen Bonus in Höhe von 2 Punkten auf seine Lebenspunkte sowie in Höhe von 1 Punkt auf seine Widerstände und seinen Angriffswert im Nahkampf.
mastership.naturemagic.natureprotection.desc=Der Zauberer erleidet durch die Kräfte der Natur weniger Schaden. Für ihn ist jeglicher Schaden aus entsprechenden Quellen (Steinschlag, natürliche Wettereffekte, natürlich hervorgerufene Hitze- oder Kältestufen, Lawinen und ähnliche natürliche Unglücke) sowie jeglicher Naturschaden um 5 Punkte gesenkt.
mastership.naturemagic.animalcaller.desc=Wenn der Zauberer einen Naturzauber des Typus Herbeirufung wirkt, kostet ihn dieser 2 kanalisierte Punkte Fokus weniger (min. (K)1).
mastership.naturemagic.magichardening.desc=Der Zauberer ist immun gegen natürliche Gifte (etwa von Tieren, unverarbeiteten Pflanzen, etc.) bis Grad 3, nicht aber gegen alchemistisch verarbeitete oder übernatürliche Stoffe.
mastership.naturemagic.naturecloseness.desc=Wenn der Zauberer einen Zauber der Typen Tiere, Pflanzen oder Wildnis wirkt, erhält er bei Gelingen des Zaubers einen zusätzlichen EG, sofern er die komplette Zauberdauer über ein Wesen des Typus Tier, seinen Tiervertrauten, eine Pflanze oder ein Wesen des Typus Pflanze berührt oder sich in der unberührten Wildnis aufhält (nicht kumulativ).
mastership.naturemagic.animalcompany.desc=Wenn der Zauberer von mindestens einem Wesen des Typus Tier begleitet wird, kosten ihn alle Naturzauber der Typen Tier und Vertrauter einen verzehrten Punkt Fokus weniger (min. (K)1).
mastership.naturemagic.rootsleep.desc=Der Zauberer kann in einer Ruhephase auf magische Weise Wurzeln schlagen und wird dabei zu einer baumartigen Gestalt seiner selbst (mitsamt borkigem Gesicht und ähnlichem). Hierdurch verdoppelt sich seine Regeneration innerhalb dieser Ruhephase.
mastership.naturemagic.wildernessservant.desc=Der Zauberer kann magische Energien besonders gut kontrollieren, wenn er von unberührter Natur umgeben ist. Er benötigt für seine Naturzauber (K)3V2 Fokus weniger, wenn er diese abseits der Zivilisation und unter freiem Himmel wirkt (mindestens (K)1).
mastership.naturemagic.nature_nourishment.desc=Der Zauberer benötigt an Tagen, an denen er mindestens 6 Stunden Sonnenlicht ausgesetzt ist, keine Nahrung mehr. Wasser wird weiterhin wie üblich benötigt.
mastership.naturemagic.onewithanimals.desc=Wesen des Typus Tier bis einschließlich Monstergrad 3 (als Einzelwesen) greifen den Zauberer unabhängig von ihrer normalen Natur oder ihrer Einstellung nicht an, sofern sie nicht von ihm angegriffen oder provoziert werden.
mastership.shadowmagic.efficientdisguise.desc=Der Zauberer ist in der Lage, seine Schattenmagie kraftsparend zu wirken. Wenn er bereits einen Zauber des Typus Verhüllung auf sich selbst kanalisiert, kosten ihn alle weiteren Zauber des Typus Verhüllung (K)2V1 Fokus weniger (min. (K)1).
mastership.shadowmagic.lightconjurer.desc=Wenn der Zauberer mittels eines Schattenzaubers des Typus Beschwörung ein Wesen mit dem Merkmal Beschwörbares Wesen ruft, richtet dieses im Handgemenge immer Schattenschaden an. Außerdem erhält das Wesen einen Bonus in Höhe von 1 Punkt auf seine Verteidigung und seinen Körperlichen Widerstand sowie in Höhe von 2 Punkten auf seine Schadensreduktion. Die Lichtverhältnisse in 5 Meter Umkreis um das Wesen sind stets um 1 Stufe verschlechtert.
mastership.shadowmagic.disruptor_of_light.desc=Die Schattenmagie des Zauberers behindert das Wirken von Lichtmagie. Wenn er einen Zauber des Typus Verhüllung auf sich selbst kanalisiert hat, dann erhält das Wirken von Lichtzaubern im Umkreis von 10 m einen Malus in Höhe von 3 Punkten. Der Zauberer kann diese Fähigkeit unterdrücken.
mastership.shadowmagic.unseen.desc=Der Zauberer versteht die Dunkelheit zu seinem Vorteil zu nutzen. Er erhält einen Bonus in Höhe von 2 Punkten auf seine Heimlichkeit.
mastership.shadowmagic.darker_as_shadows.desc=Der Zauberer ist in der Lage, seine Schattenmagie perfekt zu dosieren. Wenn einer seiner Schattenzauber die Lichtverhältnisse ohne Beachtung von Lichtquellen stärker als Finsternis verschlechtern würde, dann kostet ihn dieser Zauber (K)2V1 Fokus weniger (min. (K)1).
mastership.shadowmagic.master_of_shadowghosts.desc=Der Abenteurer erhält einen Bonus in Höhe von 3 Punkten auf Schattenzauber der Typen Beschwörung und Wesen bannen sowie auf Proben zur Interaktion mit Kreaturen des Typus Schattenwesen.
mastership.shadowmagic.nightlyhunter.desc=Der Zauberer erhält einen Bonus in Höhe von 2 Punkten auf seine Geschwindigkeit, sofern die Lichtverhältnisse Leichte Dunkelheit oder schlechter betragen.
mastership.shadowmagic.scaryshadows.desc=Der Zauberer kann einen seiner gewirkten Schattenzauber des Typus Verhüllung mittels einer sofortigen Reaktion von 3 Ticks abbrechen, um jedem im Umkreis von 10 m eine Entschlossenheit-Probe ablegen zu lassen, als hätte er das Monstermerkmal Furchterregend. Die Stufe des Merkmals beträgt 15 plus den doppelten Zaubergrad des abgebrochenen Zaubers. Es können so viele Wesen von der Wirkung ausgenommen werden, wie die Intuition des Zauberers beträgt.
mastership.shadowmagic.caringshadows.desc=Sofern die Lichtverhältnisse um den Zauberer Leichte Dunkelheit oder schlechter betragen, erhält er einen Bonus in Höhe von einem Punkt auf seine Schadensreduktion und von 2 Punkten auf seinen Körperlichen Widerstand.
mastership.shadowmagic.shadowsense.desc=Sofern die Lichtverhältnisse um den Zauberer Leichte Dunkelheit oder schlechter betragen, erhält er einen Bonus in Höhe von 5 Punkten auf alle Wahrnehmung-Proben, die nicht die Sicht betreffen.
mastership.shadowmagic.matterveiler.desc=Alle am Leib des Zauberers getragenen Gegenstände erhalten die Verbesserung Unauffällig 1 (siehe Mondstahlklingen S. 90).
mastership.fatemagic.godly_conjurer.desc=Wenn der Zauberer mittels eines Schicksalszaubers des Typus Beschwörung ein Wesen mit dem Merkmal Beschwörbares Wesen ruft, erhält dieses einen Bonus in Höhe von 1 Punkt auf ihre Widerstände sowie in Höhe von 2 Punkten auf seinen Angriffswert im Nahkampf. Außerdem erhält das Wesen eine zusätzliche Meisterschaft, deren Schwelle so bestimmt wird, als wäre es mittels des Baukastens auf S. 196 erschaffen worden.
mastership.fatemagic.fate_aware.desc=Der Der Zauberer ist sich seines eigenen Schicksals bewusst und ist daher gegen Eingriffe in ebenjenes resistent. Alle direkt gegen ihn gerichteten Schicksalszauber erhalten einen Malus in Höhe von 3 Punkten, sofern er nicht freiwillig darauf verzichtet.
mastership.fatemagic.self_blessing.desc=Der Zauberer kann Zauber des Typus Segen, die er auf andere spricht, für die halben Kosten und ohne weiteren Zeitaufwand auf sich selbst ausdehnen.
mastership.fatemagic.personalized_curse.desc=Wenn der Zauberer eine materielle Verbindung zum Ziel (z.B. Büschel Haare, Fingernägel, Blut) besitzt, kosten ihn Schicksalszauber des Typus Fluch gegen dieses Ziel einen verzehrten Punkt Fokus weniger (min. (K)1).
mastership.fatemagic.fate_knowledge.desc=Wenn ein Wesen die Meisterschaft Unbeirrbar oder die Stärke Zielstrebig besitzt, kann der Zauberer einen Punkt Fokus erschöpfen und eine Probe auf Empathie gegen den Geistigen Widerstand des Ziels ablegen, um das Ziel der Meisterschaft oder Stärke zu erfahren. Nach Maßgabe des Spielleiters kann dies auch bei Wesen ohne die Stärke oder Meisterschaft, aber mit starkem Ziel genutzt werden; in diesem Fall erhält die Probe jedoch einen stark negativen Umstand.
mastership.fatemagic.blessed.desc=Der Zauberer hat immer wieder unverschämtes Glück, findet zufällig Wertgegenstände, erhält von Fremden Sachen geschenkt und ähnliches. Er kann ein weiteres Mal pro Jahr sein verfügbares Geld (siehe Splittermond: Die Regeln S. 77) nutzen, ohne dass dadurch sein Lebensstil eingeschränkt wird. Sein Vermögen gilt hierfür mindestens als 2, selbst wenn er eigentlich einen niedrigeren Wert darin besitzt
mastership.fatemagic.leased_luck.desc=Das Glück des Zauberers ist so groß, dass er mitunter sogar zufällig auf Freunde trifft, Leute ihn spontan ins Herz schließen, er einen Unterschlupf findet und ähnliches. Einmal pro Spielsitzung kann er einen Splitterpunkt ausgeben, um für eine Szene temporär bis zu 3 Punkte einer der Ressourcen Ansehen, Kontakte oder Zuflucht zu simulieren.
mastership.fatemagic.curse_master.desc=Wenn der Zauberer einen Zauber des Typus Fluch wirkt, der Mali auf Proben oder abgeleitete Werte verleiht, erhöhen sich diese Mali um einen Punkt. Auch durch solche Zauber verliehene Zustände werden um eine Stufe erhöht (mit Ausnahme von Sterbend 2).
mastership.fatemagic.prophet.desc=Der Zauberer erhält einen Bonus in Höhe von 3 Punkten auf alle Zauber des Typus Prophezeiung, auf Proben zum Wahrsagen sowie um nicht überrascht zu werden.
mastership.fatemagic.grand_curse_master.desc=Der Zauberer kann von ihm gewirkte Zauber des Typus Fluch mit dem Zustand Siechtum 2 verbinden, wodurch diese so lange halten, bis ein Gegenmittel verabreicht wurde. Er kann dabei nur ein Ziel gleichzeitig mit einem entsprechenden Fluch belegen, den Fluch aber auch nach eigenem Willen aufheben. Sein Tod beendet einen entsprechenden Fluch nicht.
mastership.fatemagic.owns_fate_master.desc=Der Zauberer kann sich Eingriffen in sein Schicksal widersetzen. Wenn ein Schicksalszauber ihn betreffen würde, kann er als sofortige Reaktion von 3 Ticks Dauer eine Entschlossenheit-Probe gegen die um 3 Punkte erhöhte ursprüngliche Schwierigkeit des Zaubers ablegen. Gelingt die Probe, hängen die Auswirkungen vom Ziel des Zaubers ab. Sofern er nicht das einzige und unmittelbare Ziel des Zaubers war, betrifft die Wirkung des Zaubers ihn nicht. Ist er direktes und einziges Ziel des Zaubers, gilt der Zauber als knapp misslungen.
mastership.protectionmagic.hastyprotection2.desc=Der Zauberer muss keinen Fokus verzehren, um die Wirkung von Eiliger Schutz zu nutzen.
mastership.protectionmagic.protective_knowledge.desc=Wenn ein Schutzzauber des Zauberers auch in anderen Magieschulen gelernt und gewirkt werden kann, kostet der Zauber ihn (K)2V1 Punkte weniger, sofern er selbst mindestens 3 Fertigkeitspunkte in der jeweils anderen Magieschule besitzt.
mastership.protectionmagic.protection_bloodcreature.desc=Der Zauberer hat gelernt, sich gegen bestimmte magische Wesenheiten zur Wehr zu setzen. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Angriffe entsprechender Wesen gegen ihn erhalten einen Malus in Höhe von 2 Punkten. Diese Meisterschaft ist mehrfach wählbar, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.protectionmagic.protection_stonecreature.desc=Der Zauberer hat gelernt, sich gegen bestimmte magische Wesenheiten zur Wehr zu setzen. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Angriffe entsprechender Wesen gegen ihn erhalten einen Malus in Höhe von 2 Punkten. Diese Meisterschaft ist mehrfach wählbar, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.protectionmagic.protection_firecreature.desc=Der Zauberer hat gelernt, sich gegen bestimmte magische Wesenheiten zur Wehr zu setzen. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Angriffe entsprechender Wesen gegen ihn erhalten einen Malus in Höhe von 2 Punkten. Diese Meisterschaft ist mehrfach wählbar, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.protectionmagic.protection_ghostcreature.desc=Der Zauberer hat gelernt, sich gegen bestimmte magische Wesenheiten zur Wehr zu setzen. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Angriffe entsprechender Wesen gegen ihn erhalten einen Malus in Höhe von 2 Punkten. Diese Meisterschaft ist mehrfach wählbar, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.protectionmagic.protection_godservant.desc=Der Zauberer hat gelernt, sich gegen bestimmte magische Wesenheiten zur Wehr zu setzen. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Angriffe entsprechender Wesen gegen ihn erhalten einen Malus in Höhe von 2 Punkten. Diese Meisterschaft ist mehrfach wählbar, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.protectionmagic.protection_lightcreature.desc=Der Zauberer hat gelernt, sich gegen bestimmte magische Wesenheiten zur Wehr zu setzen. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Angriffe entsprechender Wesen gegen ihn erhalten einen Malus in Höhe von 2 Punkten. Diese Meisterschaft ist mehrfach wählbar, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.protectionmagic.protection_naturecreature.desc=Der Zauberer hat gelernt, sich gegen bestimmte magische Wesenheiten zur Wehr zu setzen. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Angriffe entsprechender Wesen gegen ihn erhalten einen Malus in Höhe von 2 Punkten. Diese Meisterschaft ist mehrfach wählbar, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.protectionmagic.protection_shadowcreature.desc=Der Zauberer hat gelernt, sich gegen bestimmte magische Wesenheiten zur Wehr zu setzen. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Angriffe entsprechender Wesen gegen ihn erhalten einen Malus in Höhe von 2 Punkten. Diese Meisterschaft ist mehrfach wählbar, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.protectionmagic.protection_watercreature.desc=Der Zauberer hat gelernt, sich gegen bestimmte magische Wesenheiten zur Wehr zu setzen. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Angriffe entsprechender Wesen gegen ihn erhalten einen Malus in Höhe von 2 Punkten. Diese Meisterschaft ist mehrfach wählbar, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.protectionmagic.protection_creature_darkness.desc=Der Zauberer hat gelernt, sich gegen bestimmte magische Wesenheiten zur Wehr zu setzen. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Angriffe entsprechender Wesen gegen ihn erhalten einen Malus in Höhe von 2 Punkten. Diese Meisterschaft ist mehrfach wählbar, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.protectionmagic.protection_windcreature.desc=Der Zauberer hat gelernt, sich gegen bestimmte magische Wesenheiten zur Wehr zu setzen. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Angriffe entsprechender Wesen gegen ihn erhalten einen Malus in Höhe von 2 Punkten. Diese Meisterschaft ist mehrfach wählbar, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.protectionmagic.stacked_protection.desc=Sofern bereits mindestens ein Schutzzauber auf dem Zauberer liegt, kosten ihn alle weiteren auf sich selbst gewirkten Schutzzauber (K)1V1 Fokus weniger (mindestens (K)1).
mastership.protectionmagic.strong_protection.desc=Wenn ein Schutzzauber des Zauberers einen Bonus auf Proben oder abgeleitete Werte verleiht, steigt dieser Bonus um einen Punkt.
mastership.protectionmagic.spell_identification.desc=Wenn ein Zauber von einem aktiven Schutzzauber des Zauberers aktiv beeinflusst wird, identifiziert er diesen ohne weiteren Zeitaufwand automatisch mit 0 Erfolgsgraden, sofern der Zauber maximal denselben Zaubergrad aufweist wie der entsprechende Schutzzauber. Der Zauberer erfährt (etwa, wenn er den Zaubervorgang nicht beobachtet hat) nicht automatisch, von wem der Zauber gesprochen wurde.
mastership.protectionmagic.close.desc=Wenn der Zauberer durch eine Aktive Abwehr einen Streiftreffer herbeigeführt hat, trifft der entsprechende Angriff stattdessen gar nicht.
mastership.protectionmagic.magic_defender.desc=Der Zauberer kann eine Aktive Abwehr gegen Zauber für Verbündete im Umkreis von 5 m durchführen, sofern er sich des magischen Angriffs bewusst ist. Sofern er den entsprechenden Zauber noch nicht identifiziert hat, erhält diese Probe einen Malus in Höhe von 3 Punkten.
mastership.protectionmagic.granted_protection.desc=Alle bereits von ihm auf ihn selbst gewirkten kanalisierten Schutzzauber des Zauberers können als sofortige Reaktion von 5 Ticks Dauer für 30 Ticks an ein anderes Ziel innerhalb der Wirkungsweite kanalisierter Zauber verliehen werden. Das neue Ziel unterliegt dem Zauber, als wäre er auf es selbst gezaubert worden. Während der Zauber verliehen ist, ist der Zauberer selbst nicht von der Schutzwirkung betroffen. Wenn der Zauberer diese Meisterschaft nutzt, erhält er den Zustand Erschöpft 1.
mastership.protectionmagic.thorny_protection.desc=Sofern der Zauberer einem Schutzzauber unterliegt, der ihm Schadensreduktion verleiht, fügt er dem Verursacher jedes erfolgreichen Nahkampfangriffes gegen ihn Schaden in Höhe der durch Schutzzauber verliehenen Schadensreduktion zu.
mastership.protectionmagic.shared_protection.desc=Wenn der Zauberer die Meisterschaft Verliehene Schutzwirkung nutzt, ist er weiterhin von der Wirkung seines Zaubers betroffen. Außerdem unterliegt er nicht mehr dem Zustand Erschöpft 1 und benötigt nur 3 Ticks für die sofortige Reaktion.
mastership.enhancemagic.tightened_morale.desc=Wenn der Zauberer unter einem eigenen Stärkungszauber des Typus Moral steht, erhält er einen Bonus in Höhe von 2 Punkten auf alle Versuche, die Moral anderer Personen zu erhöhen. Andere Wesen unter entsprechenden Zaubern des Zauberers erhalten außerdem einen Bonus in Höhe von 2 Punkten auf alle Proben, um Furcht und Angst zu widerstehen.
mastership.enhancemagic.magic_and_craftmanship.desc=Wenn der Zauberer während der Herstellung oder Reparatur eines Gegenstandes mindestens einen passenden Zauber des Typus Handwerk stärken oder Objekt anwendet, zählt dies als leicht positiver Umstand auf alle passenden Proben.
mastership.enhancemagic.acuteness.desc=Wenn der Zauberer einen Stärkungszauber des Typus Sinne zaubert, durch den er einen Probenbonus erhält, kann er für entsprechende Proben außerdem einen eventuell vorliegenden negativen Umstand nach Wahl ignorieren.
mastership.enhancemagic.overall_senses.desc=Wenn der Zauberer einen Stärkungszauber des Typus Sinne zaubert, durch den er oder ein anderes Ziel einen Probenbonus auf einen einzelnen Sinn erhält, erhält das Ziel den halben Probenbonus auch auf seine anderen Sinne. Wenn ein Zauber des Typus Sinne einen Bonus auf alle Sinne verleiht, erhält hingegen ein einzelner beim Zaubervorgang ausgewählter Sinn diesen Bonus.
mastership.enhancemagic.steely_morale.desc=Der Zauberer gerät niemals in Panik, solange er unter dem Einfluss eines Stärkungszaubers des Typus Moral steht. Sollte er in so einem Fall von dem Zustand Panisch betroffen werden, wird dieser in den Zustand Angsterfüllt umgewandelt.
mastership.enhancemagic.longterm_overload.desc=Wenn der Zauberer mittels der Meisterschaft Überlasten einen Stärkungszauber verstärkt, kann er diesen für insgesamt 60 Ticks aktiv halten.
mastership.enhancemagic.shared_advantage.desc=Der Zauberer kann den Effekt der Meisterschaft Eigener Vorteil auch nutzen, um einen Zauber auf eine andere innerhalb von 5 m befindliche freiwillige Person auszudehnen.
mastership.enhancemagic.forcetransfer.desc=Wenn der Zauberer einen Zauber des Typus Schwächung auf ein Wesen zaubert, das dadurch einen Malus auf Proben erhält, erhält er einen Bonus in Höhe des Malus des Ziels auf exakt jene Fertigkeiten, die vom Malus betroffen sind. (Dieser Bonus zählt als Zaubereibonus)
mastership.enhancemagic.magic_runes.desc=Wenn der Zauberer einen Zauber mittels der Meisterschaft Magische Zeichen wirkt, benötigt er keine EG zur Aktivierung der Verstärkung (sehr wohl aber weiterhin entsprechende Fokuskosten).
mastership.enhancemagic.absolute_awareness.desc=Der Zauberer hat seine Sinne durch seine Magie maximal geschärft. Solange er einen Zauber des Typus Sinne auf sich selbst gewirkt hat, ist er immun gegen Gelegenheitsangriffe.
mastership.enhancemagic.spelladvantage.desc=Der Zauberer ist in der Lage, natürliche Grenzen der Magie zu sprengen. Der maximale Bonus auf Proben und abgeleitete Werte durch Zauberei ist für seine eigenen Zauber um 2 Punkte erhöht.
mastership.deathmagic.ghostcreature_conjurer.desc=Wenn der Zauberer mittels eines Todeszaubers des Typus Beschwörung ein Wesen mit dem Merkmal Beschwörbares Wesen ruft, erhält dieses einen Bonus in Höhe von 2 Punkten auf seine Schadensreduktion sowie in Höhe von 1 Punkt auf seine Verteidigung und seinen Körperlichen Widerstand. Außerdem erhält das Wesen das Merkmal Erschöpfungsresistenz 2 (falls vorhanden: +2).
mastership.deathmagic.undead_classicist.desc=Der Zauberer erhält einen Bonus in Höhe von 3 Punkten auf Proben, um Wesen des Typus Untoter zu bemerken oder zu identifizieren.
mastership.deathmagic.curse_of_curses.desc=Der Zauberer kann erfolgreich gewirkte Todeszauber des Typus Fluch (bis maximal Zaubergrad 4) auf ein weiteres Ziel ausdehnen, das einen gleich hohen oder niedrigeren Widerstand hat als das primäre Ziel. Für das zweite Ziel fallen nur die halben Fokuskosten an.
mastership.deathmagic.inspired_by_ghosts.desc=Solange sich mindestens ein Wesen des Typus Geisterwesen im Umkreis von 10 m um den Zauberer befindet und ihm dieser Umstand bekannt ist, muss er für alle Zauber des Typus Geisterwesen einen verzehrten Punkt Fokus weniger aufwenden als üblich (min. (K)1).
mastership.deathmagic.necromantic_dulling.desc=Der Zauberer ist immun gegen das Merkmal Furchterregend, wenn das entsprechende Wesen den Typus Geisterwesen oder Untoter besitzt. Voraussetzung: Meisterschaft Nekromant
mastership.deathmagic.undead_presence.desc=Der Zauberer zieht aus der Anwesenheit von Untoten Kraft für seine Zauber. Solange sich mindestens ein Wesen des Typus Untoter im Umkreis von 10 m befindet und ihm dieser Umstand bekannt ist, erhalten alle seine Zauber des Typus Nekromantie einen Bonus in Höhe von 4 Punkten.
mastership.deathmagic.ageless.desc=Der Zauberer zeigt keine äußerlichen Alterserscheinungen mehr und wirkt immer so alt wie in der Blüte seiner Jahre. Auf sonstige Auswirkungen hohen Alters hat dies keinen Einfluss.
mastership.deathmagic.fast_undead.desc=Vom Zauberer erhobene Untote sowie seine Kreaturen mit dem Merkmal Untot erhalten einen Bonus in Höhe von 2 Punkten auf ihre Geschwindigkeit.
mastership.deathmagic.master_abnormities.desc=Der Nekromant ist in der Lage, Untote bei der Erhebung mit Abnormitäten (siehe S. 183) zu versehen.
mastership.deathmagic.graceful_skeleton.desc=Die vom Zauberer erhobenen Untoten sind nicht immer modrig und verfault, sondern können auch sauber oder gepflegt erscheinen. Sofern der Zauberer dies wünscht, erhalten sie AUS +1 und Darbietung +3.
mastership.deathmagic.dancing_dead.desc=Der Nekromant ist in der Lage, mehrere Untote gleichzeitig zu erwecken. Wenn er einen Todesmagie-Zauber des Typus Nekromantie verwendet, der Untote erhebt, kann er sich – sofern genug Rohmaterial vorhanden ist – entscheiden, stattdessen zu gleichen Kosten bis zu der dreifachen Anzahl Untote zu erheben. Diese haben ihre üblichen Werte, aber zusätzlich das Merkmal Zerbrechlich. Verfügt der Nekromant auch über die Meisterschaft Meister der Untoten, kann er mittels Totentanz bis zu der sechsfachen Anzahl Untote mit dem Merkmal Zerbrechlich erheben.
mastership.deathmagic.hard_to_banish.desc=Zauber, die vom Zauberer erhobene Untote bannen oder ihnen Mali verleihen, erhalten einen Malus in Höhe von 3 Punkten.
mastership.deathmagic.spontaneous_graverobbery.desc=Der Nekromant kann Untote besonders schnell erheben, diese sind dafür aber weniger robust. Er kann sich dazu entscheiden, einen Todesmagie-Zauber des Typus Nekromantie anstatt als Ritus als Spruch zu wirken. Die Zauberdauer beträgt in diesem Fall Zaubergrad mal 10 Ticks. Die erhobenen Untoten erhalten einen Malus in Höhe von 3 Punkten auf ihre Verteidigung und das Merkmal Zerbrechlich. Besitzen sie das Merkmal bereits, sinken stattdessen ihre Lebenspunkte auf 1.
mastership.deathmagic.undead_hordes.desc=Für jeden im Umkreis von MYS + 10 m befindlichen vom Nekromanten erhobenen Untoten erhält der Angriffswert aller von ihm erhobener Untoten (sofern sie sich nicht weiter als MYS + 10 m vom Zauberer entfernt befinden) einen Bonus in Höhe von je 1 Punkt. Der maximale Bonus beträgt 3 + Heldengrad des Nekromanten.
mastership.deathmagic.undead_onslaught.desc=Alle vom Zauberer erhobenen Untoten erhalten die Meisterschaft Vorstürmen (sofern noch nicht vorhanden).
mastership.deathmagic.rise.desc=Die Zauberdauer jedes Todesmagie-Zaubers des Typus Nekromantie ist halbiert. Bei gleichzeitigem Besitz der Meisterschaft Spontaner Grabraub sinkt die Zauberdauer bei Nutzung derselben auf Zaubergrad mal 5 Ticks.
mastership.deathmagic.corpseteacher.desc=Alle von dem Nekromanten erhobenen Untoten starten mit Verstand 1. Dadurch können sie auch komplexe Befehle (siehe S. 180) ausführen.
mastership.deathmagic.master_undead_hordes.desc=Wenn der Nekromant durch die Verstärkung seiner Zauber, durch magische Labore oder sonstigen Elemente Erfahrungspunkte erhält, um erhobene Untote zu verbessern, wird diese Menge verdreifacht.
mastership.transformationmagic.hard_to_see_through.desc=Wenn der Zauberer einen Verwandlungszauber des Typus Impersonation nutzt, erhalten alle Proben, um ihn zu enttarnen, zu erkennen oder den entsprechenden Zauber zu identifizieren, einen Malus in Höhe von 2 Punkten.
mastership.transformationmagic.splendid_animalform.desc=Wenn der Zauberer sich in ein Wesen des Typus Tier verwandelt, erhält er auf alle Proben auf allgemeine Fertigkeiten in dieser Gestalt einen Bonus in Höhe von 2 Punkten. Dieser Bonus zählt im Rahmen der maximalen Boni auf Proben als magischer Bonus.
mastership.transformationmagic.form_stability.desc=Sofern der Zauberer einen Verwandlungszauber des Typus Objekt auf einen Gegenstand wirkt, wird (sofern der Zauberer dies wünscht) die Härte des Gegenstands um 2 Punkte erhöht, und alle Versuche, den oder die entsprechenden Zauber zu bannen, erhalten einen Malus in Höhe von 2 Punkten.
mastership.transformationmagic.accustomed_form.desc=Alle Verwandlungszauber des Typus Gestalt kosten den Zauberer einen verzehrten Punkt Fokus weniger (min. (K)1), sofern er sich in ein Wesen verwandelt, für das er die Meisterschaft Bevorzugte Gestalt besitzt.
mastership.transformationmagic.harmonized_transformation.desc=Hat der Zauberer bereits einen oder mehrere Verwandlungszauber auf sich gewirkt, der nicht den Typus Gestalt aufweist, sind die Kosten für alle weiteren auf sich selbst gewirkten Verwandlungszauber, die mindestens einen Typus mit einem bereits gewirkten Zauber teilen, um (K)2V1 Punkte reduziert.
mastership.transformationmagic.fighting_form.desc=Wenn der Zauberer sich in ein Wesen des Typus Tier verwandelt, für das er die Meisterschaft Bevorzugte Gestalt besitzt, erhält er auf Nahkampfangriffe in dieser Gestalt einen Bonus in Höhe von 3 Punkten. Dieser Bonus zählt im Rahmen der maximalen Boni auf Proben als magischer Bonus.
mastership.transformationmagic.mighty_form.desc=Wenn der Zauberer sich in ein Wesen des Typus Tier verwandelt, für das er die Meisterschaft Bevorzugte Gestalt besitzt, erhält er auf alle Proben auf allgemeine Fertigkeiten in dieser Gestalt einen Bonus in Höhe von insgesamt 4 Punkten. Dieser Bonus zählt im Rahmen der maximalen Boni auf Proben als magischer Bonus.
mastership.transformationmagic.magic_crafter1.desc=Der Zauberer hat gelernt, Materie so zu formen, dass er somit einfache Gegenstände erschaffen kann. Er kann Proben zur Herstellung und Reparatur von Gegenständen mit Verwandlungsmagie statt Handwerk durchführen. Für alle regeltechnischen Belange wird er bei solchen Proben behandelt, als würde er die Meisterschaft Geselle für alle mit Handwerk bearbeitbaren Materialien besitzen. Dies gilt auch für die Frage, Gegenstände welcher Komplexität er erschaffen kann. Es muss ausreichend Material der entsprechenden Art zur Verfügung stehen.
mastership.transformationmagic.second_skin.desc=Wenn der Zauberer Verwandlungsmagie des Typus Impersonation anwendet, ist seine Tarnung so glaubwürdig, dass er einen Bonus in Höhe von 4 Punkten auf Redegewandtheit-Proben erhält, um andere von seiner Identität zu überzeugen.
mastership.transformationmagic.eternal_form.desc=Soll ein Verwandlungszauber des Zauberers gebannt werden, steigen die Kosten hierfür um 4V4 Punkte.
mastership.transformationmagic.magic_crafter2.desc=Der Zauberer wird im Rahmen der Meisterschaft Magischer Handwerker I behandelt, als würde er die Meisterschaft Fachmann für alle mit Handwerk bearbeitbaren Materialien besitzen.
mastership.transformationmagic.master_of_objects.desc=Der Zauberer ist in der Lage, von ihm benutzte Gegenstände leicht zu verändern und somit zu verbessern. Sofern er einen Gegenstand benutzt, kann er eine kontinuierliche Aktion Gegenstand verwenden aufwenden und 2 Punkte Fokus kanalisieren, um dem Gegenstand eine der folgenden Verbesserungen zu verleihen (sofern passend): Härte +2, Fertigkeitsbonus auf passenden Schwerpunkt +1, Last -2, Schaden +2, WGS -1, SR +1, Behinderung -1. Dies hält nur solange an, wie der Zauberer den Gegenstand am Körper trägt und den Fokus kanalisiert. Es können mehrere Gegenstände verbessert werden, wofür jedes Mal eine separate Aktion sowie Fokus nötig sind.
mastership.watermagic.flood_guider.desc=Der Zauberer ist besonders effektiv darin, Wasser zu manipulieren. Alle Wasserzauber des Typus Elementarkontrolle kosten ihn (K)2V1 Fokus weniger (min. (K)1).
mastership.watermagic.cold_aura.desc=Vom Zauberer gewirkte Zauber des Typus Eis erhöhen die Kältestufe oder senken die Hitzestufe in 5 m Umkreis um das Ziel um 1 Stufe. Bei kanalisierten Zaubern gilt dies, solange der Zauber anhält, ansonsten für 30 Ticks.
mastership.watermagic.water_summoner.desc=Wenn der Zauberer mittels eines Wasserzaubers des Typus Beschwörung ein Wesen mit dem Merkmal Beschwörbares Wesen ruft, richtet dieses im Handgemenge immer Eis-, Säure- oder Wasserschaden an (muss bei Beschwörung des Wesens festgelegt werden). Außerdem erhält das Wesen einen Bonus in Höhe von 2 Punkten auf seine Verteidigung sowie in Höhe von 1 Punkt auf seine Lebenspunkte und seinen Körperlichen Widerstand. Seine Initiative ist um 3 Punkte gesenkt.
mastership.watermagic.icy_surrounding.desc=Alle Wasserzauber des Typus Eis kosten den Zauberer 2 kanalisierte oder erschöpfte Punkte Fokus weniger (min. (K)1), sofern die Kältestufe mindestens 1 beträgt.
mastership.watermagic.friend_of_fishes.desc=Der Zauberer hat ein enges Band zu den Wesen der Meere und Flüsse. Alle Wesen mit den Merkmalen Amphibisch, Taucher oder Unterwasserwesen haben ihm gegenüber eine um eine Stufe verbesserte Einstellung. Außerdem kann sich der Abenteurer unter Wasser so verständigen wie an Land (das Gegenüber muss seine Sprache wie üblich verstehen können).
mastership.watermagic.secrete_poison.desc=Der Zauberer verdünnt ein eingenommenes oder in die Blutbahn gelangtes Gift durch seine eigenen Körperflüssigkeiten so sehr, dass es ausgeschieden werden kann, ohne größeren Schaden anzurichten. Das Gift wirkt so, als hätte es einen um 1 verringerten Giftgrad.
mastership.watermagic.master_icy_terrain.desc=Bei Verwendung der Reiseregeln kann der Zauberer für von ihm begleitete Gruppen alle Abzüge der Reisegeschwindigkeit durch Schnee und Eis ignorieren.
mastership.watermagic.overwhelming_tides.desc=Von dem Zauberer herbeigerufenes Eis, Säure und Wasser ist besonders schmerzhaft. Alle Wasserzauber des Typus Schaden verursachen 1 zusätzlichen Punkt Kälte-, Säure- oder Wasserschaden (selbe Art wie beim Zauber).
mastership.watermagic.wave_conqueror.desc=Der Zauberer hat die Fluten gemeistert und fühlt sich in ihnen zu Hause. Er erhält einen Bonus in Höhe von 2 Punkten auf alle Schwimmen- und Seefahrt-Proben.
mastership.watermagic.conqueror_of_dryness.desc=Der Zauberer zieht alle Flüssigkeit, die er benötigt, direkt aus seiner Magie. Er erleidet niemals Durst und muss keine zusätzliche Flüssigkeit mehr zu sich nehmen, um zu überleben.
mastership.watermagic.quencher_of_flames.desc=Der Zauberer ist besonders geübt darin, mit seiner Wassermagie Feuer zu beeinflussen. Er erhält einen Bonus in Höhe von 5 Punkten auf alle Proben, um Feuer zu löschen oder einzudämmen, auf seine direkt einen Feuerzauber beeinflussenden Zauber (etwa im Falle von Bannmagie) sowie auf seine schädigenden Zauber, die auf Wesen des Typus Feuerwesen gewirkt werden.
mastership.watermagic.master_of_frost.desc=Dem Zauberer vermag Kälte kaum etwas anzuhaben. Er ist immun gegen die Auswirkungen von Kältestufen.
mastership.watermagic.one_with_waves.desc=Der Zauberer ist unter Wasser so zu Hause wie an Land. Er kann unter Wasser atmen, seine Geschwindigkeit im Wasser erhöht sich um 2 Punkte, die Initiative sinkt dort um 2 Punkte. Alle Schwimmen-Proben erhalten einen Bonus in Höhe von 2 Punkten.
mastership.watermagic.ally_of_fishes.desc=Die Wesen der Flüsse und Meere würden dem Zauberer niemals ein Leid antun. Wesen mit den Merkmalen Amphibisch, Taucher oder Unterwasserwesen greifen den Zauberer niemals an, sofern dieser sie nicht zuerst angreift. Wesen mit einem Verstand von mindestens 3 sind gegen die Auswirkungen dieser Meisterschaft immun.
mastership.windmagic.good_nose.desc=Der Abenteurer nimmt auch sehr schwache Gerüche wahr, etwa den eines Brandes in einiger Entfernung oder den feinsten Hauch giftiger Pollen in der Luft. Alle Wahrnehmung- Proben zum Riechen sind um 4 Punkte erleichtert.
mastership.windmagic.fanned_by_wind.desc=Alle Windzauber des Typus Elementarkontrolle kosten den Zauberer einen verzehrten Punkt Fokus weniger (min. (K)1), solange er sich an der freien Luft (also außerhalb von Gebäuden, etc.) aufhält.
mastership.windmagic.weatherproof.desc=Der Zauberer kann bei allen Proben leicht negativen Umstand durch das Wetter ignorieren.
mastership.windmagic.wind_summoner.desc=Wenn der Zauberer mittels eines Windzaubers des Typus Beschwörung ein Wesen mit dem Merkmal Beschwörbares Wesen ruft, richtet dieses im Handgemenge immer Elektrizitäts- oder Windschaden an (muss bei der Beschwörung des Wesens festgelegt werden). Außerdem erhält das Wesen einen Bonus in Höhe von 3 Punkten auf seine Geschwindigkeit, in Höhe von 2 Punkten auf seine Verteidigung und in Höhe von 1 Punkt auf seinen Angriffswert im Nahkampf. Das Wesen erhält die Meisterschaf Handgemenge (I: Vorstürmen).
mastership.windmagic.whispering_wind.desc=Der Wind trägt manchmal auch weit entfernte Geräusche zum Zauberer. Er kann einen Splitterpunkt einsetzen, um einen Bonus in Höhe seiner Fertigkeitspunkte in Windmagie auf eine Wahrnehmung-Probe zum Hören zu erhalten.
mastership.windmagic.master_thunderstorms.desc=Der Zauberer ist in der Lage, Blitz und Donner besonders effektiv zu nutzen. Alle Zauber des Typus Elektrizität kosten ihn (K)1V1 Fokus weniger (mind. 1).
mastership.windmagic.deep_breath.desc=Der Zauberer kann doppelt so lange die Luft anhalten, wie es ihm normalerweise möglich wäre.
mastership.windmagic.carried_by_wind.desc=Wenn der Zauberer sich mittels eines Zaubers mit mindestens GSW 1 aktiv durch die Lüfte bewegt, kann er seine dabei genutzte Geschwindigkeit um 4 Punkte erhöhen.
mastership.windmagic.friend_of_the_sky.desc=Der Zauberer fühlt sich besonders wohl, wenn die Winde ihn umschmeicheln. Wenn der Zauberer freien Himmel über sich hat, erhält er einen Bonus in Höhe von einem Punkt auf alle Proben auf allgemeine Fertigkeiten. Außerdem sinkt unter solchen Umständen seine Initiative um einen Punkt.
mastership.windmagic.flight_knowledge.desc=Der Zauberer weiß aus eigener Erfahrung, wie er mit fliegenden Gegnern umzugehen hat. Gegner mit der Kampfposition Fliegend erhalten gegen ihn niemals Boni aus dieser Kampfposition.
mastership.windmagic.wings_of_the_storm.desc=Die Winde tragen die Geschosse des Zauberers besonders weit. Die Grundreichweite aller seiner Fernkampfangriffe sowie Windzauber wird verdoppelt.
mastership.windmagic.one_with_the_wind2.desc=Die Geschwindigkeit erhöht sich um 1, die Initiative sinkt um 1. Alle Proben zum Klettern, Springen, Abrollen, Balancieren, dem Überwinden von Hindernissen und zur Aktiven Abwehr mittels Akrobatik erhalten einen Bonus in Höhe von 3 Punkten.
mastership.windmagic.free_breath.desc=Der Zauberer benötigt keine Luft mehr zum Überleben, er ist entsprechend auch immun gegen Ersticken.

power.intuitive_attunement.desc=Der Zauberer geht bei der Einstimmung auf Artefakte nicht so analytisch vor wie manch andere. Er kann bei der Berechnung seiner Artefaktkapazität den Wert eines seiner Attribute AUS, INT oder WIL dazuzählen.
power.fast_attunement.desc=Der Zauberer ist in der Lage, sich besonders schnell auf Artefakte einzustimmen. Hierfür benötigt er nur eine Verschnaufpause statt wie sonst üblich eine Ruhephase.

resource.golem=Golems sind selten, finden sich aber dennoch im Besitz so manches Lorakiers. Ein mit dem Großen Ritus erweckter und somit über die Ressource Golem erworbener Golem ist dauerhaft animiert. Nach Ausgabe der Erfahrungspunkte kann der Besitzer (neben den Instruktionen Folge und Warte) eine Instruktion aktivieren sowie so viele Verfügungen aktivieren, wie die Stufe des Merkmals Golem beträgt (mind. 1).\nDie aktiven Instruktionen und Verfügungen kann der Besitzer nur nachträglich wechseln, sofern er die Meisterschaft Spontane Unterweisung besitzt (oder jemand anderen aufsucht, der diese Meisterschaft besitzt). Der Golem kann eine Applikation pro Stufe des Merkmals Golem wählen (und darüber beispielsweise auch weitere In­struktionen implementieren). Auch Schwachstellen können gewählt werden (mit allen zugehörigen Auswirkungen), was jedoch die Zustimmung des Spielleiters voraussetzt.\nEin Punkt in der Ressource Golem entspricht einer Stufe im Merkmal Golem.

spell.fit.descr=Objekt passt Zauberer wie angegossen
spell.fit.enhancedescr=Objekt ist für ihn personalisiert (MSK S. 99)
spell.breathcontrol.descr=Zauberer stellt Atemholen wieder her
spell.breathcontrol.enhancedescr=Atemholen wird sofort ausgeführt
spell.stun.descr=Ziel erleidet 1W6 Betäubungsschaden
spell.stun.enhancedescr=Schaden +1
spell.counter_blind.descr=unterdrückt 2 Stufen des Zustands Geblendet
spell.counter_blind.enhancedescr=insgesamt 3 Stufen
spell.wakeup.descr=Ziel verliert Zustand Bewusstlos/Schlafend
spell.wakeup.enhancedescr=Ziel heilt 3 Betäubungsschaden
spell.stone_writing.descr=lässt mit Finger Nachricht in Felsen schreiben
spell.stone_writing.enhancedescr=Inschrift bleibt dauerhaft
spell.finger_protection.descr=Zauberer kann heiße Objekte berühren
spell.finger_protection.enhancedescr=aller Feuerschaden -1
spell.focustrap.descr=Zauber gegen Zauberer kosten +1 erschöpften/ kanalisierten Fokus
spell.focustrap.enhancedescr=außerdem \u22121 auf Zauberproben
spell.focussed_motion.descr=+1 auf Sicherheitswürfe mit BEW
spell.focussed_motion.enhancedescr=insgesamt +2
spell.slippery.descr=Zauberer erhält +2 auf Proben zum Herauswinden
spell.slippery.enhancedescr=insgesamt +3
spell.call_for_help.descr=lässt Person in RW spüren, dass Zauberer in Gefahr ist
spell.call_for_help.enhancedescr=Ziel erfährt Gesundheitsstufe des Zauberers
spell.bone_collector.descr=Knochen/Leichenteile aus bis zu 30 m sammeln sich beim Zauberer
spell.bone_collector.enhancedescr=aus bis zu 60 m
spell.suppress_melancholia.descr=unterdrückt 2 Stufen des Zustands Schwermut (siehe Jenseits S. 51)
spell.suppress_melancholia.enhancedescr=insgesamt 3 Stufen
spell.call_animal.descr=ruft eigene Kreatur herbei
spell.call_animal.enhancedescr=kann auch anderes bekanntes Tier rufen
spell.mourning_garments.descr=Kleidung wird dunkel und unauffällig
spell.mourning_garments.enhancedescr=dadurch +1 zum Verstecken
spell.attention.descr=Ziel kriegt +1 auf Sicherheitswürfe
spell.attention.enhancedescr=insgesamt +2
spell.magic_makeup.descr=kein Malus auf Verkleiden ohne Hilfsmittel
spell.magic_makeup.enhancedescr=außerdem +1 auf Proben zum Verkleiden
spell.absolute_silence.descr=Im Wirkungsbereich sind absolut keine Geräusche zu hören, ebenso wie aus diesem keinerlei Geräusche nach außen dringen. Den Wirkungsbereich passierende Geräusche werden so stark gedämpft, dass alle Wahrnehmung-Proben um diese zu hören einen Malus in Höhe von 6 Punkten erhalten.
spell.absolute_silence.enhancedescr=Der Malus erhöht sich auf 12 Punkte.
spell.ancestor_advice.descr=Der Zauberer kann Kontakt zu einem seiner Ahnen aufnehmen, der ihm Rat spendet. Dieser Ahn ist während der Wirkungsdauer des Zaubers auf magischem Wege mit dem Geist des Zauberers verbunden, befindet sich aber weiterhin in der Geisterwelt. Er kann dem Zauberer mit seinem Wissen helfen: Er besitzt drei zu seiner Vergangenheit passende Fertigkeiten, bei denen er dem Zauberer, sofern eine Konsultation möglich ist, einen Bonus in Höhe von 4 Punkten verleiht. Darüber hinaus kann er nach Maßgabe des Spielleiters auch anderweitige Informationen bereitstellen, die zum Ahnengeist passen. Die drei Fähigkeiten müssen in Abstimmung mit dem Spielleiter festgelegt werden, wenn der Zauber erlernt wird, ebenso wie man sich gemeinsam mit dem Spielleiter Gedanken zum Hintergrund der Figur machen sollte. Der Bonus, der vom Ahnen bereitgestellt wird, zählt als magischer Bonus.
spell.ancestor_advice.enhancedescr=Der Bonus erhöht sich auf 6 Punkte.
spell.frighting_object.descr=Ein Objekt mit einer Last zwischen 4 und 12 wirkt auf alle Betrachter furchteinflößend. Wem eine Entschlossenheit-Probe gegen 10 plus die Fertigkeitspunkte des Zauberers in der verwendeten Magieschule misslingt, der kann sich dem Gegenstand nicht näher als 3 m nähern. Dies gilt nicht, wenn der Gegenstand aktiv auf eine Person zubewegt wird. Im Rahmen dieses Zaubers gilt auch ein nicht verschlossener Durchgang von der Größe einer Tür als Objekt.
spell.frighting_object.enhancedescr=Die Schwierigkeit der Entschlossenheit-Probe erhöht sich um 5 Punkte.
spell.nondescript_face.descr=Das Ziel erinnert sich nicht an das Gesicht des Zauberers und kann ihn nur sehr vage beschreiben (Geschlecht, grobes Alter, Rasse). Dies gilt auch, wenn es den Zauberer innerhalb einer Stunde nach Wirken des Zaubers erneut sieht. Dieser Zauber benötigt weder Formel noch Geste.
spell.nondescript_face.enhancedescr=Auch wenn das Ziel innerhalb der nächsten drei Stunden den Zauberer noch einmal sieht, kann es anschließend den Zauberer nicht beschreiben.
spell.aging.descr=Der Zauberer altert bei Beibehaltung seiner Gesundheit um 20 Jahre.
spell.aging.enhancedescr=Der Zauberer altert um 30 Jahre.
spell.sense_age.descr=Der Zauberer erfährt bis auf die Zehnerstelle gerundet das Alter in Jahren eines Wesens oder eines Gegenstands (ein 17 Jahre altes Wesen würde also als \u201Eetwa 20 Jahre alt\u201C zählen). Bei einem Gegenstand richtet sich das Alter danach, wann er in seine jetzige Form gebracht oder hergestellt wurde, nicht nach dem Alter des Materials.
spell.sense_age.enhancedescr=Der Zauberer erfährt das exakte Alter bis auf das Jahr genau.
spell.attack_premonition.descr=Der Zauberer kann kleinste Bewegungen in seiner Umgebung so deutlich wahrnehmen und deuten, dass er während der Wirkungsdauer einen Bonus in Höhe von 2 Punkten auf seine Widerstandswerte gegen alle gegen ihn gerichteten Angriffe erhält. Dieser Zauber kann nicht mehrmals gleichzeitig auf demselben Ziel liegen.
spell.attack_premonition.enhancedescr=Der Bonus erhöht sich auf 3 Punkte.
spell.animate1.descr=Der Zauberer animiert einen Golem mit dem Merkmal Golem 1.\nDer Golem verfügt über die aktiven Instruktionen Folge und Warte sowie eine weitere Instruktion nach Wunsch des Zauberers, sofern der Golem diese Instruktion besitzt.
spell.animate1.enhancedescr=Der Zauberer aktiviert eine beliebige Verfügung des Golems (siehe S. 203).
spell.animate2.descr=Der Zauberer animiert einen Golem mit dem Merkmal Golem 3 oder niedriger.\nDer Golem verfügt über die aktiven Instruktionen Folge und Warte sowie eine weitere Instruktion nach Wunsch des Zauberers, sofern der Golem diese Instruktion besitzt.
spell.animate2.enhancedescr=Der Zauberer aktiviert eine beliebige Verfügung des Golems (siehe S. 203).
spell.animate3.descr=Der Zauberer animiert einen Golem mit dem Merkmal Golem 6 oder niedriger. Der Golem verfügt über die aktiven Instruktionen Folge und Warte sowie eine weitere Instruktion nach Wunsch des Zauberers, sofern der Golem diese Instruktion besitzt.
spell.animate3.enhancedescr=Der Zauberer aktiviert eine beliebige Verfügung des Golems (siehe S. 203).
spell.animate4.descr=Der Zauberer animiert einen Golem mit dem Merkmal Golem 8 oder niedriger. Der Golem verfügt über die aktiven Instruktionen Folge und Warte sowie eine weitere Instruktion nach Wunsch des Zauberers, sofern der Golem diese Instruktion besitzt.
spell.animate4.enhancedescr=Der Zauberer aktiviert eine beliebige Verfügung des Golems (siehe S. 203).
spell.animate5.descr=Der Zauberer animiert einen Golem mit dem Merkmal Golem 10 oder niedriger. Der Golem verfügt über die aktiven Instruktionen Folge und Warte sowie eine weitere Instruktion nach Wunsch des Zauberers, sofern der Golem diese Instruktion besitzt.
spell.animate5.enhancedescr=Der Zauberer aktiviert eine beliebige Verfügung des Golems (siehe S. 203).
spell.antimagic_shell.descr=Der Zauberer erschafft eine kuppelförmige Zone, die gegen von außen gewirkte Magie schützt. Jeder Zauber, der von außerhalb der Zone auf etwas innerhalb des Wirkungsbereichs zielt, ist um 6 Punkte erschwert.
spell.antimagic_shell.enhancedescr=Alle gegen einen Widerstand gerichteten Zauber, die innerhalb des Wirkungsbereichs auf ein anderes Ziel im Wirkungsbereich gewirkt werden, sind außerdem um 3 Punkte erschwert.
spell.wall_running.descr=Der Zauberer kann, solange er sich kontinuierlich bewegt, auf jeglicher Oberfläche (z.B. an Wänden, Decken, Überhänge, Seilen) balancieren. Sollte er sich nicht bewegen, ist eine Bewegung (und ein Stehen an Decken, etc.) nur wie unter normalen Umständen möglich oder nicht möglich.
spell.wall_running.enhancedescr=Der Zauberer kann während der Wirkungsdauer auch stehen bleiben, ohne dass die Zauberwirkung stoppt.
spell.disenchant_artifact.descr=Ein mit diesem Zauber verzaubertes Artefakt gilt als entzaubert (s. S. 168), sofern seine Artefaktqualität maximal 5 beträgt.
spell.disenchant_artifact.enhancedescr=Auch Artefakte bis Artefaktqualität 8 sind von dem Zauber betroffen.
spell.counter_artifact.descr=Ein Artefakt funktioniert während der Wirkungsdauer nicht mehr, sofern seine Artefaktqualität maximal 4 beträgt. Auch Wesen des Typus Konstrukt können mit diesem Zauber belegt werden, sie erhalten in diesem Fall einen Malus in Höhe von 4 Punkten auf alle Proben.
spell.counter_artifact.enhancedescr=Ein bis Artefaktqualität 6 kann betroffen sein. Der Malus für Wesen des Typus Konstrukt erhöht sich auf 6 Punkte.
spell.wave_of_counter_artifact.descr=Alle Artefakte im Wirkungsbereich des Zaubers funktionieren während der Wirkungsdauer nicht mehr, sofern ihre Artefaktqualität maximal 4 beträgt. Dies betrifft nur aus der Artefaktqualität resultierende Fähigkeiten eines Gegenstands. Alle Wesen des Typus Konstrukt im Wirkungsbereich erhalten außerdem einen Malus in Höhe von 4 Punkten auf alle Proben.
spell.wave_of_counter_artifact.enhancedescr=Auch Artefakte bis Artefaktqualität 6 werden betroffen. Wesen des Typus Konstrukt erhalten einen Malus in Höhe von 6 Punkten auf alle Proben.
spell.ashes_to_ashes.descr=Eine nicht belebte Leiche bis maximal Größenklasse 7 wird binnen der nächsten 30 Ticks eingeäschert. Die zurückbleibende Asche entspricht der Menge einer herkömmlichen Feuerbestattung. Die Umgebung der Leiche wird durch diesen Zauber nicht in Mitleidenschaft gezogen. Zur Leiche gehörende Ausrüstung bis maximal Last 4 wird mitverbrannt. Nicht brennbare Gegenstände bleiben zurück.
spell.ashes_to_ashes.enhancedescr=Zur Leiche gehörende Ausrüstung bis Last 8 wird mitverbrannt.
spell.refreshment.descr=Das Ziel des Zaubers erhält sofort 15 Punkte Betäubungsschaden zurück.
spell.refreshment.enhancedescr=Es werden insgesamt 30 Punkte Betäubungsschaden wiederhergestellt.
spell.bed_of_shadows.descr=Wann auch immer der Zauberer während der Wirkungsdauer einen der Zustände Schlafend oder Bewusstlos besitzt, wird er von schützenden Schatten umgeben. Alle Proben, um ihn in einem solchen Fall zu entdecken, erhalten einen Malus in Höhe von 5 Punkten.
spell.bed_of_shadows.enhancedescr=Der Zauberer erhält außerdem einen Bonus in Höhe von einem Punkt auf seine Heimlichkeit, selbst wenn er wach ist.
spell.go_all_out.descr=Der Zauberer lenkt die magischen Ströme der Umgebung so, dass sie spektakuläre Ergebnisse ermöglichen – in die eine oder andere Richtung. Er sagt eine auf den Zauber folgende Probe an und muss 1W6 würfeln. Jedes gerade Ergebnis zählt als Bonus in gleicher Höhe auf die nächste Probe innerhalb der Wirkungsdauer (es genügt, wenn die Probe innerhalb der Wirkungsdauer des Zaubers begonnen wurde). Jedes ungerade Ergebnis zählt hingegen als Malus in gleicher Höhe auf diese Probe. Nach Einsatz dieses Zaubers muss die entsprechende Probe durchgeführt werden.
spell.go_all_out.enhancedescr=Sollte der Zauberer durch diesen Zauber einen Malus erleiden, sinkt dieser um bis zu 2 Punkte.
spell.uplift.descr=Der Zauberer erhält auf magischem Wege Auftrieb. Er erhält einen Bonus in Höhe von 3 Punkten auf alle Proben zum Springen sowie in Höhe von einem Punkt auf alle Schwimmen-Proben.
spell.uplift.enhancedescr=Außerdem verringert sich etwaiger Fallschaden um 1 Stufe.
spell.aura_counter_motion.descr=Innerhalb des Wirkungsbereichs wird die komplette Wirkung aller Zauber des Typus Bewegung stärken sofern möglich um die Hälfte reduziert (Boni werden halbiert, Erhöhung der Sprungweiten halbiert, etc.).
spell.aura_counter_motion.enhancedescr=Es sind alle Bewegungszauber von der Wirkung dieses Zaubers betroffen, selbst wenn diese einen anderen Typus aufweisen.
spell.aura_coldness.descr=Für den Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner Wahl gilt die vorherrschende Hitzestufe als um 2 Punkte gesenkt bzw. die vorherrschende Kältestufe als um 2 Punkte erhöht. Die Modifikation gilt nur während des Aufenthalts im Wirkungsbereich.
spell.aura_coldness.enhancedescr=Es können bis zu fünf Wesen bestimmt werden.
spell.aura_catseyes.descr=Für den Zauberer und bis zu drei weitere bei Auslösen des Zaubers festgelegte Wesen gelten die Lichtverhältnisse als um 2 Stufen verbessert, solange sie sich im Wirkungsbereich des Zaubers aufhalten.
spell.aura_catseyes.enhancedescr=Die Lichtverhältnisse gelten sogar als um 3 Stufen verbessert.
spell.aura_slowness.descr=Alle Bewegungen innerhalb des Wirkungsbereichs des Zaubers (einschließlich der des Zauberers) werden stark verlangsamt. Die Geschwindigkeit aller Wesen wird um 5 Punkte gesenkt (mind. 1) und die Dauer aller Aktionen und Reaktionen erhöht sich um 2 Ticks. Außerdem wird der Schaden von Nahkampfangriffen und Fernkampfangriffen innerhalb des Wirkungsbereichs um 2 Punkte gesenkt (auch wenn die Fernkampfangriffe von außerhalb des Wirkungsbereichs durchgeführt wurden) und Fallschaden wird um eine Stufe verringert.
spell.aura_slowness.enhancedescr=Für den Zauberer selbst gelten nur die halben Auswirkungen des Zaubers.
spell.aura_enhance_light.descr=Alle Lichtquellen im Wirkungsbereich werden von tanzenden Lichtern umgeben und verbessern dadurch die Lichtverhältnisse nach Ermessen des Zauberers um bis zu 2 Stufen mehr als normal. Ohne Lichtquelle werden die Lichtverhältnisse nicht beeinflusst.
spell.aura_enhance_light.enhancedescr=Die Lichtverhältnisse werden sogar um bis zu 3 Stufen mehr verbessert als normal.
spell.aura_nightrest.descr=Der Zauberer und bis zu drei weitere bei Auslösen des Zaubers festgelegte Wesen können sämtliche negativen Einflüsse auf die natürliche Regeneration von Lebenspunkten und Fokus in einer Ruhephase ignorieren (etwa durch ungemütliche Lage, Kälte, Hitze, Krankheiten oder ähnliches), solange sie sich im Wirkungsbereich des Zaubers aufhalten.
spell.aura_nightrest.enhancedescr=Die natürliche Regeneration von Lebenspunkten und Fokus in einer Ruhephase wird für diese Wesen sogar um 2 Punkte erhöht.
spell.aura_reflexes.descr=Die Reflexe und das Reaktionsvermögen des Zauberers und von bis zu drei bei Auslösen des Zaubers festgelegten weiteren Wesen sind verbessert, solange sie sich im Wirkungsbereich befinden. In diesem Fall erhalten sie einen Bonus in Höhe von 3 Punkten auf Wahrnehmung-Proben, um Hinterhalte zu entdecken, sowie auf Akrobatik-Proben. Darüber hinaus sinkt ihre Initiative im Wirkungsbereich um 3 Punkte.
spell.aura_reflexes.enhancedescr=Die Initiative sinkt sogar um 5 Punkte.
spell.aura_cleansing.descr=Im Wirkungsbereich des Zaubers haftet neuer Schmutz kaum an Personen oder Objekten.
spell.aura_cleansing.enhancedescr=Auch bestehender Schmutz verschwindet während der Wirkungsdauer des Zaubers temporär, taucht aber nach Ende des Zaubers wieder auf.
spell.aura_repair.descr=Der Zauberer kann während der Wirkungsdauer eine sofortige Reaktion von 3 Ticks Dauer ablegen, um einen Gegenstand bis Last 4 innerhalb des Wirkungsbereichs unter die Wirkung dieses Zaubers zu stellen. Auf diese Weise kann er bis zu 10 Gegenstände mit der Wirkung betreffen, danach endet der Zauber. Alle diese Gegenstände erhalten im Wirkungsbereich des Zaubers, sofern sie angeschlagen oder demoliert (nicht aber völlig zerstört) sind, langsam wieder ihre ursprüngliche Form zurück. Sie erhalten alle 10 Ticks einen Punkt Haltbarkeit zurück bis hin zu ihrem natürlichen Maximum.
spell.aura_repair.enhancedescr=Es können Objekte bis maximal Last 8 ausgewählt werden.
spell.aura_damagereflection.descr=Wenn ein gegen einen Widerstand gerichteter Zauber des Typus Schaden auf den Zauberer oder bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner Wahl gewirkt werden, haben diese zwar die übliche Wirkung, wenden die destruktiven Energien aber teilweise auch gegen den Verursacher zurück. Dabei wird nur der Schaden zurückgeworfen, bei dem eines der vom Zauber beschützten Wesen das primäre Ziel war (etwa bei einem Kettenblitz nur das erste Ziel). Der Verursacher erleidet Schaden in Höhe der Hälfte des Schadens, den das ursprüngliche primäre Ziel tatsächlich erlitten hat (Schadensreduktion hilft hiergegen nicht). Der Schaden ist derselben Art (gewöhnlicher Schaden ist gewöhnlicher Schaden, Feuerschaden ist Feuerschaden, etc.). Etwaige zusätzliche Effekte wie Zustände oder ähnliches werden nicht betroffen. Nur im Wirkungsbereich des Zaubers befindliche Wesen können von dieser Aura profitieren.
spell.aura_damagereflection.enhancedescr=Der Zauberer kann bis zu zwei weitere Wesen seiner Wahl unter den Schutz des Zaubers stellen.
spell.aura_steadfastness.descr=Der Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner Wahl sind nur noch schwer gegen ihren Willen zu bewegen. Sie erhalten einen Bonus in Höhe von 3 Punkten auf ihre Widerstandswerte gegen positionsverändernde Angriffe (solche die sie abdrängen, umreißen, etc.) sowie in Höhe von 3 Punkten auf alle Proben zum Vereiteln entsprechender Positionsveränderungen.
spell.aura_steadfastness.enhancedescr=Gegen vom Zauber profitierende Wesen dürfen außerdem keine EG eingesetzt werden, um Proben zur Abwehr positionsverändernder Angriffe zu erschweren.
spell.aura_confidence.descr=Der Zauberer und bis zu drei bei Auslösen des Zaubers festgelegte Wesen sind mental gegen schädliche Verzauberungen geschützt. Solange sie sich im Wirkungsbereich des Zaubers aufhalten, erhalten alle Zauber der Typen Fluch und Schwächung, die sich gegen ihren Geistigen Widerstand richten, einen Malus in Höhe von 4 Punkten.
spell.aura_confidence.enhancedescr=Der Malus erhöht sich auf 6 Punkte.
spell.aura_clearmind.descr=Der Geist des Zauberers und von bis zu drei weiteren bei Auslösen des Zaubers festgelegten Wesen ist gestärkt, solange sie sich im Wirkungsbereich des Zaubers befinden. Alle gegen ihren Geistigen Widerstand gerichteten Zauber der Typen Einstellung, Gedächtnis, Halluzination, Kontrolle, Mental, Moral und Schwächung erhalten einen Malus in Höhe von 6 Punkten.
spell.aura_clearmind.enhancedescr=Proben, um Illusionen zu durchschauen, sind für die Nutznießer des Zaubers außerdem um 5 Punkte erleichtert.
spell.aura_connectedLife.descr=Der Zauberer und zwei weitere freiwillige, bei Auslösen des Zaubers festgelegte Wesen können erlittenen Schaden miteinander teilen. Jeglicher Schaden, den der Zauberer oder eines der beiden Ziele erleidet, während er sich im Wirkungsbereich des Zaubers befindet, kann nach Wunsch des Zauberers auf die vom Zauber betroffenen Wesen aufgeteilt werden. Jedes betroffene Wesen kann nach dem Erleiden von umverteiltem Schaden entscheiden, von der Zauberwirkung ab sofort nicht mehr betroffen zu sein. Keines der Ziele des Zaubers kann gleichzeitig von dem Zauber Lebensraub betroffen sein. Der Zauber endet automatisch mit dem Ableben eines der betroffenen Wesen.
spell.aura_connectedLife.enhancedescr=Der Zauberer kann ein weiteres freiwilliges Wesen mit hinzunehmen.
spell.aura_shadowsight.descr=Der Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner Wahl sind, solange sie sich im Wirkungsbereich des Zaubers aufhalten, immun gegen jegliche negative Modifikation der Lichtverhältnisse durch Schattenzauber. Für sie gelten stets nur die natürlichen Lichtverhältnisse sowie eventuelle positive Modifikationen durch Lichtquellen und ähnliche Effekte.
spell.aura_shadowsight.enhancedescr=Alle vom Zauber betroffenen Wesen können außerdem bis zu 2 Stufen des Zustands Geblendet unterdrücken, solange sie sich im Wirkungsbereich des Zaubers befinden.
spell.blackout.descr=Das Ziel vergisst kurzzeitig, was es gerade tun wollte. Es verliert dadurch 2 Ticks. Jedes Ziel kann von diesem Zauber nur einmal betroffen werden, bevor es wieder mindestens eine Aktion durchgeführt hat. Kontinuierliche Handlungen brechen durch diesen Zauber nicht ab.
spell.blackout.enhancedescr=Das Ziel verliert 3 Ticks.
spell.banish_animals.descr=Der Zauberer erschafft einen Schutzkreis von 3 m Radius. Wesen des Typus Tier können den Kreis nur betreten, wenn ihnen eine Probe auf Entschlossenheit gegen 25 gelingt oder sie außerdem den Typus Monster aufweisen. Sie können aber mit Fernwaffen oder Zaubern in den Kreis einwirken. Wesen des Typus Tier, die sich bei Auslösen des Zaubers in 3 m Umkreis um den Zauberer befinden, werden bei Misslingen der Entschlossenheit-Probe vom Zauber nach außen gedrängt.
spell.banish_animals.enhancedescr=Der Zauber wirkt auch auf Wesen, die sowohl den Typus Tier als auch Monster aufweisen.
spell.command.descr=Das Ziel führt einen einzelnen Befehl des Zauberers aus, wobei folgende Befehle wählbar sind: „Lass dich auf den Boden fallen! / Übergib mir einen Gegenstand! / Lass einen Gegenstand fallen! / Lass mich vorbei! / Brich eine kontinuierliche Aktion ab!“ Das Ziel führt den gewählten Befehl umgehend aus, sofern dies nicht länger als 30 Ticks Dauer benötigt. Es erinnert sich nach Durchführung des Befehls nicht daran, den Befehl erhalten oder ihn ausgeführt zu haben.
spell.command.enhancedescr=Dem Ziel kann auch der folgende Befehl erteilt werden: „Führe einen Angriff gegen ein festgelegtes Ziel aus!“
spell.light_shield.descr=Ein mit diesem Zauber verzauberter Schild ist leichter, seine Behinderung und sein Tick-Zuschlag sinken um jeweils einen Punkt.
spell.light_shield.enhancedescr=Alle Proben bei Benutzung dieses Schildes erhalten außerdem einen Bonus in Höhe von einen Punkt.
spell.calm.descr=Die Zustände Angsterfüllt und Rasend werden während der Wirkungsdauer des Zaubers unterdrückt. Nach Ende der Wirkungsdauer wirken diese Zustände wieder, als wäre in der Zwischenzeit keine Zeit vergangen.
spell.calm.enhancedescr=Es wird auch der Zustand Panisch unterdrückt.
spell.disturb_summoner.descr=Das Ziel des Zaubers muss zusätzliche 2 Punkte Fokus verzehren, um Zauber des Typus Beschwörung zu wirken, sowie zusätzlich für jeden Dienst, den er einem Wesen mit dem Merkmal Beschworenes Wesen aufträgt, einen Punkt Fokus erschöpfen.
spell.disturb_summoner.enhancedescr=Das Ziel muss 2 Punkte Fokus erschöpfen, um einem Wesen mit dem Merkmal Beschworenes Wesen einen Dienst aufzutragen.
spell.change_owner.descr=Der Zauberer erhält bei einem Objekt bis zu Last 2 eine Eingebung, wer dieses am dringendsten benötigt. Sofern innerhalb der Wirkungsdauer eine Situation eintritt, in der dieses Objekt von jemandem benötigt wird, kann rückwirkend festgelegt werden, dass man diesen Gegenstand der entsprechenden Person zu einem passenden Zeitpunkt gegeben hat. So kann beispielsweise festgelegt werden, dass eine schwer verwundete Person auf Basis der Eingebung des Zauberers schon Stunden vorher einen Heiltrank erhalten hat, den diese jetzt nutzen kann. Dies geht nur, wenn der entsprechende Gegenstand zwischen Auslösung des Zaubers und Nutzung der Wirkung nicht aktiv im Spiel genutzt wurde (und somit angenommen werden kann, dass er die ganze Zeit im Besitz des Nutznießers war).
spell.change_owner.enhancedescr=Der Zauber wirkt auf bis zu vier Objekte mit einer kombinierten Last von bis zu 4 Punkten.
spell.stop_motion.descr=Der Zauberer stoppt eine beliebige noch nicht abgeschlossene kontinuierliche Aktion Laufen oder Sprinten innerhalb der Reichweite des Zaubers, sofern das Ziel maximal Größenklasse 7 besitzt. In einer Verfolgungsjagd verliert das Ziel durch diesen Zauber 3 FP.
spell.stop_motion.enhancedescr=In einer Verfolgungsjagd verliert das Ziel sogar 4 FP.
spell.blinding_flames.descr=Vom Zauberer schießen helle Flammen in die Luft, die zwar niemanden verbrennen, aber mit Ausnahme des Zauberers jedem Wesen im Wirkungsbereich den Zustand Geblendet 2 verleihen, dem eine Wahrnehmung-Probe auf 15 plus die Fertigkeitspunkte des Zauberers in der verwendeten Magieschule misslingt. Jedes Wesen kann nur einmal gleichzeitig von diesem Zauber betroffen sein.
spell.blinding_flames.enhancedescr=Der Zauberer kann bis zu drei Personen seiner Wahl von der Wirkung des Zaubers ausnehmen.
spell.lightning_shield.descr=Der Zauberer hält einen Schild aus zuckenden Blitzen in einer Hand (diese muss frei sein, um den Schild zu benutzen). Wenn er mit diesem Schild eine Aktive Abwehr gegen einen Nahkampfangriff ausführt, erhält das angreifende Wesen, sofern der Angriff erfolgreich abgewehrt wurde, für 30 Ticks den Zustand Benommen 1 (die aus diesem Zauber resultierenden Stufen des Zustands sind auf 2 begrenzt). Dieser Zauber kann auch auf einen bestehenden Schild gesprochen werden, für den dann ebenso die genannten Auswirkungen gelten.
spell.lightning_shield.enhancedescr=Jedes betroffene Wesen erleidet außerdem einen Punkt Elektrizitätsschaden, gegen den Schadensreduktion nicht wirkt.
spell.stop_bleeding.descr=Bis zu 3 Stufen des Zustands Blutend werden während der Wirkungsdauer ausgesetzt. Nach Ende der Wirkungsdauer wirken diese Stufen des Zustands wieder, als wäre in der Zwischenzeit keine Zeit vergangen.
spell.stop_bleeding.enhancedescr=Es kann außerdem eine Stufe des Zustands Verwundet nach obigen Regeln unterdrückt werden.
spell.bad_omen.descr=Der Zauberer erlangt nebulöse Einblicke in eine potenziell gefährliche Situation in der nahen Zukunft. Sollte innerhalb von 24 Stunden in seinem Beisein etwas eintreten, was für ihn oder seine Gefährten gefährlich ist, kann er rückwirkend bestimmen, dass er sich darauf vorbereitet hat. Wie genau diese Vorbereitung aussehen darf, liegt in der Hand des Spielleiters; denkbar sind etwa vorher aktivierte Zauber, mitgenommene spezielle Ausrüstung oder sonstige Taten (mit dem Effekt eines stark positiven Umstands auf mit der konkreten Gefahr verbundene Proben). Es kann nur ein Böses Omen gleichzeitig aktiv sein.
spell.bad_omen.enhancedescr=In Absprache mit dem Spielleiter kann sogar entschieden werden, dass die Gefahr komplett umgangen wurde und somit etwa ein Kampf vermieden wurde.
spell.fire_accelerant.descr=Ein auf einem Ziel liegender Zustand Brennend wird um eine Stufe erhöht, wobei die Dauer nicht beeinflusst wird.
spell.fire_accelerant.enhancedescr=Der Zustand wird um insgesamt 2 Stufen erhöht.
spell.fire_dilution.descr=Bis zu 2 Stufen des Zustands Brennend oder ein kleineres Feuer (bis Brandschaden 2, siehe Splittermond: Die Regeln S. 174) werden während der Wirkungsdauer des Zaubers unterdrückt. Nach Ende der Wirkungsdauer wirken diese Stufen des Zustands wieder, als wäre in der Zwischenzeit keine Zeit vergangen.
spell.fire_dilution.enhancedescr=Zusätzlich wird augenblicklich eine Stufe des Zustands Brennend aufgehoben bzw. der Brandschaden des entsprechenden Feuers um eine Stufe gesenkt.
spell.ailing.descr=Das Ziel verliert die Fähigkeit zur durch seinen Wert in Konstitution bestimmten natürlichen Regeneration echten Schadens in einer Ruhephase. Etwaige Erhöhungen der natürlichen Regeneration durch Stärken, Zauber, Behandlung mittels Heilkunde und ähnliches wirken weiterhin.
spell.ailing.enhancedescr=Auch sämtliche Erhöhungen der natürlichen Regeneration wirken nicht für den Verzauberten.
spell.demons_eyes.descr=Die Augen des Zauberers erscheinen während der Wirkungsdauer auf Wunsch furchteinflößend und unnatürlich, wodurch er einen Bonus in Höhe von 2 Punkten auf passende Proben bei Sozialen Interaktionen (z. B. um jemanden einzuschüchtern) erhält.
spell.demons_eyes.enhancedescr=Der Bonus erhöht sich auf 3 Punkte.
spell.the_last_call.descr=Ein totes Lebewesen wird zu einem Geschöpf des Typus Untoter. Je nach verwendetem Material entsprechen die Werte denen eines Knochenschänders (S. 212, bei bestienhaften Kadavern) oder einer Mumie (Bestien & Ungeheuer S. 122, bei humanoiden Kadavern). Der Verstand beträgt jedoch in beiden Fällen 0. Der Untote gehorcht den Befehlen des Zauberers.
spell.the_last_call.enhancedescr=Der Untote erhält 35 Erfahrungspunkte, die nach Willen des Zauberers zum Steigern der Werte des Untoten eingesetzt werden können.
spell.thunderstruck.descr=Ein mächtiger Donnerschlag erklingt und verleiht jedem Wesen im Wirkungsbereich außer dem Zauberer für 30 Ticks den Zustand Benommen 2. Kein Wesen kann mehr als einmal gleichzeitig von durch diesen Zauber verliehenen Zuständen betroffen sein.
spell.thunderstruck.enhancedescr=Der Zauberer kann außerdem bis zu drei Wesen von der Wirkung des Zaubers ausnehmen.
spell.thorntendrils.descr=Aus dem Boden schießen dornenbewehrte Ranken hervor, die das Ziel zu umklammern versuchen. Das Ziel gilt als ringend. Ein Befreien aus der Umklammerung ist möglich, die Schwierigkeit hierfür beträgt 10 plus die Fertigkeitspunkte des Zauberers in Naturmagie. Die Ranken können abgeschlagen werden und besitzen eine Härte von 3 sowie eine Haltbarkeit von 7. Jeder Versuch des Befreiens aus der Umklammerung sowie jeder Angriff gegen die Ranken durch das Ziel des Zaubers, verursachen bei diesem 2 Punkte Schaden (Schadensreduktion wirkt dagegen nicht).
spell.thorntendrils.enhancedescr=Der Schaden für Befreiungsversuche erhöht sich auf 3 Punkte.
spell.blastwave.descr=Eine vom Zauberer in alle Richtungen ausgehende Druckwelle stößt alle Wesen 3 m fort, denen eine Probe auf Akrobatik oder Athletik gegen 25 misslingt.
spell.blastwave.enhancedescr=Alle erfolgreich weggestoßenen Wesen erhalten außerdem den Zustand Benommen 1. Jedes Ziel kann durch diesen Zauber nur eine Stufe des Zustands gleichzeitig erhalten.
spell.dark_protection.descr=Der Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner Wahl werden von schützenden Schatten umgeben. Sie erhalten einen Bonus in Höhe von 3 Punkten auf ihre Widerstände gegen alle Lichtzauber sowie gegen Angriffe von Wesen der Typen Lichtwesen und Götterdiener (sofern diese nicht auch den Typus Schattenwesen besitzen).
spell.dark_protection.enhancedescr=Der Zauberer kann insgesamt fünf Wesen bestimmen.
spell.echochamber.descr=Alle Geräusche werden für das Ziel so sehr verstärkt, dass es schmerzt und ihm die Konzentration schwerfällt. Solange nicht Stille um es herum herrscht, erhält es den Zustand Benommen 1. Außerdem erhält es in so einem Fall auf alle Proben, die nach Maßgabe des Spielleiters Konzentration erfordern (etwa Bibliotheksrecherche, magische Analyse oder das Wirken eines Ritus), einen Malus in Höhe von 2 Punkten. Dieser Zauber kann nur einmal gleichzeitig auf jedes Ziel wirken.
spell.echochamber.enhancedescr=Das Ziel erhält den Zustand Benommen 2.
spell.ice_armamentarium.descr=Der Zauberer lässt Wasser gefrieren und formt aus dem Eis (oder bestehendem Eis) einen Ausrüstungsgegenstand der Qualität 0 mit einer maximalen Last von 4, sei es eine Waffe, ein Seil, einen Umhang oder einen Hammer. Ihn selbst behindert oder stört die Kälte des Gegenstandes nicht. Der Gegenstand hat die Härte und Haltbarkeit wie ein normaler Gegenstand seiner Art.
spell.ice_armamentarium.enhancedescr=Die Qualität des Gegenstands kann bis zu 2 betragen.
spell.walk_on_ice.descr=Der Zauberer muss nicht mehr balancieren, um sich über Eisflächen hinwegzubewegen, und kann außerdem sämtliche durch Eis und Schnee hervorgerufenen negativen Umstände für mit Bewegung zusammenhängende Proben ignorieren.
spell.walk_on_ice.enhancedescr=Bei Verwendung der Reiseregeln kann eine von ihm geführte Gruppe in vor allem durch Eis und Schnee bedecktem Terrain einen eventuellen Abzug auf die Tagesleistung um bis zu 5 km reduzieren.
spell.banish_element.descr=Ein vom Zauberer bestimmter Zauber bis maximal Grad 2, der den Typus Elementarkontrolle aufweist, wird beendet. Ein bestimmter Zauber kann nur betroffen werden, wenn dieser zuvor identifiziert wurde. Ansonsten wird der niedrigstgradige auf dem Ziel liegende Zauber betroffen.
spell.banish_element.enhancedescr=Es werden entsprechende Zauber bis Grad 3 aufgehoben.
spell.sense_emotion.descr=Der Zauberer kann die im Moment der Auslösung seines Zaubers im Ziel vorherrschenden Emotionen spüren (also etwa Wut, Trauer, Hass, Gleichgültigkeit, etc.).
spell.sense_emotion.enhancedescr=Der Zauberer kann auch die ungefähre Stärke der Emotionen spüren (nach der Skala: schwach/mittel/stark).
spell.grandness.descr=Der Zauberer ist von einer Aura der Erhabenheit umgeben. Jedes vernunftbegabte Wesen im Wirkungsbereich, dessen Geistiger Widerstand nicht mindestens 22 beträgt, spürt den Drang, ihm gefällig zu sein. Entsprechende Personen reagieren auf alle Anweisungen, wie sie normalerweise auf Anweisungen einer Person entsprechender Position reagieren würden (vergleichbar ihrem Verhalten gegenüber einer Person von Stand 5 in der jeweiligen Kultur). Sollten andere Personen anwesend sein, die der Wirkung des Zaubers nicht unterliegen, aber Befehlsgewalt über betroffene Personen haben, so entscheidet eine vergleichende Anführen- Probe zwischen dem Zauberer und diesen Personen, wessen Befehle befolgt werden. Alle Wesen mit höherem Geistigen Widerstand sind zwar nicht von der normalen Wirkung des Zaubers betroffen, fühlen aber ein gewisses Wohlwollen gegenüber dem Zauberer; ihre Einstellung ihm gegenüber ist um 2 Stufen erhöht (bis maximal aufgeschlossen).
spell.grandness.enhancedescr=Auch nicht vernunftbegabte Wesen des Typus Tier versuchen sich dem Zauberer gefällig zu verhalten und seine Anweisungen zu befolgen, soweit sie dazu geistig in der Lage sind und ihr Geistiger Widerstand unter 22 liegt. Wesen des Typus Tier mit höherem Geistigen Widerstand unterliegen denselben Auswirkungen wie Personen mit höherem Geistigen Widerstand.
spell.rest.descr=Der Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner Wahl regenerieren sofort 15 Punkte erlittenen Betäubungsschaden.
spell.rest.enhancedescr=Es können insgesamt 30 Punkte Betäubungsschaden regeneriert werden.
spell.sense_tremors.descr=Der Zauberer entwickelt ein Gespür für Erschütterungen. Wenn sich ihm jemand nähert oder auf andere Weise Erschütterungen hervorgerufen werden, erhält er einen Bonus in Höhe von 4 Punkten auf alle Wahrnehmung-Proben, um dies zu bemerken.
spell.sense_tremors.enhancedescr=Der Zauberer kann außerdem als sofortige Reaktion von 3 Ticks Dauer eine Wahrnehmung-Probe gegen 30 ablegen, um festzustellen, ob und wo sich in diesem Moment im Umkreis von 20 m Wesen mit einer GK von mindestens 2 bewegen und um wie viele Wesen es sich handelt.
spell.explosive_arrow.descr=Ein mit diesem Zauber verzaubertes Geschoss löst bei Aufschlag eine kleine Explosion aus. Diese verursacht bei allen Wesen im Umkreis von 5 m um den Einschlagsort 1W6+6 Punkte Feuerschaden. Der Zauber endet automatisch nach dem Auftreffen oder nachdem die Wirkungsdauer verstrichen ist. Der Zauber unterliegt während des Abschussvorgangs nicht der Regel zur maximalen Wirkungsweite kanalisierter Zauber. Dieser Zauber kann nicht mit anderen Zaubern kombiniert werden, die ebenfalls den Typus Pfeil aufweisen.
spell.explosive_arrow.enhancedescr=Der Schaden erhöht sich auf 2W6+6 Punkte.
spell.false_identity.descr=Das Ziel glaubt, es sei eine völlig andere Person, und verhält sich so, wie die Person seiner Meinung nach agieren würde. Hierbei kann sowohl eine konkrete, dem Verzauberten bekannte Person gewählt werden, als auch eine grobe Personenbeschreibung („eine Stadtwache“, „ein betrunkener Bettler“). Nach Ende des Zaubers erinnert sich das Ziel nicht daran, verzaubert worden zu sein oder was es in seiner falschen Identität getan hat.
spell.false_identity.enhancedescr=Das Ziel erhält einen Bonus in Höhe von 3 Punkten, um andere von seiner Identität zu überzeugen.
spell.foul_wind.descr=Vom Zauberer geht eine Wolke fauligen Geruchs in alle Richtungen aus. Jedes Wesen im Wirkungsbereich außer dem Zauberer muss eine Zähigkeit-Probe gegen 25 ablegen, um nicht den Zustand Benommen 1 zu erleiden.
spell.foul_wind.enhancedescr=Der Zauberer kann bis zu drei Wesen seiner Wahl von der Zauberwirkung ausnehmen.
spell.fist_of_destruction.descr=Eine mit diesem Zauber verzauberte Hand ist besonders zerstörerisch gegen unbelebte Objekte und Wesen mit dem Merkmal und/oder Typus Konstrukt. Gegen diese verlieren seine unbewaffneten Angriffe ihr Merkmal Stumpf und ihr Schaden erhöht sich um 4 Punkte. Die Härte der unbewaffneten Angriffe des Zauberers gilt gegen entsprechende Ziele als 7.
spell.fist_of_destruction.enhancedescr=Gegen unbelebte Objekte und Konstrukte erhalten unbewaffnete Angriffe des Zauberers das Merkmal Wuchtig.
spell.fist_of_light.descr=Die Fäuste des Zauberers strahlen auf Wunsch in hellem Licht, wodurch sie die Lichtverhältnisse im Umkreis von 30 m um 3 Stufen verbessern. Außerdem richten seine unbewaffneten Angriffe gegen Wesen der Typen Untoter, Schattenwesen und Wesen der Finsternis echten Lichtschaden an, der außerdem um einen Punkt erhöht wird. Dieser Zauber ist nicht mit anderen Zaubern des Typus Hand kombinierbar.
spell.fist_of_light.enhancedescr=Der Schaden gegen entsprechende Wesen wird um insgesamt 3 Punkte erhöht.
spell.weaken_fairy.descr=Ein Wesen des Typus Feenwesen erhält einen Malus in Höhe von 4 Punkten auf alle Proben.
spell.weaken_fairy.enhancedescr=Der Malus erhöht sich auf 6 Punkte.
spell.stonebonds.descr=Es schießen Gestein und Fels aus dem Boden, die ein Ziel in Reichweite umklammern. Dieses zählt dadurch als ringend. Die Fesseln haben eine Härte von 5 und eine Haltbarkeit von 10. Die Schwierigkeit zum Befreien aus der Umklammerung beträgt 15 plus die Fertigkeitspunkte des Zauberers in Felsmagie.
spell.stonebonds.enhancedescr=Die Härte der Fesseln steigt auf 7. Die Haltbarkeit steigt auf 15 + die Fertigkeitspunkte des Zauberers in Felsmagie. Zusätzlich erhält das Ziel auf seine Verteidigung sowie auf alle weiteren Proben einen Malus in Höhe von 2 Punkten.
spell.stonespike.descr=Eine Steinsäule spießt das Ziel auf. Es erleidet 3W6+2 Felsschaden mit den Waffenmerkmalen Kritisch 2 und Scharf 3.
spell.stonespike.enhancedescr=Zudem bedarf es einer gelungen Akrobatik- oder Athletik-Probe gegen 15 plus die Fertigkeitspunkte des Zauberers in der verwendeten Magieschule, um nicht vom Aufprall umgeworfen zu werden und als liegend zu gelten.
spell.telemessage.descr=Der Zauberer übermittelt einem Ziel eine gedankliche Botschaft von maximal 200 Worten. Das Ziel muss ihm namentlich bekannt sein, er muss es aber noch nicht getroffen haben. Das Ziel hört die Botschaft in der Stimme des Zauberers. Der Zauberer muss das Ziel nicht beim Zaubervorgang sehen können.
spell.telemessage.enhancedescr=Es kann auch ein nicht namentlich bekanntes Ziel gewählt werden, das jedoch ausreichend eingeschränkt werden muss (etwa „der nächste Priester, der den Zauber Wiederherstellung beherrscht“ oder „die Person, die mein Tagebuch gestohlen hat“).
spell.firebonds.descr=Es schießen feurige Fesseln aus dem Boden, die ein Ziel in Reichweite umklammern. Dieses zählt dadurch als ringend. Die Fesseln haben eine Härte von 3 und eine Haltbarkeit von 6. Die Schwierigkeit zum Befreien aus der Umklammerung beträgt 10 plus die Fertigkeitspunkte des Zauberers in Feuermagie. Ein mit diesem Zauber belegtes Ziel erhält, solange es gefesselt ist, den Zustand Brennend 1.
spell.firebonds.enhancedescr=Die Schwierigkeit zum Befreien aus der Umklammerung erhöht sich um 5 Punkte.
spell.fireproof.descr=Der Zauberer ist immun gegen jeglichen Feuerschaden sowie aus Hitzestufen resultierendem Schaden.
spell.fireproof.enhancedescr=Auch die Ausrüstung des Zauberers bis hin zu einer kombinierten Last von 14 Punkten ist immun.
spell.firerain.descr=Der Zauberer erschafft eine 2 m hohe wirbelnde Wolke aus Flammen, die sich in 3 m Höhe über dem gesamten Wirkungsbereich bewegt. Aus dieser kann er mittels einer sofortigen Aktion von 5 Ticks Dauer feurigen Regen auf im Wirkungsbereich befindliche Ziele herabprasseln lassen. Als Fertigkeitswert dieses Angriffs gegen die Verteidigung des Ziels gilt der Fertigkeitswert des Zauberers in Feuermagie. Im Falle eines Erfolgs richten die Flammen 2W6+5 Punkte Feuerschaden an. Während der Zauberer den Feuerregen kontrolliert, kann er keine anderen Aktionen ausführen. Er kann mit dem Zauber maximal so viele Angriffe ausführen, wie er Fertigkeitspunkte in Feuermagie besitzt. Ist diese Maximalzahl erreicht, endet der Zauber automatisch. Die Lichtverhältnisse im Bereich unter der Wolke steigen um eine Stufe.
spell.firerain.enhancedescr=Fliegende Wesen, die sich innerhalb der Flammenwolke aufhalten oder durch diese hindurch bewegen, erhalten außerdem einmalig den Zustand Brennend 2. Die Lichtverhältnisse unter der Wolke steigen sogar um 2 Stufen.
spell.shake_off_darkness.descr=Der Zauberer kann einen beliebigen Zustand, Zauber oder Gift, die bei ihm durch ein Wesen des Typus Wesen der Finsternis oder Schattenwesen verursacht wurde, abschütteln. Dies funktioniert nicht, wenn der entsprechende Zustand mit dem Zustand Siechtum verknüpft ist.
spell.shake_off_darkness.enhancedescr=Der Zauberer erhält außerdem für 30 Ticks einen Bonus in Höhe von 3 Punkten auf seine Widerstände gegen entsprechende Wesen.
spell.curse_of_exhaustion.descr=Jedes Mal, wenn das Ziel während der Wirkungsdauer eine Aktion von mindestens 10 Ticks Dauer, einen Kraftakt oder eine andere nach Spielleiterentscheid anstrengende Handlung vornimmt, erhält es eine Stufe des Zustands Erschöpft (bis zu einem Maximum von 3 Stufen aus diesem Zauber).
spell.curse_of_exhaustion.enhancedescr=Das Maximum der Stufen des Zustands aus diesem Zauber erhöht sich auf 5.
spell.curse_of_weakness.descr=Der Zauberer verflucht sein Ziel so, dass es während der Wirkungsdauer den Zustand Erschöpft 2 erhält.
spell.curse_of_weakness.enhancedescr=Das Ziel erhält den Zustand Erschöpft 4.
spell.curse_of_age.descr=Das Ziel wird von Alterserscheinungen geplagt, wodurch alle Proben, in die Bewegung und/oder Stärke eingehen, einen Malus in Höhe von 4 Punkten erhalten.
spell.curse_of_age.enhancedescr=Der Malus erhöht sich auf 6 Punkte.
spell.curse_of_doubt.descr=Das Ziel, bei dem es sich um einen Priester handeln muss, erhält den Zustand Glaubenskrise 1. Jedes Ziel kann von diesem Zauber nur einmal gleichzeitig betroffen sein.
spell.curse_of_doubt.enhancedescr=Das Ziel erhält den Zustand Glaubenskrise 2.
spell.whispering_shadow.descr=Der Zauberer löst seinen Schatten von sich selbst und schickt ihn los, um an einen Ort, der ihm bekannt sein muss, eine gesprochene Botschaft von bis zu 20 Sekunden Länge zu überbringen. Am Ziel angekommen gibt er die Botschaft zischend geflüstert wieder. Anschließend kehrt der Schatten auf magischem Weg zu seinem Besitzer zurück. Innerhalb eines Tages kann der Schatten bis zu 100 km zurücklegen.
spell.whispering_shadow.enhancedescr=Der Schatten überbringt die Botschaft nicht nur an einen Ort, sondern dort sogar einer bestimmten, dem Zauberer bekannten Person. Außerdem kann er eine Antwort der Person, die ebenfalls nicht mehr als 20 Sekunden Länge haben darf, überbringen.
spell.disturb_flight.descr=Das Ziel wird für die Wirkungsdauer des Zaubers daran gehindert zu fliegen. Sollte es sich bereits in der Luft befinden, landet es mit seiner normalen Geschwindigkeit an der Stelle, über der es zum Zeitpunkt des Auslösens des Zaubers flog, erleidet dabei aber keinen Fallschaden.
spell.disturb_flight.enhancedescr=Das Ziel erleidet Fallschaden der Stufe 1, sofern es sich mindestens in 1 m Höhe befand.
spell.transform_other.descr=Ein Wesen bis maximal Größenklasse 7 wird in ein beliebiges Wesen des Typus Tier mit einer Größenklasse zwischen 2 und 4 verwandelt (kein Unterwasserwesen). Sobald dem Ziel von irgendeinem anderen Wesen Schaden zugefügt wird, bricht der Zauber ab.\n\nErrata 2019\nDer SL legt das Wesen fest, in das das Ziel verwandelt wird. Die Rückverwandlung setzt ein, sobald ein Angriff gegen das Ziel gewinnt oder ihm anderweitig Schaden zugefügt würde. Die Auswirkungen desselben erleidet das Ziel in seiner ursprünglichen Form.
spell.transform_other.enhancedescr=Das Ziel erhält außerdem einen Malus in Höhe von 3 Punkten auf alle Proben in der fremden Gestalt.
spell.rain_of_sparks.descr=Das Ziel des Zaubers wird von einem Regen stiebender, heller Funken umgeben. Proben, um es zu entdecken, erhalten einen Bonus in Höhe von 3 Punkten. Gleichzeitig ist das Ziel derart abgelenkt, dass es einen Malus in Höhe von 2 Punkten auf alle Wahrnehmung-Proben sowie Angriffe erhält.
spell.rain_of_sparks.enhancedescr=Der Bonus auf Proben zum Entdecken erhöht sich auf 5 Punkte.
spell.mental_image.descr=Der Zauberer übermittelt einem freiwilligen Ziel während der Wirkungsdauer des Zaubers seine Gedanken. Auf diese Weise kann er in kurzer Zeit auch komplexe Sachverhalte teilen oder Bilder übermitteln. Dieser Zauber benötigt weder Formel noch Geste.
spell.mental_image.enhancedescr=Der Zauber ist auch gegen unfreiwillige Ziele nutzbar. Die Schwierigkeit ist in einem solchen Fall der Geistige Widerstand des Ziels.
spell.scary_flames.descr=Eine natürliche Lichtquelle wirkt furchteinflößend auf alle Tiere. Wesen des Typus Tier, die nicht auch den Typus Monster besitzen, müssen eine Entschlossenheit- Probe gegen 15 plus die Modifikation der Lichtstufe durch ebenjene Lichtquelle ablegen, um sich in die Reichweite der Lichtquelle zu begeben (um eine Fackel, die innerhalb von 10 m Reichweite die Lichtverhältnisse um 3 Stufen verändert, zu nähern, müsste ein Tier also eine Probe gegen 18 ablegen, um sich auf mehr als 10 m zu nähern). Mit der Ressource Kreatur erworbene Tiere erhalten einen Bonus in Höhe ihrer doppelten Kreaturenstufe auf die Entschlossenheit-Probe.
spell.scary_flames.enhancedescr=Die Schwierigkeit der Probe erhöht sich um die doppelte Modifikation der Lichtverhältnisse, statt nur um die einfache.
spell.heat_object.descr=Ein Gegenstand bis Last 4 wird glühend heiß. Sollte eine Person den Gegenstand in der Hand halten oder ihn innerhalb von 30 Ticks nach Wirken des Zaubers aufnehmen wollen, muss sie ihn sofort fallenlassen oder 1W6 Punkte Feuerschaden in Kauf nehmen. Sollte es nicht möglich sein, den Gegenstand fallenzulassen, erleidet die Person zwar den genannten Schaden, anschließend erfolgen für sie aber keine negativen Konsequenzen mehr.
spell.heat_object.enhancedescr=Selbst wenn der Gegenstand sofort fallengelassen wird, erleidet der entsprechende Träger einen Punkt Feuerschaden. Wenn der Gegenstand festgehalten wird, steigt der erlittene Schaden hingegen um 2 Punkte Feuerschaden.
spell.fasten_object.descr=Ein mit diesem Zauber verzauberter Gegenstand kann von der festen Oberfläche, auf der er sich befindet, kaum fortbewegt werden. Um ihn zu bewegen, ist ein Kraftakt gegen Schwierigkeit 20 plus der Fertigkeitspunkte des Zauberers in der Magieschule, mit der der Spruch gewirkt wurde, erforderlich.
spell.fasten_object.enhancedescr=Die Schwierigkeit, um den Gegenstand zu bewegen, beträgt 30 zuzüglich der Fertigkeitspunkte des Zauberers.
spell.headwind.descr=Es geht ein stetiger und starker Wind vom Zauberer hin zum Ziel aus. Jeder Fernkampfangriff des Ziels auf den Zauberer erhält einen stark negativen Umstand. Jede Bewegung des Ziels oder von Personen zwischen dem Zauberer und dem Ziel in Richtung des Zauberers muss mit einer um 2 Punkte reduzierten Geschwindigkeit ausgeführt werden.
spell.headwind.enhancedescr=Jeder nicht gegen den Zauberer gerichtete Fernkampfangriff des Ziels erleidet einen leicht negativen Umstand. Fernkampfangriffe des Zauberers gegen das Ziel erhalten außerdem einen leicht positiven Umstand.
spell.hardened_skin.descr=Die Haut des Zauberers wird härter, wodurch er einen Bonus in Höhe von einem Punkt auf seine Verteidigung erhält. Außerdem kann er jegliche Schadensquellen ignorieren, die nach Abzug aller Reduktionen nur einen Punkt Schaden anrichten. Hierdurch ist er etwa gegen Dornengestrüpp, Insektenstiche und ähnliches weitgehend geschützt.
spell.hardened_skin.enhancedescr=Der Zauber ist mit anderen Zaubern des Typus Haut kombinierbar, selbst wenn dies eigentlich nicht möglich wäre.
spell.secret_message.descr=Der Zauberer versteckt in einem auf einem einzelnen Medium (einer Seite Papier, einem Stück Rinde, einer Steintafel, etc.) geschriebenen Text eine Botschaft, die nur von maximal so vielen Zielen beim Lesen des Textes verstanden wird, wie der Verstand des Zauberers beträgt. Die ausgewählten Ziele müssen dem Zauberer persönlich bekannt sein und beim Zaubervorgang festgelegt werden. Die Botschaft kann nur so lang sein wie der ursprüngliche Text.
spell.secret_message.enhancedescr=Der Zauberer legt ein Schlüsselwort fest, mit dem jede Person, die dieses beim Lesen des Textes ausspricht, die versteckte Botschaft erhalten kann.
spell.secret_language.descr=Der Zauberer und bis zu zwei weitere freiwillige Ziele können während der Wirkungsdauer ein Kauderwelsch sprechen, dass für niemanden außer ihnen selbst zu verstehen ist.
spell.secret_language.enhancedescr=Es können bis zu fünf Ziele benannt werden.
spell.ghost_curse.descr=Die Einstellung von Wesen des Typus Geisterwesen gegenüber dem Ziel ist um 2 Stufen verschlechtert.
spell.ghost_curse.enhancedescr=Die Einstellung ist um 3 Stufen verschlechtert.
spell.ghostfriend.descr=Die Grund-Einstellung eines Wesens des Typus Geisterwesen wird gegenüber allem auf neutral gesetzt. Anschließend entwickelt sich die Einstellung wie üblich durch Ereignisse und Taten, die dem Wesen gefallen oder missfallen.
spell.ghostfriend.enhancedescr=Die Grund-Einstellung wird auf aufgeschlossen gesetzt.
spell.ghostprison.descr=Der Zauberer kann ein Wesen des Typus Geisterwesen in einen Gegenstand mit mindestens Last 2 und maximal Härte 4 bannen, wenn dem Wesen eine Entschlossenheit- Probe gegen 25 misslingt. Wenn der Gegenstand demoliert wird, kommt das Wesen vor Ablauf der Wirkungsdauer wieder frei und der Zauber endet. Solange das Wesen in den Gegenstand gebannt ist, kann es seine Umgebung zwar noch wahrnehmen, aber nicht mit ihr interagieren und auch nicht in die Geisterwelt zurückkehren.
spell.ghostprison.enhancedescr=Die Schwierigkeit der Entschlossenheit-Probe erhöht sich auf 35.
spell.spiritpath.descr=Der Zauberer kann seinen Geist von seinem Körper trennen und die Geisterwelt betreten. Sein Leib fällt währenddessen in eine Trance. Endet der Zauber, kehrt der Geist auf der Stelle zurück. Innerhalb der Geisterwelt kann sich der Geist des Zauberers nicht weiter als 10 m von seinem Eintrittsort entfernen.
spell.spiritpath.enhancedescr=Der Geist des Zauberers kann sich bis zu 50 m von seinem Eintrittsort entfernen.
spell.ghostarrows.descr=Der Zauberer erschafft zehn durchscheinende Pfeile und/oder Bolzen für eine beliebige Schusswaffe. Dabei handelt es sich um Projektile mit gewöhnlichen Werten, es können keine Brandpfeile oder ähnliches erschaffen werden.
spell.ghostarrows.enhancedescr=Der Schaden der Geschosse erhöht sich um einen Punkt. Diese Verstärkung wirkt nicht, wenn dieser Zauber mit Zaubern kombiniert wird, die die Typen Schaden und/oder Waffe aufweisen.
spell.ghost_shield.descr=Wesen des Typus Geisterwesen können den Zauberer nur berühren oder Angriffe gegen ihn ausführen, wenn ihnen eine Probe auf Entschlossenheit gegen 20 gelingt. Diese Probe kann alle 60 Ticks neu ausgeführt werden.
spell.ghost_shield.enhancedescr=Die Schwierigkeit der Probe erhöht sich auf 25.
spell.ghost_weapon.descr=Der Zauberer erschafft eine durchscheinende Waffe mit der Gestalt und den Grundwerten einer beliebigen profanen Nahkampfwaffe.
spell.ghost_weapon.enhancedescr=Es kann auch eine Fernkampfwaffe (samt 20 entsprechender gewöhnlicher Projektile) erschaffen werden.
spell.mind_over_physical.descr=Der Zauberer ermöglicht einem freiwilligen Ziel, ein körperliches Gebrechen während der Dauer des Zaubers zu ignorieren. Hierfür kann exakt einer der folgenden Zustände gewählt werden, wobei gegebenenfalls bis zu 3 Stufen ignoriert werden können: Benommen, Erschöpft, Lahm, Verwundet.
spell.mind_over_physical.enhancedescr=Es können bis zu 3 Stufen der genannten Zustände ignoriert werden, wobei diese Stufen nach Ermessen des Zauberers auf die jeweiligen Zustände aufgeteilt werden können (Lahm wird dabei behandelt, als hätte der Zustand eine Stufe).
spell.support_healing.descr=Das Ziel, bei dem es sich um das Opfer einer Krankheit bis einschließlich Grad 4 handeln kann, darf auf der Stelle eine Zähigkeit-Probe zum Auskurieren ablegen, unabhängig davon, ob bereits das Intervall verstrichen ist. Durch diese Probe außer der Reihe kann sich die Phase der Krankheit nie verschlimmern. Der Zauber kann auf jedes Ziel nur einmal pro Tag angewendet werden.
spell.support_healing.enhancedescr=Das Ziel erhält einen Bonus in Höhe von 3 Punkten auf seine Zähigkeit-Probe.
spell.neutralize_smell.descr=Der Zauberer neutralisiert sämtliche Gerüche im Wirkungsbereich und hebt etwaige andere Zauber des Typus Geruch auf. Wesen, die sich vor allem auf ihre Nase verlassen, erhalten auf passende Proben etwa zur Orientierung oder um ein anderes Wesen zu finden einen Malus in Höhe von 6 Punkten. Wo Gerüche für positive oder negative Umstände sorgen (etwa aufgrund von Parfüm oder großem Gestank), können diese Umstände ignoriert werden.
spell.neutralize_smell.enhancedescr=Der Malus für entsprechende Wesen erhöht sich auf 9 Punkte.
spell.sharpended_blade.descr=Der Zauber verleiht einer Nahkampfwaffe einen Bonus in Höhe von einem Punkt Schaden sowie das Merkmal Scharf 2 (falls schon vorhanden, steigt es um einen Punkt bis zu einem Maximum von Scharf 3 bei Waffen mit W6 als Schadenswürfel bzw. Scharf 5 bei Waffen mit W10 als Schadenswürfel).
spell.sharpended_blade.enhancedescr=Die Waffe erhält zudem das Waffenmerkmal Exakt 1. Sollte sie dieses Merkmal schon besitzen, erhöht es sich um zwei Stufen.
spell.change_gender.descr=Der Zauber wechselt unter Beibehaltung seiner Rasse sein Geschlecht. Dabei sieht er in seiner neuen Form seiner alten Form durchaus ähnlich, jedoch angepasst an das neue Geschlecht.
spell.change_gender.enhancedescr=Der Zauberer sieht sich in seiner umgewandelten Form nicht mehr selbst ähnlich.
spell.got_it.descr=Der Zauberer kann einen Gegenstand bis Last 2, der nicht von einer anderen Person kontrolliert (gehalten oder am Körper getragen) wird, in seine Hand springen lassen. Der Gegenstand bewegt sich mit einer Geschwindigkeit von 15 auf den Zauberer zu und wird dabei von Hindernissen aufgehalten. Der Zauberer muss keine Probe würfeln, um den Gegenstand zu schnappen, sehr wohl aber eine Hand frei haben.
spell.got_it.enhancedescr=Es können auch von anderen Personen kontrollierte Gegenstände betroffen werden. Um zu verhindern, dass der Gegenstand entrissen wird, kann der Betroffene eine Probe auf Athletik oder Fingerfertigkeit gegen 15 + die Fertigkeitspunkte des Zauberers in Bewegungsmagie ablegen.
spell.stonewaves.descr=Der Boden unter den Füßen des Zauberers hebt sich an und trägt ihn bis zu 50 m weit zu einem von ihm gewünschten Zielort. Die steinerne Welle legt dabei alle 5 Ticks 10 m zurück und kann sich nur in eine Richtung bewegen, ist jedoch in der Lage, einen Höhenunterschied von bis zu 5 m zu überwinden. Der Zauberer provoziert keine Gelegenheitsangriffe, während er durch die Welle bewegt wird, und ist in der Lage, andere Aktionen auszuführen, die keine Bewegungshandlungen sind. Wesen und kleinere Möbel o. ä. werden durch die Gesteinswelle gegebenenfalls sanft 1 m beiseitegeschoben.
spell.stonewaves.enhancedescr=Die Welle bietet genug Platz, um neben dem Zauberer noch drei weitere freiwillige Personen mitzuführen.
spell.immunity_poison.descr=Das Ziel ist immun gegen Gifte bis maximal Grad 4. Bereits bestehende Vergiftungen werden hierdurch nicht beeinflusst.
spell.immunity_poison.enhancedescr=Die Immunität betrifft auch Gifte des Grades 5.
spell.spit_poison.descr=Der Zauberer speit ein Gift auf das Ziel. Dabei handelt es sich um das Gift Nagaspeichel (Kontakt 3 / Erschöpft (max. 3), Verwundet (max. 1) / 1 Stunde).
spell.spit_poison.enhancedescr=Die Stufe des Giftes wird um 2 erhöht.
spell.dilute_poison.descr=Auf dem Zauberer wirkendes Gift, das in Intervallen Schaden verursacht, wird verlangsamt, sofern es Grad 3 nicht übersteigt. Die Intervalle des Giftes bzw. der daraus resultierenden Zustände werden verdreifacht (ein aus einem Gift resultierender Zustand Blutend richtet also nur alle 45 Ticks Schaden an, statt alle 15 Ticks).
spell.dilute_poison.enhancedescr=Es werden Gifte bis Grad 4 verlangsamt.
spell.poisoncloud.descr=Eine giftige Wolke erfüllt den Wirkungsbereich, die auf jeden außer dem Zauberer wie ein Gift wirkt: Einnahme 4 / Benommen (max. 3), Blutend (max. 1) / 30 Ticks. Jede Person im Wirkungsbereich kann nur einmalig von dem Gift betroffen werden.
spell.poisoncloud.enhancedescr=Die Dauer des Giftes erhöht sich auf 45 Ticks.
spell.gliding.descr=Der Zauberer gleitet während der Wirkungsdauer bei allen Stürzen oder Sprüngen ab 1 m Höhe mit einer selbst wählbaren Geschwindigkeit bis maximal 5 in eine frei wählbare Richtung, anstatt zu fallen (er kann hierdurch nicht höher steigen, als er zu Beginn des Gleitfluges gestartet ist). Hierdurch ist er während der Wirkungsdauer immun gegen Fallschaden und kann außerdem den Endpunkt seines Gleitfluges gemäß der gewählten Geschwindigkeit selbst bestimmen.
spell.gliding.enhancedescr=Der Zauberer kann mit bis zu Geschwindigkeit 10 gleiten.
spell.gravebeast.descr=Ein totes Lebewesen wird zu einem Geschöpf des Typus Untoter. Je nach verwendetem Material entsprechen die Werte denen eines Ghuls (Splittermond: Die Regeln S. 272, bei relativ frischen Kadavern) oder eines Seuchenbringers (Bestien & Ungeheuer S. 123, bei stark verwesten Kadavern). Der Verstand beträgt jedoch in beiden Fällen 0. Der Untote gehorcht den Befehlen des Zauberers.
spell.gravebeast.enhancedescr=Die Bestie erhält 25 Erfahrungspunkte, die nach Willen des Zauberers zum Steigern der Werte der Bestie eingesetzt werden können.
spell.groupmessage.descr=Der Zauberer übermittelt bis zu VER Zielen eine gedankliche Botschaft aus maximal 25 Worten. Er muss die Ziele entweder kennen oder sehen. Die Ziele hören die Botschaft mit der Stimme des Zauberers.
spell.groupmessage.enhancedescr=Es können maximal 50 Worte übermittelt und 10 Ziele gewählt werden.
spell.grouptalk.descr=Der Zauberer stellt eine magische Verbindung zwischen sich und bis zu fünf weiteren, freiwilligen Zielen her. Während der Wirkungsdauer kann jeder der verbundenen Gefährten, sofern er sich im Wirkungsbereich des Zaubers befindet, als sofortige Aktion von 5 Ticks Dauer eine kurze Botschaft von maximal 15 Worten Länge an alle anderen im Wirkungsbereich befindlichen Gefährten senden.
spell.grouptalk.enhancedescr=Die Botschaften können auch gezielt an einzelne oder mehrere der verbundenen Gefährten gesendet werden.
spell.good_face.descr=Der Gesichtsausdruck des Abenteurers wirkt stets freundlich und interessiert, egal wie er sich wirklich fühlt und wie er schaut. Dies verleiht ihm einen Bonus in Höhe von 2 Punkten auf Diplomatie- und Redegewandtheit- Proben, wenn das Gegenüber reserviert oder besser eingestellt ist.
spell.good_face.enhancedescr=Der Bonus gilt auch gegen die Einstellung ablehnend.
spell.craft_sense.descr=Der Zauberer erhält ein intuitives Verständnis für handwerkliche Tätigkeiten. Während der Wirkungsdauer des Zaubers kann er bei Edelhandwerk- und Handwerk-Proben oder entsprechenden Teilproben einer erweiterten Probe 1 EG mehr ansammeln, als es ihm eigentlich möglich wäre. Damit dies gilt, muss der Zauber während der gesamten Dauer einer entsprechenden (Teil-)Probe aktiv sein.
spell.craft_sense.enhancedescr=Er kann außerdem eine weitere Teilprobe einer etwaigen erweiterten Probe ablegen, als ihm dies eigentlich erlaubt wäre.
spell.craft_profiency.descr=Die Komplexität zur Herstellung eines Werkstücks sinkt für die Wirkungsdauer für den Zauberer von M auf F, von F auf G oder von G auf U. Um diesen Zauber zu wirken, muss der Zauberer ein entsprechendes Werkstück schon einmal gesehen haben oder eine sehr genaue Erklärung besitzen. Dieser Zauber kann nur einmal gleichzeitig auf ein Ziel wirken.
spell.craft_profiency.enhancedescr=Auch eine ungenaue Erklärung reicht schon, um diesen Zauber zu nutzen.
spell.hard_fall.descr=Das nächste Mal, wenn das Ziel innerhalb der Wirkungsdauer Fallschaden erhalten würde, erhöht sich dieser um eine Stufe.
spell.hard_fall.enhancedescr=Der Fallschaden erhöht sich um 2 Stufen.
spell.mold_hard.descr=Der Zauberer kann unbelebte Objekte bis Last 8 während der Wirkungsdauer mit seinen Händen so verformen, als wären sie zähflüssiges Wachs. Nach Ende der Wirkungsdauer bleiben sie in ihrer veränderten Form. Der Zauber kann auch auf größere Strukturen angewendet werden, betrifft dann aber nur Material grob im Umfang eines Objekts, das mit ihm verändert werden kann. Hierdurch kann beispielsweise auch ein Durchgang durch eine Wand geformt werden.
spell.mold_hard.enhancedescr=Während der Wirkungsdauer des Zaubers richten die waffenlosen Nahkampfangriffe des Zauberers gegen Wesen des Typus Konstrukt zusätzlichen Schaden in Höhe von 4 Punkten an.
spell.provoke_hate.descr=Die Einstellung des Ziels gegenüber einer Person oder einer Sache wird um 3 Stufen verschlechtert (bis maximal feindlich).
spell.provoke_hate.enhancedescr=Die Einstellung wird um 4 Stufen verschlechtert (bis maximal feindlich).
spell.healing_rain.descr=Ein heilsamer Regen regeneriert bei jedem Wesen im Wirkungsbereich 6 Lebenspunkte.
spell.healing_rain.enhancedescr=Der Regen heilt insgesamt 9 Lebenspunkte.
spell.healers_scan.descr=Der Zauberer erhält einen intuitiven Einblick in den Zustand seiner Patienten. Wenn er für einen Patienten eine Reaktion von 3 Ticks Dauer aufwendet, erhält er auf alle während der Wirkungsdauer des Zaubers für den Patienten durchgeführten Heilkunde-Proben zur Behandlung von Giften, Krankheiten oder Wunden einen Bonus in Höhe von 4 Punkten.
spell.healers_scan.enhancedescr=Der Bonus gilt auf sämtliche Heilkunde-Proben auf entsprechende Patienten, nicht nur in den oben genannten Anwendungsgebieten.
spell.disturb_healing.descr=Alle Heilkunde-Proben und Heilungszauber auf das Ziel erhalten während der Wirkungsdauer einen Malus in Höhe von 3 Punkten.
spell.disturb_healing.enhancedescr=Die während einer Ruhephase geheilten Lebenspunkte werden außerdem um 3 Punkte verringert (mind. 0).
spell.hot_as_lava.descr=Der Boden im Wirkungsbereich wird so heiß wie Lava und beginnt rot zu glühen. Wer auf dem Boden steht, erhält für jede neu begonnene Handlung den Zustand Brennend 1. Dies gilt ebenso für jeden, der mittels einer Handlung den Bereich betritt oder überquert. Unbelebte Objekte sind von dem Zauber nicht betroffen.
spell.hot_as_lava.enhancedescr=Der Zauberer kann bis zu drei Wesen bestimmen, die für ihre erste Handlung im Wirkungsbereich vom Zustand Brennend ausgenommen sind.
spell.heros_weapon.descr=Der Zauberer erschafft eine durchscheinende Waffe mit der Gestalt und den Grundwerten einer beliebigen profanen Waffe. Für diese Waffe erhält er 6 Punkte Qualität, die er für profane Verbesserungen (nicht aber für Legendäre Kräfte, Materialeigenschaften oder ähnliches) einsetzen kann. Die Waffe zählt für den Zauberer als personalisiert, nicht aber für andere Träger. Der Zauber kann auch auf eine bestehende Waffe gesprochen werden. Solange diese vom Zauberer selbst geführt wird, erhält auch sie (zusätzliche) Qualität wie oben benannt.
spell.heros_weapon.enhancedescr=Es können insgesamt 8 Punkte Qualität gemäß obiger Angaben eingesetzt werden.
spell.control_heat.descr=Ein Feuer hält konstant seine Stufe und damit auch seine Temperatur. Sollte das Feuer für passende Proben (etwa auf Alchemie zum Brauen eines Trankes oder auf Handwerk zum Bearbeiten von Metall) benutzt werden, zählt dies als leicht positiver Umstand.
spell.control_heat.enhancedescr=Das Feuer zählt sogar als stark positiver Umstand.
spell.major_fairy_ban.descr=Ein Wesen des Typus Feenwesen wird zurück in die Feenwelt geworfen. Innerhalb dieser kann der Zauber nicht angewandt werden. Sofern sich innerhalb der Reichweite des Zaubers weitere Feenwesen mit gleichem oder niedrigerem Körperlichen Widerstand wie das Ziel befinden, können bis zu zwei weitere Wesen gebannt werden. Pro weiterem Wesen müssen dafür jedoch zusätzlich 4V4 Fokus aufgewendet werden.
spell.major_fairy_ban.enhancedescr=Es können gemäß obiger Bedingungen zwei weitere Wesen gebannt werden.
spell.harden_wood.descr=Lebendes (im Umfang eines Baumes) oder totes Holz (bis Last 8) wird so hart wie Stahl. Die Härte wird auf 7 gesetzt, die Haltbarkeit steigt um 7 Punkte.
spell.harden_wood.enhancedescr=Das Holz wird sogar so hart wie Mondstahl (Härte 8, Haltbarkeit +8).
spell.humanoidform.descr=Der Zauberer verwandelt ein Wesen von Größenklasse 1-6, das entweder einer der spielbaren Rassen angehört oder das Merkmal Tier aufweist, in einen Alben, Gnom, Menschen, Varg oder Zwerg. In dieser Gestalt ähnelt er seiner vorherigen Gestalt (ein Wiesel wird als Mensch also eine eher spitze Nase aufweisen und recht haarig sein; ein Mensch wird in Gnomengestalt seine Gesichtszüge grob beibehalten). Hiermit einhergehende Veränderungen der Größenklasse und ihre Auswirkungen auf die Verteidigung, Lebenspunkte und Heimlichkeit werden übernommen, nicht jedoch natürliche Stärken der Rassen. Ein in humanoide Form verwandeltes Tier verhält sich zwar etwas tierhaft und kann nicht reden (wenn es ihm nicht schon in Tiergestalt möglich war), doch außer bei eingehender Untersuchung kann nur mit einer Wahrnehmung-Probe gegen 15 + Fertigkeitspunkte des Zauberers in Verwandlungsmagie bemerkt werden, dass mit dem Wesen etwas nicht stimmt.
spell.humanoidform.enhancedescr=Ein mittels dieses Zaubers verwandeltes Wesen des Typus Tier zeigt auch stark menschenähnliches Verhalten. Eine Probe, um seine Fremdartigkeit zu bemerken, ist erst bei eingehender Beschäftigung mit dem Wesen möglich.
spell.illumination.descr=Das Ziel wird von einer Lichtkugel getroffen, die es in einen leuchtenden Kokon hüllt. Dieser macht das Ziel für alle Wesen so leicht erkennbar, als wären die Lichtverhältnisse nur zum Zwecke des Entdeckens des Wesens um 3 Stufen erhöht. Außerdem erhalten alle Fernkampfangriffe gegen das Ziel einen Bonus in Höhe von 2 Punkten und alle Heimlichkeit- oder Schattenmagie- Proben des Wesens einen Malus in Höhe von 5 Punkten. Die Lichtverhältnisse werden außer für die oben genannten Zwecke nicht modifiziert.
spell.illumination.enhancedescr=Das Wesen erhält außerdem den Zustand Geblendet 1.
spell.reveal_illusion.descr=Der Zauberer kann einen einzelnen Illusionszauber bis Grad 3 enttarnen und ihn so für jeden Zuschauer als Illusion offensichtlich machen. Um diesen Zauber zu wirken, ist es nicht nötig, bereits von der Illusion zu wissen. Sollte aber auf dem gewählten Ziel keine Illusion liegen, ist es für den Zauberer nicht ersichtlich, ob der Zauber nur misslungen ist oder ob keine Illusion zum Enttarnen vorhanden war.
spell.reveal_illusion.enhancedescr=Die Illusion wird nicht nur enttarnt, sondern komplett gebannt.
spell.combatsense.descr=Der Zauberer ahnt in einem Kampf offensive Aktionen seiner Gegner voraus. Er erhält einen Bonus in Höhe von 3 Punkten auf alle Proben zur Aktiven Abwehr. Außerdem kann er jederzeit eine Aktive Abwehr ablegen, selbst wenn er sich des Angriffs eigentlich nicht bewusst ist (hierdurch wird er sich des Angriffs trotzdem nicht zwingend bewusst).
spell.combatsense.enhancedescr=Der Bonus erhöht sich auf 6 Punkte. Außerdem erhält er einen Bonus in Höhe von 3 Punkten auf alle Wahrnehmung-Proben zum Entdecken von Hinterhalten.
spell.combatinspiration.descr=Der Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen im Wirkungsbereich erhalten, solange sie sich im Wirkungsbereich aufhalten, einen Bonus in Höhe der Ausstrahlung des Zauberers auf alle Nah- und Fernkampfangriffe.
spell.combatinspiration.enhancedescr=Der Bonus gilt auch auf alle anderen Angriffe.
spell.change_clothing.descr=Der Zauberer kann bei getragener Kleidung für Betrachter die Farbe und etwaige Muster nach Wunsch ändern. Dies kann nach Maßgabe des Spielleiters in bestimmten Situationen (etwa bei einer farbenfrohen Aufführung, beim Verstecken oder ähnlichem) als leicht positiver Umstand gelten oder negative Umstände aus unpassender Kleidung aufheben.
spell.change_clothing.enhancedescr=Auch die Art des Schnitts und Materials wirkt auf den Betrachter anders, die jeweiligen Kleidungsstücke erscheinen jedoch immer noch wie ihre normale Art (ein Hut wirkt wie ein andersartiger Hut, etc.), was gegebenenfalls in weiteren Situationen die obigen Auswirkungen ergeben kann.
spell.minor_ghostprison.descr=Der Zauberer kann ein Wesen des Typus Geisterwesen in einen Gegenstand mit mindestens Last 2 und maximal Härte 2 bannen, wenn dem Wesen eine Entschlossenheit- Probe gegen 15 misslingt. Wenn der Gegenstand demoliert wird, kommt das Wesen vor Ablauf der Wirkungsdauer wieder frei und der Zauber endet. Solange das Wesen in den Gegenstand gebannt ist, kann es seine Umgebung zwar noch wahrnehmen, aber nicht mit ihr interagieren und auch nicht in die Geisterwelt zurückkehren.
spell.minor_ghostprison.enhancedescr=Die Schwierigkeit der Entschlossenheit-Probe erhöht sich auf 25.
spell.blades_of_light.descr=Der Zauberer ruft einige bunte Lichter herbei, die ihn umkreisen. Diese kann er auf Ziele im Wirkungsbereich schleudern, wozu eine sofortige Aktion von 5 Ticks Dauer benötigt wird. Er würfelt mit seinem Wert in der für den Zauber verwendeten Magieschule einen Angriff gegen die Verteidigung des Ziels und richtet im Falle eines Erfolgs 2W6+2 Lichtschaden an. Zudem erhalten die Getroffenen für 15 Ticks den Zustand Geblendet 1.\nEr kann mit den Lichtern maximal dreimal angreifen. Danach endet der Zauber automatisch.
spell.blades_of_light.enhancedescr=Der Zauberer kann insgesamt fünfmal mit seinem Lichterschwarm angreifen, bevor der Zauber endet.
spell.knotloosener.descr=Der Zauberer kann einfache Knoten sowie alle Fesseln bis Schwierigkeit 20 lösen. Dieser Zauber benötigt keine Geste.
spell.knotloosener.enhancedescr=Es können Fesseln bis Schwierigkeit 25 gelöst werden.
spell.kometenschlag.descr=Eine feurige Felskugel fällt 15 Ticks nach Auslösen des Zaubers aus dem Himmel herab auf einen vom Zauberer bestimmten Ort innerhalb der Reichweite. Jedes Wesen und Objekt im Umkreis von 10 m um den Einschlagsort erhält 1W10+1 Punkte Felsschaden und 1W10+1 Punkte Feuerschaden (dieser Schaden zählt als eine Quelle, Schadensreduktion und andere Effekte helfen also nur einmalig). Alle Wesen im Wirkungsbereich erhalten außerdem den Zustand Benommen 2.
spell.kometenschlag.enhancedescr=Wer mindestens einen Punkt Schaden erlitten hat, muss außerdem eine Probe auf Akrobatik oder Athletik gegen 15 plus den erlittenen Schaden ablegen, um nicht als liegend zu gelten.
spell.disturb_concentration.descr=Ein zuvor identifizierter kanalisierter Zauber bis maximal Grad 2, der auf dem Ziel liegt, wird beendet.
spell.disturb_concentration.enhancedescr=Es sind auch entsprechende Zauber bis Grad 3 betroffen.
spell.detect_life.descr=Der Zauberer spürt, wie viele Wesen des Typus Tier ( Größenklasse 2 oder größer) sich im Wirkungsbereich des Zaubers befinden.
spell.detect_life.enhancedescr=Der Zauberer spürt auch die Anwesenheit von Wesen der Typen Humanoider, Naturwesen und Monster.
spell.lifeseed.descr=Das nächste Mal, wenn das Ziel Schaden erleidet, erhält es sofort 6 Lebenspunkte zurück (bis zu seinem Maximum an Lebenspunkten). Ein Ziel kann von diesem Zauber nicht mehr als einmal gleichzeitig betroffen sein. Der Zauber endet, wenn diese Lebenspunkte geheilt werden.
spell.lifeseed.enhancedescr=Das Ziel erhält unter obigen Bedingungen insgesamt 9 Lebenspunkte zurück (ebenfalls bis zum Maximum).
spell.light_armor.descr=Die Behinderung einer mit diesem Zauber verzauberten Rüstung sinkt um einen Punkt.
spell.light_armor.enhancedescr=Die Behinderung sinkt um einen weiteren Punkt.
spell.last_rear_up.descr=Erreicht oder überschreitet der Zauberer die Gesundheitsstufe Todgeweiht, regeneriert er augenblicklich 3W6+5 Lebenspunkte (dies passiert vor irgendwelchen anderen Auswirkungen, wie etwa eine etwaige Bewusstlosigkeit des Zauberers, die den Zauber abbrechen würde). Nach Eintreten dieser Wirkung endet der Zauber. Jedes Ziel kann von diesem Zauber nur einmal gleichzeitig betroffen sein.
spell.last_rear_up.enhancedescr=Es wird außerdem je eine Stufe etwaiger Zustände Benommen, Blutend, Erschöpft oder Verwundet geheilt.
spell.light_protective_aura.descr=Der Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner Wahl werden von einem schützenden Leuchten umgeben. Sie erhalten, solange sie sich im Wirkungsbereich aufhalten, einen Bonus in Höhe von 3 Punkten auf ihre Widerstände gegen alle Schattenzauber sowie gegen Angriffe von Wesen der Typen Untoter und Wesen der Finsternis.
spell.light_protective_aura.enhancedescr=Der Zauberer kann insgesamt fünf Wesen bestimmen.
spell.lightcontrol.descr=Der Zauberer kann um sich herum jegliches Licht beeinflussen. Er kann an jedem Ort im Wirkungsbereich die Lichtverhältnisse unabhängig voneinander um bis zu 2 Stufen nach oben oder unten ändern. Hierdurch kann er etwa die Lichtverhältnisse um sich herum verbessern, gleichzeitig sie aber um eine andere Person verschlechtern. Um während der Wirkung des Zaubers eine Änderung an den Lichtverhältnissen innerhalb des Wirkungsbereichs vorzunehmen, ist für jede Änderung/jeden Bereich eine sofortige Reaktion von 3 Ticks Dauer nötig.
spell.lightcontrol.enhancedescr=Er kann die Lichtverhältnisse sogar um 3 Stufen modifizieren.
spell.enhance_light.descr=Eine Lichtquelle verbessert die Lichtverhältnisse um 2 Stufen mehr als normal.
spell.enhance_light.enhancedescr=Die Reichweite der Lichtquelle verdoppelt sich außerdem.
spell.consume_light.descr=Eine natürliche Lichtquelle explodiert und erlischt anschließend. Alle Wesen innerhalb der halben Reichweite der Lichtquelle erhalten doppelt so viel Schaden, wie die Modifikation der Lichtverhältnisse durch ebenjene Lichtquelle betrug. Der Typ des Schadens hängt davon ab, ob dieser Zauber mittels Feuermagie ( Feuerschaden) oder Lichtmagie ( Lichtschaden) gewirkt wurde. Schadensreduktion wirkt gegen diesen Schaden nicht.
spell.consume_light.enhancedescr=Der Zauberer selbst ist von dieser Wirkung ausgenommen.
spell.magic_choke.descr=Der Zauberer kann ein Ziel telekinetisch würgen. Das Ziel erleidet während der Wirkungsdauer alle 30 Ticks Betäubungsschaden in Höhe der Fertigkeitspunkte des Zauberers in Bewegungsmagie.
spell.magic_choke.enhancedescr=Während der Wirkung des Zaubers zählen Zauberer und Ziel als ringend.\n\nErrata 2019\nDie Schwierigkeit zum Befreien aus der Umklammerung in der Verstärkung beträgt 20 + FP des Zauberers in Bewegungsmagie.
spell.copy_material.descr=Der Zauberer kann einem beliebigen Objekt, das keine aus einem Besonderen Material stammende Materialqualität besitzt, die Materialeigenschaft eines anderen Gegenstands verleihen. Das kopierte Material darf maximal Materialqualität 3 haben.
spell.copy_material.enhancedescr=Das Material darf maximal Materialqualität 4 haben.
spell.mental_blow.descr=Der Zauberer greift das Ziel mit einem mentalen Angriff an, der bei Gelingen 2W6+3 Punkte Betäubungsschaden anrichtet. Hiergegen gilt die Schadensreduktion des Ziels nicht.
spell.mental_blow.enhancedescr=Das Ziel erleidet außerdem für 30 Ticks den Zustand Benommen 1.
spell.cause_minor_illness.descr=Der Zauberer verbindet einen beliebigen auf dem Ziel liegenden Zustand mit dem Zustand Siechtum 1. Dabei darf es sich nicht um einen der Zustände Blutend, Brennend oder Sterbend handeln. Dieser Zauber kann auf jedes Ziel nur einmal gleichzeitig wirken.
spell.cause_minor_illness.enhancedescr=Die Stufe des beeinflussten Zustands erhöht sich um 1.
spell.merge_with_shadows.descr=Der Zauberer verschmilzt mitsamt seiner Ausrüstung bis maximal Last 6 mit beliebigen Schatten (Lichtverhältnisse Leichte Dunkelheit oder schlechter) in seinem Blickfeld. Solange er mit dem Schatten verschmolzen ist, kann er von dort aus seine Umgebung wahrnehmen, ist jedoch nicht körperlich präsent. Er kann entsprechend weder mit seiner stofflichen Umgebung interagieren, noch können ihn andere Wesen wahrnehmen. Er vermag zischend zu flüstern, wenn er dies wünscht. Außerdem kann er sich bis zu 10 m von dem Ort, an dem er mit den Schatten verschmolzen ist, fortbewegen, solange er sich kontinuierlich in Schatten aufhält (der Zauberer kann auch aus einem entsprechend entfernten Ort aus den Schatten treten, wenn der Zauber dort endet). Sobald die Lichtverhältnisse im kompletten Bereich, an dem er sich aufhalten kann, besser als Leichte Dunkelheit sind, bricht der Zauber sofort ab (wenn also der Bereich so ausgeleuchtet ist, dass keine Schatten mehr vorhanden sind).
spell.merge_with_shadows.enhancedescr=Der Zauber bricht auch bei Dämmerlicht nicht ab.
spell.moonsteelskin.descr=Die Haut des Zauberers wird hart wie Mondstahl und schimmert entsprechend. Er erhält einen Bonus in Höhe von 6 Punkten auf seine Verteidigung und 5 Punkten auf seine Schadensreduktion. Dieser Zauber ist nicht mit anderen Zaubern kombinierbar, die ebenfalls den Typus Haut besitzen
spell.moonsteelskin.enhancedescr=Der Zauberer erhält außerdem die Rüstungsmerkmale Standfest und Wattiert, sofern er sie noch nicht besitzt.
spell.disperse_fog.descr=Sämtlicher natürlicher Nebel im Wirkungsbereich löst sich auf.
spell.disperse_fog.enhancedescr=Auch magischer Nebel ist von der Zauberwirkung betroffen.
spell.negative_surrounding.descr=Für das Ziel erscheint alles in seiner Umgebung im schlechtesten möglichen Licht: Freunde scheinen es hasserfüllt anzublicken, Tiere blecken blutrünstig die Zähne, Obst verrottet, das Wetter ist trist. Seine Einstellung gegenüber allem in seinem Blickfeld sinkt auf ablehnend (wenn die Einstellung bereits ablehnend oder schlechter ist, sinkt sie um 1 Stufe). Auf Empathie-Proben erhält das Ziel einen Malus in Höhe von 6 Punkten.
spell.negative_surrounding.enhancedescr=Die Einstellung gegenüber allem im Blickfeld sinkt um 1 weitere Stufe.
spell.like_an_eel.descr=Der Zauberer darf sofort und ohne Zeitaufwand eine Probe ablegen, um sich aus einer Umklammerung zu befreien. Er erhält einen Bonus in Höhe von 5 Punkten auf diese Probe. Das Fokussieren der Magie dieses Zaubers provoziert keine Gelegenheitsangriffe.
spell.like_an_eel.enhancedescr=Der Bonus steigt auf 10 Punkte.
spell.objectexplosion.descr=Ein unbelebtes Objekt mit mindestens Last 5 erleidet 25 Schadenspunkte. Bis zu fünf weitere unbelebte Objekte mit mindestens Last 3 nach Wunsch des Zauberers in 5 m Umkreis um das Ziel erleiden außerdem 5 Schadenspunkte.
spell.objectexplosion.enhancedescr=Bis zu zehn weitere Objekte können vom Zauberer bestimmt werden.
spell.protect_object.descr=Ein mit diesem Zauber verzaubertes Objekt bis Last 6 ist resistent gegen schädliche Magie und profane Zerstörung. Alle schädlichen Zauber des Typus Objekt, die auf dieses Objekt gewirkt werden, erhalten einen Malus in Höhe von 10 Punkten. Außerdem erhöht sich die Härte um 3.
spell.protect_object.enhancedescr=Es können auch Objekte bis Last 8 betroffen werden.
spell.transform_object.descr=Ein mit diesem Zauber verzaubertes Objekt kann in ein anderes Objekt bis zu exakt gleicher Last verändert werden, das größtenteils aus demselben Material bestehen muss. In verwandelter Form besitzt das Objekt keinerlei Gegenstandsqualität oder sonstige besonderen Kräfte. \n\nErrata 2019\nDer Zauber wirkt nur auf Objekte bis maximal Last 10.
spell.transform_object.enhancedescr=Wenn das Objekt in originaler Form Gegenstandsqualität oder Reliktstufen besaß, kann auch das verwandelte Objekt so viel Gegenstandsqualität besitzen (bis zu einem Maximum von 4; diese kann vom Zauberer nach seinem Ermessen für profane Verbesserungen eingesetzt werden).
spell.veil_object.descr=Ein mit diesem Zauber verzaubertes Objekt ist nur noch schwer zu entdecken. Alle Proben, um es wahrzunehmen, erhalten einen Malus in Höhe von 4 Punkten.
spell.veil_object.enhancedescr=Der Malus steigt auf 6 Punkte.
spell.arrow_fire.descr=Ein mit diesem Zauber verzaubertes Geschoss verleiht bei Auftreffen auf natürlich brennbaren Materialien sowie Wesen diesen für 30 Ticks den Zustand Brennend 1. Außerdem gilt auch der normale Schaden des Geschosses als Feuerschaden. Der Zauber unterliegt während des Abschussvorgangs nicht der Regel zur maximalen Wirkungsweite kanalisierter Zauber. Dieser Zauber kann nicht mit anderen Zaubern kombiniert werden, die ebenfalls den Typus Pfeil aufweisen.
spell.arrow_fire.enhancedescr=Der Zustand endet nicht automatisch nach 30 Ticks, sondern erst wenn das Objekt verbrannt ist oder das Feuer gelöscht wurde.
spell.arrow_wind.descr=Ein mit diesem Zauber verzaubertes Geschoss ignoriert das Rüstungsmerkmal Stabil. Der Zauber unterliegt während des Abschussvorgangs nicht der Regel zur maximalen Wirkungsweite kanalisierter Zauber. Dieser Zauber ist nicht mit anderen Zaubern des Typus Pfeil kombinierbar.
spell.arrow_wind.enhancedescr=Das Geschoss benötigt außerdem für die ersten zwei Überschreitungen der Grundreichweite keine Erfolgsgrade.
spell.wand_of_tendrils.descr=Der Zauberer erschafft eine schnurgerade und unverrückbare Wand aus 20 cm tiefen Dornranken mit einer beliebig verteilbaren Fläche von bis zu 10 m². Ihre Härte beträgt 2, ihre Haltbarkeit 10. Sie kann also zerstört werden, was den Zauber beendet. Die Wand zu überklettern, sich durch sie hindurchzuzwängen (Akrobatik-Probe gegen 20) oder sie unbewaffnet anzugreifen, verursacht pro entsprechender Probe 2 Punkte Schaden (Schadensreduktion wirkt gegen diesen Schaden). Die maximale Wirkungsweite kanalisierter Zauber (siehe Splittermond: Die Regeln S. 195) gilt für diesen Zauber als verzehnfacht.
spell.wand_of_tendrils.enhancedescr=Überwindungsversuche verursachen pro Probe 4 Punkte Schaden.
spell.speedy_movement.descr=Während der Wirkungsdauer erhöht sich die Geschwindigkeit des Zauberers um 30 Punkte. Wenn er die Aktionen Laufen oder Sprinten ausführt, sind außerdem alle Angriffe gegen ihn um 5 Punkte erschwert.\n\nErrata 2019 \nDer Zauber unterliegt nicht den Regeln zu maximalen Boni auf abgeleitete Werte.
spell.speedy_movement.enhancedescr=Die Geschwindigkeit erhöht sich um insgesamt 40 Punkte.
spell.speedy_undead.descr=Sämtliche vom Zauberer kontrollierte Untote werden zu reißenden Bestien. Ihr Angriffswert steigt um 3, dafür sinkt die Verteidigung um 3 und die Lebenspunkte um 2 Punkte.
spell.speedy_undead.enhancedescr=Der Schaden der Untoten steigt zusätzlich um einen Punkt.
spell.rage.descr=Das Ziel glaubt, etwas wahrzunehmen, was es die Beherrschung verlieren lässt. Es erhält den Zustand Rasend, sofern es prinzipiell in der Lage ist, Risikowürfe durchzuführen.
spell.rage.enhancedescr=Ein weiteres Ziel wird betroffen, sofern es auch nach einer möglichen Aktiven Abwehr vom ursprünglichen Zauber hätte getroffen werden können.
spell.reactive_protection.descr=Das Ziel des Zaubers erhält während der Wirkungsdauer einmalig einen Bonus in Höhe von 2 Punkten auf einen Widerstandswert oder eine Probe. Dieser Schutz kann vom Ziel selbst aktiviert werden, wofür eine sofortige Reaktion von 3 Ticks Dauer nötig ist. Dies ist auch nach einem etwaigen Würfelwurf möglich. Nach Nutzung des Bonus endet der Zauber.
spell.reactive_protection.enhancedescr=Die sofortige Reaktion zum Aktivieren des Schutzes dauert nur 1 Tick.
spell.cleansing.descr=Die Wirkung von Giften oder Krankheiten bis Grad 2 wird unterdrückt, sofern ihre Auswirkungen nicht ganz oder teilweise mit dem Zustand Siechtum 2 oder höher verbunden sind. Nach Ende der Wirkungsdauer wirken die Gifte und Krankheiten wieder, als wäre in der Zwischenzeit keine Zeit vergangen.
spell.cleansing.enhancedescr=Die Zählung der Dauer des Giftes oder der Krankheit läuft auch während der Wirkungsdauer des Zaubers weiter.
spell.giantism.descr=Der Zauberer wächst auf unnatürliche Größe an. Seine Größenklasse steigt um einen Punkt. Außerdem erhöhen sich seine Geschwindigkeit und seine Lebenspunkte um 2 Punkte und seine Verteidigung sinkt um 2 Punkte. Darüber hinaus erhalten alle seine Angriffe das Waffenmerkmal Wuchtig. Während Heimlichkeit- Proben einen Malus in Höhe von 2 Punkten erhalten, bekommt der Zauberer auf Proben zum Einschüchtern sowie auf alle Proben, in die Stärke eingeht, einen Bonus in Höhe von 2 Punkten. Getragene Ausrüstung bis insgesamt Last 6 wird mit vergrößert.
spell.giantism.enhancedescr=Es wird Ausrüstung bis Last 10 mit vergrößert.
spell.enhance_armor.descr=Eine mit diesem Zauber verzauberte Rüstung erhält das Rüstungsmerkmal Wattiert, sofern sie dieses noch nicht besitzt.
spell.enhance_armor.enhancedescr=Die Verteidigung der Rüstung erhöht sich außerdem um einen Punkt, hierdurch steigt jedoch auch die Behinderung um einen Punkt.
spell.armor_penetration.descr=Die Schadensreduktion eines Wesens wird halbiert.
spell.armor_penetration.enhancedescr=Zudem verliert das Wesen ein eventuell vorhandenes Merkmal Stabil.
spell.eroding_acid.descr=Das berührte Objekt erhält alle 30 Ticks 3 Punkte Schaden, wobei die Härte ignoriert wird.
spell.eroding_acid.enhancedescr=Der Schaden pro Intervall erhöht sich auf 5 Punkte.
spell.acid_rain.descr=Ein Säureregen fügt jeder Person und jedem Objekt in 5 m Umkreis um den Zielort Säureschaden in Höhe von 2W6+3 Punkten zu.
spell.acid_rain.enhancedescr=Jede Person erleidet außerdem den Zustand Verwundet 2.
spell.acid_shield.descr=Der Zauberer umgibt sich mit einem Schild aus Säurenebel. Während er selbst nicht davon beeinträchtigt wird, erleidet jedes Wesen, das sich ihm für länger als 15 Ticks auf 2 m nähert, den Zustand Erschöpft 1. Jedes Objekt, mit dem ein Nahkampfangriff gegen ihn ausgeführt wird, erhält 2 Punkte Schaden, wobei die Härte umgangen wird.
spell.acid_shield.enhancedescr=Der Schaden an Objekten erhöht sich auf 4 Punkte.
spell.fierce_wind.descr=Ein scharfer Wind drängt das Ziel zurück und verletzt es. Das Ziel erleidet 1W6 Punkte Windschaden, wird 1 m zurückgestoßen und verliert 1 Tick.
spell.fierce_wind.enhancedescr=Der angerichtete Schaden erhöht sich auf 2W6 und erhält das Waffenmerkmal Kritisch 3.
spell.shadow_grasp.descr=Ein schattenhaftes Tentakel schlägt aus der Richtung des tiefsten Schattens peitschend nach dem Ziel und hält es einen Augenblick fest. Das Ziel erleidet 1W6+1 Punkte Schattenschaden. Zudem zählt es für die nächsten 3 Ticks als ringend.
spell.shadow_grasp.enhancedescr=Das Ziel ist statt für 3 Ticks für die nächsten 30 Ticks ringend. Die Schwierigkeit für ein Befreien aus der Umklammerung beträgt 18.
spell.shadow_armor.descr=Der Zauberer verfestigt Schatten und formt aus ihnen eine Rüstung der Qualität 0 mit den Werten einer beliebigen gewöhnlichen Rüstung.
spell.shadow_armor.enhancedescr=Die Qualität beträgt 2.
spell.summon_lock.descr=Der Zauberer bringt an einem verschließbaren Gegenstand (einer Tür, dem Deckel einer Truhe, etc.) ein magisches steinernes oder erzenes Schloss an. Dieses hat eine Härte von 6 und eine Haltbarkeit von 7. Es kann nach den üblichen Regeln für Schlösser geöffnet werden und zählt als einfaches Schloss.
spell.summon_lock.enhancedescr=Das Schloss zählt als durchschnittliches Schloss.
spell.fast_as_lightning.descr=Der Zauberer kann sich einmalig ohne weiteren Zeitaufwand sofort bis zu 5m weit in direkter Linie bewegen. Hierdurch kann er sich nur an Orte bewegen, die er auch mit einer normalen Bewegung erreichen könnte (nicht über Abgründe, durch Wände, etc.). Diese Bewegung provoziert keine Gelegenheitsangriffe.
spell.fast_as_lightning.enhancedescr=Für seinen ersten Angriff nach der durch den Zauber ermöglichten Bewegung erhält der Zauberer einen Bonus in Höhe von 3 Punkten, sofern dieser maximal 10 Ticks nach der Bewegung erfolgt.
spell.dreadful_shadow.descr=Der Schatten des Zauberers nimmt kurzzeitig eine schreckliche und furchteinflößende Form ein. Für alle Personen, die ihn in diesem Moment sehen, gilt er, als besäße er das Monstermerkmal Furchterregend (15).
spell.dreadful_shadow.enhancedescr=Das Merkmal ändert sich auf Furchterregend (20).
spell.protective_mirror_image.descr=Das Ziel des Zauberers erhält ein magisches Spiegelbild, das sich verhält und bewegt wie er. Der erste Nahkampfangriff oder Fernkampfangriff gegen das Ziel während der Wirkungsdauer benötigt einen zusätzlichen Erfolgsgrad zum Gelingen. Sollte dieser EG nicht erreicht werden, aber hätte das Ergebnis für einen Treffer ohne die Wirkung dieses Zaubers gereicht, zählt dieser Angriff als Streiftreffer und richtet nur halben Schaden an. Anschließend endet der Zauber.
spell.protective_mirror_image.enhancedescr=Der Zauber endet erst nach dem zweiten entsprechenden Angriff innerhalb der Wirkungsdauer.
spell.protective_flesh_bones.descr=Der Zauber verzehrt Kadaver mit mindestens einer kombinierten Größenklasse von 5, die nicht weiter als MYS + 10 m vom Zauberer entfernt sind. Von den Kadavern bleiben nur Knochenteile und Fleischreste zurück. Daraus bildet sich eine Schutzschicht aus Fleisch, Knochen und Leichenwachs um den Zauberer. Der Zauberer erhält 12 temporäre Lebenspunkte (siehe S. 72). Dieser Zauber ist nicht mit Zaubern kombinierbar, die die Typen Körper stärken und Leben aufweisen.
spell.protective_flesh_bones.enhancedescr=Falls mindestens drei Kadaver verzehrt werden, erhält der Zauberer außerdem das Merkmal Furchterregend (15). Dieses Merkmal wirkt nicht auf Wesen mit dem Merkmal Untot.
spell.protective_water.descr=Der Zauberer erschafft zwei Wasserkugeln, die ihn oder Wesen in 5 m Umkreis bei Bedarf schützen können. Er kann mittels einer sofortigen Reaktion von 3 Ticks Dauer eine Kugel vergehen lassen, um den Schaden eines Angriffs im Wirkungsbereich zu halbieren (die Senkung kann dabei maximal 10 Punkte betragen). Diese sofortige Reaktion bricht keine etwaigen kontinuierlichen Handlungen ab. Sobald alle Kugeln genutzt wurden, endet der Zauber.
spell.protective_water.enhancedescr=Die von einer Kugel geschützten Wesen erhalten durch den Einsatz zudem 3 temporäre Lebenspunkte für 30 Ticks.
spell.sickness_protection.descr=Der Zauberer erhält einen Bonus in Höhe von 2 Punkten auf den Körperlichen Widerstand gegen den Infektionswurf einer Krankheit.
spell.sickness_protection.enhancedescr=Bonus erhöht sich auf 4 Punkte.
spell.protectarea_insight.descr=Der Zauberer verzaubert den Wirkungsbereich dergestalt, dass von außerhalb keine Erkenntniszauber bis einschließlich Grad 3 auf diesen Wirkungsbereich oder in ihm befindliche Personen wirken. Die entsprechenden Zauber brechen nicht ab, ihre Wirkung wird aber unterbrochen (was betroffenen Zauberern bewusst ist). Bereits vor Betreten oder Erschaffen der Schutzzone erfolgreich auf Personen im Wirkungsbereich oder den Ort selbst gewirkte Erkenntniszauber über Grad 3 wirken weiterhin. Neu gewirkte Zauber über Grad 3 erhalten einen Malus in Höhe von 3 Punkten.
spell.protectarea_insight.enhancedescr=wirken nicht auf den Wirkungsbereich und auf Personen darin.
spell.find_weakness.descr=Der Zauberer offenbart sich oder einem beim Auslösen des Zaubers festgelegten Verbündeten im Umkreis von 10 m eine Lücke in der Verteidigung des Ziels. Der Nutznießer des Zaubers erhält einen Bonus in Höhe von 3 Punkten auf seinen nächsten Angriff gegen das Ziel.
spell.find_weakness.enhancedescr=Der entsprechende Angriff des Nutznießers richtet außerdem 2 Punkte zusätzlichen Schaden an, sofern er von sich aus Schaden verursacht.
spell.heavy_armor.descr=Die Behinderung einer mit diesem Zauber verzauberten Rüstung steigt um 3 Punkte.
spell.heavy_armor.enhancedescr=Auch der Tick-Zuschlag wird um einen Punkt erhöht.
spell.heavy_weapon.descr=Der Zauber lässt die Nahkampfwaffe eines Gegners schwerer und aus diesem Grund auch weniger ausbalanciert werden. Die Waffengeschwindigkeit erhöht sich dadurch um einen Punkt.
spell.heavy_weapon.enhancedescr=Der Träger einer solcherart verzauberten Waffe erhält außerdem einen Malus in Höhe von 3 Punkten auf alle Nahkampfangriffe mit der Waffe.
spell.webbings.descr=Es bilden sich Schwimmhäute zwischen den Fingern und Zehen des Zauberers, die beim Schwimmen helfen. Er erhält einen Bonus in Höhe von 3 Punkten auf seine Schwimmen-Proben sowie in Höhe von einem Punkt auf seine Geschwindigkeit beim Schwimmen
spell.webbings.enhancedescr=Die Schwimm-Geschwindigkeit erhält einen weiteren Bonus in Höhe von einem Punkt.
spell.own_choices_fate.descr=Der Zauberer und bis zu drei weitere beim Auslösen des Zaubers festgelegte Wesen seiner Wahl sind gegen Versuche, sie in eine bestimmte Richtung zu zwingen, geschützt. Alle auf sie gegen ihren Willen gewirkten Schicksalszauber sowie alle im Sozialen Konflikt gegen ihren Geistigen Widerstand gerichteten Proben erhalten einen Malus in Höhe von 2 Punkten, solange sie sich im Wirkungsbereich aufhalten.
spell.own_choices_fate.enhancedescr=Der Zauberer kann bis zu zwei weitere Wesen seiner Wahl unter den Schutz des Zaubers stellen.
spell.selfillusion.descr=Der Zauberer erschafft ein Trugbild seiner selbst, das an einem bestimmten Ort einer alltäglich wirkenden Tätigkeit nachgeht (etwa Lesen oder Dösen). Das Trugbild reagiert nicht auf etwaige Passanten oder wenn es angesprochen wird.
spell.selfillusion.enhancedescr=Das Trugbild kann sich auch im Umkreis von 20m um seinen ursprünglichen Ort herumbewegen und dabei weiteren Tätigkeiten nachgehen (etwa im Haus herumgehen).
spell.selfdoubt.descr=Das Ziel wird von Selbstzweifeln geplagt. Es muss vor jeder schwierigen Tätigkeit (im Rahmen dieses Zaubers eine Probe, die er nicht mit einem Würfelergebnis von 13 erfolgreich ablegen würde) eine Entschlossenheit-Probe gegen die um 5 Punkte reduzierte Schwierigkeit der ursprünglichen Probe schaffen, um überhaupt einen Versuch zu wagen. Dies gilt nicht, wenn die Konsequenzen einer Nicht- Handlung genauso schlimm oder schlimmer wären als ein Fehlschlag (etwa, wenn man droht, bei einer Kletterpartie abzustürzen, falls man nicht weiterklettert). Bei einer Kette miteinander verwandter Handlungen (etwa in einem Kampf) ist nur vor der ersten schwierigen Probe eine Entschlossenheit- Probe nötig. Sofern diese gelingt, zählt diese für die ganze Szene. Sollte sie misslingen, kann das Ziel sich nicht zu schwierigen Handlungen durchringen und versucht, einfache Auswege zu finden (etwa eine Flucht). Entsprechende Proben können alle 30 Ticks wiederholt werden, um die Selbstzweifel für den Rest der Szene in die Schranken zu weisen.
spell.selfdoubt.enhancedescr=Die Entschlossenheit- Probe richtet sich gegen die volle Schwierigkeit der ursprünglichen Probe.
spell.cause_infirmity.descr=Der Zauberer verbindet einen beliebigen auf dem Ziel liegenden Zustand mit dem Zustand Siechtum 2. Dabei darf es sich nicht um einen der Zustände Blutend, Brennend oder Sterbend handeln. Dieser Zauber kann auf jedes Ziel nur einmal gleichzeitig wirken.
spell.cause_infirmity.enhancedescr=Der Zauber kann auf sämtliche Zustände gewirkt werden.
spell.splintershield.descr=Der Zauberer umgibt sich mit einem Schild aus herumfliegenden scharfkantigen Steinsplittern. Hierdurch erhält jedes Wesen, das sich mit ihm in Nahkampfdistanz befindet, nach jeweils 15 vollen Ticks den Zustand Verwundet 1 (die aus diesem Zauber resultierenden Stufen des Zustands können 3 nicht übersteigen).
spell.splintershield.enhancedescr=Alle Fernkampfangriffe gegen den Zauberer erhalten außerdem einen Malus in Höhe von 3 Punkten, da Pfeile mitunter von den Steinsplittern abgelenkt werden.
spell.spring.descr=Der Zauberer kann innerhalb der Wirkungsdauer von seiner in einem Moment seiner Wahl aktuellen Position aus einmalig einen Sprung nach den üblichen Regeln in eine beliebige Richtung ausführen. Dies wirkt auch, wenn er sich dabei schon in der Luft oder im Fall befindet.
spell.spring.enhancedescr=Angriffe, die mit einem solchen Sprung verbunden werden, erhalten einen Bonus in Höhe von 3 Punkten.
spell.lay_trail.descr=Der Zauberer hinterlässt innerhalb der nächsten Stunde eine illusionäre Spur aus kleinen Objekten wie grobem Sand, brotartigen Krümeln oder großen Tautropfen auf seinem Weg. Diese Spur bleibt während der Wirkungsdauer des Zaubers erhalten. Die Spur ist nicht automatisch für jeden klar ersichtlich, wer jedoch gezielt nach Spuren sucht und eine Probe auf Jagdkunst gegen 15 schafft, kann der magischen Spur folgen. Das Wirken des Spruchs benötigt weder Formel noch Geste.
spell.lay_trail.enhancedescr=Die Schwierigkeit der Jagdkunst-Probe verringert sich auf 10.
spell.hail_of_stones.descr=Der Zauberer erschafft eine 2 m hohe wirbelnde Wolke aus Geröll, die sich in 3 m Höhe über dem gesamten Wirkungsbereich bewegt. Aus dieser kann er mittels einer sofortigen Aktion von 5 Ticks Dauer scharfkantige Steinsplitter auf im Wirkungsbereich befindliche Ziele herabprasseln lassen. Als Fertigkeitswert dieses Angriffs gegen die Verteidigung des Ziels gilt der Fertigkeitswert des Zauberers in Felsmagie. Im Falle eines Erfolgs richten die Steinsplitter 2W6+5 Punkte Felsschaden an. Während der Zauberer den Steinhagel kontrolliert, kann er keine anderen Aktionen ausführen. Er kann mit dem Zauber maximal so viele Angriffe ausführen, wie er Fertigkeitspunkte in Felsmagie besitzt. Ist diese Maximalzahl erreicht, endet der Zauber automatisch.
spell.hail_of_stones.enhancedescr=Fliegende Wesen innerhalb der Gesteinswolke erhalten außerdem einen Malus in Höhe von 5 Punkten auf alle ihre Proben.
spell.disturbing_noise.descr=störendes Fiepen, was es ihm erschwert, sich zu konzentrieren. Es erhält einen Malus in Höhe von 4 Punkten auf Wahrnehmung-Proben, die das Gehör betreffen. Alle anderen Wahrnehmung-Proben, sowie alle Proben, die nach Maßgabe des Spielleiters besondere Konzentration benötigen (wie etwa Bibliotheksrecherche, magische Analyse oder das Wirken eines Ritus), erhalten einen Malus in Höhe von einem Punkt.
spell.disturbing_noise.enhancedescr=Der Malus auf alle weiteren Proben, die Konzentration benötigen, erhöht sich auf 2 Punkte.
spell.weaken_structure.descr=Ein mit diesem Zauber belegtes Objekt bis Last 5 wird geschwächt. Es verliert während der Wirkungsdauer 2 Punkte Härte und 3 Punkte Haltbarkeit (jeweils bis zu einem Minimum von 1).
spell.weaken_structure.enhancedescr=Es können auch Objekte bis Last 8 betroffen werden.
spell.blunt_weapon.descr=Berührung Wirkung: Eine mit diesem Zauber verzauberte Nahkampfwaffe erhält das Waffenmerkmal Stumpf.
spell.blunt_weapon.enhancedescr=Der Schaden der Waffe erhöht sich außerdem um einen Punkt Betäubungsschaden.
spell.stormshield.descr=Der Zauberer wird von einem stürmischen Schild umgeben. Er ist immun gegen Fernkampfangriffe. Gleichzeitig kann auch er selbst keine Fernkampfangriffe durchführen.
spell.stormshield.enhancedescr=Der Zauberer kann Fernkampfangriffe durchführen, erhält hierfür aber einen fast unmöglich negativen Umstand.
spell.lift_camouflage.descr=Ein Zauber bis maximal Grad 2, der mindestens einen der Typen Trugbild, Tarnung oder Impersonation aufweist, wird beendet. Um einen bestimmten Zauber auszuwählen, muss dieser zunächst durchschaut oder identifiziert worden sein. Anderenfalls wird ein passender Zauber des niedrigsten Grades innerhalb der Reichweite beendet.
spell.lift_camouflage.enhancedescr=Es werden entsprechende Zauber bis Grad 3 aufgehoben.
spell.temporary_shield.descr=Das Ziel des Zaubers wird von einem Schild wirbelnder Lebenskraft umgeben. Es erhält 6 temporäre Lebenspunkte (siehe S. 72).
spell.temporary_shield.enhancedescr=Solange das Ziel mindestens einen temporären Lebenspunkt besitzt, erhält es einen Punkt Schadensreduktion.
spell.deep_sleep_field.descr=Der Zauberer gibt dem Ziel den Zustand Schlafend. Außerdem erhalten bis zu WIL/2 weitere Wesen, die auch nach einer möglichen Aktiven Abwehr vom Ergebnis des Zaubers betroffen gewesen wären, ebenfalls den Zustand. Alle betroffenen Ziele wachen nicht auf, wenn sie durch die Wirkung des Zaubers hinfallen, sehr wohl aber anschließend durch alle Effekte, die einen normalen Schlafenden aufwecken würden.
spell.deep_sleep_field.enhancedescr=Wenn das Ziel aufwacht, erhält es für 20 Ticks den Zustand Benommen 2.
spell.immitate_animal.descr=Der Zauberer wirkt auf alle Wesen des Typus Tier bis Monstergrad (als Einzelgegner) 3 wie ein Artgenosse, demgegenüber sie eine neutrale Einstellung aufweisen. Diese Wesen reagieren ihrer Natur entsprechend auf ihn (was je nach Tier auch Imponiergehabe und Angriffe bedeuten kann). Auf Proben, um ein Tier zu beruhigen oder es dazu zu motivieren, etwas nach dem Willen des Zauberers zu tun, erhält der Zauberer einen stark positiven Umstand.
spell.immitate_animal.enhancedescr=Die Wesen reagieren auf den Zauberer wie auf einen entsprechenden Artgenossen, demgegenüber sie eine aufgeschlossene Einstellung aufweisen.
spell.animal_tongue.descr=Der Zauberer ist in der Lage, mit einem bestimmten Wesen des Typus Tier begrenzt zu kommunizieren, solange es ihm gegenüber mindestens die Einstellung neutral aufweist und einer bestimmten Art angehört, die bei Erlernen des Zaubers ausgewählt wurde. Es handelt sich nicht um ein echtes Gespräch, vielmehr kann er dem Wesen Fragen stellen, die diese im Rahmen seiner Sinneswahrnehmungen, Denkfähigkeit und Laune beantworten kann. Dieser Zauber kann mehrfach gelernt werden, jeweils für eine andere Tierart.
spell.animal_tongue.enhancedescr=Der Zauber wirkt auch auf Wesen der entsprechenden Art, die eine Einstellung von ablehnend aufweisen.
spell.sense_death.descr=Der Zauberer spürt innerhalb des Wirkungsbereichs die Richtung und Entfernung aller Personen, die unter mindestens einer Stufe des Zustands Sterbend leiden.
spell.sense_death.enhancedescr=Der Zauberer erfährt auch, welche Stufe des Zustands vorliegt und wie viele Lebenspunkte jeder Sterbende noch besitzt.
spell.twister.descr=Eine Windhose geht vom Zauberer zum Zielort aus und stößt diesen sowie alle im Weg befindlichen Wesen 3 m zurück. Sofern den Betroffenen keine Akrobatikoder Athletik-Probe gegen 25 gelingt, gelten sie außerdem als liegend. Wesen mit einer Größenklasse von 8 oder höher werden von diesem Zauber nicht betroffen.
spell.twister.enhancedescr=Alle Ziele, deren Probe misslungen ist, verlieren außerdem 2 Ticks.
spell.undead_animal.descr=Ein totes Tier oder ähnliches Wesen wird zu einem Geschöpf des Typus Untoter. Je nach vorhandenem Material entsprechen die Werte entweder denen einer Gruftkatze (S. 211) oder eines Wimmelnden Schreckens (S. 217). Der Untote gehorcht den Befehlen des Zauberers.
spell.undead_animal.enhancedescr=Der Untote erhält 10 Erfahrungspunkte, die nach Willen des Zauberers zum Steigern der Werte des Tiers eingesetzt werden können.
spell.dreammessage.descr=Der Zauberer kann einem Ziel eine Botschaft schicken, die dieses das nächste Mal, wenn es schläft, im Traum erreicht. Die Botschaft wird vom Zauberer in seiner eigenen Gestalt und mit seiner Stimme überbracht und kann maximal 100 Wörter lang sein. Der Zauberer ist nicht in der Lage, mit dem Ziel weiter zu interagieren oder auf es zu reagieren. Das Ziel erinnert sich beim Erwachen an diesen Traum, kann aber nicht automatisch erkennen, dass es sich um keinen natürlichen Traum gehandelt hat.
spell.dreammessage.enhancedescr=Der Zauberer kann die Botschaft auch in der Gestalt und mit der Stimme einer ihm persönlich bekannten Person überbringen.
spell.read_dreams.descr=Der Zauberer kann während der Wirkungsdauer des Zaubers die Träume einer in seinem Blickfeld befindlichen Person innerhalb der Reichweite sehen. Hierdurch erhält er außerdem in den nächsten 12 Stunden einen Bonus in Höhe von 2 Punkten auf Empathie-Proben im Sozialen Konflikt gegen das Ziel. Während der Zauberdauer kann der Zauberer seine normale Umgebung nicht wahrnehmen. Dieser Zauber wirkt nur, wenn das Ziel schläft. Er bricht automatisch ab, wenn das Ziel während der Wirkungsdauer erwacht oder nicht geschlafen hat. Dieser Zauber benötigt keine Formel.
spell.read_dreams.enhancedescr=Der Zauberer muss das Ziel nicht sehen können, um den Zauber zu wirken, muss sich aber sehr wohl innerhalb der Reichweite befinden.
spell.find_passage.descr=Der Zauberer spürt, sofern ihm eine Wahrnehmung-Probe gegen 20 (+5 bis +15 für verhehlte oder durch Magie versteckte Übergänge) gelingt, die Richtung des nächsten Übergangs in eine andere Domäne, sofern ein solcher in maximal drei Tagesreisen Entfernung existiert. Sollte es im Umkreis von maximal drei Tagesreisen keinen Übergang geben, erfährt der Zauberer bei einer gelungenen Wahrnehmung- Probe stattdessen dies. Darüber, ob ein Übergang als nächstgelegen zählt, bestimmt nur die reine Entfernung, nicht die eventuelle Erreichbarkeit. Einen Übergang zu finden, bedeutet nicht gleichzeitig auch zu wissen, wie man ihn benutzen kann.
spell.find_passage.enhancedescr=Der Zauberer erfährt beim Zaubervorgang, ob der gefundene Übergang in die Magische, Spirituelle oder Mythische Domäne führt.
spell.close_passage.descr=Ein mit diesem Zauber verzauberter Übergang in eine andere Domäne ist nur noch schwer zu durchqueren. Wer ihn dennoch benutzen möchte, muss eine Entschlossenheit-Probe gegen 25 ablegen.
spell.close_passage.enhancedescr=Die Schwierigkeit der Entschlossenheit-Probe beträgt 35.
spell.sense_surrounding.descr=Der Zauberer erhält einen intuitiven Überblick über die Beschaffenheit der Umgebung im Wirkungsbereich. Dies umfasst die Grundrisse von Gebäuden (Wände, Mauern, Räume), aber auch natürliche Landschaftsmerkmale (Bäume, Höhlen, etc.). Die Übersicht hat dabei den Charakter einer groben Skizze, Feinheiten wie die Lage von geschlossenen Türen, Möbeln und ähnliches sind dem Zauberer nicht bekannt.
spell.sense_surrounding.enhancedescr=Auch Möbel ab der Größe eines Stuhls sowie vergleichbare Landschaftsmerkmale sind dem Zauberer bewusst.
spell.knock_off_arrow.descr=Ein mit diesem Zauber belegtes Geschoss wirft ein getroffenes Wesen um, sofern diesem nicht eine Probe auf Akrobatik oder Athletik gegen 15 plus die Fertigkeitspunkte des Zauberers in der verwendeten Magieschule gelingt. Der Zauber unterliegt während des Abschussvorgangs nicht der Regel zur maximalen Wirkungsweite kanalisierter Zauber. Dieser Zauber ist nicht mit anderen Zaubern des Typus Pfeil kombinierbar.
spell.knock_off_arrow.enhancedescr=Die Schwierigkeit der Akrobatik- oder Athletik-Probe erhöht sich um 3 Punkte.
spell.inevitable_arrow.descr=Ein mit diesem Zauber verzaubertes Geschoss erhält das Merkmal Ablenkend 2. Der Zauber unterliegt während des Abschussvorgangs nicht der Regel zur maximalen Wirkungsweite kanalisierter Zauber. Dieser Zauber ist nicht mit anderen Zaubern des Typus Pfeil kombinierbar.
spell.inevitable_arrow.enhancedescr=Der Pfeil erhält das Merkmal Ablenkend 3.
spell.disaster.descr=Das Ziel erhält einen Malus in Höhe von einem Punkt auf alle Proben und Widerstandswerte. Jedes Ziel kann von diesem Zauber nur einmal gleichzeitig betroffen sein.
spell.disaster.enhancedescr=Malus erhöht sich auf 2 Punkte.
spell.blurred.descr=Die Konturen des Zauberers und die Luft um ihn herum beginnen für den Betrachter unscharf zu flirren und werden verschwommen. Gegen Wesen ohne das Merkmal Dunkelsicht erhält er einen Bonus in Höhe von 3 Punkten auf seine Verteidigung. Außerdem sind Wahrnehmung- Proben, um Details bezüglich des Zauberers auszumachen, um 4 Punkte erschwert.
spell.blurred.enhancedescr=Der Bonus auf Verteidigung erhöht sich auf 4 Punkte.
spell.invisible_for_fairies.descr=Der Zauberer ist für alle Wesen des Typus Feenwesen nicht wahrzunehmen, sofern ihr Geistiger Widerstand niedriger ist als 15 + die Fertigkeitspunkte des Zauberers in Illusionsmagie. Sollte der Zauberer einen Angriff gegen ein entsprechendes Wesen durchführen, wird er für dieses sofort sichtbar.
spell.invisible_for_fairies.enhancedescr=Der Zauberer wird erst 10 Ticks, nachdem er einen Angriff durchgeführt hat, für das entsprechende Wesen sichtbar.
spell.invisible_for_animals.descr=Der Zauberer ist für alle Wesen des Typus Tier nicht wahrzunehmen, sofern ihr Geistiger Widerstand niedriger ist als 15 + die Fertigkeitspunkte des Zauberers in der verwendeten Magieschule. Sollte der Zauberer einen Angriff gegen ein entsprechendes Wesen durchführen, wird er für dieses sofort sichtbar.
spell.invisible_for_animals.enhancedescr=Der Zauberer wird erst 10 Ticks, nachdem er einen Angriff durchgeführt hat, für das entsprechende Wesen sichtbar.
spell.sense_undead.descr=Der Zauberer spürt die Anzahl und Richtung aller im Wirkungsbereich befindlichen Wesen mit dem Merkmal Untot.
spell.sense_undead.enhancedescr=Der Zauberer spürt außerdem die Entfernung, in der sich die entsprechenden Wesen befinden.
spell.turn_undead.descr=Ein Wesen des Typus Untoter erhält für 30 Ticks den Zustand Panisch, selbst wenn es eigentlich immun gegen diesen Zustand ist.
spell.turn_undead.enhancedescr=Ein weiteres Wesen mit einem niedrigeren oder identischen Geistigen Widerstand wie das erste Ziel kann betroffen werden.
spell.smash_undead.descr=Eine sich blitzschnell ausdehnende Kuppel aus intensivem Leuchten geht vom Zauberer aus und vernichtet alle Wesen des Typus Untoter im Wirkungsbereich bis maximal Monstergrad (als Einzelwesen) 1. Alle anderen Wesen des Typus Untoter erhalten für 30 Ticks Dauer die Zustände Benommen 2 und Angsterfüllt (selbst wenn sie eigentlich immun gegen diesen Zustand sind).
spell.smash_undead.enhancedescr=Nicht zerschmetterte Untote erhalten außerdem 1W6+2 Punkte Lichtschaden.
spell.immobile.descr=Während der Wirkungsdauer des Zaubers ist der Zauberer immun gegen alle Versuche, ihn gegen seinen Willen zu bewegen.
spell.immobile.enhancedescr=Der Zauberer erhält außerdem einen Bonus in Höhe von 5 Punkten auf alle Kraftakte.
spell.vacuum.descr=Der Zauberer erschafft eine Zone des Vakuums, in der jedes Lebewesen von Ersticken betroffen ist. Fliegende Wesen, die sich für ihre Flugfähigkeit nicht der Magie bedienen, stürzen ab. Nichtmagisches Feuer erlischt.
spell.vacuum.enhancedescr=Erstickende Ziele haben nur die Hälfte der üblichen Zeit.
spell.darkening.descr=Das Ziel wird von einer Schattenkugel getroffen, die es in einen dunklen Kokon hüllt. Dieser macht die Umgebung für das Ziel schwer erkennbar, ohne dass es selbst schlechter zu sehen wäre. Nur für das Wesen selbst gelten die Lichtverhältnisse als um 2 Stufen verschlechtert.
spell.darkening.enhancedescr=Das Wesen erhält außerdem einen Malus in Höhe von 3 Punkten auf alle Lichtmagie-Proben.
spell.stop_decay.descr=Die unbelebten Zielobjekte mit einer Last von insgesamt 4 Punkten (oder im Falle von Leichen einer kombinierten Größenklasse von 4 Punkten) werden für die Wirkungsdauer vor weiterem Verfall geschützt. Somit können Kräuter, Nahrung oder Kadaver vor dem Verderben bzw. der Verwesung bewahrt werden.
spell.stop_decay.enhancedescr=Es können Objekte mit einer Last von insgesamt 8 oder Leichen bis zu einer kombinierten Größenklasse von 7 vor Verfall geschützt werden.
spell.stiffen.descr=Im Wirkungsbereich verfestigt sich der Boden. Sumpfiger Boden, pulvriger Schnee, Lava und ähnliches wird fest und ist problemlos zu begehen (ein etwaiges Schwieriges Gelände entfällt). Wasser wird so fest, dass es begehbar wird, zählt dabei aber als sehr schwieriges Gelände.
spell.stiffen.enhancedescr=Wasser wird so fest, dass es nur noch als schwieriges Gelände zählt.
spell.hiding_place.descr=Ein Ort, der grundsätzlich als Versteck taugt (also beispielsweise kein öffentlicher Platz oder ähnliches), wird vor den Blicken anderer verborgen. Alle Proben, um den Ort zu entdecken, sind um 8 Punkte erschwert.
spell.hiding_place.enhancedescr=Alle Proben, um den Ort zu entdecken, sind um 12 Punkte erschwert.
spell.preparation.descr=Der Zauberer erhält eine Inspiration, dass ihm ein bestimmter Gegenstand bis Last 2 und bis zu einem Preis von 10 Lunaren in der nahen Zukunft nützen könnte. Wenn er innerhalb der Wirkungsdauer einen entsprechenden Gegenstand benötigt, kann er rückwirkend sagen, dass er ihn auf Basis seiner Inspiration erworben hat (und muss in diesem Fall die Kosten aufwenden) oder dass er einen bereits in seinem Besitz befindlichen Gegenstand auch am Körper führt. Dies ist nur möglich, wenn es zwischen Wirken des Zaubers und Nutzung der Wirkung eine Möglichkeit gab, einen entsprechenden Gegenstand zu erwerben oder wieder an sich zu nehmen. Der Gegenstand wird behandelt, als wäre er die ganze Zeit mitgeführt worden. Wenn man also beispielsweise sämtliche Ausrüstung zurücklassen musste, dann kann man auch keinen Gegenstand dabeihaben.
spell.preparation.enhancedescr=Der Gegenstand kann bis zu Last 3 haben und Kosten von bis zu 15 Lunaren aufweisen.
spell.alert_mind.descr=Bis zu 2 Stufen des Zustands Benommen auf dem Ziel werden während der Wirkungsdauer des Zaubers unterdrückt. Nach Ende der Wirkungsdauer wirken diese Stufen des Zustands wieder, als wäre in der Zwischenzeit keine Zeit vergangen.
spell.alert_mind.enhancedescr=Es werden bis zu 3 Stufen des Zustands Benommen beim Ziel unterdrückt.
spell.weaken_weapon.descr=Eine mit diesem Zauber verzauberte Waffe wird abgewetzt und schartig. Sämtlicher mit ihr angerichteter Schaden sinkt um einen Punkt.
spell.weaken_weapon.enhancedescr=Der Schaden sinkt um insgesamt 2 Punkte.
spell.smash_weapon.descr=Eine mit diesem Zauber verzauberte Waffe wird demoliert, sofern ihre Qualität maximal 2 beträgt.
spell.smash_weapon.enhancedescr=Die Waffe wird auch demoliert, sofern ihre Qualität 3 oder 4 beträgt.
spell.improve_wall.descr=Eine natürliche oder magische Wand oder Tür wird deutlich haltbarer. Sie erhält temporäre Haltbarkeit (vergleichbar temporären Lebenspunkten, siehe S. 72) in Höhe von 20 Punkten. Jedes Objekt kann von diesem Zauber nur einmal gleichzeitig betroffen werden.
spell.improve_wall.enhancedescr=Solange noch mindestens ein Punkt temporäre Haltbarkeit vorhanden ist, erhöht sich auch die Härte des Objekts um 2 Punkte.
spell.water_thrust.descr=Der Zauberer stößt einen Wasserstrahl aus, mit dem er sich oder andere bewegen kann. Auf ein Ziel gerichtet, stößt er dieses 3 m zurück, wenn diesem keine Zähigkeit-Probe gegen 20 gelingt. Auf den Boden gerichtet kann der Zauber als Sprunghilfe genutzt werden, um die Sprungweite beim Springen zu verdoppeln. Unter Wasser kann sich der Zauberer sofortig um 5 m bewegen und dadurch auch aus dem Wasser herausspringen.
spell.water_thrust.enhancedescr=Die Schwierigkeit der Zähigkeit-Probe steigt auf 25. Die Sprungweite wird verdreifacht.
spell.jet_of_water.descr=Ein harter Wasserstrahl trifft das Ziel und bringt es aus dem Gleichgewicht. Der Zauber verursacht 1W10+1 Punkte Wasserschaden mit dem Waffenmerkmal Scharf 3. Zudem erhält innerhalb von 15 Ticks der nächste Angriff eines beliebigen Kampfteilnehmers gegen den vom Zauber Betroffenen einen Taktischen Vorteil.
spell.jet_of_water.enhancedescr=Das Ziel verliert zudem 3 Ticks.
spell.incandescent_hand.descr=Die Hände des Zauberers können auf seinen Wunsch hin vor Hitze flirren und glühen (sofortige Reaktion von 3 Ticks Dauer zum An- und Abschalten). Wenn dies der Fall ist, verursachen seine unbewaffneten Nahkampfangriffe einen Punkt zusätzlichen Feuerschaden. Alle von ihm mit seinen Händen länger als 10 Ticks berührten unbelebten Objekte bis Last 7 fangen Feuer, sofern sie brennbar sind. Dies betrifft auch Ausrüstungsgegenstände des Zauberers. Dieser Zauber ist nicht mit anderen Zaubern des Typus Hand kombinierbar.
spell.incandescent_hand.enhancedescr=Alle nicht brennbaren Gegenstände bis Last 7, die der Zauberer länger als 10 Ticks berührt, erhalten alle 10 Ticks Schaden in Höhe von 2 Punkten (Härte wirkt nicht gegen diesen Schaden). Außerdem erhöht sich der Schaden seiner unbewaffneten Angriffe um einen weiteren Punkt Feuerschaden.
spell.longcast.descr=Alle vom Zauberer geworfenen Objekte sind von den Winden getragen. Ihre Grund-Reichweite verdoppelt sich.
spell.longcast.enhancedescr=Alle entsprechenden Proben zum Werfen erhalten einen Bonus in Höhe von einem Punkt.
spell.lightwave.descr=Vom Zauberer aus entlädt sich eine Welle aus Licht, die drei vom Zauberer bestimmten Wesen im Umkreis von 5 m den Zustand Geblendet 2 verleiht. Sollte es sich dabei um Wesen der Typen Untote, Schattenwesen und Wesen der Finsternis handeln, erhalten sie zusätzlich jeweils 5 Punkte Lichtschaden.
spell.lightwave.enhancedescr=Der Zauberer kann 5 Ziele benennen.
spell.ressurection.descr=Das Ziel des Zaubers, bei dem es sich um ein Wesen bis maximal Größenklasse 6 handeln muss, das zu Beginn der Aktion Zauber vorbereiten für diesen Zauber innerhalb der letzten 60 Ticks verstorben ist, wird wiederbelebt. Es verfügt nun über 1 Lebenspunkt auf der Gesundheitsstufe Todgeweiht.
spell.ressurection.enhancedescr=Der Zeitpunkt des Todes kann bis zu 10 Minuten zurückliegen.
spell.recycling.descr=Bis zu drei bereits einmal von dem Nekromanten erhobene, aber „getötete“ Untote werden erneut erhoben, sofern sie sich innerhalb der Reichweite des Zaubers befinden. Dies gilt nur, wenn die Wirkungsdauer des ursprünglichen Erhebungszaubers grundsätzlich noch nicht verstrichen wäre. Die neu erhobenen Untoten haben eine um 2 Punkte gesenkte Geschwindigkeit und besitzen das Merkmal Zerbrechlich. Besaßen sie das Merkmal bereits, sinken stattdessen ihre Lebenspunkte auf 1.
spell.recycling.enhancedescr=Es können bis zu fünf Untote unter obigen Bedingungen erneut erhoben werden.
spell.power_of_wilderness.descr=Der Zauberer kann sich besonders gut in der Wildnis bewegen. Er erhält einen Bonus in Höhe von 3 Punkten auf seine Geschwindigkeit sowie auf Athletik-Proben in der freien Natur.
spell.power_of_wilderness.enhancedescr=Der Zauberer wird außerdem nicht von natürlichen, die Bewegung einschränkenden Faktoren in der Wildnis (wie Unterholz, Schlingpflanzen und ähnlichem) betroffen.
spell.hibernation.descr=Der Zauberer versetzt sich in eine Art Kälteschlaf, in dem er keine Nahrung, kein Wasser und kaum Atemluft benötigt. Darüber hinaus ist eine etwaige Kältestufe für ihn um 3 Stufen gesenkt. Während der Wirkungsdauer des Zaubers ist er zwar bewusstlos, nimmt aber den Wirkungsbereich dennoch verschwommen wahr. Der Zauber kann auf Wunsch des Zauberers vorzeitig abgebrochen werden. Während des Zaubers kann der Zauberer die normale Anzahl an Ruhephasen nutzen.
spell.hibernation.enhancedescr=Der Zauberer benötigt gar keine Atemluft.
spell.wavebonds.descr=Das Ziel wird von wässrigen Fesseln, die seine Bewegungen einschränken, gepackt. Es zählt für alle Handlungen, als würde er sich in hüfthohem Wasser befinden (siehe Splittermond: Die Regeln S. 170). Zudem werden seine Zaubervorgänge eingeschränkt, sofern diese Geste oder Formel benötigen: Sie erhalten einen Malus in Höhe von 3 Punkten.
spell.wavebonds.enhancedescr=Das Ziel wird so sehr behindert, dass es in Bezug auf seine Handlungen so behandelt wird, als würde es sich vollständig unter Wasser befinden (siehe Splittermond: Die Regeln S. 170).
spell.cauterize.descr=Die Wunden eines freiwilligen Ziels, das einer oder mehrerer Stufen des Zustands Blutend unterliegt, werden ausgebrannt. Der Zustand wird beendet, dafür erleidet das Ziel Feuerschaden in Höhe der Stufe des Zustands.
spell.cauterize.enhancedescr=Das Ziel erleidet maximal einen Punkt Feuerschaden, egal wie hoch die Zustandsstufe war.
spell.copy_throwing_weapon.descr=Der Zauberer erschafft fünf Ebenbilder einer beliebigen berührten Wurfwaffe. Diese besitzen alle aus normaler Qualität resultierende Verbesserungen der Waffe (aber keine legendären oder göttlichen Kräfte, keine Artefaktqualität, keine auf der Waffe liegenden Zauber, etc.). Während des Wurfvorgangs unterliegen die kopierten Waffen nicht den Regeln zur Wirkungsweite kanalisierter Zauber.
spell.copy_throwing_weapon.enhancedescr=Es können sieben Ebenbilder geschaffen werden.
spell.sticky_shadows.descr=Der Zauberer macht alle Schatten zäh, sodass man sich nur schwer durch sie hindurchbewegen kann. Alle Orte im Wirkungsbereich zählen als Schwieriges Gelände, sofern die Lichtverhältnisse dort Leichte Dunkelheit oder schlechter betragen.
spell.sticky_shadows.enhancedescr=Entsprechende Orte zählen als Sehr schwieriges Gelände.
spell.spell_intuitiveness.descr=Der Zauberer nimmt intuitiv die Stärke der Magie in seiner Umgebung wahr. Für die Identifikation oder Analyse von magischen Effekten oder Artefakten im Wirkungsbereich des Zaubers erhält er einen Bonus in Höhe von 3 Punkten.
spell.spell_intuitiveness.enhancedescr=Der Bonus erhöht sich auf 5 Punkte.
spell.spell_constraints.descr=Das Ziel des Zaubers ist während der Wirkungsdauer nicht mehr in der Lage, EG gemäß den Regeln in Splittermond: Die Regeln S. 221 zur Verbesserung seiner Zauber einzusetzen.
spell.spell_constraints.enhancedescr=Auch andere Möglichkeiten des EG-Einsatzes (etwa über Meisterschaften) sind während der Wirkungsdauer nicht möglich.
spell.weaken_spell.descr=Ein auf dem Ziel liegender Zauber verliert seine Verstärkung, falls er entsprechend gezaubert wurde. Um einen bestimmten Zauber auszuwählen, muss dieser zuvor identifiziert worden sein, anderenfalls wird der niedrigstgradige passende Spruch betroffen.
spell.weaken_spell.enhancedescr=Ein weiterer Zauber verliert seine Verstärkung.
spell.overload_spell.descr=Ein kanalisierter Zauber auf dem Ziel bis maximal Grad 3 bricht ab, sofern das Ziel nicht als sofortige Reaktion von 0 Ticks Dauer Fokus in Höhe der halben normalen Kosten des Zaubers aufwendet. Ein bestimmter Zauber kann nur betroffen werden, wenn dieser zuvor identifiziert wurde. Ansonsten wird der niedrigstgradige auf dem Ziel liegende Zauber betroffen.
spell.overload_spell.enhancedescr=Das Ziel muss Fokus in Höhe der vollen normalen Kosten aufwenden.
spell.veil_spell.descr=Ein mit diesem Zauber belegter Zauber wird magisch überlagert und ist schwieriger zu durchschauen, zu identifizieren und zu analysieren. Entsprechende Proben erhalten einen Malus in Höhe von 9 Punkten. Sollte der verzauberte Zauber enden, endet auch dieser Zauber. Dieser Zauber benötigt weder Formel noch Geste.
spell.veil_spell.enhancedescr=Entsprechende Proben erhalten einen Malus in Höhe von 15 Punkten.

spell.summon_stone_0.descr=Der Zauberer ruft ein Wesen des Typus Felswesen, das außer diesem Typus und dem Merkmal Beschwörbares Wesen 1 keinerlei sonstige Spielwerte besitzt. Es begleitet den Zauberer, als hätte es den Dienst Folge erhalten. Das Wesen kann den Dienst Stelle Essenz bereit ausführen.
spell.summon_stone_0.enhancedescr=Für den Dienst Stelle Essenz bereit gilt die Stufe des Merkmals Beschwörbares Wesen als um 1 erhöht.
spell.summon_stone_1.descr=Der Zauberer ruft ein Wesen des Typus Felswesen mit dem Merkmal Beschwörbares Wesen 1. Bei Erlernen des Zaubers muss ein passendes Wesen festgelegt werden, das in der Folge gerufen werden kann. Weitere Wesen können nur gerufen werden, wenn sie mit entsprechenden Meisterschaften erworben werden.
spell.summon_stone_1.enhancedescr=Das Wesen erhält die Modifikationen einer passenden Rolle aus dem Baukasten auf S. 195.
spell.summon_stone_2.descr=Der Zauberer ruft ein Wesen des Typus Felswesen mit dem Merkmal Beschwörbares Wesen 3 oder niedriger. Bei Erlernen des Zaubers muss ein passendes Wesen festgelegt werden, das in der Folge gerufen werden kann. Weitere Wesen können nur gerufen werden, wenn sie mit entsprechenden Meisterschaften erworben werden.
spell.summon_stone_2.enhancedescr=Das Wesen erhält die Modifikationen einer passenden Rolle aus dem Baukasten auf S. 195.
spell.summon_stone_3.descr=Der Zauberer ruft ein Wesen des Typus Felswesen mit dem Merkmal Beschwörbares Wesen 5 oder niedriger. Bei Erlernen des Zaubers muss ein passendes Wesen festgelegt werden, das in der Folge gerufen werden kann. Weitere Wesen können nur gerufen werden, wenn sie mit entsprechenden Meisterschaften erworben werden.
spell.summon_stone_3.enhancedescr=Das Wesen erhält die Modifikationen einer passenden Rolle aus dem Baukasten auf S. 195.
