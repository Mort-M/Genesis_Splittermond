creature.SpringChild.desc=Einem Frühlingskind begegnet man meist, wie der Name schon andeutet, im Frühling, auf windigen Wiesen und Feldern, in Gärten und lichten Wäldern. Es besteht aus wirbelnden Winden, in denen bunte Blütenblätter umhertanzen, und erinnert in seiner äußeren Gestalt grob an einen jungen Humanoiden. Frühlingskinder sind freundliche, neugierige Wesen, die stets bereit sind, zu helfen und zu heilen. Sie genießen Aufmerksamkeit und spielen gerne Spiele, bei denen man herumtoben kann. Freiwillig kämpfen Frühlingskinder nie, sondern warten verschreckt in einiger Entfernung, um sich nach dem Kampf um alle Verletzten zu kümmern. Sollte ein Frühlingskind angegriffen werden, wird es erst versuchen zu fliehen, bevor es sich wehrt. Nur wenn es eingesperrt wird oder eine lange Zeit am selben Ort verbringen muss, verliert ein Frühlingskind seine freundliche, quirlige Art und wird melancholisch; dann verlieren sogar die bunten Blütenblätter, die in seinem Körper umhertanzen, ihre Farbe.
creature.ShiningWarrior.desc=Ein Gleißender Krieger ist ein Wesen aus purem, goldenem Licht, dessen einziger Daseinszweck im Kampf gegen die Finsternis besteht. Das Feenwesen von grob humanoider Form ist schwer gerüstet und stets zum Kampf bereit. Seine leuchtenden Schwingen sehen beeindruckend aus, tragen ihn aber nur langsam durch die Lüfte. Sein Schwert scheint aus purem Sonnenlicht zu bestehen, seine Stimme ist tief und trägt mühelos über den Lärm eines Kampfplatzes. Wenn ein Gleißender Krieger einen Kampf beginnt, wird er ihn nicht beenden, ehe der Gegner besiegt oder er selbst vernichtet ist. Er ist ein Bollwerk des Lichts und ein furchtbarer Gegner für jeden Untoten und jede Kreatur der Finsternis. Seine direkte Kampfweise lässt allerdings wenig Spielraum für Überraschungen oder taktische Finesse \u2013 etwas, in dem die hinterhältigen Diener der Finsternis sehr bewandert sind.
creature.GlowSmoke.desc=Ein Glutrauch verbindet die Elemente Feuer und Wind auf eine gefährliche Art und Weise: Er kann im Diesseits entstehen, wenn ein sehr starker Wind auf ein sehr heißes Feuer trifft, und er betrachtet es als seine Aufgabe, ein Feuer so lange wie möglich am Brennen zu halten. Gerade in stürmischen Regionen sind die Wesen gefürchtet, da sie bei einem Feuerausbruch jeglichen Löschversuch aktiv behindern. Sie treten meist in Form einer dunklen Aschewolke auf, in der vereinzelt heißglühende Funken tanzen, und ihre Stimme klingt wie das Knistern hunderter Tannennadeln im Feuer. Ein Glutrauch liebt es, ein Feuer anzufachen, bis es nicht mehr heißer werden kann. Gerüchten zufolge haben sich einige Meisterschmiede diese Eigenschaft zu Nutze gemacht und ein solches Exemplar an ihre Esse binden können. Es gibt jedoch weitaus mehr Geschichten von niedergebrannten Werkstätten als von einer erfolgreichen Partnerschaft zwischen Schmied und Glutrauch.
creature.StoneGolem.desc=Golems sind magisch belebte künstliche Wesen, die mittels Zauberei kurzzeitig oder dauerhaft zum Leben erweckt werden können. Sie können dabei gänzlich unterschiedliche Formen annehmen - passend zu den vielen verschiedenen Rollen, die sie auszufüllen in der Lage sind. Vom einfachen Arbeiter über die laufende Truhe bis hin zur pferdelosen Kutsche ist praktisch alles denkbar! Für mehr zu Golems konsultieren Sie das entsprechende Kapitel ab S. 197.
creature.WoodenRunningChest.desc=Golems sind magisch belebte künstliche Wesen, die mittels Zauberei kurzzeitig oder dauerhaft zum Leben erweckt werden können. Sie können dabei gänzlich unterschiedliche Formen annehmen - passend zu den vielen verschiedenen Rollen, die sie auszufüllen in der Lage sind. Vom einfachen Arbeiter über die laufende Truhe bis hin zur pferdelosen Kutsche ist praktisch alles denkbar! Für mehr zu Golems konsultieren Sie das entsprechende Kapitel ab S. 197.
creature.MetalCarriage.desc=Golems sind magisch belebte künstliche Wesen, die mittels Zauberei kurzzeitig oder dauerhaft zum Leben erweckt werden können. Sie können dabei gänzlich unterschiedliche Formen annehmen - passend zu den vielen verschiedenen Rollen, die sie auszufüllen in der Lage sind. Vom einfachen Arbeiter über die laufende Truhe bis hin zur pferdelosen Kutsche ist praktisch alles denkbar! Für mehr zu Golems konsultieren Sie das entsprechende Kapitel ab S. 197.
creature.TombCat.desc=Als Gruftkatzen bezeichnen lorakische Nekromanten allerlei Arten von zum Unleben erhobenen mittelgroßen Tieren. Diese sind nur von geringer Macht und gehören dennoch zu häufig erschaffenen Wesen, taugen sie doch hervorragend als Wachbestien oder zur Unterstützung größerer Untoter. Da sie alleine jedoch keine große Gefahr für irgendwen darstellen, verwundert es kaum, dass diese Wesen oft in größeren Gruppen erschaffen werden.
creature.Keeper.desc=Manchmal entstehen in Lorakis Orte, an denen ein einzelnes Element derart mächtig ist, dass es seine eigenen Elementarwesen gefährdet: Ein Sturm der stark genug ist, einen Windling zu zerfetzen, oder ein Feuer, das selbst einen Flammling verbrennen könnte. In solchen Konstellationen bildet sich aus dem Element manchmal ein Hüter heraus, dessen einzige Aufgabe es ist, die minderen Elementare vor den zu starken Auswirkungen ihres eigenen Elements zu schützen. Diese Hüter treten als schwebende, kugelförmige Wesen auf und folgen ihrem Schutzbefohlenen in kurzem Abstand überall hin. Sie verstehen nicht viel mehr als den Drang, ihren Schützling vor jeder Widrigkeit zu bewahren - wobei sie bei dieser Aufgabe mitunter sehr kreativ werden können.
creature.BoneCrusher.desc=Knochenschänder sind grauenhafte Wesen, die durch mächtige Todesmagie erweckt wurden. Sie bestehen häufig aus der Leiche einer mächtigen Kreatur, beispielsweise eines Wyvern oder niederen Drachen, manchmal aber auch aus grotesk miteinander verschmolzenen Leichenteilen schwächerer Wesen. Ein Knochenschänder ist ein schrecklicher Gegner, und wer dem Anblick, dem Gestank und den widerlichen Geräuschen standhält, muss sich mit einem brutalen Wesen in einem Kampf auf Leben und Tod messen. Nur sehr mächtige Nekromanten sind in der Lage, einen Knochenschänder überhaupt zu erheben und zu kontrollieren. Dabei werden diese häufig als Wächter der größten Geheimnisse und Schätze eingesetzt. Ob einfache Wertgegenstände den Kampf mit solch einem Wesen wert sind, darf allerdings bezweifelt werden.
creature.CrystalShifter.desc=Ein Kristallwandler ist ein im Diesseits wahrhaft seltener Anblick. Es ist ein schüchternes, vierbeiniges Wesen aus Kristall und Licht, welches aktiv dunkle Orte aufsucht, um sie zu erleuchten. So kann man Kristallwandler tief in Höhlen und Minen dabei beobachten, wie sie einen leuchtenden Kristall aus ihrem Körper herausbrechen, um ihn regelrecht in die Wände und Decken einzupflanzen. Diese leuchtenden Kristalle wiederum wachsen über Jahre tief in den Fels, weshalb sie bei einigen Zwergenvölkern berüchtigt dafür sind, die strukturelle Integrität einer Mine zu gefährden. Stirbt ein Kristallwandler, bleibt ein schwach leuchtender Kristall zurück. Treibt man diesen tief in reinen Fels, wächst innerhalb eines Monats ein neuer Kristallwandler heran.
creature.MagmaWalker.desc=Die Begegnung mit einem Magmaläufer ist ein wahrhaft beindruckendes Ereignis, erscheinen diese Wesen im Diesseits doch gewöhnlich nur an Orten, an denen reine Formen der Elemente Feuer und Fels aufeinandertreffen. Meist nehmen diese Wesen die Gestalt imposanter Kreaturen an, wie Berglöwen, große Wölfen oder Riesensalamander. Dabei ähneln sie diesen nur entfernt, und ihre elementare Natur ist deutlich zu erkennen. Ein Magmaläufer bleibt häufig im Umkreis des Ortes, an dem er entstanden ist, wandert dabei jedoch ohne erkennbares Muster durch sein Revier. Sein Wesen ist majestätisch, aber sprunghaft. Begegnet man ihm mit Ehrfurcht und Respekt, kann man sich meist noch zurückziehen, bevor er zum Angriff ansetzt. An vulkanisch sehr aktiven Orten können sich auch kleinere Gruppen von Magmaläufern zusammenfinden, die dann einem Rudel ähnlich agieren und ihr Revier erbittert verteidigen. Entfernt sich ein Magmaläufer länger als einen Tag von einer feurigen Hitzequelle, verwandelt er sich langsam in eine Steinstatue, wobei dieser Prozess bei ausreichender Hitze auch wieder rückgängig gemacht werden kann.
creature.WeakNatureSpirits.desc=So vielfältig Naturgeister auch sein können, kann man sie doch grob in drei Kategorien einteilen: Pflanzengeister nehmen die Form einer Pflanze an; ihr Interesse gilt den Pflanzen ihres Lebensraumes und sie stören sich an allem, was diese gefährdet, wie etwa Holzfäller, Köhler oder auch Orks. Tiergeister nehmen eine Gestalt an, die Ähnlichkeit zu einem Tier hat, und kümmern sich vor allem um die tierischen Bewohner ihres Lebensraumes. Sie stören sich an denjenigen, die ohne Hunger töten, die nur zum Spaß jagen und die mehr nehmen, als sie brauchen. Geister des Landes schließlich verkörpern die manifestierte Urgewalt der Natur. Sie treten meist an Orten ins Diesseits, an denen die Natur besonders ungestört oder rein ist, etwa an glasklaren Bergseen und in einem undurchdringlichen Urwald. Sie gehen gegen alles vor, was die Unberührtheit ihrer erwählten Heimat stört.
creature.MediumNatureSpirit.desc=So vielfältig Naturgeister auch sein können, kann man sie doch grob in drei Kategorien einteilen: Pflanzengeister nehmen die Form einer Pflanze an; ihr Interesse gilt den Pflanzen ihres Lebensraumes und sie stören sich an allem, was diese gefährdet, wie etwa Holzfäller, Köhler oder auch Orks. Tiergeister nehmen eine Gestalt an, die Ähnlichkeit zu einem Tier hat, und kümmern sich vor allem um die tierischen Bewohner ihres Lebensraumes. Sie stören sich an denjenigen, die ohne Hunger töten, die nur zum Spaß jagen und die mehr nehmen, als sie brauchen. Geister des Landes schließlich verkörpern die manifestierte Urgewalt der Natur. Sie treten meist an Orten ins Diesseits, an denen die Natur besonders ungestört oder rein ist, etwa an glasklaren Bergseen und in einem undurchdringlichen Urwald. Sie gehen gegen alles vor, was die Unberührtheit ihrer erwählten Heimat stört.
creature.Tendril.desc=Die gänzlich aus Ranken, Blüten und Dornen bestehenden Rankenbolde treten häufig an Orten auf, die eine Nähe zur Feenwelt aufweisen und gleichzeitig möglichst unberührte Natur darstellen. Sie sind vorsichtige und doch sehr neugierige Wesen, und sobald sie eine Situation als ungefährlich eingestuft haben, können sie mitunter sehr forsch werden. Vor allem interessieren sie Lebewesen und Pflanzen, denen sie noch nie begegnet sind, und so sieht man sie häufig von Baum zu Baum und Tier zu Tier wuseln, bis sie alles über diese erfahren haben. Rankenbolde können nicht sprechen, sondern drücken ihren Gemütszustand über die Färbung ihrer Blütenblätter aus. Bei vielen im Einklang mit der Natur lebenden Völkern gilt es als gutes Omen, einem Rankenbold zu begegnen, und als unheilvoll, ihn zu verärgern - selbst dann, wenn dieser in seiner Neugier das ganze Dorf durchstöbert.
creature.Shadowwing.desc=Eine Schattenschwinge kann an Orten ins Diesseits treten, an denen Schatten über einen längeren Zeitraum immer wieder auf magische Weise verändert oder erschaffen werden. Die künstlichen magischen Schatten werden von einer feeischen Präsenz erfüllt und fühlen eine gewisse Loyalität zu demjenigen, der die Schatten geformt hat. Zum Leidwesen der entsprechenden Magier drücken sie ihre Zuneigung auch durch Streiche und Beleidigungen aus, die zwar nie wirklich gefährlich werden, den Alltag jedoch durchaus anstrengend machen können. Ihre Hände sind jedoch recht geschickt, daher machen einige Zauberkundige aus der Not eine Tugend und nutzen eine Schattenschwinge als Helfer oder Assistent, manche freunden sich sogar mit ihnen an. Schattenschwingen sind lichtscheu und bevorzugen düstere Orte. Wenn sie zu lange allein gelassen werden, beginnen sie häufig lautstarke Selbstgespräche zu führen, die manches Mal sogar in einem handfesten Streit mit sich selber enden.
creature.SunbirdLight.desc=Der Sonnenvogel ist eine vogelartige Gestalt aus reinem Licht. Seine Federn schimmern golden, doch sobald er eine verliert, nimmt sie einen reinweißen Farbton an. Das Erscheinen eines Lichtvogels im Diesseits ist häufig ein Zeichen dafür, dass die Kräfte des Lichts an einem Ort gefährdet sind: ein ungeweihtes Grab in der Wildnis, bei dem die Gefahr besteht, dass der Begrabene sich als Untoter erhebt, oder eine düstere Höhle, in der sich unnatürliche Schatten sammeln - solche Orte ziehen einen Sonnenvogel magisch an und er beginnt, über sie zu wachen. Er wird jedes Schattenwesen und jeden Untoten direkt und ohne Umschweife mit voller Kraft attackieren. Wer ihm hilft, einen solchen Ort zu reinigen, den wird der Sonnenvogel hingegen einige Tage aus Dankbarkeit beschützen, bis er irgendwann in einem gleißenden Licht verschwindet.
creature.HauntedShadow.desc=Ein Spukschatten entsteht, wenn ein Lebewesen im Moment seines Todes größte Verzweiflung oder unbändigen Zorn spürt. Die Emotion manifestiert sich als durchscheinender Schatten des Verstorbenen und sucht den Ort des Todes heim oder verfolgt diejenigen, denen die Verzweiflung oder der Zorn galt. Dies können die Mörder sein, aber auch Familienangehörige oder andere wichtige Personen im Leben des Verstorbenen. Dabei kennt das Wesen keine andere Emotion als die, aus der es geboren wurde. Nur schemenhaft erinnert es sich an das Leben des Verstorbenen, was den Zorn oder die Verzweiflung meistens bloß steigert. Es ist allerdings auch schon vorgekommen, dass die Hinterbliebenen sich liebevoll um einen Spukschatten gekümmert haben, wodurch sich dieser in einen regulären, aber friedfertigen Spuk (siehe Splittermond: Die Regeln S. 280) wandelte, der sich fortan dem Schutz der Hinterbliebenen verschrieb.
creature.StormDancer.desc=Wo immer die reinen Elemente Wasser und Wind mit Wucht aufeinandertreffen, können Sturmtänzer ins Diesseits treten, wo sie die grobe Gestalt eines dort lebenden Wesens annehmen. Auf einem vom Sturm gepeitschten Meer kann ihre Form an einen Delphin oder Rochen erinnern, in einem tosenden Gewittersturm mag man die Form eines Falken oder Adlers erkennen. Sie toben und wüten gegen alles, was sich ihnen in den Weg stellt, und doch spiegeln sie dabei nur das Chaos der Natur wieder. Sie handeln nicht mit böser Absicht, sondern verleihen vielmehr dem Zorn der Elemente eine Form. Sturmtänzer wirken aus der Ferne elegant, beinahe tänzerisch in ihren Elementen. Kommt es jedoch zum Kampf, greifen sie wahllos und planlos an, immer ganz im Moment gefangen und jeder Laune folgend. Nur selten gelingt es, einen Sturmtänzer vom Kampf abzubringen \u2013 und dann auch nur, wenn man ihm ein besseres Ziel für seine Wut bieten kann als einen selbst. Außerhalb von starken Stürmen verlieren Sturmtänzer immer mehr an Substanz, weswegen nur an wirklich sturmgeplagten Orten auch ältere, eventuell weisere Sturmtänzer existieren.
creature.TeemingTerror.desc=Ein Wimmelnder Schrecken ist eine Ansammlung von Leichenteilen sowie Kleintierleichen, die mit Todesmagie erhoben wurden, um sie auf einen Gegner zu hetzen. Je größer die Ansammlung ist, desto gefährlicher ist auch der Wimmelnde Schrecken. Für viele Nekromanten ist das Erheben eines Wimmelnden Schreckens die erste erfolgreiche Untotenerhebung ihres Lebens. Häufig wird ein Wimmelnder Schrecken aber auch von erfahreneren Nekromanten eingesetzt, um etwaige Verfolger aufzuhalten oder den stärkeren Untoten eine bessere Kampfsituation zu verschaffen. Da es nicht viel braucht, um ihn zu erheben, gibt es einige der Todesmagie verbundene Orte, an denen ein Wimmelnder Schrecken auch von sich aus entstehen kann. Diese wilden Schwärme liegen meist still, bis sich ein unbedachtes Lebewesen nähert, nur um es dann mit aller Kraft anzufallen.
creature.Diaper.desc=Windlinge erscheinen im Diesseits meist an Orten, die von starken Winden beeinflusst werden und eine Nähe zur magischen Domäne aufweisen. Aufgrund ihrer neugierigen Natur und ihres unsteten Wesens kann man einige Windlinge allerdings auch weit abseits solcher Orte finden. Windlinge beherrschen keine Sprache, sind aber in der Lage, ihre Gefühlslage durch verschiedene Pfeif- und Rauschgeräusche auszudrücken, was sie auch gerne tun. Sie sind zudem neugierige Wesen, deren Aufmerksamkeitsspanne sehr begrenzt ist. So kann es passieren, dass sie jemanden zuerst interessiert umschwirren, nur um ein paar Sekunden später von einer scheinbaren Nichtigkeit abgelenkt zu werden. Die Persönlichkeiten von Windlingen sind vielfältig, doch meist schon leicht an ihrem Erscheinungsbild zu erkennen. Von sanften Varianten, die als warme Brise ihre Beobachter umspielen, bis zu kleinen Gewitterwolken, die beständig jemanden suchen, den sie mit kleinen Elektroschocks stören können, kann man allem begegnen. Allerdings handelt kein Windling dabei je wirklich böswillig, meist sind sie einfach neugierig auf die Reaktionen ihrer Umgebung.
creature.Wogling.desc=Woglinge trifft man meist nur in und an Gewässern, die eine Nähe zur Feenwelt aufweisen. Sie können nicht sprechen und nur geübte Zuhörer vermögen den verschiedenen Gluckerlauten zu entnehmen, wie es um den Gefühlszustand des Woglings gerade bestellt ist. Sie interessieren sich kaum für etwas, das weiter als ein paar Meter von ihrem Heimatgewässer entfernt ist; diese verteidigen sie allerdings häufig vehement vor jeder Art der Verunreinigung. Woglinge, die in den Buchten und Fjorden der Meere leben, sind meist aufbrausender und unsteter als ihre binnenländischen Artgenossen. Allen Arten ist jedoch gemein, dass sie so gut wie nie alleine auftreten, sondern stets in kleinen Gruppen mit drei oder mehr Mitgliedern. Lebewesen, die in ihrem Heimatgewässer natürlicherweise vorkommen, begegnen Woglinge liebevoll und beschützend. Mehr als einmal mussten Fischer schon tapfere Kämpfer bitten, die Woglinge zu vertreiben, damit sie ihrer Arbeit nachgehen konnten.

creaturefeaturetype.summonable_creature.desc=Das Wesen kann von Zaubern, die Wesen mit passendem Typus und mit der entsprechenden Stufe des Merkmals beschwören, beschworen werden. Das Wesen kann in beschworenem Zustand seine Zauber nicht einsetzen und es kann nur seinen Basisdienst sowie die Dienste Folge und Warte ausführen. Für die Nutzung der entsprechenden Dienste gelten die ab S. 188 aufgeführten Regeln.
creaturefeaturetype.golem.desc=Das Wesen ist ein Golem. Es folgt den Befehlen desjenigen, der ihn mittels eines zur Stufe des Merkmals passenden Zaubers animiert hat (oder der im Rahmen eines Rituals zu seinem Herrn bestimmt wurde, und führt dabei die Instruktionen Folge und Warte sowie eine weitere Instruktion aus, die im Golem grundsätzlich implementiert ist. Für die Nutzung der Instruktionen und weitere Parameter gelten die ab S. 200 aufgeführten Regeln.
creaturefeaturetype.construct.desc=Ein Konstrukt gilt als magisches Objekt, nicht als Wesen, verfügt aber dennoch über Lebenspunkte und Schadensreduktion (auch im nichtanimierten Zustand). Es besitzt keine Einstellung und kann nicht durch die Regeln des sozialen Konflikts beeinflusst werden. Ein Konstrukt ist immun gegen Betäubungsschaden, Bewusstlosigkeit, Ersticken, Krankheiten, Schlaf, Vergiften und Verhungern. Zauber des Typus Kontrolle, Objekt und Leben wirken auf es nicht, außer diese nehmen explizit auf Konstrukte Bezug. Es ist nicht durch übliche Heil- oder Reparaturzauber heilbar, ebenso besitzt es keine natürliche Regeneration von Lebenspunkten. 
creaturefeaturetype.pacifist.desc=Das Wesen greift niemanden an und wehrt sich nicht, selbst wenn es angegriffen wird. Es führt auch keine entsprechenden Befehle, sei es per Dienst, Instruktion oder ähnlichem, aus. 
creaturefeaturetype.veiled.desc=Das Wesen kann einen Punkt Fokus erschöpfen (sofortige Reaktion von 3 Ticks), um schwer sichtbar zu werden. Das Wesen erhält einen Bonus auf seine Heimlichkeit in Höhe von 5 Punkten. Dieser Wert erhöht sich außerdem um den höchsten der folgenden Werte: Stufe des Merkmals Beschwörbares Wesen; doppelte Stufe des Merkmals Kreatur; dreifacher Monstergrad als Einzelwesen. Das Wesen kann, während es verhüllt ist, nur Bewegungshandlungen nutzen. Außerdem kann die Nutzung dieses Merkmals wie eine kontinuierliche Handlung abgebrochen werden.

education.bancaster.descr=Diese Gegenzauberer lernen, magischen Bedrohungen entweder klug vorzubeugen oder sie reaktionsschnell auszuschalten, während sie entstehen. Manche achten darauf, dass etwa in dicht besiedelten Städten kein Schaden durch übermäßige Zauberei entsteht, manche reisen als gefragte Lohnmagier von Ort zu Ort, wieder andere arbeiten als ständige Wächter ganz bestimmter Stätten und Persönlichkeiten. Die wohl respektabelsten Bannwirker sind die Hofmagier der Mächtigen, die eine Beeinflussung von Würdenträgern und Attentate auf sie verhindern sollen. Sie unterweisen ihre Schützlinge oft auch selbst zumindest in den Grundlagen der Bannmagie.\nDie Ausbildung von Bannwirkern ist vielfältig: In Körper und Geist gleichermaßen fordernden Übungen schärfen sie ihre Sinne und erweitern ihr magisches Potenzial, um es mit ihren Kontrahenten aufnehmen zu können. Sie lernen, Blockaden im Fluss der Umgebungsmagie zu errichten und das magische Geflecht eines Zaubers durch feinste Manipulation oder durch schiere Kraft zu zerreißen. Bannwirker sind oft auch Meister darin, Zauberwirkungen zu erkennen und die dahinterstehenden Kräfte zu analysieren, denn wer Magie wirksam bekämpfen will, der muss sie zuerst verstehen.\n\Vor allem aber lernen Bannwirker, mit anderen zusammenzuarbeiten, denn allzu oft ist es mit dem Brechen eines Zaubers oder dem Aufhalten eines Dämons nicht getan: Jemand muss sich auch dem dazugehörigen Zauberer entgegenstellen oder den bösen Geist zurück in die Anderswelt schicken, bevor die Kräfte des Bannwirkers schwinden.
education.charmedagainst.descr=Die Gefeiten der Durghach sind Mittler zwischen Feen und Sterblichen und sorgen dafür, dass letztere nicht von der \u201ESchönen Familie\u201C überlistet werden. Sie durchschauen Trugbilder, errichten magische Grenzen, wehren Flüche ab und überwachen Paktschlüsse der Clans mit dem Feenvolk.
education.shieldwatcher.descr=Die Schildwächter des Wächterbunds haben sich ganz der Bekämpfung der Finsternis aus den Verheerten Landen verschrieben. Sie brechen vor allem Zauber ihrer eigenen Gefährten, die durch die dortige unberechenbare Umgebungsmagie in ihrer Wirkung verkehrt wurden, und schützen ihre Mitwächter und Burgen vor Besessenheit und magischen Monstrositäten.
education.rehabilitator.descr=Die farukanischen Ehrenretter kommen vor allem aus den Shahiraten Aitushar, Ashurmazaan, Farukhur und Pashtar. Sie wollen Unschuldige davor bewahren, unter magischer Beeinflussung ehrenrührige Taten gegen ihren Willen zu begehen oder bei Geschäften magisch übervorteilt zu werden.
education.summoner.descr=Überall in Lorakis greifen Sterbliche auf die Hilfe von Wesen aus anderen Domänen zurück \u2013 seien es Feen, Geister oder gar Diener der Götter. Doch kaum jemand hat das Rufen von Kreaturen der Anderswelt so perfektioniert wie der Beschwörer. Oft bringt er gleich mehrere Magieschulen zur Meisterschaft und ist etwa in der Lage, Wesen des Feuers ebenso herbeizurufen wie Kreaturen des Wassers.\nDoch trotz der ihnen gemeinen Macht über die Bewohner der Anderswelt unterscheiden sich Beschwörer in ihrer Herangehensweise an ihre Kräfte teils stark: Während mancher Beschwörer die herbeigerufenen Kreaturen als Werkzeuge sieht, die es unter den eigenen Willen zu zwingen gilt, sehen andere Vertreter dieser Zunft die beschworenen Wesen als Verbündete, die ihnen in Notlagen helfen und die es gut zu behandeln gilt.\nViele Beschwörer suchen auch abseits ihrer Zauberkräfte die Nähe von Wesen der Anderswelt \u2013 nicht selten werden sie sogar dauerhaft von einer solchen Kreatur begleitet, die sich ihnen aus freien Stücken auf den Reisen durch das Diesseits angeschlossen hat. Meist geht der Beschwörer ein besonders enges Band zu diesem Wesen ein, gleich ob er es als nützlichen Diener oder echten Freund betrachtet.
education.cryptmaster.descr=In Patalis werden vor vielen wichtigen Entscheidungen die gelehrten Gruftmeister befragt, stehen sie doch in stetem Kontakt mit den Ahnengeistern und sind in der Lage, die Hausgeister der sie beauftragenden Familien zu rufen. Sie sind Meister der Geisterbeschwörung, können aber auch die Mächte von Licht und Schatten unter ihren Willen zwingen \u2013 und nutzen dies, um alte Traditionen zu bewahren und die patalische Kultur zu schützen.
education.snakecharmer.descr=Uralt ist die Tradition der einzelgängerischen Schlangenrufer, die Natur- und Elementarwesen als Diener der Weltenschlange Zarusz verehren und oft deren Hilfe erbitten. Dabei erscheinen alle Wesen stets in schlangenhafter Form und Gestalt, ohne dass irgendwer den Grund hierfür kennen würde. Ursprünglich aus Gulong stammend, haben auch einige Gnome aus Tar-Kesh diese Tradition angenommen.
education.titanchild.descr=Die Titanenkinder der Stromlandinseln leben in und mit den sie umgebenden Naturgewalten. Egal ob an einem brodelnden Vulkan oder in einem Sturm, sie versuchen immer, den Titanen aller Elemente nahe zu sein und ihren Willen zu ergründen. Dieses Unterfangen führt sie oft weit von ihrer Heimat fort, doch wissen sie ihre Patrone im Wüten der Naturgewalten auf ganz Lorakis an ihrer Seite.
education.combatmage.descr=Wo die meisten magiebegabten Krieger Zauberei vor allem zur Unterstützung ihrer Kampffähigkeiten verwenden, konzentrieren sich Kampfmagier voll und ganz auf ihr magisches Potential und darauf, wie sie dieses in Konflikten direkt einsetzen können. Körperliche Übungen und Ausdauer dienen in erster Linie dazu, die Strapazen einer Schlacht oder eines Kampfes zu überstehen. Einige üben sich auch grundsätzlich im bewaffneten Kampf, um in Notsituationen in der Lage zu sein, sich zur Wehr zu setzen. Für die Überwindung ihrer Feinde und das Erreichen ihrer Ziele setzen sie jedoch ganz auf ihre Zauberei.\nEin mächtiger Kampfmagier ist ein furchterregender Anblick. Die begabtesten und erfahrensten unter ihnen kesseln ganze Feindesgruppen mit Flammenwänden ein oder zerreißen einen Gegner mit schierer magischer Macht. Zwar können auch sie kaum den Ausgang einer Schlacht im Alleingang bestimmen \u2013 aber ein solcher Magier auf der eigenen Seite kann gegen einen unvorbereiteten Gegner durchaus den Unterschied zwischen Sieg und Niederlage ausmachen.\nEine ständige Gefahr ist der Einfluss der Magie auf die Umwelt: Wo meisterhafte Zauberer magische Gewalten entfesseln, kann die Balance der Welt schnell aus den Fugen geraten. Daher kämpfen Kampfmagier, wenn sie überhaupt Teil einer Armee sind, häufig nur einzeln als Teil größerer Truppenverbände. Echte Einheiten, die ganz aus Kampfmagiern bestehen, sind außerordentlich selten \u2013 dafür aber umso schlagkräftiger.
education.castigar.descr=Die Castigaren aus Eisenbrann gehören zu den wenigen wirklich militärisch organisierten Einheiten von Kampfmagiern. Häufig sind sie als Teil größerer hiesiger Söldnertruppen zu finden, nicht selten in der Stellung eines Unterführers: Neben ihrem Kampfpotential werden die Castigaren schließlich auch ausführlich in Strategie und Taktik geschult.
education.leiyu.descr=Die wenigen Leiyu aus der Katzenprovinz in Zhoujiang haben ihre Herkunft in den meisterhaften Windmagiern der Küsten und sind darauf spezialisiert, in einem Kampf eine Art \u201ELufthoheit\u201C herzustellen: Von stürmischen Winden vor Projektilen geschützt, schweben sie unerreichbar über dem Geschehen und lassen Blitz und Donner auf ihre Feinde niederregnen.
education.steelshield.descr=Im Gegensatz zu den eher offensiven Fähigkeiten der meisten Kampfmagier stehen die Stählernen Schilde aus Dalmarien. Sie spezialisieren sich darauf, sich und die Kämpfer um sich herum (sowie vor allem wichtige Heerführer und Spezialisten) am Leben zu halten \u2013 wobei auch sie wissen, dass eine Flammenlanze gegen einen Angreifer ihre Gefährten ebenso gut schützt wie es ein Schutzzauber vermag.
education.beingcreator.descr=Viele Wesensschöpfer besitzen große ausgebaute Werkstätten oder unterirdische Kellergewölbe, in denen sie ihrem Werk ungestört nachgehen können und nicht wenige von ihnen sehen sich eher als Handwerker, die aus einem Werkstoff etwas schaffen, das größer ist als die Summe seiner Teile.\nIn jahrelangen Studien und Praxisübungen spezialisieren sich Wesensschöpfer auf ihre magische Kunst. Aber auch die Instandhaltung und Verstärkung der eigenen Werke ist ein wichtiger Teil der Ausbildung junger Adepten. Ein Golembauer übt sich daher auch stets in den handwerklichen Aspekten seiner Kunst, ebenso wie ein Nekromant sich mit der Heilkunde beschäftigt (und seies nur, um einem Untoten einen abgefallenen Arm wieder annähen zu können). Je nach Fachgebiet gehören aber auch Grundwissen in anderen nützlichen Magieschulen und das Verhandeln mit möglichen Kunden zum gängigen Lehrplan.
education.brother_of_the_skull.descr=Die Bruderschaft des Schädels (siehe auch S. 10) mischt mehr oder minder aktiv in der tyrannischen Politik Midstads mit. Jedes Geplänkel, das von den Truppen König Finns geschlagen wurde, zieht die Mitglieder dieses Nekromantenkultes an, um neue Diener auf dem blutgetränkten Schlachtfeld zu erheben \u2013 und diese dann je nach zahlendem Auftraggeber für oder gegen die Zwecke des Königs einzusetzen.
education.formgiver.descr=Durch die republikanische Verfassung wurden auch viele der alten Magierfamilien Kungaitans gezwungen, sich den bestehenden Paradigmen des Handels, Handwerks und Militärs anzupassen. Einige der ehrgeizigeren Familien schlossen sich kurzerhand zu den Formgebern zusammen, einem losen Bund an Zauberkundigen, die sich auf das Handwerk der alten Verwandlungsmagier des Landes beriefen. Sie haben sich vor allem auf die Erschaffung kleiner, nützlicher Golems spezialisiert, die sie erfolgreich an die ganze Smaragdküste und darüber hinaus vermieten oder verkaufen.
education.nuumian_golembuilder.descr=Aus dem Magierorden von Nuum (siehe S. 22) stammen viele der begabtesten Golembauer von Lorakis. Ihre Werke sind gleichermaßen meisterhaftes Handwerk als auch magisches Können. Steinerne Wächter, Kriegskonstrukte und treu ergebene Hausdiener aus Lehm gehören zu ihrem Repertoire, und so manch ein Händler ist bereit, Unsummen für eines ihrer Werke zu zahlen. Doch nur die mächtigsten Magier Nuums kennen die geheimen Rituale zur Erschaffung ihrer größten Konstrukte.
education.artifactcrafter.descr=Der Zauberwerker ist darauf spezialisiert, Magie nicht nur zur Fertigung von Gütern zu nutzen, sondern seine magische Kraft selbst in seine Werkstücke zu binden. In vielen Jahren der Ausbildung widmet er sich nicht nur akribisch verschiedenen Magieschulen und studiert alle Formen von magischen Effekten, vielmehr gehört eingehende Kenntnis seines bevorzugten Werkstoffs ebenfalls zum Lehrplan. Denn nur wer Magie und Stoff gleichermaßen versteht, kann eine perfekte Synthese aus ihnen herstellen.\nZauberwerker sind dabei oft auf einzelne Materialien spezialisiert. Manche bearbeiten Metall, andere formen verschiedene Hölzer oder binden Magie in feinste Gespinste. Und manchen Materialien wohnt bereits eine eigene magische Kraft inne, deren Wirkung und vor allem deren Zusammenspiel mit anderer Magie dem Zauberwerker bekannt sein sollte.
education.crystalformer.descr=Die Kristallformer der Vindarai verstehen sich darauf, Glas, Perlmutt und edle Steine miteinander zu verbinden und die so erschaffenen Gebilde mit den magischen Energien von Wind und Wasser aufzuladen. Angeblich sollen sie aber auch in der Lage sein, kristallene Kugeln zu erschaffen, mit denen man in die Zukunft oder an ferne Orte blicken kann.
education.runesmith.descr=Die Runenschmiede der Borombri hingegen stellen nicht nur kleine Steine her, in die sie ihre magisch aufgeladenen Zeichen meißeln, sie gravieren die althergebrachten Symbole auch in Rüstungen, brennen sie in Ledertaschen, Sättel und Köcher, oder prägen sie in Münzen, die sich wohlhabende Zwerge in Bärte oder Zöpfe flechten.
education.sciptor.descr=Die Scriptoren aus Ioria bannen Zauber in Schriftrollen, die ein jeder auslösen kann, wenn er die Worte liest. Einige verstehen sich auch darauf, ihre Magie in gestickte Worte und Zeichen einfließen zu lassen, und die Edlen der Stadt tragen beschriebene Gürtel und Stoffbänder, die etwa dem Schutz dienen, das Gehör verbessern oder eine andere Haarfarbe verleihen.

enhancement.defense.desc=Erhöht VTD um den 1,2 oder 3 Punkte, je nach Stärke.
enhancement.power_resistpoison.desc=Verleiht Stärke Giftresistenz (KW+2, Zähigkeit +3)
enhancement.power_resistheat.desc=Verleiht Stärke Hitzeresistenz (Hitzestufe -1, Zähigkeit +3)
enhancement.power_resistcold.desc=Verleiht Stärke Kälteresistenz (Kältestufe -1, Zähigkeit +3)
enhancement.power_resistsick.desc=Verleiht Stärke Krankheitsresistenz  (KW+2, Zähigkeit +3)
enhancement.otherworld_emergency_exit.desc=Der Zauberer kann mittels seines Artefakts jederzeit aus der Anderswelt zurück ins Diesseits  gelangen, sofern er hierfür eine kanalisierte Aktion von 10 Ticks Dauer erfolgreich abschließt. Er kann nicht bestimmen, wohin im Diesseits er gelangt, dies hängt vielmehr von seiner genauen Position in der Anderswelt (und dem Ermessen des Spielleiters) ab.
enhancement.artifact_proection.desc=Das Artefakt ist resistent gegen  Zauber, die es entzaubern oder seine Wirkung (nicht aber etwaige mittels des Artefakts ausgelöste Zauber) einschränken. Entsprechende Versuche erhalten einen Malus in Höhe von 10 Punkten pro Punkt AQ, die in diese Höhere Artefaktkraft investiert wurden. Diese Kraft ist bis zu dreimal wählbar.
enhancement.summoning_helper.desc=Vom Träger des Artefakts beschworene Wesen sind besonders dienstfertig. Sie führen die ersten beiden ihnen erteilten Dienste, die eigentlich Fokus kosten würden, kostenlos durch.
enhancement.bottomless_bag.desc=Ein mittels dieser Kraft verzaubertes Artefakt, bei dem es sich stets um ein Gefäß (einen Rucksack, ein Beutel, eine Truhe, etc.) handeln muss, fasst deutlich mehr Inhalt als eigentlich normal wäre. Es kann neben seinem normalen Inhalt bis zu 10 Gegenstände mit einer kombinierten Last von bis zu 10 Punkten halten. Diese Kraft ist bis zu zweimal wählbar.
enhancement.focus_support.desc=Das Artefakt unterstützt den Zauberer dabei, sich auf seine Magie zu fokussieren. Er erhält einen Bonus in Höhe von 5 Punkten auf seinen Fokus, solange er auf das Artefakt eingestimmt ist.
enhancement.come_in_my_hand.desc=Das Relikt kann vom Zauberer in seine Hand zurückgerufen werden, sofern es sich im Umkreis von 10+MYS Metern um ihn und innerhalb seiner Sichtlinie befindet. Dies erfordert eine Reaktion von 3 Ticks Dauer. \nWird das Relikt festgehalten, muss der Zauberer erfolgreich eine vergleichende Probe auf Arkane Kunde gegen die Athletik des Haltenden ablegen. Ist das Relikt festgebunden, kann der Zauberer einen Kraftakt versuchen, für den er statt seiner Athletik auch seine Arkane Kunde benutzen kann.
enhancement.necromancers_power.desc=Die Anzahl der mittels Zauber oder Rituale vom Träger des Relikts gerufenen Untoten verdoppelt sich.
enhancement.permanence0.desc=Das Relikt trägt einen passenden  kanalisierten Zauber des Grades 0, der dauerhaft auf dem Träger liegt, solange er das Relikt mit sich führt. Welche Zauber hierzu zulässig sind, liegt im Ermessen des Spielleiters.
enhancement.permanence1.desc=Das Relikt trägt einen passenden  kanalisierten Zauber des Grades 1, der dauerhaft auf dem Träger liegt, solange er das Relikt mit sich führt. Welche Zauber hierzu zulässig sind, liegt im Ermessen des Spielleiters.
enhancement.ritualcomponent.desc=Das Artefakt stellt bei einem vom Besitzer durchgeführten Ritual stets 2 Komponentenpunkte zur Verfügung.
enhancement.easy_attuned.desc=Auf dieses Artefakt kann sich schon mittels einer Verschnaufpause eingestimmt werden. Außerdem zählt es nur mit einem Viertel seiner AQ gegen die Artefaktkapazität (statt wie bei Relikten üblich mit der Hälfte der AQ).
enhancement.part_of_the_caster.desc=Das Artefakt ist wie eine Fortführung des Körpers des Zauberers. Es wird für alle positiven Zaubereffekte als Teil desselben gewertet, fällt also beispielsweise bei Verwandlungen nicht unter die Lastbeschränkung mitgeführter Ausrüstung.
enhancement.thaumaturgic_tool.desc=Das Artefakt unterstützt den Träger bei seinem magischen Handwerk. Sofern er ein Konstrukt konstruiert oder ein Artefakt verzaubert, erhöht das Artefakt die Zahl der erlaubten Teilproben der erweiterten Probe um sein höchstes beteiligtes Attribut.
enhancement.uninterrupted_effect.desc=Mit dem Artefakt ausgelöste Zauber sind besonders schwer zu bannen oder in ihrer Wirkung einzuschränken. Alle entsprechenden Versuche erhalten einen Malus in Höhe von 10 Punkten pro Punkt AQ, die in diese Höhere Artefaktkraft investiert wurden. Diese Kraft ist bis zu dreimal wählbar.
enhancement.indestructible.desc=Das Relikt ist auf profanem Wege sowie durch Zauber praktisch nicht zu beschädigen oder gar zu zerstören. Um es zu vernichten bedarf es eigens dafür entwickelter Rituale, göttlichem Eingreifen, Vulkanglut oder ähnlichem.

mastership.arcanelore.analyst.desc=Der Zauberer ist darauf spezialisiert, magische Phänomene tiefgehend zu erforschen. Er erhält einen Bonus in Höhe von 3 Punkten auf die Analyse.
mastership.arcanelore.meditation.desc=Der Zauberer hat eine in seiner Tradition oder Kultur verbreitete Technik erlernt, um seinen Geist besonders effektiv zu ordnen. Er benötigt nur noch 10 Minuten, um erschöpften Fokus zu regenerieren. Dafür ist diese Form der Regeneration so aufwändig, dass er dabei nichts anders tun kann. Die nötigen Meditationstechniken sind so auffällig, dass die Durchführung der Meditation vor Beobachtern nicht verborgen werden kann.
mastership.arcanelore.flexible_weakening.desc=Der Zauberer ist in der Lage, mittels einer sofortigen Reaktion von 3 Ticks Dauer einen von ihm gewirkten Zauber des Typus Schwächung ohne weitere Fokuskosten auf ein anderes Ziel umzulegen, sofern das Ziel nach einer erlaubten Aktiven Abwehr auch von der ursprünglichen Zauberprobe hätte betroffen sein können. Die sofortige Reaktion zur Umlegung des Zaubers bricht eventuell durchgeführte kontinuierliche Aktionen nicht ab. Eine solche Umlegung kann jederzeit nach Wirkung des Zaubers geschehen und bis zu zweimal vorgenommen werden. Dabei kann der Zauber nicht auf ein Ziel zurückgelegt werden, das ihm bereits zuvor unterlag.\n\nErrata 2019\nDiese Meisterschaft funktioniert nur bei kanalisierten Zaubern des Typus Schwächung.
mastership.arcanelore.cleansing_concentration.desc=Wenn der Abenteurer bei einem Zauber, der einen Zustand heilt oder unterdrückt, den Schritt Magie fokussieren (siehe Splittermond: Die Regeln S. 196) eigentlich abgeschlossen hat, kann er sich entscheiden, weitere Magie zu sammeln und in seinen Zauber zu leiten. Dadurch verlängert sich seine ursprüngliche Handlung um 5 Ticks und er muss 3 weitere Punkte Fokus erschöpfen bzw. kanalisieren. Zusätzlich zu seiner normalen Wirkung heilt oder unterdrückt der Zauber eine weitere Stufe des ursprünglich betroffenen Zustands. \nDies kann pro Zaubervorgang nur einmal durchgeführt werden. Ein Zauber kann nicht von mehreren Aufladungen gleichzeitig betroffen werden.
mastership.arcanelore.protecting_concentration.desc=Wenn der Abenteurer bei einem Zauber, der direkt Lebenspunkte regeneriert, den Schritt Magie fokussieren (siehe Splittermond: Die Regeln S. 196) eigentlich abgeschlossen hat, kann er sich entscheiden, weitere Magie zu sammeln und in seinen Zauber zu leiten. Dadurch verlängert sich seine ursprüngliche Handlung um 5 Ticks und er muss einen weiteren Punkt Fokus erschöpfen. Zusätzlich zu seiner normalen Wirkung verleiht der Zauber für 30 Ticks 2 temporäre Lebenspunkte (siehe Seite 72). \nEine solche Verlängerung des Zaubervorgangs kann maximal VER/2 mal pro Zaubervorgang durchgeführt werden. Ein Zauber kann nicht von mehreren Aufladungen gleichzeitig betroffen werden.
mastership.arcanelore.weakening_concentration.desc=Wenn der Abenteurer bei einem Zauber, der einen Malus auf eine oder mehrere Proben verleiht, den Schritt Magie fokussieren (siehe Splittermond: Die Regeln S. 196) eigentlich abgeschlossen hat, kann er sich entscheiden, weitere Magie aus der Umgebung zu sammeln und in seinen Zauber zu leiten. Dadurch verlängert sich seine ursprüngliche Handlung um 5 Ticks und er muss 2 weitere Punkte Fokus erschöpfen bzw. kanalisieren. Der vom Zauber verliehene Malus erhöht sich dafür bei erfolgreicher Auslösung des Zaubers für die nächsten 60 Ticks um einen Punkt. \nDies kann pro Zaubervorgang nur einmal durchgeführt werden. Ein Zauber kann nicht von mehreren Aufladungen gleichzeitig betroffen werden. 
mastership.arcanelore.strong_weakening.desc=Bei vom Zauberer gewirkten Zaubern des Typus Schwächung, die Stufen eines Zustands verursachen oder Mali auf Proben oder abgeleitete Werte verleihen, gelten diese Stufen oder Mali um einen Punkt erhöht.
mastership.arcanelore.wallmaster.desc=Der Zauberer kann bei seinen Zaubern des Typus Wand, die schnurgerade Formen voraussetzen, auch einfache geometrische Formen bilden.
mastership.arcanelore.destroying_concentration.desc=Wenn der Zauberer bei einem Zauber des Typus Schaden den Schritt Magie fokussieren (siehe Splittermond: Die Regeln S. 196) eigentlich abgeschlossen hat, kann er sich entscheiden, weitere Magie aus der Umgebung zu sammeln und in seinen Zauber zu leiten. Dadurch verlängert sich seine ursprüngliche Handlung um 5 Ticks und er muss 2 weitere Punkte Fokus erschöpfen. Bei Zaubern, die in ihrer Grundwirkung auf ein einzelnes Wesen zielen, erhöht sich der Schaden seines Spruchs um 1W6 + den Zaubergrad des jeweiligen Zaubers; bei Zaubern, die mehrere Ziele betreffen, nur um den Zaubergrad des jeweiligen Zaubers. \nEine solche Verlängerung des Zaubervorgangs kann maximal VER/2 mal pro Zaubervorgang durchgeführt werden. Ein Zauber kann nicht von mehreren Aufladungen gleichzeitig betroffen werden.\n\nErrata 2019\nDiese Meisterschaft funktioniert nur bei nicht-kanalisierten Zaubern des Typus Schaden. Um zu bestimmen, wie hoch der Bonus auf den Schaden ist, zählt, ob der Zauber potenziell in der Lage wäre, mehreren oder nur einzelnen Wesen/Objekten Schaden zuzufügen.
mastership.arcanelore.overwhelming_profiency.desc=Zwingt ein Zauber des Zauberers ein Ziel dazu, eine Fertigkeitsprobe abzulegen, kann sich der Abenteurer entscheiden, statt der vorgegebenen Schwierigkeit auch 15 + seine Fertigkeitspunkte in der verwendeten Magieschule als Schwierigkeit zu nutzen. Erhöht die Verstärkung des Zaubers die Schwierigkeit der ursprünglichen Probe, wird diese Erhöhung auch auf die neue Schwierigkeit addiert.
mastership.arcanelore.longterm_observation.desc=Der Zauberer kann durch lange Beobachtung weitere Erkenntnisse für seine magische Analyse (siehe S. 150) ziehen. Er kann die doppelte normalerweise erlaubte Anzahl an Proben bei jeder erweiterten Probe zur Analyse ablegen.\nAußerdem ist er in der Lage, die Erschwernis bei einer magischen Analyse abzubauen. Hierfür legt er eine einfache Probe gegen die Schwierigkeit der Analyse ab, bei der jedoch nur ein Zehntel der Erschwernis angerechnet wird. \nEine solche Probe dauert 6 Stunden. Es können beliebig viele dieser Proben in Folge abgelegt werden, wobei sich der Abbau der Erschwernis kumuliert. Die Auswirkungen dieser Probe sind auf S. 153 beschrieben.
mastership.arcanelore.magic_detector.desc=Der Zauberer ist in der Lage, bei Identifikation und Analyse auch das konkrete Fehlen magischer Effekte festzustellen (siehe S. 146).
mastership.arcanelore.magic_gesture_expert.desc=Der Zauberer kann ohne Konsequenzen leichte Variationen in seinen Zaubergesten vornehmen. Von ihm durchgeführte kontinuierliche Aktionen Zauber vorbereiten brechen nicht ab, wenn er Reaktionen durchführt.
mastership.dexterity.fake_magic_gesture.desc=Der Abenteurer kann Zaubergesten vortäuschen. Er kann eine kontinuierliche Aktion von nicht festgelegter Dauer beginnen, die so wirkt, als würde er einen Zauber beginnen.\nSollte ein Versuch zur Identifizierung vorgenommen werden, kann der Abenteurer mit einer vergleichenden Probe auf Arkane Kunde bei Gelingen einen bestimmten Zauber vorgaukeln. Misslingt seine Probe, ist klar, dass es sich nicht um einen echten Zauber handelt.
mastership.fast_casting.desc=Der Zauberer hat gelernt, seine Zauber einer bestimmten Magieschule besonders rasch vorzubereiten. Er kann sich zu Beginn der Aktion Zauber vorbereiten entscheiden, einen Punkt Fokus zu verzehren, um die Zauberdauer von Zaubern dieser Magieschule um 1 Tick zu reduzieren (Mindestdauer: 3 Ticks; maximal einmal pro Zauber).
mastership.enhanced_spells.desc=Der Zauberer benötigt bei seinen Zaubern dieser Magieschule einen verzehrten Fokuspunkt weniger als üblich, um die Verstärkung zu aktivieren.
mastership.targeting_caster.desc=Der Zauberer kann den Malus für Angriffe ins Kampfgetümmel (siehe Splittermond: Die Regeln S.162) bei Zaubern dieser Magieschule ignorieren.
mastership.unhasty_casting.desc=Der Zauberer kann sich beim Wirken seiner Zauber Zeit lassen. Er kann die Zauberdauer von Zaubern der entsprechenden Magieschule verdoppeln, um bei Gelingen der Probe einen zusätzlichen EG zu erhalten.
mastership.silent_casting.desc=Der Malus für das Weglassen der Formel beim Zaubervorgang wird bei Zaubern der entsprechenden Magieschule halbiert.
mastership.ranged_casting.desc=Die Wirkungsweite kanalisierter Zauber gilt für den Zauberer als verdoppelt, wenn er Zauber der entsprechenden Magieschule wirkt.
mastership.sustained_casting.desc=Die Grund-Wirkungsdauer von Sprüchen der entsprechenden Schule wird verdoppelt.

mastership.arcanelore.ritual_lore_1.desc=Der Zauberer ist in der Lage, Rituale von Grad 0 durchzuführen, sofern er über das Zeremoniell verfügt und die Bedingungen erfüllt.
mastership.arcanelore.ritual_connection.desc=Der Zauberer ist in der Lage, Fokuskosten, die im Zuge eines Rituals entstehen, auf andere, freiwillige Personen zu übertragen. Diese müssen sich innerhalb eines Radius von MYS x 10 m um den Zauberer herum befinden.
mastership.arcanelore.focus_theft.desc=Der Zauberer ist in der Lage, Fokuskosten, die im Zuge eines Rituals entstehen, auf bis zu AUS x 2 unfreiwillige Personen zu übertragen. Hierzu dürfen diese Personen nicht mehr als MYS + 10 m von ihm entfernt sein. Dies erfordert eine kontinuierliche Aktion von 5 Ticks Dauer, die die Ritualprobe nicht unterbricht. Am Ende der Aktion werden AUS Punkte Fokus von allen Betroffenen gleichzeitig verzehrt.\n Weiterhin müssen sie sich in einem der Zustände Benommen, Bewusstlos, Ringend oder Schlafend befinden oder gefesselt sein.
mastership.arcanelore.ritual_lore_2.desc=Der Zauberer ist in der Lage, Rituale von Grad 1 und 2 durchzuführen, sofern er über das Zeremoniell verfügt und die Bedingungen erfüllt.
mastership.arcanelore.ritual_lore_3.desc=Der Zauberer ist in der Lage, Rituale von Grad 3 und höher durchzuführen, sofern er über das Zeremoniell verfügt und die Bedingungen erfüllt.
mastership.arcanelore.versed_scrolluser.desc=Der Zauberer ist besonders gut darin, Schriftrollen zu benutzen. Wenn er diese nutzt und die Probe gelingt, erhält er einen zusätzlichen Erfolgsgrad.
mastership.arcanelore.artifact_speeder.desc=Der Zauberer ist in der Lage, besonders schnell wirkende Artefakte zu erschaffen. Er kann einmalig einen Malus in Höhe von 3 Punkten bei der Herstellung eines Artefakts, mittels dem später ein Zauber ausgelöst wird, hinnehmen, um die Auslösezeit des Zaubers um 1 Tick zu reduzieren (mind. 1). Sofern er dies tut, erhöhen sich außerdem die Materialkosten des Artefakts um 5 Lunare (und der Verkaufspreis entsprechend um 15 Lunare).
mastership.arcanelore.artifact_stacking.desc=Der Zauberer ist besonders begabt darin, komplexe Wirkungen in Artefakte einzuweben. Er kann einmalig einen Malus in Höhe von 3 Punkten bei der Herstellung eines Artefakts hinnehmen, um die Artefaktqualität für die Herstellung und Einstimmung (nicht aber für die Bindung als Relikt oder den Verkauf ) um 1 zu senken (mind. 1). Wenn er dies tut, erhöhen sich außerdem die Materialkosten des Artefakts um 5 Lunare (und der Verkaufspreis entsprechend um 15 Lunare).
mastership.arcanelore.artifact_prolonging.desc=Der Zauberer ist in der Lage, besonders lang wirkende Zauberspeicher zu erstellen. Er kann bis zu zweimal einen Malus in Höhe von 3 Punkten bei der Herstellung eines Zauberspeichers, in den ein kanalisierter Zauber gebunden werden soll, hinnehmen, um die Wirkungsdauer des Zaubers um jeweils 1 Stunde zu erhöhen. Für jedes Mal, dass er einen solchen Malus in Kauf nimmt, erhöhen sich außerdem die Materialkosten des Artefakts um 5 Lunare (und der Verkaufspreis entsprechend um 15 Lunare).
mastership.arcanelore.create_talismans.desc=Der Zauberer ist in der Lage, Talismane zu erstellen, sofern er die jeweiligen Voraussetzungen erfüllt (siehe S. 176).
mastership.arcanelore.enhanced_anchor.desc=Der Zauberer ist in der Lage, Verbesserte Schriftrollen und Verbesserte Strukturgeber zu erstellen. Hierbei kann er nur Verbesserte Schriftrollen/Zauberanker für Zaubergrade erstellen, für die er auch normale Schriftrollen/Zauberanker erstellen kann
mastership.arcanelore.scroll_expert.desc=Wenn der Zauberer einen Strukturgeber nutzt, erhält er bei Gelingen der Probe einen zusätzlichen Erfolgsgrad. Mit der Meisterschaft kann außerdem bei der Herstellung von Strukturgebern ein Punkt AQ mehr erreicht werden, als dies normalerweise möglich wäre.
mastership.arcanelore.customized_artifacts.desc=Der Zauberer ist in der Lage, bei der Herstellung von Artefakten, diesen weitere Fähigkeiten zu verleihen, ohne dass sich dadurch die Artefaktqualität erhöht. Er kann eine oder mehrere der folgenden Erweiterungen einbauen, wofür sich für jede Erweiterung sowohl die Schwierigkeit um 3 Punkte als auch die nötigen Fortschrittspunkte um 1 Punkt erhöhen:\n\
 * Aufspürbar (die Person, die sich auf das Artefakt eingestimmt hat, spürt wo es sich befindet, sofern es maximal 10 km entfernt ist)\n\
 * Aufspüren (kann die Person, die zuletzt auf das Artefakt eingestimmt war, innerhalb von 10 km spüren, wo sich dieses befindet)\n\
 * Gehärtet (die Härte des Artefakts wird um 1 Punkt erhöht; bis zu dreimal wählbar)\n\
 * Federleicht (die Last des Artefakts ist um 1 Punkt reduziert; bis zu dreimal wählbar bis minimal Last 0)\n\
 * Regenerierend (das Artefakt erhält, sofern es beschädigt ist, alle 24 Stunden eine Gesundheitsstufe zurück, sofern es nicht völlig zerstört war)\n\
 * Verhehlt (Versuche, das Artefakt zu identifizieren oder zu analysieren, erhalten einen Malus in Höhe von 2 Punkten; bis zu fünfmal wählbar)\n\
 * Widerstandsfähig (Versuche, das Artefakt oder mit ihm gewirkte Zauber mit anderen Zaubern zu beeinflussen, erhalten einen Malus in Höhe von 1 Punkt; bis zu dreimal wählbar).\n\
 Für jede gewählte Erweiterung erhöhen sich außerdem die Materialkosten des Artefakts um 5 Lunare (und der Verkaufspreis entsprechend um 15 Lunare). Eine solche Modifikation ist nur bei der ersten Verzauberung des Artefakts möglich, nicht bei etwaigen Folgeverzauberungen für Relikte.
mastership.arcanelore.create_spellstore.desc=Der Zauberer ist in der Lage, Zauberspeicher zu erstellen, sofern er die jeweiligen Voraussetzungen erfüllt (siehe S. 176).
mastership.arcanelore.fast_spellstore_replenish.desc=Der Zauberer ist in der Lage, ladungsbasierte Zauberspeicher besonders schnell aufzuladen. Er benötigt für entsprechende Proben nur 15 Ticks, muss hierfür jedoch einen Malus in Höhe von 6 Punkten auf die Arkane Kunde-Probe hinnehmen.
mastership.arcanelore.spellstore_replenish.desc=Der Zauberer ist in der Lage, auch von anderen Personen hergestellte ladungsbasierte Zauberspeicher aufzuladen (siehe S. 173).
mastership.arcanelore.higher_artifactmaster.desc=Der Zauberer ist in der Lage, Höhere Artefaktkräfte in Gegenstände zu binden, sofern er eine entsprechende Anleitung besitzt. Außerdem kann er Artefakte, bei denen es sich um Relikte handelt, selbsttätig erweitern, wenn er die entsprechenden Voraussetzungen erfüllt.
mastership.arcanelore.service_expert.desc=Der Zauberer wählt einen Dienst für beschworene Wesen aus. Wenn er diesen Dienst erteilt, kostet ihn dies 1V1 Fokus weniger als üblich (mindestens 1). Diese Meisterschaft kann mehrfach gewählt werden, dabei muss immer ein neuer Dienst ausgewählt werden.
mastership.arcanelore.healing_beings.desc=Der Zauberer kann bei von ihm selbst beschworenen Wesen die Dienste Heile Gift, Heile Lebenskraft und Unterdrücke Zustand nutzen, falls diese zu den Erweiterten Diensten des Wesens gehören und das Wesen maximal das Merkmal Beschwörbares Wesen 5 aufweist
mastership.arcanelore.helpful_beings.desc=Der Zauberer kann bei von ihm selbst beschworenen Wesen die Dienste Assistiere, Diene und Nutze Fertigkeit nutzen, falls diese zu den Erweiterten Diensten des Wesens gehören und das Wesen maximal das Merkmal Beschwörbares Wesen 5 aufweist.
mastership.arcanelore.combat_conjuror.desc=Vom Zauberer beschworene Wesen sind besonders kampfstark. Sie erhalten einen Bonus in Höhe von 2 Punkten auf ihren Angriffswert im Nahkampf sowie in Höhe von 1 Punkt auf ihre Widerstände. Außerdem erhalten diese Wesen eine Meisterschaft in einer passenden Kampffertigkeit, deren maximale Schwelle von der Stufe des Merkmals Beschwörbares Wesen abhängt: Stufe 1-5: Schwelle 1; Stufe 6-7: Schwelle 2; Stufe 8-9: Schwelle 3; Stufe 10+: Schwelle 4.
mastership.arcanelore.fighting_beings.desc=Der Zauberer kann bei von ihm selbst beschworenen Wesen die Dienste Beschütze, Kämpfe und Wache nutzen, falls diese zu den Erweiterten Diensten des Wesens gehören und das Wesen maximal das Merkmal Beschwörbares Wesen 5 aufweist.
mastership.arcanelore.combatcasting_beings.desc=Vom Zauberer beschworene Wesen nutzen, sofern sie den Dienst Kämpfe erhalten, ihre eventuellen Zauber des Typus Schaden nach eigenem Ermessen. Bei jedem Zaubervorgang kann sich der Zauberer entscheiden, die Kosten wie beim Dienst Zaubere aufzuteilen. Wenn er dies nicht tut, nutzt das Wesen seinen eigenen Fokus.
mastership.arcanelore.scouting_beings.desc=Der Zauberer kann bei von ihm selbst beschworenen Wesen die Dienste Spähe, Überbringe Nachricht und Überbringe Sprachnachricht nutzen, falls diese zu den Erweiterten Diensten des Wesens gehören und das Wesen maximal das Merkmal Beschwörbares Wesen 5 aufweist.
mastership.arcanelore.protecting_beings.desc=Der Zauberer kann bei von ihm selbst beschworenen Wesen die Dienste Lenke ab, Neutralisiere Gegenelement und Schütze vor Element nutzen, falls diese zu den Erweiterten Diensten des Wesens gehören und das Wesen maximal das Merkmal Beschwörbares Wesen 5 aufweist.
mastership.arcanelore.powerful_conjuror.desc=Der Beschwörer ist in der Lage, die Grenzen seiner Beschwörungszauber voll auszuschöpfen. Wenn er einen entsprechenden Zauber nutzt, kann er die maximale Stufe des Merkmals Beschwörbares Wesen um 2 Punkte erhöhen (bis maximal zum doppelten der ursprünglichen Stufe).
mastership.arcanelore.transporting_beings_1.desc=Der Zauberer kann bei beschworenen Wesen den Dienst Transportiere nutzen, falls dieser zu den Erweiterten Diensten des Wesens gehört und das Wesen maximal das Merkmal Beschwörbares Wesen 5 aufweist.
mastership.arcanelore.lore_of_beings.desc=Der Zauberer kennt mehr Wesen, die er mit seinen erlernten Zaubern, mittels derer er Wesen des Merkmals Beschwörbares Wesen beschwört, rufen kann. Diese Wesen müssen bei Erlernen der Meisterschaft festgelegt werden und die Summe der Stufen ihrer Merkmale Beschwörbares Wesen darf 10 nicht übersteigen. Diese Meisterschaft kann mehrfach erworben werden. Überzählige Punkte können aufgespart werden und mit einer etwaigen erneuten Wahl dieser Meisterschaft kombiniert werden (hierdurch darf auch der Höchstwert der Stufe 10 überschritten werden).
mastership.arcanelore.casting_beings.desc=Der Zauberer kann bei beschworenen Wesen die Dienste Stelle Essenz bereit und Zaubere nutzen, falls diese zu den Erweiterten Diensten des Wesens gehören und das Wesen maximal das Merkmal Beschwörbares Wesen 5 aufweist.
mastership.arcanelore.transporting_beings_2.desc=Der Zauberer kann bei beschworenen Wesen die Dienste Transportiere durch Luft und Transportiere durch Wasser nutzen, falls diese zu den Erweiterten Diensten des Wesens gehören und das Wesen maximal das Merkmal Beschwörbares Wesen 5 aufweist.
mastership.arcanelore.promising_conjuror.desc=Wenn Meisterschaften des Zauberers weitere Dienste für beschworene Wesen freischalten, sind diese für Wesen bis maximal Merkmal Beschwörbares Wesen 8 nutzbar.
mastership.arcanelore.excellent_conjuror.desc=Wenn Meisterschaften des Zauberers weitere Dienste für beschworene Wesen freischalten, sind diese für Wesen bis maximal Merkmal Beschwörbares Wesen 11 nutzbar.
mastership.arcanelore.transporting_beings_3.desc=Der Zauberer kann bei beschworenen Wesen den Dienst Transportiere durch Fels und Transportiere durch Feuer nutzen, falls dieser zu den Erweiterten Diensten des Wesens gehört und das Wesen maximal das Merkmal Beschwörbares Wesen 5 aufweist
mastership.arcanelore.arcane_overload.desc=Der Zauberer kann einen durch ihn selbst animierten Golem mit zusätzlicher Magie stärken. Dazu muss er 3V1 Fokus und eine kontinuierliche Aktion von 10 Ticks Dauer aufwenden. Dafür erhält der Golem für die nächsten 120 Ticks die folgenden Modifikationen: VTD +2, KW +2, GW +2, Angriff +2.
mastership.arcanelore.complex_commands.desc=Der Zauberer ist in der Lage, bei seinen Golems mehrere Verfügungen zu aktivieren. Wenn er einen Golem mittels eines Zaubers animiert, kann er die Verstärkungsoption beliebig oft wählen (und muss dafür jedes Mal die nötigen EG aufwenden und die Fokuskosten zahlen). Bei an ihn mittels der Ressource Golem gebundenen Golems erhalten diese zwei zusätzliche aktive Verfügungen.
mastership.arcanelore.personal_synchronisation.desc=Der Abenteurer hat ein intensiveres magisches Band zu einem an sich gebundenen Golem als üblich. Er weiß bei einem mit der Ressource Golem erworbenen Golem immer, ob und wie stark dieser beschädigt ist, egal wie weit er von ihm entfernt ist. Darüber hinaus verfügt ein entsprechender Golem über folgende Modifikationen: Lebenspunkte +1, Angriff +2, zwei beliebige bereits beherrschte Fertigkeiten +2, eine zusätzliche Meisterschaft [Schwelle gemäß der Regeln auf S. 207]. Der Abenteurer kann diese Synchronisierung im Rahmen einer Verschnaufpause auf einen anderen an sich gebundenen Golem umlegen.
mastership.arcanelore.spontaneous_instruction.desc=Der Zauberkundige ist in der Lage, mittels einer kontinuierlichen Aktion von 10 Ticks Dauer bei einem Golem, den er selbst animiert hat oder der an ihn gemäß der Ressource Golem gebunden ist, die aktive Instruktion sowie die aktiven Verfügungen zu ändern, während der Golem animiert ist. Dies erfordert eine Probe auf Arkane Kunde oder auf die zur Animierung verwendete Magieschule gegen 20 + Stufe des Merkmals Golem und 3V1 Punkte Fokus. Für weitere 1V1 Fokus kann er zudem eine zusätzliche Verfügung aktivieren (auch mehrfach). Diese Meisterschaft ist auch für fremde Golems, die mittels der Ressource Golem erworben wurden, nutzbar, sofern der Besitzer anwesend ist und zustimmt.
mastership.craftmanship.designer.desc=Der Handwerker ist in der Lage, Konstrukte aus jeglichem Material (Stein/Lehm, Holz, Knochen, Metall) zu konstruieren. Bei entsprechenden Proben kann er beliebig viele Erfolgsgrade ansammeln. Mittels dieser Meisterschaft können maximal Golems bis zur Stufe 6 des entsprechenden Merkmals konstruiert werden. Sollte der Handwerker außerdem die Meisterschaft Materialmeister in derselben Fertigkeit besitzen, in der er auch diese Meisterschaft gelernt hat, kann er die maximale Stufe des Merkmals um die halbe Materialqualität eines bei der Konstruktion vorrangig verwendeten Materials erhöhen. Diese Erhöhung hat anders als üblich keinen Einfluss auf die Schwierigkeit der Herstellungsprobe.
mastership.craftmanship.adaptive_designer.desc=Der Abenteurer hat gelernt, an bestehenden Golems tiefergehende Veränderungen vorzunehmen. Er kann nachträglich einem Golem Module des Baukasten-Schritts Zusätzliche Fähigkeiten oder Rolle hinzufügen (siehe S. 206), falls der Golem noch nicht die durch sein Material erlaubte Höchststufe erreicht hat. Dies erfordert jeweils eine erweiterte Probe auf Edelhandwerk oder Handwerk gegen 25 + angestrebte doppelte 205 Stufe des Merkmals Golem. Insgesamt müssen Fortschrittspunkte in Höhe der doppelten angestrebten Stufe des Merkmals angesammelt werden. Jede Teilprobe der erweiterten Probe dauert 3 Tage. Außerdem erfordert dies Material im Wert der anderthalbfachen Kosten einer normalen Stufe des Merkmals Golem (75 Lunare). Er kann dies auch bei mit der Ressource Golem erworbenen Wesen tun, falls der Eigentümer bereit ist, die Erfahrungspunkte für die zusätzlichen Stufen des Merkmals Golem zu bezahlen und der Spielleiter zustimmt.
mastership.craftmanship.binding_animation.desc=Der Zauberkundige kann die Animierung so präzise vornehmen, dass die Magie auch ohne direkte Verbindung zwischen ihnen in den Golem gebunden wird. Er kann die Wirkungsdauer kanalisiert sämtlicher Zauber zur Animierung von Golems in die Wirkungsdauer 8 Stunden ändern. Dies muss beim Zaubervorgang geschehen und erfordert 3V3 Punkte zusätzlichen Fokus.
mastership.craftmanship.restoration.desc=Der Golembauer ist in der Lage, Applikationen eines Golems nachträglich auszutauschen. Dies erfordert eine erweiterte Probe auf Edelhandwerk oder Handwerk gegen 20 + Anzahl der existierenden Applikationen. Insgesamt müssen Fortschrittspunkte in Höhe der doppelten vorhandenen Applikationen angesammelt werden (mindestens 1 FP). Jede Teilprobe der erweiterten Probe dauert einen halben Tag. Außerdem erfordert dies Material im Wert von 15 Lunaren. Alternativ kann der Golembauer mit obigen Regeln einen neuen Schwachpunkt zum Golem hinzufügen und im selben Zuge ebenfalls eine zusätzliche Applikation hinzufügen.
mastership.clscraft.designer.desc=Der Handwerker ist in der Lage, Konstrukte aus jeglichem Material (Stein/Lehm, Holz, Knochen, Metall) zu konstruieren. Bei entsprechenden Proben kann er beliebig viele Erfolgsgrade ansammeln. Mittels dieser Meisterschaft können maximal Golems bis zur Stufe 6 des entsprechenden Merkmals konstruiert werden. Sollte der Handwerker außerdem die Meisterschaft Materialmeister in derselben Fertigkeit besitzen, in der er auch diese Meisterschaft gelernt hat, kann er die maximale Stufe des Merkmals um die halbe Materialqualität eines bei der Konstruktion vorrangig verwendeten Materials erhöhen. Diese Erhöhung hat anders als üblich keinen Einfluss auf die Schwierigkeit der Herstellungsprobe.
mastership.clscraft.adaptive_designer.desc=Der Abenteurer hat gelernt, an bestehenden Golems tiefergehende Veränderungen vorzunehmen. Er kann nachträglich einem Golem Module des Baukasten-Schritts Zusätzliche Fähigkeiten oder Rolle hinzufügen (siehe S. 206), falls der Golem noch nicht die durch sein Material erlaubte Höchststufe erreicht hat. Dies erfordert jeweils eine erweiterte Probe auf Edelhandwerk oder Handwerk gegen 25 + angestrebte doppelte 205 Stufe des Merkmals Golem. Insgesamt müssen Fortschrittspunkte in Höhe der doppelten angestrebten Stufe des Merkmals angesammelt werden. Jede Teilprobe der erweiterten Probe dauert 3 Tage. Außerdem erfordert dies Material im Wert der anderthalbfachen Kosten einer normalen Stufe des Merkmals Golem (75 Lunare). Er kann dies auch bei mit der Ressource Golem erworbenen Wesen tun, falls der Eigentümer bereit ist, die Erfahrungspunkte für die zusätzlichen Stufen des Merkmals Golem zu bezahlen und der Spielleiter zustimmt.
mastership.clscraft.binding_animation.desc=Der Zauberkundige kann die Animierung so präzise vornehmen, dass die Magie auch ohne direkte Verbindung zwischen ihnen in den Golem gebunden wird. Er kann die Wirkungsdauer kanalisiert sämtlicher Zauber zur Animierung von Golems in die Wirkungsdauer 8 Stunden ändern. Dies muss beim Zaubervorgang geschehen und erfordert 3V3 Punkte zusätzlichen Fokus.
mastership.clscraft.restoration.desc=Der Golembauer ist in der Lage, Applikationen eines Golems nachträglich auszutauschen. Dies erfordert eine erweiterte Probe auf Edelhandwerk oder Handwerk gegen 20 + Anzahl der existierenden Applikationen. Insgesamt müssen Fortschrittspunkte in Höhe der doppelten vorhandenen Applikationen angesammelt werden (mindestens 1 FP). Jede Teilprobe der erweiterten Probe dauert einen halben Tag. Außerdem erfordert dies Material im Wert von 15 Lunaren. Alternativ kann der Golembauer mit obigen Regeln einen neuen Schwachpunkt zum Golem hinzufügen und im selben Zuge ebenfalls eine zusätzliche Applikation hinzufügen.
mastership.antimagic.broad_knowledge.desc=Der Zauberer kann seine Kenntnisse anderer Magieschulen nutzen, um entsprechende Zauber leichter zu bannen. Er erhält einen Bonus in Höhe von 2 Punkten auf direkt gegen gegnerische Zauber gerichtete Bannzauber, wenn er in der Magieschule des jeweiligen Zielzaubers mindestens 3 Fertigkeitspunkte besitzt.
mastership.antimagic.opponent_blood.desc=Der Zauberer hat sich den Kampf gegen eine bestimmte Art magischer Wesen auf die Fahnen geschrieben. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Jedes Mal, wenn einer seiner Zauber einem Wesen des entsprechenden Typus Mali verschafft, steigen diese um weitere 3 Punkte. Diese Meisterschaft kann mehrfach gewählt werden, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.antimagic.opponent_stone.desc=Der Zauberer hat sich den Kampf gegen eine bestimmte Art magischer Wesen auf die Fahnen geschrieben. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Jedes Mal, wenn einer seiner Zauber einem Wesen des entsprechenden Typus Mali verschafft, steigen diese um weitere 3 Punkte. Diese Meisterschaft kann mehrfach gewählt werden, wobei jedes Mal ein neuer Typus gewählt werden muss.
mastership.antimagic.opponent_fire.desc=Der Zauberer hat sich den Kampf gegen eine bestimmte Art magischer Wesen auf die Fahnen geschrieben. Er wählt einen Typus aus der folgenden Liste aus: Blutwesen, Felswesen, Feuerwesen, Geisterwesen, Götterdiener, Lichtwesen, Naturwesen, Schattenwesen, Wasserwesen, Wesen der Finsternis, Windwesen. Jedes Mal, wenn einer seiner Zauber einem Wesen des entsprechenden Typus Mali verschafft, steigen diese um weitere 3 Punkte. Diese Meisterschaft kann mehrfach gewählt werden, wobei jedes Mal ein neuer Typus gewählt werden muss.
