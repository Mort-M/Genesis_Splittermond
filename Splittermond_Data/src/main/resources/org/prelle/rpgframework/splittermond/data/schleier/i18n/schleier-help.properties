education.spiritist.descr=Spiritisten vermitteln zwischen Lebenden und Geistern. Ihre Ausbildung verbindet Kenntnisse über Geister mit Todes-, Bann- und Schutzmagie.
education.mistcrow.descr=Nyrdfingische Geisterabwehr im Dienst der Starrekyngkirche. Ein Ressourcenpunkt ist für den Rang in dieser Kirche vorgesehen.
education.whispershadow.descr=Geisterkundige aus Piriwatu, Puntani oder Utarti mit Heil- und Naturmagie. Ein Ressourcenpunkt ist für den Rang bei den Flüsterschatten vorgesehen.
education.ancestorcarrier.descr=Spiritisten aus Sadu oder Zhoujiang, die Ahnenwissen bewahren und ihren Körper als Gefäß für Geister einsetzen können.
education.zhoujiang_exorcist.descr=Auf Geisterabwehr spezialisierte Mystische Krieger aus Zhoujiang. Bei der Wahl eines Rangs gehört dieser zur Kirche der Wugei, des Jausei oder der Gagamba.
education.obsidianseeker.descr=Zwergische Wissenspriester aus Borombri oder Furgand, die mithilfe der Geisterwelt nach verlorenen Obsidiantafeln suchen. Ihr Rang gehört zu den Obsidiansuchern.
education.otherworld_emissary.descr=Beschwörer im Dienst eines Ortsgeistes. Sie schützen dessen diesseitigen Anker und werden von einem Geistervertrauten begleitet.
mastership.deathmagic.medium1.desc=Gelingt die Aktive Abwehr gegen einen Besessenheitsangriff, kommen 2 Erfolgsgrade zum Abwehrergebnis hinzu. Der Vorteil gilt nur für diese Abwehr, nicht als dauerhafter Widerstandsbonus.
material.ghostiron.desc=Seltenes Metall für Waffen und Rüstungen, das seine besonderen Möglichkeiten beim Wechsel in die Geisterwelt entfaltet.
material.ghostiron.effect=Für Waffen und Rüstungen. Härte um 2 vermindern, mindestens auf 1. Beim Übergang in die Geisterwelt bleiben Eigenschaften und Fähigkeiten wie bei einem Relikt erhalten; Waffen verwenden ihre üblichen Fertigkeiten und Schadenswerte, Rüstungs-SR ergänzt die natürliche SR der Geistergestalt. Die Sonderregeln zum Übergang in die Geisterwelt werden nicht automatisch berechnet.
material.maidh_bewerdu_feathers.desc=Federn der Mutter der Rabentöchter als besonderes Material für Schmuck. Sie sind nicht im freien Handel erhältlich. Ursprüngliche Quelle: Jenseits der Grenzen, S. 126; Ergänzungen in Hinter dem Schleier.
material.maidh_bewerdu_feathers.effect=Todesmagie +2; nur ein Gegenstand gewährt diesen Materialbonus. Ein erfolgreiches Ende des Weges wirkt verstärkt, ohne dafür zusätzliche EG oder Fokus einzusetzen. Geistreise kann bis zu fünf weitere Personen einschließen; je zusätzlicher Person steigen die Kosten um K2V1. Die Zaubersonderwirkungen werden nicht automatisch angewendet. Kein Marktpreis.
material.maidh_bewerdu_feathers.effect.short=Kein Marktpreis. Ende des Weges bei Erfolg ohne Verstärkungsmehrkosten verstärkt; Geistreise für bis zu 5 weitere Personen zu je K2V1. Nur ein Gegenstand gewährt den Materialbonus.
item.akherat_glass.desc=Strukturgeber mit Zauberverankerung für Geisterblick. In der Geisterwelt gilt für visuelle Wahrnehmung ein situativer Bonus von 2; kein dauerhafter Wahrnehmungsbonus. Schwerpunkt: Geisterwelt.
item.akherat_glass_improved.desc=Verbesserter Strukturgeber mit Zauberverankerung für Geisterblick. In der Geisterwelt gilt für visuelle Wahrnehmung ein situativer Bonus von 2; kein dauerhafter Wahrnehmungsbonus. Schwerpunkt: Geisterwelt.
item.prayer_wheel.desc=Hilfsmittel für Redegewandtheit oder Diplomatie mit dem Schwerpunkt Geisterwesen. Die passende Fertigkeit richtet sich nach der Anwendung.
item.ghost_lights.desc=Kerzen aus Seelenwachs mit 30 Minuten Brenndauer. Ihr Licht senkt die Lichtstufe im Umkreis von 3 Metern um 1. Schatten zeigen die Anzahl anwesender Geisterwesen in diesem Bereich der Geisterwelt, auch bei Unsichtbarkeit oder Verbergung, aber nicht deren Art. In der Geisterwelt selbst wirken sie wie gewöhnliche Kerzen. Situative Anwendung ohne automatische Berechnung.
