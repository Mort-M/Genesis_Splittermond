resource.fame=ACHTUNG\n\n\Die Ressource Ruhm lässt sich derzeit nur bedingt mit Genesis verwalten.\n\n\Während das Ansehen eines Abenteuers ein zuverlässiger Wert ist, steht der Ruhm für seine Bekanntheit und Beliebtheit im Augenblick und ist damit Schwankungen unterworfen. Für Abenteuer, bei denen Ansehen und Bekanntheit der Charaktere von großer Bedeutung sind, kann der Wert Ruhm verwendet werden. Gerade bei Abenteuern, die in Patalis spielen, bietet sich dieses besonders an, aber auch in anderen Regionen kann Ruhm eine wichtige Rolle spielen, wenn es sich auch unterscheiden mag, was als ruhmeswürdig erachtet wird. Ein bestimmtes Maß an Ruhm kann innerhalb eines Abenteuers als Vorraussetzung für bestimmte soziale Interaktionen verwendet werden oder das Erledigen von Aufgaben erleichtern. Die Menge der für bestimmte Ziele notwendigen Ruhm-Punkte (etwa für die Ladung zu einer Audienz, um eine Handelserlaubnis zu erwirken oder Zugang zu geheimem Wissen zu erlangen) legt der Spielleiter fest. Bei vielen Aufgaben ist es möglich, dass die Gruppe gemeinsam Ruhm sammelt.