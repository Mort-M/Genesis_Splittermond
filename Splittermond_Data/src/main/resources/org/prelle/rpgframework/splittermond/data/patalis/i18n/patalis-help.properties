item.Asselherb.desc=Das Asselkraut ist eine knorrige, mit kleinen Schuppen bedeckte Pflanze, die ausschließlich im Uferbereich von Bächen auf Elyrea zu finden ist. Bei Berührung rollt sie sich zusammen. Ihr Geschmack ist abscheulich salzig und für keinerlei Speisenzubereitung zu gebrauchen. Wird sie abgeschnitten, tropft ein tiefgrüner Schleim aus ihr heraus, der sich kaum abwaschen lässt und bei Berührung mit Wasser zu leuchten beginnt. Dieser Effekt lässt nach etwa 10 Minuten nach.
item.Asselherb.effect=Paste leuchtet im Wasser wie eine Laterne für 10 Minuten
item.GodStar.desc=Heilung von Siechtum 1; Besonderheiten: Die Pflanze ist nur am Fuß des Sitz der Götter zu finden und wird selten zum Kauf angeboten. Mit einer Naturkunde-Probe gg. 30 kann sie für 7 Tage haltbar gemacht werden.
