mastership.diplomacy.DidYouKnow.desc=Der Abenteurer verfolgt den Klatsch aus der Oberschicht. Er hat ein Gespür dafür, den Funken Wahrheit in den haarsträubenden Gerüchten zu finden. Der Abenteurer erhält einen Bonus von +3, wenn er Diplomatie einsetzt, um Gerüchte aus der Oberschicht aufzuschnappen.…
mastership.diplomacy.MoreAppearancesThanReality.desc=Der Abenteurer weiß, das Ansehen wichtiger ist als die Lunare in seinem Beutel. Durch regelmäßige Ausgaben für Kleidung, Geschenke, Diener und ähnliches kann er sich in einem besseren Licht dastehen lassen. Er kann das Verfügbare Geld seines Vermögens nutzen, um sein Ansehen für drei Monate um einen Punkt zu erhöhen. Der Wert in Vermögen muss dafür aber mindestens so hoch sein, wie der aktuelle Ansehen-Wert des Charakters. Wenn die Regeln für Ruhm verwendet werden, erhält der Abenteurer zusätzlich einen Punkt Ruhm.
mastership.diplomacy.AlwaysMoreMoney.desc=Der Abenteurer lebt gerne über seine Verhältnisse. Er weiß, wie und wo er sich Geld leihen kann, über die Rückzahlung kann man sich auch später Gedanken machen. Wenn der Abenteurer sein Verfügbares Geld nutzt, kann er nach frühestens drei Monaten die Fähigkeit im gleichen Jahr ein weiteres Mal nutzen, erhält dann aber nur die Hälfte des Betrages. Alternativ kann er die Laufzeit von Schulden einmalig um sechs Monate verlängern.
mastership.diplomacy.emerge.desc=Der Abenteurer steht in dem Ruf, dass seine Zunge schärfer ist als eine Klinge. Er weiß aber auch seine Klinge meisterlich gegen jene einzusetzen, die er mit seinen Worten aus dem Konzept gebracht hat. Der Abenteurer erhält einen taktischen Vorteil gegen Gegner, die er mit dem Effekt der Meisterschaft Scharfe Zunge belegt hat.
mastership.performance.GoodReputation.desc=Der Abenteurer hat einen hervorragenden Ruf als Künstler bzw. Darsteller. Er kann sein Ansehen um eine Stufe höher zählen, wenn dieser Ruf relevant ist. Außerdem erhält der Künstler einen Bonus in Höhe seines Ansehens auf Diplomatie- und Redegewandtheit- Proben im Umgang mit Kunden und Gönnern.
mastership.clscraft.GoodReputation.desc=Der Abenteurer hat einen hervorragenden Ruf als Künstler bzw. Darsteller. Er kann sein Ansehen um eine Stufe höher zählen, wenn dieser Ruf relevant ist. Außerdem erhält der Künstler einen Bonus in Höhe seines Ansehens auf Diplomatie- und Redegewandtheit- Proben im Umgang mit Kunden und Gönnern.
mastership.clscraft.Sought-afterCraftsman.desc=Der Ruf des Abenteurers eilt ihm voraus. Seine Werkstücke sind sehr gefragt und es gilt als schick, etwas von ihm Gefertigtes zu besitzen. Der Abenteurer kann mit Handwerksarbeiten pro Tag Arbeit 1 Lunar verdienen.
mastership.empathy.ThumbOnWound.desc=Der Abenteurer versteht es, die Schwächen eines Gegners auszunutzen. Wenn er eine Diplomatie- oder Redegewandtheit-Probe gegen einen Gegner mit dem Zustand Unrühmlich durchführt, kann er den Zustand als stark positiven Umstand werten.
mastership.determination.SilenceGrave.desc=Der Abenteurer versteht es, seine Geheimnisse für sich zu behalten. Er erhält einen Bonus von +3 auf seinen GW wenn jemand versucht, ihn auszuhorchen oder ihm seine Geheimnisse mit anderen Mitteln zu entlocken.
mastership.eloquence.Unfair.desc=Wenn der Abenteurer von einem Angriff getroffen wird, kann er eine Reaktion (3 Ticks) nutzen, um den Angreifer als Betrüger dastehen zu lassen. Gelingt ihm eine Redegewandtheit-Probe gegen den GW des Gegners, erleidet dieser für seine vermeintlichen Tricks den Zustand Unrühmlich. Die Probe kann einmal pro Kampf und nur gegen vernunftbegabte Gegner durchgeführt werden.
mastership.eloquence.ArtSeduction.desc=Neben den offensichtlichen Früchten einer erfolgreichen Verführung kann der Abenteurer bei einer romantischen Zusammenkunft versuchen, seinem Ziel Informationen zu entlocken (siehe Intrigen in Ultia, PuE Seite 109). Mit dieser Meisterschaft erhält er einen Bonus in Höhe von 3 Punkten auf die Duell-Probe. Sobald er einen ersten Fortschrittspunkt erreicht hat, kann er den Gegner um kleine, harmlose Gefallen bitten, auch wenn das Duell noch nicht entschieden ist.
mastership.eloquence.ThatWasIt.desc=Der Abenteurer kann seine Schuld, z. B. für einen Diebstahl oder eine provozierende Äußerung, für einen kurzen Moment auf jemanden anderen abwälzen. Solange er nicht mit den Fingern in den Taschen erwischt wird, hat er eine Chance, für Ablenkung zu sorgen. Der Abenteurer legt eine vergleichende Redegewandtheit-Probe gegen die Diplomatie oder die Redegewandtheit des von ihm Beschuldigten ab. Ist der Beschuldigte nicht anwesend, muss die Redegewandtheit- Probe gegen 25 + Stand + Ansehen des Opfers abgelegt werden. Gleichzeitig muss der GW der Person, die von der Schuld überzeugt werden soll, geschlagen werden.
mastership.melee.DoYouReally.desc=Der Abenteurer kann sehr bedrohlich auftreten und hat einen Ruf als tödlicher Kämpfer. Wenn er versucht, einen Gegner mit der Waffe in der Hand einzuschüchtern, kann er für die Probe anstelle der Fertigkeit Anführen die ausgewählte Nahkampffertigkeit nutzen.
mastership.slashing.DoYouReally.desc=Der Abenteurer kann sehr bedrohlich auftreten und hat einen Ruf als tödlicher Kämpfer. Wenn er versucht, einen Gegner mit der Waffe in der Hand einzuschüchtern, kann er für die Probe anstelle der Fertigkeit Anführen die ausgewählte Nahkampffertigkeit nutzen.
mastership.chains.DoYouReally.desc=Der Abenteurer kann sehr bedrohlich auftreten und hat einen Ruf als tödlicher Kämpfer. Wenn er versucht, einen Gegner mit der Waffe in der Hand einzuschüchtern, kann er für die Probe anstelle der Fertigkeit Anführen die ausgewählte Nahkampffertigkeit nutzen.
mastership.blades.DoYouReally.desc=Der Abenteurer kann sehr bedrohlich auftreten und hat einen Ruf als tödlicher Kämpfer. Wenn er versucht, einen Gegner mit der Waffe in der Hand einzuschüchtern, kann er für die Probe anstelle der Fertigkeit Anführen die ausgewählte Nahkampffertigkeit nutzen.
