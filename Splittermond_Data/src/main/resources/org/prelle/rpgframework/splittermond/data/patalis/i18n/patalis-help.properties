culture.patalischeKB.desc=Die meisten der im Süden des Landes lebenden Bewohner sind Nachfahren patalischer Siedler und Gläubige, die im Laufe der Jahre dem Orden gefolgt sind. Die kleinste Gruppe bilden die menschlichen Bewohner, die aus Westergrom stammen und schon seit über 1000 Jahren an der elyrischen Küste leben. Durch die Missionierung und Konvertierung zum Glauben an Vordan vermischten sich die beiden Gruppen immer stärker, was zur Folge hat, dass der Anteil der ursprünglichen Küstenbevölkerung immer kleiner wird. Bei den meisten Küstenbewohnern handelt es sich um Menschen, mit einem kleinen Anteil an Vargen, Zwergen und Alben. Die Bewohner der Küste gelten als gutmütige und hart arbeitende Leute, die gerne nach getaner Arbeit zusammensitzen und gemeinsam essen, Lieder singen und Geschichten erzählen. Ackerbau und Fischerei bestimmen ihr Leben. Jedes noch so kleine und leidlich fruchtbare Stück Land wird in Ackerfläche umgewandelt, um den stetig wachsenden Nahrungsmittelbedarf zu decken. Die reichen Fischgründe scheinen unerschöpflich und sorgen das gesamte Jahr hindurch für volle Netze: So bilden die Meerestiere den Mittelpunkt der elyrischen Küche.
culture.silberberge.desc=Eichen, Tannen und Buchen an steilen Hängen, Bäche und Flüsse in tiefen Schluchten und Klammen, Fingerhut, Farn und bemooste Steine in lichtdurchfluteten Wäldern: Die Silberberge sind ein Idyll und gleichzeitig eine der am schwersten zu erschließenden Regionen im ganzen Königreich. Das bewaldete Mittelgebirge ist nur deswegen überhaupt bewohnt und besitzt eine rudimentäre Infrastruktur, weil es reich an Silber und einigen anderen Ressourcen ist - etwa Salz, Kupfer und Blei. Demzufolge dreht sich auch alles um den Abbau dieser Schätze. Wo immer Höfe, Köhler oder kleinere Weiler zu finden sind, ist garantiert eine Mine in der Nähe, die von ihnen versorgt wird. Die mit Mühe in Stand gehaltenen Wege führen nur bis zum nächsten Erzvorkommen in die Täler. Fast jeder, der hier lebt, arbeitet für eine Mine des Königs, verpachtet an einen der Fürsten, Barone oder Mercatoren.
culture.riesheim.desc=Bis zu 4000 Meter hoch erstrecken sich die Gipfel des Riesheim-Gebirges. Die Osthälfte des Gebirgszuges gehört bereits zu Zwingard und die wenigen gangbaren Pässe sind auf beiden Seiten mit Grenzfestungen gesichert. Dichte Wälder bedecken einen Großteil der Berghänge und stellen die Heimat von Feenwesen und Trollen dar und natürlich den Riesen, die dem Gebirge seinen Namen geben. Weiter oben leben Harpyien und Wyvern. Immer wieder kann man an Hängen und in Tälern auf Ruinen und Krypten aus der Drachlingszeit stoßen.

education.magicartist.descr=Magische Künstler verbinden ihre Fähigkeiten in Schauspiel, Musik oder in den schönen Künsten mit ihrem magischen Talent. Es geht ihnen nicht darum, mit ein paar Zaubertricks Arbeit zu sparen. Sie verbinden Magie und Kunst zu einer neuen Darstellungsform. Seien es Bildhauer, die ihre Objekte mit faszinierenden Effekten verstärken, Musiker, die mit Illusionen ihre Auftritte bereichern, oder Künstler, die mit ihrer Magie einzigartige Erlebnisse erschaffen.
education.keeperOfGardens.descr=Künstler, bei denen mehr ihre Werke als sie selbst im Vordergrund stehen, sind die Hüter der Gärten. In Ultia wird sehr großer Wert auf eine ausgefallene Gartenarchitektur gelegt und die Ansprüche der Kundschaft gehen dabei weit über die eigentliche Pflege hinaus: Ein Garten muss Eindruck schinden mit fast unmöglicher Architektur, exotischen Pflanzen und Tieren oder besonders gerne mit magischen Effekten, die Besucher verzücken. Manche Hüter erarbeiten über Jahre ihr persönliches Gartenkunstwerk oder ziehen, von einem einflussreichen Mäzen gefördert, durch allerlei Länder, immer auf der Suche nach den richtigen Pflanzen und Tieren.
education.shadowPlayer.descr=Die Schattenspieler sind an der ganzen Smaragdküste, aber insbesondere auf den Stromlandinseln, beliebte Künstler. Mit kunstvoll gestalteten Schattenspielfiguren und magischen Effekten ziehen sie ihr Publikum in den Bann. Sie erzählen alte Legenden, aber auch aktuelle Geschehnisse, und haben einen beachtlichen Einfluss auf ihre Zuschauer. Manch eine Schattenspielerin nutzt ihre Kunst und ihre Beliebtheit, um die Mächtigen zu kritisieren und auch das Volk an seine Schwächen zu erinnern. Solch spektakuläre Vorstellungen haben es auch schon an die Höfe diverser Herrscherhäuser geschafft und sind zurzeit in Ultia sehr beliebt. Theatervorstellungen neigen in Patalis dazu, zu einer wilden Mischung von Schauspielkunst, Laienspiel und Gladiatorenkampf zu werden.
education.theaterFencer.descr=Theaterfechter sind gut ausgebildete Schauspieler und häufig Publikumslieblinge, die ihre Zuschauer zu begeistern wissen. Sie werden für spektakuläre Gefechte und akrobatische Auftritte eingesetzt. Doch einige von ihnen sind in erster Linie eines: Meuchelmörder. Während des Spektakels der Mitmachtheater kommt es immer mal wieder zu tödlichen Unfällen oder unglücklich endenden Schauduellen. Manche Theaterfechter werden angeheuert, um Nebenbuhler oder geschäftliche Konkurrenten aus dem Weg zu räumen. Ein Zuschauer kann es sich kaum leisten, eine Einladung auf die Bühne abzulehnen, ohne dabei das Gesicht zu verlieren. Und auf einer patalischen Theaterbühne kann alles passieren.

education.spy.descr=An vielen Herrscherhöfen scheint es nur so von Spionen zu wimmeln, sind doch Informationen und Einfluss die wichtigsten Waffen im Spiel der Mächte. Spione können im Dienste eines fremden Landes, eines regionalen Fürsten oder einer einflussreichen Gruppe stehen. Einige Meisterspione arbeiten aber auch auf eigene Rechnung und suchen sich für ihre Informationen einen Kunden: Ein einträgliches, aber auch sehr gefährliches Spiel. Spione treten in verschiedenen Rollen auf, einige sogar im wörtlichen Sinne. Sie können gut in die örtlichen Strukturen eingebettet sein und als Höfling kokettieren oder als unscheinbarer Schreiber Geheimnisse sammeln. Einige sind hingegen darauf spezialisiert, in gut gesicherte Orte einzudringen und Informationen oder Gegenstände zu stehlen. 
education.commercialAgent.descr=Handelsagenten unterscheiden sich von vielen anderen Spionen dadurch, dass sie meist offen auftreten. Sie verlassen sich eher auf den Schutz durch die Macht und das Vermögen ihres Auftraggebers als auf Heimlichkeit. Auf der Suche nach besonderen Gütern reisen Handelsagenten durchs ganze Land und manchmal sogar in die Ferne. Um die Wünsche ihrer Auftraggeber zu erfüllen oder Konkurrenten auszutricksen, sind sie oft zu skrupellosen Methoden bereit. Ein nicht ungefährliches Leben.
education.minstrelKing.descr=Einige wandernde Barden, die in Midstad durch das Land ziehen und  Volk wie Adel gleichermaßen unterhalten, werden als Spielmänner des Königs bezeichnet. Sie genießen besondere Rechte und können frei durchs ganze Land reisen - wobei solche Garantien in einem Land wie Midstad nicht viel wert sind und sich die Spielmänner regelmäßig gegen Räuber, geldgierige Wachleute und humorlose Ritter zur Wehr setzen müssen. Zudem gibt es einige unter diesen Spielleuten, die zwar einem König, aber nicht Finn von Harreburg dienen. Unter der strengen Führung des Silberprinzen schickt Patalis diese Spione ins Nachbarland, um über die Lage dort informiert zu bleiben und sich einen gewissen Einfluss auf das Volk zu sichern.
education.privyCouncilor.descr=Jeder Fürst, und neuerdings auch viele Handelsherren, benötigt jemanden, der sich um schwierige, manchmal sogar illegale Dinge kümmert. Ein Geheimrat bleibt gerne im Hintergrund, ist aber häufig die mächtigste Person nach dem Adligen. Er kennt viele Geheimnisse seiner Herrschaften, berät sie in delikaten Angelegenheiten und übernimmt im Notfall auch die Drecksarbeit. Die Aufgaben eines Geheimrats können sehr unterschiedlich ausfallen: Einige müssen nur dafür sorgen, dass ihr Herr jederzeit mit ausreichend Muschelschnaps versorgt ist, während andere sich im wahrsten Sinne um die Leichen im Keller kümmern.

education.elucator.descr=Die Elucatoren bilden eine eigene Gruppe innerhalb der Löwenschildgarde von Ultia und werden erheblich besser ausgebildet als simplen Gardisten: Sie lernen Lesen und Schreiben, Gesetzeskunde, Erkenntnismagie und die Kunst des heimlichen Beschattens. Sie sind den Hauptleuten gleichgestellt und können den einfachen Stadtwachen Befehle erteilen, dabei hegen sie diesen gegenüber nicht selten einen gewissen Dünkel.\n\nSiehe auch Regelwerk "Banden und Orden" (S. 65)
education.gladiator.descr=Gladiatoren sind Krieger, die auf Kämpfe gegen einen Gegner oder in kleinen Gruppen spezialisiert sind. Für sie sind ein guter Auftritt und die Gunst des Publikums fast noch wichtiger als eine ausgefeilte Kampftechnik. Ihr Ruhm, aber auch die Auswahl der Kämpfe und damit ihr Überleben hängen ebenso von ihrer Beliebtheit wie von ihren Fähigkeiten ab.
education.iliensiWalker.descr=Von dem ältesten Kind einer Familie wird bei den Iliensi-Gnomen von Elyrea erwartet, dass es sich auf die Wanderung macht. Die jungen Gnome ziehen durch das Gebirge, um einen geeigneten Partner zu finden und mit nach Hause zu bringen - und um in einer Vision das Ziel ihres eigenen Lebens zu erkennen. In seltenen Fällen kann die Suche nach dieser Vision einen Iliensi über die Grenzen Elyreas oder sogar über Dragorea hinausführen. Die Gnome verstehen die Bedeutung dieser Reise, doch gelten Gnome, die die Insel verlassen, als Sonderlinge. Oft wird der Wandernde dabei von ein oder zwei Lieblinsziegen begleitet.
education.moonCourier.descr=Mondboten sind Luseria-Priester und -Priesterinnen, die nicht einem bestimmten Tempel verpflichtet sind, sondern im Dienste der Göttin durchs Land reisen. Dabei ziehen sie weniger predigend durch die Straßen, als dass sie ihren Kult bei allerlei Anlässen repräsentieren. Zudem ist es nahezu ein Muss bei vielen patalischen Feiern, die Luseria-Priesterschaft einzuladen. So finden sich Mondboten bei Dorffesten, bei Schiffstaufen und vielen Veranstaltungen an den Herrscherhöfen, auch weit über die Grenzen des Landes hinaus. 
education.orderJudge.descr=Hoch angesehene und mit den Gesetzestexten vertraute Vordanpriester finden ihre Berufung als Ordensrichter. Besonders wichtig sind sie beim Orden der Drei Rosen auf Elyrea, doch auch viele Rechtsgelehrte in Patalis sind Mitglieder eines Vordanordens und legen die Gesetzte des Königreichs aus. Die Anhänger von Vordan dem Gerechten gelten weithin als unbestechlich und werden meistens geschätzt, manchmal aber auch gefürchtet.

education.prospector.descr=Silber, aber auch andere Bodenschätze, haben in Patalis eine zentrale Bedeutung. Über die Rechte zur Ausbeutung dieser Vorhaben wird am Hof von Ultia mit allen Mitteln gefochten. Doch die Minen liegen häufig in den abgelegenen Gegenden im Riesheim oder in den Silberbergen. Prospektoren sind besonders ausgebildete Kundschafter, die oft alleine oder in kleinen Trupps durch die Wildnis ziehen und nach neuen Vorkommen oder besseren Transportwegen suchen. \n\nSiehe auch Regelwerk "Arkuri und Süd-Arkuri" (S. 35)
education.knightSwords.descr=Die Ritter der Schwerter vor dem Schwarzen Holz haben ihren Ordenssitz in Tarazzo. Von dort aus kämpfen die vordantreuen Recken gegen bösartige Feenwesen und andere Bedrohungen, die aus dem Silvetus hervorkommen. Dieser Orden trainiert neben den ritterlichen Fähigkeiten besonders das magische Handwerk, und seine Mitglieder wissen sich gegen magische Beeinflussen zu erwehren. 
education.knightVordanBlood.descr=Der Orden der Ritter von Vordans Blut besteht überwiegend aus Laien und legt großen Wert auf die physische Fitness und Schlagkraft seiner Mitglieder. Sie sehen sich als Auserwählte Vordans, deren Aufgabe es ist, die Bestien dieser Welt zu bekämpfen. Sie sind ein gern gesehener Anblick, wenn Bauern sich vor einem Monster fürchten, und die Streiterinnen und Streiter sind immer bereit, sich in Gefahr zu begeben. Manche Gläubigen jedoch sehen ihre rauen Initialisierungssitten kritisch und empfinden ihre Rituale als blutrüstig oder halten die Ritter schlichtweg für zu ruhmessüchtig.
education.silverring.descr=Der patalische Kanzler Severos unterhält ein umfangreiches Netzwerk von Spionen und Informanten. Diese Männer und Frauen dienen im Geheimen als Silberringe dem patalischen Königshaus. Sie sammeln Informationen über fremde Länder und entreißen Adligen, Händlern und Gesandten ihre Geheimnisse, sodass der Silberprinz sie unter Druck setzen kann. Während die meisten Silberringe nur im Hintergrund arbeiten und selbst wiederum Informanten beschäftigen, führen besonders begabte unter ihnen gefährliche Aufträge für die Krone aus. \n\nSiehe auch Regelwerk "Banden und Orden" (S. 101)
education.silvershadow.descr=Die Dienerschaft der Mondgöttin wird oft mit verschwenderischen Festen in Verbindung gebracht. In Patalis gilt Luseria aber auch als Göttin der Macht und ihre Priesterschaft ist ein Teil des ewigen Ringens um Einfluss am Hof. So ist es kein Wunder, dass die Kirche in Ultia einen Orden unterhält, dessen Priester und Priesterinnen sich auf das Beschaffen und den Handel mit Geheimnissen spezialisiert haben. Diese Silberschatten treten nicht offen in Erscheinung, doch befinden sie sich stets im Zentrum des Geschehens und sorgen dafür, dass ihr Kult seinen Einfluss behält - oft werden sie auch in die Ferne geschickt, um Wissen zu erlangen, das der Kirche Luserias nutzt. \n\nSiehe auch Regelwerk "Die Götter" (S. 110)
education.vordanshield.descr=Die Ritter des Ordens der Drei Rosen beschützen die Insel Elyrea, doch gibt es auch Priester, die das Wort und den Geist von Vordan dem Gerechten in der Ferne verbreiten. Diese schwer gerüsteten Streiter leben in strenger Askese und immer im Dienste der Gerechtigkeit - sehr zur Freude der Landbevölkerung, der sie helfen, wann immer sie können. Aber nicht überall wird ihr Auftreten geschätzt, insbesondere vom Adel und Klerus jenseits der Insel wird es als störend wahrgenommen. Dennoch wird einen Schild Vordans nichts von seinem Weg abbringen, egal, wie widrig die Umstände auch sein mögen.  \n\nSiehe auch Regelwerk "Die Götter" (S. 110)

