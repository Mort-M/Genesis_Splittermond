material.SilverShimmerFabric.effect=Ein Satz Silberschimmergewänder schimmert im Dunklen und beleuchtet seine Umgebung (Lichtstufe -2, 3m), der Träger erhält einen Malus von-1 auf Wahrnehmung-Proben (Sehen). Das Licht sorgt für einen leicht negativen Umstand, wenn der Abenteurer versucht zu schleichen.
