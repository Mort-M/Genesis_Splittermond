education.beastguardian.descr=Die kleinere Gruppe (auch als Bestienwächter bekannt) sind jene, die sich ausschließlich dem Schutz der von Aand berührten Wesen verschrieben haben. Das sind bisweilen Caiyus, besondere Waldbruten oder heilige Seelen, aber stets hat auch der aktuelle Hochkönig Mitglieder der Sonnengarde zu seinem Schutz.
education.fireinvestigator.descr=Die breitgefächerte Ausbildung der Brandwehr ermöglicht ein breites Spektrum möglicher Abenteurer. Üblicherweise sind es vor allem Ermittlungsarbeit und Verbrechensbekämpfung, die für Spielercharaktere in Frage kommen, da hier spannende und abwechslungsreiche Abenteuer gestaltet werden können, während die Brandbekämpfung als Hauptfokus wohl eher selten stattfindet. Ermittelnden Gardisten steht die Wahl ihrer Mittel in der Regel frei und so ist auch der Zusammenschluss mit Ortsfremden zu einer temporären Abenteurergruppe nicht ungewöhnlich. Außerhalb der Stadt gelangt ein aktives Mitglied der Brandwehr hingegen nur mit gutem Grund, schließlich hat es Verpflichtungen zu erfüllen. Ein ehemaliges Wirken in der Brandwehr kann als Hintergrundgeschichte eines Abenteurers dienen, der die Garde verlässt, um einen Verbrecher zu verfolgen, oder weil er bei einem Brand schwere Verletzungen erlitt und woanders ein neues Leben beginnen will.
education.warriorgemmedal.descr=Ein Ordenskrieger verlässt Turubar im Normalfall während der Handelsreisen in benachbarte Shahirate und befindet sich selten einmal außerhalb Farukans - es sei denn, er wurde auf eine wichtige Mission entsandt, wie neue Handelskontakte zu knüpfen. Ein Krieger des Edelstein-Ordens ist ein Ausbund an Würde, Demut und Harmonie. Er stellt sich nicht in den Vordergrund, wäre aber bereit, für seine Gefährten zu sterben, da Gemeinschaft und Zusammenhalt einen großen Stellenwert für ihn haben. Als Turubari findet er es nicht abwegig oder prahlerisch, sich mit Edelsteinen zu schmücken - würde das im Dienst jedoch nicht tun, da es unpraktisch ist, mit viel Schmuck zu kämpfen. Ordenskrieger sind sorgsam in ihrer Wortwahl und kennen sich bestens mit den Edelstein-Gesetzen Turubars aus. Sie wissen sich zwar jeder Gesellschaft anzupassen, schlagen aber selten über die Strenge und geben sich nicht maßlos dem Wein oder anderen Genussmitteln hin. Bei Fremden lösen sie meist ein unangenehmes Bild der gelebten Perfektion aus, die nicht wenige auch anstreben: Schließlich sind sie der verlängerte Arm oder die Schwinge - des Shahirs und müssen seinen Erwartungen gerecht werden, so gut sie es als einfache Sterbliche eben können.
education.midstadirregulars.descr=Oberflächlich wirken Freischärler wie einfache Räuber oder Schmuggler. Dennoch eint sie der Kampf gegen den Tyrannen Finn von Harreburg - sie lehnen sich gegen die ungerechte Herrschaft auf und wünschen sich eine bessere Zukunft für ihre Kinder. Fast jeder von ihnen hat alles verloren und musste sich sein Leben aus dem Nichts wieder aufbauen, und so leben sie oft in den Tag hinein. Hinzu kommt, dass man eng zusammenhalten muss, wenn man als Freischärler überleben will, sodass sie meist sehr loyal zu ihren Gefährten sind. Die Notwendigkeit, die Zelte immer wieder abbrechen zu müssen, hat außerdem dazu geführt, dass sie sich leicht von Besitztümern oder gar der Heimat trennen können. In die Welt mag ein Freischärler ausziehen, wenn seine Zugehörigkeit zu den Widerständlern zu bekannt geworden ist und er glaubt, dass er die Seinen in Gefahr bringt, wenn er daheim bleibt. Auch in diesem Fall wird er aber vermutlich gegen jede Ungerechtigkeit zu Felde ziehen und sich seinen Gerechtigkeitssinn bewahren.
education.kamemate.descr=Einen Perlmuttgardisten der Kame Ma Te zu spielen bedeutet, einen aufmerksamen, leicht merkwürdigen Ermittler zu verkörpern, der mit allen Wassern gewaschen und hart im Nehmen ist. Er hat schon während der Ausbildung viele fremdartige Verbrechen und furchtbare Tatorte untersucht und ist daher recht abgebrüht. Er denkt oft nicht geradlinig, sondern versucht von allen Seiten an Probleme und Hindernisse heranzutreten und ist dabei stets offen für Neues und wissbegierig. Es kommt mitunter vor das ein Kame Ma Te sich einer Abenteuergruppe anschließt, um etwas von der Welt zu sehen und Wissen über fremde Kulturen und Länder zu sammeln. Dabei wird er immer eine Art Reisetagebuch führen, was er der Perlmuttgarde übergeben kann, um deren Wissen über die vielen fremden Reisenden, die auf die Inseln gelangen, zu erweitern. Ebenso ist es denkbar, dass ein Mitglied der Kame Ma Te sich mächtige Feinde gemacht und man ihm ein Verbrechen angehängt hat, was ihn vorerst aus der Heimat fliehen lässt. Generell schätzt ein Mitglied der Kame Ma Te die Arbeit in einer Gruppe und beschützt diese, wenn er einmal Vertrauen gefasst hat, wie seine eigene Familie.
education.elucator.descr=Wenn Sie ein Mitglied der Löwenschildgarde spielen wollen, müssen Sie sich zunächst überlegen, ob es sich um ein noch aktives Mitglied handelt. In dem Fall wäre der Einsatzort des Gardisten in der Regel auf die Stadt selbst beschränkt und eine solche Variante bietet sich daher vermutlich nur an, wenn Sie mit ihrer ganzen Gruppe beschließen, die Stadt Ultia und ihre Garde in den Mittelpunkt Ihrer Abenteuer zu stellen. Als ehemaliges, freigestelltes oder inaktives Mitglied der Löwenschildgarde kann Ihr Abenteurer aber problemlos Teil einer gewöhnlichen Abenteurergruppe werden. Es gibt einige Gardisten, die - desillusioniert von korrupten Kollegen und der unwilligen Führung - die Garde verlassen und sich ein anderes Betätigungsfeld suchen. Gerade die Elucatoren sind aufgrund ihrer Ermittlungsfähigkeiten auch für andere Auftraggeber gefragte Experten.
education.panyemaa.descr=Ein Pan-Yemaa, der zum Abenteurer geworden ist, gehört vermutlich zu denjenigen, die die Bande verlassen haben, weil sie schlicht zu alt geworden sind - oder die Hals über Kopf fliehen mussten, als die Grüne Dame sinistere Pläne für sie heckte. Anfangs ist er sicherlich misstrauisch, aber seine Sehnsucht nach einer Gemeinschaft und einem Zugehörigkeitsgefühl kann schon bald aus ihm einen zuverlässigen Gefährten machen, wenn man denn über die gelegentlichen Diebstähle hinwegsehen kann, die er sicherlich auch weiterhin begehen wird.
education.silverring.descr=Ein Silberring hat einen direkten Draht zur Kanzlei, wenn nicht sogar zu Severos selbst. Von dort bekommt er operative Ziele zugewiesen und gegebenenfalls Mittel zur Verfügung gestellt. Nicht selten führen ihn seine Aufträge um die halbe Welt, und er tut gut daran, sich einer Reisegruppe anzuschließen, die sich nicht sonderlich daran stört, wenn er sie bittet, ihn "aus diplomatischen Gründen auf einen kleinen Umweg in den Rattwald zu begleiten und dort, wenn möglich, Risskir eine Nachricht zu übermitteln". Silberringe treten oft als reiche Taugenichtse, als Lebedamen, als spendable Abenteurer oder als Weltreisende auf, und nicht selten sind sie es auch. In allen diesen Erscheinungsformen eignen sie sich sehr gut, um sich bereits bestehenden Abenteurergruppen anzuschließen und diese ein Stück des Weges zu begleiten. Ebenso ist es denkbar, dass ein Silberring gezielt dazu ausgesandt wurde, um seine Reisegefährten zu überwachen, oder dass es sich bei ihm um einen in Ungnade gefallenen Silberring handelt, der in die Welt hinauszieht, um in Bewegung zu bleiben, da seine ehemaligen Kollegen ihn sonst früher oder später aufspüren würden.
education.triadfighter.descr=Jedes Triadenmitglied ist stolz auf seine Mitgliedschaft in der Gemeinschaft, und auch wenn ihm viel abverlangt wird und er Befehle ohne zu Fragen ausführen muss, so mindert dies nicht sein Gefühl, Teil etwas Großen zu sein. Gegenüber der einfachen Bevölkerung wird er mit seinen Tätowierungen und der traditionellen Kleidung immer auf seinen Status hinweisen und selbst gegenüber der Obrigkeit zeigt er sich mitunter arrogant, da er sich oft unangreifbar fühlt. Natürlich gibt es immer wieder Mitglieder, die in Ungnade fallen oder durch Loyalitätskonflikte sich zum Verlassen der Triade entschließen. In der Regel suchen sie sich eine neue Gemeinschaft mit eindeutigen Regeln und einer klaren Hierarchie. Ihre Tätowierungen verbergen sie in diesem Fall so gut es eben geht, da sie nun nicht mehr den Schutz ihrer alten "Familie" genießen. Solche Mitglieder sind es auch, die am ehesten Palitan und Zhoujiang hinter sich lassen und in der Ferne ihr Glück suchen, wobei ihnen ihre Affinität für das Arbeiten in einer Gruppe, ihre Kampfkünste und eine pragmatische Rücksichtslosigkeit zu Gute kommen. Gleichzeitig sind sie einer Gemeinschaft treu ergeben, was für Abenteurergruppen ein nicht zu unterschätzender Vorteil ist.