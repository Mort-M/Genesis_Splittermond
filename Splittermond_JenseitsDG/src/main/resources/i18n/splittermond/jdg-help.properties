mastership.arcanelore.orientOtherworld1.desc=Der Abenteurer \uFB01ndet sich in der Welt der Feen besser zurecht als normale Sterbliche. Er erhält einen Bonus in Höhe von 3 Punkten auf Proben zur Wildnisführung in den Feenwelten.
mastership.arcanelore.fairylore1.desc= Der Abenteurer kennt sich gut mit Feenwesen aus. Er erhält einen Bonus in Höhe von 2 Punkten auf Entschlossenheit, Wahrnehmung und Zähigkeit im Umgang mit Wesen des Typus Feenwesen oder Feenwerk.
mastership.arcanelore.orientOtherworld2.desc=Der Bonus aus Anderswelt-Orientierung I erhöht sich auf 6 Punkte.
mastership.arcanelore.fairylore2.desc=Der Bonus aus Feenkunde I erhöht sich auf 4 Punkte.
mastership.arcanelore.senseattribute.desc=Der Abenteurer kann nach einem Aufenthalt von mindestens 10 Minuten mit einer einmalig erlaubten gelungenen Arkane Kunde-Probe gegen 30 ein Merkmal der Feenwelt bestimmen, in der er sich aktuell be\uFB01ndet.
mastership.diplomacy.fairytongue.desc=Der Abenteurer weiß, wie er mit Feenwesen umgehen muss. Die Einstellung von Wesen des Typus Feenwesen gegenüber dem Abenteurer ist stets eine Stufe besser, als es sonst der Fall wäre (bis maximal hilfsbereit).
mastership.empathy.fairysense1.desc=Der Abenteurer hat ein Gespür für die Stimmung von Feenwesen. Er erhält einen Bonus in Höhe von 2 Punkten auf Empathie, Diplomatie und Redegewandtheit im Umgang mit Wesen des Typus Feenwesen oder Feenwerk.
mastership.empathy.fairysense2.desc= Der Bonus aus Feengespür I erhöht sich auf 4 Punkte.
mastership.craftmanship.fairycrafter.desc=Wenn der Handwerker feeisches Material bei der Herstellung verwendet (oder solche Gegenstände repariert), zählt dies bei der Probe als stark positiver Umstand.
mastership.perception.senseveil.desc= Der Abenteurer hat einen Blick für die subtilen Unterschiede zwischen Diesseits und Jenseits. Sofern dem Abenteurer eine Probe zustände, um einen Übergang in die Feenwelt, eine feeische Illusion oder Glimmer zu durchschauen, erhält er auf die entsprechende Probe einen Bonus in Höhe von 3 Punkten.
mastership.perception.veilview.desc=Der Abenteurer ist in der Lage, hinter die Maske eines abgelenkten Wesens des Typus Feenwesen zu blicken. Dies erfordert eine kontinuierliche Aktion von 5 Ticks Dauer und eine Wahrnehmung-Probe gegen den Geistigen Widerstand des Feenwesens. Die Probe erhält einen Malus in Höhe der doppelten Stufe des Glimmers (siehe S. 13), in der Feenwelt außerdem zusätzlich einen Malus in Höhe der doppelten Fremdartigkeit (siehe S. 38). Die Stärke Feensinn gewährt einen Bonus in Höhe von 6 Punkten. Bei Gelingen erhält der Betrachter einen kurzen Blick auf das wahre Aussehen des Feenwesens. Dadurch ist er in der Lage, sich auf das Wesen einzustimmen, sodass dieses einen Malus in Höhe von 1 Punkt (+ 1 pro Erfolgsgrad) auf seine nächste Aktion gegen den Betrachter erhält. Die Probe kann erst wiederholt werden, wenn ein eventueller vorheriger Malus angewendet wurde. Ein herausragender Erfolg erlaubt dem Beobachter zudem, eine Vision des eigentlichen Wesenskerns der Fee zu erhaschen, wodurch er unter anderem erfährt, welche Auswirkungen ein Glimmerbruch bei ihr hätte. Je nach Spielleiterentscheid kann er auch weitere Informationen, zum Beispiel über die Motivationen und Ziele der Fee oder, so vorhanden, über deren Wahren Namen erhalten.
mastership.motionmagic.fastotherworld.desc=Die Geschwindigkeit des Abenteurers erhöht sich um 2 Punkte, sofern er sich in der Anderswelt be\uFB01ndet
mastership.illusionmagic.fairysignature.desc=Sollte der Versuch unternommen werden, Illusionszauber des Abenteurers zu identi\uFB01zieren, sind mindestens 2 EG nötig, um eindeutig sagen zu können, dass es sich nicht um feeische Magie handelt.
mastership.combatmagic.fairyfoe1.desc=Der Abenteurer hat gelernt, Feenwesen besonders gut zu bekämpfen. Er erhält auf alle gegen einen Widerstandswert gerichteten Zauber einen Bonus in Höhe von 2 Punkten, wenn er diesen gegen ein Wesen des Typus Feenwesen einsetzt.
mastership.combatmagic.fairyfoe2.desc= Alle Zauber des Abenteurers, die Schaden verursachen, verursachen an Wesen des Typus Feenwesen 2 zusätzliche Punkte Schaden.

spell.banishfairies.descr=Der Zauberer erscha\uFB00t einen Schutzkreis von 3 Metern Radius. Wesen des Typus Feenwesen können den Kreis nur betreten, wenn ihnen eine Probe auf Entschlossenheit gegen 25 gelingt. Sie können aber mit Fernwa\uFB00en oder Zaubern in den Kreis einwirken. Wesen des Typus Feenwesen, die sich bei Auslösen des Zaubers in 3 Metern Umkreis um den Zauberer be\uFB01nden, werden bei Misslingen der Probe vom Zauber nach außen gedrängt.
spell.banishfairies.enhancedescr= Die Schwierigkeit für die Entschlossenheit-Probe erhöht sich auf 30.
spell.fairysight.descr=Wenn der Zauberer mit der Meisterschaft Blick hinter die Maske einen Glimmer erfolgreich durchschaut, erhält er automatisch einen zusätzlichen Erfolgsgrad. Außerdem erhält er einen Bonus in Höhe von 2 Punkten auf Proben, um sich in der Feenwelt zu orientieren und um dünne Stellen zur Magischen Domäne zu finden.
spell.fairysight.enhancedescr=Der Bonus erhöht sich auf 4 Punkte.
spell.protectfairies.descr=Der Zauberer erhält einen Bonus in Höhe von jeweils 2 Punkten auf seine Widerstandswerte gegen Wesen des Typus Feenwesen.
spell.protectfairies.enhancedescr=Der Bonus erhöht sich auf 3 Punkte.